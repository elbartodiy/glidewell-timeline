name: Update events board

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 expo/tools/fetch_events.py
      - name: Commit if changed
        run: |
          if git diff --quiet expo/data/events.json; then
            echo "schedule unchanged"
          else
            git config user.name  "glidewell-bot"
            git config user.email "actions@github.com"
            git add expo/data/events.json
            git commit -m "Board: course schedule $(date -u +%F)"
            git push
          fi
