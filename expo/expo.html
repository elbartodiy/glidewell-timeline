    for (let i = 1; i < 4; i++){
      if (ang[i] < ang[iA]) iA = i;
      if (ang[i] > ang[iB]) iB = i;
    }
    const beam = ctx.createLinearGradient(lx, ly, sx, sy);
    beam.addColorStop(0, `rgba(255,246,222,${(0.20 * lamp).toFixed(3)})`);
    beam.addColorStop(1, 'rgba(255,246,222,0.015)');
    ctx.fillStyle = beam;
    const nrm = Math.hypot(sx - lx, sy - ly) || 1;
    const ox2 = -(sy - ly) / nrm * 5 * kp * SS, oy2 = (sx - lx) / nrm * 5 * kp * SS;
    ctx.beginPath();
    ctx.moveTo(lx + ox2, ly + oy2);
    ctx.lineTo(lx - ox2, ly - oy2);
    ctx.lineTo(corners[iA][0], corners[iA][1]);
    ctx.lineTo(corners[iB][0], corners[iB][1]);
    ctx.closePath(); ctx.fill();
    // motes turning in the beam
    for (let i = 0; i < 14; i++){
      const u = ((i * 0.137 + t * 0.05) % 1);
      const bx = mxp + (sx - mxp) * u + Math.sin(t * 0.7 + i) * 12 * SS * u;
      const by = (myp - bh * 0.45) + (sy - (myp - bh * 0.45)) * u + Math.cos(t * 0.5 + i * 2) * 9 * SS * u;
      ctx.fillStyle = `rgba(255,248,228,${(0.06 + 0.05 * Math.sin(t * 2 + i)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, by, (0.9 + 0.8 * u) * SS, 0, 7); ctx.fill();
    }

    // 2 — the picture is assembled on its own transparent sheet and then ADDED
    //     to the wall. Feathering it in place would erase the masonry with it
    //     and read as a dark border round the frame — light never does that.
    const gx0 = sx - vw / 2 + wx2, gy0 = sy - vh / 2 + wy2;
    const key = 0.018 * vw;   // the machine sits below its picture: top edge wider
    const ow = Math.max(8, Math.ceil(vw + key * 2)), oh = Math.max(8, Math.ceil(vh));
    if (!p.off || p.off.width !== ow || p.off.height !== oh){
      p.off = document.createElement('canvas'); p.off.width = ow; p.off.height = oh;
      p.og = p.off.getContext('2d');
    }
    const g2 = p.og;
    g2.clearRect(0, 0, ow, oh);
    // a lit rectangle even where the reel is black — the lamp is always on
    g2.fillStyle = `rgba(52,47,38,${(0.60 * lamp).toFixed(3)})`;
    g2.fillRect(0, 0, ow, oh);
    if (live){
      const sw0 = p.v.videoWidth || 1280, sh0 = p.v.videoHeight || 720;
      g2.globalAlpha = 0.95 * lamp;
      g2.drawImage(p.v, sw0 * c0.x0, 0, sw0 * (c0.x1 - c0.x0), sh0, 0, 0, ow, oh);
      g2.globalAlpha = 1;
    }
    // hot centre, falling away the way a lens actually throws
    const hot = g2.createRadialGradient(ow/2, oh*0.44, oh*0.12, ow/2, oh*0.5, ow*0.72);
    hot.addColorStop(0, `rgba(255,250,235,${(0.10 * lamp).toFixed(3)})`);
    hot.addColorStop(1, 'rgba(255,250,235,0)');
    g2.fillStyle = hot; g2.fillRect(0, 0, ow, oh);
    // the edges run out into transparency ON THE SHEET, where erasing is free
    g2.save();
    g2.globalCompositeOperation = 'destination-out';
    const F = Math.max(2, 11 * kk * SS);
    for (const [ex, ey, ew, eh, vert, near] of [
      [0, 0, ow, F, 1, 1], [0, oh - F, ow, F, 1, 0],
      [0, 0, F, oh, 0, 1], [ow - F, 0, F, oh, 0, 0]]){
      const g = vert ? g2.createLinearGradient(0, ey, 0, ey + eh)
                     : g2.createLinearGradient(ex, 0, ex + ew, 0);
      g.addColorStop(0, `rgba(0,0,0,${near})`); g.addColorStop(1, `rgba(0,0,0,${1 - near})`);
      g2.fillStyle = g; g2.fillRect(ex, ey, ew, eh);
    }
    g2.restore();
    if (p.ground){
      /* A projected picture on a LIGHT wall cannot be added and still be seen;
         it needs something dark underneath. Anything drawn by hand around it
         reads as a frame — which is what you were seeing. So the ground is the
         picture's own silhouette: same canvas, same feather, no edge anywhere
         for the eye to find. */
      if (!p.gnd || p.gnd.width !== ow || p.gnd.height !== oh){
        p.gnd = document.createElement('canvas');
        p.gnd.width = ow; p.gnd.height = oh;
        const g3 = p.gnd.getContext('2d');
        g3.fillStyle = '#12171c'; g3.fillRect(0, 0, ow, oh);
        g3.globalCompositeOperation = 'destination-out';
        const F2 = Math.max(2, 11 * kk * SS);
        for (const [ex, ey, ew, eh, vert, nr] of [
          [0, 0, ow, F2, 1, 1], [0, oh - F2, ow, F2, 1, 0],
          [0, 0, F2, oh, 0, 1], [ow - F2, 0, F2, oh, 0, 0]]){
          const gg = vert ? g3.createLinearGradient(0, ey, 0, ey + eh)
                          : g3.createLinearGradient(ex, 0, ex + ew, 0);
          gg.addColorStop(0, `rgba(0,0,0,${nr})`); gg.addColorStop(1, `rgba(0,0,0,${1 - nr})`);
          g3.fillStyle = gg; g3.fillRect(ex, ey, ew, eh);
        }
      }
      // only when there is a picture to sit under. A lamp with no film in the
      // gate throws a warm empty rectangle; it does not throw darkness.
      if (live) ctx.drawImage(p.gnd, gx0 - key, gy0);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(p.off, gx0 - key, gy0);
    ctx.restore();

    // 4 — halation: the wall around the frame catches the spill
    const spill = ctx.createRadialGradient(sx, sy, vh * 0.4, sx, sy, vw * 0.95);
    spill.addColorStop(0, `rgba(255,244,214,${(0.055 * lamp).toFixed(3)})`);
    spill.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = spill; ctx.fillRect(sx - vw, sy - vh, vw * 2, vh * 2);

    ctx.restore();

    pushHit(sx - vw / 2, sy - vh / 2, vw, vh,
            p.clip ? {type: 'clip', media: p.clip, wx: p.x}
                   : {type: 'focus', beat: nearestBeat(p.x).i, anchor: p.x});
  }
}
/* the machine stands ON the bench, so it is painted after it — while the
   picture it throws was painted before, and the bench crops it the way a real
   counter crops a projection that falls behind it */
function projMachine(p, t, lamp, mxp, myp, bw, bh, kp){
  contactShadow(mxp, p.stand ? py(1080, kp) : myp, bw * 1.1, 0.34);
  ctx.save();
  if (p.stand){
    // it stands on the floor beside the whole composition, not on a worktop
    const fy = py(1080, kp);
    const sg = ctx.createLinearGradient(mxp - 9 * kp * SS, 0, mxp + 9 * kp * SS, 0);
    sg.addColorStop(0, '#23211e'); sg.addColorStop(0.4, '#585349'); sg.addColorStop(1, '#1c1a17');
    ctx.fillStyle = sg;
    ctx.fillRect(mxp - 9 * kp * SS, myp, 18 * kp * SS, fy - myp);
    ctx.fillStyle = 'rgba(26,24,21,0.9)';
    ctx.beginPath(); ctx.ellipse(mxp, fy, 46 * kp * SS, 12 * kp * SS, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#2b2723';
  ctx.beginPath(); ctx.roundRect(mxp - bw / 2, myp - bh, bw, bh, 5 * kp * SS); ctx.fill();
  ctx.fillStyle = '#43403a';
  ctx.fillRect(mxp - bw * 0.42, myp - bh * 0.92, bw * 0.84, bh * 0.16);
  for (const s of [-1, 1]){
    ctx.strokeStyle = 'rgba(190,186,176,0.75)'; ctx.lineWidth = 2 * kp * SS;
    ctx.beginPath(); ctx.arc(mxp + s * bw * 0.26, myp - bh * 1.30, bw * 0.20, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(30,28,25,0.9)';
    ctx.beginPath(); ctx.arc(mxp + s * bw * 0.26, myp - bh * 1.30, bw * 0.055, 0, 7); ctx.fill();
  }
  drawGlow('255,240,200', mxp, myp - bh * 0.45, 34 * kp * SS, 0.5 * lamp);
  ctx.fillStyle = `rgba(255,246,224,${(0.85 * lamp).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(mxp, myp - bh * 0.45, 5 * kp * SS, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------------- MUSIC ----------------
   One track for the whole hall to begin with. Kept deliberately quiet: this is
   room tone, not a soundtrack, and it must never fight a speaking voice — so it
   ducks hard whenever a clip is playing and idles when nobody is watching.
   Browsers refuse sound before a gesture, so it waits for the first touch. */
const MUSIC = {src: 'audio/mus_hall.m4a', vol: 0.30, duck: 0.18, cur: 0, el: null,
               off: localStorage.getItem('glidewell.music') !== 'on'};   // silent by default: the film is the soundtrack now
/* the master switch: kills ALL sound — film, clips, music — with one tap */
const SOUND = {off: localStorage.getItem('glidewell.sound') === 'off'};
function toggleSound(){
  SOUND.off = !SOUND.off;
  try { localStorage.setItem('glidewell.sound', SOUND.off ? 'off' : 'on'); } catch(e){}
}
function toggleMusic(){
  MUSIC.off = !MUSIC.off;
  try { localStorage.setItem('glidewell.music', MUSIC.off ? 'off' : 'on'); } catch(e){}
  const a = MUSIC.el;
  if (a && !MUSIC.off) a.play().catch(() => {});
}
/* a small mark in the corner, kept quiet: the room should not look like a
   player. It brightens when the pointer is near it and says which state it is
   in by the slash, not by a label. */
function musicMarkBox(){ const s = 22 * SS; return {x: 26 * SS, y: 26 * SS, w: s, h: s}; }
function soundMarkBox(){ const s = 22 * SS; return {x: 68 * SS, y: 26 * SS, w: s, h: s}; }
function markHit(b, pt){
  if (!pt) return false;
  const pad = 10 * SS;
  return pt.x > b.x - pad && pt.x < b.x + b.w + pad &&
         pt.y > b.y - pad && pt.y < b.y + b.h + pad;
}
function musicMarkHit(pt){ return markHit(musicMarkBox(), pt); }
function soundMarkHit(pt){ return markHit(soundMarkBox(), pt); }
function drawMusicMark(){
  const A = Math.max(0.25, state.ruleA);          // they live with the rule
  if (A < 0.03) return;
  const seg = segAt(cam.x);
  ctx.save();
  ctx.lineJoin = 'round';
  // THE NOTE — hall music, off by default (the film carries the sound)
  {
    const b = musicMarkBox();
    const hot = musicMarkHit(Input.hover) ? 1 : 0;
    const a = (MUSIC.off ? 0.30 : 0.42) * A + 0.28 * hot;
    ctx.strokeStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
    ctx.fillStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
    ctx.lineWidth = 1.6 * SS;
    const cx = b.x + b.w * 0.42, cy = b.y + b.h * 0.5, sq = b.h;
    ctx.beginPath();
    ctx.ellipse(cx - sq*0.10, cy + sq*0.26, sq*0.15, sq*0.11, -0.4, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + sq*0.04, cy + sq*0.22); ctx.lineTo(cx + sq*0.04, cy - sq*0.32);
    ctx.quadraticCurveTo(cx + sq*0.26, cy - sq*0.30, cx + sq*0.34, cy - sq*0.12);
    ctx.stroke();
    if (MUSIC.off){
      ctx.beginPath();
      ctx.moveTo(cx - sq*0.34, cy - sq*0.34); ctx.lineTo(cx + sq*0.44, cy + sq*0.40);
      ctx.stroke();
    }
  }
  // THE SPEAKER — the master switch: film, clips and music together
  {
    const b = soundMarkBox();
    const hot = soundMarkHit(Input.hover) ? 1 : 0;
    const a = (SOUND.off ? 0.30 : 0.42) * A + 0.28 * hot;
    ctx.strokeStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
    ctx.fillStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
    ctx.lineWidth = 1.6 * SS;
    const cx = b.x + b.w * 0.34, cy = b.y + b.h * 0.5, sq = b.h;
    ctx.beginPath();
    ctx.moveTo(cx - sq*0.26, cy - sq*0.14);
    ctx.lineTo(cx - sq*0.08, cy - sq*0.14);
    ctx.lineTo(cx + sq*0.16, cy - sq*0.34);
    ctx.lineTo(cx + sq*0.16, cy + sq*0.34);
    ctx.lineTo(cx - sq*0.08, cy + sq*0.14);
    ctx.lineTo(cx - sq*0.26, cy + sq*0.14);
    ctx.closePath(); ctx.fill();
    if (SOUND.off){
      ctx.beginPath();
      ctx.moveTo(cx + sq*0.34, cy - sq*0.22); ctx.lineTo(cx + sq*0.66, cy + sq*0.22);
      ctx.moveTo(cx + sq*0.66, cy - sq*0.22); ctx.lineTo(cx + sq*0.34, cy + sq*0.22);
      ctx.stroke();
    } else {
      for (let i = 1; i <= 2; i++){
        ctx.beginPath();
        ctx.arc(cx + sq*0.20, cy, sq * (0.16 + 0.19 * i), -0.9, 0.9);
        ctx.globalAlpha = 1 - i * 0.28;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}
function initMusic(){
  const a = new Audio(MUSIC.src);
  a.loop = true; a.preload = 'auto'; a.volume = 0;
  MUSIC.el = a;
  const start = () => {
    a.play().catch(() => {});
    window.removeEventListener('pointerdown', start);
    window.removeEventListener('keydown', start);
    window.removeEventListener('wheel', start);
  };
  window.addEventListener('pointerdown', start);
  window.addEventListener('keydown', start);
  window.addEventListener('wheel', start, {passive: true});
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) a.pause(); else a.play().catch(() => {});
  });
}
function updateMusic(dt){
  const a = MUSIC.el; if (!a) return;
  // a speaking voice always wins; the attract loop plays a little lower still
  let want = (MUSIC.off || SOUND.off) ? 0 : MUSIC.vol;
  const voice = state.person && state.person.v;
  const rail = state.study && state.study.railV;
  const speaking = state.clip || (voice && !voice.paused && !voice.muted) ||
        (rail && !rail.paused && !rail.muted);
  if (speaking) want *= MUSIC.duck;
  if (state.mode === 'attract') want *= 0.75;
  want *= 1 - (state.attract.fade || 0);
  MUSIC.cur += (want - MUSIC.cur) * Math.min(1, dt * 2.2);
  a.volume = Math.max(0, Math.min(1, MUSIC.cur));
  // silence costs nothing: a muted track stops decoding
  if (MUSIC.off && MUSIC.cur < 0.01 && !a.paused) a.pause();
}

function initSeamVideo(){
  if (!window.ASSETS || !ASSETS.flyover) return;
  const v = document.createElement('video');
  v.src = ASSETS.flyover; v.muted = true; v.playsInline = true;
  SEAM_VIDEO = v;
}
/* THE CENTURY RULE — a quiet hairline at the foot of the frame answering one
   question: how far along the hundred years are we. Deliberately not a
   scrollbar: no track, no thumb, nothing to grab. It is drawn furniture that
   knows the hall's real structure — each era is its own division in its own
   ink, the breaks are the recreations you actually walk through, every beat
   leaves a tick, and a lit marker rides the rule with the year beside it. It
   bows out whenever the hall has something better to say: the welcome, an open
   reading page, a playing clip, the closing packshot. */
/* the rule wears the era it is standing in: brass under tungsten, pale steel
   through the mail-order years, grey machine-work as the lab goes digital, and
   ice with a lit edge in the white era. Materials, not decoration — the same
   progression the room itself makes. */
const RULE_STYLE = [
  {thumb: '236,212,168', edge: '255,232,190', glow: '255,186,96',  form: 'clamp', tick: 'line'},
  {thumb: '222,220,206', edge: '244,242,232', glow: '255,214,150', form: 'plate', tick: 'line'},
  {thumb: '226,229,228', edge: '246,249,248', glow: '200,228,246', form: 'frame', tick: 'line'},
  {thumb: '242,248,252', edge: '255,255,255', glow: '150,215,255', form: 'glass', tick: 'dot'},
];
function ruleStyle(){ return RULE_STYLE[Math.max(0, Math.min(3, segIdx(cam.x)))]; }

/* Each era holds the line with its own hardware, not merely its own colour:
   a brass clamp filed by hand, a stamped plate on rivets, a selection frame
   borrowed from a screen, and finally a frameless slab of lit glass. */
function drawRuleThumb(mx, y, tw, S, A, warm){
  const h = 18 * SS, top = y - h/2, bot = y + h/2;
  const body = `rgba(${S.thumb},${((0.13 + 0.10 * warm) * A).toFixed(3)})`;
  const edge = `rgba(${S.edge},${((0.55 + 0.35 * warm) * A).toFixed(3)})`;
  const bright = `rgba(${S.edge},${(0.92 * A).toFixed(3)})`;
  ctx.save();
  ctx.lineWidth = 1.6 * SS;
  if (S.form === 'clamp'){
    // filed by hand: a pill with a screw through each jaw
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.roundRect(mx - tw/2, top, tw, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.arc(mx + s * (tw/2 - h*0.42), y, 2.2 * SS, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.35 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + h*0.5, top + 3*SS); ctx.lineTo(mx + tw/2 - h*0.5, top + 3*SS); ctx.stroke();
  } else if (S.form === 'plate'){
    // stamped and riveted: a STRAIGHT plate — square ends, two square heads
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.rect(mx - tw/2, top, tw, h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]) ctx.fillRect(mx + s * (tw/2 - 11*SS) - 1.6*SS, y - 1.6*SS, 3.2*SS, 3.2*SS);
  } else if (S.form === 'frame'){
    // lifted off a screen: corner brackets and a centre notch, nothing else
    ctx.fillStyle = `rgba(${S.thumb},${(0.07 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = edge;
    const L = Math.min(12 * SS, tw * 0.28);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]){
      const cx0 = mx + sx * tw/2, cy0 = y + sy * h/2;
      ctx.beginPath();
      ctx.moveTo(cx0 - sx * L, cy0); ctx.lineTo(cx0, cy0); ctx.lineTo(cx0, cy0 - sy * (h*0.42));
      ctx.stroke();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.5 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx, top + 2*SS); ctx.lineTo(mx, top + 6*SS); ctx.stroke();
  } else {
    // frameless: two thin jaws, a hairline between them, and a lit sill
    ctx.fillStyle = `rgba(${S.thumb},${(0.06 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = `rgba(${S.edge},${(0.30 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2, y); ctx.lineTo(mx + tw/2, y); ctx.stroke();
    ctx.strokeStyle = `rgba(${S.glow},${(0.60 * A).toFixed(3)})`;
    ctx.lineWidth = 2.2 * SS;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + 2*SS, bot); ctx.lineTo(mx + tw/2 - 2*SS, bot); ctx.stroke();
  }
  // the jaws: the edges of the frame you are looking through, in every era
  ctx.fillStyle = bright;
  for (const s of [-1, 1]){
    const w2 = S.form === 'glass' ? 2.2 * SS : 3 * SS;
    ctx.beginPath();
    ctx.roundRect(mx + s * (tw/2) - w2/2, top, w2, h, S.form === 'clamp' ? w2/2 : 0.5 * SS);
    ctx.fill();
  }
  ctx.restore();
}

function ruleGeom(){
  const x0 = W * 0.13, x1 = W * 0.87;
  const W0 = INTRO_X, W1 = FIN_X;
  const seg = segAt(cam.x);
  // the thumb is as wide as the screen actually shows: the world span visible
  // at the plane the years live on. That is the honest answer to "what part of
  // the line am I looking at" — a point could never say it.
  const half = (W / 2) / (k(seg.tz || seg.z0 || 550) * SS);
  return {
    x0, x1, y: H - 40 * SS, W0, W1, half,
    at:  wx => x0 + (x1 - x0) * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0))),
    toWorld: sx => W0 + (W1 - W0) * Math.max(0, Math.min(1, (sx - x0) / (x1 - x0))),
  };
}
function ruleHit(pt){
  if (!pt || state.ruleA < 0.45) return false;
  const g = ruleGeom();
  return pt.y > g.y - 26 * SS && pt.y < g.y + 26 * SS &&
         pt.x > g.x0 - 40 * SS && pt.x < g.x1 + 40 * SS;
}
function ruleSeek(pt, instant, grabOff){
  const g = ruleGeom();
  const to = g.toWorld(pt.x) + (grabOff || 0);
  state.introHold = false;
  if (instant){ cam.x = to; cam.vel = 0; state.glide = null; }
  else state.glide = to;               // a click glides; the hall never teleports
  state.focusBeat = -1; cam.zTarget = 0;
  state.mode = 'live'; state.idle = 0;
}

const DBG = /[?&]dbg/.test(location.search);
function drawDebug(){
  if (!DBG) return;
  const kf = k(0);
  ctx.save();
  ctx.font = `${13*SS}px monospace`; ctx.textAlign = 'left';
  for (const tb of TABLES){
    const a = px(tb.x0, kf), b = px(tb.x1, kf);
    if (b < -50 || a > W + 50) continue;
    ctx.strokeStyle = 'rgba(0,255,180,0.85)'; ctx.lineWidth = 2*SS;
    ctx.strokeRect(a, py(CFG.benchY, kf), b - a, py(1080, kf) - py(CFG.benchY, kf));
    ctx.fillStyle = 'rgba(0,255,180,0.95)';
    ctx.fillText(`TABLE ${tb.x0|0}..${tb.x1|0}`, a + 6*SS, py(CFG.benchY, kf) + 18*SS);
  }
  for (const br of BENCH_BREAKS){
    const a = px(br.x - br.half, kf), b = px(br.x + br.half, kf);
    if (b < -50 || a > W + 50) continue;
    ctx.fillStyle = 'rgba(255,60,60,0.22)';
    ctx.fillRect(a, py(CFG.benchY, kf), b - a, py(1080, kf) - py(CFG.benchY, kf));
    ctx.fillStyle = 'rgba(255,90,90,0.95)';
    ctx.fillText(`BREAK ${br.x|0}±${br.half}`, a + 4*SS, py(CFG.benchY, kf) + 36*SS);
  }
  for (const p of PLATES){
    const half = (p.sw || 1390) / 2;
    for (const [wx, lbl] of [[p.x - half, 'PLATE L'], [p.x + half, 'PLATE R']]){
      const sx = px(wx, kf);
      if (sx < -50 || sx > W + 50) continue;
      ctx.strokeStyle = 'rgba(120,180,255,0.95)'; ctx.lineWidth = 2*SS;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      ctx.fillStyle = 'rgba(120,180,255,0.95)'; ctx.fillText(`${lbl} ${wx|0}`, sx + 5*SS, 60*SS);
    }
  }
  const wsx = px(wallSwitchX(), k(wallZAt(cam.x) - 8));
  ctx.strokeStyle = 'rgba(255,220,90,0.9)'; ctx.lineWidth = 2*SS;
  ctx.beginPath(); ctx.moveTo(wsx, 0); ctx.lineTo(wsx, H); ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,90,0.95)';
  ctx.fillText(`WALL SWITCH ${wallSwitchX()|0}`, wsx + 5*SS, 90*SS);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(`cam ${cam.x|0}  bench top ${py(CFG.benchY, kf)|0}  floor ${py(1080, kf)|0}`, 12*SS, H - 100*SS);
  ctx.restore();
}

/* TALL UNITS — a drawer bank standing against the wall, full height. It earns
   its place twice: it gives the craft era the storage a real lab had, and it
   stands exactly where the wall changes material, so the change happens behind
   furniture instead of down an open joint. */
const TALL_UNITS = [
  /* `wallAt` is where the dark boards give way to the plaster. It used to be
     derived from this unit's own edge, which meant the seam followed the
     cabinet everywhere it went; it is stated here so the cabinet can be placed
     against it instead of dragging it along. The cabinet sits a little past the
     seam, so rather more than half of it stands in the light era. */
  {x: bayStart(0) + CUTS[0].w / 2 + 295, w: 440, hw: 960, wallAt: bayStart(0) + CUTS[0].w / 2 + 220,
   cols: 2, rows: 5, top: 150},
];
function drawTallUnits(){
  for (const u of TALL_UNITS){
    const seg = segAt(u.x);
    const kk = k((seg.z0 || 550) - 40);         // furniture stands just off the wall
    const sx = px(u.x, kk), w = u.w * kk * SS;
    if (sx < -w || sx > W + w) continue;
    /* THE CABINET IS A PHOTOGRAPH. It used to be a drawn drawer bank ending at
       the counter's height, which is why it read as hanging: it had no feet and
       nothing under it. This one is a real instrument cabinet, cut out, and it
       stands on the FLOOR on its own legs — so the eye can see what holds it up. */
    if (PHOTO_TEX.ph_cabinet){
      const im = PHOTO_TEX.ph_cabinet;
      const hW = u.hw || 640;                    // its height in world units
      const wW = hW * im.width / im.height;
      const sw2 = wW * kk * SS, sh2 = hW * kk * SS;
      /* 44. Fifty put it five too low; the fifteen was applied in the same breath as the wall
         becoming a plane, and that moved the wall's foot 28 px DOWN — so against
         the room the cabinet came out fifteen higher than it started, which is
         what you saw. Measured off the frames: it used to stand 37 px in front
         of the wall's base and now stands 22, so it needs 15 for the request and
         28 to undo what the floor did underneath it. */
      const foot = py(1080, kk) + 44 * SS;
      /* THE SHADOW IS AS WIDE AS THE CABINET. contactShadow throws a round pool
         at 60 per cent of the width it is given, so at half the cabinet's width
         it reached about two thirds of the way out and stopped well short of the
         feet — a cabinet apparently resting on air at both ends. This one is an
         ellipse the full width of the piece, soft, still carrying weight where
         the edges are; and the two feet, which are what actually touch the
         floor, get a small dark pool of their own. Measured off the file: they
         sit at 3 and 97 per cent of its width. */
      ctx.save();
      const half = sw2 * 0.54, rise = Math.max(2, sh2 * 0.052);
      ctx.translate(sx, foot); ctx.scale(1, rise / half); ctx.translate(-sx, -foot);
      const shg = ctx.createRadialGradient(sx, foot, 0, sx, foot, half);
      shg.addColorStop(0, 'rgba(0,0,0,0.40)');
      shg.addColorStop(0.55, 'rgba(0,0,0,0.26)');
      shg.addColorStop(0.86, 'rgba(0,0,0,0.13)');
      shg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shg;
      ctx.beginPath(); ctx.arc(sx, foot, half, 0, 7); ctx.fill();
      ctx.restore();
      for (const f of [-0.47, 0.47]){
        const fx2 = sx + sw2 * f, fr = Math.max(2, sw2 * 0.085);
        ctx.save();
        ctx.translate(fx2, foot); ctx.scale(1, 0.34); ctx.translate(-fx2, -foot);
        const fg = ctx.createRadialGradient(fx2, foot, 0, fx2, foot, fr);
        fg.addColorStop(0, 'rgba(0,0,0,0.44)');
        fg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(fx2, foot, fr, 0, 7); ctx.fill();
        ctx.restore();
      }
      ctx.drawImage(im, sx - sw2 / 2, foot - sh2, sw2, sh2);
      continue;
    }
    const yTop = py(u.top, kk), yBot = py(CFG.benchY + 90, kk);
    const h = yBot - yTop;
    const x0 = sx - w / 2;
    ctx.save();
    // the carcass, in the era's own cabinet wood
    const tex = TEX[seg.front];
    ctx.beginPath(); ctx.rect(x0, yTop, w, h); ctx.clip();
    if (tex) for (let yy = yTop; yy < yBot; yy += w * 0.62)
      ctx.drawImage(tex, x0, yy, w, w * 0.62 + 1);
    else { ctx.fillStyle = '#2a1c10'; ctx.fillRect(x0, yTop, w, h); }
    // drawers: a grid of shallow fronts, each with a shadow under its lip
    const cw = w / u.cols, ch = h / u.rows;
    for (let r = 0; r < u.rows; r++)
      for (let c = 0; c < u.cols; c++){
        const dx0 = x0 + c * cw + 3 * kk * SS, dy0 = yTop + r * ch + 3 * kk * SS;
        const dw = cw - 6 * kk * SS, dh = ch - 6 * kk * SS;
        const g = ctx.createLinearGradient(0, dy0, 0, dy0 + dh);
        g.addColorStop(0, 'rgba(255,238,205,0.06)');
        g.addColorStop(0.10, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.30)');
        ctx.fillStyle = g; ctx.fillRect(dx0, dy0, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = Math.max(1, 1.4 * kk * SS);
        ctx.strokeRect(dx0, dy0, dw, dh);
        // the pull
        ctx.fillStyle = 'rgba(24,18,12,0.85)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1.5, 3.4 * kk * SS));
        ctx.fillStyle = 'rgba(255,236,200,0.16)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1, 1.2 * kk * SS));
      }
    ctx.restore();
    // cornice, and the shadow the unit throws onto the wall beside it
    ctx.fillStyle = 'rgba(38,26,16,0.95)';
    ctx.fillRect(x0 - 5 * kk * SS, yTop - 9 * kk * SS, w + 10 * kk * SS, 9 * kk * SS);
    for (const s of [-1, 1]){
      const gx = sx + s * (w / 2);
      const sh = ctx.createLinearGradient(gx, 0, gx + s * 46 * kk * SS, 0);
      sh.addColorStop(0, 'rgba(0,0,0,0.40)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh;
      ctx.fillRect(Math.min(gx, gx + s * 46 * kk * SS), yTop, 46 * kk * SS, h);
    }
  }
}

function drawProgress(t){
  const busy = state.study || state.person || state.people || state.inspect || state.clip || state.introHold;
  const hidden = Math.max(state.introFade || 0, state.finFade || 0, state.attract.fade || 0);
  const want = busy ? 0 : (1 - hidden);
  state.ruleA += (want - state.ruleA) * Math.min(1, (state.dt || 0.016) * 6);
  const A = state.ruleA;
  if (A < 0.02) return;

  const x0 = W * 0.13, x1 = W * 0.87, span = x1 - x0;
  const y = H - 40 * SS;
  const W0 = INTRO_X, W1 = FIN_X;
  const at = wx => x0 + span * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0)));
  const RECS = [[REC_L, REC_R], [REC3_L, REC3_R], [REC93_L, REC93_R],
                [REC2_L, REC2_R], [REC18_L, REC18_R], [REC4_L, REC4_R],
                [REC23_L, REC23_R]];
  // 1970 is a recreation too — the founding bench stands in its own cut bay, so
  // it earns the same pip as the other portals. The gap is taken at the width
  // the others use, not the bay's full 2320, so the rule keeps its rhythm.
  if (CUTS[1].on){
    const fc = bayStart(1) + CUTS[1].w / 2;
    RECS.push([fc - 540, fc + 540]);
  }

  ctx.save();
  ctx.lineCap = 'butt';
  // each era draws its own stretch in its own ink; the recreations are the gaps
  for (const seg of SEGMENTS){
    const a0 = Math.max(seg.x0, W0), a1 = Math.min(seg.x1, W1);
    if (a1 <= a0) continue;
    let cuts = [[a0, a1]];
    for (const [rl, rr] of RECS){
      const next = [];
      for (const [c0, c1] of cuts){
        if (rr <= c0 || rl >= c1) { next.push([c0, c1]); continue; }
        if (rl > c0) next.push([c0, rl]);
        if (rr < c1) next.push([rr, c1]);
      }
      cuts = next;
    }
    ctx.strokeStyle = `rgba(${seg.ink},${(0.30 * A).toFixed(3)})`;
    ctx.lineWidth = 2 * SS;
    for (const [c0, c1] of cuts){
      ctx.beginPath(); ctx.moveTo(at(c0), y); ctx.lineTo(at(c1), y); ctx.stroke();
    }
  }
  // the portals: a brighter pip where the hall changes era
  for (const [rl, rr] of RECS){
    const cx = at((rl + rr) / 2);
    ctx.fillStyle = `rgba(235,225,205,${(0.34 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(cx, y - 5 * SS); ctx.lineTo(cx + 3.4 * SS, y);
    ctx.lineTo(cx, y + 5 * SS); ctx.lineTo(cx - 3.4 * SS, y); ctx.closePath(); ctx.fill();
  }
  // a tick per beat; the landmark years stand a little taller, and the white
  // era marks its years with points rather than strokes
  for (const b of BEATS){
    if (b.under) continue;
    const bx = at(b.x), tall = (b.tier === 1 || b.fly) ? 5 : 3;
    const st = RULE_STYLE[Math.max(0, Math.min(3, segIdx(b.x)))];
    const al = (b.minor ? 0.22 : 0.40) * A;
    if (st.tick === 'dot'){
      ctx.fillStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, y, (b.minor ? 1.3 : 1.9) * SS, 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.lineWidth = 1.4 * SS;
      ctx.beginPath(); ctx.moveTo(bx, y - tall * SS); ctx.lineTo(bx, y + tall * SS); ctx.stroke();
    }
  }
  // the thumb: not a point but the stretch of line the screen is showing
  const segNow = segAt(cam.x);
  const g = ruleGeom();
  const tx0 = g.at(cam.x - g.half), tx1 = g.at(cam.x + g.half);
  const mx = (tx0 + tx1) / 2, tw = Math.max(14 * SS, tx1 - tx0);
  const warm = ruleHit(Input.hover) || state.ruleDrag ? 1 : 0;
  const S = ruleStyle();
  drawGlow(S.glow, mx, y, tw + 90 * SS, (0.20 + 0.14 * warm) * A);
  drawRuleThumb(mx, y, tw, S, A, warm);
  const nb = nearestBeat(cam.x);
  if (nb.i >= 0 && BEATS[nb.i].y){
    ctx.font = eraFont(17 * SS, '', segNow.font);
    ctx.textAlign = 'center';
    try { ctx.letterSpacing = `${3 * SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(${segNow.ink},${(0.62 * A).toFixed(3)})`;
    ctx.fillText(BEATS[nb.i].y, mx, y - 17 * SS);   // in the era's own face
    try { ctx.letterSpacing = '0px'; } catch(e){}
  }
  ctx.restore();
}

/* Bloom. The single largest difference between a drawing and a photograph is
   that in a photograph light spills: a lamp, a neon ring, a lit rim of glass
   bleeds into what surrounds it, because the lens cannot keep it inside its
   own edge. Everything above 0.85 is lifted off the finished frame at a
   quarter resolution, blurred, and added back — cheap enough for the N100 at
   480x270, and it is what makes the hall stop looking vector. `?nobloom` off. */
const BLOOM_ON = !/[?&]nobloom/.test(location.search);
let BLOOM = null, BLOOM_S = null;
function drawBloom(){
  if (!BLOOM_ON || !W || !H) return;
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  if (!BLOOM || BLOOM.width !== bw || BLOOM.height !== bh){
    BLOOM = document.createElement('canvas');
    BLOOM.width = bw; BLOOM.height = bh;
  }
  const g = BLOOM.getContext('2d');
  g.clearRect(0, 0, bw, bh);
  /* brightness 0.47 + contrast 8 puts the knee at ~0.93: only what is already
     near white spills, so a lit wall stays a wall and does not become a lamp.
     The BLUR is no longer a filter — a canvas blur() runs on the software
     rasterizer and cost more than everything else in the frame put together.
     The spill is downscaled once more instead: bilinear minification IS a
     blur, and it rides the GPU. */
  g.filter = 'brightness(0.47) contrast(8)';
  g.drawImage(ctx.canvas, 0, 0, bw, bh);
  g.filter = 'none';
  const sw2 = Math.max(2, bw >> 2), sh2 = Math.max(2, bh >> 2);
  if (!BLOOM_S || BLOOM_S.width !== sw2 || BLOOM_S.height !== sh2){
    BLOOM_S = document.createElement('canvas');
    BLOOM_S.width = sw2; BLOOM_S.height = sh2;
  }
  const g2 = BLOOM_S.getContext('2d');
  g2.clearRect(0, 0, sw2, sh2);
  g2.imageSmoothingEnabled = true;
  g2.drawImage(BLOOM, 0, 0, sw2, sh2);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.11;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(BLOOM_S, 0, 0, W, H);
  ctx.restore();
}

function drawSeamVideo(){
  const S = state.splice;
  if (!S) return;
  if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
    // the generated clip carries the whole transition
    const a = Math.min(1, S.t * 4);
    ctx.globalAlpha = a;
    const vw = SEAM_VIDEO.videoWidth, vh = SEAM_VIDEO.videoHeight;
    const sc = Math.max(W/vw, H/vh);
    ctx.drawImage(SEAM_VIDEO, W/2 - vw*sc/2, H/2 - vh*sc/2, vw*sc, vh*sc);
    ctx.globalAlpha = 1;
  } else {
    // placeholder: a veil of light carries us across
    const e = Math.max(0, Math.min(1, Math.min(S.t * 3.4, (SPLICE.dur - S.t) * 3.4)));
    ctx.fillStyle = `rgba(240,246,252,${(0.97 * e * e).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* after the world dims, the 1979 map gets its crossed beams — and is redrawn
   on top so it never loses its contrast */
function drawMapHero(t, h){
  if (h < 0.02 || !MAP_SPRITE) return;
  const mid = (REC_L + REC_R) / 2;
  const kk = k(610);
  const sp = MAP_SPRITE;
  const w = 440 * kk * SS, hh = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(450, kk);
  // twin beams crossing on the map
  const yEnd = cyS + hh * 1.4;
  for (const s of [-1, 1]){
    const fx = px(mid + s * 470, kk);
    const xEnd = fx + ((cx - fx) * (yEnd / Math.max(1, cyS))) * Math.min(1, h * 1.7);
    // the same soft-shouldered shaft the rest of the hall uses — these two
    // were the last hard-edged quads standing
    const tMap = Math.max(0.05, Math.min(0.9, cyS / yEnd));
    /* the beam opens wide enough that AT the map it is as broad as the map:
       target half-width at the picture's level, back-solved to the foot */
    const halfB = (26*SS + (w/2 - 26*SS) / tMap);
    softBeam(fx, xEnd, 0, yEnd, 26*SS, halfB, '255,246,220', 0.065 * h,
             [[0, 0.2], [tMap, 1], [tMap + (1 - tMap) * 0.5, 0.4], [1, 0]]);
    ctx.fillStyle = 'rgba(20,20,22,0.9)';
    ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
    ctx.fillStyle = `rgba(255,246,220,${(0.75*h).toFixed(2)})`;
    ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
  }
  // the map itself rides above the dim and the light — crisp
  ctx.drawImage(sp.c, cx - w/2, cyS - hh/2, w, hh);
}

/* 2023 · THE CROSSOVER. Every other apex in this hall is an invention. This
   one is an arithmetic fact: in March 2023 more digital impressions arrived in
   a month than physical ones, and nothing marked the day. So it is staged as
   the only thing it honestly is — two lines crossing, and a balance going
   level. Both reach dead centre at the same instant, and that instant is the
   moment the recreation is centred on your screen. Past it the beam does not
   swing back: a century does not end twice. */
function crossPhase(mid){
  const d = cam.x - mid;
  if (d <= 0){
    const u = Math.max(0, Math.min(1, 1 + d / 700));
    return 0.5 * (u * u * (3 - 2 * u));
  }
  const u = Math.max(0, Math.min(1, d / 450));
  return 0.5 + 0.5 * (u * u * (3 - 2 * u));
}
// a logistic through (0.5, 0.5): whatever the real curve was, it crossed in
// the middle, and that is the only property this drawing may assert
function digShare(u){
  const a = 2.4, p1 = Math.pow(Math.max(1e-4, u), a), p2 = Math.pow(Math.max(1e-4, 1 - u), a);
  return p1 / (p1 + p2);
}
function drawRec23(t){
  const mid = (REC23_L + REC23_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  ctx.save();   // after the cull, for the same reason
  const kk = k(1000);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC23_L, kk), x1 = px(REC23_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#e4e9ed'); wg.addColorStop(0.45, '#f6f9fb'); wg.addColorStop(1, '#c8ced4');
  ctx.fillStyle = wg; ctx.fillRect(x0, 0, x1 - x0, yBase);
  const cx = px(mid, kk);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(58 * kk * SS, '700', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${3.5*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(32,42,54,0.96)';
  ctx.fillText('THE CROSSOVER', cx, py(46, kk));
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(30 * kk * SS, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(60,70,84,0.95)';
  ctx.fillText('march 2023 \u00b7 the digital impressions outnumber the physical', cx, py(66, kk));
  ctx.restore();

  const ph = crossPhase(mid);
  const pw2 = 700 * kk * SS, pl = cx - pw2 / 2;
  const pTop = py(220, kk), pBot = py(560, kk), pH = pBot - pTop;
  ctx.strokeStyle = 'rgba(90,102,116,0.30)'; ctx.lineWidth = 1 * SS;
  ctx.beginPath(); ctx.moveTo(pl, pBot); ctx.lineTo(pl + pw2, pBot); ctx.stroke();
  const N = 64, upto = Math.max(0.02, ph);
  for (const [who, col, wid] of [['phys', '110,122,136', 2.4], ['dig', '40,140,210', 3.0]]){
    ctx.strokeStyle = `rgba(${col},0.92)`;
    ctx.lineWidth = wid * kk * SS;
    ctx.beginPath();
    for (let i = 0; i <= N; i++){
      const u = (i / N) * upto;
      const v = who === 'dig' ? digShare(u) : 1 - digShare(u);
      const X = pl + pw2 * u, Y = pBot - pH * (0.12 + 0.76 * v);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }
  ctx.font = eraFont(24 * kk * SS, '700', SEGMENTS[3].font);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(110,122,136,0.9)';
  ctx.fillText('PHYSICAL', pl, pBot - pH * 0.94);
  ctx.fillStyle = 'rgba(40,140,210,0.9)';
  ctx.fillText('DIGITAL', pl, pBot - pH * 0.06);
  ctx.textAlign = 'center';
  if (ph >= 0.5){
    const mx2 = pl + pw2 * 0.5, my2 = pBot - pH * 0.50;
    const a2 = Math.min(1, (ph - 0.5) * 5);
    ctx.strokeStyle = `rgba(30,40,52,${(0.5 * a2).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    ctx.setLineDash([4 * SS, 4 * SS]);
    ctx.beginPath(); ctx.moveTo(mx2, my2); ctx.lineTo(mx2, pBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(30,40,52,${(0.9 * a2).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(mx2, my2, 4.5 * kk * SS, 0, 7); ctx.fill();
    ctx.font = eraFont(22 * kk * SS, '700', SEGMENTS[3].font);
    ctx.fillText('MARCH 2023', mx2, pBot + 26 * kk * SS);
  }
  // the instant itself, caught on the crossing of dead centre and not before
  const dxm = cam.x - mid;
  if (state._x23 != null && Math.sign(dxm) !== Math.sign(state._x23) && Math.abs(dxm) < 400)
    state._x23flash = 1;
  state._x23 = dxm;
  if (state._x23flash > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('210,236,255', pl + pw2 * 0.5, pBot - pH * 0.5, pw2 * 0.8, 0.5 * state._x23flash);
    ctx.restore();
    state._x23flash *= 0.90;
  }
  ctx.restore();
}

/* THE PILE. Not a metaphor — the thing itself: the boxes the physical
   impressions arrived in, stacked the way they stacked in a mailroom. They go
   one at a time, from the top down, as you come through: half the pile by the
   moment the two lines cross, and by the time you have walked on, a tenth of it
   is left standing at the bottom. That is the whole of March 2023. */
/* Forty-eight boxes at twice the size. The pile stands tall enough to cross
   the lines behind it, and that is fine: by the time it is in front of them
   most of it has already gone, and what is left is below the crossing. */
const BOX_ROWS = [7, 6, 6, 5, 5, 4, 4, 3, 3, 2, 2, 1];   // 48, bottom row first
let BOX_PILE = null;
function boxPile(){
  if (BOX_PILE) return BOX_PILE;
  BOX_PILE = [];
  BOX_ROWS.forEach((cnt, r) => {
    for (let i = 0; i < cnt; i++){
      const jitter = ((r * 7 + i * 13) % 9 - 4) / 40;    // stacked by hand, not by machine
      BOX_PILE.push({r, u: (i - (cnt - 1) / 2) * 1.06 + jitter, lean: ((r * 5 + i * 11) % 7 - 3) * 0.006});
    }
  });
  return BOX_PILE;
}
function drawBoxPile(b, t){
  const g = b.rig, kk = k(bz(g.lz ?? 150));
  const sx = px(b.x + (g.dx || 0), kk);
  const S1 = (g.w || 300) * kk * SS / 240;
  const foot = py(CFG.benchY - 2, kk);
  if (sx < -500 || sx > W + 500) return;
  const ph = crossPhase(b.x);
  const P = boxPile(), N = P.length;
  const live = Math.max(Math.round(N * 0.10), Math.ceil(N * (1 - 0.90 * ph)));
  const bw = 26 * S1, bh = 15 * S1, dp = 9 * S1;        // one carton

  ctx.save();
  ctx.translate(sx, foot); ctx.scale(1, 0.20); ctx.translate(-sx, -foot);
  const csh = ctx.createRadialGradient(sx, foot, 0, sx, foot, bw * 4.4);
  csh.addColorStop(0, `rgba(0,0,0,${(0.42 * (0.35 + 0.65 * live / N)).toFixed(3)})`);
  csh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = csh;
  ctx.beginPath(); ctx.arc(sx, foot, bw * 4.4, 0, 7); ctx.fill();
  ctx.restore();

  for (let i = 0; i < live; i++){
    const q = P[i];
    const bx = sx + q.u * bw, by = foot - q.r * bh;
    const goingA = Math.max(0, Math.min(1, (live - i) / 1.0));    // the top one is mid-flight
    ctx.save();
    ctx.globalAlpha = goingA;
    ctx.translate(bx, by); ctx.rotate(q.lean); ctx.translate(-bx, -by);
    // the face, the lid and the side it turns away
    ctx.fillStyle = '#d5cbb8';
    ctx.fillRect(bx - bw/2, by - bh, bw, bh);
    ctx.fillStyle = '#e9e1d3';
    ctx.beginPath();
    ctx.moveTo(bx - bw/2, by - bh);
    ctx.lineTo(bx - bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2, by - bh);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b3a892';
    ctx.beginPath();
    ctx.moveTo(bx + bw/2, by - bh);
    ctx.lineTo(bx + bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2 + dp, by - dp * 0.62);
    ctx.lineTo(bx + bw/2, by);
    ctx.closePath(); ctx.fill();
    // the tape down the middle, and the docket stuck on the front
    ctx.fillStyle = 'rgba(160,150,132,0.55)';
    ctx.fillRect(bx - 1.1 * S1, by - bh, 2.2 * S1, bh);
    ctx.fillStyle = 'rgba(252,250,244,0.9)';
    ctx.fillRect(bx - bw * 0.36, by - bh * 0.72, bw * 0.26, bh * 0.34);
    ctx.strokeStyle = 'rgba(120,112,98,0.5)'; ctx.lineWidth = 0.9 * SS;
    ctx.strokeRect(bx - bw/2, by - bh, bw, bh);
    ctx.restore();
  }
  pushHit(sx - bw * 4, foot - BOX_ROWS.length * bh - dp, bw * 8, BOX_ROWS.length * bh + dp * 2,
          {type: 'openbox'});
}

/* 2018 · THE FIRST AI CROWN — and the arm that takes it on.
   Every other machine in this hall does something TO the crown: the scanner
   measures it, the mill cuts it away, the laser reads it. Here nothing touches
   it. Three candidate forms are proposed over the prepared tooth, they flicker
   against each other, one wins and closes into a solid. No tool appears at any
   point, because that is the entire fact of 2018. Then the crown leaves the
   screen: it drifts forward out of the panel's plane into the room, growing as
   it comes, and turns from a wireframe into an object exactly as the arm from
   the year after closes on it and carries it into production. It is the only
   thing in the hall that travels between two beats. */
function crownSilhouette(cx, cy, w, h, warp){
  crownGeometry();
  const rows = CROWN_ROWS;
  ctx.beginPath();
  for (let i = 0; i < rows.length; i++){
    const d = warp ? warp(i, -1) : 0;
    const x = cx + (rows[i][0] + d) * w, y = cy + rows[i][2] * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let i = rows.length - 1; i >= 0; i--){
    const d = warp ? warp(i, 1) : 0;
    ctx.lineTo(cx + (rows[i][1] + d) * w, cy + rows[i][2] * h);
  }
  ctx.closePath();
}
const AI_WARP = c => (i, side) =>
  side * (0.034 * Math.sin(i * 0.9 + c * 2.1) + 0.014 * Math.cos(i * 1.7 + c * 3.3));

function drawRec18(t){
  const mid = (REC18_L + REC18_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  const kk = k(1000);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC18_L, kk), x1 = px(REC18_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#e6eaee'); wg.addColorStop(0.45, '#f7fafc'); wg.addColorStop(1, '#cad0d6');
  ctx.fillStyle = wg; ctx.fillRect(x0, 0, x1 - x0, yBase);
  const cx = px(mid, kk);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(58 * kk * SS, '700', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${3.5*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(32,42,54,0.96)';
  ctx.fillText('THE FIRST AI CROWN', cx, py(46, kk));
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(30 * kk * SS, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(60,70,84,0.95)';
  ctx.fillText('no hand drew it \u00b7 no tool cut it \u00b7 it was proposed', cx, py(66, kk));
  ctx.restore();

  for (const wxc of [REC18_L, REC18_R]){
    const kc = k(994), sxc = px(wxc, kc), cw = 116 * kc * SS;
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#8f979f'); cg.addColorStop(0.45, '#d8dee3'); cg.addColorStop(1, '#7d858c');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, yBase);
  }
}

/* THE DESIGN STATION. The first AI crown existed as a file before it existed
   as anything else, so this is where the year actually happens: fastdesign.io
   on a monitor, and the crown being proposed inside its viewport. Three
   candidates argue, one wins and fills — and only then does it leave the
   screen. The interface is drawn from the product: the wordmark and its tabs,
   the tool rails down both sides, the tooth strips top and bottom, and the
   milling preview waiting at the bottom right. It carries NO product name:
   that was christened later, and in 2018 this was simply the software the lab
   designed in. What is drawn here is the layout, not the branding. */
function drawDesignStation(b, t){
  const g = b.rig, kk = k(bz(g.lz ?? 120));
  const sx = px(b.x + (g.dx || 0), kk);
  const W2 = (g.w || 540) * kk * SS, H2 = W2 * 0.58;
  const foot = py(CFG.benchY - 2, kk);
  if (sx < -W2 || sx > W + W2) return;
  const x0 = sx - W2/2, y0 = foot - 26 * kk * SS - H2;
  // stand and foot
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(sx, foot, W2 * 0.20, 6 * kk * SS, 0, 0, 7); ctx.fill();
  const stG = ctx.createLinearGradient(sx - 12 * kk * SS, 0, sx + 12 * kk * SS, 0);
  stG.addColorStop(0, '#8b9298'); stG.addColorStop(0.4, '#d5dade'); stG.addColorStop(1, '#7d848a');
  ctx.fillStyle = stG;
  ctx.fillRect(sx - 11 * kk * SS, y0 + H2, 22 * kk * SS, 26 * kk * SS);
  ctx.fillStyle = '#aeb5bb';
  ctx.beginPath(); ctx.ellipse(sx, foot, W2 * 0.17, 5 * kk * SS, 0, 0, 7); ctx.fill();
  // bezel
  ctx.fillStyle = '#e9ecef';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS, 4 * kk * SS);
  else ctx.rect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS);
  ctx.fill();

  const ph = latchedPhase(b.x, 450);
  const F = SEGMENTS[3].font, U = W2;               // one unit = the screen's width
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, W2, H2); ctx.clip();
  ctx.fillStyle = '#eef1f4'; ctx.fillRect(x0, y0, W2, H2);
  const vp = {x: x0 + U*0.062, y: y0 + H2*0.155, w: W2 - U*0.112, h: H2*0.70};
  ctx.fillStyle = '#c2d1dc'; ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
  // the crown, argued out inside the viewport
  const cw2 = vp.h * 0.52, ch2 = cw2 * PED_SPRITES.crown2.h / PED_SPRITES.crown2.w;
  const ccx = vp.x + vp.w/2, ccy = vp.y + vp.h*0.52;
  const fade = Math.max(0, 1 - Math.max(0, ph - 0.42) / 0.30);
  if (fade > 0.01){
    const lead = Math.floor(ph * 16) % 3;
    for (let c2 = 0; c2 < 3; c2++){
      ctx.strokeStyle = `rgba(28,110,180,${(fade * (c2 === lead ? 0.8 : 0.24)).toFixed(3)})`;
      ctx.lineWidth = (c2 === lead ? 1.8 : 1.1) * SS;
      crownSilhouette(ccx, ccy, cw2, ch2, AI_WARP(c2 + 1));
      ctx.stroke();
    }
  }
  if (ph > 0.30){
    const g2 = Math.max(0, Math.min(1, (ph - 0.30) / 0.45));
    ctx.fillStyle = `rgba(244,240,232,${(0.92 * Math.max(0, (ph - 0.62) / 0.38)).toFixed(3)})`;
    crownSilhouette(ccx, ccy, cw2, ch2, null); ctx.fill();
    ctx.strokeStyle = `rgba(24,60,92,${(0.35 + 0.55 * g2).toFixed(3)})`;
    ctx.lineWidth = (1.2 + 1.4 * g2) * SS;
    crownSilhouette(ccx, ccy, cw2, ch2, null); ctx.stroke();
  }
  // the tooth strips, red at the ends and white through the middle
  for (const ty of [vp.y - H2*0.052, vp.y + vp.h + H2*0.008]){
    for (let i = 0; i < 16; i++){
      const tw = vp.w * 0.026, gx2 = vp.x + vp.w*0.22 + i * tw * 1.18;
      ctx.fillStyle = (i < 3 || i > 12) ? '#d0575c' : '#ffffff';
      ctx.fillRect(gx2, ty, tw, H2*0.044);
    }
  }
  // the rails
  for (const [rx, cnt] of [[x0 + U*0.012, 10], [x0 + W2 - U*0.050, 5]]){
    for (let i = 0; i < cnt; i++){
      ctx.fillStyle = '#1f7fd0';
      ctx.fillRect(rx, vp.y + i * H2*0.068, U*0.038, H2*0.052);
    }
  }
  // chrome: the wordmark, its tabs, the search field
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y0, W2, H2*0.115);
  ctx.fillStyle = '#2b3844';
  ctx.fillRect(x0 + U*0.018, y0 + H2*0.042, U*0.078, H2*0.034);    // a mark, unnamed
  ctx.fillStyle = '#aeb8c1';
  ctx.fillRect(x0 + U*0.20, y0 + H2*0.050, U*0.040, H2*0.018);
  ctx.fillRect(x0 + U*0.26, y0 + H2*0.050, U*0.040, H2*0.018);
  ctx.fillStyle = '#1f7fd0';
  ctx.fillRect(x0 + U*0.32, y0 + H2*0.050, U*0.044, H2*0.018);
  ctx.fillStyle = '#f0f3f6'; ctx.fillRect(x0 + U*0.40, y0 + H2*0.030, U*0.18, H2*0.058);
  ctx.fillStyle = '#b9c2ca';
  ctx.beginPath(); ctx.arc(x0 + W2 - U*0.085, y0 + H2*0.058, H2*0.030, 0, 7); ctx.fill();
  // and the bottom bar, with the milling preview waiting at the end of it
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y0 + H2*0.905, W2, H2*0.095);
  ctx.fillStyle = '#1f7fd0';
  ctx.fillRect(x0 + U*0.010, y0 + H2*0.915, U*0.045, H2*0.075);
  ctx.fillRect(x0 + W2 - U*0.055, y0 + H2*0.915, U*0.045, H2*0.075);
  ctx.fillStyle = '#b3bcc4';
  ctx.fillRect(x0 + U*0.070, y0 + H2*0.940, U*0.11, H2*0.020);
  ctx.fillRect(x0 + W2 - U*0.180, y0 + H2*0.940, U*0.11, H2*0.020);
  ctx.restore();
  ctx.strokeStyle = 'rgba(120,130,140,0.55)'; ctx.lineWidth = 1.2 * SS;
  ctx.strokeRect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS);
  pushHit(x0, y0, W2, H2, {type: 'focus', beat: nearestBeat(b.x).i, anchor: b.x});
}


let AI_ROBOT_X = null;
/* The crown's journey. It leaves the panel's plane and comes forward into the
   room, growing as it comes and turning from a proposal into an object — and
   then it goes into the line and is gone. There is no arm of mine here: the
   BruxZir Factory already has its own robots, and adding another one put four
   arms and a crown the size of a person in the same two metres of hall. */
function drawAIRelay(t){
  if (AI_ROBOT_X == null){
    const b = BEATS.find(b2 => b2.y === '2019' && b2.t === 'BRUXZIR FACTORY');
    AI_ROBOT_X = b ? b.x : REC18_R + 720;
  }
  const mid = (REC18_L + REC18_R) / 2, rob = AI_ROBOT_X;
  if (cam.x < mid - 2400 || cam.x > rob + 1200) return;
  const endX = rob - 340;                       // it enters the line, it does not sit on it
  const u = Math.max(0, Math.min(1, (cam.x - mid) / (endX - mid)));
  const p = u * u * (3 - 2 * u);
  const build = latchedPhase(mid, 450);
  if (build <= 0.28) return;

  const wx = mid + (endX - mid) * p;
  const lz = 120 + (40 - 120) * p;              // it lifts off the screen it was designed on
  const wy = 566 - 70 * p;
  const kkc = k(lz), sxc = px(wx, kkc), syc = py(wy, kkc);
  const spC = PED_SPRITES.crown2;
  const wC = 190 * kkc * SS, hC = wC * spC.h / spC.w;
  const sol = Math.max(0, Math.min(1, (p - 0.45) / 0.25));
  const gone = Math.max(0, Math.min(1, (p - 0.72) / 0.28));   // taken up by the line
  const a = (1 - gone) * Math.min(1, build * 1.6);
  if (a <= 0.01) return;

  ctx.save();
  ctx.globalAlpha = a;
  if (sol < 1){
    ctx.strokeStyle = `rgba(60,140,205,${(0.85 * (1 - sol)).toFixed(3)})`;
    ctx.lineWidth = 1.6 * SS;
    crownSilhouette(sxc, syc, wC, hC, null);
    ctx.stroke();
    crownGeometry();
    ctx.strokeStyle = `rgba(60,140,205,${(0.32 * (1 - sol)).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    for (const [a2, b2, uy] of CROWN_ROWS){
      const y2 = syc + uy * hC;
      ctx.beginPath();
      ctx.moveTo(sxc + a2 * wC, y2); ctx.lineTo(sxc + b2 * wC, y2);
      ctx.stroke();
    }
  }
  if (sol > 0){
    ctx.globalAlpha = a * sol;
    ctx.drawImage(spC.c, sxc - wC/2, syc - hC/2, wC, hC);
  }
  ctx.restore();
}

/* 1993 · NEWPORT BEACH. The one bay in the hall whose film the company shot
   itself: an architect's computer flythrough of a building that did not exist
   yet, cutting — same angle, single cut — to the same building finished. So the
   panel is a screen, and what stands on the counter in front of it is the
   massing model that flythrough was made from. */
function drawRec93(t){
  const mid = (REC93_L + REC93_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  const kk = k(728);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC93_L, kk), x1 = px(REC93_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#c3cad0');
  wg.addColorStop(0.42, '#dee4e9');
  wg.addColorStop(1, '#979ea5');
  ctx.fillStyle = wg;
  ctx.fillRect(x0, 0, x1 - x0, yBase);
  // the reveal the picture lands in, so the film reads as hung and not floating
  const cx = px(mid, kk);
  // no reveal and no frame: the projector lays its own ground, in exactly the
  // shape of the picture it is about to add
}

/* The massing model. Drawn in cabinet oblique — the projection an architect's
   office actually used before it had a renderer — so it reads as a made object
   on a table and not as a picture of one. One light, upper left: the roofs take
   it full, the faces that turn away lose it in two steps. */
function m93(p, mx, my, mz){
  return [p.ox + (mx - mz * 0.50) * p.s, p.oy - (my - mz * 0.34) * p.s];
}
function quad93(p, pts, tone){
  ctx.fillStyle = tone;
  ctx.beginPath();
  pts.forEach((v, i) => {
    const q = m93(p, v[0], v[1], v[2]);
    i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
  });
  ctx.closePath(); ctx.fill();
}
const T93 = ['#f6f4ef', '#dedad2', '#b3aea6', '#8e8a83'];   // roof, front, side, shade
function box93(p, x0, x1, y0, y1, z0, z1, bands){
  quad93(p, [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], T93[0]);   // roof
  quad93(p, [[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[x1,y0,z0]], T93[2]);   // the side that turns away
  quad93(p, [[x0,y1,z1],[x1,y1,z1],[x1,y0,z1],[x0,y0,z1]], T93[1]);   // the face
  if (!bands) return;
  // three ribbon windows, recessed between the spandrels
  const h = (y1 - y0) / 2;
  for (let i = 0; i < 2; i++){
    const a = y0 + i * h + h * 0.30, b2 = y0 + i * h + h * 0.78;
    quad93(p, [[x0+3,b2,z1],[x1-3,b2,z1],[x1-3,a,z1],[x0+3,a,z1]], T93[3]);
    quad93(p, [[x1,b2,z0+3],[x1,b2,z1-3],[x1,a,z1-3],[x1,a,z0+3]], '#6f6c66');
  }
}
function roundPoly93(pts, rr){
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i + 1) % pts.length], c = pts[(i + 2) % pts.length];
    const d1 = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1, t1 = Math.min(rr / d1, 0.45);
    const d2 = Math.hypot(c[0]-b[0], c[1]-b[1]) || 1, t2 = Math.min(rr / d2, 0.45);
    const s1 = [a[0] + (b[0]-a[0]) * t1, a[1] + (b[1]-a[1]) * t1];
    const e1 = [b[0] - (b[0]-a[0]) * t1, b[1] - (b[1]-a[1]) * t1];
    if (i === 0) ctx.moveTo(s1[0], s1[1]); else ctx.lineTo(s1[0], s1[1]);
    ctx.lineTo(e1[0], e1[1]);
    ctx.quadraticCurveTo(b[0], b[1], b[0] + (c[0]-b[0]) * t2, b[1] + (c[1]-b[1]) * t2);
  }
  ctx.closePath();
}

/* The stand. A soft white slab with a fat rounded edge — the way a model of a
   place is presented when the place is the point, lifted off the floor so you
   look down onto it the way the flythrough looks down onto the building. */
function drawModel93(wx, lz, wWorld, topWorldY){
  const kk = k(lz);
  const sx = px(wx, kk);
  const foot = py(topWorldY, kk);
  const XM = 132, ZM = 76;
  const s = wWorld * kk * SS / (XM + ZM * 0.50);
  if (sx < -500 || sx > W + 500) return;
  const p = {s, ox: sx - (XM - ZM * 0.50) * s / 2, oy: foot - ZM * 0.34 * s};

  // the plinth: the ground plane of the model, oversailed and extruded down
  /* One surface. The site used to be a separate slab laid on top of a separate
     box, and the two never looked like one thing — the card overhung the stand
     on one side and left it bare on the other, which is exactly the cut-and-
     paste look. The stand's top face IS the ground the site is laid out on now,
     so there is no seam between them to misalign. */
  const OV = 0, H = py(1080, kk) - foot;
  const A = m93(p, -2, 0, -2), B = m93(p, XM+2, 0, -2);
  const C = m93(p, XM+2, 0, ZM+2), D = m93(p, -2, 0, ZM+2);
  const rr = 14 * s;
  ctx.save();
  ctx.translate(sx, py(1080, kk)); ctx.scale(1, 0.16); ctx.translate(-sx, -py(1080, kk));
  const gsh = ctx.createRadialGradient(sx, py(1080, kk), 0, sx, py(1080, kk), (XM+2*OV) * s * 0.7);
  gsh.addColorStop(0, 'rgba(0,0,0,0.45)'); gsh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gsh;
  ctx.beginPath(); ctx.arc(sx, py(1080, kk), (XM+2*OV) * s * 0.7, 0, 7); ctx.fill();
  ctx.restore();
  const wallG = ctx.createLinearGradient(0, foot, 0, foot + H);
  wallG.addColorStop(0, '#f0f2f4'); wallG.addColorStop(0.35, '#dfe3e7'); wallG.addColorStop(1, '#a9b0b7');
  ctx.fillStyle = wallG;
  ctx.beginPath();
  ctx.moveTo(D[0], D[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(B[0], B[1] + H); ctx.lineTo(C[0], C[1] + H); ctx.lineTo(D[0], D[1] + H);
  ctx.closePath(); ctx.fill();
  roundPoly93([[A[0], A[1]+H], [B[0], B[1]+H], [C[0], C[1]+H], [D[0], D[1]+H]], rr);
  ctx.fillStyle = '#9ba2a9'; ctx.fill();
  roundPoly93([A, B, C, D], rr);
  const topG = ctx.createLinearGradient(A[0], A[1], C[0], C[1]);
  topG.addColorStop(0, '#ffffff'); topG.addColorStop(1, '#e4e8ec');
  ctx.fillStyle = topG; ctx.fill();


  /* The grounds. A building alone on a plate is a massing study; what the film
     shows is a place — asphalt, a lot with the stalls painted on it, young
     trees that have not filled out yet, and the walk up to the door. Painted
     flat on the ground plane in the same oblique, so it lies down properly. */
  const flat = (x0, x1, z0, z1, tone) => quad93(p, [[x0,0.4,z0],[x1,0.4,z0],[x1,0.4,z1],[x0,0.4,z1]], tone);
  const oval = (mx, mz, ax, az, tone, kerb) => {
    ctx.beginPath();
    for (let i = 0; i <= 30; i++){
      const th = Math.PI * 2 * i / 30;
      const q = m93(p, mx + Math.cos(th) * ax, 0.4, mz + Math.sin(th) * az);
      i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath();
    ctx.fillStyle = tone; ctx.fill();
    if (kerb){ ctx.strokeStyle = kerb; ctx.lineWidth = Math.max(0.8, 1.1 * s); ctx.stroke(); }
  };

  /* The grounds, read off the live footage: a broad pale drive sweeping past
     the entrance around an oval of lawn in a concrete kerb, raised beds of dark
     planting hugging the building, a row of bollards along the walk, and young
     trees everywhere — slender ones, the year they went in. */
  flat(4, XM-4, 4, ZM-4, '#dcded9');                      // lawn
  flat(6, 44, 40, 56, '#a8adb2');                         // the lot, off to one side
  ctx.lineWidth = Math.max(0.6, 0.7 * s);
  ctx.strokeStyle = 'rgba(250,250,248,0.7)';
  for (let i = 0; i < 6; i++){
    const xx = 10 + i * 5.6;
    const a = m93(p, xx, 0.6, 42), b2 = m93(p, xx, 0.6, 54);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
  }
  for (let i = 0; i < 4; i++)
    box93(p, 9 + i * 8.2, 15 + i * 8.2, 0.4, 4.4, 43 + (i % 2) * 6, 52 + (i % 2) * 6, false);
  flat(6, XM-6, 58, ZM-4, '#b7bcc1');                     // the drive across the front
  oval(66, 66, 24, 5.2, '#c6cfc2', 'rgba(245,246,242,0.85)');   // the lawn island in it
  flat(56, 76, 58, 66, '#ced2ce');                        // the walk to the door
  flat(6, 46, 34, 39, '#8e9a8a');                         // beds along the rear bar
  flat(86, XM-6, 34, 39, '#8e9a8a');
  flat(46, 86, 62, 67, '#8e9a8a');                        // and in front of the wing

  /* The building: a long bar with a wing brought forward out of its middle, two
     ribbons of glass, white pilasters at the ends and where the wing meets it,
     a plant room on the rear roof, and two octagonal columns standing free in
     the plaza either side of the wing. */
  box93(p, 6, 126, 0, 30, 10, 34, true);                  // the rear bar
  box93(p, 46, 86, 0, 30, 34, 62, true);                  // the wing, forward
  box93(p, 54, 78, 30, 36, 14, 26, false);                // the plant on the roof
  for (const [px2, zf] of [[5, 34], [39, 34], [86, 34], [119, 34], [45, 62], [79, 62]])
    box93(p, px2, px2 + 7, 0, 32, zf, zf + 5, false);     // pilasters
  // the two octagons out in front
  for (const ox2 of [32, 100]){
    const [ux, uy] = m93(p, ox2, 26, 52), [, ly] = m93(p, ox2, 0, 52);
    const r2 = 6 * s;
    const og = ctx.createLinearGradient(ux - r2, 0, ux + r2, 0);
    og.addColorStop(0, T93[1]); og.addColorStop(0.36, T93[0]); og.addColorStop(1, T93[2]);
    ctx.fillStyle = og;
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const th = Math.PI * 2 * i / 8 + Math.PI / 8;
      const X = ux + Math.cos(th) * r2, Y = uy + Math.sin(th) * r2 * 0.34;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);

    ctx.lineTo(ux + Math.cos(Math.PI/8) * r2, ly);
    ctx.fillRect(ux - r2, uy, r2 * 2, ly - uy);
    ctx.fill();
    ctx.fillStyle = T93[0];
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const th = Math.PI * 2 * i / 8 + Math.PI / 8;
      const X = ux + Math.cos(th) * r2, Y = uy + Math.sin(th) * r2 * 0.34;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.closePath(); ctx.fill();
  }
  // bollards along the walk
  for (let i = 0; i < 6; i++){
    const bx2 = 57 + i * 3.7;
    const [ux, uy] = m93(p, bx2, 3.6, 64), [, ly] = m93(p, bx2, 0, 64);
    ctx.fillStyle = T93[1];

  }
  // young trees: slender, high-crowned, the year they went in
  for (const [tx2, tz2, r2] of [[10, 62, 3.6], [24, 70, 3.2], [40, 62, 3.8], [52, 72, 3.0],
                                [80, 72, 3.4], [92, 62, 3.6], [108, 70, 3.2], [124, 62, 3.4],
                                [24, 38, 3.0], [66, 8, 3.4], [104, 38, 3.2], [6, 30, 3.4],
                                [128, 30, 3.2], [46, 30, 2.8]]){
    const [ux, uy] = m93(p, tx2, 0.4, tz2);
    const [, cy2] = m93(p, tx2, r2 * 3.2, tz2);
    ctx.strokeStyle = '#8b8880'; ctx.lineWidth = Math.max(0.7, 0.9 * s);
    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(ux, cy2 + r2 * 0.6 * s); ctx.stroke();
    ctx.fillStyle = '#a4b59c';
    ctx.beginPath(); ctx.ellipse(ux, cy2, r2 * 0.92 * s, r2 * 1.05 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(228,238,222,0.5)';
    ctx.beginPath(); ctx.ellipse(ux - r2 * 0.28 * s, cy2 - r2 * 0.34 * s, r2 * 0.42 * s, r2 * 0.44 * s, 0, 0, 7); ctx.fill();
  }
  // the number, where it is on the building
  const [nx2, ny2] = m93(p, 92, 21, 34);
  ctx.fillStyle = 'rgba(70,68,64,0.85)';
  ctx.font = eraFont(Math.max(5, 4.6 * s), '700', SEGMENTS[2].font);
  ctx.textAlign = 'left';
  ctx.fillText('4141', nx2, ny2);

  pushHit(sx - XM * s * 0.5, foot - 46 * s, XM * s, 46 * s,
          {type: 'focus', beat: nearestBeat(wx).i, anchor: wx});
}
