/* THE CUTS — the timeline can be sliced in several places; everything
   downstream of each cut slides right by its width, opening an empty bay.
   Written in ORIGINAL coordinates and applied in order, so adding a cut never
   requires renumbering the ones after it. Every world anchor below is filtered
   through SHIFT, and the boot pass moves the beats and re-keys their study
   texts, so tables, lights, attract stops and audits are all built from
   already-shifted data. With every cut off, SHIFT is the identity. */
const CUTS = [
  // the threshold: the drawer bank and the change of wall need a bay of their
  // own, or they lean into the era that follows
  {at: 1900, w: 700, on: true},
  // the founding: Jim's own bench, standing where the year stands
  {at: 2450, w: 2320, on: !/[?&]noplate/.test(location.search)},
  // 1993: the move to Newport Beach — a model of the building, and the film the
  // company shot of it, cut inside era 2 where no two wall planes meet
  {at: 12150, w: 1500, on: true},
  // 2018: the first crown designed entirely by AI, and the arm that takes it on
  {at: 24450, w: 1500, on: true},
  // 2023: the month the digital impressions outnumbered the physical ones
  {at: 26900, w: 2000, on: true},
];
function SHIFT(x){
  let s = 0;
  for (const c of CUTS) if (c.on && x >= c.at) s += c.w;
  return x + s;
}
/* where a cut's own bay begins on the final line: its position carries the
   cuts BEFORE it, but not its own */
function bayStart(i){
  let s = 0;
  for (let j = 0; j < i; j++) if (CUTS[j].on) s += CUTS[j].w;
  return CUTS[i].at + s;
}
const GAP = CUTS[1];
function applyCut(){
  if (!CUTS.some(c => c.on) || GAP.done) return;
  GAP.done = true;
  // only raw literals move here: SEGMENTS and the world anchors were already
  // filtered through SHIFT when the script was parsed
  for (const b of BEATS) b.x = SHIFT(b.x);
  // the founding beat owns the bay its bench stands in: it sits at its centre
  /* Four beats do not go where SHIFT would put them: each owns a bay that was
     cut for it and belongs at its centre. Their articles have to travel with
     them — the founding's did not, and its key landed 1160 units from the beat,
     which is how the most important page in the hall became unopenable. */
  const moved = [];
  const anchor = (year, to) => {
    const b = BEATS.find(x => x.y === year);
    if (b && to != null && Math.abs(b.x - to) > 1){ moved.push([b.x, to]); b.x = to; }
  };
  if (CUTS[1].on) anchor('1970', bayStart(1) + CUTS[1].w / 2);
  anchor('1993', (REC93_L + REC93_R) / 2);
  anchor('2018', (REC18_L + REC18_R) / 2);
  anchor('2023', (REC23_L + REC23_R) / 2);
  /* RHYTHM. Inside one era the years should stand at equal intervals: a
     corridor reads by its beat, and ours had a gap of 600 next to a gap of 1600
     for no reason but the order they happened to be written in. The era keeps
     its own extent — its first and last year do not move — and everything
     between them is redistributed evenly. A beat that owns a bay cut for it
     keeps its centre, and a satellite keeps its offset from the beat it belongs
     to. Props, photos and captions are all positioned by `dx` from their beat,
     so they travel with it and nothing has to be replaced by hand. */
  /* These four own a bay cut for them. 2019 is different and had to be added
     after the audit caught it: the factory is drawn at its own constant FACT_X,
     so moving the beat left the year and the machines in different places. A
     beat tied to a fixed scene cannot be re-spaced — the scene has to move with
     it, or it has to stay put. */
  anchor('2022', (REC4_L + REC4_R) / 2);
  const owns = new Set(['1970', '1993', '2018', '2022', '2023', '2019']);
  for (const seg of SEGMENTS){
    const mine = BEATS.filter(b => b.x > seg.x0 && b.x < seg.x1 && !b.sub && !b.under)
                      .sort((p, q) => p.x - q.x);
    if (mine.length < 4) continue;
    /* EVEN SPACING BETWEEN THE FIXED POINTS, not across the whole era. A pinned
       beat holds its own coordinate, so slots measured from end to end can hand
       a free beat a place to the RIGHT of the pinned beat that comes after it —
       and order is chronology here. That is exactly what happened at 2018: the
       crown is pinned to its recreation's centre and glidewell.io was handed a
       slot past it, so the wall read 2018 then 2017. Spacing each run of free
       beats between its two bounding fixed points cannot invert anything,
       because every position it produces lies strictly inside its own interval. */
    const fixed = [0];
    for (let i = 1; i < mine.length - 1; i++) if (owns.has(mine[i].y)) fixed.push(i);
    fixed.push(mine.length - 1);
    const shove = (b, d) => {
      if (Math.abs(d) < 1) return;
      for (const s of BEATS) if (s.sub != null && Math.abs(s.sub - b.x) < 1){ s.x += d; s.sub = b.x + d; }
      b.x += d;
    };
    for (let f = 0; f < fixed.length - 1; f++){
      const p = fixed[f], q = fixed[f + 1];
      if (q - p < 2) continue;                       // nothing free between them
      const xp = mine[p].x, xq = mine[q].x;
      if (xq <= xp){
        console.warn(`rhythm: ${mine[p].y} at ${xp | 0} is not left of ${mine[q].y} at ${xq | 0}`);
        continue;
      }
      for (let i = p + 1; i < q; i++)
        shove(mine[i], xp + (xq - xp) * (i - p) / (q - p) - mine[i].x);
    }
    /* Even intervals are not enough on their own: a bay-owned beat holds its
       place, so an evenly-spaced neighbour can be pushed straight on top of it —
       which is how THE FIRST AI CROWN ended up printed through GLIDEWELL.IO.
       After spacing, walk the era and enforce a minimum gap, pushing away from
       whichever of the pair is pinned. */
    const MIN = 640;
    mine.sort((p, q) => p.x - q.x);
    for (let i = 1; i < mine.length; i++){
      const L2 = mine[i - 1], R2 = mine[i];
      const gap = R2.x - L2.x;
      if (gap >= MIN) continue;
      const need = MIN - gap;
      if (owns.has(R2.y) && !owns.has(L2.y)) shove(L2, -need);
      else if (owns.has(L2.y) && !owns.has(R2.y)) shove(R2, need);
      else if (!owns.has(L2.y) && !owns.has(R2.y)){ shove(L2, -need / 2); shove(R2, need / 2); }
      else console.warn(`rhythm: ${L2.y} and ${R2.y} are both pinned and ${gap | 0} apart`);
    }
  }
  /* 1988 by hand: the rhythm pass left it farther from 1984 than 1980 is.
     Equal breathing on both sides of 1984 — and the hanging set follows it,
     placed relative to the year in initFilmRelays. */
  {
    const b80 = BEATS.find(b => b.y === '1980'), b84 = BEATS.find(b => b.y === '1984'),
          b88 = BEATS.find(b => b.y === '1988');
    if (b80 && b84 && b88){
      const to = b84.x + (b84.x - b80.x);
      if (to < b88.x) { moved.push([b88.x, to]); b88.x = to; }
    }
  }
  const rekey = obj => {
    const out = {};
    for (const k0 in obj){
      let kx = SHIFT(+k0);
      for (const [from, to] of moved) if (Math.abs(kx - from) < 1) kx = to;
      out[String(kx)] = obj[k0];
    }
    for (const k0 in obj) delete obj[k0];
    Object.assign(obj, out);
  };
  if (typeof STUDY_MORE === 'object') rekey(STUDY_MORE);
  if (typeof STUDY_MEDIA === 'object') rekey(STUDY_MEDIA);
  /* An article is keyed by a beat's coordinate, so a key that matches no beat
     is an article nobody can ever open. Five of them had come loose. Snap any
     stray to the beat it plainly belongs to and say so, rather than letting the
     page quietly go missing. */
  const snap = (obj, nm) => {
    for (const k0 of Object.keys(obj)){
      const kx = +k0;
      if (BEATS.some(b => b.x === kx)) continue;
      let best = null, bd = 1e9;
      for (const b of BEATS){ const d = Math.abs(b.x - kx); if (d < bd){ bd = d; best = b; } }
      if (best && bd <= 400){
        console.warn(`${nm}: key ${kx} matches no beat — snapped to ${best.y} at ${best.x|0} (${bd|0} away)`);
        obj[best.x] = obj[k0]; delete obj[k0];
      } else console.error(`${nm}: key ${kx} matches no beat and nothing is near it`);
    }
  };
  if (typeof STUDY_MORE === 'object') snap(STUDY_MORE, 'STUDY_MORE');
  if (typeof STUDY_MEDIA === 'object') snap(STUDY_MEDIA, 'STUDY_MEDIA');
  for (const it of FG_ITEMS) it.x = SHIFT(it.x);
}
const INTRO_X = -650;
const WORLD_END = SHIFT(29680);
const SEAM_3 = SHIFT(19980);
const REC2_L = SEAM_3 - 540, REC2_R = SEAM_3 + 540;   // the Digital Revolution recreation
const REC_L = SHIFT(6350), REC_R = SHIFT(7450);   // era 1 ends; the 1979 recreation; era 2 begins
const REC3_L = SHIFT(10600), REC3_R = SHIFT(11700);   // the 1989 National Leader recreation
const REC4_L = SHIFT(25940), REC4_R = SHIFT(26740);   // the 2022 fastscan recreation — the wall turns pure white beyond it
/* The 1993 bay. Cut INSIDE era 2, not at a seam, so no two wall planes meet
   here and the panel simply stands proud of a wall that runs on behind it. The
   cut is 1500 wide and the panel takes the middle 950: that leaves 725 units of
   plain wall on each side, the breathing room the other recreations have. */
const REC93_L = bayStart(2) + 275, REC93_R = bayStart(2) + 1225;
/* The 2018 bay, cut inside era 4 for the same reason: no seam to bridge. */
const REC18_L = bayStart(3) + 300, REC18_R = bayStart(3) + 1200;
/* The 2023 bay: the crossing. Cut inside era 4, 2000 wide, panel in the middle
   900 — 710 units of clear wall after the 2022 portal, 840 before the next. */
const REC23_L = bayStart(4) + 550, REC23_R = bayStart(4) + 1450;

/* Era segments: the space itself ages. Wall recedes (z grows), materials,
   light and typography change; each seam is crossed through a doorway. */
const SEGMENTS = [
  {x0:-3450, x1:REC_L, z0:550, z1:550, tz:550, wall:'wall1', bench:'bench1', front:'front1',
   plateBench: true,     // this era's counter IS the centrepiece photograph, stretched

  {x0:REC_R, x1:REC3_L, z0:680, z1:680, tz:680, wall:'wall2', bench:'bench2', front:'front2',
   font:'"Helvetica Neue", Helvetica, Arial, sans-serif',
   ink:'223,226,214', lamp:'tube', dust:false,
   rail:'rgba(165,175,172,0.5)', railInk:'rgba(198,208,202,0.7)',
   light:{pool:'214,240,224', poolR:820, poolA:0.20},
   bgc:[10,12,11], grain:0.014},
  {x0:REC3_R, x1:REC2_L, z0:850, z1:850, tz:680, wall:'wall3', bench:'bench3', front:'front3',
   font:'Verdana, Tahoma, "DejaVu Sans", sans-serif',
   ink:'226,232,238', lamp:'tube', dust:false,
   rail:'rgba(185,196,202,0.5)', railInk:'rgba(212,222,228,0.75)',
   light:{pool:'218,232,252', poolR:1250, poolA:0.13},
   bgc:[26,29,34], grain:0},
  {x0:REC2_R, x1:WORLD_END+2800, z0:1400, z1:1400, tz:680, wall:'wall4', bench:'bench4', front:'front4',
   font:'"Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif',
   ink:'55,64,76', lamp:'tube', dust:false,
   rail:'rgba(120,132,142,0.5)', railInk:'rgba(70,80,92,0.8)',
   light:{pool:'225,240,255', poolR:1350, poolA:0.12},
   bgc:[30,33,38], grain:0, bInsetR:4100, shade:0.46, floor:true},
];
const SEAMS = [];   // era changes happen through the recreations now
/* (dormant) the generated flyover clip can still play across the 1989
   recreation later — the mechanic stays, the trigger is parked far away */
const SPLICE = {dur: 1.5};
function spliceEdges(){
  return {inL: -99999, outR: -99990};
}
/* where the guided tour is allowed to stop: every stop is a finished
   composition whose apex belongs at the exact center of the screen */
let ATTRACT_STOPS = [];
function initAttractStops(){
  const s = new Set();
  for (const b of BEATS){
    if (b.ped) s.add(b.x + (b.ped.dx ?? -430));
    else if (b.tier === 1) s.add(b.x);
  }
  s.add((REC_L + REC_R) / 2);       // 1979 · the map wall
  s.add((REC3_L + REC3_R) / 2);     // 1989 · national leader
  s.add((REC2_L + REC2_R) / 2);     // the digital revolution
  for (const p of PLATES) s.add(p.x);   // the generated bay is a composition: stop dead centre
  s.add(FACT_X);                    // the robotic line
  s.add(STAGE_X);                   // Jim on stage
  s.add(FIN_X);                     // the product still life closes the tour
  ATTRACT_STOPS = [...s].sort((a, b) => a - b);
}
function segIdx(x){ for (let i = SEGMENTS.length-1; i > 0; i--) if (x >= SEGMENTS[i].x0) return i; return 0; }
function segAt(x){ return SEGMENTS[segIdx(x)]; }
function mixN(a,b,t){ return a+(b-a)*t; }
/* the wall runs parallel to the rail: one constant depth per era,
   stepping further from the bench at each recreation */
function wallZAt(x){
  return segAt(x).z0;
}
/* The average colour of a wall texture, measured once by letting the browser
   downscale it to a single pixel. */
const WALL_TONE = new Map();
function wallTone(tex){
  let c = WALL_TONE.get(tex);
  if (c) return c;
  try {
    const s1 = document.createElement('canvas');
    s1.width = s1.height = 1;
    const g1 = s1.getContext('2d', {willReadFrequently: true});
    g1.drawImage(tex, 0, 0, 1, 1);
    const d = g1.getImageData(0, 0, 1, 1).data;
    c = `rgb(${d[0]},${d[1]},${d[2]})`;
  } catch (e){ c = '#9aa0a4'; }
  WALL_TONE.set(tex, c);
  return c;
}
/* THE RIVET LAW — one plane, not two.
   Everything hung on the wall (years, captions, photos, plasmas, banners)
   takes its horizontal anchor from the era's EXHIBITION PLANE, the same
   plane the composition is designed on. Two planes always drift apart: the
   wall in era 4 stands at z=1400 while the type sits at 680, so a screen
   anchored to the masonry and a year anchored to the type separate by 180 px
   for every 1000 units the camera travels — the year stays put and its own
   plasma slides across the neighbouring exhibit. Chosen deliberately: drift
   against the physical wall is invisible where that wall is featureless
   (era 4 is flat white), while drift between a year and its exhibit destroys
   the composition. Anything mounted ON a recreation panel carries `pz` and is
   pinned to that panel instead. auditRivets() (?audit) checks the law against
   the real rendered frame. */
function exhibitZ(wx){ const s = segAt(wx); return (s.tz || s.z0 || 550) - 8; }
function wallSX(wx, dxWorld, kSpread){
  const ke = k(exhibitZ(wx));
  return px(wx, ke) + (dxWorld || 0) * (kSpread || ke) * SS;
}
/* Rivet audit: while RIVET_PROBE is set, draw passes register their real
   rendered anchors here; auditRivets() renders the hall twice per beat with
   the camera shifted and asserts each anchor moved at its wall's parallax
   rate. Run with ?audit in the URL. Any future code that draws a wall thing
   off its plane fails this at boot — loudly. */
let RIVET_PROBE = null;
function rivet(key, sx, kExp){ if (RIVET_PROBE) RIVET_PROBE.set(key, {sx, kExp}); }
function auditRivets(){
  if (!W || !H){ resize(); }
  if (!W || !H){ console.warn('rivet audit skipped: zero viewport'); return; }
  const saved = {x: cam.x, z: cam.z, zT: cam.zTarget, vel: cam.vel, mode: state.mode};
  cam.z = 0; cam.zTarget = 0; cam.vel = 0; state.mode = 'live';
  const bad = [];
  for (const b of BEATS){
    const probe = [];
    for (const dx of [0, 120]){
      cam.x = b.x - 420 + dx;
      RIVET_PROBE = new Map();
      frame();
      probe.push(RIVET_PROBE);
      RIVET_PROBE = null;
    }
    for (const [key, p1] of probe[0]){
      const p2 = probe[1].get(key);
      if (!p2) continue;
      const slope = (p2.sx - p1.sx) / 120;
      if (Math.abs(slope + p1.kExp * SS) > 0.06 * SS)
        bad.push(`${key}: moves at k=${(-slope/SS).toFixed(3)}, its wall is k=${p1.kExp.toFixed(3)}`);
    }
  }
  cam.x = saved.x; cam.z = saved.z; cam.zTarget = saved.zT; cam.vel = saved.vel; state.mode = saved.mode;
  if (bad.length) console.error('RIVET AUDIT — objects sliding on the wall:\n' + [...new Set(bad)].join('\n'));
  else console.log('rivet audit clean: every wall anchor moves with its wall');
}
/* Captions ride the wall parallax now, so two neighbours can meet where
   the text plane once spread them apart. The law says text never overlaps:
   the later caption steps down one lane (staggered museum labels) and its
   thesis follows. The year numerals never move. Runs at boot, data-driven —
   new beats are covered automatically. */
function initCapLanes(){
  const mc = document.createElement('canvas').getContext('2d');
  const items = [];
  for (const b of BEATS){
    if (b.under || b.plaque || !b.t) continue;
    const seg = segAt(b.x);
    const sc = (b.minor ? 0.6 : 1) * (seg.tScale || 1);
    mc.font = eraFont(46 * sc, '', seg.font);
    const wpx = mc.measureText(b.t).width + Math.max(0, b.t.length - 1) * 9 * sc;
    const kT = k((seg.tz || wallZAt(b.x)) - 8);
    items.push({b, half: wpx * kT / 2});
    b._capDrop = 0;
  }
  items.sort((a, c) => a.b.x - c.b.x);
  for (let i = 1; i < items.length; i++){
    const A = items[i-1], B = items[i];
    if (A.b._capDrop) continue;   // compare against the standing lane only
    const kT = Math.min(k((segAt(A.b.x).tz || wallZAt(A.b.x)) - 8), k((segAt(B.b.x).tz || wallZAt(B.b.x)) - 8));
    const dist = (B.b.x - A.b.x) * kT;
    if (dist < A.half + B.half + 14) B.b._capDrop = 44;
  }
}

/* Static placement audit — runs at every boot (cheap, data-level):
   gravity for table things, and no un-pinned wall photo inside a
   recreation span (the panel there stands proud of the era wall —
   such a photo MUST carry pz or it will crawl across the panel). */
function auditStatics(){
  const bad = [];
  /* Every wall edge that meets something on another plane must be declared, or
     a slot of naked background opens there and widens as you walk away. This is
     the guard for that: it is not enough to have fixed the six seams once. */
  for (const seg of SEGMENTS){
    for (const [side, wx] of [['x0', seg.x0], ['x1', seg.x1]]){
      const zp = abutPanelZ(wx);
      if (zp != null){
        if (Math.abs(zp - seg.z0) < 1) continue;      // same plane, nothing to bridge
        continue;                                      // declared: drawWall bridges it
      }
      const nb = SEGMENTS.find(o => o !== seg &&
        (Math.abs(o.x0 - wx) < 1 || Math.abs(o.x1 - wx) < 1));
      if (nb && Math.abs(nb.z0 - seg.z0) > 1)
        bad.push(`wall seam on two planes and nothing declared to bridge it: ` +
                 `${side}=${wx|0}, z ${seg.z0} vs ${nb.z0} ` +
                 `(${Math.abs(1000*(k(seg.z0)-k(nb.z0))).toFixed(0)} px of slot per 1000 units)`);
    }
  }
  for (const b of BEATS){
    for (const it of (b.table || [])){
      const x = b.x + (it.dx || 0), half = (it.w || 120) * 0.5;
      if (!TABLES.some(tb => x - half >= tb.x0 && x + half <= tb.x1))
        bad.push(`table item off any table: ${b.y} ${it.img || ''} @${x|0}`);
    }
    for (const it of (b.st || [])){
      const x = b.x + (it.dx || 0), half = (it.w || 120) * 0.28;
      if (!TABLES.some(tb => x - half >= tb.x0 && x + half <= tb.x1))
        bad.push(`standing print off any table: ${b.y} ${it.img || ''} @${x|0}`);
    }
    if (b.rig && !b.rig.floor){
      const x = b.x + (b.rig.dx || 0), half = (b.rig.w || 240) * 0.5;
      if (!TABLES.some(tb => x - half >= tb.x0 && x + half <= tb.x1))
        bad.push(`machine off any table: ${b.y} ${b.rig.kind} @${x|0}`);
    }
    for (const it of (b.wall || [])){
      if (it.pz != null) continue;
      const x = b.x + it.dx;
      const inRec = (x > REC_L && x < REC_R) || (x > REC3_L && x < REC3_R) ||
                    (x > REC93_L && x < REC93_R) || (x > REC18_L && x < REC18_R) ||
                    (x > REC23_L && x < REC23_R) ||
                    (x > REC2_L && x < REC2_R) || (x > REC4_L && x < REC4_R);
      if (inRec) bad.push(`wall photo inside a recreation without pz: ${b.y} ${it.img} @${x|0} — pin it to the panel`);
    }
  }
  for (const p of PROPS){
    if (p.mid) continue;
    const half = (p.w || 120) * 0.5;
    if (!TABLES.some(tb => p.x - half >= tb.x0 - 20 && p.x + half <= tb.x1 + 20))
      bad.push(`prop off any table: ${p.kind} @${p.x|0}`);
  }
  if (bad.length) console.error('PLACEMENT AUDIT:\n' + bad.join('\n'));
}
/* ambient color/grain, blended across seam zones */
function ambient(x){
  const i = segIdx(x), s = SEGMENTS[i];
  const out = {bg:[...s.bgc], grain:s.grain};
  const blend = (o, t) => { out.bg = out.bg.map((v,j)=>mixN(v,o.bgc[j],t)); out.grain = mixN(out.grain,o.grain,t); };
  if (i+1 < SEGMENTS.length){
    const t = Math.max(0, Math.min(1, (x - (SEGMENTS[i+1].x0 - 500)) / 1000));
    if (t > 0) blend(SEGMENTS[i+1], t);
  }
  if (i > 0){
    const t = Math.max(0, Math.min(1, ((SEGMENTS[i].x0 + 500) - x) / 1000));
    if (t > 0) blend(SEGMENTS[i-1], t);
  }
  return out;
}

/* ---------------- ASSET DECODE ---------------- */
const IMGS = {};   // name -> {el, canvas (processed), w, h}
function loadAssets(){
  const names = Object.keys(window.ASSETS || {});
  return Promise.all(names.map(n => new Promise(res => {
    const el = new Image();
    el.onload = () => { IMGS[n] = {el, w: el.width, h: el.height}; res(); };
    el.onerror = () => { console.warn('asset failed', n); res(); };
    el.src = ASSETS[n];
  })));
}

/* Preprocess: tone + paper/frame + baked shadow, all into offscreen canvases. */
function makePrint(name, opts){
  const src = IMGS[name]; if (!src) return null;
  const style = opts.style || 'frame';    // 'frame' | 'print' | 'metal' | 'print2' | 'plastic'
  const pad = {frame:26, print:16, metal:44, print2:14, plastic:18, white:46}[style];
  const sh = 30;                                 // shadow margin
  const w = src.w + pad*2, h = src.h + pad*2;
  const c = document.createElement('canvas');
  c.width = w + sh*2; c.height = h + sh*2;
  const g = c.getContext('2d');
  // baked drop shadow
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.fillStyle = '#000';
  g.fillRect(sh, sh, w, h);
  g.restore();
  if (style === 'frame'){
    // dark wood frame with bevel
    const fg = g.createLinearGradient(sh, sh, sh, sh+h);
    fg.addColorStop(0, '#3a2a1a'); fg.addColorStop(.5, '#241708'); fg.addColorStop(1, '#170e05');
    g.fillStyle = fg; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,220,160,0.13)'; g.lineWidth = 4;
    g.strokeRect(sh+3, sh+3, w-6, h-6);
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'metal'){
    // 80s office: thin brushed-aluminum frame + white mat
    const mg = g.createLinearGradient(sh, sh, sh+w, sh+h);
    mg.addColorStop(0, '#63676c'); mg.addColorStop(.5, '#2c2f32'); mg.addColorStop(1, '#53575b');
    g.fillStyle = mg; g.fillRect(sh, sh, w, h);
    g.fillStyle = '#e9e8e1'; g.fillRect(sh+10, sh+10, w-20, h-20);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 2;
    g.strokeRect(sh+pad-2, sh+pad-2, src.w+4, src.h+4);
  } else if (style === 'white'){
    // gallery frame: white moulding + wide mat
    g.fillStyle = '#eceae3'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2;
    g.strokeRect(sh+1, sh+1, w-2, h-2);
    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.strokeRect(sh+10, sh+10, w-20, h-20);
    g.fillStyle = '#faf9f5'; g.fillRect(sh+12, sh+12, w-24, h-24);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'plastic'){
    // 90s: thin black plastic frame, no mat
    g.fillStyle = '#1b1c1e'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
    g.strokeRect(sh+1.5, sh+1.5, w-3, h-3);
  } else if (style === 'print2'){
    // crisp lab print, white border
    g.fillStyle = '#f0ede3'; g.fillRect(sh, sh, w, h);
  } else {
    // aged paper print border
    g.fillStyle = '#e8dcc2'; g.fillRect(sh, sh, w, h);
    g.fillStyle = 'rgba(120,90,40,0.12)'; g.fillRect(sh, sh, w, h);
  }
  // photo, era-toned
  g.save();
  g.filter = opts.tone || 'sepia(0.5) saturate(0.75) contrast(1.04) brightness(0.96)';
  g.drawImage(src.el, sh+pad, sh+pad);
  g.restore();
  // warm glass sheen
  const sheen = g.createLinearGradient(sh, sh, sh+w*0.7, sh+h);
  sheen.addColorStop(0, 'rgba(255,235,190,0.10)'); sheen.addColorStop(.4, 'rgba(255,235,190,0.0)');
  g.fillStyle = sheen; g.fillRect(sh+pad, sh+pad, src.w, src.h);
  return {c, w: c.width, h: c.height, inner: {x: sh, y: sh, w, h}};
}

/* ---------------- PROCEDURAL TEXTURES ---------------- */
function noiseTile(size, alpha){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const id = g.createImageData(size, size);
  for (let i = 0; i < id.data.length; i += 4){
    const v = 128 + (Math.random()*2-1)*110;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = alpha*255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function woodTexture({w=1024, h=1024, plank='v', plankSize=170, base='#241708', light='#3d2a13', gapCol='rgba(0,0,0,.55)'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const across = plank === 'v' ? w : h;
  const nP = Math.round(across / plankSize);
  for (let p = 0; p < nP; p++){
    const a0 = p * across / nP, aw = across / nP;
    const tone = 0.75 + Math.random()*0.5;
    g.save();
    if (plank === 'v'){ g.translate(a0, 0); } else { g.translate(0, a0); }
    const grad = g.createLinearGradient(0, 0, plank==='v'?aw:0, plank==='v'?0:aw);
    grad.addColorStop(0, base); grad.addColorStop(.5, light); grad.addColorStop(1, base);
    g.globalAlpha = tone * 0.9;
    g.fillStyle = grad;
    g.fillRect(0, 0, plank==='v'?aw:w, plank==='v'?h:aw);
    // grain streaks along plank
    g.globalAlpha = 1;
    for (let s = 0; s < 26; s++){
      g.strokeStyle = `rgba(${Math.random()<.5?'0,0,0':'255,215,150'},${(Math.random()*0.10+0.03).toFixed(3)})`;
      g.lineWidth = Math.random()*2+0.5;
      g.beginPath();
      const along = plank==='v'?h:w;
      const off = Math.random()*(plank==='v'?aw:aw);
      let px = off, py = -20;
      g.moveTo(plank==='v'?px:py, plank==='v'?py:px);
      for (let t = 0; t < along+40; t += 60){
        px += (Math.random()*2-1)*6;
        py += 60;
        g.lineTo(plank==='v'?px:py, plank==='v'?py:px);
      }
      g.stroke();
    }
    // plank gap
    g.strokeStyle = gapCol; g.lineWidth = 2.5;
    g.beginPath();
    if (plank === 'v'){ g.moveTo(0.5,0); g.lineTo(0.5,h); } else { g.moveTo(0,0.5); g.lineTo(w,0.5); }
    g.stroke();
    g.restore();
  }
  // dirt/noise
  const nz = noiseTile(256, 0.05);
  g.globalAlpha = 1; g.fillStyle = g.createPattern(nz, 'repeat');
  g.fillRect(0,0,w,h);
  return c;
}
function panelTexture({w=1200, h=900, base='#6e6b5e', groove=280}){
  // painted 80s workshop panelling
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.09)');
  vg.addColorStop(.5, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  for (let x = groove/2; x < w; x += groove){
    g.fillStyle = 'rgba(0,0,0,0.26)'; g.fillRect(x, 0, 3, h);
    g.fillStyle = 'rgba(255,255,255,0.09)'; g.fillRect(x+3, 0, 2, h);
  }
  for (let i = 0; i < 90; i++){  // scuffs and stains — soft, barely-there
    g.fillStyle = `rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${(Math.random()*0.02).toFixed(3)})`;
    g.beginPath();
    g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*130, 8+Math.random()*26, Math.random()*3, 0, 7);
    g.fill();
  }
  const nz = noiseTile(256, 0.035);
  g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(0,0,w,h);
  return c;
}
function formicaTexture({w=1200, h=512, base='#867f71'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i = 0; i < 9000; i++){   // speckle
    g.fillStyle = `rgba(${Math.random()<.55?'42,40,32':'236,233,222'},${(0.05+Math.random()*0.12).toFixed(3)})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1.7, 1.7);
  }
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.12)');
  vg.addColorStop(.4, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.2)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  return c;
}

/* ---------------- INPUT ABSTRACTION ----------------
   Single point where the physical control plugs in.
   A driver pushes: impulse(dv) — velocity kick along the rail (world units/s),
                    action()    — the one button (focus / wake).
   Mouse today, flywheel encoder tomorrow: replace/add a driver, nothing else. */
const Input = (() => {
  let impulse = 0, action = false, anyInput = false, dragging = false;
  const api = {
    hover: null,   // last pointer position in canvas-buffer coords
    consume(){
      const out = {impulse, action, anyInput, dragging};
      impulse = 0; action = false; anyInput = false;
      return out;
    },
    push(dv){ impulse += dv; anyInput = true; },
    act(pt){ action = pt || true; anyInput = true; },
    setDragging(v){ dragging = v; anyInput = true; document.body.classList.toggle('dragging', v); },
  };
  return api;
})();
function toBuf(e){ return {x: e.clientX * (W / innerWidth), y: e.clientY * (H / innerHeight)}; }

function attachMouseDriver(el){
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
    Input.push(d * CFG.wheelGain);
  }, {passive:false});
  let lastX = 0, moved = 0, down = false;
  el.addEventListener('pointerdown', e => {
    down = true; moved = 0; lastX = e.clientX;
    const pt = toBuf(e);
    // the rule takes the pointer before the hall does: dragging its thumb
    // scrubs the century instead of shoving the bench
    // arm the scrub, but do not move yet: a press is not a jump. Grabbing the
    // thumb anywhere on its body keeps that grip point, so it never snaps its
    // centre under the cursor.
    if (musicMarkHit(pt)){ toggleMusic(); down = false; return; }
    if (soundMarkHit(pt)){ toggleSound(); down = false; return; }
    if (ruleHit(pt)){
      const g = ruleGeom();
      const grabbed = Math.abs(g.at(cam.x) - pt.x) < Math.max(18 * SS, (g.at(cam.x + g.half) - g.at(cam.x - g.half)) / 2);
      state.ruleDrag = {off: grabbed ? cam.x - g.toWorld(pt.x) : 0};
    }
    Input.setDragging(true); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    Input.hover = toBuf(e);
    if (!down) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    if (state.ruleDrag){
      if (moved > 3) ruleSeek(toBuf(e), true, state.ruleDrag.off);
      Input.push(0);
      return;
    }
    // convert screen drag to world velocity kick (grab the bench, z=0)
    Input.push(-dx * 30);
  });
  el.addEventListener('pointerup', e => {
    down = false; Input.setDragging(false);
    if (state.ruleDrag){
      const dragged = moved >= 6;
      state.ruleDrag = null;
      if (!dragged) ruleSeek(toBuf(e), false);   // a tap glides there instead
      return;                                    // the rule never opens a year
    }
    if (moved < 6) Input.act(toBuf(e));  // a click = the button, aimed at a point
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') Input.push(900);
    else if (e.key === 'ArrowLeft') Input.push(-900);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Input.act(); }
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (e.key === 'm' || e.key === 'M' || e.key === '\u044c' || e.key === '\u042c') toggleMusic();
  });
}

/* ---------------- CAMERA / STATE ---------------- */
const cam = { x: INTRO_X, vel: 0, z: 430, zTarget: 430 };   // the tour opens zoomed tight on the still life
const state = {
  mode: 'attract',        // 'attract' | 'live'
  idle: 0,
  attract: { phase: 'dwell', dwell: -2.2, beatIdx: -1, fade: 0 }, // opens holding the title close-up
  focusBeat: -1,          // index of beat we are dollied into
  focusAnchor: null,      // world x the dolly centers on (defaults to the beat)
  albumLock: {},          // per-beat album override: true=open, false=closed
  inspect: null,          // a photo lifted to the camera
  study: null,            // the era reading page {beat, imgs, scroll, amt}
  restBeat: -1, restTime: 0,
  introHold: true,        // holding the opening close-up until the first move,
  introFade: 1,           // darkness over the hall until the tour begins
  ruleA: 0,               // the century rule fades in once the tour is under way
  splice: null,           // {dir, t} while the yard splice is playing
  spliceSide: 'L',        // which side of the yard we were on
  time: 0,
