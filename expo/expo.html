/* THE CUTS — the timeline can be sliced in several places; everything
   downstream of each cut slides right by its width, opening an empty bay.
   Written in ORIGINAL coordinates and applied in order, so adding a cut never
   requires renumbering the ones after it. Every world anchor below is filtered
   through SHIFT, and the boot pass moves the beats and re-keys their study
   texts, so tables, lights, attract stops and audits are all built from
   already-shifted data. With every cut off, SHIFT is the identity. */
const CUTS = [
  // the threshold: the drawer bank and the change of wall need a bay of their
  // own, or they lean into the era that follows
  {at: 1900, w: 700, on: true},
  // the founding: Jim's own bench, standing where the year stands
  {at: 2450, w: 2320, on: !/[?&]noplate/.test(location.search)},
];
function SHIFT(x){
  let s = 0;
  for (const c of CUTS) if (c.on && x >= c.at) s += c.w;
  return x + s;
}
/* where a cut's own bay begins on the final line: its position carries the
   cuts BEFORE it, but not its own */
function bayStart(i){
  let s = 0;
  for (let j = 0; j < i; j++) if (CUTS[j].on) s += CUTS[j].w;
  return CUTS[i].at + s;
}
const GAP = CUTS[1];
function applyCut(){
  if (!CUTS.some(c => c.on) || GAP.done) return;
  GAP.done = true;
  // only raw literals move here: SEGMENTS and the world anchors were already
  // filtered through SHIFT when the script was parsed
  for (const b of BEATS) b.x = SHIFT(b.x);
  // the founding beat owns the bay its bench stands in: it sits at its centre
  if (CUTS[1].on){
    const f = BEATS.find(b => b.y === '1970');
    if (f) f.x = bayStart(1) + CUTS[1].w / 2;
  }
  const rekey = obj => {
    const moved = {};
    for (const k0 in obj) moved[String(SHIFT(+k0))] = obj[k0];
    for (const k0 in obj) delete obj[k0];
    Object.assign(obj, moved);
  };
  if (typeof STUDY_MORE === 'object') rekey(STUDY_MORE);
  if (typeof STUDY_MEDIA === 'object') rekey(STUDY_MEDIA);
  for (const it of FG_ITEMS) it.x = SHIFT(it.x);
}

function segIdx(x){ for (let i = SEGMENTS.length-1; i > 0; i--) if (x >= SEGMENTS[i].x0) return i; return 0; }
function segAt(x){ return SEGMENTS[segIdx(x)]; }
function mixN(a,b,t){ return a+(b-a)*t; }

function wallZAt(x){

/* THE RIVET LAW — one plane, not two.
   Everything hung on the wall (years, captions, photos, plasmas, banners)
   takes its horizontal anchor from the era's EXHIBITION PLANE, the same
   plane the composition is designed on. Two planes always drift apart: the
   wall in era 4 stands at z=1400 while the type sits at 680, so a screen
   anchored to the masonry and a year anchored to the type separate by 180 px
   for every 1000 units the camera travels — the year stays put and its own
   plasma slides across the neighbouring exhibit. Chosen deliberately: drift
   against the physical wall is invisible where that wall is featureless
   (era 4 is flat white), while drift between a year and its exhibit destroys
   the composition. Anything mounted ON a recreation panel carries `pz` and is
   pinned to that panel instead. auditRivets() (?audit) checks the law against
   the real rendered frame. */
function exhibitZ(wx){ const s = segAt(wx); return (s.tz || s.z0 || 550) - 8; }
function wallSX(wx, dxWorld, kSpread){
  const ke = k(exhibitZ(wx));
  return px(wx, ke) + (dxWorld || 0) * (kSpread || ke) * SS;
}
/* Rivet audit: while RIVET_PROBE is set, draw passes register their real
   rendered anchors here; auditRivets() renders the hall twice per beat with
   the camera shifted and asserts each anchor moved at its wall's parallax
   rate. Run with ?audit in the URL. Any future code that draws a wall thing
   off its plane fails this at boot — loudly. */
let RIVET_PROBE = null;
function rivet(key, sx, kExp){ if (RIVET_PROBE) RIVET_PROBE.set(key, {sx, kExp}); }
function auditRivets(){
  if (!W || !H){ resize(); }
  if (!W || !H){ console.warn('rivet audit skipped: zero viewport'); return; }
  const saved = {x: cam.x, z: cam.z, zT: cam.zTarget, vel: cam.vel, mode: state.mode};
  cam.z = 0; cam.zTarget = 0; cam.vel = 0; state.mode = 'live';
  const bad = [];
  for (const b of BEATS){
    const probe = [];
    for (const dx of [0, 120]){
      cam.x = b.x - 420 + dx;
      RIVET_PROBE = new Map();
      frame();
      probe.push(RIVET_PROBE);
      RIVET_PROBE = null;
    }
    for (const [key, p1] of probe[0]){
      const p2 = probe[1].get(key);
      if (!p2) continue;
      const slope = (p2.sx - p1.sx) / 120;
      if (Math.abs(slope + p1.kExp * SS) > 0.06 * SS)
        bad.push(`${key}: moves at k=${(-slope/SS).toFixed(3)}, its wall is k=${p1.kExp.toFixed(3)}`);
    }
  }
  cam.x = saved.x; cam.z = saved.z; cam.zTarget = saved.zT; cam.vel = saved.vel; state.mode = saved.mode;
  if (bad.length) console.error('RIVET AUDIT — objects sliding on the wall:\n' + [...new Set(bad)].join('\n'));
  else console.log('rivet audit clean: every wall anchor moves with its wall');
}
/* Captions ride the wall parallax now, so two neighbours can meet where
   the text plane once spread them apart. The law says text never overlaps:
   the later caption steps down one lane (staggered museum labels) and its
   thesis follows. The year numerals never move. Runs at boot, data-driven —
   new beats are covered automatically. */
function initCapLanes(){
  const mc = document.createElement('canvas').getContext('2d');
  const items = [];
  for (const b of BEATS){
    if (b.under || b.plaque || !b.t) continue;
    const seg = segAt(b.x);
    const sc = (b.minor ? 0.6 : 1) * (seg.tScale || 1);
    mc.font = eraFont(46 * sc, '', seg.font);
    const wpx = mc.measureText(b.t).width + Math.max(0, b.t.length - 1) * 9 * sc;
    const kT = k((seg.tz || wallZAt(b.x)) - 8);
    items.push({b, half: wpx * kT / 2});
    b._capDrop = 0;
  }
  items.sort((a, c) => a.b.x - c.b.x);
  for (let i = 1; i < items.length; i++){
    const A = items[i-1], B = items[i];
    if (A.b._capDrop) continue;   // compare against the standing lane only
    const kT = Math.min(k((segAt(A.b.x).tz || wallZAt(A.b.x)) - 8), k((segAt(B.b.x).tz || wallZAt(B.b.x)) - 8));
    const dist = (B.b.x - A.b.x) * kT;
    if (dist < A.half + B.half + 14) B.b._capDrop = 44;
  }
}

/* Static placement audit — runs at every boot (cheap, data-level):
   gravity for table things, and no un-pinned wall photo inside a
   recreation span (the panel there stands proud of the era wall —
   such a photo MUST carry pz or it will crawl across the panel). */
function auditStatics(){
  const bad = [];
  for (const b of BEATS){
    for (const it of (b.table || [])){
      const x = b.x + (it.dx || 0), half = (it.w || 120) * 0.5;
      if (!TABLES.some(tb => x - half >= tb.x0 && x + half <= tb.x1))
        bad.push(`table item off any table: ${b.y} ${it.img || ''} @${x|0}`);
    }
    for (const it of (b.st || [])){
      const x = b.x + (it.dx || 0), half = (it.w || 120) * 0.28;
      if (!TABLES.some(tb => x - half >= tb.x0 && x + half <= tb.x1))
        bad.push(`standing print off any table: ${b.y} ${it.img || ''} @${x|0}`);
    }
    for (const it of (b.wall || [])){
      if (it.pz != null) continue;
      const x = b.x + it.dx;
      const inRec = (x > REC_L && x < REC_R) || (x > REC3_L && x < REC3_R) ||
                    (x > REC2_L && x < REC2_R) || (x > REC4_L && x < REC4_R);
      if (inRec) bad.push(`wall photo inside a recreation without pz: ${b.y} ${it.img} @${x|0} — pin it to the panel`);
    }
  }
  for (const p of PROPS){
    if (p.mid) continue;
    const half = (p.w || 120) * 0.5;
    if (!TABLES.some(tb => p.x - half >= tb.x0 - 20 && p.x + half <= tb.x1 + 20))
      bad.push(`prop off any table: ${p.kind} @${p.x|0}`);
  }
  if (bad.length) console.error('PLACEMENT AUDIT:\n' + bad.join('\n'));
}
/* ambient color/grain, blended across seam zones */
function ambient(x){
  const i = segIdx(x), s = SEGMENTS[i];
  const out = {bg:[...s.bgc], grain:s.grain};
  const blend = (o, t) => { out.bg = out.bg.map((v,j)=>mixN(v,o.bgc[j],t)); out.grain = mixN(out.grain,o.grain,t); };
  if (i+1 < SEGMENTS.length){
    const t = Math.max(0, Math.min(1, (x - (SEGMENTS[i+1].x0 - 500)) / 1000));
    if (t > 0) blend(SEGMENTS[i+1], t);
  }
  if (i > 0){
    const t = Math.max(0, Math.min(1, ((SEGMENTS[i].x0 + 500) - x) / 1000));
    if (t > 0) blend(SEGMENTS[i-1], t);
  }
  return out;
}

/* ---------------- ASSET DECODE ---------------- */
const IMGS = {};   // name -> {el, canvas (processed), w, h}
function loadAssets(){
  const names = Object.keys(window.ASSETS || {});
  return Promise.all(names.map(n => new Promise(res => {
    const el = new Image();
    el.onload = () => { IMGS[n] = {el, w: el.width, h: el.height}; res(); };
    el.onerror = () => { console.warn('asset failed', n); res(); };
    el.src = ASSETS[n];
  })));
}

/* Preprocess: tone + paper/frame + baked shadow, all into offscreen canvases. */
function makePrint(name, opts){
  const src = IMGS[name]; if (!src) return null;
  const style = opts.style || 'frame';    // 'frame' | 'print' | 'metal' | 'print2' | 'plastic'
  const pad = {frame:26, print:16, metal:44, print2:14, plastic:18, white:46}[style];
  const sh = 30;                                 // shadow margin
  const w = src.w + pad*2, h = src.h + pad*2;
  const c = document.createElement('canvas');
  c.width = w + sh*2; c.height = h + sh*2;
  const g = c.getContext('2d');
  // baked drop shadow
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.fillStyle = '#000';
  g.fillRect(sh, sh, w, h);
  g.restore();
  if (style === 'frame'){
    // dark wood frame with bevel
    const fg = g.createLinearGradient(sh, sh, sh, sh+h);
    fg.addColorStop(0, '#3a2a1a'); fg.addColorStop(.5, '#241708'); fg.addColorStop(1, '#170e05');
    g.fillStyle = fg; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,220,160,0.25)'; g.lineWidth = 2;
    g.strokeRect(sh+2, sh+2, w-4, h-4);
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'metal'){
    // 80s office: thin brushed-aluminum frame + white mat
    const mg = g.createLinearGradient(sh, sh, sh+w, sh+h);
    mg.addColorStop(0, '#63676c'); mg.addColorStop(.5, '#2c2f32'); mg.addColorStop(1, '#53575b');
    g.fillStyle = mg; g.fillRect(sh, sh, w, h);
    g.fillStyle = '#e9e8e1'; g.fillRect(sh+10, sh+10, w-20, h-20);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 2;
    g.strokeRect(sh+pad-2, sh+pad-2, src.w+4, src.h+4);
  } else if (style === 'white'){
    // gallery frame: white moulding + wide mat
    g.fillStyle = '#eceae3'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2;
    g.strokeRect(sh+1, sh+1, w-2, h-2);
    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.strokeRect(sh+10, sh+10, w-20, h-20);
    g.fillStyle = '#faf9f5'; g.fillRect(sh+12, sh+12, w-24, h-24);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'plastic'){
    // 90s: thin black plastic frame, no mat
    g.fillStyle = '#1b1c1e'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
    g.strokeRect(sh+1.5, sh+1.5, w-3, h-3);
  } else if (style === 'print2'){
    // crisp lab print, white border
    g.fillStyle = '#f0ede3'; g.fillRect(sh, sh, w, h);
  } else {
    // aged paper print border
    g.fillStyle = '#e8dcc2'; g.fillRect(sh, sh, w, h);
    g.fillStyle = 'rgba(120,90,40,0.12)'; g.fillRect(sh, sh, w, h);
  }
  // photo, era-toned
  g.save();
  g.filter = opts.tone || 'sepia(0.5) saturate(0.75) contrast(1.04) brightness(0.96)';
  g.drawImage(src.el, sh+pad, sh+pad);
  g.restore();
  // warm glass sheen
  const sheen = g.createLinearGradient(sh, sh, sh+w*0.7, sh+h);
  sheen.addColorStop(0, 'rgba(255,235,190,0.10)'); sheen.addColorStop(.4, 'rgba(255,235,190,0.0)');
  g.fillStyle = sheen; g.fillRect(sh+pad, sh+pad, src.w, src.h);
  return {c, w: c.width, h: c.height, inner: {x: sh, y: sh, w, h}};
}

/* ---------------- PROCEDURAL TEXTURES ---------------- */
function noiseTile(size, alpha){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const id = g.createImageData(size, size);
  for (let i = 0; i < id.data.length; i += 4){
    const v = 128 + (Math.random()*2-1)*110;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = alpha*255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function woodTexture({w=1024, h=1024, plank='v', plankSize=170, base='#241708', light='#3d2a13', gapCol='rgba(0,0,0,.55)'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const across = plank === 'v' ? w : h;
  const nP = Math.round(across / plankSize);
  for (let p = 0; p < nP; p++){
    const a0 = p * across / nP, aw = across / nP;
    const tone = 0.75 + Math.random()*0.5;
    g.save();
    if (plank === 'v'){ g.translate(a0, 0); } else { g.translate(0, a0); }
    const grad = g.createLinearGradient(0, 0, plank==='v'?aw:0, plank==='v'?0:aw);
    grad.addColorStop(0, base); grad.addColorStop(.5, light); grad.addColorStop(1, base);
    g.globalAlpha = tone * 0.9;
    g.fillStyle = grad;
    g.fillRect(0, 0, plank==='v'?aw:w, plank==='v'?h:aw);
    // grain streaks along plank
    g.globalAlpha = 1;
    for (let s = 0; s < 26; s++){
      g.strokeStyle = `rgba(${Math.random()<.5?'0,0,0':'255,215,150'},${(Math.random()*0.10+0.03).toFixed(3)})`;
      g.lineWidth = Math.random()*2+0.5;
      g.beginPath();
      const along = plank==='v'?h:w;
      const off = Math.random()*(plank==='v'?aw:aw);
      let px = off, py = -20;
      g.moveTo(plank==='v'?px:py, plank==='v'?py:px);
      for (let t = 0; t < along+40; t += 60){
        px += (Math.random()*2-1)*6;
        py += 60;
        g.lineTo(plank==='v'?px:py, plank==='v'?py:px);
      }
      g.stroke();
    }
    // plank gap
    g.strokeStyle = gapCol; g.lineWidth = 2.5;
    g.beginPath();
    if (plank === 'v'){ g.moveTo(0.5,0); g.lineTo(0.5,h); } else { g.moveTo(0,0.5); g.lineTo(w,0.5); }
    g.stroke();
    g.restore();
  }
  // dirt/noise
  const nz = noiseTile(256, 0.05);
  g.globalAlpha = 1; g.fillStyle = g.createPattern(nz, 'repeat');
  g.fillRect(0,0,w,h);
  return c;
}
function panelTexture({w=1200, h=900, base='#6e6b5e', groove=280}){
  // painted 80s workshop panelling
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.09)');
  vg.addColorStop(.5, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  for (let x = groove/2; x < w; x += groove){
    g.fillStyle = 'rgba(0,0,0,0.26)'; g.fillRect(x, 0, 3, h);
    g.fillStyle = 'rgba(255,255,255,0.09)'; g.fillRect(x+3, 0, 2, h);
  }
  for (let i = 0; i < 90; i++){  // scuffs and stains — soft, barely-there
    g.fillStyle = `rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${(Math.random()*0.02).toFixed(3)})`;
    g.beginPath();
    g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*130, 8+Math.random()*26, Math.random()*3, 0, 7);
    g.fill();
  }
  const nz = noiseTile(256, 0.035);
  g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(0,0,w,h);
  return c;
}
function formicaTexture({w=1200, h=512, base='#867f71'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i = 0; i < 9000; i++){   // speckle
    g.fillStyle = `rgba(${Math.random()<.55?'42,40,32':'236,233,222'},${(0.05+Math.random()*0.12).toFixed(3)})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1.7, 1.7);
  }
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.12)');
  vg.addColorStop(.4, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.2)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  return c;
}

/* ---------------- INPUT ABSTRACTION ----------------
   Single point where the physical control plugs in.
   A driver pushes: impulse(dv) — velocity kick along the rail (world units/s),
                    action()    — the one button (focus / wake).
   Mouse today, flywheel encoder tomorrow: replace/add a driver, nothing else. */
const Input = (() => {
  let impulse = 0, action = false, anyInput = false, dragging = false;
  const api = {
    hover: null,   // last pointer position in canvas-buffer coords
    consume(){
      const out = {impulse, action, anyInput, dragging};
      impulse = 0; action = false; anyInput = false;
      return out;
    },
    push(dv){ impulse += dv; anyInput = true; },
    act(pt){ action = pt || true; anyInput = true; },
    setDragging(v){ dragging = v; anyInput = true; document.body.classList.toggle('dragging', v); },
  };
  return api;
})();
function toBuf(e){ return {x: e.clientX * (W / innerWidth), y: e.clientY * (H / innerHeight)}; }

function attachMouseDriver(el){
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
    Input.push(d * CFG.wheelGain);
  }, {passive:false});
  let lastX = 0, moved = 0, down = false;
  el.addEventListener('pointerdown', e => {
    down = true; moved = 0; lastX = e.clientX;
    const pt = toBuf(e);
    // the rule takes the pointer before the hall does: dragging its thumb
    // scrubs the century instead of shoving the bench
    // arm the scrub, but do not move yet: a press is not a jump. Grabbing the
    // thumb anywhere on its body keeps that grip point, so it never snaps its
    // centre under the cursor.
    if (musicMarkHit(pt)){ toggleMusic(); down = false; return; }
    if (ruleHit(pt)){
      const g = ruleGeom();
      const grabbed = Math.abs(g.at(cam.x) - pt.x) < Math.max(18 * SS, (g.at(cam.x + g.half) - g.at(cam.x - g.half)) / 2);
      state.ruleDrag = {off: grabbed ? cam.x - g.toWorld(pt.x) : 0};
    }
    Input.setDragging(true); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    Input.hover = toBuf(e);
    if (!down) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    if (state.ruleDrag){
      if (moved > 3) ruleSeek(toBuf(e), true, state.ruleDrag.off);
      Input.push(0);
      return;
    }
    // convert screen drag to world velocity kick (grab the bench, z=0)
    Input.push(-dx * 30);
  });
  el.addEventListener('pointerup', e => {
    down = false; Input.setDragging(false);
    if (state.ruleDrag){
      const dragged = moved >= 6;
      state.ruleDrag = null;
      if (!dragged) ruleSeek(toBuf(e), false);   // a tap glides there instead
      return;                                    // the rule never opens a year
    }
    if (moved < 6) Input.act(toBuf(e));  // a click = the button, aimed at a point
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') Input.push(900);
    else if (e.key === 'ArrowLeft') Input.push(-900);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Input.act(); }
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (e.key === 'm' || e.key === 'M' || e.key === '\u044c' || e.key === '\u042c') toggleMusic();
  });
}

/* ---------------- CAMERA / STATE ---------------- */
const cam = { x: INTRO_X, vel: 0, z: 430, zTarget: 430 };   // the tour opens zoomed tight on the still life
const state = {
  mode: 'attract',        // 'attract' | 'live'
  idle: 0,
  attract: { phase: 'dwell', dwell: -2.2, beatIdx: -1, fade: 0 }, // opens holding the title close-up
  focusBeat: -1,          // index of beat we are dollied into
  focusAnchor: null,      // world x the dolly centers on (defaults to the beat)
  albumLock: {},          // per-beat album override: true=open, false=closed
  inspect: null,          // a photo lifted to the camera
  study: null,            // the era reading page {beat, imgs, scroll, amt}
  restBeat: -1, restTime: 0,
  introHold: true,        // holding the opening close-up until the first move,
  introFade: 1,           // darkness over the hall until the tour begins
  ruleA: 0,               // the century rule fades in once the tour is under way
  splice: null,           // {dir, t} while the yard splice is playing
  spliceSide: 'L',        // which side of the yard we were on
  time: 0,
};

function nearestBeat(x){
  let best = -1, bd = 1e9;
  for (let i = 0; i < BEATS.length; i++){
    const d = Math.abs(BEATS[i].x - x);
    if (d < bd){ bd = d; best = i; }
  }
  return {i: best, d: bd};
}

/* the long bench is really a row of separate tables */
const BENCH_BREAKS = [1980, 3830, 7350, 9250, 13100, 17900, 22280]
  .map(x => ({x: SHIFT(x), half: 65}));
BENCH_BREAKS.push({x: SHIFT(24870), half: 560});   // the BruxZir Factory line replaces the table
let TABLES = [];
let LIGHT_GRID = [];
function initLights(){
  LIGHT_GRID = [];
  for (const seg of SEGMENTS){
    const a = Math.max(seg === SEGMENTS[0] ? 950 : -400, seg.x0 + 120), b = Math.min(WORLD_END + 300, seg.x1 - 120);
    const n = Math.max(1, Math.round((b - a) / 940));
    const step = (b - a) / n;
    for (let i = 0; i < n; i++){
      let lx = a + step * (i + 0.5);
      for (const bt of BEATS){
        if (bt.fly && Math.abs(bt.x - lx) < 300) lx = bt.x + (lx >= bt.x ? 300 : -300);
        if (bt.ped){
          const px_ = bt.x + (bt.ped.dx ?? 0);
          if (Math.abs(px_ - lx) < 320) lx = px_ + (lx >= px_ ? 320 : -320);
        }
      }
      LIGHT_GRID.push({x: lx, seg});
    }
  }
  // a year is an exhibit: its lamp hangs over it, not beside it
  for (const b of BEATS){
    if (b.minor || b.under || b.plaque || b.ped) continue;
    let best = -1, bd = 1e9;
    for (let i = 0; i < LIGHT_GRID.length; i++){
      const d = Math.abs(LIGHT_GRID[i].x - b.x);
      if (d < bd){ bd = d; best = i; }
    }
    if (best >= 0 && bd < 620) LIGHT_GRID[best].x = b.x;
  }
  LIGHT_GRID.push({x: INTRO_X, seg: SEGMENTS[0]});   // the welcome lamp, dead over the inscription
  LIGHT_GRID.push({x: FIN_X, seg: SEGMENTS[3]});     // and its mirror over the finale
}
function initTables(){
  // every pedestal claims a wide gap of its own, centered on it
  for (const b of BEATS)
    if (b.ped) BENCH_BREAKS.push({x: b.x + (b.ped.dx ?? -430), half: b.ped.gapHalf || 330});
  // A plate needs NO break of its own: it is painted after the bench and simply
  // covers it, and beyond its edges the hall's counter continues on exactly the
  // same line in exactly the same material. Breaks here only opened holes just
  // outside the picture, which read as the counter behind it jutting out.
  // small breaks inside a pedestal zone would skew its centering — drop them
  const wide = BENCH_BREAKS.filter(v => v.half > 200);
  for (let i = BENCH_BREAKS.length - 1; i >= 0; i--){
    const br = BENCH_BREAKS[i];
    if (br.half <= 200 && wide.some(p => Math.abs(p.x - br.x) < p.half + 430))
      BENCH_BREAKS.splice(i, 1);
  }
  // fixed table objects step aside from any gap they would straddle,
  // then a spread pass keeps them from piling onto each other
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    const dodge = it => {
      const half = (it.w || 300) * 0.55 + 30;
      for (const br of BENCH_BREAKS){
        const x = b.x + it.dx;
        if (Math.abs(x - br.x) < br.half + half){
          const dir = x >= br.x ? 1 : -1;
          it.dx = br.x + dir * (br.half + half) - b.x;
        }
      }
    };
    items.forEach(dodge);
    items.sort((p, q) => p.dx - q.dx);
    for (let n = 1; n < items.length; n++){
      const need = ((items[n-1].w||300) + (items[n].w||300)) * 0.5 + 24;
      if (items[n].dx - items[n-1].dx < need){
        items[n].dx = items[n-1].dx + need;
        dodge(items[n]);
      }
    }
  }
  TABLES = [];
  for (const seg of SEGMENTS){
    const bx0 = (seg.x0 <= -2500 && !seg.bInsetL) ? seg.x0 : seg.x0 + (seg.bInsetL != null ? seg.bInsetL : -110);
    const bx1 = (seg.x1 >= WORLD_END + 800 && !seg.bInsetR) ? seg.x1 : seg.x1 - (seg.bInsetR != null ? seg.bInsetR : -110);
    let start = bx0;
    for (const br of BENCH_BREAKS.filter(v => v.x + v.half > bx0 && v.x - v.half < bx1).sort((a,b)=>a.x-b.x)){
      const L = br.x - br.half, R = br.x + br.half;
      if (R <= start + 120) continue;
      if (L > start + 240) TABLES.push({x0: start, x1: L, seg});
      start = Math.max(start, R);
    }
    if (bx1 > start + 240) TABLES.push({x0: start, x1: bx1, seg});
  }
  // the law of gravity: every table object stands on an actual table span,
  // full footprint inside — nothing rides a gap, nothing levitates
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    for (const it of items){
      const half = (it.w || 300) * 0.5 + 20;
      const x = b.x + it.dx;
      if (TABLES.some(tb => x - half >= tb.x0 + 16 && x + half <= tb.x1 - 16)) continue;
      let best = null, bestD = 1e9;
      for (const tb of TABLES){
        if (tb.x1 - tb.x0 < half*2 + 48) continue;
        const cx = Math.max(tb.x0 + 16 + half, Math.min(tb.x1 - 16 - half, x));
        const d = Math.abs(cx - x);
        if (d < bestD){ bestD = d; best = cx; }
      }
      if (best != null) it.dx = best - b.x;
    }
  }
}

/* ---------------- RENDER SETUP ---------------- */
const cv = document.getElementById('view');
cv.style.transform = 'translateZ(0)';   // pin the canvas to its own compositor layer (anti-ghosting)
const ctx = cv.getContext('2d', {alpha:false});
let W = 0, H = 0, SS = 1;  // canvas px, and scale ref->canvas
let RQ = 1;   // adaptive render quality (drops on weak hardware)
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
  W = cv.width = Math.round(innerWidth * dpr * RQ);
  H = cv.height = Math.round(innerHeight * dpr * RQ);
  SS = H / CFG.refH;
  VIG = null;
}
window.addEventListener('resize', resize);

let TEX = {};        // procedural textures
const GLOWS = {};
function glowSprite(col){
  if (GLOWS[col]) return GLOWS[col];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 2, 128, 128, 128);
  rg.addColorStop(0, `rgba(${col},1)`);
  rg.addColorStop(0.45, `rgba(${col},0.30)`);
  rg.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  return GLOWS[col] = c;
}
function drawGlow(col, cx, cy, r, alpha, squashY){
  if (alpha <= 0.004 || r <= 0) return;
  const sy = squashY || 1;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(glowSprite(col), cx - r, cy - r*sy, r*2, r*2*sy);
  ctx.globalAlpha = 1;
}
let HITS = [];       // clickable screen rects, rebuilt every frame
function pushHit(x, y, w, h, payload){
  if (x > W || y > H || x + w < 0 || y + h < 0) return;
  HITS.push({x, y, w, h, p: payload});
}
function hitAt(px_, py_){
  for (let i = HITS.length - 1; i >= 0; i--){
    const r = HITS[i];
    if (px_ >= r.x && px_ <= r.x + r.w && py_ >= r.y && py_ <= r.y + r.h) return r.p;
  }
  return null;
}
const SPRITES = {};  // processed photo sprites
const grains = [];

let BR = 0;   // camera breath — render-only micro-drift so a resting frame never freezes
function k(z){ return CFG.F / (CFG.F + z - cam.z); }
function px(x, kk){ return W/2 + (x - cam.x - BR) * kk * SS; }
function py(y, kk){ return (CFG.horizon + (y - CFG.horizon) * kk) * SS; }

/* ---------------- SCENE DRAWING ---------------- */
function drawWall(){
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));  // hidden behind bench anyway
  for (const seg of SEGMENTS){
    const wx0 = seg.x0 + (seg.wInsetL || 0), wx1 = seg.x1 - (seg.wInsetR || 0);
    const sx0 = Math.max(0, px(wx0, k(wallZAt(wx0)))), sx1 = Math.min(W, px(wx1, k(wallZAt(wx1))));
    if (sx1 <= 0 || sx0 >= W || sx1 <= sx0) continue;
    const tex = TEX[seg.wall];
    const tileW = tex.width * 0.9;   // world units per tile
    ctx.save();
    ctx.beginPath(); ctx.rect(sx0, 0, sx1 - sx0, yBase); ctx.clip();
    const worldLeft = cam.x - (W/2) / (k(seg.z0) * SS);
    let wx = wx0 + Math.max(0, Math.floor((worldLeft - wx0) / tileW)) * tileW;
    const PURE_X = REC4_R;   // beyond the 2022 recreation: clean futurist white, no panels
    const swx = (PHOTO_SKIN && seg === SEGMENTS[0] && TEX.wall1_dark) ? wallSwitchX() : -1e9;
    for (; px(wx, k(wallZAt(wx))) < sx1 + 2; wx += tileW){
      const kk = k(wallZAt(wx + tileW/2));   // per-tile depth: smooth recession
      const straddles = swx > wx && swx < wx + tileW;
      const texT = (wx + tileW/2 < swx) ? TEX.wall1_dark : tex;
      const yBot = seg.floor ? Math.min(yBase, py(1080, kk)) : yBase;
      if (seg.floor && wx + tileW > PURE_X){
        const xA = px(Math.max(wx, PURE_X), kk);
        ctx.fillStyle = '#e6e7e9';
        ctx.fillRect(xA, 0, px(wx + tileW, kk) - xA + 1, yBot);
        if (wx < PURE_X) ctx.drawImage(texT, px(wx, kk), 0, (PURE_X - wx) * kk * SS * 1.03, yBot);
      } else if (straddles){
        // the material changes mid-tile: draw the tile twice, each half clipped
        // to its own side of the line, so the joint is a butt joint
        const xs = px(swx, kk), tw = tileW * kk * SS * 1.03, tx = px(wx, kk);
        ctx.save();
        ctx.beginPath(); ctx.rect(tx - 2, 0, Math.max(0, xs - tx) + 2, yBot); ctx.clip();
        ctx.drawImage(TEX.wall1_dark, tx, 0, tw, yBot);
        ctx.restore();
        ctx.save();
        ctx.beginPath(); ctx.rect(xs, 0, Math.max(0, tx + tw - xs) + 2, yBot); ctx.clip();
        ctx.drawImage(tex, tx, 0, tw, yBot);
        ctx.restore();
      } else {
        ctx.drawImage(texT, px(wx, kk), 0, tileW * kk * SS * 1.03, yBot);
      }
    }
    if (seg.floor){
      // the blue diode line along the white wall's base
      const kl = k(seg.z0 - 6);
      const lx0 = Math.max(sx0, px(REC4_R, kl));
      const ly = py(1076, kl);
      if (lx0 < sx1){
        const pulse = 0.55 + 0.2*Math.sin(state.time*1.8);
        ctx.fillStyle = `rgba(120,205,255,${pulse.toFixed(3)})`;
        ctx.fillRect(lx0, ly, sx1 - lx0, 2.2*SS);
        drawGlow('120,205,255', (lx0+sx1)/2, ly, (sx1-lx0)*0.7, 0.08*pulse);
      }
    }
    // the far wall stands on a visible floor — the room reads huge
    if (seg.floor){
      const kk2 = k(wallZAt((wx0 + wx1) / 2));
      const yWallBase = py(1080, kk2);
      if (yWallBase < yBase){
        const fg = ctx.createLinearGradient(0, yWallBase, 0, yBase);
        fg.addColorStop(0, '#a9aeb3');
        fg.addColorStop(0.12, '#8f959a');
        fg.addColorStop(1, '#54585d');
        ctx.fillStyle = fg;
        ctx.fillRect(sx0, yWallBase, sx1 - sx0, yBase - yWallBase);
      }
    }
    // ambient darkening top and bottom of wall — each era keeps its own gloom
    const sh = seg.shade != null ? seg.shade : 1;
    const gr = ctx.createLinearGradient(0, 0, 0, yBase);
    gr.addColorStop(0, `rgba(5,2,0,${0.85*sh})`);
    gr.addColorStop(0.3, `rgba(5,2,0,${0.25*sh})`);
    gr.addColorStop(0.75, `rgba(5,2,0,${0.18*sh})`);
    gr.addColorStop(1, `rgba(5,2,0,${0.6*sh})`);
    ctx.fillStyle = gr; ctx.fillRect(sx0, 0, sx1 - sx0, yBase);
    ctx.restore();
  }
}

/* the floor: each era has its own material tone; the change lands exactly
   on the recreation line — the ground is part of the aging, not a black hole */
const FLOOR_TONES = {
  era: [
    ['#4a2f17', '#1d1108'],   // craft: dark oiled wood
    ['#485042', '#1e2119'],   // workshop: worn linoleum
    ['#3e434b', '#1b1d22'],   // office: carpet-tile grey
    ['#686d75', '#31353b'],   // white room: polished light concrete
  ],
  rec: [
    ['#d6cfc0', '#8f8778'],   // 1979: pale stone, toned to the panel
    ['#d3d1c9', '#8b897f'],   // 1989: the national-leader threshold
    ['#dde1e6', '#989ea6'],   // digital revolution: cool light stone
    ['#e4e7ea', '#a3a9b0'],   // 2022 fastscan: the whitest slab of all
  ],
  plaza: ['#9aa27f', '#5c6650'],  // outside: sunlit ground
};
/* the floor: every era owns its tone, and each recreation stands on its own
   light slab running column to column — the carpet lies on that slab, the
   era seams land visibly at the slab's edges */
function drawFloor(){
  // The floor must begin where the WALL ends, not at some depth behind the
  // bench: the strip between those two lines is normally hidden by the counter,
  // but wherever the counter breaks it was left unpainted and the room's dark
  // background showed through as a black slot — and since the wall's foot and
  // the counter's edge sit at different depths, that slot opened and closed as
  // the camera travelled.
  const kSeam = k(CFG.benchDepth);
  const kNear = k(-40);
  const T = FLOOR_TONES;
  const spans = [
    [SEGMENTS[0].x0 - 900, REC_L,  T.era[0]],
    [REC_L,  REC_R,  T.rec[0]],
    [REC_R,  REC3_L, T.era[1]],
    [REC3_L, REC3_R, T.rec[1]],
    [REC3_R, REC2_L, T.era[2]],
    [REC2_L, REC2_R, T.rec[2]],
    [REC2_R, REC4_L, T.era[3]],
    [REC4_L, REC4_R, T.rec[3]],
    [REC4_R, SEGMENTS[3].x1 + 900, T.era[3]],
  ];
  for (const [a, b, tone] of spans){
    const segF = segAt((a + b) / 2);
    const yTop = Math.min(py(CFG.benchY + 240, kSeam),
                          py(1080, k((segF.z0 || 550) - 8)));
    const xTL = px(a, kSeam), xTR = px(b, kSeam);
    const xBL = px(a, kNear), xBR = px(b, kNear);
    if (Math.max(xTR, xBR) < 0 || Math.min(xTL, xBL) > W) continue;
    const g = ctx.createLinearGradient(0, yTop, 0, H);
    g.addColorStop(0, tone[0]);
    g.addColorStop(1, tone[1]);
    ctx.beginPath();
    ctx.moveTo(xTL, yTop); ctx.lineTo(xTR, yTop);
    ctx.lineTo(xBR, H); ctx.lineTo(xBL, H);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  }
}

function drawLampPool(x, intensity){
  // pool of light on the wall behind a beat, colored by its era
  const seg = segAt(x);
  const kk = k(wallZAt(x) - 4);
  const cx = px(x, kk), cy = py(330, kk);
  const r = seg.light.poolR * kk * SS;
  if (cx < -r || cx > W + r) return;
  drawGlow(seg.light.pool, cx, cy - r*0.12, r, seg.light.poolA * intensity);
}

function benchTiles(tex, kk, srcY, srcH, dy, dh, wx0, wx1){
  // world-anchored texture tiles across [wx0..wx1] at depth scale kk
  const tileW = tex.width;   // world units per tile
  const worldLeft = cam.x - (W/2) / (kk * SS);
  let wx = Math.floor(Math.max(wx0, worldLeft) / tileW) * tileW;
  const sxEnd = Math.min(W, px(wx1, kk));
  for (; px(wx, kk) < sxEnd + 2; wx += tileW){
    ctx.drawImage(tex, 0, srcY, tex.width, srcH, px(wx, kk), dy, tileW * kk * SS + 1, dh);
  }
}
function drawBench(){
  const slices = 14;
  const kf = k(0);
  const yTopF = py(CFG.benchY, kf);
  for (const tb of TABLES){
    const seg = tb.seg, bx0 = tb.x0, bx1 = tb.x1;
    const sx0f = px(bx0, kf), sx1f = px(bx1, kf);
    if (sx1f <= 0 || sx0f >= W) continue;
    const tex = TEX[seg.bench];
    // tabletop: horizontal slices from back (benchDepth) to front (0)
    for (let s = 0; s < slices; s++){
      const z1 = CFG.benchDepth * (1 - s/slices);
      const z0 = CFG.benchDepth * (1 - (s+1)/slices);
      const k1 = k(z1), k0 = k(z0);
      const y1 = py(CFG.benchY, k1), y0 = py(CFG.benchY, k0);
      const cx0 = Math.max(0, px(bx0, kf)), cx1 = Math.min(W, px(bx1, kf));
      if (cx1 <= 0 || cx0 >= W || cx1 <= cx0) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(cx0, y1, cx1 - cx0, (y0 - y1) + 1); ctx.clip();
      benchTiles(tex, k0, (s/slices)*(tex.height-90), 90, y1, (y0-y1)+1, bx0, bx1);
      ctx.fillStyle = `rgba(8,4,1,${(0.55 * (s? z1/CFG.benchDepth : 0)).toFixed(3)})`;
      ctx.fillRect(cx0, y1, cx1 - cx0, (y0 - y1) + 1);
      ctx.restore();
    }
    // front face — a cabinet is an OBJECT, so it keeps its own height in the
    // world (bench line down to the floor) instead of being stretched to the
    // bottom of the screen. Stretching it meant the doors squashed and
    // stretched as the camera dollied, which the photographic fascia shows
    // plainly: the counter appeared to breathe on every zoom.
    const fx0 = Math.max(0, sx0f), fx1 = Math.min(W, sx1f);
    const yBotF = py(1080, kf);
    const fh = yBotF - yTopF;
    if (fx1 > fx0 && fh > 1){
      ctx.save();
      ctx.beginPath(); ctx.rect(fx0, yTopF, fx1 - fx0, Math.min(H, yBotF) - yTopF); ctx.clip();
      const texF = TEX[seg.front];
      benchTiles(texF, kf, 0, texF.height, yTopF, fh, bx0, bx1);
      const shF = seg.shade != null ? seg.shade : 1;
      const gr = ctx.createLinearGradient(0, yTopF, 0, yBotF);
      gr.addColorStop(0, 'rgba(255,220,160,0.10)');
      gr.addColorStop(0.08, 'rgba(0,0,0,0.0)');
      gr.addColorStop(1, `rgba(0,0,0,${0.75*shF})`);
      ctx.fillStyle = gr; ctx.fillRect(fx0, yTopF, fx1 - fx0, fh);
      // year rail on the table edge
      ctx.fillStyle = seg.rail;
      ctx.fillRect(fx0, yTopF + 6*SS, fx1 - fx0, 3*SS);
      ctx.restore();
      // visible table ends
      for (const [ex, edge] of [[bx0, 1], [bx1, -1]]){
        if (ex <= -800 || ex >= WORLD_END + 800) continue;
        const exs = px(ex, kf);
        if (exs < -40 || exs > W + 40) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.fillRect(edge > 0 ? exs : exs - 5*SS, yTopF, 5*SS, fh);
        ctx.fillStyle = 'rgba(255,240,210,0.10)';
        ctx.fillRect(edge > 0 ? exs + 5*SS : exs - 7*SS, yTopF, 2*SS, fh);
      }
    }
  }
  // year marks (per-beat era styling)
  ctx.textAlign = 'center';
  for (const b of BEATS){
    const bx = px(b.x, kf);
    if (bx > -100 && bx < W + 100){
      if (!TABLES.some(tb => b.x >= tb.x0 && b.x <= tb.x1)) continue;  // no table — no etched year
      const seg = segAt(b.x);
      ctx.font = `${Math.round(26*SS)}px ${seg.font}`;
      ctx.fillStyle = seg.railInk;
      ctx.fillRect(bx - 1, yTopF + 2*SS, 2, 14*SS);
      if ((!b.sub || b.under) && !b.plaque) ctx.fillText(b.y, bx, yTopF + 42*SS);
      if (b.under){
        // a fact parked under the tabletop — quiet, until we find it a home
        ctx.font = `${Math.round(21*SS)}px ${seg.font}`;
        ctx.fillText(b.t, bx, yTopF + 72*SS);
        ctx.font = `italic ${Math.round(15*SS)}px ${seg.font}`;
        ctx.save(); ctx.globalAlpha = 0.7;
        ctx.fillText(b.th, bx, yTopF + 96*SS);
        ctx.restore();
        pushHit(bx - 200*SS, yTopF + 8*SS, 400*SS, 100*SS, {type:'study', beat: BEATS.indexOf(b)});
      }
      if (b.t === 'TODAY'){
        const pulse = 0.55 + 0.35*Math.sin(state.time*2.4);
        ctx.fillStyle = `rgba(120,215,255,${pulse})`;
        ctx.beginPath(); ctx.arc(bx, yTopF - 8*SS, 5*SS, 0, 7); ctx.fill();
        ctx.font = `${Math.round(20*SS)}px ${seg.font}`;
        ctx.fillStyle = `rgba(120,215,255,${0.5 + 0.3*Math.sin(state.time*2.4)})`;
        ctx.fillText('— WE ARE HERE —', bx, yTopF + 68*SS);
      }
    }
  }
}

function drawSprite(sp, x, yCenter, z, wWorld, rotDeg, alpha, hit, sxRivet){
  const kk = k(z);
  const sx = sxRivet != null ? sxRivet : px(x, kk), sy = py(yCenter, kk);
  if (sx < -600 || sx > W + 600) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale/2, sp.w*scale, sp.h*scale, hit);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(sx, sy);
  if (rotDeg) ctx.rotate(rotDeg * Math.PI/180);
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale/2, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function drawStandingPrint(sp, x, lz, wWorld, hit){
  const kk = k(lz);
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  const sw = sp.w * scale, sh = sp.h * scale;
  const syFoot = py(CFG.benchY - 2, kk);
  if (hit) pushHit(sx - sw/2, syFoot - sh, sw, sh, hit);
  // contact shadow
  ctx.save();
  ctx.translate(sx, syFoot); ctx.scale(1, 0.22); ctx.translate(-sx, -syFoot);
  const sg = ctx.createRadialGradient(sx, syFoot, 2, sx, syFoot, sw*0.55);
  sg.addColorStop(0, 'rgba(0,0,0,0.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sw*0.55, syFoot - sw*0.55, sw*1.1, sw*1.1);
  ctx.restore();
  ctx.drawImage(sp.c, sx - sw/2, syFoot - sh + 6*kk*SS, sw, sh);
}
function drawLyingPrint(sp, x, lz, wWorld, rotDeg, hit){
  // print lying on the tabletop at depth lz — foreshortened
  const kk = k(lz);
  const sx = px(x, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale*0.42, sp.w*scale, sp.h*scale*0.42, hit);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rotDeg * Math.PI/180);
  ctx.scale(1, 0.42);                       // foreshortening
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function eraFont(sz, style, fam){ return `${style||''} ${Math.round(sz)}px ${fam || SEGMENTS[0].font}`.trim(); }

function drawBeatText(b, focusAmt){
  if (b.under) return;   // this fact lives under the tabletop, on the bench face
  if (b.plaque){
    // no numeral, no lines — just a small engraved plate on the wall
    const segP = segAt(b.x);
    const kk = k(wallZAt(b.x) - 8);
    const cx = px(b.x, kk);
    if (cx > -600 && cx < W + 600){
      const wP = 320*kk*SS, hP = 88*kk*SS, yP = py(150, kk);
      ctx.save();
      const pg = ctx.createLinearGradient(cx, yP, cx, yP + hP);
      pg.addColorStop(0, 'rgba(70,58,40,0.92)');
      pg.addColorStop(1, 'rgba(44,36,24,0.92)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.roundRect(cx - wP/2, yP, wP, hP, 6*SS); ctx.fill();
      ctx.strokeStyle = `rgba(${segP.ink},0.4)`; ctx.lineWidth = 1.5*SS;
      ctx.strokeRect(cx - wP/2 + 5*kk*SS, yP + 5*kk*SS, wP - 10*kk*SS, hP - 10*kk*SS);
      ctx.textAlign = 'center';
      ctx.font = eraFont(40 * kk * SS, '', segP.font);
      try { ctx.letterSpacing = `${8*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${segP.ink},0.95)`;
      ctx.fillText(b.t, cx, yP + hP*0.66);
      try { ctx.letterSpacing = '0px'; } catch(e){}
      ctx.restore();
      pushHit(cx - wP/2, yP, wP, hP, {type:'study', beat: BEATS.indexOf(b)});
    }
    return;
  }
  const seg = b.ink ? Object.assign({}, segAt(b.x), {ink: b.ink}) : segAt(b.x);
  const wz = seg.tz || wallZAt(b.x);   // one shared text plane per era group — equal type everywhere
  const dxW = b.x - cam.x;
  const near = Math.max(0, 1 - Math.abs(dxW)/1300);
  const sc = b.minor ? 0.6 : 1;
  const tY = segIdx(b.x) === 0 ? 232 : 208;   // the serif era breathes wider under its numerals
  // during a pedestal dolly the headline recomposes: it steps down into the
  // zoomed frame and yields size, so the exhibit stays the hero
  const fScale = 1 - 0.30 * focusAmt;
  const fFade = 1 - focusAmt;   // the thesis bows out while the exhibit is the hero
  // flagged landmark beats fly: at distance they rest on the wall in the
  // standard typography, grow to full size at screen center, then settle back
  if (b.fly){
    // the year lifts off the wall as you approach and settles back afterwards —
    // its resting state is the standard wall typography, same as every other year
    const zT = 265 + (wz - 8 - 265) * Math.pow(1 - near, 1.7);   // apex plane keeps the numerals fully in frame
    const kk = k(zT);
    // riveted to the wall: the numeral grows straight toward the camera,
    // it never slides left or right off its own spot
    let cx = px(b.x, k(b.pinZ || (wz - 8)));
    const ts = (seg.tScale || 1) * (b._ys || 1);
    if (cx > -1200 && cx < W + 1200){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = eraFont(170 * ts * fScale * kk * SS, '', seg.font);
      ctx.fillStyle = `rgba(${seg.ink},${Math.min(1, 0.5 + 0.6*near)})`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 8*SS; ctx.shadowOffsetY = 4*SS;
      ctx.fillText(b.y, cx, mixN(py(140, kk), H*0.16, focusAmt));
      pushHit(cx - 340*kk*SS, py(20, kk), 680*kk*SS, py(330, kk) - py(20, kk), {type:'study', beat: BEATS.indexOf(b)});
      const cd = b._capDrop || 0;
      ctx.font = eraFont(46 * (seg.tScale || 1) * kk * SS, '', seg.font);
      try { ctx.letterSpacing = `${9*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.45 + 0.5*near) * 0.92})`;
      ctx.fillText(b.t, cx, mixN(py(tY + cd, kk), H*0.16 + 62*SS, focusAmt));
      try { ctx.letterSpacing = '0px'; } catch(e){}
      if (near > 0.25 && b.th && fFade > 0.05){
        ctx.font = eraFont(30 * (seg.tScale || 1) * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${((near-0.25)/0.75 * 0.72 * fFade).toFixed(3)})`;
        drawLines(b._th, cx, py(tY + 54 + cd, kk), 38 * kk * SS);
      }
      ctx.restore();
    }
  } else {
    // static wall text; it steps back while a flying neighbour holds the air
    let flyDim = 1;
    for (const f of BEATS){
      if (!f.fly || Math.abs(f.x - b.x) > 1200) continue;
      const nF = Math.max(0, 1 - Math.abs(f.x - cam.x)/1300);
      flyDim = Math.min(flyDim, 1 - 0.7 * Math.pow(nF, 1.4));
    }
    if (state.focusBeat >= 0 && BEATS[state.focusBeat] !== b)
      flyDim = Math.min(flyDim, 0.3);   // a focused exhibit owns the frame
    const kk = k(wz - 8);
    const cx = px(b.x, kk);
    if (cx > -900 && cx < W + 900){
      ctx.globalAlpha = flyDim;
      ctx.save();
      ctx.textAlign = 'center';
      if (b.sub){
        // a satellite of its year-stand: no numeral of its own — the title carries it
      } else {
        ctx.font = eraFont(170 * (seg.tScale||1) * (b._ys||1) * fScale * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${0.5 + 0.45*near})`;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6*SS; ctx.shadowOffsetY = 3*SS;
        ctx.fillText(b.y, cx, mixN(py(140, kk), H*0.16, focusAmt));
      }
      pushHit(cx - 320*kk*SS, py(20, kk), 640*kk*SS, py(330, kk) - py(20, kk), {type:'study', beat: BEATS.indexOf(b)});
      const cd = b._capDrop || 0;
      ctx.font = eraFont(46 * sc * (seg.tScale||1) * kk * SS, '', seg.font);
      try { ctx.letterSpacing = `${9*sc*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.45 + 0.5*near)*0.92})`;
      ctx.fillText(b.t, cx, mixN(py((b.minor ? tY + 4 : tY) + cd, kk), H*0.16 + 62*SS, focusAmt));
      try { ctx.letterSpacing = '0px'; } catch(e){}
      if (near > 0.25 && b.th){
        ctx.font = eraFont(30 * (b.minor?0.8:1) * (seg.tScale||1) * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${(near-0.25)/0.75 * 0.72})`;
        if (fFade > 0.05) drawLines(b._th, cx, py((b.minor ? tY + 46 : tY + 54) + cd, kk), 38 * (b.minor?0.8:1) * kk * SS);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

/* rest-descriptions live on the bench face, under the etched year line —
   drawn above everything, era ink, so no pedestal or prop ever hides them */
/* A caption on a dark bench face has to be light — but light in the colour of
   the era's own light. A cold grey under tungsten reads as a foreign object in
   the room; the craft years want warm cream, the white era wants cool. Taken
   from each era's ink, lifted where that ink is too dark to read on wood. */
function descInk(seg){
  const c = (seg.ink || '218,222,227').split(',').map(Number);
  const mean = (c[0] + c[1] + c[2]) / 3;
  if (mean >= 150) return seg.ink;                    // already a light era ink
  // a dark era ink (the white era): keep its hue, raise it to read on a dark face
  const mx = Math.max(1, Math.max(c[0], c[1], c[2]));
  const g = 232 / mx;
  return c.map(v => Math.round(Math.min(255, 40 + v * g))).join(',');
}

function drawBenchDescs(){
  const kf = k(0);
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (b.under || Math.abs(b.x - cam.x) > 2400) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    let dAmt = Math.max(focusAmt, state.restBeat === i ? Math.min(1, Math.max(0, (state.restTime - 0.45)/0.7)) : 0);
    if (b.album) dAmt *= 1 - (albumAnim[i] || 0);
    if (dAmt < 0.02) continue;
    const seg = segAt(b.x);
    if (b.descWall){
      // machinery owns floor, wall and air here: the line reads as a plaque
      // at the foot of the frame, light ink over the vignette
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = eraFont(23 * SS, '', seg.font);
      ctx.fillStyle = `rgba(${descInk(seg)},${(dAmt * 0.92).toFixed(3)})`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 8*SS; ctx.shadowOffsetY = 2*SS;
      drawLines(b._d, W * 0.5, H * 0.925, 32 * SS);
      ctx.restore();
      continue;
    }
    let cw = px(b.x, kf);
    let onTable = TABLES.find(t => b.x >= t.x0 && b.x <= t.x1);
    // a pedestal break may leave the beat without a table right under it —
    // the label then steps onto the nearest counter, unless a recreation
    // slab owns this ground
    const inRec = (b.x > REC_L && b.x < REC_R) || (b.x > REC3_L && b.x < REC3_R) ||
                  (b.x > REC2_L && b.x < REC2_R) || (b.x > REC4_L && b.x < REC4_R);
    if (!onTable && !inRec){
      // prefer the counter to the right: the tour reads left to right,
      // the label leads the eye onward past the pedestal
      let best = null, bd = 1e9;
      for (const tt of TABLES){
        let d = b.x < tt.x0 ? tt.x0 - b.x : (b.x > tt.x1 ? b.x - tt.x1 : 0);
        if (tt.x1 < b.x) d += 500;
        if (d < bd){ bd = d; best = tt; }
      }
      if (bd < 1400) onTable = best;
    }
    let ink = descInk(seg), shadow = true, slabDrop = 0;   // light ink, in the era's own light
    // the white era needs dark ink on its pale face — unless the hero dim
    // has already sunk the scene, where light ink glows over the dark
    if (segIdx(b.x) === 3 && (state.hero || 0) < 0.25){ ink = '55,61,69'; shadow = false; }
    if (onTable){
      // pinned to the beat's own table span — the line never crosses a gap
      const half = 350*SS;
      const lo = px(onTable.x0, kf) + half, hi = px(onTable.x1, kf) - half;
      if (lo < hi) cw = Math.max(lo, Math.min(hi, cw));
      // a light pedestal column would swallow light ink — the label steps
      // aside like a museum plate beside its sculpture
      if (b.ped){
        const kp = k(-90);
        const pedSx = px(b.x + (b.ped.dx ?? -430), kp);
        const pedHalf = 165 * (b.ped.big ? 1.35 : 1) * kp * SS * 0.62;
        const need = pedHalf + half + 18*SS;
        if (Math.abs(cw - pedSx) < need){
          const right = pedSx + need, left = pedSx - need;
          if (lo < hi){
            // to the right by preference — the tour reads left to right,
            // the label leads the eye onward; and never off the screen
            if (right <= hi && right + 350*SS < W - 30*SS) cw = right;
            else if (left >= lo && left - 350*SS > 30*SS) cw = left;
          }
        }
      }
      // whatever the counters allow, the line must live on the screen
      cw = Math.max(385*SS, Math.min(W - 385*SS, cw));
    } else {
      // a recreation beat: the line reads off the light floor slab in dark ink —
      // except 1979, where the red runner underfoot asks for light ink
      const onCarpet = b.x > REC_L && b.x < REC_R;
      ink = onCarpet ? '236,228,218' : '52,58,66';
      shadow = onCarpet; slabDrop = 130*SS;
    }
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(23 * SS, '', seg.font);
    ctx.fillStyle = `rgba(${ink},${(dAmt * 0.9).toFixed(3)})`;
    if (shadow){ ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6*SS; ctx.shadowOffsetY = 2*SS; }
    drawLines(b._d, cw, py(CFG.benchY, kf) + 78*SS + slabDrop, 32 * SS);
    ctx.restore();
  }
}

function wrapCalc(text, maxW){
  const words = text.split(' ');
  let line = '', lines = [];
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLines(lines, cx, y, lh){
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i*lh);
}
/* line breaks are computed once at a reference size — they never re-flow */
function cacheWrap(){
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    const seg = segAt(b.x);
    ctx.font = `italic 100px ${seg.font}`;
    b._th = wrapCalc(b.th, 100 * 500/30);
    ctx.font = `100px ${seg.font}`;
    b._d = wrapCalc(b.d, 100 * 700/26);
    // year lane: half the distance to the nearest neighbour, minus breathing room
    const fs = 170 * (seg.tScale || 1);
    ctx.font = `${Math.round(fs)}px ${seg.font}`;
    const w = ctx.measureText(b.y).width;
    const lane = Math.max(160, Math.min(i > 0 ? b.x - BEATS[i-1].x : 1e9,
                          i < BEATS.length-1 ? BEATS[i+1].x - b.x : 1e9) - 90);
    b._ys = Math.min(1, lane / Math.max(1, w));
  }
  // one shared year scale per era — identical sizes inside each space
  for (const seg of SEGMENTS){
    const era = BEATS.filter(b => b.x >= seg.x0 && b.x < seg.x1 && !b.sub);
    const m = Math.min(1, ...era.map(b => b._ys));
    era.forEach(b => b._ys = m);
  }
}

  else { bg.addColorStop(0, '#c6cbce'); bg.addColorStop(1, '#9da3a7'); }
  g.fillStyle = bg; g.fillRect(0, 0, 220, 1100);
  const floors = [[70, 480], [530, 1000]];    // two storeys [top, bottom]
  // slab between storeys and at bottom
  for (const yy of [480, 1000]){
    g.fillStyle = warm ? '#cdc4b0' : '#e4e7e9';
    g.fillRect(0, yy, 220, 34);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(0, yy + 34, 220, 8);
  }
  for (const [top, bot] of floors){
    // ceiling light strips
    for (let i = 0; i < 3; i++){
      g.fillStyle = 'rgba(255,255,250,0.85)';
      g.fillRect(18 + i*66, top + 12, 46, 5);
    }
    // furniture hints
    g.fillStyle = warm ? '#3d3527' : '#5a6166';
    g.fillRect(24, bot - 120, 92, 120);            // desk / cabinet
    g.fillRect(140, bot - 88, 56, 88);
    g.fillStyle = warm ? '#20242c' : '#22303a';
    g.fillRect(40, bot - 168, 52, 44);             // a monitor
    // a plant
    g.fillStyle = '#3c6140';
    g.beginPath();
    g.ellipse(186, bot - 130, 18, 34, 0.2, 0, 7); g.fill();
    g.fillStyle = warm ? '#4a3423' : '#7c8287';
    g.fillRect(176, bot - 104, 20, 26);
  }
  if (warm){
    // the team photo on the wall, upper floor
    g.fillStyle = '#efe9da'; g.fillRect(70, 170, 108, 78);
    const R = rng(313);
    for (let i = 0; i < 24; i++){
      g.fillStyle = `hsl(${(R()*360)|0} 45% ${(38 + R()*28)|0}%)`;
      g.fillRect(76 + (i%8)*12.4, 178 + ((i/8)|0)*21, 10, 17);
    }
  } else {
    // glass wall band
    g.fillStyle = 'rgba(140,190,215,0.30)';
    g.fillRect(28, 120, 164, 300);
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(40, 132, 22, 276);
  }
  return c;
}

/* a full-screen video insert can live on the seam: drop a clip in and it
   fades in as you cross (slot — no clip embedded yet) */
let SEAM_VIDEO = null;
/* ---------------- THE PROJECTOR ----------------
   A real machine standing in the hall, not a rectangle pasted on the wall.
   What sells a projection is never the picture: it is that the picture is
   MADE OF LIGHT. So the frame is drawn additively over the masonry — the
   wall's own texture reads straight through the highlights, exactly as it
   does in a room — the beam hangs in the air with dust turning in it, the
   lamp breathes, the gate weaves a hair, and the throw is keystoned because
   the machine sits below the centre of its own picture. */
const PROJECTORS = [
  {x: SHIFT(12590), wallDX: 240, w: 1560, cy: 470, src: 'media/jim_glass.mp4', throwZ: 30,
   clip: {name: 'Jim Glidewell', label: 'on the bench that started it', src: 'media/jim_glass.mp4'}},
];
function initProjectors(){
  for (const p of PROJECTORS){
    const v = document.createElement('video');
    v.src = p.src; v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = 'auto';
    v.addEventListener('loadeddata', () => {
      p.ready = true;
      // the reel is pillarboxed: measure the black ears once and never throw them
      try {
        const c = document.createElement('canvas'); c.width = 96; c.height = 54;
        const g = c.getContext('2d', {willReadFrequently: true});
        g.drawImage(v, 0, 0, 96, 54);
        const d = g.getImageData(0, 0, 96, 54).data;
        const lum = x => { let m = 0; for (let y = 4; y < 50; y++){ const i = (y*96+x)*4; m = Math.max(m, (d[i]+d[i+1]+d[i+2])/3); } return m; };
        let a0 = 0, a1 = 95;
        while (a0 < 40 && lum(a0) < 14) a0++;
        while (a1 > 56 && lum(a1) < 14) a1--;
        p.crop = {x0: a0 / 96, x1: (a1 + 1) / 96};
      } catch(e){ p.crop = {x0: 0, x1: 1}; }
    });
    v.play().catch(() => {                      // a browser that wants a gesture first
      const go = () => { v.play().catch(()=>{}); window.removeEventListener('pointerdown', go); };
      window.addEventListener('pointerdown', go);
    });
    p.v = v;
  }
}
function drawProjectors(t, phase){
  for (const p of PROJECTORS){
    // a kiosk PC should not decode a reel nobody is looking at
    const near = Math.abs(p.x - cam.x) < 3600;
    if (p.v){
      const wanted = near && !state.clip;   // the spoken cut takes over from the loop
      if (wanted && p.v.paused) p.v.play().catch(()=>{});
      else if (!wanted && !p.v.paused) p.v.pause();
    }
    if (!near) continue;
    const seg = segAt(p.x);
    const wz = (seg.z0 || 550) - 6;
    const kk = k(wz);
    // the frame takes its offset in WORLD units, the same units the machine
    // below uses, so the two never drift apart and the beam stays true
    const sx = px(p.x + p.wallDX, k(exhibitZ(p.x)));
    // the gate is sized to the reel AFTER its black ears are cut: a 4:3 film
    // gets a 4:3 rectangle, fitted inside the same box, never stretched
    const c0 = p.crop || {x0: 0, x1: 1};
    const asp = ((p.v && p.v.videoWidth) ? p.v.videoWidth * (c0.x1 - c0.x0) / p.v.videoHeight : 16/9);
    const boxW = p.w * kk * SS, boxH = boxW * 9 / 16;
    const vw = asp >= 16/9 ? boxW : boxH * asp;
    const vh = asp >= 16/9 ? boxW / asp : boxH;
    if (sx < -vw || sx > W + vw) continue;
    const sy = py(p.cy, kk);
    const live = p.ready && p.v.readyState >= 2;

    // the lamp: a slow breath with an occasional stumble in the gate
    const lamp = 0.90 + 0.07 * Math.sin(t * 7.3) + 0.04 * Math.sin(t * 2.1)
                 + (Math.sin(t * 31.7) > 0.985 ? -0.16 : 0);
    // gate weave — a projected frame never sits perfectly still
    const wx2 = Math.sin(t * 4.7) * 0.9 * kk * SS + Math.sin(t * 11.3) * 0.35 * kk * SS;
    const wy2 = Math.cos(t * 3.9) * 0.7 * kk * SS;

    // the machine, standing on the bench below the picture
    const kp = k(p.throwZ);
    const mxp = px(p.x + p.wallDX, kp), myp = py(CFG.benchY - 2, kp);   // same world x as the frame
    const bw = 150 * kp * SS, bh = 74 * kp * SS;

    if (phase === 'machine'){ projMachine(p, t, lamp, mxp, myp, bw, bh, kp); continue; }
    ctx.save();
    // 1 — the beam: apex at the lens, spreading to the frame on the wall
    const beam = ctx.createLinearGradient(0, myp - bh * 0.45, 0, sy);
    beam.addColorStop(0, `rgba(255,246,222,${(0.20 * lamp).toFixed(3)})`);
    beam.addColorStop(1, 'rgba(255,246,222,0.015)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(mxp - 5 * kp * SS, myp - bh * 0.45);
    ctx.lineTo(mxp + 5 * kp * SS, myp - bh * 0.45);
    ctx.lineTo(sx + vw / 2, sy + vh / 2);
    ctx.lineTo(sx - vw / 2, sy + vh / 2);
    ctx.closePath(); ctx.fill();
    // motes turning in the beam
    for (let i = 0; i < 14; i++){
      const u = ((i * 0.137 + t * 0.05) % 1);
      const bx = mxp + (sx - mxp) * u + Math.sin(t * 0.7 + i) * 12 * SS * u;
      const by = (myp - bh * 0.45) + (sy - (myp - bh * 0.45)) * u + Math.cos(t * 0.5 + i * 2) * 9 * SS * u;
      ctx.fillStyle = `rgba(255,248,228,${(0.06 + 0.05 * Math.sin(t * 2 + i)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, by, (0.9 + 0.8 * u) * SS, 0, 7); ctx.fill();
    }

    // 2 — the picture is assembled on its own transparent sheet and then ADDED
    //     to the wall. Feathering it in place would erase the masonry with it
    //     and read as a dark border round the frame — light never does that.
    const gx0 = sx - vw / 2 + wx2, gy0 = sy - vh / 2 + wy2;
    const key = 0.018 * vw;   // the machine sits below its picture: top edge wider
    const ow = Math.max(8, Math.ceil(vw + key * 2)), oh = Math.max(8, Math.ceil(vh));
    if (!p.off || p.off.width !== ow || p.off.height !== oh){
      p.off = document.createElement('canvas'); p.off.width = ow; p.off.height = oh;
      p.og = p.off.getContext('2d');
    }
    const g2 = p.og;
    g2.clearRect(0, 0, ow, oh);
    // a lit rectangle even where the reel is black — the lamp is always on
    g2.fillStyle = `rgba(52,47,38,${(0.60 * lamp).toFixed(3)})`;
    g2.fillRect(0, 0, ow, oh);
    if (live){
      const sw0 = p.v.videoWidth || 1280, sh0 = p.v.videoHeight || 720;
      g2.globalAlpha = 0.95 * lamp;
      g2.drawImage(p.v, sw0 * c0.x0, 0, sw0 * (c0.x1 - c0.x0), sh0, 0, 0, ow, oh);
      g2.globalAlpha = 1;
    }
    // hot centre, falling away the way a lens actually throws
    const hot = g2.createRadialGradient(ow/2, oh*0.44, oh*0.12, ow/2, oh*0.5, ow*0.72);
    hot.addColorStop(0, `rgba(255,250,235,${(0.10 * lamp).toFixed(3)})`);
    hot.addColorStop(1, 'rgba(255,250,235,0)');
    g2.fillStyle = hot; g2.fillRect(0, 0, ow, oh);
    // the edges run out into transparency ON THE SHEET, where erasing is free
    g2.save();
    g2.globalCompositeOperation = 'destination-out';
    const F = Math.max(2, 11 * kk * SS);
    for (const [ex, ey, ew, eh, vert, near] of [
      [0, 0, ow, F, 1, 1], [0, oh - F, ow, F, 1, 0],
      [0, 0, F, oh, 0, 1], [ow - F, 0, F, oh, 0, 0]]){
      const g = vert ? g2.createLinearGradient(0, ey, 0, ey + eh)
                     : g2.createLinearGradient(ex, 0, ex + ew, 0);
      g.addColorStop(0, `rgba(0,0,0,${near})`); g.addColorStop(1, `rgba(0,0,0,${1 - near})`);
      g2.fillStyle = g; g2.fillRect(ex, ey, ew, eh);
    }
    g2.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(p.off, gx0 - key, gy0);
    ctx.restore();

    // 4 — halation: the wall around the frame catches the spill
    const spill = ctx.createRadialGradient(sx, sy, vh * 0.4, sx, sy, vw * 0.95);
    spill.addColorStop(0, `rgba(255,244,214,${(0.055 * lamp).toFixed(3)})`);
    spill.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = spill; ctx.fillRect(sx - vw, sy - vh, vw * 2, vh * 2);

    ctx.restore();

    pushHit(sx - vw / 2, sy - vh / 2, vw, vh,
            p.clip ? {type: 'clip', media: p.clip, wx: p.x}
                   : {type: 'focus', beat: nearestBeat(p.x).i, anchor: p.x});
  }
}
/* the machine stands ON the bench, so it is painted after it — while the
   picture it throws was painted before, and the bench crops it the way a real
   counter crops a projection that falls behind it */
function projMachine(p, t, lamp, mxp, myp, bw, bh, kp){
  ctx.save();
  ctx.fillStyle = '#2b2723';
  ctx.beginPath(); ctx.roundRect(mxp - bw / 2, myp - bh, bw, bh, 5 * kp * SS); ctx.fill();
  ctx.fillStyle = '#43403a';
  ctx.fillRect(mxp - bw * 0.42, myp - bh * 0.92, bw * 0.84, bh * 0.16);
  for (const s of [-1, 1]){
    ctx.strokeStyle = 'rgba(190,186,176,0.75)'; ctx.lineWidth = 2 * kp * SS;
    ctx.beginPath(); ctx.arc(mxp + s * bw * 0.26, myp - bh * 1.30, bw * 0.20, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(30,28,25,0.9)';
    ctx.beginPath(); ctx.arc(mxp + s * bw * 0.26, myp - bh * 1.30, bw * 0.055, 0, 7); ctx.fill();
  }
  drawGlow('255,240,200', mxp, myp - bh * 0.45, 34 * kp * SS, 0.5 * lamp);
  ctx.fillStyle = `rgba(255,246,224,${(0.85 * lamp).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(mxp, myp - bh * 0.45, 5 * kp * SS, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------------- MUSIC ----------------
   One track for the whole hall to begin with. Kept deliberately quiet: this is
   room tone, not a soundtrack, and it must never fight a speaking voice — so it
   ducks hard whenever a clip is playing and idles when nobody is watching.
   Browsers refuse sound before a gesture, so it waits for the first touch. */
const MUSIC = {src: 'audio/mus_hall.m4a', vol: 0.30, duck: 0.18, cur: 0, el: null,
               off: localStorage.getItem('glidewell.music') === 'off'};
function toggleMusic(){
  MUSIC.off = !MUSIC.off;
  try { localStorage.setItem('glidewell.music', MUSIC.off ? 'off' : 'on'); } catch(e){}
  const a = MUSIC.el;
  if (a && !MUSIC.off) a.play().catch(() => {});
}
/* a small mark in the corner, kept quiet: the room should not look like a
   player. It brightens when the pointer is near it and says which state it is
   in by the slash, not by a label. */
function musicMarkBox(){ const s = 22 * SS; return {x: 26 * SS, y: 26 * SS, w: s, h: s}; }
function musicMarkHit(pt){
  if (!pt) return false;
  const b = musicMarkBox(), pad = 12 * SS;
  return pt.x > b.x - pad && pt.x < b.x + b.w + pad &&
         pt.y > b.y - pad && pt.y < b.y + b.h + pad;
}
function drawMusicMark(){
  const A = Math.max(0.25, state.ruleA);          // it lives with the rule
  if (A < 0.03) return;
  const b = musicMarkBox();
  const hot = musicMarkHit(Input.hover) ? 1 : 0;
  const seg = segAt(cam.x);
  const a = (MUSIC.off ? 0.30 : 0.42) * A + 0.28 * hot;
  ctx.save();
  ctx.strokeStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
  ctx.fillStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
  ctx.lineWidth = 1.6 * SS;
  ctx.lineJoin = 'round';
  const cx = b.x + b.w * 0.34, cy = b.y + b.h * 0.5, s = b.h;
  // the cone
  ctx.beginPath();
  ctx.moveTo(cx - s*0.26, cy - s*0.14);
  ctx.lineTo(cx - s*0.08, cy - s*0.14);
  ctx.lineTo(cx + s*0.16, cy - s*0.34);
  ctx.lineTo(cx + s*0.16, cy + s*0.34);
  ctx.lineTo(cx - s*0.08, cy + s*0.14);
  ctx.lineTo(cx - s*0.26, cy + s*0.14);
  ctx.closePath(); ctx.fill();
  if (MUSIC.off){
    ctx.beginPath();
    ctx.moveTo(cx + s*0.34, cy - s*0.22); ctx.lineTo(cx + s*0.66, cy + s*0.22);
    ctx.moveTo(cx + s*0.66, cy - s*0.22); ctx.lineTo(cx + s*0.34, cy + s*0.22);
    ctx.stroke();
  } else {
    for (let i = 1; i <= 2; i++){
      ctx.beginPath();
      ctx.arc(cx + s*0.20, cy, s * (0.16 + 0.19 * i), -0.9, 0.9);
      ctx.globalAlpha = 1 - i * 0.28;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function initMusic(){
  const a = new Audio(MUSIC.src);
  a.loop = true; a.preload = 'auto'; a.volume = 0;
  MUSIC.el = a;
  const start = () => {
    a.play().catch(() => {});
    window.removeEventListener('pointerdown', start);
    window.removeEventListener('keydown', start);
    window.removeEventListener('wheel', start);
  };
  window.addEventListener('pointerdown', start);
  window.addEventListener('keydown', start);
  window.addEventListener('wheel', start, {passive: true});
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) a.pause(); else a.play().catch(() => {});
  });
}
function updateMusic(dt){
  const a = MUSIC.el; if (!a) return;
  // a speaking voice always wins; the attract loop plays a little lower still
  let want = MUSIC.off ? 0 : MUSIC.vol;
  if (state.clip) want *= MUSIC.duck;
  if (state.mode === 'attract') want *= 0.75;
  want *= 1 - (state.attract.fade || 0);
  MUSIC.cur += (want - MUSIC.cur) * Math.min(1, dt * 2.2);
  a.volume = Math.max(0, Math.min(1, MUSIC.cur));
  // silence costs nothing: a muted track stops decoding
  if (MUSIC.off && MUSIC.cur < 0.01 && !a.paused) a.pause();
}

function initSeamVideo(){
  if (!window.ASSETS || !ASSETS.flyover) return;
  const v = document.createElement('video');
  v.src = ASSETS.flyover; v.muted = true; v.playsInline = true;
  SEAM_VIDEO = v;
}
/* THE CENTURY RULE — a quiet hairline at the foot of the frame answering one
   question: how far along the hundred years are we. Deliberately not a
   scrollbar: no track, no thumb, nothing to grab. It is drawn furniture that
   knows the hall's real structure — each era is its own division in its own
   ink, the breaks are the recreations you actually walk through, every beat
   leaves a tick, and a lit marker rides the rule with the year beside it. It
   bows out whenever the hall has something better to say: the welcome, an open
   reading page, a playing clip, the closing packshot. */
/* the rule wears the era it is standing in: brass under tungsten, pale steel
   through the mail-order years, grey machine-work as the lab goes digital, and
   ice with a lit edge in the white era. Materials, not decoration — the same
   progression the room itself makes. */
const RULE_STYLE = [
  {thumb: '236,212,168', edge: '255,232,190', glow: '255,186,96',  form: 'clamp', tick: 'line'},
  {thumb: '222,220,206', edge: '244,242,232', glow: '255,214,150', form: 'plate', tick: 'line'},
  {thumb: '226,229,228', edge: '246,249,248', glow: '200,228,246', form: 'frame', tick: 'line'},
  {thumb: '242,248,252', edge: '255,255,255', glow: '150,215,255', form: 'glass', tick: 'dot'},
];
function ruleStyle(){ return RULE_STYLE[Math.max(0, Math.min(3, segIdx(cam.x)))]; }

/* Each era holds the line with its own hardware, not merely its own colour:
   a brass clamp filed by hand, a stamped plate on rivets, a selection frame
   borrowed from a screen, and finally a frameless slab of lit glass. */
function drawRuleThumb(mx, y, tw, S, A, warm){
  const h = 18 * SS, top = y - h/2, bot = y + h/2;
  const body = `rgba(${S.thumb},${((0.13 + 0.10 * warm) * A).toFixed(3)})`;
  const edge = `rgba(${S.edge},${((0.55 + 0.35 * warm) * A).toFixed(3)})`;
  const bright = `rgba(${S.edge},${(0.92 * A).toFixed(3)})`;
  ctx.save();
  ctx.lineWidth = 1.6 * SS;
  if (S.form === 'clamp'){
    // filed by hand: a pill with a screw through each jaw
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.roundRect(mx - tw/2, top, tw, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.arc(mx + s * (tw/2 - h*0.42), y, 2.2 * SS, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.35 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + h*0.5, top + 3*SS); ctx.lineTo(mx + tw/2 - h*0.5, top + 3*SS); ctx.stroke();
  } else if (S.form === 'plate'){
    // stamped and riveted: chamfered corners, two square heads
    const c = 5 * SS;
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath();
    ctx.moveTo(mx - tw/2 + c, top); ctx.lineTo(mx + tw/2 - c, top);
    ctx.lineTo(mx + tw/2, top + c); ctx.lineTo(mx + tw/2, bot - c);
    ctx.lineTo(mx + tw/2 - c, bot); ctx.lineTo(mx - tw/2 + c, bot);
    ctx.lineTo(mx - tw/2, bot - c); ctx.lineTo(mx - tw/2, top + c);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]) ctx.fillRect(mx + s * (tw/2 - 11*SS) - 1.6*SS, y - 1.6*SS, 3.2*SS, 3.2*SS);
  } else if (S.form === 'frame'){
    // lifted off a screen: corner brackets and a centre notch, nothing else
    ctx.fillStyle = `rgba(${S.thumb},${(0.07 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = edge;
    const L = Math.min(12 * SS, tw * 0.28);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]){
      const cx0 = mx + sx * tw/2, cy0 = y + sy * h/2;
      ctx.beginPath();
      ctx.moveTo(cx0 - sx * L, cy0); ctx.lineTo(cx0, cy0); ctx.lineTo(cx0, cy0 - sy * (h*0.42));
      ctx.stroke();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.5 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx, top + 2*SS); ctx.lineTo(mx, top + 6*SS); ctx.stroke();
  } else {
    // frameless: two thin jaws, a hairline between them, and a lit sill
    ctx.fillStyle = `rgba(${S.thumb},${(0.06 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = `rgba(${S.edge},${(0.30 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2, y); ctx.lineTo(mx + tw/2, y); ctx.stroke();
    ctx.strokeStyle = `rgba(${S.glow},${(0.60 * A).toFixed(3)})`;
    ctx.lineWidth = 2.2 * SS;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + 2*SS, bot); ctx.lineTo(mx + tw/2 - 2*SS, bot); ctx.stroke();
  }
  // the jaws: the edges of the frame you are looking through, in every era
  ctx.fillStyle = bright;
  for (const s of [-1, 1]){
    const w2 = S.form === 'glass' ? 2.2 * SS : 3 * SS;
    ctx.beginPath();
    ctx.roundRect(mx + s * (tw/2) - w2/2, top, w2, h, S.form === 'clamp' ? w2/2 : 0.5 * SS);
    ctx.fill();
  }
  ctx.restore();
}

function ruleGeom(){
  const x0 = W * 0.13, x1 = W * 0.87;
  const W0 = INTRO_X, W1 = FIN_X;
  const seg = segAt(cam.x);
  // the thumb is as wide as the screen actually shows: the world span visible
  // at the plane the years live on. That is the honest answer to "what part of
  // the line am I looking at" — a point could never say it.
  const half = (W / 2) / (k(seg.tz || seg.z0 || 550) * SS);
  return {
    x0, x1, y: H - 40 * SS, W0, W1, half,
    at:  wx => x0 + (x1 - x0) * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0))),
    toWorld: sx => W0 + (W1 - W0) * Math.max(0, Math.min(1, (sx - x0) / (x1 - x0))),
  };
}
function ruleHit(pt){
  if (!pt || state.ruleA < 0.45) return false;
  const g = ruleGeom();
  return pt.y > g.y - 26 * SS && pt.y < g.y + 26 * SS &&
         pt.x > g.x0 - 40 * SS && pt.x < g.x1 + 40 * SS;
}
function ruleSeek(pt, instant, grabOff){
  const g = ruleGeom();
  const to = g.toWorld(pt.x) + (grabOff || 0);
  state.introHold = false;
  if (instant){ cam.x = to; cam.vel = 0; state.glide = null; }
  else state.glide = to;               // a click glides; the hall never teleports
  state.focusBeat = -1; cam.zTarget = 0;
  state.mode = 'live'; state.idle = 0;
}

const DBG = /[?&]dbg/.test(location.search);

  }

  }
  for (const p of PLATES){
    const half = (p.sw || 1390) / 2;
    for (const [wx, lbl] of [[p.x - half, 'PLATE L'], [p.x + half, 'PLATE R']]){
      const sx = px(wx, kf);
      if (sx < -50 || sx > W + 50) continue;
      ctx.strokeStyle = 'rgba(120,180,255,0.95)'; ctx.lineWidth = 2*SS;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      ctx.fillStyle = 'rgba(120,180,255,0.95)'; ctx.fillText(`${lbl} ${wx|0}`, sx + 5*SS, 60*SS);
