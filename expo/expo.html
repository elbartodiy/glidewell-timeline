    console.log('PINNED TO A RECREATION PANEL (' + pinned.length + '):\n' + pinned.join('\n'));
    console.log('PROJECTORS: ' + PROJECTORS.map(p =>
      'x ' + ((p.x + (p.mdx||0))|0) + ' panel z ' + p.pz + ' throw z ' + p.throwZ).join(' · '));
    console.log('BENCH PROPS (era 1, x < 9370):\n' + PROPS
      .filter(p => p.x < 9370).sort((u,v) => u.x - v.x)
      .map(p => '  x ' + (p.x|0) + '  z ' + (p.z|0) + '  w ' + (p.w|0) + '  ' + p.kind).join('\n'));
    console.log('LAMPS at z=240: ' + LIGHT_GRID.map(l => l.x|0).sort((a,b)=>a-b).join(' '));
    console.log('BENCH_BREAKS: ' + BENCH_BREAKS.map(b => (b.x|0) + '±' + (b.half|0)).join('  '));
    console.log('FIGURES:\n' + FIGURES.map(f => '  x ' + (f.x|0) + '  z ' + f.z).join('\n'));
    console.log('PLAN — LAYERS BY DEPTH\n' + L.sort((a, b) => b.z - a.z).map(r =>
      '  z=' + String(r.z).padStart(5) + '  ' + r.layer.padEnd(8) + ' ' + r.name +
      (r.x1 > r.x0 ? '   x ' + r.x0 + ' … ' + r.x1 : '')).join('\n'));
    console.log('counter objects at z = ' + [...pz].sort((a, b) => b - a).join(', '));
    console.log('figures at z = ' + [...fz].sort((a, b) => b - a).join(', '));
    console.log('FACT_X ' + (FACT_X|0) + ' · SHOW_L ' + (SHOW_L|0) + ' · SHOW_R ' + (SHOW_R|0) +
                ' · WORLD_END ' + (WORLD_END|0) + ' · horizon ' + CFG.horizon + ' · F ' + CFG.F +
                ' · benchY ' + CFG.benchY);
    /* AND THE SAME PLAN AS DATA. The plan sheets (expo/plan/) are drawn from this
       object, not transcribed by hand: qa/plan_dump.py loads ?plan=1 headless,
       reads the JSON block appended below and writes expo/plan/plan-data.js.
       Everything the drawing needs is asked of the running hall — depths, bays,
       breaks, what each page holds — so the plan cannot disagree with the code. */
    try {
      const seenYear = new Set();
      const beatsOut = BEATS.map(b => {
        const sub = seenYear.has(b.y); seenYear.add(b.y);
        const inHall = typeof hallOwns === 'function' && hallOwns(b);
        return {
          y: b.y, t: b.t || null, x: b.x|0, sub, sign: b.sign || null, fly: !!b.fly, era: segIdx(b.x) + 1,
          ped: b.ped ? {dx: b.ped.dx ?? -430, obj: b.ped.obj || null, spin: !!b.ped.spin, points: !!b.ped.points,
                        vitrine: !!b.ped.vitrine, big: !!b.ped.big, z: inHall ? HALL_PED_Z : -90,
                        gapHalf: b.ped.gapHalf || 330} : null,
          wall: (b.wall || []).map(w => ({img: w.img || null, dx: w.dx || 0, w: w.w || 0, cy: w.cy || 0,
                                          cap: w.cap || null, pz: w.pz ?? null})),
          onCounter: [...(b.st || []), ...(b.table || []), ...(b.props || [])]
            .map(it => ({name: it.img || it.kind || it.title || '?', dx: it.dx || 0, lz: it.lz ?? null, w: it.w || 0})),
          page: {
            words: STUDY_MORE[b.x] ? STUDY_MORE[b.x].split(/\s+/).length : 0,
            photos: ((typeof STUDY_PHOTOS_BY_TITLE === 'object' && STUDY_PHOTOS_BY_TITLE[b.t || b.y]) || []).length,
            voices: (STUDY_MEDIA[b.x] || []).length,
            people: ((typeof BEAT_PEOPLE === 'object' && BEAT_PEOPLE[b.y + '|' + (b.t || '')]) || []).length,
            links: !!(typeof STUDY_LINKS === 'object' && STUDY_LINKS[b.t]),
            inline: !!(typeof STUDY_INLINE === 'object' && STUDY_INLINE[b.t]),
          },
        };
      });
      const recList = [['1979', REC_L, REC_R, 610, 'portal'], ['1989', REC3_L, REC3_R, 728, 'portal'],
        ['1993', REC93_L, REC93_R, 728, 'plinth'], ['Digital Revolution', REC2_L, REC2_R, 970, 'portal'],
        ['2017 glass hall', REC17_L, REC17_R, 1000, 'room'], ['2018', REC18_L, REC18_R, 1000, 'bench'],
        ['2022', REC4_L, REC4_R, 1000, 'plinth'], ['2023', REC23_L, REC23_R, 1000, 'bench']];
      const PLAN = {
        version: 2, date: new Date().toISOString().slice(0, 10), assetV: typeof ASSET_V === 'string' ? ASSET_V : null,
        cam: {F: CFG.F, horizon: CFG.horizon, benchY: CFG.benchY, benchDepth: CFG.benchDepth, floor: 1080},
        world: {x0: -3450, end: WORLD_END|0, showL: SHOW_L|0, showR: SHOW_R|0, factX: FACT_X|0},
        eras: SEGMENTS.map((sg, i) => ({n: i + 1, x0: sg.x0|0, x1: sg.x1|0, z0: sg.z0, tz: sg.tz, wall: sg.wall,
          font: sg.font, fontYear: sg.fontYear || null, lamp: sg.lamp, floorPlate: !!sg.floor, plateBench: !!sg.plateBench})),
        recs: recList.map(([name, x0, x1, z, kind]) => ({name, x0: x0|0, x1: x1|0, z, kind})),
        /* WHERE THE WALL ITSELF CHANGES — not only its depth. Era 1 carries two
           walls, the 1907 boards and the 1970 panelling, and the joint is made
           behind the tall cabinet so it is never seen; era 4's panelling gives
           way to plain white at the glass hall's own column. Every other change
           happens across a recreation. (Eldar, 2026-09-21.) */
        wallRuns: (() => {
          const nm = t => t && t.src ? t.src.split('/').pop().split('?')[0].replace(/\.(webp|jpg|png)$/, '') : 'процедурная';
          const out = [];
          SEGMENTS.forEach((sg, i) => {
            const tex = TEX[sg.wall], tile = (tex && (tex.worldW || tex.width * 0.9))|0;
            if (i === 0 && PHOTO_SKIN && TEX.wall1_dark && TEX.wall1_dark !== tex){
              const sw = wallSwitchX()|0;
              out.push({era: 1, x0: sg.x0|0, x1: sw, z: sg.z0, tex: nm(TEX.wall1_dark),
                        tile: (TEX.wall1_dark.worldW || TEX.wall1_dark.width * 0.9)|0, hidden: 'за высоким шкафом'});
              out.push({era: 1, x0: sw, x1: sg.x1|0, z: sg.z0, tex: nm(tex), tile});
              return;
            }
            if (i === SEGMENTS.length - 1 && typeof HALL_FRAME_L === 'number'){
              const pure = (HALL_FRAME_L - 60)|0;
              out.push({era: i + 1, x0: sg.x0|0, x1: pure, z: sg.z0, tex: nm(tex), tile});
              out.push({era: i + 1, x0: pure, x1: sg.x1|0, z: sg.z0, tex: 'чистый белый',
                        tile: 0, hidden: 'за колонной зала'});
              return;
            }
            out.push({era: i + 1, x0: sg.x0|0, x1: sg.x1|0, z: sg.z0, tex: nm(tex), tile});
          });
          return out;
        })(),
        hall: {frameL: HALL_FRAME_L|0, frameR: HALL_FRAME_R|0, mid: HALL_MID|0, portalZ: HALL_PORTAL_Z,
               roomZ: HALL_ROOM_Z, pedZ: HALL_PED_Z, pedH: HALL_PED_H,
               carpet: typeof CARPET_Z_FAR === 'number' ? {zFar: CARPET_Z_FAR, zNear: CARPET_Z_NEAR} : null},
        plates: PLATES.map(pl => ({x: pl.x|0, sw: pl.sw, layers: (pl.layers || []).map(Ly => ({img: Ly.img, z: Ly.z}))})),
        cuts: (typeof CUTS === 'object' ? CUTS : []).map(c => ({x: (c.x ?? c.at ?? 0)|0, w: (c.w || 0)|0})),
        breaks: BENCH_BREAKS.map(br => ({x: br.x|0, half: br.half|0, tag: br.l73 ? '1973 stones' : null})),
        /* WHAT PAINTS EACH RUN. Eldar could see the counter change and could not
           find the change on the plan, because the plan only knew where the
           counter was, not what it was made of (2026-09-21). Four methods:
           a whole photographed sheet laid end to end, the founding bay's plate
           filled outward in strips, and the procedural texture — whose face in
           the white era is a photographic tile. */
        tables: TABLES.map(tb => {
          const sh = sheetOf(tb);
          const how = onPlate(tb) ? 'plate' : sh ? 'sheet' : 'proc';
          const src = t2 => t2 && t2.src ? 'фото ' + t2.src.split('/').pop().split('?')[0] : 'процедурная';
          return {x0: tb.x0|0, x1: tb.x1|0, era: SEGMENTS.indexOf(tb.seg) + 1, how,
                  sheet: onPlate(tb) ? 'plate_bay_front' : sh ? 'bench_' + sh.sh.key : null,
                  top: how === 'proc' ? src(TEX[tb.seg.bench]) : null,
                  face: how === 'proc' ? src(TEX[tb.seg.front]) : null};
        }),
        beats: beatsOut,
        lamps: LIGHT_GRID.map(l => l.x|0).sort((a, b) => a - b), lampZ: 240,
        chandeliers: {z: 520, x: [-1180, 560, 2140].map(g => ((SHOW_L + SHOW_R) / 2 + g)|0)},
        figures: FIGURES.map(f => ({x: f.x|0, z: f.z})),
        machines: [{name: 'near cell', x: (FACT_X - 300)|0, z: 190}, {name: 'far cell', x: (FACT_X + 250)|0, z: 232}],
        /* EVERYTHING THAT STANDS IN THE ROOM AND IS MEANT TO BE LOOKED AT, in one
           list. Eldar: the model plinths, the robots and the projector are the
           same kind of thing by meaning and by how they stand, so they belong
           together (2026-09-21). The hero pedestals (b.ped) stay out of it — he
           wants to work on those as their own group. The 1993 architectural
           model was in no list at all until now. */
        exhibits: [
          {kind: 'plinth',    z: 120, name: '1973 · две лаборатории',
           x: (BEATS.find(b => b.y === '1973') || {x: 0}).x|0, w: L73_W},
          {kind: 'plinth',    z: 120, name: '1979 · восемь лабораторий',
           x: ((REC_L + REC_R)/2)|0, w: G8_W},
          {kind: 'plinth',    z: 430, name: '1979 · главное здание',
           x: ((REC_L + REC_R)/2)|0, w: 1040},
          {kind: 'model',     z: 240, name: '1993 · макет здания',
           x: ((REC93_L + REC93_R)/2)|0, w: 330},
          {kind: 'machine',   z: 190, name: 'фрезерная ячейка · ближняя', x: (FACT_X - 300)|0, w: 520},
          {kind: 'machine',   z: 232, name: 'фрезерная ячейка · дальняя', x: (FACT_X + 250)|0, w: 520},
          ...PROJECTORS.map(pr => ({kind: 'projector', z: pr.throwZ, name: 'проектор 1993',
                                    x: (pr.x + (pr.mdx || 0))|0, w: 900})),
          /* the finale table: a free-standing island at the very end, past the
             last run of counter, with the four products laid on it. It is not
             in TABLES and was on no list at all (Eldar asked what it was) */
          {kind: 'table', z: 150, name: 'финальный стол · 900×240', x: FIN_X|0, w: 900},
        ],
        projectors: PROJECTORS.map(pr => ({x: (pr.x + (pr.mdx || 0))|0, pz: pr.pz, throwZ: pr.throwZ, src: pr.src})),
        /* THREE AEROPLANES, NOT ONE. The 1993 model's aeroplane is a relay between
           two bays; the jets of 1998 and 2005 cross the whole frame at their own
           year, at z 640, once each visit (Eldar, 2026-09-15: "их же больше"). */
        flybys: (typeof FLYBYS === 'object' ? FLYBYS : []).map(f => {
          const b = BEATS.find(bt => bt.y === f.y);
          return {y: f.y, x: b ? b.x|0 : null, dir: f.dir, cy: f.cy, z: 640, code: 'drawFlybys'};
        }),
        relays: [
          {name: '1993 aeroplane', from: '1989 pedestal centre', to: '1993 centre', code: 'PLANE93'},
          {name: '2007 data', from: '2007 point cloud', to: 'Digital Revolution screen', code: 'drawDataRelay07'},
          {name: '2018 data', from: '2018 vitrine', to: '2019 factory pendant', code: 'drawAIRelay'},
        ],
        props: {bench: PROPS.length, sheets: typeof SHEETS === 'object' ? SHEETS.length : 0, fg: typeof FG_ITEMS === 'object' ? FG_ITEMS.length : 0},
        assets: {photo: Object.keys(PHOTO_TEX), sprites: Object.keys(PROP_SPRITES), embedded: typeof IMGS === 'object' ? Object.keys(IMGS) : [],
                 fonts: typeof PAGE_FONTS === 'object' ? PAGE_FONTS.map(f => f[0]) : [],
                 media: [...new Set(Object.values(STUDY_MEDIA_BY_TITLE).flat().map(m => m.src))]},
        people: typeof PEOPLE === 'object' ? Object.keys(PEOPLE) : [],
        layers: L,
      };
      window.PLAN_DUMP = PLAN;
      const tag = document.createElement('script');
      tag.type = 'application/json'; tag.id = 'plan-json';
      tag.textContent = JSON.stringify(PLAN);
      document.body.appendChild(tag);
      console.log('PLAN_JSON ready · ' + tag.textContent.length + ' bytes');
    } catch (e){ console.error('PLAN_JSON failed', e); }
  }
  requestAnimationFrame(loop);
  /* AND NOTHING HEAVY IS LEFT TO BE BUILT ON ARRIVAL. Several of the bays put
     their sprite, mesh or mask together the first time they are drawn, which
     means the cost lands on the frame you walk up to them — the worst possible
     moment, and exactly what the profile showed: 16ms in the 2018 vitrine's
     first frame, 13 in the digital revolution's, 9 at the 1989 plinth. They are
     built here instead, one per frame after the first, so the hitch is spent
     while nobody is anywhere near them and never shows up as a jolt in the
     walk. Everything below is idempotent — each one returns its cache. */
  {
    const jobs = [
      () => makeVignette(),
      () => crownGeometry(),
      () => crownMesh(),
      () => crownMask(),
      () => boxPile(),
      () => discSlots(),
    ];
    let ji = 0;
    const warm = () => {
      if (ji >= jobs.length) return;
      const j = jobs[ji++];
      try { j(); } catch(e){ if (DBG) console.warn('prewarm', e); }
      requestAnimationFrame(warm);
    };
    setTimeout(() => requestAnimationFrame(warm), 400);
  }
}
