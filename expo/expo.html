/* the Digital Revolution recreation: grey era | column | a backlit white
   panel carrying a giant glowing crown | column | the white era */
/* THE DIGITAL REVOLUTION, as three states of one crown.
   Scan, file, mill — the actual chain of those years, and the only honest triad
   here: AI belongs to the 2020s, not to 2009. The three stand on the SAME world
   x at three depths, so they are three separate objects everywhere in the hall
   and lock into a single concentric silhouette at the one camera position the
   composition is built for. The middle state descends as you arrive: the file
   is what the room assembles in front of you. */
let CROWN_PTS = null, CROWN_ROWS = null;
function crownGeometry(){
  if (CROWN_PTS) return;
  const sp = PED_SPRITES.crown2;
  const c = document.createElement('canvas'); c.width = sp.w; c.height = sp.h;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.drawImage(sp.c, 0, 0, sp.w, sp.h);   // the sprite is authored above its layout size
  const d = g.getImageData(0, 0, sp.w, sp.h).data;
  const inside = (x, y) => d[((y|0) * sp.w + (x|0)) * 4 + 3] > 40;
  const R = rng(90210);
  CROWN_PTS = [];
  for (let i = 0; i < 900 && CROWN_PTS.length < 260; i++){
    const x = R() * sp.w, y = R() * sp.h;
    if (inside(x, y)) CROWN_PTS.push([x / sp.w - 0.5, y / sp.h - 0.5]);
  }
  CROWN_ROWS = [];
  for (let y = 2; y < sp.h - 2; y += Math.max(2, sp.h / 14)){
    let a = -1, b = -1;
    for (let x = 0; x < sp.w; x++){ if (inside(x, y)){ if (a < 0) a = x; b = x; } }
    if (a >= 0 && b - a > 3) CROWN_ROWS.push([a / sp.w - 0.5, b / sp.w - 0.5, y / sp.h - 0.5]);
  }
}
/* the scan: the surface as a cloud of measured points, nothing solid yet */
function drawCrownScan(cx, cy, w, a){
  crownGeometry();
  const sp = PED_SPRITES.crown2, h = w * sp.h / sp.w;
  ctx.save();
  for (const [ux, uy] of CROWN_PTS){
    const px_ = cx + ux * w, py_ = cy + uy * h;
    ctx.fillStyle = `rgba(150,225,255,${(a * (0.35 + 0.5 * Math.abs(uy))).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px_, py_, Math.max(0.7, w * 0.006), 0, 7); ctx.fill();
  }
  ctx.restore();
}
/* the file: contour rings, the way a design is actually held in a machine —
   and they are not simply there. A laser comes in from above and to the left,
   sweeps down through the crown's space, and each ring appears as the beam
   reaches it, burns bright at the moment of the cut, then settles. The mesh is
   the record of the pass, which is what a scan actually is. */
/* `ph` is not time — it is how far the camera has come into the recreation, so
   the scanner cuts the crown exactly as fast as the hand pushes forward and
   finishes the file at the instant the three elements line up. Nothing here
   moves on its own. */
function drawCrownFile(cx, cy, w, a, ph){
  crownGeometry();
  const sp = PED_SPRITES.crown2, h = w * sp.h / sp.w;
  const beamY = cy - h * 0.58 + ph * h * 1.16;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';          // neon: light added, not painted
  // the rings themselves are deep and saturated, the bloom around them cool
  ctx.shadowColor = `rgba(40,150,255,${(a * 0.9).toFixed(3)})`;
  ctx.shadowBlur = Math.max(3, w * 0.05);
  ctx.lineWidth = Math.max(1, w * 0.009);
  for (const [ax, bx, uy] of CROWN_ROWS){
    const y = cy + uy * h, rx = (bx - ax) * w / 2, mx = cx + (ax + bx) * w / 2;
    // a ring exists once the beam has passed it; it flares at the cut itself
    const d = (beamY - y) / h;
    if (d < -0.03) continue;
    const born = d < 0 ? 1 + d / 0.03 : 1;
    const cut = Math.exp(-Math.abs(d) * 26);
    ctx.strokeStyle = `rgba(${50 + 130*cut},${150 + 70*cut},${215 + 35*cut},${(a * (0.42 + 0.30*cut) * born).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(mx, y, rx, Math.max(1.5, h * 0.022), 0, 0, 7); ctx.stroke();
  }
  // one white line down the axis — the tube inside the glow
  ctx.shadowColor = `rgba(150,220,255,${(a * 0.9).toFixed(3)})`;
  ctx.shadowBlur = Math.max(4, w * 0.07);
  ctx.strokeStyle = `rgba(255,255,255,${(a * 0.62).toFixed(3)})`;
  ctx.lineWidth = Math.max(1, w * 0.012);
  ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.52); ctx.lineTo(cx, cy + h * 0.52); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(120,200,240,${(a * 0.55).toFixed(3)})`;
  ctx.beginPath();
  for (let i = 0; i < CROWN_ROWS.length; i++){
    const [ax, , uy] = CROWN_ROWS[i];
    const x = cx + ax * w, y = cy + uy * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < CROWN_ROWS.length; i++){
    const [, bx, uy] = CROWN_ROWS[i];
    const x = cx + bx * w, y = cy + uy * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  // the plane of light it lays across the crown's space
  ctx.shadowBlur = 0;
  const pg2 = ctx.createLinearGradient(cx - w/2, beamY - h*0.035, cx - w/2, beamY + h*0.035);
  pg2.addColorStop(0, 'rgba(180,240,255,0)');
  pg2.addColorStop(0.5, `rgba(215,248,255,${(a*0.20).toFixed(3)})`);
  pg2.addColorStop(1, 'rgba(180,240,255,0)');
  ctx.fillStyle = pg2;
  ctx.fillRect(cx - w*0.62, beamY - h*0.035, w*1.24, h*0.07);
  ctx.restore();
}

/* THE SCANNER. Its head is bolted to the ceiling of the bay — a fixed point in
   the room, so the beam pivots as you walk past it instead of travelling along
   with you. The light passes in FRONT of the crown, sweeping its space
   diagonally, and comes to rest with its edge on the lower left of the crown at
   the exact instant the three elements align. Past that instant it is simply
   switched off: the mesh it cut stays behind on the screen. It is a shaft, not
   a stroked line — a narrow aperture opening into a wide footprint, striated by
   a fixed comb of blades the way any beam looks crossing air that has dust in
   it, so nothing here crawls of its own accord. */
function drawScanBeam(cx, cy, w, h, ph, a){
  const mid = (REC2_L + REC2_R) / 2;
  // the head hangs far back in the bay — it works the crown from across the
  // room, so the throw is long and the fixture reads small
  const kE = k(760);
  const ex = px(mid - 520, kE), ey = py(-300, kE);
  const aimX = cx + w * (0.52 - 1.02 * ph);
  const aimY = cy + h * (-0.55 + 1.15 * ph);
  ctx.save();
  // the head on the ceiling
  const hw2 = 15 * kE * SS, hh2 = 9 * kE * SS;
  ctx.fillStyle = 'rgba(24,32,40,0.92)';
  ctx.fillRect(ex - hw2, ey - hh2 * 2.4, hw2 * 2, hh2 * 2.4);
  ctx.fillStyle = `rgba(150,220,255,${(0.85 * a).toFixed(3)})`;
  ctx.fillRect(ex - hw2 * 0.55, ey - hh2 * 0.5, hw2 * 1.1, hh2 * 0.5);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('150,220,255', ex, ey, w * 0.30, a * 0.22);
  /* A beam does not stop. It got its brightest at the crown and then simply
     ended on a straight line drawn across it, which read as scissors — so the
     geometry now runs well past the crown and the light dies inside it: the
     quad reaches EXT times further than the aim and its alpha is already zero
     there, which means the shape has no visible edge to cut anything on. */
  const bdx = aimX - ex, bdy = aimY - ey, bl = Math.hypot(bdx, bdy) || 1;
  const nxp = -bdy / bl, nyp = bdx / bl;
  /* The run-out is measured against the CROWN, not against the throw. Taking it
     as a multiple of the distance from the emitter made the tail longer than
     the thing it was hitting, so the light came out the far side and read as
     going straight through the tooth. A quarter of the crown's width is enough
     for the light to die without ever showing a cut edge — and it dies inside
     the silhouette it lands on. */
  const tail = w * 0.26, tot = bl + tail, EXT = tot / bl, tAim = bl / tot;
  const farX = ex + bdx * EXT, farY = ey + bdy * EXT;
  const ap = Math.max(1.1, w * 0.030), fp = w * 0.145;
  const fpFar = ap + (fp - ap) * EXT;
  const shaft = (s0, s1, al) => {
    ctx.beginPath();
    ctx.moveTo(ex + nxp * ap * s0, ey + nyp * ap * s0);
    ctx.lineTo(ex + nxp * ap * s1, ey + nyp * ap * s1);
    ctx.lineTo(farX + nxp * fpFar * s1, farY + nyp * fpFar * s1);
    ctx.lineTo(farX + nxp * fpFar * s0, farY + nyp * fpFar * s0);
    ctx.closePath();
    const g = ctx.createLinearGradient(ex, ey, farX, farY);
    g.addColorStop(0,            `rgba(110,200,255,${(a * al * 0.26).toFixed(3)})`);
    g.addColorStop(tAim * 0.80,  `rgba(150,215,248,${(a * al * 0.58).toFixed(3)})`);
    g.addColorStop(tAim,         `rgba(186,226,246,${(a * al * 0.70).toFixed(3)})`);
    g.addColorStop(Math.min(0.99, tAim + (1 - tAim) * 0.45),
                   `rgba(150,205,235,${(a * al * 0.22).toFixed(3)})`);
    g.addColorStop(1,            'rgba(120,180,215,0)');
    ctx.fillStyle = g; ctx.fill();
  };
  shaft(-1, 1, 0.10);
  for (const s of [-0.80, -0.50, -0.22, 0.05, 0.31, 0.59, 0.85])
    shaft(s - 0.062, s + 0.062, 0.07 + 0.04 * (1 - Math.abs(s)));
  shaft(-0.10, 0.10, 0.30);
  // where it meets the crown it marks the place; it does not burn a hole in it
  drawGlow('205,235,252', aimX, aimY, w * 0.24, a * 0.26);
  ctx.restore();
}

/* the front of the composition: the milled crown stands nearer than the
   recreation's own columns, so it is painted with the other near-plane
   exhibits rather than inside the portal that frames it */
function drawRec2Front(t){
  const mid = (REC2_L + REC2_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  const kk = k(970), cx = px(mid, kk);
  const lock = Math.max(0, 1 - Math.abs(cam.x - mid) / 900);
  const ease = lock * lock * (3 - 2 * lock);
  const kn = k(-90), cw = 148 * kn * SS;
  const nx = px(mid, kn), ny = py(417, kn);
  const spm = PED_SPRITES.crown2, chh = cw * spm.h / spm.w;
  /* ТУМБА ОПУСКАЕТСЯ, КОРОНКА ОСТАЁТСЯ. Плита стояла ровно под подошвой
     коронки, и лента бежала окошком ниже неё. Эльдар просит наоборот: плиту
     на уровень ленты, а ленту — кольцом сразу под плитой (2026-09-23). 77.6 —
     тот самый зазор, на котором лента и висела, так что плита садится ровно
     на её прежнее место. Коронка при этом отрывается от плиты и висит в луче
     сканера — она и есть файл, о котором написано на панели. */
  const PL_DROP = 77.6;
  const plY = ny + chh * 0.5 + PL_DROP * kn * SS, pw = 150 * kn * SS;
  // the scanner works the crown from across the room, so its light is thrown
  // before the column and the crown are painted: they stand in it and stop it
  const bLive = Math.max(0, 1 - Math.max(0, cam.x - mid) / 240);
  const bIn = Math.max(0, Math.min(1, (cam.x - mid + 560) / 140));
  if (bLive * bIn > 0.01)
    drawScanBeam(nx, ny, cw, chh, scanPhase(mid), bLive * bIn * (0.35 + 0.65 * ease));

  /* The plinth is a cylinder of frosted glass. It cannot be truly transparent:
     the sentence painted on the panel behind would read straight through it and
     the window set into its face would stop meaning anything. So it is glass
     the way frosted glass actually behaves — it carries light, not detail. */
  const pgv = ctx.createLinearGradient(0, plY, 0, H);
  pgv.addColorStop(0,    '#e8f2f8');       // bright where the crown stands on it
  pgv.addColorStop(0.20, '#cfdde7');
  pgv.addColorStop(0.72, '#9fb1bd');
  pgv.addColorStop(1,    '#7c8d99');       // and heavier toward the floor
  ctx.fillStyle = pgv; ctx.fillRect(nx - pw/2, plY, pw, H - plY);
  // the barrel: dark at the shoulders, one specular band left of centre, and
  // the two vertical seams where the light catches the thickness of the glass
  const pgh = ctx.createLinearGradient(nx - pw/2, 0, nx + pw/2, 0);
  pgh.addColorStop(0,     'rgba(26,40,52,0.58)');
  pgh.addColorStop(0.055, 'rgba(216,238,250,0.55)');
  pgh.addColorStop(0.17,  'rgba(26,40,52,0.15)');
  pgh.addColorStop(0.40,  'rgba(255,255,255,0.44)');
  pgh.addColorStop(0.60,  'rgba(255,255,255,0.05)');
  pgh.addColorStop(0.89,  'rgba(26,40,52,0.26)');
  pgh.addColorStop(0.955, 'rgba(198,228,246,0.50)');
  pgh.addColorStop(1,     'rgba(18,30,40,0.62)');
  ctx.fillStyle = pgh; ctx.fillRect(nx - pw/2, plY, pw, H - plY);
  // the crown's own light pours down inside the column and fades out
  const pgl = ctx.createLinearGradient(0, plY, 0, plY + (H - plY) * 0.6);
  pgl.addColorStop(0, 'rgba(150,220,255,0.40)');
  pgl.addColorStop(1, 'rgba(150,220,255,0)');
  ctx.fillStyle = pgl; ctx.fillRect(nx - pw/2, plY, pw, (H - plY) * 0.6);
  // the top is a slab of glass with real thickness — underside, then the edge
  // that runs round it and catches the light, then the face
  const capRx = pw * 0.56, capRy = 13 * kn * SS, capT = 17 * kn * SS;
  ctx.fillStyle = 'rgba(139,160,175,0.95)';
  ctx.beginPath(); ctx.ellipse(nx, plY + capT, capRx, capRy, 0, 0, 7); ctx.fill();
  const eg = ctx.createLinearGradient(nx - capRx, 0, nx + capRx, 0);
  eg.addColorStop(0,    'rgba(28,42,55,0.60)');
  eg.addColorStop(0.10, 'rgba(206,232,247,0.62)');
  eg.addColorStop(0.36, 'rgba(255,255,255,0.60)');
  eg.addColorStop(0.72, 'rgba(198,224,240,0.28)');
  eg.addColorStop(0.94, 'rgba(206,232,247,0.55)');
  eg.addColorStop(1,    'rgba(24,36,48,0.62)');
  /* КРОМКА ИДЁТ ПО БОЧКЕ, А НЕ ПОПЕРЁК НЕЁ. Она была прямоугольником: прямая
     хорда резала обе эллиптические дуги, и по краям плиты повисали два
     квадратных угла, которых у цилиндра быть не может. Теперь верх кромки —
     нижняя дуга самой плиты, низ — нижняя дуга её изнанки, а замыкают их две
     вертикали на крайних точках (Эльдар увидел это при наезде, 2026-09-23). */
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.ellipse(nx, plY, capRx, capRy, 0, 0, Math.PI);
  ctx.lineTo(nx - capRx, plY + capT);
  ctx.ellipse(nx, plY + capT, capRx, capRy, 0, Math.PI, 0, true);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(238,249,255,0.96)';
  ctx.beginPath(); ctx.ellipse(nx, plY, capRx, capRy, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 1.3 * SS;
  ctx.beginPath(); ctx.ellipse(nx, plY, capRx, capRy, 0, 0, 7); ctx.stroke();
  /* A display set into the pedestal, dead on the line the caption runs along.
     It is NOT a marquee: the words inside it stand exactly where the painted
     words stand on the panel behind — same face, same size, same centre. The
     window belongs to the column and travels with it, the sentence belongs to
     the wall and stays put, so the movement you see is the column sliding
     across a line that never moves. Paint, then light, then paint again. */
  {
    /* The window is part of the column, not part of the arrival: the plinth is
       drawn for 2800 units either side, so a display that faded out at 765 was
       a screen switching itself off while you could still plainly see it. It
       dims as you leave — it never goes dark. */
    const lit = 0.34 + 0.66 * ease;
    /* ЗАКЛЁПКА. Окно врезано в колонну — значит и висеть оно должно на её
       плоскости. Оно стояло на py(730, kk), то есть на глубине стены (970),
       тогда как сама колонна живёт на ближнем плане k(-90): при наезде камеры
       два k расходятся, и экран уползал вниз, под кромку плиты. Теперь его
       центр — постоянный отступ от верха тумбы, в её же масштабе. 77.6 — это
       ровно тот зазор, что был в покое: (py(730,k(970)) − plY)/(kn·SS)
       (Эльдар: «микроэкранчик поплыл вниз», 2026-09-23). */
    /* ЛЕНТА ИДЁТ КОЛЬЦОМ ПО ВСЕЙ ТУМБЕ, а не окошком в её середине: она
       садится сразу под кромку плиты и занимает всю ширину барабана
       (Эльдар: «пусть бегает по всему кружочку»). */
    const sh2 = 19 * kn * SS;
    const stripY = plY + 17 * kn * SS + sh2 * 0.5 + 3 * kn * SS;
    const iw = pw;                             // во всю ширину барабана: это кольцо, а не окно
    const R = (iw / 2) * 1.18;                 // the cylinder it is wrapped around
    // the line as it is written on the wall, rendered flat once
    const ow2 = Math.ceil(W), oh2 = Math.ceil(sh2) + 2;
    if (!state.rec2Strip || state.rec2Strip.width !== ow2 || state.rec2Strip.height !== oh2){
      state.rec2Strip = document.createElement('canvas');
      state.rec2Strip.width = ow2; state.rec2Strip.height = oh2;
    }
    const gs = state.rec2Strip.getContext('2d');
    gs.clearRect(0, 0, ow2, oh2);
    gs.textAlign = 'center';
    // тот же кегль, что и был в покое (20·kk·SS), но привязанный к колонне
    gs.font = eraFont(8.66 * kn * SS, '700', SEGMENTS[3].font);
    try { gs.letterSpacing = `${8.66*TRACK.label*kn*SS}px`; } catch(e){}
    gs.fillStyle = `rgba(150,228,255,${(0.55 + 0.42 * lit).toFixed(3)})`;
    /* A MONITOR RUNS WHETHER OR NOT YOU ARE LOOKING AT IT. The line used to be
       written once, centred, and only while the recreation was near; it is a
       screen, so it is set in capitals and it scrolls — the same three words,
       over and over, drawn twice end to end so the loop has no seam. It runs on
       the hall's own clock, which is what keeps it in step with the line on the
       wall above it. */
    const SCAN_TX = 'SCAN \u00b7 DESIGN \u00b7 MILL \u00b7 ';
    const twSc = gs.measureText(SCAN_TX).width;
    gs.textAlign = 'left';
    const shift = (state.time * 46 * SS) % twSc;
    for (let sx2 = -shift - twSc; sx2 < ow2 + twSc; sx2 += twSc)
      gs.fillText(SCAN_TX, sx2, oh2 * 0.72);
    gs.textAlign = 'center';
    ctx.save();
    // the recess, its edges curved by the barrel of the column
    const yTopC = stripY - sh2/2, yBotC = stripY + sh2/2, bow = 3.2 * kn * SS;
    ctx.beginPath();
    ctx.moveTo(nx - iw/2, yTopC);
    ctx.quadraticCurveTo(nx, yTopC + bow, nx + iw/2, yTopC);
    ctx.lineTo(nx + iw/2, yBotC);
    ctx.quadraticCurveTo(nx, yBotC + bow, nx - iw/2, yBotC);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#0b1216';
    ctx.fillRect(nx - iw/2, yTopC - 2, iw, sh2 + 6);
    // re-lay the flat line onto the barrel: a slice at screen x reads the line
    // at the arc distance that lands there, so letters crowd toward the edges
    const step = Math.max(1, Math.round(1.5 * SS));
    for (let x = -iw/2; x < iw/2; x += step){
      const u = Math.max(-0.999, Math.min(0.999, x / R));
      const s = R * Math.asin(u);
      // the frame's edge is a quadratic Bezier with its control point at `bow`,
      // and such a curve only reaches HALF of it at the middle — the letters
      // were sagging twice as far as the glass they sit behind
      const sag = bow * 0.5 * (1 - (x / (iw/2)) * (x / (iw/2)));
      ctx.drawImage(state.rec2Strip,
                    Math.round(nx + s), 0, step + 1, oh2,
                    Math.round(nx + x), yTopC + sag - 1, step + 1, oh2);
    }
    // the glass, brighter along the crown of the barrel
    const sg2 = ctx.createLinearGradient(nx - iw/2, 0, nx + iw/2, 0);
    sg2.addColorStop(0, 'rgba(0,0,0,0.34)');
    sg2.addColorStop(0.42, 'rgba(255,255,255,0.10)');
    sg2.addColorStop(0.58, 'rgba(255,255,255,0.06)');
    sg2.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = sg2; ctx.fillRect(nx - iw/2, yTopC - 2, iw, sh2 + 6);
    ctx.restore();
    // the bezel, and the light it spills onto the column
    ctx.strokeStyle = `rgba(210,240,255,${(0.20 + 0.20 * lit).toFixed(3)})`;
    ctx.lineWidth = 1.2 * SS;
    ctx.beginPath();
    ctx.moveTo(nx - iw/2, yTopC); ctx.quadraticCurveTo(nx, yTopC + bow, nx + iw/2, yTopC);
    ctx.moveTo(nx - iw/2, yBotC); ctx.quadraticCurveTo(nx, yBotC + bow, nx + iw/2, yBotC);
    ctx.stroke();
    drawGlow('120,215,255', nx, stripY, pw * 1.5, 0.08 + 0.18 * lit);
  }
  drawGlow('225,245,255', nx, ny, cw * 1.5, 0.12 + 0.13 * ease);
  ctx.drawImage(spm.c, nx - cw/2, ny - chh/2, cw, chh);
  /* коронка делает то же, что и вся панель вокруг неё: пролёт не должен
     отзываться на палец двумя разными способами (Эльдар, 2026-09-23) */
  pushHit(nx - cw/2, ny - chh/2, cw, chh,
          {type: 'focus', beat: nearestBeat(mid).i, anchor: mid, page: DR_PAGE});
}

/* Anything that completes exactly at the alignment and then stays completed:
   it runs as you come in and does not undo itself when you walk on, because a
   file that has been made does not unmake. Two of these, on two spans — the
   pane takes its time coming down, but the cut itself is a short, late event,
   or the crown is already half a file while it is still off at the edge of the
   bay and there is nothing left to watch happen. */
function latchedPhase(mid, span){
  const d = cam.x - mid;
  if (d >= 0) return 1;
  const u = Math.max(0, Math.min(1, 1 + d / span));
  return u * u * (3 - 2 * u);
}
function scanPhase(mid){ return latchedPhase(mid, 450); }
function paneDrop(mid){
  /* The pane is on screen from 2800 units out, and its descent was computed
     over the last 900 — so for the first nineteen hundred it hung at the
     ceiling doing nothing, waiting for you to get close, which reads as a thing
     that is broken rather than a thing that is arriving. It now travels the
     whole distance it is visible for, on an ease-in: barely moving while it is
     far off, gathering speed as it comes, and landing exactly at the centre. */
  const d = cam.x - mid;
  if (d >= 0) return 1;
  const u = Math.max(0, Math.min(1, 1 + d / 2800));
  return u * u;
}

let DR_SCAN_RUNG = false;
function drawRec2(t){
  const mid = (REC2_L + REC2_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  /* (the step is laid at the END of this bay — it stands in front of the
     pilasters, so it is painted after them; see the call below) */
  const lock0 = Math.max(0, 1 - Math.abs(cam.x - mid) / 900);
  const ease0 = lock0 * lock0 * (3 - 2 * lock0);
  const kk = k(970);
  /* THE BAY ENDS WHERE ITS BLOCK BEGINS. The panel and the pilasters were drawn
     down to the counter's foot line, which is below the step's tread — and the
     block is narrower at the front than at the back, so below its back corner
     a strip of pilaster and a strip of white panel stood outside its outline,
     on the floor beside it (Eldar, 2026-09-23: «из-под помоста торчит колонна и
     часть светлой стены — их нужно подрезать ровно там, где начинается этот
     толстый пол»). The bay stands ON the block: it stops at the tread's back
     line, at the block's own plane, and the block takes it from there. */
  const yBase = py(1040, k(DR_BAY_Z));
  const x0 = px(REC2_L, kk), x1 = px(REC2_R, kk);
  /* ВЕСЬ ПРОЛЁТ ОТКРЫВАЕТ СВОЮ СТРАНИЦУ. Кликабельной была одна коронка, а
     экран, надписи и сама панель не отзывались ни на что — посетитель жмёт в
     «The digital revolution» и не получает ничего (Эльдар, 2026-09-23: «там
     только на зуб нажимается»). Зона кладётся ПЕРВОЙ: hitAt перебирает список
     с конца, поэтому коронка, которую кладут ниже по коду, по-прежнему берёт
     своё, а всё остальное поле проваливается сюда. Жест тот же, что у коронки
     — наезд камеры, а следом страница 2007 года: пролёт не должен отзываться
     на палец двумя разными способами. */
  {
    const mid = (REC2_L + REC2_R) / 2;
    pushHit(x0, 0, x1 - x0, yBase,
            {type:'focus', beat: nearestBeat(mid).i, anchor: mid, page: DR_PAGE});
  }
  // the luminous panel
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#dfe5ea');
  wg.addColorStop(0.45, '#f2f6f9');
  wg.addColorStop(1, '#c2c9cf');
  ctx.fillStyle = wg;
  /* THE PANEL IS AS WIDE AS THE BLOCK UNDER IT. The block runs sixty units past
     the pilasters on each side; the panel stopped at them, so between the
     wall's foot and the block's back edge a strip of the bay's own floor stood
     out beyond the panel — a pale ledge poking out of the side of the podium
     (Eldar, 2026-09-23, circle 1: «подрезать то, что торчит»). The background
     is drawn to the block's width and the bay's contents stay on their own
     coordinates, so nothing else moves. */
  {
    /* ONE PLANE FOR THE BAY'S OWN EDGE. The background was laid on the panel's
       plane while the pilasters stand on the bay's, so the same world x came
       out at two screen x and a hair of panel slid out from behind the column
       as the camera moved (Eldar, 2026-09-23: «полосочка правой стенки выезжает
       из-за колонны — её край должен быть спрятан за колонной и не двигаться»).
       The edge is the pilaster's own outer edge, on the pilaster's own plane. */
    const kb = k(DR_BAY_Z);
    const bx0 = px(REC2_L - STEP_PAD, kb), bx1 = px(REC2_R + STEP_PAD, kb);
    ctx.fillRect(bx0, 0, bx1 - bx0, yBase);
  }
  // a dark display niche, and the crown glowing inside it
  const sp = PED_SPRITES.crown2;
  const w = 360 * kk * SS, h = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(400, kk);
  const nw = 600 * kk * SS, nh = 520 * kk * SS;
  /* THE SCAN ARRIVED ON A WEBSITE. 2007 was not the stone age of the web —
     so the display wears the browser chrome of its year: a brushed titlebar,
     the three window dots, an address field with the case number. The dark
     screen below is the page, and the point cloud is its content. */
  {
    const hh = 46 * kk * SS;
    const bx0 = cx - nw/2, by0 = cyS - nh/2 - hh;
    ctx.save();
    ctx.shadowColor = 'rgba(20,30,40,0.35)'; ctx.shadowBlur = 14*SS; ctx.shadowOffsetY = 5*SS;
    ctx.fillStyle = '#aeb8c2';
    ctx.beginPath(); ctx.roundRect(bx0 - 6*SS, by0 - 6*SS, nw + 12*SS, nh + hh + 12*SS, 9*SS); ctx.fill();
    ctx.restore();
    const tg = ctx.createLinearGradient(0, by0, 0, by0 + hh);
    tg.addColorStop(0, '#eef2f6'); tg.addColorStop(0.5, '#cfd8e0'); tg.addColorStop(1, '#b4bfc9');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.roundRect(bx0, by0, nw, hh, 7*SS); ctx.fill();
    ctx.fillRect(bx0, by0 + hh*0.6, nw, hh*0.4);
    let dx0 = bx0 + 16*kk*SS;
    for (const col of ['#dd7168', '#e5b356', '#8cc06c']){
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(dx0, by0 + hh/2, 6*kk*SS, 0, 7); ctx.fill();
      dx0 += 20*kk*SS;
    }
    const ax0 = bx0 + 76*kk*SS, aw = nw - 96*kk*SS, ah = hh*0.52;
    ctx.fillStyle = '#fdfdfe';
    ctx.beginPath(); ctx.roundRect(ax0, by0 + (hh - ah)/2, aw, ah, ah/2); ctx.fill();
    ctx.strokeStyle = 'rgba(90,105,120,0.45)'; ctx.lineWidth = 1*SS;
    ctx.beginPath(); ctx.roundRect(ax0, by0 + (hh - ah)/2, aw, ah, ah/2); ctx.stroke();
    ctx.fillStyle = '#5a6672';
    ctx.font = `${Math.max(7, 15 * kk * SS) | 0}px "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText('http://www.glidewelldental.com/cases/C-1029478 · digital impression',
                 ax0 + 12*kk*SS, by0 + hh/2 + 5*kk*SS);
    ctx.textAlign = 'center';
  }
  const ng = ctx.createLinearGradient(0, cyS - nh/2, 0, cyS + nh/2);
  ng.addColorStop(0, '#1f242b'); ng.addColorStop(1, '#2c333c');
  ctx.fillStyle = ng;
  ctx.beginPath(); ctx.roundRect(cx - nw/2, cyS - nh/2, nw, nh, 10*SS); ctx.fill();
  drawGlow('160,220,255', cx, cyS, w * 1.15, 0.45);
  // the back plane holds the SCAN: measured points, not yet an object
  const ws = 499 * kk * SS, hs = ws * sp.h / sp.w;
  drawCrownScan(cx, cyS, ws, 1);
  // THE MOMENT OF ALIGNMENT: when the three states lock, the form the points
  // have only been describing flares into being for an instant — the data
  // becomes the object, once, and then the room settles back
  if (!state.rec2) state.rec2 = {fired: false, t0: -9, prev: null};
  const dxm = cam.x - mid;
  const crossed = state.rec2.prev != null && state.rec2.prev !== 0 &&
                  Math.sign(state.rec2.prev) !== Math.sign(dxm);
  if (!state.rec2.fired && (crossed || Math.abs(dxm) < 6)){
    state.rec2.fired = true; state.rec2.t0 = t;
  }
  if (Math.abs(dxm) > 320) state.rec2.fired = false;   // re-armed once you leave
  state.rec2.prev = dxm;
  const fl = Math.max(0, 1 - (t - state.rec2.t0) / 0.75);
  if (fl > 0.001){
    const f = fl * fl;
    drawGlow('200,242,255', cx, cyS, ws * 2.4, 0.55 * f);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9 * f;
    ctx.drawImage(sp.c, cx - ws/2, cyS - hs/2, ws, hs);
    ctx.restore();
    // and the panel itself takes the light for that instant
    ctx.fillStyle = `rgba(215,245,255,${(0.16 * f).toFixed(3)})`;
    ctx.fillRect(x0, 0, x1 - x0, yBase);
  }
  pushHit(cx - w/2, cyS - h/2, w, h, {type:'photo', sp: Object.assign({inner:{w:sp.w,h:sp.h}}, sp),
          wx: mid, cy: 400, z: 968, w: 360, cap: '2009 · the digital revolution',
          beat: BEATS.findIndex(b => b.t === 'BRUXZIR')});
  const ease = ease0;

  // the three states name themselves on the panel itself, which means the
  // pilasters stand in front of the words — see the strip on the column below
  if (ease > 0.15){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(20 * kk * SS, '700', SEGMENTS[3].font);
    try { ctx.letterSpacing = `${20*TRACK.label*kk*SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(70,110,135,${(0.75 * ease).toFixed(3)})`;
    /* НАДПИСЬ НА СТЕНЕ СНЯТА: её теперь несёт кольцо тумбы, и в покое плита
       вставала ровно на неё — слова читались призраком сквозь стекло. Панель
       говорит своё, кольцо своё, третьего не нужно (2026-09-23). */
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.restore();
  }

  // THE FILE — it descends from above as you arrive, on its own suspension
  {
    /* The file is not a ghost hanging in the air. It is displayed ON something:
       a pane of frosted glass suspended on two wires between the wall and the
       crown, which descends as you arrive and carries the mesh on its face.
       The pane is cut just inside the black screen behind it, so that screen
       reads as the frame around the whole central composition. */
    const kf = k(500);
    const fx = px(mid, kf);
    const gw = nw * 0.90, gh = nh * 0.90;
    const spF = PED_SPRITES.crown2;
    const fw = Math.min(gw * 0.68, gh * 0.80 * spF.w / spF.h);
    /* The pane comes down once. Having come down it hangs: it does not ride
       back up when you walk on, it only travels with the room the way anything
       fixed in the room travels. So its descent — and the mesh's presence on
       it — is latched by the scan phase, not by how near you happen to be. */
    const drop = paneDrop(mid);
    const rest = py(408, kf), from = rest - 260 * kf * SS;
    const fy = rest + (from - rest) * (1 - drop);
    const gx = fx - gw / 2, gy = fy - gh / 2;
    const ga = 0.14 + 0.86 * drop;
    ctx.strokeStyle = `rgba(150,210,235,${(0.28 * ga).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    ctx.beginPath();
    ctx.moveTo(gx + gw * 0.17, 0); ctx.lineTo(gx + gw * 0.17, gy);
    ctx.moveTo(gx + gw * 0.83, 0); ctx.lineTo(gx + gw * 0.83, gy);
    ctx.stroke();
    // the sheet itself: it lightens what is behind it without showing it
    const gg = ctx.createLinearGradient(0, gy, 0, gy + gh);
    gg.addColorStop(0,   `rgba(228,242,252,${(0.22 * ga).toFixed(3)})`);
    gg.addColorStop(0.5, `rgba(208,229,245,${(0.13 * ga).toFixed(3)})`);
    gg.addColorStop(1,   `rgba(188,214,236,${(0.19 * ga).toFixed(3)})`);
    ctx.fillStyle = gg; ctx.fillRect(gx, gy, gw, gh);
    // one sheen running across it, the way a pane of glass takes the room
    const gsh = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
    gsh.addColorStop(0,    `rgba(255,255,255,${(0.11 * ga).toFixed(3)})`);
    gsh.addColorStop(0.34, `rgba(255,255,255,${(0.02 * ga).toFixed(3)})`);
    gsh.addColorStop(0.58, `rgba(255,255,255,${(0.08 * ga).toFixed(3)})`);
    gsh.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = gsh; ctx.fillRect(gx, gy, gw, gh);
    /* Thickness. A sheet of glass is read almost entirely from its edges: thin
       glass has a hairline and looks cheap, thick glass has a bevel that takes
       the light differently on every side and a ground foot where the light
       that travelled through the pane finally gets out. */
    const bv = 11 * kf * SS;
    const quad = (a, b, c, d, al) => {
      ctx.fillStyle = `rgba(226,244,255,${(al * ga).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath(); ctx.fill();
    };
    const X0 = gx, X1 = gx + gw, Y0 = gy, Y1 = gy + gh;
    quad([X0,Y0], [X1,Y0], [X1-bv,Y0+bv], [X0+bv,Y0+bv], 0.50);          // top facet
    quad([X0,Y0], [X0+bv,Y0+bv], [X0+bv,Y1-bv], [X0,Y1], 0.34);          // left facet
    quad([X1,Y0], [X1,Y1], [X1-bv,Y1-bv], [X1-bv,Y0+bv], 0.16);          // right, turned away
    quad([X0,Y1], [X1,Y1], [X1-bv,Y1-bv], [X0+bv,Y1-bv], 0.62);          // the foot
    // the line where the bevel meets the face, and the outer arris
    ctx.strokeStyle = `rgba(240,252,255,${(0.34 * ga).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    ctx.strokeRect(X0 + bv, Y0 + bv, gw - bv * 2, gh - bv * 2);
    ctx.strokeStyle = `rgba(206,236,254,${(0.55 * ga).toFixed(3)})`;
    ctx.lineWidth = 2.2 * SS;
    ctx.strokeRect(X0, Y0, gw, gh);
    // light that travelled the pane leaves at the ground foot
    const geg = ctx.createLinearGradient(0, Y1 - bv * 1.6, 0, Y1);
    geg.addColorStop(0, 'rgba(190,232,255,0)');
    geg.addColorStop(1, `rgba(228,248,255,${(0.75 * ga).toFixed(3)})`);
    ctx.fillStyle = geg; ctx.fillRect(X0, Y1 - bv * 1.6, gw, bv * 1.6);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('150,220,255', (X0 + X1) / 2, Y1, gw * 0.9, 0.10 * ga);
    ctx.restore();
    // and now the mesh, on its face
    ctx.save();
    ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
    /* the beam reaching the foot of the crown is an event, and it gets a
       sound: the head of one bright whoosh, cut short. It re-arms once the bay
       is well behind you, so walking back and forth rings it again. */
    const sph = scanPhase(mid);
    if (sph > 0.985){ if (!DR_SCAN_RUNG){ DR_SCAN_RUNG = true; pingOnce('ws08', 0.5, 620); } }
    else if (sph < 0.5) DR_SCAN_RUNG = false;
    drawCrownFile(fx, fy, fw, 0.25 + 0.75 * drop, sph);
    ctx.restore();
  }

  // the inscription crowns the panel: the plinth in front of it owns the
  // lower centre, so the title cannot live down there
  ctx.save();
  ctx.textAlign = 'center';
  // A revolution does not whisper. Seventy per cent bigger, bold, and dark
  // enough to hold its own against a wall of year numerals.
  ctx.font = eraFont(58 * kk * SS, '700', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${58*TRACK.title*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(32,42,54,0.96)';
  /* THREE LINES, NOT TWO CLAUSES ON ONE. The pair of statements ran as a
     single 90-character line under the title with a mid-dot between them —
     wider than the title itself, which is upside down: the title should be the
     widest thing on the panel. They are two facts, so they take a line each,
     centred under the title on the same axis, and the whole block lifts by two
     lines to leave the air it needs above the exhibits. */
  ctx.fillText('The digital revolution', cx, py(-62, kk));
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(30 * kk * SS, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(60,70,84,0.95)';
  ctx.fillText('the impression becomes a scan', cx, py(2, kk));
  ctx.fillText('the crown becomes a file', cx, py(44, kk));
  // era markers on the panel shoulders: inside the panel, clear of the columns
  ctx.font = eraFont(24 * kk * SS, '700', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(110,120,132,0.7)';
  ctx.textAlign = 'left';
  ctx.fillText('\u2190 the analog century', x0 + 100*kk*SS, py(800, kk));
  ctx.textAlign = 'right';
  ctx.fillText('the digital age \u2192', x1 - 100*kk*SS, py(800, kk));
  ctx.restore();
  // pilaster columns, cool tone, same plane
  for (const wxc of [REC2_L, REC2_R]){
    const kc = k(DR_BAY_Z);
    const sxc = px(wxc, kc);
    const cw = 120 * kc * SS;
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#3c4046'); cg.addColorStop(0.45, '#7e858c'); cg.addColorStop(1, '#2e3238');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, yBase);
    // (the ice-cool trim is gone with the other columns' — see drawHallPortalColumns)
  }
  /* THE STEP STANDS IN FRONT OF THE PILASTERS. Its back is riveted to their
     plane and its nose is four hundred units nearer, so from the side its end
     must cover the foot of the column, exactly as it does at 1989 — where the
     step has always been painted after them. Painted before, it read as a block
     sliding behind the bay (Eldar, 2026-09-22: «ступенька должна как бы
     перекрывать колонну»). */
  drawBayStep(REC2_L, REC2_R, STEP_TONE.cool, DR_BAY_Z, noseOf(DR_BAY_Z));
}

/* the 2022 recreation: the scanner's portal — panelled white ends here,
   pure futurist white begins on the far side */
function drawRec4(t){
  const mid = (REC4_L + REC4_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  /* (the step is laid after the portal's columns, at the end of this bay) */
  const kk = k(1000);   // the portal stands proud of the deep white wall
  /* THE BAY ENDS WHERE ITS BLOCK BEGINS. The panel and the pilasters were drawn
     down to the counter's foot line, which is below the step's tread — and the
     block is narrower at the front than at the back, so below its back corner
     a strip of pilaster and a strip of white panel stood outside its outline,
     on the floor beside it (Eldar, 2026-09-23: «из-под помоста торчит колонна и
     часть светлой стены — их нужно подрезать ровно там, где начинается этот
     толстый пол»). The bay stands ON the block: it stops at the tread's back
     line, at the block's own plane, and the block takes it from there. */
  /* THE PANEL IS AS WIDE AS THE BLOCK UNDER IT. The block runs sixty units past
     the pilasters on each side; the panel stopped at them, so between the
     wall's foot and the block's back edge a strip of the bay's own floor stood
     out beyond the panel — a pale ledge poking out of the side of the podium
     (Eldar, 2026-09-23, circle 1: «подрезать то, что торчит»). The background
     is drawn to the block's width and the bay's contents stay on their own
     coordinates, so nothing else moves. */
  const yBase = py(1040, k(R22_BAY_Z));
  const x0 = px(REC4_L, kk), x1 = px(REC4_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#f2f4f6');
  wg.addColorStop(0.5, '#fbfcfd');
  wg.addColorStop(1, '#dde0e3');
  ctx.fillStyle = wg;
  {
    /* ONE PLANE FOR THE BAY'S OWN EDGE. The background was laid on the panel's
       plane while the pilasters stand on the bay's, so the same world x came
       out at two screen x and a hair of panel slid out from behind the column
       as the camera moved (Eldar, 2026-09-23: «полосочка правой стенки выезжает
       из-за колонны — её край должен быть спрятан за колонной и не двигаться»).
       The edge is the pilaster's own outer edge, on the pilaster's own plane. */
    const kb = k(R22_BAY_Z);
    const bx0 = px(REC4_L - STEP_PAD, kb), bx1 = px(REC4_R + STEP_PAD, kb);
    ctx.fillRect(bx0, 0, bx1 - bx0, yBase);
  }
  // a faint scan-sweep drifts across the panel — the room itself being read
  const sweep = (state.time * 120) % 1400 - 200;
  const swx = x0 + (x1 - x0) * (sweep / 1000);
  if (swx > x0 && swx < x1){
    const sg = ctx.createLinearGradient(swx - 40*SS, 0, swx + 40*SS, 0);
    sg.addColorStop(0, 'rgba(120,205,255,0)');
    sg.addColorStop(0.5, 'rgba(120,205,255,0.10)');
    sg.addColorStop(1, 'rgba(120,205,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(swx - 40*SS, 0, 80*SS, yBase);
  }
  /* THE BAY IS THE PICTURE. This used to be a stadium-shaped niche drawn with
     gradients, with the instrument cut out of its own photograph and stood
     inside it — two renderings of the same reference, one on top of the other,
     and the cutout wandered against the drawn light as the camera moved.

     The reference already IS a niche in a wall above a plinth, photographed
     square on. So it goes in whole, as a rectangle, filling the bay from one
     column to the other: no cutting, nothing to slip. It is cover-fitted, which
     crops its outer wall and keeps the lit niche, and it lands on whole pixels
     so a rigid picture crossing the frame cannot boil. */
  {
    const sp = PROP_SPRITES.ph_scanbay;
    if (sp){
      const kc = k(992);
      const cw = 120 * kc * SS;                       // the columns' own width
      const bx0 = px(REC4_L, kc) + cw/2, bx1 = px(REC4_R, kc) - cw/2;
      const bw = Math.max(1, bx1 - bx0), bh = yBase;
      const scale = Math.max(bw / sp.w, bh / sp.h);   // cover: fill it, crop the rest
      const dw = sp.w * scale, dh = sp.h * scale;
      ctx.save();
      ctx.beginPath(); ctx.rect(Math.round(bx0), 0, Math.round(bw), Math.round(bh)); ctx.clip();
      ctx.drawImage(spriteMip(sp, Math.round(dw), Math.round(dh)),
                    Math.round(bx0 + (bw - dw) / 2), Math.round(bh - dh),
                    Math.round(dw), Math.round(dh));
      /* the plinth's face in the render runs rows 1250–1510 of 1573; its middle
         is where the title sits — centred on the block, on the picture's plane */
      BAY_LABELS['2022'] = {x: bx0 + bw / 2, y: bh - dh * (1 - 1380 / 1573), k: kc};
      /* the exhibit flares as you arrive, the way the years and the lamps do */
      const near = Math.max(0, 1 - Math.abs(mid - cam.x) / 900);
      if (near > 0.02){
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(120,190,255,' + (0.05 * near * near).toFixed(3) + ')';
        ctx.fillRect(bx0, 0, bw, bh);
      }
      ctx.restore();
    }
  }
  drawRec4Columns(yBase);
  drawBayStep(REC4_L, REC4_R, STEP_TONE.white, R22_BAY_Z, noseOf(R22_BAY_Z));   // in front of the portal's own columns
}
/* THE STEP AT THE MOUTH OF A BAY. 1979 had it first: between the panel's foot
   and the floor slab a dark band showed, and the columns seemed to stand over a
   hole. A low block fills it — a tread in perspective, a riser under the
   nosing, and a concealed strip washing the riser and a little of the floor.
   It belongs to every recreation, not to one, and each takes its own stone: the
   craft century's is warm, the later rooms are cool and pale. */
function drawBayStep(L, R, tone, zBack, zNose){
  /* Where the block stands in depth. EVERY BAY NOW NAMES ITS OWN PILASTERS'
     PLANE, and the default is only a fallback: 1989 was riveted to its columns
     at 722 and the other two were left on the generic 590, so those two slid
     against their own bays as the camera moved and their end faces — which only
     appear when perspective opens an end — behaved differently from 1989's
     (Eldar, 2026-09-22: «она ездит относительно центра композиции и не имеет
     стенки сбоку»). The three planes are the ones their columns are drawn
     on: 722 at 1989, 964 at the Digital Revolution, 992 at 2022. */
  /* THE BACK IS RIVETED, THE NOSE STAYS WHERE IT WAS. Taking the nose 82 units
     in front of a back that stands at 964 or 992 put the whole block behind the
     counters, and all that was left of it was a pair of ends peeping out beside
     them (Eldar, 2026-09-22: «ступенька куда-то назад ушла»). A bay may name
     its nose as well: the back on its own pilasters' plane, the nose out at the
     depth the block always had. 1989 keeps the shallow pair it was drawn with. */
  const zB = zBack != null ? zBack : 590;
  const zF = zNose != null ? zNose : (zBack != null ? zBack - 82 : 520);
  const kFar = k(zB), kStep = k(zF), zTread = 1040;
  /* THE BACK EDGE IS THE WALL'S FOOT. A block standing in a niche is deeper
     than the wall beside it, so a back edge taken at the block's own plane sits
     ABOVE the skirting and the two lines never meet. The block is buried in the
     wall: backZ names the wall whose floor line its back edge lies on, and
     there the tread and the floor are the same line (Eldar, 2026-09-23). */
  const yTreadBack = py(zTread, kFar);
  const yNose = py(zTread, kStep), yStepFoot = py(1080, kStep);
  /* AND THE BLOCK KEEPS ITS THICKNESS AT THE BACK. Pinning the tread to the
     wall's foot and then putting the block's base on the same line collapsed
     the end face to a triangle: the block appeared to taper away to nothing at
     the side (Eldar, 2026-09-23: «правая грань стала треугольной — верни как
     было, не возвращая отражение»). The base is the tread's own line plus the
     block's own height at that plane, so the end is the quad it always was. */
  const yBackFoot = py(1080, kFar);
  /* BOLTED TO THE BAY. Its ends were taken from wherever the counters happened
     to stop, which is a different plane and a different pair of numbers on each
     side — so the block slid against its own panel as the camera moved and came
     out far too long at 2022. It runs from pilaster to pilaster now, half a
     column past each, in the bay's own world coordinates: it cannot drift
     against the wall it belongs to. */
  const wx0 = L - STEP_PAD, wx1 = R + STEP_PAD;
  const bx0 = px(wx0, kFar), bx1 = px(wx1, kFar);
  const nx0 = px(wx0, kStep), nx1 = px(wx1, kStep);
  if (nx1 < -200 || nx0 > W + 200) return;
  const T = tone;
  const tg = ctx.createLinearGradient(0, yTreadBack, 0, yNose);
  tg.addColorStop(0, T.tread[0]); tg.addColorStop(1, T.tread[1]);
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.moveTo(bx0, yTreadBack); ctx.lineTo(bx1, yTreadBack);
  ctx.lineTo(nx1, yNose); ctx.lineTo(nx0, yNose); ctx.closePath(); ctx.fill();
  const rg = ctx.createLinearGradient(0, yNose, 0, yStepFoot);
  rg.addColorStop(0, T.riser[0]); rg.addColorStop(0.5, T.riser[1]); rg.addColorStop(1, T.riser[2]);
  ctx.fillStyle = rg;

/* A SHAFT OF STONE MADE OF ITS OWN BANDS. Takes the marble face of one stone
   (the render's lower third, below the top lip) and lays copies of it down an
   offscreen canvas until the wanted height is filled; every copy after the
   first overlaps the one above by a quarter of its height with a feathered
   top, so the repeat reads as one continuous face. Built once per size. */
const SHAFTS = new Map();
function stoneShaft(im, sx, sw, ih, dw, dh){
  const W2 = Math.max(2, Math.round(dw)), H2 = Math.max(2, Math.round(dh));
  const key = `${sx|0}:${sw|0}:${W2}x${H2}`;
  const had = SHAFTS.get(key); if (had) return had;
  const c = document.createElement('canvas'); c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const sy = ih * 0.66, sh = ih - sy;                 // the marble face, below the lip
  const bh = Math.max(4, Math.round(sh * (dw / sw)));  // its height at the drawn width — unscaled proportions
  const ov = Math.round(bh * 0.25);

  const band = document.createElement('canvas'); band.width = W2; band.height = bh;
  const gb = band.getContext('2d');
  gb.drawImage(im, sx, sy, sw, sh, 0, 0, W2, bh);
  gb.globalCompositeOperation = 'destination-out';
  const fg = gb.createLinearGradient(0, 0, 0, ov);
  fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
  gb.fillStyle = fg; gb.fillRect(0, 0, W2, ov);
  // the first course is laid whole (its top meets the stone's real bottom edge)
  g.drawImage(im, sx, sy, sw, sh, 0, 0, W2, bh);
  for (let y = bh - ov; y < H2; y += bh - ov) g.drawImage(band, 0, y);
  SHAFTS.set(key, c);
  return c;
}

const MESH = (() => {

  // a superellipse plan (rounded-square, like a real molar footprint), four
  // cusps lifting the occlusal rim, and a pole kept low as the central fossa
  const prof = [[0,44],[27,58],[42,50],[47,28],[48,2],[45,-24],[38,-46],[24,-60],[0,-64]];
  const M = 16, rings = [];
  for (let m = 0; m < M; m++){
    const a = m/M * Math.PI*2;
    const sq = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 3) + Math.pow(Math.abs(Math.sin(a)), 3), 1/3);
    const cusp = Math.pow(Math.cos(2*a + Math.PI/4), 2);
    const ring = [];
    for (let p = 0; p < prof.length; p++){
      let r = prof[p][0], y = prof[p][1];
      r *= 0.88 + 0.14*sq;
      if (p === 1) y += 7*cusp - 3;
      ring.push([r*Math.cos(a), -y, r*Math.sin(a)]);
    }
    rings.push(ring);

function projMesh(rot){
  const out = [];

    const pr = [];

      const rx = x*ca - z*sa, rz = x*sa + z*ca;
      const pp = 1 / (1 + rz/420);
      pr.push([rx*pp, y*pp + rz*0.06, rz]);

/* How far the machine has got. Driven by the approach, not by a clock: the job

   still it stands still with you. */
function screenProgress(x){
  const u = Math.max(0, Math.min(1, 1 - Math.abs(cam.x - x) / 1100));
  return u * u * (3 - 2 * u);

function screenRead(g, r, s, tone, txt){
  g.fillStyle = tone;

function drawScreenCAD(g, r, t, amber, prog){
  // phosphor wireframe crown, slowly turning — green or amber
  const dim = amber ? 'rgba(160,120,40,0.25)' : 'rgba(70,160,110,0.25)';
  g.fillStyle = amber ? '#130d04' : '#06130a'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = dim; g.lineWidth = 1;
  for (let i = 1; i < 6; i++){ // faint grid
    g.beginPath(); g.moveTo(r.x, r.y + r.h*i/6); g.lineTo(r.x + r.w, r.y + r.h*i/6); g.stroke();
    g.beginPath(); g.moveTo(r.x + r.w*i/6, r.y); g.lineTo(r.x + r.w*i/6, r.y + r.h); g.stroke();
  }
  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(t*0.5);
  g.lineWidth = Math.max(1, s*1.1);

    const a = pts[m], b = pts[(m+1) % MESH.M];

      g.strokeStyle = `rgba(${amber ? '255,190,90' : '120,235,160'},${(0.75 - 0.55*depth).toFixed(2)})`;

        g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);
        g.lineTo(cx + a[p+1][0]*s, cy + a[p+1][1]*s); g.stroke();

      g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);

             amber ? `case 04417 \u00b7 layer ${1 + Math.round(P * 8)} of 9`
                   : `computing path \u2026 ${Math.round(P * 100)}%`);
  g.fillStyle = amber ? 'rgba(255,205,120,0.85)' : 'rgba(140,240,175,0.85)';
  g.font = `${Math.max(8, 9*s)}px monospace`;
  g.textAlign = 'left';
  /* ДВЕ СТРОКИ — ДВЕ БАЗОВЫЕ ЛИНИИ. screenRead пишет ровно в r.y + r.h − 8s,
     и эта строка писалась в ту же точку: монитор с самого начала печатал две
     фразы одна поверх другой, и это читалось шумом. Видно стало, когда экран
     встал на уровень глаз (Эльдар, 2026-09-23). Название очереди — строкой
     выше, живая строка прогресса — внизу. */
  g.fillText(amber ? 'Glidewell · chairside' : 'CAD · crown 14 · milling queue',
             r.x + 8*s, r.y + r.h - 8*s - Math.max(11, 12*s));

  g.fillStyle = 'rgba(0,0,0,0.16)';

function drawScreenScan(g, r, t, prog){
  // blue point-cloud of an intraoral scan arriving

  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(-t*0.35);

      n++;

      const depth = (q[2] + 70) / 140;
      g.fillStyle = `rgba(110,190,255,${(0.9 - 0.6*depth).toFixed(2)})`;
      g.fillRect(cx + q[0]*s, cy + q[1]*s, Math.max(1, 1.6*s*(1-depth*0.5)), Math.max(1, 1.6*s*(1-depth*0.5)));

function drawMonitor(p, x, z, wWorld, t){
  const mon = MONS[p.kind]; if (!mon) return;
  const kk = k(bz(z));
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / mon.w) * kk * SS;
  const syFoot = py(CFG.benchY - 2, kk);
  const dx = sx - mon.w*scale/2, dy = syFoot - mon.foot*scale;
  pushHit(dx, dy, mon.w*scale, mon.h*scale, {type:'focus', beat: BEATS.findIndex(bb => (bb.props||[]).includes(p)), anchor: x});
  contactShadow(sx, syFoot, mon.w * scale * 0.72, 0.38);
  ctx.drawImage(mon.c, dx, dy, mon.w*scale, mon.h*scale);
  if (p.label){
    const segL = segAt(x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.round(17*kk*SS)}px ${segL.font}`;
    try { ctx.letterSpacing = `${17*TRACK.label*kk*SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(${segL.ink},0.6)`;
    ctx.fillText(p.label, sx, syFoot + 34*kk*SS);
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.restore();
  }
  // live screen
  const r = {x: dx + mon.screen.x*scale, y: dy + mon.screen.y*scale,
             w: mon.screen.w*scale, h: mon.screen.h*scale};
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  const prog = screenProgress(x);
  if (p.kind === 'crt') drawScreenCAD(ctx, r, t, p.col === 'amber', prog);
  else drawScreenScan(ctx, r, t, prog);
  ctx.restore();
  // screen light spills into the room
  const glow = p.kind === 'crt' ? (p.col === 'amber' ? '235,170,80' : '110,220,150') : '110,180,255';
  const flick = 0.8 + 0.2*Math.sin(t*9 + x);
  drawGlow(glow, r.x + r.w/2, r.y + r.h/2, r.w*1.6, 0.10*flick);
}

const PROPS = [], SHEETS = [], FIGURES = [];
/* PHOTO SKIN (pilot) — real photographed artifacts replace the drawn
   placeholders when the page runs with ?skin=photo. Assets live in
   assets/photo/ (see SKIN_SPEC.md); each is a neutral-lit cutout that the
   engine lights and shades itself. Same slots, same physics, same audits. */
// the photographed hall IS the hall now; ?skin=flat brings back the drawn one
const PHOTO_SKIN = !/[?&]skin=flat/.test(location.search);

/* SCENE PLATES — a fully generated frame of the hall dropped between beats.
   A plate is a matte painting: flat, one depth, so everything inside it moves
   at a single parallax rate. Hung on the open wall it would shear against the
   procedural room; set BACK at the wall's own depth it reads as a recessed
   alcove — the reveal at its edges explains the step in the counter line, and
   the hall's bench passes in front of it the way a real counter passes a niche.
   Data-driven: drop a file in assets/photo/ and add one row. */
/* A plate may be cut into depth layers. The trick is that layers share a
   SCREEN width, not a world width: a band at depth z is given world width
   sw/k(z), so it projects back to exactly sw and the bands stay glued when the
   camera is centred — but each then travels at its own parallax rate, the wall
   with the masonry and the counter with the bench.

   The catch, and it decides how the plate must be generated: anything BAKED on
   the counter travels with whichever band it was cut into. Objects sitting on
   the counter belong to neither band, so with a baked still life they slide
   along the counter as you scroll — the exact artefact the rivet law exists to
   prevent. So: a layered plate must be generated EMPTY (wall, counter and
   cabinets only) and carry its objects as sprites in `props`, which stand at
   their own depth and can be lit and clicked like everything else in the hall.
   A plate WITH objects baked in must stay single-layer (`layers` omitted):
   flat, at wall depth, where nothing inside it can slide against anything. */
/* The founding bench, whole. Its scale is not chosen by eye: the counter's own
   top surface — from where the wall meets it to its front edge — is made to
   match the hall's, 71 px of photograph onto 74 px of room. Front edge to front
   edge, back edge to the wall; everything else then follows, and the picture
   comes out a fifth smaller than it was. */
const PLATES = GAP.on ? [{
  x: bayStart(1) + CUTS[1].w / 2, sw: 1874, benchFrac: 0.611,
  layers: [{img: 'plate_bay_front.png', z: 0}],
}] : [];
async function loadPlates(){
  const jobs = [];
  for (const p of PLATES)
    for (const L of (p.layers || [{img: p.img, z: p.z}]))
      jobs.push(new Promise(res => {
        let fallback = false;
        const tryLoad = (bust) => {
          const im = new Image();
          im.onload = () => { L.sp = im; if (im.decode) im.decode().catch(() => {}); res(); };
          im.onerror = () => {
            if (!bust) return tryLoad(true);          // a cached miss deserves one retry
            if (!fallback){ fallback = true; return tryLoad(false); }   // no webp? take the original
            console.error('plate layer missing:', L.img, '— the bench will not appear');
            L.sp = null; res();
          };
          im.src = (fallback ? vurl('assets/photo/' + L.img) : photoURL(L.img)) + (bust ? '&r=' + Date.now() : '');
        };
        tryLoad(false);
      }));
  await Promise.all(jobs);
  for (const p of PLATES) p.layers = (p.layers || []).filter(L => L.sp);
}
/* drawn straight after the bench, so the plate's own counter and cabinets
   stand in for the procedural ones inside the niche */
/* A plate owns its bay: the hall's ambient furniture — bench props, pinned
   sheets, passers-by — must not stand inside the picture it brings, or they
   read as junk floating over someone's workbench. Culled at boot, by data. */
function snapPlatesToTables(){
  for (const p of PLATES){

       a seam even when the wood on both sides matches. Each tile now runs a
       little way into the one already laid and comes up through it in steps, so

        if (flip){ ctx.translate(sa + sWid, 0); ctx.scale(-1, 1); ctx.translate(-sa, 0); }
        ctx.drawImage(im, c0, PL_ROW.top, c1 - c0, IH - PL_ROW.top,

         fade with nothing underneath, so the wall showed through in a band the
         width of the feather. It runs INTO the plate now, over the same clean

       worktop's back edge runs on through the join without a step. The piece
       dissolves into the tiling along its inner edge over the 90 columns of

        if (sa > W || sa + sWid < 0) return;

        const bh2 = BAND2 * EU * SS;
        const put2 = (a2, b2, al) => {
          if (b2 <= a2) return;
          ctx.save();
          ctx.globalAlpha = al;
          ctx.beginPath(); ctx.rect(a2, yE - 2, b2 - a2, yFloor - yE + 4); ctx.clip();
          ctx.drawImage(im2, sa, yE, sWid + 0.6, hE);
          let y2 = yE + hE, m2 = true;
          while (y2 < yFloor - 0.5 && bh2 > 1){
            ctx.save();
            ctx.beginPath(); ctx.rect(sa, y2, sWid + 1, Math.min(bh2, yFloor - y2) + 0.5); ctx.clip();
            if (m2){ ctx.translate(0, 2 * y2 + bh2); ctx.scale(1, -1); }
            ctx.drawImage(im2, 0, ih2 - BAND2, iw2, BAND2, sa, y2, sWid + 1, bh2);
            ctx.restore();
            y2 += bh2; m2 = !m2;
          }
          ctx.restore();

        const f = PL_END.join * EU * SS, N2 = 8;
        if (fadeRight){

            put2(sa + sWid - f * (N2 - j) / N2, sa + sWid - f * (N2 - j - 1) / N2, 1 - (j + 0.5) / N2);
        } else {
          put2(sa + f, sa + sWid, 1);
          for (let j = 0; j < N2; j++)

    gr.addColorStop(0.08, 'rgba(0,0,0,0)');

       the counter has its own corners now.) */

/* the skin's files are re-cut under the same names as the room is tuned, so a
   browser that has already seen one keeps serving it back; every photo asset
   carries the build stamp and a new cut is fetched the moment it exists */
const ASSET_V = '20260923-implant2';
const vurl = p => p + (p.includes('?') ? '&' : '?') + 'v=' + ASSET_V;
/* EVERY PHOTOGRAPH IS SERVED AS WEBP. The names below still say .png and .jpg
   because that is what the file in the studio is; on the wire it is the webp
   beside it. Re-encoded at quality 94 (lossless for the one where the chroma
   showed), the eighteen megabytes of cut-outs and wall textures the hall pulls
   at boot come down to under five, with a mean error on visible pixels of two
   or three levels out of two hundred and fifty-five — and the alpha channel
   bit-for-bit identical, which is what a cut-out actually depends on. */
const WEBP_OK = !/[?&]src=orig/.test(location.search);

/* the procedural era walls (tools/make_wall.py) stand in for the drawn ones —

function wallSwitchX(){

function applyPhotoTextures(){

     one era with one wall, and this is it: panelled wood, photographed. It used
     to fall back to the drawn wood, which was the last procedural wall left in
     the hall. Cropped between two real plank joints a whole number of planks
     apart, so a repeat lands joint on joint; nothing is blended at the edges,
     because blending them is what put one joint on top of another. */
  TEX.wall1_dark = PHOTO_TEX.wall_e1_1907 || TEX.wall1;
  for (const [slot, key] of [['wall1','wall_e1'], ['wall2','wall_e2'], ['wall3','wall_e3'], ['wall4','wall_e4'], ['front4','front_e4'],

     in two finishes, each with its downlight scallops and the lit skirting at
     the foot. One tile is three panels, cut seam to seam (x 573–1600 of the
     render) and from the ceiling line to the floor line (y 44–640), so the
     repeat lands on a joint and the ends fall between two lights. The wall
     hangs from world −520 to 1080, 1600 units for 596 render pixels, so the
     tile's true width is 1600 × 1027/596 ≈ 2757 units — declared here so the

  for (const key of ['wall_e2', 'wall_e3']) if (PHOTO_TEX[key]) PHOTO_TEX[key].worldW = 2757;

    else PROPS.splice(i, 1);

  // relays are seated only now: TABLES and the settled PROPS both exist
  initFilmRelays();

  JIM_FIG = makeFigure(99);
  BOOK_SPRITE = makeBookPyramid();
  BOOK_CARD = makeBookCard();
  for (let v = 0; v < 3; v++){
    FG_SPRITES['plant' + v] = makeFgSprite('plant', v);
    FG_SPRITES['person' + v] = makeFgSprite('person', v + 7);
  }
  FIGURES.sort((f1, f2) => f2.z - f1.z);
  auditPlacements();
}

/* THE BLANK. BruxZir's real subject is not a crown, it is a disc: solid
   zirconia goes into the mill whole and comes out with nineteen crowns cut out
   of it, still held on their sprues. That is the argument of 2009 in one
   object — the restoration has stopped being a thing a pair of hands builds up
   and become a thing a machine takes away. So the plinth and its single crown
   are gone, and a mill stands on the bench instead, cutting the blank as you
   come: nineteen pockets in raster order, each one fast, the tool jumping
   between them. Scroll drives it and it latches, because a disc that has been
   cut does not fill back in. */
let DISC_SLOTS = null;
function discSlots(){
  if (DISC_SLOTS) return DISC_SLOTS;
  const pts = [{u: 0, v: 0}];
  for (let i = 0; i < 6; i++){
    const a = Math.PI * 2 * i / 6 - Math.PI / 2;
    pts.push({u: Math.cos(a) * 0.37, v: Math.sin(a) * 0.37});
  }
  for (let i = 0; i < 12; i++){
    const a = Math.PI * 2 * i / 12 - Math.PI / 2 + Math.PI / 12;
    pts.push({u: Math.cos(a) * 0.70, v: Math.sin(a) * 0.70});
  }
  pts.sort((p, q) => (p.v - q.v) || (p.u - q.u));   // a mill works in rows
  return (DISC_SLOTS = pts);
}

function drawCrownBlob(x, y, r, a){
  ctx.fillStyle = `rgba(246,244,240,${a.toFixed(3)})`;
  ctx.beginPath();
  for (let i = 0; i <= 16; i++){
    const th = Math.PI * 2 * i / 16;
    const rr = r * (0.86 + 0.14 * Math.abs(Math.cos(th * 2)));
    const bx2 = x + Math.cos(th) * rr, by2 = y + Math.sin(th) * rr * 0.92;
    i ? ctx.lineTo(bx2, by2) : ctx.moveTo(bx2, by2);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(212,208,200,${(a * 0.75).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.10, r * 0.52, r * 0.20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${(a * 0.65).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(x - r * 0.30, y - r * 0.26, r * 0.24, r * 0.19, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.30, y - r * 0.24, r * 0.22, r * 0.18, 0, 0, 7); ctx.fill();
}

/* A counter machine is a data row, not an edit inside the frame loop. */
const RIGS = {};
function drawDiscMill(b, t){
  const g = b.rig, kk = k(bz(g.lz ?? 150));
  const sx = px(b.x + (g.dx || 0), kk);
  const S1 = (g.w || 240) * kk * SS / 240;
  const foot = py(CFG.benchY - 2, kk);
  const bw = 240 * S1, bh = 196 * S1, x0 = sx - bw / 2, y0 = foot - bh;
  if (x0 > W + 40 || x0 + bw < -40) return;
  const ph = latchedPhase(b.x, 700);
  const N = discSlots().length, slot = 1 / N;

  ctx.save();
  ctx.translate(sx, foot); ctx.scale(1, 0.20); ctx.translate(-sx, -foot);
  const csh = ctx.createRadialGradient(sx, foot, 0, sx, foot, bw * 0.62);
  csh.addColorStop(0, 'rgba(0,0,0,0.42)'); csh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = csh;
  ctx.beginPath(); ctx.arc(sx, foot, bw * 0.62, 0, 7); ctx.fill();
  ctx.restore();

  const bg = ctx.createLinearGradient(0, y0, 0, foot);
  bg.addColorStop(0, '#eef1f3'); bg.addColorStop(0.55, '#ccd2d6'); bg.addColorStop(1, '#a4abb1');
  ctx.fillStyle = bg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0, y0, bw, bh, [10 * S1, 10 * S1, 3 * S1, 3 * S1]);
  else ctx.rect(x0, y0, bw, bh);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(x0 + 6 * S1, y0 + 3 * S1, bw - 12 * S1, 1.4 * S1);
  ctx.fillStyle = 'rgba(40,48,56,0.55)';
  ctx.fillRect(x0, foot - 9 * S1, bw, 9 * S1);

  const wx = x0 + 20 * S1, wy = y0 + 20 * S1, ww = bw - 40 * S1, wh = bh - 54 * S1;
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(wx, wy, ww, wh, 6 * S1); else ctx.rect(wx, wy, ww, wh);
  ctx.clip();
  const ig = ctx.createLinearGradient(0, wy, 0, wy + wh);
  ig.addColorStop(0, '#16202a'); ig.addColorStop(1, '#0c1319');
  ctx.fillStyle = ig; ctx.fillRect(wx, wy, ww, wh);

  const cx2 = wx + ww / 2, cy2 = wy + wh * 0.48, R = Math.min(ww, wh) * 0.44;
  const dg = ctx.createLinearGradient(cx2 - R, cy2 - R, cx2 + R, cy2 + R);
  dg.addColorStop(0, '#faf8f4'); dg.addColorStop(0.55, '#e6e2da'); dg.addColorStop(1, '#c9c4ba');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(cx2, cy2, R, 0, 7); ctx.fill();
  /* An uncut blank should still look like a thing: a zirconia disc has a
     chamfer round its rim, a shrinkage ring stepped into the face, a hub where
     the holder grips it and a lot number stamped on it. Without those it is a
     white circle, which reads as something failing to load. */
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2.4 * SS;
  ctx.beginPath(); ctx.arc(cx2, cy2, R * 0.965, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2 * SS;
  ctx.beginPath(); ctx.arc(cx2, cy2, R * 0.90, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,142,128,0.22)'; ctx.lineWidth = 1 * SS;
  ctx.beginPath(); ctx.arc(cx2, cy2, R * 0.84, 0, 7); ctx.stroke();
  const hub = ctx.createRadialGradient(cx2 - R*0.05, cy2 - R*0.05, R*0.02, cx2, cy2, R*0.16);
  hub.addColorStop(0, 'rgba(214,208,196,0.9)'); hub.addColorStop(1, 'rgba(168,160,146,0.7)');
  ctx.fillStyle = hub;
  ctx.beginPath(); ctx.arc(cx2, cy2, R * 0.15, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(120,112,100,0.55)';
  ctx.font = eraFont(Math.max(5, R * 0.10), '600', SEGMENTS[3].font);
  ctx.textAlign = 'center';
  ctx.fillText('BZ-98', cx2, cy2 + R * 0.72);
  ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.1 * SS;
  ctx.beginPath(); ctx.arc(cx2, cy2, R, 0, 7); ctx.stroke();

  const rp = R * 0.215, rc = R * 0.148;
  let cutting = null, done = 0;
  discSlots().forEach((p, i) => {
    const c = Math.max(0, Math.min(1, (ph - i * slot) / (0.55 * slot)));
    if (c <= 0) return;
    const gx2 = cx2 + p.u * R, gy2 = cy2 + p.v * R;
    if (c >= 1) done++; else cutting = {x: gx2, y: gy2};
    const pr = rp * (0.35 + 0.65 * c);
    ctx.fillStyle = '#0e1720';
    ctx.beginPath(); ctx.arc(gx2, gy2, pr, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${(0.30 * c).toFixed(3)})`;
    ctx.lineWidth = 1.2 * SS;
    ctx.beginPath(); ctx.arc(gx2, gy2, pr, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    const ca = Math.max(0, Math.min(1, (c - 0.25) / 0.5));
    if (ca > 0){
      // still held on its sprues — nothing falls out of a blank
      ctx.fillStyle = `rgba(230,226,218,${(0.9 * ca).toFixed(3)})`;
      ctx.fillRect(gx2 - rp, gy2 - 1.1 * S1, rp * 2, 2.2 * S1);
      drawCrownBlob(gx2, gy2, rc, ca);
    }
  });

  if (cutting){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('255,238,190', cutting.x, cutting.y, R * 0.30, 0.5);
    ctx.restore();
    // the spindle enters from the LEFT, on the horizontal, the way the machine
    // is actually built — the blank faces you and the bur works across it
    ctx.fillStyle = 'rgba(146,154,162,0.95)';
    ctx.beginPath();
    ctx.moveTo(wx, cutting.y - 3.4 * S1);
    ctx.lineTo(wx, cutting.y + 3.4 * S1);
    ctx.lineTo(cutting.x - rp * 0.55, cutting.y + 1.5 * S1);
    ctx.lineTo(cutting.x - rp * 0.55, cutting.y - 1.5 * S1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(196,202,208,0.95)';
    ctx.fillRect(wx, cutting.y - 6 * S1, 11 * S1, 12 * S1);
  }

  const gg = ctx.createLinearGradient(wx, wy, wx + ww * 0.7, wy + wh);
  gg.addColorStop(0, 'rgba(255,255,255,0.16)');
  gg.addColorStop(0.34, 'rgba(255,255,255,0.03)');
  gg.addColorStop(1, 'rgba(255,255,255,0.07)');
  ctx.fillStyle = gg; ctx.fillRect(wx, wy, ww, wh);
  ctx.restore();
  ctx.strokeStyle = 'rgba(60,70,80,0.8)'; ctx.lineWidth = 1.3 * SS;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(wx, wy, ww, wh, 6 * S1); else ctx.rect(wx, wy, ww, wh);
  ctx.stroke();

  ctx.fillStyle = cutting ? 'rgba(120,220,150,0.9)' : 'rgba(150,170,185,0.75)';
  ctx.beginPath(); ctx.arc(x0 + 15 * S1, foot - 22 * S1, 3 * S1, 0, 7); ctx.fill();
  ctx.font = eraFont(12 * S1, '700', SEGMENTS[3].font);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(70,80,92,0.85)';
  ctx.fillText(`${done} / ${N}`, x0 + bw - 14 * S1, foot - 18 * S1);
  ctx.textAlign = 'left';

  pushHit(x0, y0, bw, bh, {type: 'focus', beat: nearestBeat(b.x).i, anchor: b.x});
}

/* Every important camera moment is a guarded zone. Anything from the near or
   mid plane that would sit across it gets moved or removed — checked in code,
   not by eye, so new content can never reintroduce the collision. */
function auditPlacements(){
  const guards = [];
  for (const b of BEATS){
    if (b.ped){
      const pedX = b.x + (b.ped.dx ?? -430);
      guards.push({c: pedX, r: 750, pedX, pedZ: -90});
    }
    if (b.rig) guards.push({c: b.x + (b.rig.dx || 0), r: 560});
    if (!b.minor) guards.push({c: b.x, r: 420});
  }
  // near plane: a passer-by parks at screen center when cam ≈ its x
  for (let i = FG_ITEMS.length - 1; i >= 0; i--){
    if (guards.some(g => Math.abs(FG_ITEMS[i].x - g.c) < g.r * 1.3)){
      console.warn('audit: foreground item removed at', FG_ITEMS[i].x);
      FG_ITEMS.splice(i, 1);
    }
  }
  // mid plane: a figure crosses a pedestal or a wall photo on screen at one
  // camera position — that position must stay outside the guarded window
  const kOf = z => 900 / (900 + z);
  const crossTargets = guards.filter(g => g.pedX)
    .map(g => ({x: g.pedX, z: g.pedZ, c: g.c, r: g.r}));
  for (const b of BEATS)
    for (const it of b.wall)
      crossTargets.push({x: b.x + it.dx, z: it.pz != null ? it.pz : wallZAt(b.x) - 8, c: b.x, r: 520});
  for (const f of FIGURES){
    for (const g of crossTargets){
      const kP = kOf(g.z), kF = kOf(f.z);
      if (Math.abs(kP - kF) < 0.05){
        // near-same depth: they simply must not overlap in world space —
        // and they step aside on their own side, never marching across the hall
        const dirN = f.x >= g.x ? 1 : -1;
        for (let tries = 0; tries < 10 && Math.abs(f.x - g.x) < 430; tries++) f.x += 240 * dirN;
        continue;
      }
      const dirC = f.x >= g.c ? 1 : -1;
      for (let tries = 0; tries < 10; tries++){
        const cross = (g.x * kP - f.x * kF) / (kP - kF);
        if (Math.abs(cross - g.c) > g.r * 1.05) break;
        f.x += 240 * dirC;
        if (tries === 9) console.warn('audit: figure could not fully clear target near', g.x);
      }
    }
  }
}
function drawSheets(){
  for (const sh of SHEETS){
    if (Math.abs(sh.x - cam.x) > 4600) continue;
    const kk = k(wallZAt(sh.x) - 10);
    const sx = px(sh.x, kk);
    if (sx < -300 || sx > W + 300) continue;
    const scale = (sh.w / sh.sprite.w) * kk * SS;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(sx, py(sh.cy, kk));
    ctx.rotate(sh.rot * Math.PI/180);
    ctx.drawImage(sh.sprite.c, -sh.sprite.w*scale/2, -sh.sprite.h*scale/2,
                  sh.sprite.w*scale, sh.sprite.h*scale);
    ctx.restore();
  }
}
function drawFigures(){
  for (const f of FIGURES){
    if (Math.abs(f.x - cam.x) > 3200) continue;
    const kk = k(f.z);
    const sx = px(f.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (f.h / f.sprite.h) * kk * SS;
    const syFoot = py(f.seated ? 900 : 1080, kk);
    // the sprites are near-black. Against the wood and plaster of the analog
    // century that reads as a person standing in shadow; against the white
    // rooms it read as a hole cut in the wall, so it thins out with the era.
    contactShadow(sx, syFoot, f.sprite.w * scale * 0.55, segIdx(f.x) <= 1 ? 0.36 : 0.16);
    ctx.globalAlpha = segIdx(f.x) <= 1 ? 0.92 : 0.32;
    ctx.drawImage(f.sprite.c, sx - f.sprite.w*scale/2, syFoot - f.sprite.h*scale,
                  f.sprite.w*scale, f.sprite.h*scale);
    ctx.globalAlpha = 1;
  }
}
function drawProps(midPass){
  for (const p of PROPS){
    /* era 1's counter is a photograph up to the cabinet: things standing on a
       painted surface take a lifted foot, or they read sunk below its lip */
    if (p._lifted == null){ p._lifted = (p.x < PLATE_FROM) ? 26 : 0; }
    if (midPass === 'late'){ if (!p.late) continue; }
    else if ((!!p.mid) !== !!midPass || p.late) continue;
    if (Math.abs(p.x - cam.x) > 3200) continue;
    const sp = PROP_SPRITES[p.kind];
    const kk = k(p.mid ? p.z : bz(p.z));
    const sx = px(p.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (p.w / sp.w) * kk * SS;
    const syFoot = (p.mid && midPass !== 'late') ? py(1080, kk) : py(CFG.benchY - 2 - p._lifted, kk);
    /* The join. Every one of these was a single drawImage with nothing under
       it, so fifty objects hovered a hair above the counter in every frame —
       while a mere pinned photograph got a proper contact shadow. An object
       without a shadow is not on a surface, it is in front of one, and no
       amount of detail in the sprite itself will fix that. */
    const pw2 = sp.w * scale, ph2 = sp.h * scale;
    /* A THING THAT LIES DOWN HAS NO HEIGHT. A standing prop is hung by its
       bottom edge from the counter's line; one photographed from above is the
       surface itself, so it is centred on that line instead — half of it in
       front of the line and half behind, which is what a plan view on a
       worktop looks like. It takes no shadow either: the render carries its
       own, and the hall's would print a second one under a flat picture. */
    if (p.lay){
      ctx.drawImage(sp.c, sx - pw2/2, syFoot - ph2 * 0.62, pw2, ph2);
      if (p.study){
        const bi0 = BEATS.findIndex(bb => bb.t === p.study);
        if (bi0 >= 0) pushHit(sx - pw2/2, syFoot - ph2 * 0.62, pw2, ph2, {type:'study', beat: bi0});
      }
      continue;
    }
    contactShadow(sx, syFoot, pw2, 0.42);
    // and the dark line where it actually meets the surface
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(sx - pw2 * 0.30, syFoot - 1.4 * SS, pw2 * 0.60, 2.4 * SS);
    ctx.save();
    if (p.flip){ ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    /* A THING IS NOT TRANSLUCENT. Every prop was laid at 95%, which nobody
       notices against plaster and everybody notices against a lit screen: the
       implant at 2009 had the plasma showing through it (Eldar, 2026-09-23).
       The sprites carry their own alpha; the hall does not add any. */
    ctx.drawImage(sp.c, sx - pw2/2, syFoot - ph2, pw2, ph2);
    ctx.restore();
    /* A PROP MAY HAVE SOMETHING TO SAY. Most of these are furniture, but one or
       two are the exhibit for their year — they carry a caption, and a caption
       makes them worth picking up: the same flight to the screen a photograph
       on the wall gets. */
    if (p.cap){
      pushHit(sx - pw2/2, syFoot - ph2, pw2, ph2, {type: 'photo',
        sp: Object.assign({inner: {w: sp.w, h: sp.h}}, sp),
        wx: p.x, cy: CFG.benchY - (p.w * sp.h / sp.w) / 2, z: bz(p.z),
        w: p.w, cap: p.cap, beat: nearestBeat(p.x).i});
    }
    /* OR IT IS THE BEAT ITSELF. An object standing in the place of its year
       opens that year's reading page — the same door the writing on the wall
       opens, so a beat still has ONE page and merely two ways in. The beat is
       named by its title, never by a coordinate (Eldar, 2026-09-21). */
    else if (p.study){
      const bi = BEATS.findIndex(bb => bb.t === p.study);
      if (bi >= 0) pushHit(sx - pw2/2, syFoot - ph2, pw2, ph2, {type: 'study', beat: bi});
    }
  }
}

/* -------- THE PFM LINE · six stages standing on the 1970s counter --------
   Cut from one photograph, so they keep their own relative widths and their
   shared ground line: the plinths all sit on the counter, the tall impression
   at the left and the flat finished crown at the right, exactly as they were
   photographed. Small enough to read as things laid out rather than as a
   picture — a tap flies the whole line up to fill the screen. */
/* Each stand carries what HAPPENS at it, under its own brass label and no
   wider than its own plinth. Repeating the six names the labels already carry
   was saying the same thing twice; this is the thing the labels cannot say. */
const PFM_STAGES = [
  {kind:'ph_pfm1', cx:0.0720, w:0.1470, h:0.1674, cap:'Taken in the patient\u2019s mouth and posted to the lab.'},
  {kind:'ph_pfm2', cx:0.2461, w:0.1704, h:0.1350, cap:'Poured in stone \u2014 the mouth itself, on the bench.'},
  {kind:'ph_pfm3', cx:0.4170, w:0.1405, h:0.1350, cap:'The crown is carved in wax by hand, one case at a time.'},
  {kind:'ph_pfm4', cx:0.5757, w:0.1470, h:0.1475, cap:'The wax is burned out and the shell cast in metal.'},
  {kind:'ph_pfm5', cx:0.7449, w:0.1654, h:0.0962, cap:'Porcelain is layered onto the metal and fired, coat after coat.'},
  {kind:'ph_pfm6', cx:0.9205, w:0.1619, h:0.1061, cap:'Shaped, glazed and fitted. Days of work, for one tooth.'},
];
/* the plate over the line grows to the width of the first two stands, not to
   the width of all six — a title, not a banner */
const PFM_PLATE_SPAN = 0.333;
function drawPfmRow(b, i){
  const R = b.pfmRow;
  /* while the line is up on the screen, the small copy of it underneath is
     just clutter showing through the veil */
  if (state.pfmView && state.pfmView.amt > 0.15) return;
  const kk = k(bz(R.lz));
  const cxW = b.x + R.dx;
  const sxC = px(cxW, kk);
  const wRow = R.w * kk * SS;
  /* THE MIPS ARE BUILT BEFORE THE LINE ARRIVES. Six downscale chains in the
     one frame the row comes on screen is a hitch you can feel; they are built
     while the bay is still a screen away and cost nothing after that. */
  if (sxC < -wRow * 3 || sxC > W + wRow * 3) return;
  for (const st of PFM_STAGES){
    const sp = PROP_SPRITES[st.kind];
    if (sp) spriteMip(sp, st.w * wRow, st.h * wRow);
  }
  if (sxC < -wRow || sxC > W + wRow) return;
  const foot = py(CFG.benchY - 2 - (R.lift || 0), kk);
  const left = sxC - wRow / 2;
  let tallest = 0;
  for (const st of PFM_STAGES){
    const sp = PROP_SPRITES[st.kind]; if (!sp) continue;
    const pw = st.w * wRow, ph2 = st.h * wRow;
    if (ph2 > tallest) tallest = ph2;
    const cx = left + st.cx * wRow;
    contactShadow(cx, foot, pw * 0.92, 0.34);
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(cx - pw * 0.30, foot - 1.2 * SS, pw * 0.60, 2.0 * SS);
    ctx.drawImage(spriteMip(sp, pw, ph2), cx - pw / 2, foot - ph2, pw, ph2);
  }
  const rowSp = PROP_SPRITES.ph_pfmrow;
  if (rowSp){
    pushHit(left, foot - tallest, wRow, tallest, {type:'pfmview', beat: i});
  }
}
/* ---------------- ALBUMS · books that open when you stop ---------------- */
const ALBUM_SPRITES = {};   // beat index -> {cover, spreads:[canvas]}
const albumAnim = {};       // beat index -> 0..1 open amount
function makeAlbumCover(title, era){
  const c = document.createElement('canvas'); c.width = 420; c.height = 300;
  const g = c.getContext('2d');
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 16; g.shadowOffsetY = 8;
  const lg = g.createLinearGradient(0, 0, 420, 300);
  lg.addColorStop(0, '#4a2018'); lg.addColorStop(.5, '#31130d'); lg.addColorStop(1, '#200b07');
  g.fillStyle = lg;
  g.beginPath(); g.roundRect(14, 14, 392, 272, 10); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(225,190,130,0.5)'; g.lineWidth = 2.5;
  g.strokeRect(34, 34, 352, 232);
  g.strokeStyle = 'rgba(225,190,130,0.25)';
  g.strokeRect(42, 42, 336, 216);
