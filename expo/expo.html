  const kp = k(CELL_Z), S = kp * SS;
  const y0 = py(884, kp), y1 = py(1080, kp);
  const x0 = px(cellX(0) - CELL_HW, kp), x1 = px(cellX(1) + CELL_HW, kp);
  if (x1 < 0 || x0 > W) return;
  const pg = ctx.createLinearGradient(0, y0, 0, y1);
  pg.addColorStop(0, '#4c5259'); pg.addColorStop(0.5, '#3b4147'); pg.addColorStop(1, '#2b3036');
  ctx.fillStyle = pg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0, y0, x1 - x0, y1 - y0, [10 * S, 10 * S, 2 * S, 2 * S]);
  else ctx.rect(x0, y0, x1 - x0, y1 - y0);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(x0, y0, x1 - x0, 2 * S);
}
function drawCell(cx, cz, t, phase, pendant, noPlinth){
  const kk = k(cz), S = kk * SS;
  const X = wx => px(wx, kk), Y = wy => py(wy, kk);
  const sx = X(cx);
  const HW = 196;
  if (sx < -HW * 2 * S || sx > W + HW * 2 * S) return;
  ctx.save();
  ctx.lineJoin = 'round';
  const yTop = Y(408), yGl = Y(474), yBase = Y(884), yFloor = Y(1080);

  // the plinth — unless the pair share one (drawFactoryBase)
  if (!noPlinth){
    const pg = ctx.createLinearGradient(0, yBase, 0, yFloor);
    pg.addColorStop(0, '#4c5259'); pg.addColorStop(0.5, '#3b4147'); pg.addColorStop(1, '#2b3036');
    ctx.fillStyle = pg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(X(cx - HW), yBase, HW * 2 * S, yFloor - yBase, [10 * S, 10 * S, 2 * S, 2 * S]);
    else ctx.rect(X(cx - HW), yBase, HW * 2 * S, yFloor - yBase);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(X(cx - HW), yBase, HW * 2 * S, 2 * S);
  }

  // the body, with the roof cowl swept back
  const bg = ctx.createLinearGradient(X(cx - HW), 0, X(cx + HW), 0);
  bg.addColorStop(0, '#c9c6bb'); bg.addColorStop(0.22, '#efece3');
  bg.addColorStop(0.68, '#e2ded3'); bg.addColorStop(1, '#b3afa4');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(X(cx - HW), yBase);
  ctx.lineTo(X(cx - HW), yGl);
  ctx.quadraticCurveTo(X(cx - HW * 0.86), yTop, X(cx - HW * 0.34), yTop);
  ctx.lineTo(X(cx + HW * 0.62), Y(382));
  ctx.quadraticCurveTo(X(cx + HW), Y(400), X(cx + HW), yGl);
  ctx.lineTo(X(cx + HW), yBase);
  ctx.closePath(); ctx.fill();

  // the glass door: the arm lives behind it
  const gx0 = X(cx - HW * 0.70), gx1 = X(cx + HW * 0.46);
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(gx0, yGl, gx1 - gx0, yBase - yGl - 16 * S, 16 * S);
  else ctx.rect(gx0, yGl, gx1 - gx0, yBase - yGl - 16 * S);
  ctx.clip();
  const ig = ctx.createLinearGradient(0, yGl, 0, yBase);
  ig.addColorStop(0, '#7f8a92'); ig.addColorStop(0.5, '#59636b'); ig.addColorStop(1, '#39424a');
  ctx.fillStyle = ig; ctx.fillRect(gx0, yGl, gx1 - gx0, yBase - yGl);
  drawArmInside(cx - HW * 0.10, cz, t, phase, gx0, gx1, yGl, yBase);
  // the glass itself: two sweeps of reflection and the grime at its foot
  const rg2 = ctx.createLinearGradient(gx0, yGl, gx1, yBase);
  rg2.addColorStop(0, 'rgba(240,246,250,0.30)');
  rg2.addColorStop(0.30, 'rgba(240,246,250,0.05)');
  rg2.addColorStop(0.55, 'rgba(240,246,250,0.20)');
  rg2.addColorStop(1, 'rgba(240,246,250,0.02)');
  ctx.fillStyle = rg2; ctx.fillRect(gx0, yGl, gx1 - gx0, yBase - yGl);
  ctx.restore();
  ctx.strokeStyle = 'rgba(120,126,132,0.75)'; ctx.lineWidth = Math.max(1, 2.4 * S);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(gx0, yGl, gx1 - gx0, yBase - yGl - 16 * S, 16 * S);
  else ctx.rect(gx0, yGl, gx1 - gx0, yBase - yGl - 16 * S);
  ctx.stroke();
  // the handrail down the door
  ctx.strokeStyle = 'rgba(206,212,218,0.95)'; ctx.lineWidth = Math.max(1.4, 5 * S);
  ctx.beginPath();
  ctx.moveTo(gx1 - 26 * S, yGl + 40 * S); ctx.lineTo(gx1 - 26 * S, yBase - 70 * S);
  ctx.stroke();

  // the accent band and the model name on it
  ctx.fillStyle = 'rgba(28,44,96,0.92)';
  ctx.fillRect(X(cx - HW * 0.66), Y(436), HW * 1.30 * S, 20 * S);
  ctx.fillStyle = 'rgba(196,46,34,0.95)';
  ctx.fillRect(X(cx - HW * 0.66), Y(436), 22 * S, 20 * S);
  ctx.fillStyle = 'rgba(238,242,246,0.92)';
  ctx.font = eraFont(13 * S, '700', SEGMENTS[3].font);
  ctx.textAlign = 'left';
  ctx.fillText('BruxZir cell \u00b7 automation', X(cx - HW * 0.52), Y(452));

  // the signal tower, and the pendant on its stalk
  const tx = X(cx + HW * 0.80);
  ctx.strokeStyle = 'rgba(150,156,162,0.9)'; ctx.lineWidth = Math.max(1, 4 * S);
  ctx.beginPath(); ctx.moveTo(tx, Y(408)); ctx.lineTo(tx, Y(292)); ctx.stroke();
  const lit = Math.sin(t * 0.8 + phase) > -0.3;
  for (const [i2, col] of [[0, lit ? '90,220,120' : '40,70,48'], [1, lit ? '60,40,32' : '224,72,48']]){
    ctx.fillStyle = `rgba(${col},0.95)`;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tx - 9 * S, Y(292 + i2 * 26), 18 * S, 22 * S, 4 * S);
    else ctx.rect(tx - 9 * S, Y(292 + i2 * 26), 18 * S, 22 * S);
    ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(col, tx, Y(302 + i2 * 26), 30 * S, 0.22);
    ctx.restore();
  }
  if (!pendant){ ctx.restore(); return; }
  // the pendant itself stands behind the left counter — drawPendant owns its place
  // the coiled air hose, the one bright thing on any shop floor
  ctx.strokeStyle = 'rgba(226,196,44,0.9)'; ctx.lineWidth = Math.max(1, 3.4 * S);
  ctx.beginPath();
  for (let i2 = 0; i2 <= 40; i2++){
    const u = i2 / 40, yy = Y(880 + u * 190);
    const xx = X(cx - HW * 1.02) + Math.sin(u * Math.PI * 7) * 15 * S;
    i2 ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
  }
  ctx.stroke();
  ctx.restore();
}

/* A six-axis arm, not two sticks and three dots. What made the old one read as
   a toy was that every part was the same width and every joint was a flat
   circle: real links are CASTINGS — wide at the joint they carry, narrow at the
   one they reach with, ribbed down the middle, with the cable conduit slung
   outside the elbow in a loop that moves with the arm. The joints are housings
   with a flange and a boss, seen as a cylinder end rather than a disc. One
   light, from the left, so each link has a lit face and a shaded one. */
function drawArmInside(bx, bz, t, phase, gx0, gx1, yGl, yBase){
  /* An arm inside a cabin has to FIT the cabin, through its whole swing. Ours
     had a 550-unit reach inside a 290-unit aperture, so it swung straight out
     through the glass. The linkage is unchanged and simply scaled to the
     opening — reach set to a little over half the door's height, which is the
     proportion a real cell is built to — and it is pivoted on the cabin's own
     floor, so it stands inside rather than on a plinth of its own. */
  /* The fault was never the scale. The shoulder sat at world 1042 while the
     glass stops at 872 — the arm was bolted 170 units BELOW the bottom of its
     own window, so the clip threw away everything but the tip, which is why it
     read as an insect in a big pane. It is mounted on the cabin floor now, just
     inside the glass, and scaled so its whole reach fills the opening rather
     than so its stump does. */
  const kb = k(bz);
  const sc = Math.max(0.24, Math.min(1.15, (yBase - yGl) * 0.94 / (550 * kb * SS)));
  const bxs = px(bx, kb), bys = yBase - 10 * kb * SS;
  /* THE ENVELOPE. Clipping to the glass was a lie: the arm leaned into the wall
     and simply vanished at the pane's edge instead of hitting anything. A real
     cell solves this the other way round — the arm's travel is limited so it
     cannot reach its own enclosure. Its scaled reach here is about three times
     the pane's half width, so the honest swing is small: work out the angle at
     which the tip would touch the side wall and keep inside it. What you get is
     the tight, deliberate motion of a machine in a box rather than something
     swaying in a breeze. */
  const reach = 550 * sc * kb * SS;
  const room = (gx1 - gx0) * 0.5 - 16 * kb * SS;
  const amp = Math.max(0.10, Math.min(0.55, Math.asin(Math.max(0.05, Math.min(1, room / Math.max(1, reach))))));
  ctx.save();
  ctx.beginPath(); ctx.rect(gx0, yGl, gx1 - gx0, yBase - yGl); ctx.clip();
  ctx.translate(bxs, bys); ctx.scale(sc, sc); ctx.translate(-bxs, -bys);
  ctx.globalAlpha = 0.94;
  drawRobotArm(bx, bz, t, phase, true, amp);
  ctx.restore();
}
function drawRobotArm(bx, bz, t, phase, inside, amp){
  const kk = k(bz);
  const X = wx => px(wx, kk), Y = wy => py(wy, kk);
  const sx = X(bx);
  if (sx < -400 || sx > W + 400) return;
  const S = kk * SS;
  ctx.save();
  ctx.lineJoin = 'round';

  const w = t * 0.9 + phase;
  // inside a cabin the swing is bounded by the cabin, not by the crop
  const A1 = amp != null ? amp : 0.62, A2 = amp != null ? amp * 0.85 : 0.55;
  const a1 = (amp != null ? -0.06 : -0.35) + A1 * Math.sin(w);
  const a2 = (amp != null ? 0.62 : 0.95) + A2 * Math.sin(w + 1.1);
  const L1 = 300, L2 = 250;
  // inside a cabin the arm is bolted to the cabin floor, not to a plinth
  const j0 = {x: bx, y: inside ? 862 : 906};   // inside: on the cabin floor
  const j1 = {x: j0.x + Math.sin(a1) * L1, y: j0.y - Math.cos(a1) * L1};
  const a12 = a1 + a2 - 1.3;
  const j2 = {x: j1.x + Math.sin(a12) * L2, y: j1.y - Math.cos(a12) * L2};

  const bw = 96;
  if (!inside){ // a cell's arm has no plinth of its own: the cabin is its base
  ctx.fillStyle = '#8f959b';
  ctx.beginPath();
  ctx.moveTo(X(bx - bw), Y(1080)); ctx.lineTo(X(bx - bw * 0.72), Y(986));
  ctx.lineTo(X(bx + bw * 0.72), Y(986)); ctx.lineTo(X(bx + bw), Y(1080));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.fillRect(X(bx - bw * 0.70), Y(986), bw * 1.4 * S, 3 * S);
  ctx.fillStyle = 'rgba(20,24,28,0.35)';
  ctx.fillRect(X(bx - bw), Y(1064), bw * 2 * S, Y(1080) - Y(1064));
  for (const s of [-1, 1]){
    ctx.fillStyle = 'rgba(46,52,58,0.75)';
    ctx.beginPath(); ctx.arc(X(bx + s * bw * 0.52), Y(1020), 5 * S, 0, 7); ctx.fill();
  }
  // the turret it slews on
  const tg = ctx.createLinearGradient(X(bx - 56), 0, X(bx + 56), 0);
  tg.addColorStop(0, '#7f858b'); tg.addColorStop(0.34, '#e6e9ec');
  tg.addColorStop(0.68, '#b9bec3'); tg.addColorStop(1, '#6d737a');
  ctx.fillStyle = tg;
  ctx.fillRect(X(bx - 56), Y(986), 112 * S, Y(986) - Y(918));
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(X(bx), Y(918), 56 * S, 12 * S, 0, 0, 7); ctx.fill();
  }
  if (inside){   // just the mounting boss it turns on
    ctx.fillStyle = 'rgba(70,58,20,0.9)';
    ctx.beginPath(); ctx.ellipse(X(bx), Y(876), 66 * S, 15 * S, 0, 0, 7); ctx.fill();
  }

  /* A link: a tapered casting from a to b, `wa` wide at its root and `wb` at
     its tip, with a rib down its spine. */
  const link = (a, b, wa, wb, rib) => {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const P = (p, o, wd) => [X(p.x + nx * o * wd), Y(p.y + ny * o * wd)];
    const q = [P(a, -0.5, wa), P(b, -0.5, wb), P(b, 0.5, wb), P(a, 0.5, wa)];
    const g = ctx.createLinearGradient(q[0][0], q[0][1], q[3][0], q[3][1]);
    if (inside){                      // a Fanuc in a cabin is yellow, and lit from behind
      g.addColorStop(0, '#e8c64a'); g.addColorStop(0.42, '#c8a230');
      g.addColorStop(0.76, '#8e7220'); g.addColorStop(1, '#5f4c16');
    } else {
      g.addColorStop(0, '#f2f4f6'); g.addColorStop(0.42, '#d8dce0');
      g.addColorStop(0.76, '#a9aeb4'); g.addColorStop(1, '#7d838a');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(60,66,72,0.45)'; ctx.lineWidth = Math.max(0.8, 1.2 * S);
    ctx.stroke();
    if (rib){                                   // the rib along its spine
      const r0 = P(a, -0.13, wa), r1 = P(b, -0.13, wb);
      const r2 = P(b, 0.13, wb), r3 = P(a, 0.13, wa);
      ctx.fillStyle = 'rgba(255,255,255,0.34)';
      ctx.beginPath();
      ctx.moveTo(r0[0], r0[1]); ctx.lineTo(r1[0], r1[1]);
      ctx.lineTo(r2[0], r2[1]); ctx.lineTo(r3[0], r3[1]);
      ctx.closePath(); ctx.fill();
    }
  };
  // a joint housing: a cylinder seen end-on, with its flange and boss
  const joint = (p, r) => {
    const jg = ctx.createLinearGradient(X(p.x - r), 0, X(p.x + r), 0);
    jg.addColorStop(0, '#4d5359'); jg.addColorStop(0.36, '#9aa0a6');
    jg.addColorStop(0.7, '#6c7278'); jg.addColorStop(1, '#3d4349');
    ctx.fillStyle = jg;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * S, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(232,236,240,0.45)'; ctx.lineWidth = Math.max(0.8, 1.6 * S);
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * 0.80 * S, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(38,44,50,0.85)';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * 0.30 * S, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(X(p.x) - r * 0.28 * S, Y(p.y) - r * 0.30 * S, r * 0.16 * S, 0, 7); ctx.fill();
  };

  link(j0, j1, 104, 66, true);        // an upper arm carries the whole reach
  link(j1, j2, 74, 40, true);
  // the maker's stripe at the root of each link — the one warm mark on a machine
  const stripe = (a, b2, wd) => {
    const dx = b2.x - a.x, dy = b2.y - a.y, L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    ctx.fillStyle = inside ? 'rgba(150,34,26,0.85)' : 'rgba(196,46,34,0.88)';
    ctx.beginPath();
    for (const [o, d2] of [[-0.5, 0.10], [0.5, 0.10], [0.5, 0.17], [-0.5, 0.17]])
      ctx.lineTo(X(a.x + ux * L * d2 + nx * o * wd), Y(a.y + uy * L * d2 + ny * o * wd));
    ctx.closePath(); ctx.fill();
  };
  stripe(j0, j1, 96); stripe(j1, j2, 68);
  // the conduit, slung outside the elbow and carried along the forearm
  ctx.strokeStyle = 'rgba(52,58,64,0.62)';
  ctx.lineWidth = Math.max(1.2, 7 * S);
  ctx.beginPath();
  ctx.moveTo(X(j0.x + 40), Y(j0.y + 24));
  ctx.quadraticCurveTo(X(j1.x + 76), Y(j1.y + 40), X(j1.x + 22), Y(j1.y - 6));
  ctx.quadraticCurveTo(X((j1.x + j2.x) / 2 + 26), Y((j1.y + j2.y) / 2), X(j2.x + 12), Y(j2.y + 8));
  ctx.stroke();
  joint(j0, 46); joint(j1, 38);
  // wrist, tool flange and jaws
  const wa = Math.atan2(j2.y - j1.y, j2.x - j1.x);
  joint(j2, 24);
  ctx.save();
  ctx.translate(X(j2.x), Y(j2.y)); ctx.rotate(wa);
  ctx.fillStyle = '#8d939a';
  ctx.fillRect(0, -14 * S, 26 * S, 28 * S);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, -14 * S, 26 * S, 3 * S);
  const grip = 0.5 + 0.5 * Math.sin(w + 0.5);
  ctx.fillStyle = '#5b6167';
  for (const s of [-1, 1])
    ctx.fillRect(26 * S, s * (5 + 7 * grip) * S - 4 * S, 20 * S, 8 * S);
  ctx.restore();
  // the blank it is carrying
  const carry = Math.max(0, Math.sin(w + 0.5));
  if (carry > 0.25){
    ctx.globalAlpha = Math.min(1, (carry - 0.25) * 3);
    const bg2 = ctx.createLinearGradient(X(j2.x) - 18 * S, 0, X(j2.x) + 18 * S, 0);
    bg2.addColorStop(0, '#fbfaf6'); bg2.addColorStop(0.6, '#e6e3da'); bg2.addColorStop(1, '#c6c2b6');
    ctx.fillStyle = bg2;
    ctx.fillRect(X(j2.x) - 17 * S, Y(j2.y) + 26 * S, 34 * S, 26 * S);
    ctx.strokeStyle = 'rgba(90,86,78,0.4)'; ctx.lineWidth = Math.max(0.7, 1 * S);
    ctx.strokeRect(X(j2.x) - 17 * S, Y(j2.y) + 26 * S, 34 * S, 26 * S);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawFactory(t, over){
  if (Math.abs(cam.x - FACT_X) > 3600) return;
  const b = BEATS.find(bb => bb.t === 'BRUXZIR FACTORY');
  // shade dispenser tower, left
  const kd = k(210);
  const dx0 = px(FACT_X - 470, kd);
  if (dx0 > -300 && dx0 < W + 300){
    ctx.fillStyle = '#d5d8db';
    ctx.fillRect(dx0 - 60*kd*SS, py(700, kd), 120*kd*SS, py(1080,kd)-py(700,kd));
    for (let i = 0; i < 6; i++){
      ctx.fillStyle = `hsl(${38 + i*3} ${28 + i*6}% ${86 - i*5}%)`;
      ctx.fillRect(dx0 - 40*kd*SS, py(730 + i*52, kd), 80*kd*SS, 34*kd*SS);
    }
  }
  /* THE LINE RUNS AT COUNTER HEIGHT. It lay on the floor, so the finished
     crowns crawled along the skirting; a line in a plant runs at the height a
     hand works at, and here that is the height of the counters either side of
     the cells. It stands on its own frame now — a rail, a skirt under it, and
     legs down to the floor at both ends. */
  /* AND IT ENDS BEHIND THE COUNTERS. Its ends used to stop in the open, so
     the crowns simply ceased to exist at a point in the air. Both ends now run
     on past the aisle and under the counters either side — painted later, they
     swallow the line, and the crowns go somewhere. */
  /* IT COMES OUT OF THE FIRST CELL AND GOES BEHIND THE COUNTER. Nothing of it
     shows to the left of the robots — it begins inside the first cabin, which
     is painted over it — and it runs behind the counters' back edge (z 400, at
     a height that reads as the counter's) so on the right the table swallows
     it instead of the line crossing in front. */
  const kc = k(400);
  const cy0 = py(760, kc);
  const c0 = px(FACT_X - 300, kc), c1 = px(FACT_X + 900, kc);
  const yFl = py(1080, kc), legW = 12 * kc * SS;
  /* THE LINE SHOWS ONLY IN THE GAP. The factory is painted a second time over
     the catharsis veil, after the counters — and that second coat laid the
     line's far end across the right counter it is meant to vanish behind. The
     counters' ends are flat, at their front edge's x; the line is clipped to
     the opening between them, so no pass can put it in front of a table. */
  /* AND IT RUNS UNDER THE COUNTER'S CORNER. Clipped exactly at the run's start
     the line stopped in the open: a counter's first 120 units are its mitred
     return, cut away, so the solid front begins later and a dozen pixels of
     bare line showed before it (Eldar, 2026-09-22: «она не доезжает... нужно,
     чтобы коронки уходили туда, не было видно края»). The pass painted BEFORE
     the counters runs on past that corner and they swallow it; the second pass,
     painted after them, keeps the tight clip so it cannot cross a table. */
  const clipL = px(FACT_X - 560, k(0));
  const clipR = px(FACT_X + 560 + (over ? 0 : 220), k(0));
  ctx.save();
  ctx.beginPath(); ctx.rect(clipL, 0, clipR - clipL, H); ctx.clip();
  ctx.fillStyle = '#2b2f34';
  for (const lx of [c0 + 24*kc*SS, (c0 + c1)/2 - legW/2])
    ctx.fillRect(lx, cy0 + 36*kc*SS, legW, yFl - cy0 - 36*kc*SS);
  ctx.fillStyle = '#3a3e43';
  ctx.fillRect(c0, cy0, c1 - c0, 26*kc*SS);
  ctx.fillStyle = '#23262a';
  ctx.fillRect(c0, cy0 + 26*kc*SS, c1 - c0, 10*kc*SS);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(c0, cy0, c1 - c0, 2*kc*SS);
  for (let i = 0; i < 7; i++){
    const wxc = FACT_X - 300 + ((i*160 + t*60) % 1200);
    const sxc = px(wxc, kc);
    if (sxc > c0 && sxc < c1){
      ctx.fillStyle = '#eef0ed';
      ctx.beginPath(); ctx.arc(sxc, cy0 - 8*kc*SS, 10*kc*SS, Math.PI, 0); ctx.fill();
    }
  }
  ctx.restore();
  // two arms working out of phase
  /* Two machines standing apart, each on its own plinth, with the aisle between
     them that a shop floor has. Butted together they read as one wide box with
     two windows — which is what they looked like. Only the nearer cell carries
     the control pendant; one aisle does not have two of them. */
  /* LIGHT ON THE CELLS. They were standing in the era's flat ambient with
     nothing thrown at them, so arriving at 2019 felt like walking into a
     shadow. Each cabin now gets a shaft from the ceiling landing on its roof —
     the same soft-shouldered shaft the plinths use, in the room's own cool
     white rather than the plinths' warm. */
  /* THE LIGHT BELONGS TO 2019. These shafts ran from the very top of the frame
     and stayed lit for 2,500 units either side, so from the 2022 bay the nearer
     one stood as a bright column on the wall beside the portal — a piece of
     ceiling glow with nothing to explain it. They come up as you arrive at the
     factory and are gone before the next bay, like the plinth spotlights, and
     each one starts at a fitting on the ceiling line rather than at the edge
     of the picture. */
  const lit = Math.max(0, Math.min(1, 1 - (Math.abs(cam.x - FACT_X) - 300) / 300));   // full at the cell, out before the next bay
  if (lit > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [cx2, cz2] of [[cellX(0), CELL_Z], [cellX(1), CELL_Z]]){
      const kc = k(cz2), sxc = px(cx2, kc), roof = py(408, kc);
      if (sxc < -400 || sxc > W + 400) continue;
      const halfC = 150 * kc * SS;
      /* BOTH FITTINGS ARE ON ONE CEILING. Each shaft used to start at its own
         cell's depth, and the two cells stand at 190 and 232 — so the same
         world height came out as two different screen heights and the lights
         began at visibly different levels. The ceiling is one plane: both
         fixtures are measured on it. */
      const kCeil = k(210);
      const top = py(-40, kCeil), low = py(640, kc);
      softBeam(sxc, sxc, top, low, halfC * 0.42, halfC * 1.15, '226,240,255', 0.30 * lit,
               [[0, 0.10], [0.42, 0.55], [0.62, 0.30], [1, 0]]);
      drawGlow('226,240,255', sxc, roof, halfC * 1.5, 0.16 * lit);
      // the fitting it comes out of
      ctx.fillStyle = `rgba(236,246,255,${(0.9 * lit).toFixed(2)})`;
      ctx.beginPath(); ctx.ellipse(sxc, top, 12 * kc * SS, 3.5 * kc * SS, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  if (!over) drawPendant(t);       // behind the left counter — the veil pass must not paint it back in front
  drawFactoryBase();
  drawCell(cellX(0), CELL_Z, t, 0, true, true);
  drawCell(cellX(1), CELL_Z, t, 2.4, false, true);
  const kk = k(CELL_Z);
  // the factory is painted twice, under and over the counter; its target is claimed once
  if (!over) pushHit(px(FACT_X - 480, kk), py(560, kk), (960)*kk*SS, py(1080,kk)-py(560,kk),
                     {type:'focus', beat: BEATS.indexOf(b), anchor: FACT_X});
}
const STAGE_X = SHIFT(28830);
let JIM_FIG = null;
/* СЦЕНА РАЗОБРАНА. Помост, человек на нём, жёлтый прожектор и три зрителя —
   всё это ушло по просьбе Эльдара (2026-09-23): «убираем, остаётся ковёр. Там
   придумаем, что там будет». STAGE_X остаётся константой: от него отмеряется
   правый конец ковра (CARPET_X1) и якорь света, и убирать его — значит рушить
   то, что к сцене отношения не имеет. Код ниже не удалён, а отключён одним
   флагом: место ждёт замены, и когда она придёт, будет с чем сравнить. */
const STAGE_ON = false;
function drawStage(t){
  if (!STAGE_ON) return;
  if (Math.abs(cam.x - STAGE_X) > 3900) return;
  // platform
  const kT = k(530), kF = k(430);
  const halfW = 460;
  const xT0 = px(STAGE_X - halfW, kT), xT1 = px(STAGE_X + halfW, kT);
  const xF0 = px(STAGE_X - halfW, kF), xF1 = px(STAGE_X + halfW, kF);
  const yT = py(950, kT), yF = py(950, kF), yB = py(1080, kF);
  ctx.fillStyle = '#c9cdd1';
  ctx.beginPath();
  ctx.moveTo(xT0, yT); ctx.lineTo(xT1, yT); ctx.lineTo(xF1, yF); ctx.lineTo(xF0, yF);
  ctx.closePath(); ctx.fill();
  const fg = ctx.createLinearGradient(0, yF, 0, yB);
  fg.addColorStop(0, '#9aa0a6'); fg.addColorStop(1, '#5e646a');
  ctx.fillStyle = fg;
  ctx.fillRect(xF0, yF, xF1 - xF0, yB - yF);
  /* THE GREEN-BOARD SKETCH'S SIDE TABLE IS GONE. An angled table at 39310 and
     a round stand at 39240, both from the first sketch of this zone, stood
     behind TODAY's counter in another layer — half hidden, and what showed of
     them read as offcuts of some earlier construction (Eldar, 2026-09-22:
     «там торчат кусочки предыдущих столов — давай просто удалим»). The stage
     itself, the man on it and the audience stay: that is the finale. */

  // Jim on stage — a presence, later a generated-video moment
  const kJ = k(480);
  const jx = px(STAGE_X, kJ);
  const jh = 690 * (kJ * SS) / JIM_FIG.h * JIM_FIG.h;
  const jscale = 690 / JIM_FIG.h * kJ * SS;
  const jw = JIM_FIG.w * jscale, jhh = JIM_FIG.h * jscale;
  const jFoot = py(950, kJ);
  pushHit(jx - jw/2, jFoot - jhh, jw, jhh, {type:'focus', beat: BEATS.length - 1, anchor: STAGE_X});
  // spotlight cone — soft shoulders, brightening toward the man it lights
  softBeam(jx, jx, 0, jFoot + 34*kJ*SS, 60*kJ*SS, 275*kJ*SS, '255,246,216', 0.135,
           [[0, 0.16], [0.72, 1], [1, 0]]);
  ctx.drawImage(JIM_FIG.c, jx - jw/2, jFoot - jhh, jw, jhh);
  // pool of light at his feet
  const pg = ctx.createRadialGradient(jx, jFoot, 6, jx, jFoot, 260*kJ*SS);
  pg.addColorStop(0, 'rgba(255,244,210,0.35)');
  pg.addColorStop(1, 'rgba(255,244,210,0)');
  ctx.save();
  ctx.translate(jx, jFoot); ctx.scale(1, 0.25); ctx.translate(-jx, -jFoot);
  ctx.fillStyle = pg;
  ctx.fillRect(jx - 260*kJ*SS, jFoot - 260*kJ*SS, 520*kJ*SS, 520*kJ*SS);
  ctx.restore();
}

/* foreground occluders — soft dark shapes passing close to camera:
   mostly potted plants and people, the odd structural post */
/* The two silhouettes that used to be listed here (at 4900 and 8250) stood
   inside a guarded bay and were removed by the audit on every single load —
   the hall has never shown a foreground item. The list is empty rather than
   wrong; the machinery stays for the day one is placed where it can stand. */
const FG_ITEMS = [];
const FG_SPRITES = {};
function makeFgSprite(kind, seed){
  const R = rng(seed*31337 + 5);
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.filter = 'blur(5px)';
  g.fillStyle = '#050403';
  if (kind === 'plant'){
    c.width = 760; c.height = 720; g.filter = 'blur(5px)'; g.fillStyle = '#050403';
    // pot
    g.beginPath();
    g.moveTo(315, 560); g.lineTo(445, 560); g.lineTo(425, 700); g.lineTo(335, 700);
    g.closePath(); g.fill();
    // fan of leaves — well inside the canvas, no clipping
    for (let i = 0; i < 9; i++){
      const a = -Math.PI/2 + (i - 4) * 0.24 + (R()-0.5)*0.1;
      const len = 190 + R()*110;
      const tx = 380 + Math.cos(a)*len, ty = 555 + Math.sin(a)*len;
      g.save();
      g.translate(tx, ty);
      g.rotate(a + Math.PI/2);
      g.beginPath(); g.ellipse(0, 0, 26 + R()*12, 90 + R()*36, 0, 0, 7); g.fill();
      g.restore();
      g.beginPath();
      g.moveTo(380, 565);
      g.lineTo(tx, ty);
      g.lineWidth = 10; g.strokeStyle = '#050403'; g.stroke();
    }
  } else {
    c.width = 260; c.height = 640; g.filter = 'blur(6px)'; g.fillStyle = '#050403';
    const hx = 130 + (R()-0.5)*20, lean = (R()-0.5)*24;
    g.beginPath(); g.arc(hx, 74, 44 + R()*6, 0, 7); g.fill();
    g.beginPath();
    g.moveTo(hx - 88, 640); g.lineTo(hx - 74 + lean, 210);
    g.quadraticCurveTo(hx - 70 + lean, 128, hx, 122);
    g.quadraticCurveTo(hx + 70 + lean, 128, hx + 74 + lean, 210);
    g.lineTo(hx + 88, 640); g.closePath(); g.fill();
  }
  return {c, w: c.width, h: c.height};
}
function drawForeground(){
  // the near plane clears the view whenever an exhibit takes the stage
  const fgA = Math.max(0, 1 - (state.hero || 0) * 1.5);
  if (fgA <= 0.02) return;
  const kk = k(-560);
  for (const it of FG_ITEMS){
    const sx = px(it.x, kk);
    if (it.kind === 'post'){
      const w = 120 * kk * SS;
      if (sx < -w*2 || sx > W + w*2) continue;
      const g = ctx.createLinearGradient(sx - w, 0, sx + w, 0);
      g.addColorStop(0, 'rgba(8,4,1,0)');
      g.addColorStop(0.35, `rgba(8,4,1,${0.92*fgA})`);
      g.addColorStop(0.65, `rgba(8,4,1,${0.92*fgA})`);
      g.addColorStop(1, 'rgba(8,4,1,0)');
      ctx.fillStyle = g;
      ctx.fillRect(sx - w, 0, w*2, H);
    } else {
      const sp = FG_SPRITES[it.kind + (it.seed % 3)];
      const h = it.kind === 'plant' ? H*0.72 : H*1.06;
      const w = h * sp.w / sp.h;
      if (sx < -w || sx > W + w) continue;
      ctx.globalAlpha = 0.93 * fgA;
      ctx.drawImage(sp.c, sx - w/2, H - h + (it.kind === 'plant' ? 6*SS : 30*SS), w, h);
      ctx.globalAlpha = 1;
    }
  }
}

/* THE GRAIN IS LAID AT ONE TEXEL PER PIXEL. It was a repeating pattern painted
   over the whole frame, and that one call measured ten to twenty-five
   milliseconds in the hall: a tiled fill at eight and a half megapixels does
   not batch with anything, it stands at the end of the frame and does its own
   work a texel lookup at a time. The first cure was a half-size sheet stretched
   over the frame — fast, but Eldar saw it at once: the grain came out twice as
   coarse and soft, most of all in the craft era where there is most of it.
   So the tile is now laid down by hand, 256 device pixels at a time, unscaled:
   a hundred-odd draws of one small texture batch into a single pass, the noise
   is exactly the noise it was, and the buffer can change size under it without
   anything being rebuilt. */
function layGrain(tile){
  const s = tile.width;
  for (let y = 0; y < H; y += s)
    for (let x = 0; x < W; x += s) ctx.drawImage(tile, x, y);
}
let VIG = null;
function makeVignette(){
  VIG = document.createElement('canvas'); VIG.width = Math.max(2, W>>1); VIG.height = Math.max(2, H>>1);
  const g = VIG.getContext('2d');
  /* It was closing too far in and going too dark: 0.62 at the corner, starting
     to fall at a third of the way out, so the darkness reached well into the
     picture rather than sitting in the corners of it. The clear middle is wider
     now and the corner is a quarter lighter. The eras keep their relationship —
     the analog century is still the dark one and the white room still carries
     less of it — the whole thing simply weighs less. */
  const vg = g.createRadialGradient(VIG.width/2, VIG.height*0.46, VIG.height*0.44, VIG.width/2, VIG.height*0.52, VIG.height*0.98);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.55, 'rgba(4,1,0,0.13)');
  vg.addColorStop(1, 'rgba(4,1,0,0.46)');
  g.fillStyle = vg; g.fillRect(0, 0, VIG.width, VIG.height);
}
function drawGrade(t){
  if (!VIG) makeVignette();
  // the vignette never pops at the era seam: it holds through the BruxZir
  // hero and eases away only as you leave the crown behind
  /* The white era carries less vignette than the analog century — that is the
     point of it. But the ease into it was pinned to the raw world coordinate
     21150, and every cut added to the timeline moved the portal right while
     that number stayed put: it had fallen 4520 units behind, so what was meant
     to be a 900-unit fade had become a step change of 45 per cent in the
     darkness of the whole frame, landing on one world coordinate at the edge of
     the recreation. That is the lightening you can see from across the room. It
     is anchored to the portal itself now, and eased across 2280 units. */
  let sh = segAt(cam.x).shade != null ? segAt(cam.x).shade : 1;
  if (SEGMENTS[3].shade != null){
    const a0 = REC2_L - 300, a1 = REC2_R + 900;
    const tt = Math.max(0, Math.min(1, (cam.x - a0) / (a1 - a0)));
    sh = 1 + (SEGMENTS[3].shade - 1) * (tt*tt*(3-2*tt));
  }
  ctx.globalAlpha = 0.35 + 0.65*sh;
  ctx.drawImage(VIG, 0, 0, W, H);
  ctx.globalAlpha = 1;
  // film grain — settles down as time moves forward, and already eases off
  // through the late seventies, before the era even turns
  const g = grains[(t*10|0) % grains.length];
  let gr = ambient(cam.x).grain;
  if (segIdx(cam.x) === 0 && cam.x > SHIFT(2200))
    gr *= 1 - 0.35 * Math.min(1, (cam.x - SHIFT(2200)) / Math.max(1, REC_L - SHIFT(2200)));
  if (gr > 0.004){
    ctx.globalAlpha = gr;
    layGrain(g.c);
    ctx.globalAlpha = 1;
  }
}

/* One case, taken off the pile and opened. What was inside every one of those
   forty-eight boxes: an impression of both jaws — and it arrives IN ITS TRAYS.
   The dentist seats the tray, the material sets in the mouth around it, and
   tray and impression travel to the lab together; the lab pours the model out
   of it. An impression without a tray would never have been in the post. */
function drawImpression(cx, cy, w, upper){
  /* Drawn from the photograph. Three materials, and they matter: the tray is a
     pale cream, the impression is a vivid orchid, and the handle is stamped
     metal with a hole through it. The teeth are the point — fourteen distinct
     forms pressed into the material, each one a hollow with a lit rim, wide at
     the back and narrow at the front, not a row of dots. */
  const h = w * 0.94;
  const A0 = Math.PI * 0.08, A1 = Math.PI * 0.92;
  const orx = w * 0.50, ory = h * 0.50;      // the tray
  const prx = w * 0.425, pry = h * 0.435;    // the material, outer
  const irx = w * 0.235, iry = h * 0.255;    // the material, inner
  const arch = (rx, ry, a0, a1) => ctx.ellipse(cx, cy, rx, ry, 0, a0, a1, true);
  ctx.save();

  // the handle, out at the front, behind everything else
  const hw = w * 0.125, hh = w * 0.34, hy = cy - ory * 0.94;
  const hg = ctx.createLinearGradient(cx - hw/2, 0, cx + hw/2, 0);
  hg.addColorStop(0, '#8f959b'); hg.addColorStop(0.34, '#e2e6e9');
  hg.addColorStop(0.62, '#aab1b7'); hg.addColorStop(1, '#767c82');
  ctx.fillStyle = hg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - hw/2, hy - hh, hw, hh + hh * 0.30, hw * 0.34);
  else ctx.rect(cx - hw/2, hy - hh, hw, hh);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,118,126,0.7)'; ctx.lineWidth = 1.1 * SS; ctx.stroke();
  ctx.fillStyle = 'rgba(58,64,70,0.9)';
  ctx.beginPath(); ctx.arc(cx, hy - hh * 0.62, hw * 0.20, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(120,128,136,0.55)';
  ctx.fillRect(cx - hw * 0.26, hy - hh * 0.30, hw * 0.52, hh * 0.045);

  // the tray: a pale block, flat across the open end
  ctx.beginPath(); arch(orx, ory, A0, A1); ctx.closePath();
  const tg = ctx.createLinearGradient(cx - orx, cy - ory, cx + orx * 0.4, cy + ory);
  tg.addColorStop(0, '#f6f2ea'); tg.addColorStop(0.55, '#e4ddd0'); tg.addColorStop(1, '#c3bbab');
  ctx.fillStyle = tg;
  ctx.shadowColor = 'rgba(24,14,20,0.45)'; ctx.shadowBlur = 15 * SS; ctx.shadowOffsetY = 7 * SS;
  ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // the material
  ctx.beginPath();
  arch(prx, pry, A0 + 0.05, A1 - 0.05);
  if (upper){ ctx.closePath(); }
  else { ctx.ellipse(cx, cy, irx, iry, 0, A1 - 0.05, A0 + 0.05, false); ctx.closePath(); }
  const pg = ctx.createLinearGradient(cx - prx, cy - pry, cx + prx * 0.5, cy + pry);
  pg.addColorStop(0, '#e07ac2'); pg.addColorStop(0.30, '#c74aa2');
  pg.addColorStop(0.68, '#ad2f8b'); pg.addColorStop(1, '#7f1f66');
  ctx.fillStyle = pg; ctx.fill();
  if (upper){
    // the palate, a smooth dome inside the arch
    ctx.beginPath(); ctx.ellipse(cx, cy - h * 0.02, irx * 1.02, iry * 1.02, 0, 0, 7);
    const dg = ctx.createRadialGradient(cx - irx * 0.3, cy - iry * 0.5, irx * 0.1,
                                        cx, cy - h * 0.02, irx * 1.1);
    dg.addColorStop(0, '#d264b2'); dg.addColorStop(1, '#94266f');
    ctx.fillStyle = dg; ctx.fill();
  }

  // fourteen teeth, wide at the back and close at the front
  const mrx = (prx + irx) / 2, mry = (pry + iry) / 2, band = (prx - irx);
  for (let i = 0; i < 14; i++){
    const t2 = (i + 0.5) / 14;
    const th = Math.PI * 0.12 - t2 * Math.PI * 1.24;
    const px2 = cx + Math.cos(th) * mrx, py2 = cy + Math.sin(th) * mry;
    const back = Math.abs(t2 - 0.5) * 2;                  // 0 at the front, 1 at the back
    const tw = band * (0.30 + 0.30 * back), tl = band * (0.40 + 0.12 * back);
    ctx.save();
    ctx.translate(px2, py2); ctx.rotate(th + Math.PI / 2);
    ctx.fillStyle = 'rgba(96,22,74,0.92)';                // the hollow
    ctx.beginPath(); ctx.ellipse(0, 0, tw, tl, 0, 0, 7); ctx.fill();
    if (back > 0.45){                                     // molars keep their cusps
      ctx.fillStyle = 'rgba(140,44,110,0.8)';
      for (const [ox2, oy2] of [[-tw*0.38, -tl*0.34], [tw*0.38, -tl*0.34],
                                [-tw*0.38, tl*0.34], [tw*0.38, tl*0.34]]){
        ctx.beginPath(); ctx.ellipse(ox2, oy2, tw * 0.34, tl * 0.30, 0, 0, 7); ctx.fill();
      }
    }
    ctx.strokeStyle = 'rgba(244,178,222,0.55)';           // the lit rim of the hollow
    ctx.lineWidth = Math.max(0.8, tw * 0.16);
    ctx.beginPath(); ctx.ellipse(0, -tl * 0.06, tw * 0.96, tl * 0.94, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.restore();
  }

  // the wet look, only on the material
  ctx.save();
  ctx.beginPath();
  arch(prx, pry, A0 + 0.05, A1 - 0.05);
  if (upper) ctx.closePath();
  else { ctx.ellipse(cx, cy, irx, iry, 0, A1 - 0.05, A0 + 0.05, false); ctx.closePath(); }
  ctx.clip();
  const sg = ctx.createLinearGradient(cx - prx, cy - pry, cx - prx * 0.1, cy + pry * 0.4);
  sg.addColorStop(0, 'rgba(255,228,248,0.50)');
  sg.addColorStop(0.45, 'rgba(255,228,248,0.07)');
  sg.addColorStop(1, 'rgba(255,228,248,0)');
  ctx.fillStyle = sg; ctx.fillRect(cx - prx, cy - pry, prx * 2, pry * 2);
  ctx.restore();
  ctx.restore();
}
/* onPale: the same digits over a page instead of over the dark room. They are
   drawn in the page's own ink then — additive light on white is invisible,
   which is why the figure used to need a black rectangle under it. */
function drawBits(cx, cy, w, dz, seed, onPale){
  const h = w * 0.94, rx = w * 0.5, ry = h * 0.5, ix = w * 0.29, iy = h * 0.31;
  const R = rng(seed);
  ctx.textAlign = 'center';
  for (let i = 0; i < 220; i++){
    const t2 = R(), rr = R(), thr = R() * 0.60, ch = R() < 0.5 ? '0' : '1';
    const sp = 0.7 + R() * 0.9, jx = R() - 0.5;
    const u = (dz - thr) / 0.40;
    if (u <= 0 || u >= 1) continue;
    const th = Math.PI * 0.13 - t2 * Math.PI * 1.26;
    const mrx = ix + (rx - ix) * rr, mry = iy + (ry - iy) * rr;
    const x = cx + Math.cos(th) * mrx + jx * w * 0.10 * u;
    const y = cy + Math.sin(th) * mry - u * u * w * 0.46 * sp;
    const al = Math.sin(Math.PI * u);
    ctx.font = `${(w * 0.052 * (0.7 + 0.5 * rr)).toFixed(1)}px monospace`;
    ctx.fillStyle = onPale
      ? `rgba(${(18 + 26 * rr) | 0},${(58 + 34 * rr) | 0},${(112 + 40 * rr) | 0},${(al * 0.85).toFixed(3)})`
      : `rgba(${(150 + 60 * rr) | 0},${(215 + 30 * rr) | 0},255,${(al * 0.92).toFixed(3)})`;
    ctx.fillText(ch, x, y);
  }
  ctx.textAlign = 'left';
}
function drawOpenBox(){
  const O = state.openBox; if (!O) return;
  const dt = state.dt || 0.016;
  if (O.closing){
    O.diss = Math.min(1, (O.diss || 0) + dt * 0.80);
    if (O.diss >= 1) O.amt += (0 - O.amt) * Math.min(1, dt * 7);
  } else {
    O.amt += (1 - O.amt) * Math.min(1, dt * 7);
  }
  if (O.closing && O.diss >= 1 && O.amt < 0.02){ state.openBox = null; return; }
  const dz = O.diss || 0;
  const e = O.amt * O.amt * (3 - 2 * O.amt), a = e;
  ctx.save();
  ctx.fillStyle = `rgba(8,10,13,${(0.74 * a).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.50, S2 = Math.min(W / 1120, H / 760) * (0.86 + 0.14 * e);
  const bw2 = 640 * S2, bh2 = 380 * S2, fl = 132 * S2;
  ctx.globalAlpha = a;
  const box = PROP_SPRITES.ph_casebox;
  if (box){
    // the real thing, photographed — the drawn carton is retired. On closing,
    // the trays still dissolve into digits: the case becoming data.
    const ph = Math.min(H * 0.70, W * 0.60 * box.h / box.w);
    const pw = ph * box.w / box.h;
    const bx = cx - pw/2, by = cy - ph/2;
    ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.15);
    ctx.drawImage(box.c, bx, by, pw, ph);
    if (dz > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawBits(bx + pw*0.37, by + ph*0.55, pw*0.30, dz, 20230301);
      drawBits(bx + pw*0.67, by + ph*0.57, pw*0.26, dz, 20230302);
      ctx.restore();
    }
    ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.6);
    ctx.textAlign = 'center';
    ctx.font = eraFont(26 * S2, '700', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(232,238,244,0.92)';
    ctx.fillText('One case, as it arrived', cx, by - 44 * S2);
    ctx.font = eraFont(20 * S2, '', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(190,200,212,0.8)';
    ctx.fillText('both jaws, still in the trays they were taken in', cx, by - 14 * S2);
    ctx.font = eraFont(17 * S2, '', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(150,162,175,0.7)';
    ctx.fillText('click anywhere to digitize', cx, by + ph + 40 * S2);   // and it does: the trays go to digits on the click
    ctx.restore();
    return;
  }
  // the flaps, folded back
  ctx.fillStyle = '#c8bda6';
  for (const [x0, y0, x1, y1, x2, y2, x3, y3] of [
    [cx - bw2/2, cy - bh2/2, cx + bw2/2, cy - bh2/2, cx + bw2/2 - fl*0.5, cy - bh2/2 - fl, cx - bw2/2 + fl*0.5, cy - bh2/2 - fl],
    [cx - bw2/2, cy + bh2/2, cx + bw2/2, cy + bh2/2, cx + bw2/2 - fl*0.5, cy + bh2/2 + fl, cx - bw2/2 + fl*0.5, cy + bh2/2 + fl],
    [cx - bw2/2, cy - bh2/2, cx - bw2/2, cy + bh2/2, cx - bw2/2 - fl*0.8, cy + bh2/2 - fl*0.4, cx - bw2/2 - fl*0.8, cy - bh2/2 + fl*0.4],
    [cx + bw2/2, cy - bh2/2, cx + bw2/2, cy + bh2/2, cx + bw2/2 + fl*0.8, cy + bh2/2 - fl*0.4, cx + bw2/2 + fl*0.8, cy - bh2/2 + fl*0.4]]){
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(140,128,108,0.6)'; ctx.lineWidth = 1.2 * SS; ctx.stroke();
  }
  // the inside of the carton, and the paper it is packed with
  const ig = ctx.createLinearGradient(0, cy - bh2/2, 0, cy + bh2/2);
  ig.addColorStop(0, '#9c9078'); ig.addColorStop(0.30, '#cfc5ad'); ig.addColorStop(1, '#b8ad94');
  ctx.fillStyle = ig;
  ctx.fillRect(cx - bw2/2, cy - bh2/2, bw2, bh2);
  ctx.fillStyle = 'rgba(246,243,235,0.55)';
  ctx.beginPath();
  ctx.moveTo(cx - bw2*0.46, cy + bh2*0.40); ctx.lineTo(cx - bw2*0.30, cy - bh2*0.36);
  ctx.lineTo(cx + bw2*0.44, cy - bh2*0.30); ctx.lineTo(cx + bw2*0.34, cy + bh2*0.42);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,80,64,0.55)'; ctx.lineWidth = 2 * SS;
  ctx.strokeRect(cx - bw2/2, cy - bh2/2, bw2, bh2);
  // both halves of the case — and, once you close it, their departure
  const L = {x: cx - bw2 * 0.23, y: cy - bh2 * 0.02, w: bw2 * 0.40};
  const Rr = {x: cx + bw2 * 0.24, y: cy + bh2 * 0.03, w: bw2 * 0.36};
  ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.25);
  drawImpression(L.x, L.y, L.w, true);
  drawImpression(Rr.x, Rr.y, Rr.w, false);
  ctx.globalAlpha = a;
  if (dz > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawBits(L.x, L.y, L.w, dz, 20230301);
    drawBits(Rr.x, Rr.y, Rr.w, dz, 20230302);
    ctx.restore();
  }
  ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.6);
  ctx.textAlign = 'center';
  ctx.font = eraFont(26 * S2, '700', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(232,238,244,0.92)';
  ctx.fillText('One case, as it arrived', cx, cy - bh2/2 - fl - 34 * S2);
  ctx.font = eraFont(20 * S2, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(190,200,212,0.8)';
  ctx.fillText('both jaws, still in the trays they were taken in', cx, cy - bh2/2 - fl - 6 * S2);
  ctx.font = eraFont(17 * S2, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(150,162,175,0.7)';
  ctx.fillText('click anywhere to close', cx, cy + bh2/2 + fl + 34 * S2);
  ctx.restore();
}

/* -------- THE PFM LINE, OPENED -------- 
   Not a photograph flying up: the six stands GROW, out of their own places on
   the counter, until they are standing at the size of the room — and they land
   on the counter's own top line, so they are still on a table when they get
   there. The bay's plate comes with them, stretched to the same width, and the
   hall behind goes darker than an inspection does, because this one is meant
   to be read. The film keeps playing throughout: nothing here is a page. */
function drawPfmView(){
  const V = state.pfmView; if (!V) return;
  V.amt += ((V.closing ? 0 : 1) - V.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (V.closing && V.amt < 0.03){ state.pfmView = null; return; }
  const e = V.amt * V.amt * (3 - 2 * V.amt);
  const b = BEATS[V.beat]; if (!b || !b.pfmRow) { state.pfmView = null; return; }
  const R = b.pfmRow, rowSp = PROP_SPRITES.ph_pfmrow;
  if (!rowSp) return;
  const asp = rowSp.w / rowSp.h, seg = segAt(b.x);
  // where it stands now
  const kk = k(bz(R.lz));
  const w0 = R.w * kk * SS, cx0 = px(b.x + R.dx, kk), y0 = py(CFG.benchY - 2 - (R.lift || 0), kk);
  // the plate, at its own size on the wall, and the proportion it keeps
  const kp = k(wallZAt(b.x) - 8);
  const tx = sentence(b.t);
  ctx.save();
  ctx.font = eraFont(40 * kp * SS, '', seg.font);
  const wP0 = Math.max(320 * kp * SS, ctx.measureText(tx).width + 84 * kp * SS);
  ctx.restore();
  const hP0 = 88 * kp * SS, yP0 = py(150, kp), cxP0 = px(b.x + (b.plaqueDX || 0), kp);
  // where it is going: on the counter's own top line, as wide as the room allows
  const yLine = py(CFG.benchY - 2, k(bz(0)));
  const topP = H * 0.055, gap = H * 0.038;
  const cH = (hP0 / wP0) * PFM_PLATE_SPAN;   // the plate's height, as a fraction of the line's width
  const w1 = Math.min(W * 0.90, Math.max(240, (yLine - topP - gap)) * asp / (1 + cH * asp));
  const wP1 = PFM_PLATE_SPAN * w1, hP1 = cH * w1;
  const wN = mixN(w0, w1, e), cxN = mixN(cx0, W / 2, e), yN = mixN(y0, yLine, e);
  const hN = wN / asp;
  ctx.fillStyle = `rgba(2,3,5,${(0.88 * e).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  /* THE PLATE GROWS, IT DOES NOT STRETCH: width, height and letters all take
     the same factor, so it is the same plate seen closer. */
  {
    const wP = mixN(wP0, wP1, e), hP = mixN(hP0, hP1, e);
    const yP = mixN(yP0, topP, e), cxP = mixN(cxP0, W / 2, e);
    const sc = wP / wP0;
    ctx.save();
    ctx.textAlign = 'center';
    const pg = ctx.createLinearGradient(cxP, yP, cxP, yP + hP);
    pg.addColorStop(0, 'rgba(70,58,40,0.92)'); pg.addColorStop(1, 'rgba(44,36,24,0.92)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.roundRect(cxP - wP / 2, yP, wP, hP, 6 * SS * sc); ctx.fill();
    ctx.strokeStyle = `rgba(${seg.ink},0.4)`; ctx.lineWidth = 1.5 * SS * sc;
    ctx.strokeRect(cxP - wP / 2 + 5 * kp * SS * sc, yP + 5 * kp * SS * sc,
                   wP - 10 * kp * SS * sc, hP - 10 * kp * SS * sc);
    const fP = 40 * kp * SS * sc;
    ctx.font = eraFont(fP, '', seg.font);
    try { ctx.letterSpacing = `${fP * TRACK.plate}px`; } catch(err){}
    ctx.fillStyle = `rgba(${seg.ink},0.95)`;
    ctx.fillText(tx, cxP, yP + hP * 0.66);
    try { ctx.letterSpacing = '0px'; } catch(err){}
    ctx.restore();
  }
  ctx.drawImage(spriteMip(rowSp, wN, hN), cxN - wN / 2, yN - hN, wN, hN);
  /* what happens at each stand, under that stand and no wider than it */
  if (e > 0.55){
    const a = (e - 0.55) / 0.45;
    const left = W / 2 - w1 / 2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textAlign = 'left';
    ctx.font = eraFont(19 * SS, '', seg.font);
    ctx.fillStyle = `rgba(216,209,196,${(a * 0.85).toFixed(2)})`;
    for (const st of PFM_STAGES){
      const colW2 = st.w * w1 * 1.06;
      const lx = left + (st.cx - st.w / 2) * w1 - (colW2 - st.w * w1) / 2;
      wrapCalc(st.cap, colW2)
        .forEach((ln, li) => ctx.fillText(ln, lx, yLine + (38 + li * 25) * SS));
    }
    drawCloseX(W - 46 * SS, 46 * SS, 13 * SS, a);
    ctx.restore();
  }
}
/* ═══ КНИГА, КОТОРУЮ МОЖНО ЗАБРАТЬ ═════════════════════════════════════════
   Стопка «Constant Change» на прилавке 2022-го открывала просто карточку с
   обложкой. Теперь рядом с карточкой стоит то, ради чего стопка там и лежит:
   гость подносит бейдж к сканеру, и книга уезжает ему на почту.

   КАК ЭТО РАБОТАЕТ. USB-сканер — это клавиатура: он «печатает» содержимое
   кода. Поэтому на странице живёт одно невидимое поле, которое держит фокус;
   всё, что в него прилетает, разбирается. Ловится событие input, а НЕ клавиши:
   keydown приходит не от всякого ввода, и на стенде это уже стоило круга
   (expo/lab/badge.html, 2026-09-23). Конец скана — тишина в 220 мс.

   ЧТО УХОДИТ НАРУЖУ: ничего. Запись ложится в localStorage этой машины и
   выгружается оттуда. Статический сайт письма слать не умеет, а слать
   персональные данные гостей в чужой сервис без решения Эльдара нельзя. */
const BOOK = {
  el: null, field: 'badge', badge: '', name: '', email: '', consent: false,
  timer: null, taps: [], done: false, hit: {},
  /* СЧЁТЧИК НА ВИДУ. Сканер либо шлёт в браузер нажатия, либо не шлёт — и это
     надо видеть, не открывая консоль. Пока ноль, дело не в зале: код до
     страницы не доходит вовсе (Эльдар, 2026-09-23: «я сканирую, ничего не
     происходит»). */
  keys: 0, lastKey: '',
};
const BOOK_KEY = 'book.queue.v1';
/* ═══ СКАНЕР ЧЕРЕЗ COM-ПОРТ ════════════════════════════════════════════════
   Сканер MJ-3000 снят с игрового автомата и настроен там под него: интерфейс
   USB COM и Host mode — он не печатает, он говорит в порт и читает только по
   команде компьютера. Переключать его обратно нельзя, он вернётся в автомат.

   Поэтому зал читает порт сам, ровно как это делает автомат. Команды, скорость
   и тайминги взяты из его рабочего кода (07. Games/arcade-cabinet,
   app/assets/index-*.js) и не выдуманы: 9600 бод, SSI start/stop, повтор start
   каждые 1800 мс, пока окно открыто, и склейка пришедшего текста с паузой
   120 мс. Клавиатурный путь при этом остаётся — обычный HID-сканер, если он
   когда-нибудь появится, будет работать без единой правки.

   Права на порт браузер даёт ОДНИМ ЖЕСТОМ и запоминает их для этого адреса;
   автомат живёт на другом адресе, так что одно нажатие здесь нужно один раз.
   Web Serial есть в Chrome и Edge, в Safari его нет (Эльдар, 2026-09-23). */
const SSI = {start: [4,228,4,0,255,20], stop: [4,229,4,0,255,19]};
const BOOK_PING = 1800, BOOK_JOIN = 120;
const SER = {port: null, writer: null, ping: null, state: 'off', buf: '', joiner: null, seen: 0};
function serOk(){ return typeof navigator !== 'undefined' && 'serial' in navigator; }
async function serWrite(bytes){
  if (!SER.writer) return;
  try { await SER.writer.write(new Uint8Array(bytes)); } catch(e){ SER.state = 'failed'; }
}
function serGot(text){
  SER.buf += text; SER.seen += text.length;
  clearTimeout(SER.joiner);
  SER.joiner = setTimeout(() => {
    const code = SER.buf.replace(/[\r\n\t]+$/, ''); SER.buf = '';
    if (code) bookFromCode(code);
  }, BOOK_JOIN);
}
async function serRead(){
  const dec = new TextDecoder();
  while (SER.port && SER.port.readable){
    const r = SER.port.readable.getReader();
    try { for(;;){ const {value, done} = await r.read(); if (done) break; if (value && value.length) serGot(dec.decode(value)); } }
    catch(e){ break } finally { try { r.releaseLock(); } catch(e){} }
  }
}
async function serOpen(port){
  try {
    await port.open({baudRate: 9600});
    SER.port = port;
    SER.writer = port.writable ? port.writable.getWriter() : null;
    SER.state = 'open';
    serRead();
    await serWrite(SSI.stop);
    serPing(true);
    return true;
  } catch(e){ SER.state = 'failed'; return false; }
}
/* порт, права на который уже выданы, открывается молча — без нажатий */
async function serAuto(){
  if (!serOk() || SER.state === 'open') return false;
  try { for (const p of await navigator.serial.getPorts()) if (await serOpen(p)) return true; } catch(e){}
  return false;
}
async function serPick(){
  if (!serOk()) return;
  try { const p = await navigator.serial.requestPort(); await serOpen(p); } catch(e){}
}
function serPing(on){
  clearInterval(SER.ping); SER.ping = null;
  if (!on || SER.state !== 'open') { serWrite(SSI.stop); return; }
  serWrite(SSI.start);
  SER.ping = setInterval(() => serWrite(SSI.start), BOOK_PING);
}
const BOOK_MAIL = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
function bookQueue(){ try { return JSON.parse(localStorage.getItem(BOOK_KEY) || '[]'); } catch(e){ return []; } }
function bookInit(){
  if (BOOK.el) return;
  const el = document.createElement('textarea');
  el.setAttribute('aria-hidden', 'true');
  el.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;width:10px;height:10px';
  document.body.appendChild(el);
  BOOK.el = el;
  addEventListener('keydown', ev => {
    if (!(state.inspect && state.inspect.offer)) return;
    BOOK.keys++;
    BOOK.lastKey = ev.key && ev.key.length === 1 ? ev.key : (ev.key || '?');
  }, true);
  el.addEventListener('input', () => {
    if (BOOK.field === 'badge'){
      BOOK.taps.push(performance.now());
      clearTimeout(BOOK.timer);
      BOOK.timer = setTimeout(bookScanned, 220);
    } else {
      BOOK[BOOK.field] = el.value.replace(/[\r\n\t]/g, '');
    }
  });
}
function bookScanned(){
  const txt = BOOK.el.value.replace(/[\r\n\t]+$/, '');
  BOOK.el.value = ''; BOOK.taps = [];
  bookFromCode(txt);
}
/* один приёмник на оба пути: клавиатура и COM-порт приносят одну и ту же строку */
function bookFromCode(txt){
  if (!txt) return;
  BOOK.badge = txt;
  /* В бейдже чаще всего только номер регистрации — это норма, а не сбой:
     адрес вводит сам гость. Но если визитка принесла имя и почту, берём. */
  const em = txt.match(BOOK_MAIL);
  if (em) BOOK.email = em[0];
  const fn = txt.match(/(?:^|\n)FN:(.+)/i) || txt.match(/MECARD:N:([^;]+)/i);
  if (fn) BOOK.name = fn[1].split(',').filter(Boolean).reverse().join(' ').trim();
  bookFocus(BOOK.email ? 'badge' : 'email');
}
function bookFocus(f){
  BOOK.field = f;
  if (!BOOK.el) return;
  BOOK.el.value = (f === 'badge') ? '' : (BOOK[f] || '');
  try { BOOK.el.focus({preventScroll: true}); BOOK.el.setSelectionRange(BOOK.el.value.length, BOOK.el.value.length); } catch(e){}
}
function bookReset(){
  BOOK.badge = ''; BOOK.name = ''; BOOK.email = ''; BOOK.consent = false; BOOK.done = false;
  BOOK.keys = 0; BOOK.lastKey = '';
  bookFocus('badge');
  /* порт, права на который уже выданы, поднимается сам; опрос идёт только пока
     книга открыта — сканер в Host mode читает лишь по команде */
  serAuto().then(ok => { if (ok || SER.state === 'open') serPing(true); });
  if (SER.state === 'open') serPing(true);
}
function bookSend(){
  const q = bookQueue();
  q.push({at: new Date().toISOString(), name: BOOK.name, email: BOOK.email,
          badge: BOOK.badge, consent: true, sent: false});
  try { localStorage.setItem(BOOK_KEY, JSON.stringify(q)); } catch(e){}
  BOOK.done = true;
  setTimeout(() => { if (state.inspect) bookReset(); }, 2600);
}
/* полоса предложения: рисуется справа от карточки, когда открыта книга */
function drawBookOffer(x0, y0, wPan, e){
  bookInit();
  /* ФОКУС ВОЗВРАЩАЕТСЯ КАЖДЫЙ КАДР. Гость открывает книгу ПАЛЬЦЕМ, и нажатие
     по холсту уводит фокус на него уже ПОСЛЕ того, как обработчик поставил его
     в скрытое поле: сканеру становится некуда печатать, и скан молча пропадает.
     Проверка дешёвая — focus() зовётся только когда поле фокус потеряло. */
  if (BOOK.el && document.activeElement !== BOOK.el){
    try { BOOK.el.focus({preventScroll: true}); } catch(err){}
  }
  const a = Math.max(0, (e - 0.6) / 0.4);
  if (a < 0.02) return;
  const u = Math.max(11, Math.round(wPan * 0.030));
  const FAM = '"Helvetica Neue", Arial, sans-serif';
  const ink = al => `rgba(236,242,248,${(al * a).toFixed(3)})`;
  /* каждая строка ужимается измерением — правило R1 линтера */
  const put = (txt, x, y, size, weight, maxW, align) => {
    let fs = size;
    for (let i = 0; i < 6; i++){
      ctx.font = `${weight ? weight + ' ' : ''}${fs.toFixed(1)}px ${FAM}`;
      const tw = ctx.measureText(txt).width;
      if (tw <= maxW) break;
      fs *= maxW / tw;
    }
    ctx.textAlign = align || 'left';
    ctx.fillText(txt, x, y);
    return fs;
  };
  BOOK.hit = {};
  /* СВОЯ ПЛИТА ПОД ПОЛОСОЙ. Сперва полоса рисовалась прямо поверх зала, и
     сквозь неё читались его собственные надписи — «The crossover», «Physical»,
     «Digital». Высота плиты считается из тех же шагов, что и строки ниже:
     26.6u — сумма всех интервалов до последней подсказки. */
  const panH = u * (26.6 + ((serOk() && SER.state !== 'open') ? 3.2 : 0)), panPad = u * 1.6;
  ctx.fillStyle = `rgba(9,12,16,${(0.965 * a).toFixed(3)})`;
  ctx.beginPath();
  ctx.roundRect(x0 - panPad, y0 - panPad * 1.5, wPan + panPad * 2, panH + panPad * 2.2, u * 0.9);
  ctx.fill();
  ctx.strokeStyle = `rgba(140,205,250,${(0.20 * a).toFixed(3)})`;
  ctx.lineWidth = 1.2 * SS;
  ctx.beginPath();
  ctx.roundRect(x0 - panPad, y0 - panPad * 1.5, wPan + panPad * 2, panH + panPad * 2.2, u * 0.9);
  ctx.stroke();
  let y = y0;

  ctx.fillStyle = ink(0.95);
  put('Take the book home', x0, y, u * 2.0, '600', wPan);
  y += u * 2.2;
  ctx.fillStyle = ink(0.55);
  put(BOOK.done ? 'Thank you — it is on its way.'
                : 'Hold your badge up to the scanner, or type your address.',
      x0, y, u * 1.05, '', wPan);
  y += u * 2.4;

  // ── строка бейджа ──
  const fieldH = u * 2.6;
  const field = (label, value, key, placeholder) => {
    const on = BOOK.field === key;
    ctx.fillStyle = ink(0.45);
    put(label, x0, y, u * 0.86, '600', wPan);
    y += u * 1.15;
    ctx.fillStyle = `rgba(255,255,255,${(0.05 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.roundRect(x0, y, wPan, fieldH, u * 0.5); ctx.fill();
    ctx.strokeStyle = on ? `rgba(140,205,250,${(0.85*a).toFixed(3)})` : `rgba(236,242,248,${(0.22*a).toFixed(3)})`;
    ctx.lineWidth = 1.4 * SS;
    ctx.beginPath(); ctx.roundRect(x0, y, wPan, fieldH, u * 0.5); ctx.stroke();
    ctx.fillStyle = value ? ink(0.95) : ink(0.35);
    put(value || placeholder, x0 + u, y + fieldH * 0.66, u * 1.15, '', wPan - u * 2);
    if (on && ((state.time * 2) | 0) % 2 === 0 && value){
      ctx.font = `${(u*1.15).toFixed(1)}px ${FAM}`;
      const cw = ctx.measureText(value).width;
      ctx.fillStyle = ink(0.8);
      ctx.fillRect(x0 + u + cw + 2*SS, y + fieldH*0.24, 2*SS, fieldH*0.52);
    }
    BOOK.hit[key] = [x0, y, wPan, fieldH];
    pushHit(x0, y, wPan, fieldH, {type: 'bookfield', key});
    y += fieldH + u * 1.1;
  };

  ctx.fillStyle = ink(0.45);
  put('BADGE', x0, y, u * 0.86, '600', wPan);
  y += u * 1.15;
  const bH = u * 2.2;
  ctx.fillStyle = `rgba(140,205,250,${((BOOK.badge ? 0.10 : 0.05) * a).toFixed(3)})`;
  ctx.beginPath(); ctx.roundRect(x0, y, wPan, bH, u * 0.5); ctx.fill();
  ctx.strokeStyle = BOOK.field === 'badge'
    ? `rgba(140,205,250,${(0.8*a).toFixed(3)})` : `rgba(236,242,248,${(0.18*a).toFixed(3)})`;
  ctx.setLineDash(BOOK.badge ? [] : [6*SS, 5*SS]);
  ctx.lineWidth = 1.4 * SS;
  ctx.beginPath(); ctx.roundRect(x0, y, wPan, bH, u * 0.5); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = BOOK.badge ? ink(0.9) : ink(0.4);
  put(BOOK.badge || 'waiting for a scan…', x0 + u, y + bH * 0.66, u * 1.0, '', wPan - u * 2);
  /* справа в той же строке — сколько нажатий долетело до страницы */
  /* справа в той же строке — состояние: либо порт открыт, либо сколько
     нажатий долетело с клавиатуры. Сканер зала снят с игрового автомата и
     настроен под COM-порт, поэтому нормальное состояние здесь — «port open». */
  const ser = SER.state === 'open';
  ctx.fillStyle = (ser || BOOK.keys) ? `rgba(105,211,138,${(0.9*a).toFixed(3)})`
                                     : `rgba(236,242,248,${(0.28*a).toFixed(3)})`;
  put(ser ? 'port open' : (BOOK.keys ? BOOK.keys + ' keys · ' + BOOK.lastKey : 'no keys yet'),
      x0 + wPan - u, y + bH * 0.66, u * 0.82, '', wPan * 0.42, 'right');
  pushHit(x0, y, wPan, bH, {type: 'bookfield', key: 'badge'});
  y += bH + u * 1.1;

  /* ОДНО НАЖАТИЕ НА ВЕСЬ ПОКАЗ. Права на COM-порт браузер выдаёт только по
     жесту человека и запоминает их для этого адреса — дальше порт поднимается
     сам при каждом открытии книги. */
  if (serOk() && SER.state !== 'open'){
    const cw2 = wPan * 0.66, ch2 = u * 2.2;
    ctx.fillStyle = `rgba(140,205,250,${(0.16 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.roundRect(x0, y, cw2, ch2, ch2/2); ctx.fill();
    ctx.strokeStyle = `rgba(140,205,250,${(0.55 * a).toFixed(3)})`; ctx.lineWidth = 1.3 * SS;
    ctx.beginPath(); ctx.roundRect(x0, y, cw2, ch2, ch2/2); ctx.stroke();
    ctx.fillStyle = `rgba(170,220,255,${(0.95 * a).toFixed(3)})`;
    put('Connect the scanner', x0 + cw2/2, y + ch2 * 0.66, u * 0.95, '600', cw2 - u, 'center');
    pushHit(x0, y, cw2, ch2, {type: 'bookserial'});
    y += ch2 + u * 1.0;
  }
  field('NAME',  BOOK.name,  'name',  'Jane Doe');
  field('EMAIL', BOOK.email, 'email', 'jane@practice.com');

  // ── согласие ──
  const boxS = u * 1.3;
  ctx.strokeStyle = `rgba(236,242,248,${(0.4*a).toFixed(3)})`; ctx.lineWidth = 1.4 * SS;
  ctx.beginPath(); ctx.roundRect(x0, y, boxS, boxS, u * 0.28); ctx.stroke();
  if (BOOK.consent){
    ctx.strokeStyle = `rgba(140,205,250,${(0.95*a).toFixed(3)})`; ctx.lineWidth = 2.4 * SS;
    ctx.beginPath();
    ctx.moveTo(x0 + boxS*0.22, y + boxS*0.55);
    ctx.lineTo(x0 + boxS*0.44, y + boxS*0.76);
    ctx.lineTo(x0 + boxS*0.80, y + boxS*0.26);
    ctx.stroke();
  }
  ctx.fillStyle = ink(0.6);
  const CON = 'Send me the book and keep my address for that.';
  put(CON, x0 + boxS + u * 0.8, y + boxS * 0.82, u * 0.95, '', wPan - boxS - u);
  pushHit(x0, y - u*0.3, wPan, boxS + u*0.6, {type: 'bookconsent'});
  y += boxS + u * 1.6;

  // ── кнопка ──
  const ok = BOOK.consent && BOOK_MAIL.test(BOOK.email) && !BOOK.done;
  const bw = wPan * 0.62, bh = u * 2.8;
  ctx.fillStyle = ok ? `rgba(140,205,250,${(0.92*a).toFixed(3)})` : `rgba(236,242,248,${(0.10*a).toFixed(3)})`;
  ctx.beginPath(); ctx.roundRect(x0, y, bw, bh, bh/2); ctx.fill();
  ctx.fillStyle = ok ? `rgba(10,16,22,${(0.95*a).toFixed(3)})` : ink(0.35);
  put(BOOK.done ? 'Sent' : 'Send me the book', x0 + bw/2, y + bh*0.65, u*1.15, '600', bw - u*2, 'center');
  if (ok) pushHit(x0, y, bw, bh, {type: 'booksend'});
  y += bh + u * 0.9;

  // ── почему кнопка серая ──
  if (!ok && !BOOK.done){
    const need = [];
    if (!BOOK_MAIL.test(BOOK.email)) need.push(BOOK.email ? 'the address looks wrong' : 'an address is needed');
    if (!BOOK.consent) need.push('tick the box');
    ctx.fillStyle = `rgba(232,180,92,${(0.85*a).toFixed(3)})`;
    put(need.join(' · '), x0, y, u * 0.92, '', wPan);
  }
  ctx.textAlign = 'left';
}
function drawInspect(){
  const I = state.inspect; if (!I) return;
  I.amt += ((I.closing ? 0 : 1) - I.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (I.closing && I.amt < 0.03){
    /* фокус возвращается залу: скрытое поле держит его, пока открыта книга, и
       иначе проглотило бы клавиши зала (M — музыка и прочее) */
    if (BOOK.el) try { BOOK.el.blur(); } catch(e){}
    serPing(false);
    state.inspect = null; return;
  }
  const e = I.amt*I.amt*(3-2*I.amt);
  const sp = I.sp;
  // source: where the photo lives in the world right now
  let sx0, sy0, sw0, sh0;
  if (I.table){
    const kk = k(I.lz);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale*0.42;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(CFG.benchY, kk) - sh0;
  } else {
    const kk = k(I.z);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(I.cy, kk) - sh0/2;
  }
  /* КНИГА ДЕЛИТ ЭКРАН: карточка слева, предложение справа. Без предложения
     карточка занимает экран целиком, как раньше. */
  const offer = !!I.offer;
  const maxW = offer ? W*0.46 : W*0.72, maxH = offer ? H*0.70 : H*0.78;
  const th = Math.min(maxH, maxW*sp.h/sp.w);
  const tw = th * sp.w/sp.h;
  const tx = offer ? W*0.50 - tw : W/2 - tw/2, ty = H*0.46 - th/2;
  ctx.fillStyle = `rgba(3,2,2,${0.62*e})`;
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sp.c, mixN(sx0,tx,e), mixN(sy0,ty,e), mixN(sw0,tw,e), mixN(sh0,th,e));
  if (e > 0.6){
    const b = BEATS[I.beat];
    const seg = segAt(b.x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(30*SS, '', seg.font);
    ctx.fillStyle = `rgba(${seg.ink},${(e-0.6)/0.4 * 0.9})`;
    /* IT WRAPS. The caption was one fillText with no width, so a long line —
       the book's "free to take", say — ran off the panel and the last letter
       was sliced in half by the edge of the frame. */
    const capTx = I.cap || (b.y + ' \u00b7 ' + b.t);
    const capLines = wrapCalc(capTx, Math.min(W * 0.78, 1150 * SS));
    capLines.forEach((ln, li) => ctx.fillText(ln, W/2, ty + th + (52 + li * 38) * SS));
    const capDrop2 = (capLines.length - 1) * 38 * SS;
    if (I.link){
      const label = 'Open the Chairside archive  \u2192';
      ctx.font = eraFont(22*SS, '', seg.font);
      try { ctx.letterSpacing = `${22*TRACK.label*SS}px`; } catch(err){}
      const wL = ctx.measureText(label).width + 56*SS;
      const yL = ty + th + 86*SS + capDrop2;
      const aL = (e-0.6)/0.4;
      ctx.fillStyle = `rgba(140,205,250,${(0.14*aL).toFixed(3)})`;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.fill();
      ctx.strokeStyle = `rgba(140,205,250,${(0.5*aL).toFixed(3)})`; ctx.lineWidth = 1.2*SS;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.stroke();
      ctx.fillStyle = `rgba(170,220,255,${(0.95*aL).toFixed(3)})`;
      ctx.fillText(label, W/2, yL + 35*SS);
      try { ctx.letterSpacing = '0px'; } catch(err){}
      pushHit(W/2 - wL/2, yL, wL, 52*SS, {type:'ext', url: I.link});
    }
    ctx.restore();
  }
  if (I.offer) drawBookOffer(W*0.545, ty + 26*SS, Math.min(W*0.33, 430*SS), e);
}

/* ARTICLES KEYED BY NAME. The map below is keyed by a beat's coordinate, and a
   coordinate is a thing this file moves — by SHIFT, by the rhythm passes, by
