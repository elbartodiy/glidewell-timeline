/* Cut a paragraph into tokens: plain words, and whole names carrying a person
   id. A name stays ONE token so it can never break across a line. `glue` says
   the token followed the last one with no space in the source — that is how
   the comma after a linked name stays welded to it instead of drifting off
   with a space in front of it. */
function nameTokens(text, seen){
  const out = [];
  const push = (s, at, pid) => {
    if (!s) return;
    out.push({s, pid, glue: at > 0 && text[at - 1] !== ' '});
  };
  const plain = (from, to) => {
    let i = from;
    for (const w of text.slice(from, to).split(' ')){ if (w) push(w, i, null); i += w.length + 1; }
  };
  let last = 0, m;
  NAME_RE.lastIndex = 0;
  while ((m = NAME_RE.exec(text))){
    const pid = NAME_RE_MAP.get(m[1]);
    plain(last, m.index);
    const link = pid && PEOPLE[pid] && seen && !seen.has(pid);
    if (link) seen.add(pid);
    push(m[1], m.index, link ? pid : null);
    last = m.index + m[1].length;
  }
  plain(last, text.length);
  return out;
}
/* A run of prose on a reading page. Word-by-word wrapping exactly as before,
   but drawn run by run instead of one fillText a line, so a name can take the
   accent colour, a rule under it and a hit rect. Returns the new y. */
function flowText(text, x, y, maxW, lineH, o){
  const sp = ctx.measureText(' ').width;
  const toks = nameTokens(text, o.seen);
  let line = [], wLine = 0;
  const flush = () => {
    if (line.length && y > o.top && y < o.bot){
      let cx = x;
      for (let i = 0; i < line.length; i++){
        const t = line[i];
        if (i && !t.glue) cx += sp;
        const w = ctx.measureText(t.s).width;
        if (t.pid){
          ctx.fillStyle = o.accent;
          ctx.fillText(t.s, cx, y);
          ctx.fillRect(cx, y + 6*SS, w, 1.4*SS);
          pushHit(cx - 5*SS, y - lineH*0.62, w + 10*SS, lineH*0.92, {type:'person', id: t.pid});
          ctx.fillStyle = o.ink;
        } else ctx.fillText(t.s, cx, y);
        cx += w;
      }
    }
    y += lineH; line = []; wLine = 0;
  };
  for (const t of toks){
    const w = ctx.measureText(t.s).width;
    const gap = (line.length && !t.glue) ? sp : 0;
    // a glued token never starts a line — punctuation stays with its word
    if (line.length && !t.glue && wLine + gap + w > maxW){ flush(); line = [t]; wLine = w; }
    else { line.push(t); wLine += gap + w; }
  }
  if (line.length) flush();
  return y;
}

function drawStudy(){
  const S = state.study; if (!S) return;
  S.amt += ((S.closing ? 0 : 1) - S.amt) * Math.min(1, (state.dt || 0.016) * 5);

  /* what goes in the right-hand column: the exhibit, the voices, the people.
     A page with none of them is one column; a page that hangs its voices in a
     strip under the article (railBelow) keeps them out of the column. */
  /* ПРАВИЛО СТРАНИЦЫ: ГОЛОС ИДЁТ СРАЗУ ПОСЛЕ ПЕРВОГО АБЗАЦА, КРУПНО.
     Первый абзац говорит, что это за момент; дальше зритель должен упереться
     в лицо, а не в ещё три экрана текста. Раньше голоса складывались в правую
     колонку или в конец страницы, и на «The Crossover» Резник оказывался в
     самом низу — Эльдар просил это несколько раз, теперь это правило, а не
     флаг на отдельных битах (2026-09-23). Страница, которой нужна колонка,

    let paraN = -1;
    for (const para0 of more.split('\n\n')){

        const nl = para.indexOf('\n');
        const head = nl < 0 ? para.slice(3) : para.slice(3, nl);
        /* ПОДЗАГОЛОВОК ДОЛЖЕН СТОЯТЬ БЛИЖЕ К СВОЕМУ ТЕКСТУ, ЧЕМ К ЧУЖОМУ — но

           при межстрочном 34: снизу теснее, чем внутри абзаца, поэтому строка

           почти не было (Эльдар, 2026-09-23: «проверь, нет ли такого ещё»).

           отступом. */

        if (y > topClip && y < botClip) ctx.fillRect(left, y - 2.4 * u - 2 * SS, 5 * u, 2 * SS);
        ctx.font = K.font(PAGE.body, '600');
        ctx.fillStyle = `rgba(${K.ink},0.95)`;

      }

      ctx.fillStyle = bodyInk;
      for (const rawLine of para.split('\n')){
        if (rawLine.startsWith('• ')){
          if (y > topClip && y < botClip){
            ctx.fillStyle = `rgba(${K.accent},0.9)`;
            ctx.fillText('•', left, y);

          y = flowText(rawLine.slice(2), left + ind, y, textW - ind, PAGE.bodyLH * SS,
            {seen, top: topClip, bot: botClip, accent: `rgba(${K.accent},0.95)`, ink: bodyInk});
          y += 0.5 * u;
        } else flow(rawLine, PAGE.bodyLH * SS, bodyInk);
      }

    }
  }
  drawVoiceStrip();    // страницы, не назвавшие места, получают полосу здесь
  drawInlineBox();     // pages that did not ask for it at the head get it here
  const links = STUDY_LINKS[b.t];
  if (links){
    // the button under the pointer lights: a link should say it is one
    const hv = Input.hover ? hitAt(Input.hover.x, Input.hover.y) : null;
    HOVER_LINK = (hv && hv.type === 'link') ? hv.url : null;
    y += 10 * SS;

function personInitials(nm){
  return (nm || '').replace(/^(Dr\.|Mr\.|Ms\.|Mrs\.)\s+/, '')

  state.person = {id, scroll: 0, amt: 0, maxScroll: 1, playing: null, v: null};

     full-screen clip view — so tapping a face in the voices list landed you on
     something that looked like YouTube instead of on the person. The voice
     still starts by itself as the page opens; it just starts in the rail,
     beside the words, and a tap on it expands to the player. */

  state.cardRect = {x: G.wx0, y: G.wy0, w: G.ww, h: G.wh, r: K.r*SS};
  S.fitH = (yEnd + S.scroll * SS - G.wy0) + 4 * u;
  S.maxScroll = Math.max(1, (yEnd + 5 * u + S.scroll * SS - (G.wy0 + G.wh)) / SS);
}
function drawClip(){
  /* THE PLAYER IS A LAYER INSIDE THE CARD. It used to throw the clip on the
     hall wall — a beam, feathered edges, grain, a flicker on the picture. That
     belongs to the projector in the room and to nothing else: a card is a page,
     not a screening, and a page does not flicker. So the card stays exactly
     where it is, dims a little, and the video plays in a panel set inside it. */
  const C = state.clip; if (!C) return;
  C.amt += ((C.closing ? 0 : 1) - C.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (C.closing && C.amt < 0.03){ closeClip(); return; }
  const e = C.amt*C.amt*(3-2*C.amt);
  const R = state.cardRect;
  if (!R) return;                     // no host card, nothing to play inside
  const a = e;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(R.x, R.y, R.w, R.h, R.r); ctx.clip();
  /* the page does not sit half-visible behind the picture — a ghost of the
     text under a video reads as a mistake, not as depth. The card's own frame
     stays, and inside it turns into the dark plate the clip plays on; the fade
     is what shows you it is the same card. */
  ctx.fillStyle = `rgba(12,14,17,${a.toFixed(3)})`;
  ctx.fillRect(R.x, R.y, R.w, R.h);
  // the panel is fitted into the card with room left round it, so it reads as
  // a layer standing on the page rather than as the page being replaced
  const pad = R.w * 0.09;
  const boxW = R.w - pad*2, boxH = R.h - 230*SS;
  const vw = Math.min(boxW, boxH * 16/9), vh = vw * 9/16;
  // the panel and its caption are centred as one block, and the caption keeps
  // to the margins: the card's own centred footer is still faintly behind it
  const capH = 104*SS;
  const x0 = R.x + (R.w - vw)/2, y0 = R.y + (R.h - (vh + capH))/2;
  ctx.globalAlpha = a;
  const v = C.v;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 34*SS; ctx.shadowOffsetY = 10*SS;
  ctx.fillStyle = '#0b0d10';
  ctx.beginPath(); ctx.roundRect(x0, y0, vw, vh, 6*SS); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x0, y0, vw, vh, 6*SS); ctx.clip();
  if (v && v.videoWidth && v.readyState >= 2){
    // contained, not cropped: an interview is a framed shot, keep the frame
    const s = Math.min(vw / v.videoWidth, vh / v.videoHeight);
    ctx.drawImage(v, x0 + vw/2 - v.videoWidth*s/2, y0 + vh/2 - v.videoHeight*s/2,
                  v.videoWidth*s, v.videoHeight*s);
  } else {
    // a still from the clip while the first frame is still being decoded —
    // never a black hole in the middle of the page
    const im = thumbFor(C);
    if (im){
      const s = Math.min(vw / im.w, vh / im.h);
      ctx.globalAlpha = a * 0.65;
      ctx.drawImage(im.el, x0 + vw/2 - im.w*s/2, y0 + vh/2 - im.h*s/2, im.w*s, im.h*s);
      ctx.globalAlpha = a;
    }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1.2*SS;
  ctx.beginPath(); ctx.roundRect(x0, y0, vw, vh, 6*SS); ctx.stroke();
  /* THE TIMELINE IS A HANDLE. A bar that only reports is no use to anyone
     watching an interview: this one is thick enough to hit, carries a knob, and
     takes a click or a drag anywhere along it. */
  {
    const barY = y0 + vh + 16*SS, barH = 5*SS;
    const frac = (v && v.duration) ? Math.max(0, Math.min(1, v.currentTime / v.duration)) : 0;
    ctx.fillStyle = 'rgba(236,240,245,0.20)';
    ctx.fillRect(x0, barY, vw, barH);
    ctx.fillStyle = 'rgba(225,27,42,0.95)';
    ctx.fillRect(x0, barY, vw * frac, barH);
    if (v && v.duration){
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(x0 + vw * frac, barY + barH/2, 6.5*SS, 0, 7); ctx.fill();
      pushHit(x0 - 8*SS, barY - 13*SS, vw + 16*SS, 30*SS,
              {type:'inseek', src: C.src, x0: x0, w: vw});
    }
  }
  ctx.textAlign = 'left';
  ctx.font = `${Math.round(21*SS)}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(238,242,246,0.95)';
  try { ctx.letterSpacing = `${21*TRACK.label*SS}px`; } catch(err){}
  ctx.fillText(C.name, x0, y0 + vh + 54*SS);
  try { ctx.letterSpacing = '0px'; } catch(err){}
  ctx.font = `italic ${Math.round(18*SS)}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(178,186,196,0.85)';
  ctx.fillText(C.label, x0, y0 + vh + 82*SS);
  ctx.textAlign = 'right';
  ctx.font = `${Math.round(17*SS)}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(170,178,188,0.7)';
  ctx.fillText('· tap to close ·', x0 + vw, y0 + vh + 54*SS);
  {
    const cxX = x0 + vw - 20 * SS, cyX = y0 + 20 * SS, rX = 11 * SS;
    const hotX = Input.hover && Math.hypot(Input.hover.x - cxX, Input.hover.y - cyX) < rX * 1.6;
    ctx.fillStyle = hotX ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.arc(cxX, cyX, rX * 1.45, 0, 7); ctx.fill();
    ctx.strokeStyle = hotX ? 'rgba(255,120,110,0.98)' : 'rgba(236,240,245,0.8)';
    ctx.lineWidth = Math.max(1.4, 2 * SS); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cxX - rX * 0.6, cyX - rX * 0.6); ctx.lineTo(cxX + rX * 0.6, cyX + rX * 0.6);
    ctx.moveTo(cxX + rX * 0.6, cyX - rX * 0.6); ctx.lineTo(cxX - rX * 0.6, cyX + rX * 0.6);
    ctx.stroke();
    pushHit(cxX - rX * 1.7, cyX - rX * 1.7, rX * 3.4, rX * 3.4, {type: 'closepage'});
  }
  ctx.restore();
}

/* THE INVITATION BELONGS TO THE PROLOGUE. It is read once, before the company
   exists; past the founding the visitor is already travelling and the line
   would only nag. It fades out over the last stretch before 1970 and is never
   drawn beyond it — so its ink is the craft era's warm ink, and nothing else.
   The attract tour itself runs the whole hall as before. */
let FOUND_X = null;
function drawAttractHint(t){
  if (state.mode !== 'attract') return;
  if (FOUND_X == null){ const fb = BEATS.find(b => b.t === 'FOUNDED'); FOUND_X = fb ? fb.x : Infinity; }
  const near = Math.max(0, Math.min(1, (FOUND_X - cam.x) / 400));
  if (near <= 0) return;
  const a = (0.35 + 0.2*Math.sin(t*1.8)) * near;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(24*SS);
  try { ctx.letterSpacing = `${24*TRACK.label*SS}px`; } catch(e){}
  ctx.fillStyle = `rgba(225,198,155,${a.toFixed(3)})`;
  // the rule owns the foot of the frame; the invitation stands above it
  ctx.fillText('Turn the wheel · travel through time', W/2, H - 78*SS);
  ctx.restore();
}

/* ---------------- UPDATE ---------------- */
function update(dt){
  const inp = Input.consume();
  state.time += dt;
  state.dt = dt;
  updateMusic(dt);
  updateCrownSpin(dt);
  updateWhoosh();
  updateFilm();

  if (inp.anyInput){
    state.idle = 0;
    if (state.mode === 'attract'){
      state.mode = 'live';
      state.attract.fade = 0;
    }
  } else {
    /* AN OPEN CASE IS BEING LOOKED AT. The tour used to resume on the plain idle
       clock while the 2023 case stood open in front of you — the room walked off
       with the lid still up. With anything open the clock runs at a quarter
       speed, and when the tour does resume it closes what was open first. */
    const reading = state.openBox || state.inspect || state.study || state.person || state.people || state.docOpen || state.albumView || state.pfmView;
    state.idle += reading ? dt * 0.25 : dt;
    if (state.mode === 'live' && state.idle > CFG.idleToAttract){
      state.mode = 'attract';
      state.study = null; state.person = null; state.people = null; state.inspect = null;
      state.pfmView = null;
      if (state.openBox) state.openBox = null;
      closeClip();
      state.attract.phase = 'cruise';
      state.focusBeat = -1; cam.zTarget = 0;
    }
  }

  if (state.mode === 'live'){
    if (state.inspect){
      // a photo is up close: the archive pill opens the magazine,
      // any other click or a strong scroll puts the photo back
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'ext'){ try { window.open(aimed.url, '_blank'); } catch(err){} }
        /* КНИГА: нажатия внутри предложения НЕ закрывают карточку — иначе
           гость не успеет ни выбрать поле, ни поставить галочку. */
        else if (aimed && aimed.type === 'bookfield') bookFocus(aimed.key);
        else if (aimed && aimed.type === 'bookconsent') BOOK.consent = !BOOK.consent;
        else if (aimed && aimed.type === 'booksend') bookSend();
        else if (aimed && aimed.type === 'bookserial') serPick().then(() => serPing(true));
        else state.inspect.closing = true;
      } else if (inp.action === true || Math.abs(inp.impulse) > 260) state.inspect.closing = true;
      cam.vel = 0;
    } else if (state.clip){
      // the speaker window: the cross, any click, or a strong scroll puts it back
      if (inp.action || Math.abs(inp.impulse) > 260) state.clip.closing = true;
      cam.vel = 0;
    } else if (state.person){
      const S = state.person;
      pageScroll(S, inp, dt);
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'closepage') S.closing = true;
        // the rail chooses: the clip loads into the page's own player, from its head
        else if (aimed && aimed.type === 'playclip') personPreview(S, aimed.i);
        else if (aimed && aimed.type === 'playpause'){
          if (S.v){ try { S.v.paused ? S.v.play() : S.v.pause(); } catch(e){} }
        }
        else if (aimed && aimed.type === 'person' && aimed.id !== S.id) openPerson(aimed.id);
        else if (aimed && aimed.type === 'voices'){ S.closing = true; if (!state.people) openPeople(); }
        else S.closing = true;
      } else if (inp.action === true) S.closing = true;   // scrolling past the top does NOT close it
      cam.vel = 0;
    } else if (state.albumView){
      const V = state.albumView;
      const A2 = ALBUM_SPRITES[V.i];
      const turn = d2 => {
        const to = Math.max(0, Math.min(A2.big.length - 1, V.page + d2));
        if (to !== V.page){ V.page = to; V.turn = d2 > 0 ? 1 : -1; }
      };
      // the wheel turns pages, one per shove
      V.wheel += inp.impulse;
      if (Math.abs(V.wheel) > 120){ turn(V.wheel > 0 ? 1 : -1); V.wheel = 0; }
      else V.wheel *= 0.86;
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'closepage'){ V.closing = true; }
        else if (aimed && aimed.type === 'albumpage'){
          if (V.page + aimed.d > A2.big.length - 1 && aimed.d > 0) V.closing = true;   // past the last page the album shuts
          else turn(aimed.d);
        } else V.closing = true;
      } else if (inp.action === true) V.closing = true;
      cam.vel = 0;
    } else if (state.people){
      const S = state.people;
      pageScroll(S, inp, dt);
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'closepage') S.closing = true;
        else if (aimed && aimed.type === 'person') openPerson(aimed.id);
        else S.closing = true;
      } else if (inp.action === true) S.closing = true;   // scrolling past the top does NOT close it
      cam.vel = 0;
    } else if (state.study){
      // the reading page: the wheel scrolls, names open their people, a click closes
      const S = state.study;
      pageScroll(S, inp, dt);
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'closepage'){
          S.closing = true;
        } else if (aimed && aimed.type === 'clip'){
          /* NO SEPARATE VIDEO PAGE. A preview used to open a player over the
             article; it plays where it hangs now, and a second tap stops it. */
          const m4 = aimed.media;
          if (S.railSrc === m4.src && S.railV && !S.railV.paused){ try { S.railV.pause(); } catch(e){} }
          else { S.railV = playPageClip(m4.src); S.railSrc = m4.src; }
        } else if (aimed && aimed.type === 'person' && PEOPLE[aimed.id]){
          openPerson(aimed.id);     // the name in the text goes to the person, not to a portrait
        } else if (aimed && aimed.type === 'link'){
          try { window.open(aimed.url, '_blank', 'noopener'); } catch(e){}   // the page stays open behind it
        } else if (aimed && aimed.type === 'redigitize'){
          S.dissing = false; S.diss = 0; S.doneAt = 0;   // the carton comes back, whole
        } else if (aimed && aimed.type === 'digitize'){
          S.dissing = true;         // the trays go to digits, in the page, where the carton is
        } else if (aimed && aimed.type === 'inclip'){
          const c3 = aimed.clip;
          let v3 = VIDEO_EL[c3.src];
          if (!v3){
            v3 = document.createElement('video');
            v3.src = c3.src; v3.preload = 'auto'; v3.playsInline = true;
            VIDEO_EL[c3.src] = v3;
          }
          if (S.railSrc === c3.src && S.railV && !S.railV.paused) S.railV.pause();
          else {
            if (S.railV && S.railV !== v3) try { S.railV.pause(); } catch(e){}
            v3.muted = SOUND.off;
            S.railV = v3; S.railSrc = c3.src;
            v3.play().catch(()=>{});
          }
        } else S.closing = true;
      } else if (inp.action === true) S.closing = true;   // a key closes it; scrolling past the top does NOT
      cam.vel = 0;
    } else {
      if (Math.abs(inp.impulse) > 24) startFilm();   // the wheel starts the show
      cam.vel += inp.impulse;
    }
    if (inp.action && state.pfmView && !state.pfmView.closing){
      state.pfmView.closing = true;
    } else if (inp.action && state.openBox && !state.openBox.closing){
      state.openBox.closing = true;
    } else if (inp.action && !state.inspect && !state.study && !state.person && !state.people && !state.openBox){
      const aimed = (typeof inp.action === 'object') ? hitAt(inp.action.x, inp.action.y) : null;
      if (aimed && aimed.type === 'doc'){
        openDoc();
      } else if (aimed && aimed.type === 'photo'){
        if (aimed.offer){ bookInit(); bookReset(); }
        /* offer НАДО ПЕРЕНЕСТИ ЯВНО. Оверлей собирается здесь по полям, а не
           копированием payload, — и флаг «это книга» терялся по дороге: по
           нажатию на стопку открывалась голая карточка без полосы сканирования,
           хотя по ?book=1 всё работало (Эльдар, 2026-09-23). */
        state.inspect = {sp: aimed.sp, wx: aimed.wx, cy: aimed.cy, z: aimed.z, w: aimed.w,
                         cap: aimed.cap, link: aimed.link, beat: aimed.beat,
                         offer: !!aimed.offer, table: false, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'photoTable'){
        state.inspect = {sp: aimed.sp, wx: aimed.wx, lz: aimed.lz, w: aimed.w,
                         cap: aimed.cap, beat: aimed.beat, table: true, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'van8'){
        turnVan8();
      } else if (aimed && aimed.type === 'pfmview'){
        state.pfmView = {beat: aimed.beat, amt: 0, closing: false};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'album'){
        openAlbumView(aimed.beat);      // it opens properly now, not ajar on the counter
        cam.vel = 0;
      } else if (aimed && aimed.type === 'focus'){
        if (state.focusBeat === aimed.beat){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
        else { state.focusBeat = aimed.beat; state.focusAnchor = aimed.anchor != null ? aimed.anchor : null;
               cam.zTarget = CFG.focusCamZ; cam.vel = 0;
               /* a pedestal that has a page behind it: the dolly runs, then the
                  page opens with the exhibit set into the article */
               /* А ЕСЛИ У ЭКСПОНАТА СВОЯ СТРАНИЦА — открывается она, а не
                  страница ближайшего года: пролёт Digital Revolution стоит в
                  106 единицах от середины между 2007 и 2009, и его страница не
                  может зависеть от того, кто из них оказался ближе. */
               if (aimed.page){
                 const pg = aimed.page;
                 setTimeout(() => { if (!state.study) openStudy(pg); }, 700);
               } else {
                 const fb = BEATS[aimed.beat];
                 if (fb && fb.ped && (STUDY_MORE[fb.x] || STUDY_MEDIA[fb.x])){
                   const bi = aimed.beat;
                   setTimeout(() => { if (state.focusBeat === bi && !state.study) openStudy(bi); }, 700);
                 }
               }
             }
      } else if (aimed && aimed.type === 'openbox'){
        /* ONE DOOR. The carton used to open an overlay of its own; it is a
           figure in the crossover's page now, so it opens that page. */
        const bi2 = BEATS.findIndex(bb => bb.t === 'THE CROSSOVER');
        if (bi2 >= 0) openStudy(bi2); else { state.openBox = {amt: 0, closing: false}; }
        cam.vel = 0;
      } else if (aimed && aimed.type === 'study'){
        openStudy(aimed.beat);
      } else if (aimed && aimed.type === 'welcomevid'){
        const v = WELCOME_TV.v;
        if (v){
          if (v.muted){
            startFilm();   // the first tap starts the film from the top, sound and all
          }
          else if (WELCOME_TV.userPaused){ WELCOME_TV.userPaused = false; v.play().catch(()=>{}); }
          else { WELCOME_TV.userPaused = true; v.pause(); }
        }
      } else {
        // empty space is empty: a click there only releases a focus,
        // it never opens anything the visitor didn't aim at
        if (state.focusBeat >= 0){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
      }
    }
    if (state.focusBeat >= 0){
      if (Math.abs(inp.impulse) > 250){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
      else {
        // glued to what was clicked while focused
        const b = BEATS[state.focusBeat];
        const ax = state.focusAnchor != null ? state.focusAnchor : b.x;
        cam.x += (ax - cam.x) * Math.min(1, dt*4);
        cam.vel = 0;
      }
    }
  } else {
    // attract autopilot: it stops only at real compositions — landmark
    // stands, recreations, the factory, the stage — and it brakes so the
    // apex lands exactly at screen center, never short, never past
    const A = state.attract;
    if (A.phase === 'cruise'){
      if (A.stopX == null){
        let best = null;
        for (const sx of ATTRACT_STOPS) if (sx > cam.x + 60 && (best == null || sx < best)) best = sx;
        A.stopX = best != null ? best : WORLD_END + 9999;
      }
      const d = A.stopX - cam.x;
      const target = Math.min(CFG.attractCruise, Math.max(70, d * 1.15));
      cam.vel += (target - cam.vel) * Math.min(1, dt*4);
      if (d < 6){
        cam.x = A.stopX; cam.vel = 0;
        A.atFinale = Math.abs(A.stopX - FIN_X) < 10;
        A.phase = 'dwell'; A.dwell = A.atFinale ? -2.4 : 0; A.stopX = null;
      }
      if (cam.x > WORLD_END + 220) A.phase = 'fadeout';
    } else if (A.phase === 'dwell'){
      cam.vel *= Math.pow(0.001, dt);
      A.dwell += dt;
      if (A.dwell > CFG.attractDwell) A.phase = A.atFinale ? 'fadeout' : 'cruise';   // the story ends on the packshot, then loops
    } else if (A.phase === 'fadeout'){
      cam.vel *= Math.pow(0.01, dt);
      A.fade = Math.min(1, A.fade + dt*1.2);
      /* THE TOUR ONLY EVER RAN ONCE. `atFinale` is raised when the cruise
         reaches the packshot, so that the dwell there ends the story in a fade
         instead of cruising off the end of the hall — but it was never lowered
         again. Coming back to the title with it still raised, the very next
         dwell read "you are at the finale" and faded out again: the hall sat
         on its opening close-up and blinked to black every seven seconds, for
         good. It is a new tour, so it is not at the finale. */
      if (A.fade >= 1){ cam.x = INTRO_X; cam.vel = 0; cam.z = 430; cam.zTarget = 430;
                        state.introHold = true; A.phase = 'fadein'; A.beatIdx = -1;
                        A.atFinale = false; A.stopX = null; }
    } else if (A.phase === 'fadein'){
      A.fade = Math.max(0, A.fade - dt*1.2);
      if (A.fade <= 0){ A.phase = 'dwell'; A.dwell = -2.2; }
    }
  }

  // physics
  cam.vel = Math.max(-CFG.maxVel, Math.min(CFG.maxVel, cam.vel));
  cam.vel *= Math.pow(Math.E, -CFG.friction * dt);
  cam.x += cam.vel * dt;

  // ---- the yard video splice ----
  const SE = spliceEdges();
  if (state.splice){
    const S = state.splice;
    S.t += dt;
    cam.vel = 0;
    if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
      cam.x = S.from;
      if (SEAM_VIDEO.ended || S.skip) S.done = true;
    } else {
      // placeholder until the clip exists: a breath of light, and we are there
      cam.x = S.t < SPLICE.dur/2 ? S.from : S.to;
      if (S.t >= SPLICE.dur || S.skip) S.done = true;
    }
    if (S.done){
      cam.x = S.to + S.dir * 8;
      cam.vel = S.dir * 260;
      state.spliceSide = S.dir > 0 ? 'R' : 'L';
      state.splice = null;
    }
  } else {
    if (cam.x < SE.inL - 2){ state.spliceSide = 'L'; state.spliceArm = 0; }
    else if (cam.x > SE.outR + 2){ state.spliceSide = 'R'; state.spliceArm = 0; }
    else {
      // the rail ends here: hold the composition — this is the clip's first frame
      const dir = state.spliceSide === 'L' ? 1 : -1;
      const from = dir > 0 ? SE.inL : SE.outR;
      cam.x = from; cam.vel = 0;
      state.spliceArm = (state.spliceArm || 0) + dt;
      const push = dir > 0 ? inp.impulse > 140 : inp.impulse < -140;
      const go = state.mode === 'live'
        ? (push && state.spliceArm > 0.3)
        : state.spliceArm > 3.0;
      if (go){
        state.splice = {dir, t: 0, from, to: dir > 0 ? SE.outR : SE.inL};
        if (SEAM_VIDEO){ try { SEAM_VIDEO.currentTime = 0; SEAM_VIDEO.play(); } catch(err){} }
      }
    }
  }
  if (state.splice && inp.action) state.splice.skip = true;

  // soft bounds
  // a click on the rule glides there; any real input cancels the trip
  if (state.glide != null){
    if (Math.abs(inp.impulse) > 40) state.glide = null;
    else {
      cam.x += (state.glide - cam.x) * Math.min(1, dt * 4.5);
      cam.vel = 0;
      if (Math.abs(state.glide - cam.x) < 8){ cam.x = state.glide; state.glide = null; }
    }
  }
  if (cam.x < INTRO_X - 1000){ cam.x = INTRO_X - 1000; cam.vel = Math.max(0, cam.vel); }
  if (cam.x > WORLD_END + 300){ cam.x = WORLD_END + 300; cam.vel = Math.min(0, cam.vel); }

  // beat magnetism when slow (live mode, not focused)
  if (state.mode === 'live' && state.focusBeat < 0 && Math.abs(cam.vel) < CFG.magnetVel){
    const nb = nearestBeat(cam.x);
    if (nb.d < CFG.magnetDist){
      cam.vel += (BEATS[nb.i].x - cam.x) * CFG.magnetK * dt * 0.6;
    }
  }

  // rest detection (for description reveal)
  const nb = nearestBeat(cam.x);
  if (nb.d < 120 && Math.abs(cam.vel) < 30){
    if (state.restBeat === nb.i) state.restTime += dt;
    else { state.restBeat = nb.i; state.restTime = 0; }
  } else { state.restBeat = -1; state.restTime = 0; }

  updateVan8(dt);   // the eight-lab street's own traffic, on its own clock


  // the opening close-up releases on the first real movement
  if (state.introHold && (Math.abs(cam.vel) > 60 || Math.abs(cam.x - INTRO_X) > 350)){
    state.introHold = false;
    cam.zTarget = 0;
  }
  state.introFade += ((state.introHold ? 1 : 0) - state.introFade) * Math.min(1, dt*2.2);

  // the finale packshot: coming to rest on the product still life pulls the
  // camera in, cinema-tight; leaving lets the hall back in
  if (!state.study && !state.inspect && state.focusBeat < 0 && !state.introHold){
    if (!state.finHold && cam.x > FIN_X - 170 && cam.vel > -40){ state.finHold = true; cam.zTarget = 430; }
    else if (state.finHold && (cam.x < FIN_X - 300 || cam.vel < -60)){ state.finHold = false; if (!state.introHold) cam.zTarget = 0; }
    if (state.finHold){
      // one ending only: the camera glues onto the packshot — but a pull
      // backward always breaks the hold, no trap
      cam.x += (FIN_X - cam.x) * Math.min(1, dt*2.5);
      if (cam.vel > 0) cam.vel *= Math.pow(0.005, dt);
    }
  } else if (state.finHold && state.focusBeat >= 0){ state.finHold = false; }
  state.finFade = (state.finFade || 0) + ((state.finHold ? 1 : 0) - (state.finFade || 0)) * Math.min(1, dt*2.2);

  // dolly
  cam.z += (cam.zTarget - cam.z) * Math.min(1, dt*3);
}

/* ---------------- FRAME ---------------- */
/* These three live at the top level because frame() calls two of them and a
   function declared inside boot() is invisible from outside it. */
/* The showroom is the last stretch, and it starts AT the 2022 portal rather
   than after it: SHOW_L was REC4_R + 60, which left the exhibit that opens the
   stretch — the scanner on its plinth and the panel behind it — standing outside
   the room it opens, and put the change of language at an arbitrary coordinate
   860 units past the doorway instead of on it. */
/* THE SHOWROOM BEGINS AFTER THE HALL. It started at the 2022 portal, so the
   walnut soffit ran over the crossover and the doorway too. Eldar (2026-09-10):
   the wall of 2019 continues to the doorway's column and the wood is the
   finale's alone — from the doorway's far column to the end. */
const SHOW_L = HALL_FRAME_R + 60, SHOW_R = WORLD_END + 300;
/* WHERE THE CEILING IS DRAWN FROM, WHICH IS NOT WHERE THE ROOM BEGINS. The
   timber soffit and the lit coffer both started at SHOW_L — a point taken sixty
   units past the doorway's far column, on purpose, so the column would cover
   the end of the run. But the column stands at 992 and the run at 1394, and
   two planes do not hold a joint: walking up to the finale the column slid off
   the end of the wood and you saw where the board began, with the ceiling dark
   to the left of it (Eldar, 2026-09-22: «мы не должны видеть этот левый край
   доски, и освещение должно продолжаться налево, за колонну»). Both now begin
   six hundred units INSIDE the doorway, where the hall's own plate — painted
   after them — covers everything that is not behind the column. */
const SHOW_DRAW_L = HALL_FRAME_R - 600;
/* THE TIMBER BAND'S SCREEN EXTENT. The horizontal walnut strip that runs the
   length of the showroom — the years in this stretch are hung on it rather than
   merely set in front of it, so they need its actual screen coordinates. One
   formula, living beside the thing it measures, so the two cannot drift apart
   the way the year and its plate did. */
function timberBand(){
  if (cam.x < SHOW_L - 2600 || cam.x > SHOW_R + 2600) return null;
  const kk = k((SEGMENTS[3].z0 || 1400) - 6);
  return {yT: py(-330, kk), yB: py(-90, kk)};
}
function drawShowroom(t){
  if (cam.x < SHOW_L - 2600 || cam.x > SHOW_R + 2600) return;
  const seg = SEGMENTS[3], kk = k(seg.z0 - 6);
  /* THE RUN IS CUT AT ITS FIRST DOWNLIGHT. Left to start at SHOW_L it showed up
     two bays early as a brown block hanging in the air with nothing holding it.
     The first light recessed into it is the landmark: the timber may reach that
     fitting and no further. Both are at the beam's own depth, so the cut cannot
     drift away from the lamp it is measured against. */
  /* the run begins AT the doorway's far column now (SHOW_L is that column):
     the column covers its end, so there is nothing hanging in the air, and the
     wood and its downlights read as one ceiling from the door onward (Eldar) */
  const x0 = px(SHOW_DRAW_L, kk) - 12 * SS;
  const x1 = px(SHOW_R, kk);
  if (x1 < -200 || x0 > W + 200) return;
  ctx.save();
  // the ribbon: a soffit of walnut, turned down out of the ceiling
  /* Up where a ceiling border belongs. It was sitting at exactly the height
     the year numerals occupy, so the years were printed across a timber band —
     which is not a thing anyone does, and read as a collision because it was
     one. Nothing is set on the wood now. */
  const yT = py(-330, kk), yB = py(-90, kk), turn = 190 * kk * SS;
  const wg = ctx.createLinearGradient(0, yT, 0, yB);
  wg.addColorStop(0, '#6e5942'); wg.addColorStop(0.34, '#93775a');
  wg.addColorStop(0.76, '#7b6247'); wg.addColorStop(1, '#63503b');
  ctx.fillStyle = wg;
  /* THE ROUND GOES ON THE FAR END, NOT THE NEAR ONE. A quarter-round where the
     run BEGINS reads, from the bay before it, as a brown lozenge floating with
     nothing holding it — and it cannot be tucked behind the 2022 panel, because
     the panel is at z 1000 and the beam at 1394, so the two slide apart and the
     end pokes out to the left of it. So the near end is a return — a clean cut
     with darker end grain — and the round belongs at the far end, where the run
     actually finishes and there is nothing beyond it to explain. */
  const xL = Math.max(-40, x0);
  const beam = new Path2D();
  beam.moveTo(xL, yT);
  beam.lineTo(x1, yT);
  beam.lineTo(x1, yB - turn * 0.55);
  beam.quadraticCurveTo(x1, yB, x1 - turn, yB);
  beam.lineTo(xL, yB);
  beam.closePath();
  ctx.fill(beam);
  // the grain, and the shadow it drops on the wall below
  ctx.save();
  ctx.clip(beam);
  /* the grain lines are one device pixel each and land on whole pixels: at
     1.6 px on fractional rows they were re-sampled every frame and shimmered
     as a stack of flickering stripes whenever the camera moved */
  for (let i = 0; i < 26; i++){
    const yy = Math.round(yT + (yB - yT) * (i / 26));
    ctx.fillStyle = `rgba(${i % 3 ? 62 : 206},${i % 3 ? 48 : 182},${i % 3 ? 34 : 148},0.045)`;
    ctx.fillRect(x0, yy, x1 - x0, 1);
  }
  ctx.restore();
  /* the return at the near end: end grain, then the shadow it throws on the wall
     beside it, so the run begins somewhere instead of simply appearing */
  if (x0 > -40){
    const eg = ctx.createLinearGradient(x0, 0, x0 + 9 * kk * SS, 0);
    eg.addColorStop(0, '#4a3b2a'); eg.addColorStop(1, '#6d5940');
    ctx.fillStyle = eg;
    ctx.fillRect(x0, yT, 9 * kk * SS, yB - yT);
    const sg = ctx.createLinearGradient(x0 - 26 * kk * SS, 0, x0, 0);
    sg.addColorStop(0, 'rgba(30,22,14,0)'); sg.addColorStop(1, 'rgba(30,22,14,0.20)');
    ctx.fillStyle = sg;
    ctx.fillRect(x0 - 26 * kk * SS, yT, 26 * kk * SS, yB - yT);
  }
  const sh = ctx.createLinearGradient(0, yB, 0, yB + 70 * kk * SS);
  sh.addColorStop(0, 'rgba(30,22,14,0.22)'); sh.addColorStop(1, 'rgba(30,22,14,0)');
  ctx.fillStyle = sh;
  /* the shadow stops where the wood does: past the quarter-round the beam's
     underside lifts away — and the tail dies in many small steps that read as
     one smooth fade, not a two-step drop */
  ctx.fillRect(Math.max(0, x0), yB, (x1 - turn) - Math.max(0, x0), 70 * kk * SS);
  ctx.save();
  const NT = 8, tailW = turn * 0.92;
  for (let i = 0; i < NT; i++){
    ctx.globalAlpha = Math.pow(1 - (i + 0.5) / NT, 1.4);
    ctx.fillRect(x1 - turn + tailW * i / NT, yB, tailW / NT + 1, 70 * kk * SS);
  }
  ctx.restore();
  // downlights set into it, and the pools they throw
  ctx.globalCompositeOperation = 'lighter';
  for (let wx = SHOW_L + 330; wx < SHOW_R; wx += 660){
    const lx = px(wx, kk);
    if (lx < -260 || lx > W + 260) continue;
    ctx.fillStyle = 'rgba(255,236,196,0.85)';
    ctx.beginPath(); ctx.ellipse(lx, yB - 9 * kk * SS, 13 * kk * SS, 5 * kk * SS, 0, 0, 7); ctx.fill();
    const yP = py(210, kk);              // dies out high on the wall, not on the counter
    const pool = ctx.createLinearGradient(0, yB, 0, yP);
    pool.addColorStop(0, 'rgba(255,228,180,0.13)');
    pool.addColorStop(0.5, 'rgba(255,224,172,0.028)');
    pool.addColorStop(1, 'rgba(255,220,166,0)');
    ctx.fillStyle = pool;
    ctx.beginPath();                        // soft-shouldered, not a triangle
    ctx.moveTo(lx - 22 * kk * SS, yB);
    ctx.bezierCurveTo(lx - 40 * kk * SS, yB + (yP - yB) * 0.4,
                      lx - 96 * kk * SS, yB + (yP - yB) * 0.7, lx - 118 * kk * SS, yP);
    ctx.lineTo(lx + 118 * kk * SS, yP);
    ctx.bezierCurveTo(lx + 96 * kk * SS, yB + (yP - yB) * 0.7,
                      lx + 40 * kk * SS, yB + (yP - yB) * 0.4, lx + 22 * kk * SS, yB);
    ctx.closePath(); ctx.fill();
    drawGlow('255,232,190', lx, py(30, kk), 92 * kk * SS, 0.045);
  }
  // the ring, with the mark inside it — the one thing in the room that is lit
  /* NO PLATE BEHIND THE YEAR. The room this is drawn from puts its words on
     white plates standing a little proud of the wall, and I built that twice.
     Both times it read as an appliqué, and the reason is structural rather than
     cosmetic: the year is set on the shared type plane at 680 so that type is
     the same size in every era, while a plate standing on this wall belongs at
     1400. Those two depths separate by as much as 220 px across the span a beat
     is on screen, and no plate is that wide — so the first version slid out from
     under its own year, and the second, pinned to the type to stop the sliding,
     ended up 720 units clear of the wall: a sheet of paper hanging in the room,
     which is a shape with no explanation. Type at a fixed apparent size and
     architecture at the wall cannot be married. The year sits on the wall, the
     way it does in every other era. */

  /* THE CEILING. These are chandeliers — big lit hoops hanging in a white
     coffer overhead — and I had them as pinpricks sitting on the plank, which
     is neither their size nor their place. They belong on a plane of their own,
     nearer than the wall, in a recess that is lighter than the ceiling around
     it, and they are metres across: two or three hoops per fitting, hung at
     different drops so they interlock when you look up through them. */
  const kC = k(520);
  const cyR = py(-262, kC), recH = 250 * kC * SS;
  const rg = ctx.createLinearGradient(0, cyR - recH * 0.7, 0, cyR + recH * 0.6);
  rg.addColorStop(0, 'rgba(255,252,246,0.55)');
  rg.addColorStop(0.55, 'rgba(250,247,241,0.30)');
  rg.addColorStop(1, 'rgba(240,236,229,0)');
  ctx.fillStyle = rg;
  /* THE CEILING BEGINS WITH THE BEAM. The lit coffer took its left edge from
     SHOW_L on its own near plane (520) while the timber starts at SHOW_L + 330
     on the wall's (1394) — two different screen x's for what should be one
     edge, so the new era's ceiling opened to the right of the run of walnut and
     the join showed. It starts at the beam's own end now. */
  const recL = Math.max(0, x0);
  ctx.fillRect(recL, cyR - recH * 0.7,
               Math.min(W, px(SHOW_R, kC)) - recL, recH * 1.3);
  for (const [gx, cl] of [[-1180, [[0, 0, 250], [190, 62, 178]]],
                          [560,   [[0, 0, 214], [162, -46, 150], [292, 40, 112]]],
                          [2140,  [[0, 0, 268], [206, 54, 190]]]]){
    const cx0 = px((SHOW_L + SHOW_R) / 2 + gx, kC);
    if (cx0 < -900 || cx0 > W + 900) continue;
    for (const [ox, oy, r0] of cl){
      const rr = r0 * kC * SS, rx = cx0 + ox * kC * SS, ry = cyR + oy * kC * SS;
      // the drop it hangs on
      ctx.strokeStyle = 'rgba(228,224,216,0.5)';
      ctx.lineWidth = Math.max(1, 1.6 * kC * SS);
      ctx.beginPath(); ctx.moveTo(rx, cyR - recH * 0.66); ctx.lineTo(rx, ry); ctx.stroke();
      drawGlow('255,247,230', rx, ry, rr * 1.5, 0.13);
      ctx.strokeStyle = 'rgba(255,251,242,0.95)';
      ctx.lineWidth = Math.max(1.6, 9 * kC * SS);
      ctx.beginPath(); ctx.ellipse(rx, ry, rr, rr * 0.235, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,240,214,0.45)';
      ctx.lineWidth = Math.max(1, 3 * kC * SS);
      ctx.beginPath(); ctx.ellipse(rx, ry + 3.5 * kC * SS, rr, rr * 0.235, 0, 0, 7); ctx.stroke();
    }
  }
  /* THE LONE G IS GONE. A monogram was cut into the showroom wall here — an
     arc and a bar, which is a Glidewell G — and it hung at world y 52, high
     enough to land on the LED wall behind it. Read as a stray white letter
     floating on the video from 2022 onward. The wall carries its own mark on
     the lit panel; it does not need a second one drawn over a screen. */
  ctx.restore();
}

/* CONCEALED LIGHT. The furniture in that room is lit from inside itself: a
   recessed strip in the plinth washing the floor, a glow under the lip of the
   worktop, and the logo panel edge-lit so its border burns white while its face
   stays matte. There is not one visible fitting anywhere on it. This is painted
   after the counter, because it is light coming OUT of the counter. */
function drawShowroomLight(t){
  /* NOTHING IS PAINTED OVER THE COUNTER ANY MORE. This used to lay a diode
     glow under the worktop lip, a bright line in the toe recess and a wash of
     light across the floor — all of it invented, and all of it only on the last
     stretch, so the same furniture stood unlit for the eleven thousand units
     before it. Eldar's counter render carries both lines in the photograph
     itself ("не надо ничего рисовать дополнительно поверх", 2026-09-21), and
     the floor answers on its own: drawFloorSheen folds the painted frame down
     across the floor line, so a counter that glows is reflected glowing. The
     function is kept as the one place that would own showroom-wide light if it
     is ever wanted again. */
}

/* The polish. A floor like that one is half of every photograph taken in the
   room, and ours was a flat gradient throwing that half away. The frame as
   painted so far is folded down across the floor line and faded out — so the
   reflection is of whatever is actually standing there, and stays true by
   construction rather than by being drawn twice. */
let SHEEN = null;
/* the reflection's fall-off, as a mask on the copied band: full at the fold
   (the band's bottom row), gone at the far edge, falling as (1-u)^2 */
function sheenFade(gs, cw, ch, peak){
  const g = gs.createLinearGradient(0, ch, 0, 0);
  for (const u of [0, 0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 1]){
    g.addColorStop(u, `rgba(0,0,0,${(peak * (1 - u) * (1 - u)).toFixed(4)})`);
  }
  gs.globalCompositeOperation = 'destination-in';
  gs.fillStyle = g;
  gs.fillRect(0, 0, cw, ch);
  gs.globalCompositeOperation = 'source-over';
}
function drawFloorSheen(){
  if (cam.x < SHOW_L - 2400 || cam.x > SHOW_R + 2400) return;
  /* A REFLECTION IS BOUNDED BY THE FLOOR IT LIES ON. This was clipped to
     "everything below the wall's foot", which on screen means the counter as
     well — so a whole upside-down portrait ended up on the front of a cabinet,
     and the fade that softened it read as fog over the furniture. Mixed with a
     red runner it became a smear, which is why the runner had to go.
     What you can actually see of this floor is the strip between the foot of
     the wall and the back of the counter: a few dozen pixels. The reflection is
     that strip and no more — it takes only the band of wall directly above it,
     the same depth it is itself, and it cannot reach the furniture because it
     is not drawn where the furniture is. */
  const yTop = py(1080, k((SEGMENTS[3].z0 || 1400) - 8));
  const yBot = py(1080, k(CFG.benchDepth));
  const band = yBot - yTop;
  if (band < 3) return;
  /* THE REFLECTION SITS ON THE FLOOR'S OWN EDGES. Its sides used to be measured
     at the WALL's depth up top and the counter's depth below, while the floor
     beneath draws its zone edges from the counter's depth down to the near
     plane — two different diagonals for one boundary, so a wedge of unreflected
     floor opened at the portal and slid about as the camera moved. The sides
     are now sampled ON the floor's line, at the two heights the band spans. */
  const kSeam = k(CFG.benchDepth), kNear = k(-40);
  const onFloorEdge = (wx, y) => {
    const xT = px(wx, kSeam), xB = px(wx, kNear);
    const t = (y - yTop) / Math.max(1, H - yTop);
    return xT + (xB - xT) * t;
  };
  const a0 = onFloorEdge(SHOW_L, yTop), a1 = onFloorEdge(SHOW_R, yTop);
  const b0 = onFloorEdge(SHOW_L, yBot), b1 = onFloorEdge(SHOW_R, yBot);
  if (Math.max(a1, b1) < 0 || Math.min(a0, b0) > W) return;
  /* THE FLOOR BEGINS WHERE THE WALL ENDS — AND THE 2022 BAY IS NOT THE WALL.
     The fold of this reflection is the era wall's foot, one line across the
     frame. The portal stands four hundred units proud of that wall, so its
     picture runs on below that line, down to where the counter cuts it — and
     the mirrored floor was painted straight over the bottom of the picture: a
     reflection climbing a wall, exactly as it looked. Inside the portal's span
     the fold drops to the picture's own bottom edge, and that strip gets its
     own mirror, of the bay's own foot. */
  const kc = k(992), cwCol = 120 * kc * SS;
  const nx0 = px(REC4_L, kc) - cwCol/2, nx1 = px(REC4_R, kc) + cwCol/2;
  const yBay = Math.min(yBot, py(CFG.benchY + 240, k(CFG.benchDepth)));
  const notch = (nx1 > 0 && nx0 < W && yBay > yTop + 2) ? {x0: nx0, x1: nx1, y: yBay} : null;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(a0, yTop); ctx.lineTo(a1, yTop); ctx.lineTo(b1, yBot); ctx.lineTo(b0, yBot);
  ctx.closePath();
  if (notch) ctx.rect(notch.x0, yTop, notch.x1 - notch.x0, notch.y - yTop);   // cut out of the clip
  /* THE DOORWAY INTO THE HALL IS NOT MIRRORED. The room's own plate carries its
     floor and reflections; folding the wall band over it laid a pale fog across
     the marble. So the opening between the two uprights is cut out of the clip
     — and only the opening: the shine still runs under the 2022 portal, the
     crossover and TODAY exactly as before. (It was switched off for the whole
     white section for a while; that was a guard 5500 units wide, not a door.) */
  if (hallReady()){
    const hx0 = px(HALL_FRAME_L, kc) + cwCol/2, hx1 = px(HALL_FRAME_R, kc) - cwCol/2;
    const cutL = Math.max(hx0, Math.min(a0, b0)), cutR = Math.min(hx1, Math.max(a1, b1));
    if (cutR > cutL) ctx.rect(cutL, yTop, cutR - cutL, band);
  }
  ctx.clip('evenodd');
  const sx0 = Math.max(0, Math.min(a0, b0)), sx1 = Math.min(W, Math.max(a1, b1));
  /* A REFLECTION DIES WITH DISTANCE FROM THE FOLD. Mirrored at one flat alpha
     the whole band comes back — a whole upside-down portrait lying on the floor
     like a dropped photograph, which is not what a floor does. Stone returns
     the most light where the eye grazes it, at the fold, and almost none as the
     angle opens toward you. So it is laid in slices, each taking its own share,
     and it is gone within the near half of the band. */
  if (sx1 - sx0 > 2 && yTop - band > 0){
    const N = 14;
    /* ONE READ, NOT FOURTEEN. Each drawImage of the canvas into itself forces
       the compositor to resolve and copy the whole backing store; fourteen of
       them per frame was the stall you could feel in the white era. The band
       above the fold is copied ONCE into a scratch canvas, and the slices are
       then cut from that copy — GPU to GPU. */
    const cw = Math.max(2, Math.ceil(sx1 - sx0)), ch = Math.max(2, Math.ceil(band));
    /* the scratch is sized to the FRAME, not to this moment's visible span:
       the span changes with every turn of the wheel, and a per-frame canvas
       allocation is a garbage machine (620 of them in one pass of the hall) */
    const capW = Math.max(2, Math.ceil(W)), capH = ((ch + 31) >> 5) << 5;
    if (!SHEEN || SHEEN.width < capW || SHEEN.height < capH){
      SHEEN = document.createElement('canvas');
      SHEEN.width = capW; SHEEN.height = Math.max(capH, 32);
    }
    const gs = SHEEN.getContext('2d');
    gs.clearRect(0, 0, cw, ch);
    gs.drawImage(ctx.canvas, sx0, yTop - band, cw, ch, 0, 0, cw, ch);
    /* ONE FADE, NOT FOURTEEN. The band used to be laid in slices, each at its
       own alpha — and the seams between them were a stack of horizontal lines
       that moved with the camera and flickered. The fade is a gradient mask on
       the copy now, the same quadratic law, and the whole band is laid once. */
    sheenFade(gs, cw, ch, 0.34);
    ctx.scale(1, -1);
    ctx.drawImage(SHEEN, 0, 0, cw, ch, sx0, -(yTop + ch), cw, ch);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  }
  // the polish itself: a dark stone floor takes a sheen along the grazing angle
  const gl = ctx.createLinearGradient(0, yTop, 0, yBot);
  gl.addColorStop(0, 'rgba(226,229,233,0.34)');
  gl.addColorStop(0.5, 'rgba(196,200,206,0.16)');
  gl.addColorStop(1, 'rgba(150,155,163,0.30)');
  ctx.fillStyle = gl;
  ctx.fillRect(sx0, yTop, sx1 - sx0, band);
  ctx.restore();
  // the strip under the bay: its own fold, at the bay's own foot
  if (notch && SHEEN){
    const x0 = Math.max(0, notch.x0), x1 = Math.min(W, notch.x1);
    const band2 = yBot - notch.y;
    if (x1 - x0 > 2 && band2 > 2 && notch.y - band2 > 0){
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, notch.y, x1 - x0, band2); ctx.clip();
      const cw2 = Math.ceil(x1 - x0), ch2 = Math.ceil(band2);
      const gs = SHEEN.getContext('2d');
      gs.clearRect(0, 0, cw2, ch2);
      gs.drawImage(ctx.canvas, x0, notch.y - band2, cw2, ch2, 0, 0, cw2, ch2);
      sheenFade(gs, cw2, ch2, 0.34);
      ctx.scale(1, -1);
      ctx.drawImage(SHEEN, 0, 0, cw2, ch2, x0, -(notch.y + ch2), cw2, ch2);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      const g2 = ctx.createLinearGradient(0, notch.y, 0, yBot);
      g2.addColorStop(0, 'rgba(226,229,233,0.34)');
      g2.addColorStop(0.5, 'rgba(196,200,206,0.16)');
      g2.addColorStop(1, 'rgba(150,155,163,0.30)');
      ctx.fillStyle = g2;
      ctx.fillRect(x0, notch.y, x1 - x0, band2);
      ctx.restore();
    }
  }
}

/* CONTAINMENT. Two rules the hall is meant to keep and which no amount of
   looking will reliably catch: nothing may hang off the edge of the frame at
   the moment it is the subject, and no two things may claim the same pixels to
   be clicked on. Every interactive element already registers its screen
   rectangle through pushHit, so both are measurable. This walks the camera to
   each beat in turn, renders one frame, and reads the rectangles back. */
function auditFrames(){
  if (!W || !H){ console.warn('FRAME AUDIT: no viewport'); return; }
  const keep = {x: cam.x, vel: cam.vel, z: cam.z, mode: state.mode};
  const spill = [], clash = [];
  const area = r => Math.max(0, r.w) * Math.max(0, r.h);
  const bi = new Map(BEATS.map((b, i) => [b, i]));
  for (const b of BEATS){
    cam.x = b.x; cam.vel = 0;
    frame();
    /* Only the things that belong to THIS beat. Its neighbours are meant to run
       off the sides — that is what a hall looks like — so judging them would
       drown the real findings. */
    const mine = h => {
      const p = h.p || {};
      if (p.beat != null) return p.beat === bi.get(b);
      const wx = p.anchor != null ? p.anchor : p.wx;
      return wx != null && Math.abs(wx - b.x) < 460;
    };
    const hs = HITS.filter(h => area(h) > 400 && mine(h) && !(h.p && h.p.edgeOK));
    for (const h of hs){
      const over = Math.max(-h.x, -h.y, (h.x + h.w) - W, (h.y + h.h) - H);
      const frac = over / Math.max(1, Math.min(h.w, h.h));
      if (over > 12 && frac > 0.28)
        spill.push(`${b.y} \u00b7 ${(h.p && h.p.type) || '?'} \u2014 ${over | 0}px past the edge ` +
                   `(${(frac * 100) | 0}% of it)`);
    }
    for (let i = 0; i < hs.length; i++)
      for (let j = i + 1; j < hs.length; j++){
        const a = hs[i], c = hs[j];
        const ox = Math.min(a.x + a.w, c.x + c.w) - Math.max(a.x, c.x);
        const oy = Math.min(a.y + a.h, c.y + c.h) - Math.max(a.y, c.y);
        if (ox <= 0 || oy <= 0) continue;
        const f = (ox * oy) / Math.min(area(a), area(c));
        if (f > 0.45)
          clash.push(`${b.y} \u00b7 ${(a.p && a.p.type) || '?'} and ${(c.p && c.p.type) || '?'} ` +
                     `share ${(f * 100) | 0}% of the smaller target`);
      }
  }
  cam.x = keep.x; cam.vel = keep.vel; cam.z = keep.z; state.mode = keep.mode;
  const uniq = a => [...new Set(a)];
  if (spill.length) console.error('FRAME AUDIT — off the edge:\n  ' + uniq(spill).join('\n  '));
  if (clash.length) console.error('FRAME AUDIT — overlapping targets:\n  ' + uniq(clash).join('\n  '));
  if (!spill.length && !clash.length) console.log('FRAME AUDIT: clean — nothing off the edge, no target claimed twice');
}

function frame(){
  const t = state.time;
  HITS = [];
  bloomCapture();   // the spill, taken off the frame that is still on the glass
  /* THE CLEAN SLATE. Canvas state survives from one frame to the next, so a
     property set anywhere in seven thousand lines and not put back does not
     corrupt one drawing — it corrupts every drawing made after it, for the rest
     of the session, and the symptom shows up nowhere near the cause. A round
     line cap set once in a robot arm gave the century rule round ends forever.
     Resetting to a known state here makes that whole class of fault impossible
     rather than merely absent, which is the only way it stays fixed. */
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.lineWidth = 1;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  ctx.filter = 'none';
  ctx.setLineDash([]);
  try { ctx.letterSpacing = '0px'; } catch(e){}
  BR = (Math.sin(t*0.32)*6 + Math.sin(t*0.11)*3) * Math.min(1, Math.abs(cam.vel)/140);
  // base — ambient color drifts cooler era by era
  const amb = ambient(cam.x);
  ctx.fillStyle = `rgb(${amb.bg[0]|0},${amb.bg[1]|0},${amb.bg[2]|0})`;
  ctx.fillRect(0, 0, W, H);

  drawFloor();
  drawWall();
  drawFilmVideoWall();   // the film backdrop sits directly on the deep wall
  drawFilmProjectorWall();   // and the 1999 throw washes over the plaster
  drawFilmWallPlasma();      // the 2009 plasma hangs on the wall, behind the counters
  drawShowroom(t);   // the room the last stretch is actually set in
  // recreations stand proud of the deeper era walls — they paint on top
  /* 1979 HAD THE FIRST BLOCK AND IT WAS TAKEN AWAY WITH THE RUNNER. Without it
     the bay's panel and the models' plinth stopped at the counter's foot line
     with nothing standing under them, and through the slot between two counter
     runs you saw straight past into the room — the bay hovered (Eldar,
     2026-09-23: «там просто нет ступеньки... парит в воздухе, не касаясь
     пола»). Its stone is the craft century's warm one. It is laid HERE, before
     the bay, because at 1979 a counter runs right across the mouth: the
     furniture is painted later and covers the block everywhere except the
     slot, which is exactly where it is wanted. The bay's own pilasters end on
     its tread, so there is nothing of them left for it to cover. */
  drawBayStep(REC_L, REC_R, STEP_TONE.warm, R79_BAY_Z, noseOf(R79_BAY_Z));
  drawMapWall(t);
  drawLabs73();
  drawRec3(t);
  drawRec93(t);
  drawRec2(t);
  drawRec17(t);
  drawRec18(t);
  drawRec23(t);
  drawRec4(t);

  // lamp pools on wall (behind photos) — one per ceiling fixture
  for (let i = 0; i < LIGHT_GRID.length; i++) drawLampPool(LIGHT_GRID[i].x, lampFlicker(t, i+1));

  drawTallUnits();      // furniture against the wall, before anything hung on it
  drawOutro();
  drawEventBoard(t);   // расписание курсов на стене финала
  drawSheets();

  // wall layer: photos and panels sit deepest
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > CULL_BEAT) continue;
    if (b.doc) drawDocCard(b, i);
    if (b.patent) drawPatentCard(b);
    for (const it of b.wall){
      const sp = SPRITES[it.img]; if (!sp) continue;
      // sized on the era's text plane (equal framing everywhere), but
      // riveted to the wall for motion — the rivet law
      const wz = it.pz != null ? it.pz : (segAt(b.x).tz || wallZAt(b.x)) - 12;
      const ax = it.pz != null ? px(b.x + it.dx, k(it.pz))
                               : wallSX(b.x, it.dx, k(wz));
      rivet('wall:' + (it.img || '') + ':' + b.x, ax, k(it.pz != null ? it.pz : exhibitZ(b.x)));
      drawSprite(sp, b.x + it.dx, it.cy, wz, it.w, it.rot || 0, null,
                 {type:'photo', sp, wx: b.x + it.dx, cy: it.cy, z: wz, w: it.w, cap: it.cap, link: it.link, beat: i}, ax);
      if (it.cap){
        const kk = k(wz);
        const seg = segAt(b.x);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = eraFont(19 * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},0.55)`;
        const hW = it.w * (sp.inner.h / sp.inner.w);
        ctx.fillText(it.cap, ax, py(it.cy + hW/2 + 44, kk));
        ctx.restore();
      }
    }
    if (b.plasma) drawPlasmaPanel(b, t);
  }
  drawBanners(t);
  /* grounded years are LETTERING ON THE WALL: they paint here, before the
     furniture, so a standing photograph passes over them the way any object
     passes over what is written on the plaster. Flying and focused years keep
     the late pass — they travel toward the camera and must ride above. */
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > CULL_BEAT) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    if (!b.fly && focusAmt <= 0.01) drawBeatText(b, focusAmt);
  }
  /* A COLUMN STANDS IN FRONT OF WHAT IS WRITTEN ON THE WALL. The portal's two
     pilasters were painted with the recreation, long before the wall type, so
     the GUIDING LEADERS plate and the 2017 numerals crossed over them as the
     camera moved — a plate sliding across a column it should pass behind. They
     are laid again here, after the wall's type and before everything that
     stands on the floor, so the furniture, the machines and the people still
     cover them in their turn. */
  drawRec4Columns(null);
  drawHallPortalColumns(false);
  drawProjectors(t, 'light');   // light lands on the WALL; the bench will crop it

  /* THE REFLECTION IS UNDER EVERYTHING THAT STANDS ON IT. It used to be laid
     after the stage and the figures, so the polished floor was painted OVER
     the speaker's plinth and the silhouettes — a veil across the people rather
     than a shine beneath them. It reflects the wall band, which is already
     drawn, and everything standing on the floor now covers it in turn. */
  drawFloorSheen();
  drawHallPortalColumns(true);  // its metal shoe stays above the reflected floor
  /* AND THE 2022 PORTAL'S SHOE WITH IT. This pass exists to cover the column's
     own reflection, nothing else, so it belongs here — with the sheen it
     answers and BEFORE everything that stands on the floor. It used to run
     after the factory, and the foot of the left column was then painted over
     the milling cells, which stand a thousand units in front of it: walking up
     to 2019 a grey cylinder appeared on top of the machines (Eldar). */
  drawRec4Columns(null, true);

  /* THE RUNNER IS UNDER THE PEOPLE. It was laid with the hall's exhibit, after
     the figures, so the three of the audience who stand ON it had their feet
     painted over: the rug read as a panel standing in front of them (Eldar,
     2026-09-23: «ковёр находится перед персонажами — нужно, чтобы они стояли
     на нём»). A floor covering belongs with the floor: before anything that
     stands on it, after the sheen it lies over. */
  drawHallCarpet();

  // mid-ground: people and machines stand in front of the wall...
  drawStage(t);
  drawFigures();
  drawProps(true);
  /* the factory is floor machinery standing BEHIND the counter line: drawn
     here, in the mid-ground, so the 2018 bay's own table can occlude it as it
     enters the frame — it used to ride in the table pass, over that table */
  /* the 2018 data is laid BEFORE the factory: the stream flies in behind the
     control pendant and disappears into it, rather than landing on its glass
     (Eldar, 2026-09-11: "позади него, а не в экран") */
  drawAIRelay(t);      // the one object that belongs to two beats at once
  drawFactory(t);

  drawPlateBench(t);  // and the founding bay, cut from its centrepiece
  drawProjectors(t, 'machineGround');   // a machine standing on the floor goes behind the counters
  drawHallExhibit();  // the pedestal and its crown stand in the room, behind the counters (Eldar)
  drawBench();        // reflection can never be laid over the furniture
/* THE COUNTERS COME AFTER THE HALL'S FLOOR. Laid before it, the glass hall's
     red carpet — which runs a couple of hundred units past the counter's end on
     purpose — was painted over the end of the run and the joint showed (Eldar,
     2026-09-21). Furniture goes over the floor, always. */
  drawSheetBenches();
  drawShowroomLight(t);   // light coming OUT of the furniture, so after it
  drawProjectors(t, 'machine');   // it stands on the bench, so it comes after it

  // table items
  drawFinaleTable(t);
  drawProps(false);
  drawWelcomeTV();    // the film stands on the welcome bench
  drawFilmRelays();   // and its relays pick it up down the rail
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > CULL_BEAT) continue;
    for (const it of b.table){
      const sp = SPRITES[it.img]; if (!sp) continue;
      drawLyingPrint(sp, b.x + it.dx, it.lz, it.w, it.rot || 0,
                     {type:'photoTable', sp, wx: b.x + it.dx, lz: it.lz, w: it.w, cap: it.cap, beat: i});
    }
    for (const it of (b.st || [])){
      const sp = SPRITES[it.img]; if (!sp) continue;
      const hW = sp.h * (it.w / sp.inner.w);
      drawStandingPrint(sp, b.x + it.dx, it.lz, it.w,
        {type:'photo', sp, wx: b.x + it.dx, cy: CFG.benchY - hW/2, z: it.lz, w: it.w, cap: it.cap, beat: i},
        it.lift);
    }
    // the label goes on AFTER the pictures: it stands in front of them, not behind
    if (b.plaque && b.plaqueLz != null) drawBenchPlaque(b);
    if (b.rig && RIGS[b.rig.kind]) RIGS[b.rig.kind](b, t);
    for (const p of (b.props || [])) drawMonitor(p, b.x + p.dx, p.lz, p.w, t);
    if (b.album) drawAlbum(b, i, t, state.dt || 0.016);
    if (b.pfmRow) drawPfmRow(b, i);
    if (b.pyr) drawBookPyramid(b, t);
  }
  drawProps('late');   // things meant to lie in front of a beat's own objects
  drawPlane93();       // the freighter puts down on the model's own site — behind the building
  drawRec93Front(t);   // the model stands on its own plinth, on the floor
  drawFlybys();        // the two passes that never touch down
  drawDataRelay07(t);  // the first file, leaving 2007 for the digital revolution's screen


  // lamps + dust + foreground — evenly spaced fixtures per era
  for (let i = 0; i < LIGHT_GRID.length; i++){
    const L = LIGHT_GRID[i];
    // a plate brings its own lamp; the hall's fixture would hang in front of it
    if (PLATES.some(p => p.sp && Math.abs(L.x - p.x) < p.w * 0.5)) continue;
    // the cool eras keep their light but lose the fixture: a black slab hung
    // over the numerals was reading as a bar across the composition
    if (L.seg.lamp === 'tube') continue;
    drawLamp(L.x, t, i+1);
  }
  drawDust(t);

  // a focus dolly turns the hall down: everything painted so far recedes,
  // the headline and the pedestal (drawn after) carry the frame alone
  const focusA = state.focusBeat >= 0 ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
  if (focusA > 0.01){
    ctx.fillStyle = `rgba(3,4,6,${(0.45*focusA).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // the floating text reads above everything — walls, tables, even the lamps
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > CULL_BEAT) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    if (b.fly || focusAmt > 0.01) drawBeatText(b, focusAmt);
  }

  // hero pass: as you pass a landmark stand, the world dims and a spotlight takes it
  let hero = 0;
  for (const b of BEATS){
    if (!b.ped) continue;
    const pedX = b.x + (b.ped.dx ?? -430);
    if (pedX > REC17_L && pedX < REC17_R) continue;   // the glass hall is a lit room: arriving there brightens, never dims
    const d = Math.abs(pedX - cam.x);            // catharsis lands dead center
    const h = Math.max(0, 1 - d/680);
    hero = Math.max(hero, h*h*(3-2*h));
  }
  // the factory line, the stage and the 1979 map have their apex at center too
  for (const hx of [FACT_X, STAGE_X]){
    const h = Math.max(0, 1 - Math.abs(hx - cam.x)/680);
    hero = Math.max(hero, h*h*(3-2*h) * 0.7);
  }
  const hMap = (() => {
    const h = Math.max(0, 1 - Math.abs((REC_L + REC_R)/2 - cam.x)/680);
    return h*h*(3-2*h);
  })();
  /* 1979 is the one apex that does NOT dim the hall: it lights it. Its share of
     the veil is gone; drawMapHero washes the bay instead. */
  state.hero = hero;
  if (hero > 0.01){
    ctx.fillStyle = `rgba(2,2,3,${(0.38*hero).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  /* culled by the PLINTH's own place, not the beat's: the crown's plinth now
     stands two thousand units from the beat that owns it, in the glass hall */
  for (const b of BEATS) if (b.ped && Math.abs(b.x + (b.ped.dx ?? -430) - cam.x) < 2000) drawPedestal(b, t, hero);
  /* the factory is the exhibit of its own catharsis: the room dims, the line
     does NOT — it is drawn again over the veil, machines, shafts and all,
     exactly the way the pedestals climb back out of the dark */
  {
    const hF = Math.max(0, 1 - Math.abs(FACT_X - cam.x)/680);
    if (hF > 0.02) drawFactory(t, true);
  }
  drawMapHero(t, hMap);
  drawRec2Front(t);      // the milled crown belongs to the near plane, in front of its portal
  // the founding bench stands IN FRONT of its own year: the numerals are
  // painted on the wall behind it, so the still life passes over them the way
  // any object in the room passes over what is written on the plaster
  drawPlates(t);
  drawBenchDescs();

  drawForeground();
  drawDoorway();
  if (Math.max(state.introFade, state.finFade || 0) > 0.01){
    // packshot curtains: the welcome and the finale both close their frame
    const IF = Math.max(state.introFade, state.finFade || 0);
    const edge = 300*SS, soft = 640*SS;
    for (const s of [-1, 1]){
      const x0 = W/2 + s*edge, x1 = W/2 + s*(edge + soft);
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, 'rgba(6,4,2,0)');
      g.addColorStop(1, `rgba(6,4,2,${(0.97*IF).toFixed(3)})`);
      ctx.fillStyle = g;
      ctx.fillRect(Math.min(x0,x1), 0, soft, H);
      ctx.fillStyle = `rgba(6,4,2,${(0.97*IF).toFixed(3)})`;
      if (s > 0) ctx.fillRect(x1, 0, Math.max(0, W - x1), H);
      else ctx.fillRect(0, 0, Math.max(0, x1), H);
    }
  }
  drawSeamVideo();
  drawBloom();
  drawGrade(t);
  drawProgress(t);
  drawMusicMark();
  drawDebug();
  drawAlbumView();   // the album, open on the table in front of you
  drawStudy();
  drawPeople();    // the wall of voices
  drawPerson();    // one voice's own page, over whatever sent you to it
  drawClip();      // the speaker's voice — a video window above the page
  drawPfmView();   // the PFM line grows out of the counter it stands on
  drawInspect();   // a person card opens above the reading page
  drawOpenBox();   // one carton off the pile, opened
  drawAttractHint(t);
  // pointer affordance
  if (Input.hover && state.mode === 'live'){
    const aimHover = (!state.inspect && hitAt(Input.hover.x, Input.hover.y)) || null;
    state.docHot = !!(aimHover && aimHover.type === 'doc');
    document.body.style.cursor = (musicMarkHit(Input.hover) || soundMarkHit(Input.hover) || voicesMarkHit(Input.hover)) ? 'pointer'
      : ruleHit(Input.hover) ? 'ew-resize'
      : ((!state.inspect && hitAt(Input.hover.x, Input.hover.y)) ? 'pointer' : '');
  }

  // attract fade
  if (state.attract.fade > 0){
    ctx.fillStyle = `rgba(5,2,0,${state.attract.fade})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (DEBUG){
    ctx.fillStyle = '#0f0'; ctx.font = `${14*SS}px monospace`; ctx.textAlign = 'left';
    ctx.fillText(`x=${cam.x|0} v=${cam.vel|0} mode=${state.mode} fps=${fps|0}`, 10, 20*SS);
  }
}

/* ---------------- MAIN LOOP ---------------- */
const DEBUG = /debug/.test(location.search);
let last = 0, fps = 60, qFrames = 0, qCool = 0;
const FPS_HUD = /[?&]fps=1/.test(location.search);
let HUD_WORST = 0, HUD_LONG = 0, HUD_T = 0;
function drawFpsHud(dt, frameMs){
  HUD_WORST = Math.max(HUD_WORST * 0.985, frameMs);
  if (dt > 0.024) HUD_LONG++;
  HUD_T += dt;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `${Math.round(13 * SS)}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'left';
  const rows = [
    `fps ${fps.toFixed(1)}   frame ${frameMs.toFixed(1)}ms   worst ${HUD_WORST.toFixed(1)}ms`,
    `dropped ${HUD_LONG}  in ${HUD_T.toFixed(0)}s    RQ ${RQ.toFixed(2)}`,
    `${W}\u00d7${H} @${(window.devicePixelRatio || 1).toFixed(1)}   SS ${SS.toFixed(2)}   vel ${cam.vel.toFixed(0)}`,
  ];
  const wBox = 330 * SS, hBox = 18 * SS * rows.length + 14 * SS;
  ctx.fillStyle = 'rgba(4,6,9,0.72)';
  ctx.fillRect(12 * SS, H - hBox - 12 * SS, wBox, hBox);
  ctx.fillStyle = fps < 50 ? 'rgba(255,150,120,0.95)' : 'rgba(190,235,255,0.9)';
  rows.forEach((r, i) => ctx.fillText(r, 22 * SS, H - hBox + (18 * i + 20) * SS));
  ctx.restore();
}
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016);
  last = ts;
  fps = fps*0.95 + (1/Math.max(dt,1e-3))*0.05;
  // adaptive quality: weak hardware renders smaller, CSS upscales.
  // wide hysteresis + a long cool-down — the buffer must never oscillate,
  // reallocating it mid-motion is what reads as a doubled frame
  if (qCool > 0) qCool--;
  else if (++qFrames > 150){
    qFrames = 0;
    /* the floor is 0.72 — below that the hall turns to mush — and recovery
       does not demand a perfect 60: a machine holding 52+ earns its pixels back */
    /* NOT WHILE ANYONE IS LOOKING AT SOMETHING STILL. Dropping the buffer is
       for a hall in motion; on the title card and on an open page the frame is
       already still, and all the drop does is turn the mark and the lettering
       to stairsteps — which is exactly where Eldar saw it. The floor is 0.82:
       below that the type goes to mush, and 0.72 bought a few frames nobody
       asked for. Recovery at 46, so it climbs back after one slow stretch. */
    const still = state.introHold || state.docOpen || state.study || state.person ||
                  state.people || state.clip || RQ_PIN;
    if (still){ /* hold the buffer where it is */ }
    else if (fps < 34 && RQ > 0.82){ RQ = Math.max(0.82, RQ - 0.09); resize(); qCool = 900; }
    else if (fps > 46 && RQ < 1){ RQ = Math.min(1, RQ + 0.09); resize(); qCool = 900; }
  }
  // a tab that boots hidden measures 0x0 — never draw a zero frame
  if (!W || !H){ resize(); if (!W || !H){ requestAnimationFrame(loop); return; } }
  update(dt);
  const _t0 = FPS_HUD ? performance.now() : 0;
  frame();
  if (FPS_HUD) drawFpsHud(dt, performance.now() - _t0);
  requestAnimationFrame(loop);
}

  for (const b of BEATS){

      const maxH = Math.max(120, 690 - (it.top != null ? it.top : 360));

      if (h > maxH){ it.w *= maxH / h; h = maxH; }
      it.cy = (it.top != null ? it.top : 360) + h/2;
      const half = sp.w * (it.w / sp.inner.w) / 2 + 30;
      const x = b.x + it.dx;
      if (x - half < wallL) it.dx = wallL + half - b.x;
      if (x + half > wallR) it.dx = wallR - half - b.x;

  }

  // greedy left-to-right separation inside each photo's own wall extents
  {

        items.push({b, it, half,
                    wallL: seg.x0 + (seg.wInsetL || 0), wallR: seg.x1 - (seg.wInsetR || 0)});
      }
    items.sort((p, q) => (p.b.x + p.it.dx) - (q.b.x + q.it.dx));
    for (let i = 1; i < items.length; i++){
      const a = items[i-1], c = items[i];
      const gap = (c.b.x + c.it.dx - c.half) - (a.b.x + a.it.dx + a.half);
      if (gap >= 24) continue;

      const cMax = c.wallR - c.half - (c.b.x + c.it.dx);   // room to the right

    add(-90, 'PLINTH', 'pedestals (hero objects)', -3450, WORLD_END + 300);
    /* the layers the hall grew after the first plan was drawn (2026-08-25):
       the glass hall's three plates and its pedestal, the carpet, the two model
       plinths of the seventies, the stones of 1973 — all asked of the code */
    if (typeof HALL_ROOM_Z === 'number'){
      add(HALL_ROOM_Z, 'REC', 'glass hall — room plate (wall photograph, fitted to the wall height)', HALL_FRAME_L, HALL_FRAME_R);
      add(HALL_ROOM_Z, 'FLOOR', 'glass hall — polished floor plate, under the whole late stretch', SHOW_L, SHOW_R);

    const pz = new Set(), fz = new Set();
    for (const b of BEATS)
      for (const it of [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),

    console.log('PEDESTALS at z=-90:\n' + BEATS.filter(b => b.ped)

    const items = [];

        items.push([(b.x + (it.dx||0))|0, it.lz != null ? it.lz : 0, (it.w||300)|0,
                    it.img || it.kind || it.title || 'rig']);
    console.log('ON THE COUNTER (' + items.length + '):\n' +
      items.sort((a,b) => a[0]-b[0]).map(i => '  x ' + i[0] + '  z ' + i[1] +
        '  w ' + i[2] + '  ' + i[3]).join('\n'));
    const pinned = [];
    for (const b of BEATS)
      for (const it of (b.wall || [])) if (it.pz != null)
