<style>

     a line out of, or take whole with one button. */

            background:#141210;color:#e8e2d6;border:1px solid rgba(220,205,175,0.18);
            border-radius:4px;box-shadow:0 40px 120px rgba(0,0,0,0.7)}
  #docHead{display:flex;align-items:baseline;gap:16px;padding:18px 24px 14px;
           border-bottom:1px solid rgba(220,205,175,0.14)}
  #docHead h1{margin:0;font:500 15px/1.2 "Helvetica Neue",Arial,sans-serif;
              letter-spacing:.16em;color:#d8cdb4}
  #docHead .sub{font:italic 12px/1.2 Georgia,serif;color:#8d8377;flex:1}
  #doc button{font:500 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;
              color:#d8cdb4;background:transparent;cursor:pointer;
              border:1px solid rgba(220,205,175,0.28);border-radius:3px;padding:7px 12px}

     grows to its content instead of scrolling, so the long note simply ran off
     the bottom of the panel with no bar to pull */
  #docBody{flex:1 1 auto;min-height:0;overflow-y:scroll;overscroll-behavior:contain;
           padding:18px 24px 26px;margin:0;white-space:pre-wrap;
           user-select:text;-webkit-user-select:text;
           scrollbar-width:thin;scrollbar-color:rgba(220,205,175,0.45) transparent;
           font:13px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#ddd6c8}
  #docBody::-webkit-scrollbar{width:12px;background:rgba(255,255,255,0.04)}
  #docBody::-webkit-scrollbar-thumb{background:rgba(220,205,175,0.55);border-radius:6px;
           border:3px solid transparent;background-clip:padding-box}
  #docBody::-webkit-scrollbar-thumb:hover{background:rgba(220,205,175,0.55);border:3px solid transparent;background-clip:padding-box}
  #docBody::selection{background:rgba(200,170,110,0.35)}

  const src = IMGS[name]; if (!src) return null;
  const style = opts.style || 'frame';    // 'frame' | 'print' | 'metal' | 'print2' | 'plastic'
  const pad = {frame:26, print:16, metal:44, print2:14, plastic:18, white:46}[style];
  const sh = 30;                                 // shadow margin
  const w = src.w + pad*2, h = src.h + pad*2;
  const c = document.createElement('canvas');
  c.width = w + sh*2; c.height = h + sh*2;
  const g = c.getContext('2d');
  // baked drop shadow
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.fillStyle = '#000';
  g.fillRect(sh, sh, w, h);
  g.restore();
  if (style === 'frame'){
    // dark wood frame with bevel
    const fg = g.createLinearGradient(sh, sh, sh, sh+h);
    fg.addColorStop(0, '#3a2a1a'); fg.addColorStop(.5, '#241708'); fg.addColorStop(1, '#170e05');
    g.fillStyle = fg; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,220,160,0.13)'; g.lineWidth = 4;
    g.strokeRect(sh+3, sh+3, w-6, h-6);
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'metal'){
    // 80s office: thin brushed-aluminum frame + white mat
    const mg = g.createLinearGradient(sh, sh, sh+w, sh+h);
    mg.addColorStop(0, '#63676c'); mg.addColorStop(.5, '#2c2f32'); mg.addColorStop(1, '#53575b');
    g.fillStyle = mg; g.fillRect(sh, sh, w, h);
    g.fillStyle = '#e9e8e1'; g.fillRect(sh+10, sh+10, w-20, h-20);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 2;
    g.strokeRect(sh+pad-2, sh+pad-2, src.w+4, src.h+4);
  } else if (style === 'white'){
    // gallery frame: white moulding + wide mat
    g.fillStyle = '#eceae3'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2;
    g.strokeRect(sh+1, sh+1, w-2, h-2);
    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.strokeRect(sh+10, sh+10, w-20, h-20);
    g.fillStyle = '#faf9f5'; g.fillRect(sh+12, sh+12, w-24, h-24);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'plastic'){
    // 90s: thin black plastic frame, no mat
    g.fillStyle = '#1b1c1e'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
    g.strokeRect(sh+1.5, sh+1.5, w-3, h-3);
  } else if (style === 'print2'){
    // crisp lab print, white border
    g.fillStyle = '#f0ede3'; g.fillRect(sh, sh, w, h);
  } else {
    // aged paper print border
    g.fillStyle = '#e8dcc2'; g.fillRect(sh, sh, w, h);
    g.fillStyle = 'rgba(120,90,40,0.12)'; g.fillRect(sh, sh, w, h);
  }
  // photo, era-toned
  g.save();
  g.filter = opts.tone || 'sepia(0.5) saturate(0.75) contrast(1.04) brightness(0.96)';
  g.drawImage(src.el, sh+pad, sh+pad);
  g.restore();
  // warm glass sheen
  const sheen = g.createLinearGradient(sh, sh, sh+w*0.7, sh+h);
  sheen.addColorStop(0, 'rgba(255,235,190,0.10)'); sheen.addColorStop(.4, 'rgba(255,235,190,0.0)');
  g.fillStyle = sheen; g.fillRect(sh+pad, sh+pad, src.w, src.h);
  return {c, w: c.width, h: c.height, inner: {x: sh, y: sh, w, h}};
}

/* ---------------- PROCEDURAL TEXTURES ---------------- */
function noiseTile(size, alpha){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const id = g.createImageData(size, size);
  for (let i = 0; i < id.data.length; i += 4){
    const v = 128 + (Math.random()*2-1)*110;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = alpha*255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function woodTexture({w=1024, h=1024, plank='v', plankSize=170, base='#241708', light='#3d2a13', gapCol='rgba(0,0,0,.55)'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const across = plank === 'v' ? w : h;
  const nP = Math.round(across / plankSize);
  for (let p = 0; p < nP; p++){
    const a0 = p * across / nP, aw = across / nP;
    const tone = 0.75 + Math.random()*0.5;
    g.save();
    if (plank === 'v'){ g.translate(a0, 0); } else { g.translate(0, a0); }
    const grad = g.createLinearGradient(0, 0, plank==='v'?aw:0, plank==='v'?0:aw);
    grad.addColorStop(0, base); grad.addColorStop(.5, light); grad.addColorStop(1, base);
    g.globalAlpha = tone * 0.9;
    g.fillStyle = grad;
    g.fillRect(0, 0, plank==='v'?aw:w, plank==='v'?h:aw);
    // grain streaks along plank
    g.globalAlpha = 1;
    for (let s = 0; s < 26; s++){
      g.strokeStyle = `rgba(${Math.random()<.5?'0,0,0':'255,215,150'},${(Math.random()*0.10+0.03).toFixed(3)})`;
      g.lineWidth = Math.random()*2+0.5;
      g.beginPath();
      const along = plank==='v'?h:w;
      const off = Math.random()*(plank==='v'?aw:aw);
      let px = off, py = -20;
      g.moveTo(plank==='v'?px:py, plank==='v'?py:px);
      for (let t = 0; t < along+40; t += 60){
        px += (Math.random()*2-1)*6;
        py += 60;
        g.lineTo(plank==='v'?px:py, plank==='v'?py:px);
      }
      g.stroke();
    }
    // plank gap
    g.strokeStyle = gapCol; g.lineWidth = 2.5;
    g.beginPath();
    if (plank === 'v'){ g.moveTo(0.5,0); g.lineTo(0.5,h); } else { g.moveTo(0,0.5); g.lineTo(w,0.5); }
    g.stroke();
    g.restore();
  }
  // dirt/noise
  const nz = noiseTile(256, 0.05);
  g.globalAlpha = 1; g.fillStyle = g.createPattern(nz, 'repeat');
  g.fillRect(0,0,w,h);
  return c;
}
function panelTexture({w=1200, h=900, base='#6e6b5e', groove=280}){
  // painted 80s workshop panelling
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.09)');
  vg.addColorStop(.5, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  for (let x = groove/2; x < w; x += groove){
    g.fillStyle = 'rgba(0,0,0,0.26)'; g.fillRect(x, 0, 3, h);
    g.fillStyle = 'rgba(255,255,255,0.09)'; g.fillRect(x+3, 0, 2, h);
  }
  for (let i = 0; i < 90; i++){  // scuffs and stains — soft, barely-there
    g.fillStyle = `rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${(Math.random()*0.02).toFixed(3)})`;
    g.beginPath();
    g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*130, 8+Math.random()*26, Math.random()*3, 0, 7);
    g.fill();
  }
  const nz = noiseTile(256, 0.035);
  g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(0,0,w,h);
  return c;
}
function formicaTexture({w=1200, h=512, base='#867f71'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i = 0; i < 9000; i++){   // speckle
    g.fillStyle = `rgba(${Math.random()<.55?'42,40,32':'236,233,222'},${(0.05+Math.random()*0.12).toFixed(3)})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1.7, 1.7);
  }
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.12)');
  vg.addColorStop(.4, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.2)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  return c;
}

/* ---------------- INPUT ABSTRACTION ----------------
   Single point where the physical control plugs in.
   A driver pushes: impulse(dv) — velocity kick along the rail (world units/s),
                    action()    — the one button (focus / wake).
   Mouse today, flywheel encoder tomorrow: replace/add a driver, nothing else. */
const Input = (() => {
  let impulse = 0, action = false, anyInput = false, dragging = false;
  const api = {
    hover: null,   // last pointer position in canvas-buffer coords
    consume(){
      const out = {impulse, action, anyInput, dragging};
      impulse = 0; action = false; anyInput = false;
      return out;
    },
    push(dv){ impulse += dv; anyInput = true; },
    act(pt){ action = pt || true; anyInput = true; },
    setDragging(v){ dragging = v; anyInput = true; document.body.classList.toggle('dragging', v); },
  };
  return api;
})();
function toBuf(e){ return {x: e.clientX * (W / innerWidth), y: e.clientY * (H / innerHeight)}; }

function attachMouseDriver(el){
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
    Input.push(d * CFG.wheelGain);
  }, {passive:false});
  let lastX = 0, moved = 0, down = false, markTap = false;
  el.addEventListener('pointerdown', e => {
    down = true; moved = 0; lastX = e.clientX; markTap = false;
    const pt = toBuf(e);
    // the rule takes the pointer before the hall does: dragging its thumb
    // scrubs the century instead of shoving the bench
    // arm the scrub, but do not move yet: a press is not a jump. Grabbing the
    // thumb anywhere on its body keeps that grip point, so it never snaps its
    // centre under the cursor.
    if (musicMarkHit(pt)){ toggleMusic(); down = false; markTap = true; return; }
    if (soundMarkHit(pt)){ toggleSound(); down = false; markTap = true; return; }
    /* THE VOICES OPENED AND CLOSED IN ONE TAP. The press opened the page, then
       the release of that same tap arrived as a click on nothing — and a click
       on nothing is exactly how a page is closed. The mark now owns the release
       too. */
    if (voicesMarkHit(pt)){ if (!state.people) openPeople(); down = false; markTap = true; return; }
    {
      const aimed = hitAt(pt.x, pt.y);
      if (aimed && aimed.type === 'inseek'){
        state.seekDrag = {x0: aimed.x0, w: aimed.w, src: aimed.src};
        seekPageClip(pt.x);
        down = false; markTap = true;
        el.setPointerCapture(e.pointerId);
        Input.setDragging(true);
        return;
      }
      if (aimed && aimed.type === 'spin'){
        state.spinDrag = {lastX: e.clientX, lastY: e.clientY, moved: 0};
        down = false; markTap = true;
        el.setPointerCapture(e.pointerId);
        return;
      }
    }
    if (ruleHit(pt)){
      const g = ruleGeom();
      const grabbed = Math.abs(g.at(cam.x) - pt.x) < Math.max(18 * SS, (g.at(cam.x + g.half) - g.at(cam.x - g.half)) / 2);
      state.ruleDrag = {off: grabbed ? cam.x - g.toWorld(pt.x) : 0};
    }
    Input.setDragging(true); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    Input.hover = toBuf(e);
    if (state.seekDrag){ seekPageClip(toBuf(e).x); return; }
    if (state.spinDrag){
      /* ANY WAY YOU LIKE. It turned about one axis only, like a record; Eldar
         wanted to tip it over and look underneath. Horizontal movement turns it
         about the screen's vertical, vertical movement tips it toward or away
         from you, and the two compound — a trackball, not a turntable. */
      const dx = e.clientX - state.spinDrag.lastX, dy = e.clientY - state.spinDrag.lastY;
      state.spinDrag.lastX = e.clientX; state.spinDrag.lastY = e.clientY;
      state.spinDrag.moved += Math.abs(dx) + Math.abs(dy);
      /* MIRRORED, both axes. Turning it the way the hand moves reads as pushing
         the FRONT face of the crown around; what the hand expects is a ball it
         has taken hold of at the near side — drag left and the near surface
         goes left, so the object turns the other way. Eldar: "не так как
         нативно хочется". */
      crownTurn(-dx * 0.012, dy * 0.012);
      CROWN3D.wy = -dx * 0.012 * 40; CROWN3D.wx = dy * 0.012 * 40;   // it keeps a little of your speed when you let go
      return;
    }
    if (!down) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    if (state.ruleDrag){
      if (moved > 3) ruleSeek(toBuf(e), true, state.ruleDrag.off);
      Input.push(0);
      return;
    }
    // convert screen drag to world velocity kick (grab the bench, z=0)
    Input.push(-dx * 30);
  });
  el.addEventListener('pointerup', e => {
    if (state.seekDrag){ state.seekDrag = null; markTap = false; down = false; Input.setDragging(false); return; }
    if (state.spinDrag){ state.spinDrag = null; markTap = false; down = false; Input.setDragging(false); return; }
    if (markTap){ markTap = false; down = false; Input.setDragging(false); return; }
    down = false; Input.setDragging(false);
    if (state.ruleDrag){
      const dragged = moved >= 6;
      state.ruleDrag = null;
      if (!dragged) ruleSeek(toBuf(e), false);   // a tap glides there instead
      return;                                    // the rule never opens a year
    }
    if (moved < 6) Input.act(toBuf(e));  // a click = the button, aimed at a point
  });
  window.addEventListener('keydown', e => {
    if (state.docOpen) return;          // the note has the keyboard
    if (e.key === 'ArrowRight') Input.push(900);
    else if (e.key === 'ArrowLeft') Input.push(-900);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Input.act(); }
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (e.key === 'm' || e.key === 'M' || e.key === '\u044c' || e.key === '\u042c') toggleMusic();
  });
}

function nearestBeat(x){
  let best = -1, bd = 1e9;
  for (let i = 0; i < BEATS.length; i++){
    const d = Math.abs(BEATS[i].x - x);
    if (d < bd){ bd = d; best = i; }
  }
  return {i: best, d: bd};
}

/* the long bench is really a row of separate tables */
/* Table joints. 1980 used to sit well before the threshold; once the threshold
   bay was cut it landed at 2680 — a hand's width past the change of wall — and
   punched a bright slot straight through the dark counter. Moved back to where
   it was in the room rather than where it was in the array. */
/* 3830 landed 200 units from 1973 — a joint in the counter directly under
   that year's photographs. Moved to the midpoint between 1970s and 1973,
   where a joint reads as the seam between two bays. */
/* 17900 landed 470 units from the 2007 plinth and left a 405-wide scrap of
   counter marooned between the two gaps — the little island. Moved back to
   16900, where it divides a long run instead of stranding a piece of one. */
const BENCH_BREAKS = [1700, 7350, 9250, 13100, 16900, 22280]
  .map(x => ({x: SHIFT(x), half: 65}));
/* 1973: no counter — the two labs stand on their own stones, the way the nine
   do at 1979, and the counters stop short of them on both sides (Eldar,
   2026-09-11). The small joint that used to sit here (3345) is gone with it. */
const L73_W = 760;   // the pair of plinths, in world units
BENCH_BREAKS.push({x: SHIFT(4400), half: L73_W / 2 + 440, l73: true});   // the counters stand well back from the two stones — Eldar hatched their ends away (2026-09-11)   // re-centred on the beat once applyCut has spaced it
BENCH_BREAKS.push({x: SHIFT(24870), half: 560});   // the BruxZir Factory line replaces the table
/* the counters stop two column-widths clear of the doorway's pilasters — on
   screen, with the hall centred. The pilasters stand at z 992 and the counter
   at 340, so the same screen distance is fewer world units at the counter:
   the break is the doorway's half-width plus two and a half columns, all
   scaled by the ratio of the two depths. (Eldar drew it, 2026-09-10.) */
BENCH_BREAKS.push({x: (HALL_FRAME_L + HALL_FRAME_R) / 2,
                   half: ((HALL_FRAME_R - HALL_FRAME_L) / 2 + 2.5 * 120) * k(992) / k(CFG.benchDepth)});
/* 1979: the counters stop short of the models' plinth, the same distance on
   both sides, so the block stands clear instead of being swallowed by them. */
BENCH_BREAKS.push({x: (REC_L + REC_R) / 2, half: G8_W / 2 + 80});
// the counter clears out from the 1989 portal all the way past the 1993 stand:
// a model of a place should stand on the floor of a room, not on a worktop
BENCH_BREAKS.push({x: (REC3_R + REC93_R + 65) / 2, half: (REC93_R + 65 - REC3_R) / 2});

let TABLES = [];
let LIGHT_GRID = [];
function initLights(){
  LIGHT_GRID = [];
  for (const seg of SEGMENTS){
    const a = Math.max(seg === SEGMENTS[0] ? 950 : -400, seg.x0 + 120), b = Math.min(WORLD_END + 300, seg.x1 - 120);
    const n = Math.max(1, Math.round((b - a) / 940));
    const step = (b - a) / n;
    for (let i = 0; i < n; i++){
      let lx = a + step * (i + 0.5);
      for (const bt of BEATS){
        if (bt.fly && Math.abs(bt.x - lx) < 300) lx = bt.x + (lx >= bt.x ? 300 : -300);
        if (bt.ped){
          const px_ = bt.x + (bt.ped.dx ?? 0);
          if (Math.abs(px_ - lx) < 320) lx = px_ + (lx >= px_ ? 320 : -320);
        }
      }
      LIGHT_GRID.push({x: lx, seg});
    }
  }
  // a year is an exhibit: its lamp hangs over it, not beside it
  for (const b of BEATS){
    if (b.minor || b.under || b.plaque || b.ped) continue;
    let best = -1, bd = 1e9;
    for (let i = 0; i < LIGHT_GRID.length; i++){
      const d = Math.abs(LIGHT_GRID[i].x - b.x);
      if (d < bd){ bd = d; best = i; }
    }
    if (best >= 0 && bd < 620) LIGHT_GRID[best].x = b.x;
  }
  LIGHT_GRID.push({x: INTRO_X, seg: SEGMENTS[0]});   // the welcome lamp, dead over the inscription
  LIGHT_GRID.push({x: FIN_X, seg: SEGMENTS[3]});     // and its mirror over the finale
}
function initTables(){
  // every pedestal claims a wide gap of its own, centered on it
  for (const b of BEATS)
    /* a pedestal parts the counter — and it keeps parting it where the plinth
       has gone and only the cloud of points is left: Eldar wants that space open
       until he has finished with it (2026-09-22: «там должно быть так, как
       было... нам там прилавок не нужен»). */
    if (b.ped) BENCH_BREAKS.push({x: b.x + (b.ped.dx ?? -430), half: b.ped.gapHalf || 330});
  /* THE CABINET STANDS IN A BREAK. It read as hanging because the counter ran
     straight past in front of it with nothing under its feet. The counter now
     stops short of it and picks up again where the jar used to stand, so the
     cabinet is on the floor with its own legs showing. A break rather than a
     start: making the era's counter BEGIN here would empty the opening scene
     and the 1907 bay of every surface and everything standing on one. */
  for (const u of TALL_UNITS){
    const im = PHOTO_TEX.ph_cabinet;
    const half = (im ? (u.hw || 640) * im.width / im.height : u.w) / 2 + 110;
    BENCH_BREAKS.push({x: u.x, half});
    PLATE_FROM = u.x + half;      // the photographed counter starts past the cabinet
  }
  /* THE 2022 RECREATION OPENS THE FLOOR. The alumnae keep a small island of
     counter before the portal; from the portal's left edge to where the book
     pile lies there is no counter at all — the white years' table STARTS at
     the books, and the first thing lying on it is the book. */
  /* The 2005 scrap is gone a better way. A break here merged with the 2007
     pedestal's own gap and ate the counter on its LEFT approach — 880 units of
     void on one side against 330 on the other. Removing it leaves one long run
     from the 2000 plinth to the 2007 plinth, and the pedestal stands centred in
     its own gap, the same air on both hands. */
  {
    const b22 = BEATS.find(b => b.y === '2022');
    const bookL = (b22 && b22.pyr ? b22.x + b22.pyr.dx : REC4_R + 640) - 270;
    if (bookL > REC4_L + 200)
      BENCH_BREAKS.push({x: (REC4_L + bookL) / 2, half: (bookL - REC4_L) / 2});
  }
  /* A photographic counter and a procedural one cannot be made into one surface
     by tuning a constant: the photograph was taken with a different camera, so
     its worktop is seen at a different angle and shows a different depth of its
     own top. Every attempt to line them up is a fit for a single frame. They
     are two pieces of furniture — so the hall's counter ENDS at each edge of a
     plate, with the end cap it already knows how to draw. A joint with an end
     reads as two things standing side by side; a joint without one reads as one
     surface that failed to meet itself. */
  /* A plate needs NO break of its own: it is painted after the bench and simply
     covers it, and beyond its edges the hall's counter continues on exactly the
     same line in exactly the same material. There WAS a loop here putting a
     24-unit half-break at each plate edge, directly under this paragraph saying
     it should not be there — I had reasoned my way to removing it and left the
     code. It made two 48-unit gaps at x 3 349 and 5 223: narrower than the
     worktop's own front lip is deep, half of each falling outside the picture,
     so what you saw was a hairline of naked room beside the centrepiece. A gap
     that small is not a pause in the furniture, it is a seam on it. */
  // small breaks inside a pedestal zone would skew its centering — drop them
  const wide = BENCH_BREAKS.filter(v => v.half > 200);
  for (let i = BENCH_BREAKS.length - 1; i >= 0; i--){
    const br = BENCH_BREAKS[i];
    if (br.half <= 200 && wide.some(p => Math.abs(p.x - br.x) < p.half + 430))
      BENCH_BREAKS.splice(i, 1);
  }
  // fixed table objects step aside from any gap they would straddle,
  // then a spread pass keeps them from piling onto each other
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    const dodge = it => {
      const half = (it.w || 300) * 0.55 + 30;
      for (const br of BENCH_BREAKS){
        const x = b.x + it.dx;
        if (Math.abs(x - br.x) < br.half + half){
          const dir = x >= br.x ? 1 : -1;
          it.dx = br.x + dir * (br.half + half) - b.x;
        }
      }
    };
    items.forEach(dodge);
    items.sort((p, q) => p.dx - q.dx);
    for (let n = 1; n < items.length; n++){
      const need = ((items[n-1].w||300) + (items[n].w||300)) * 0.5 + 24;
      if (items[n].dx - items[n-1].dx < need){
        items[n].dx = items[n-1].dx + need;
        dodge(items[n]);
      }
    }
  }
  TABLES = [];
  for (const seg of SEGMENTS){
    let bx0 = (seg.x0 <= -2500 && !seg.bInsetL) ? seg.x0 : seg.x0 + (seg.bInsetL != null ? seg.bInsetL : -110);
    if (seg.benchFrom != null) bx0 = Math.max(bx0, seg.benchFrom);
    const bx1 = (seg.x1 >= WORLD_END + 800 && !seg.bInsetR) ? seg.x1 : seg.x1 - (seg.bInsetR != null ? seg.bInsetR : -110);
    let start = bx0;

      if (L > start + 240) TABLES.push({x0: start, x1: L, seg});
      start = Math.max(start, R);
    }
    if (bx1 > start + 240) TABLES.push({x0: start, x1: bx1, seg});
  }
  // the law of gravity: every table object stands on an actual table span,
  // full footprint inside — nothing rides a gap, nothing levitates
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    for (const it of items){
      const half = (it.w || 300) * 0.5 + 20;

        if (d < bestD){ bestD = d; best = cx; }
      }
      if (best != null) it.dx = best - b.x;
    }
  }
  /* the film relays are seated by the same tables — reseat them whenever the
     tables change (the photo-skin rebuild moves the spans after boot) */
  try { initFilmRelays(); } catch(e){}
}

/* THE SHADOW OF A THING THAT STANDS ON THE FLOOR. Two earlier tries were wrong
   in the same way: a shape with EDGES. First a round pool under a wide cabinet,
   then a banded rectangle with a hard contact bar — both read as a mat painted

   does not have. What the ceiling actually puts down is a soft, very flat

function softFootShadow(cx, cy, halfW, halfH, alpha){
  const L = 9;
  for (let i = L - 1; i >= 0; i--){
    const t = i / (L - 1);
    const hw = halfW * (1 + 0.55 * t), hh = Math.max(0.8, halfH * (1 + 1.15 * t));
    const al = alpha * Math.pow(1 - t * 0.92, 2.0) * 0.30;

    ['#4a2f17', '#1d1108'],   // craft: dark oiled wood
    ['#485042', '#1e2119'],   // workshop: worn linoleum
    ['#5f656e', '#2c3037'],   // office: carpet-tile grey, lit like the room after it
    /* THE WHITE ROOM'S FLOOR IS LIGHT. It was written as "polished light
       concrete" and painted #686d75 — a dark blue-grey, a tone from the office
       era — and the only places it is ever visible are the slots between the
       counters and the bays, where every neighbour is white. So each slot read
       as a hole punched in the floor (Eldar, 2026-09-22, arrow and blue circle:
       «черная дыра... этот пол основной должен продолжаться назад до стены»).
       The far stop is the tone the bays' own slabs are cut from, so the floor
       now runs unbroken from the counter back to the wall the LED panel hangs
       on; the near stop stays darker than the slabs, which is what still lets
       a bay's threshold read as a lighter rectangle on it. */
    ['#d5dade', '#8b9198'],   // white room: polished light concrete
  ],
  /* Keyed by the bay, not by its position in this list. They were positional,
     and inserting three rows in the middle silently moved two portals onto
     slabs meant for other years — the Digital Revolution ended up on the 1993
     office floor and 2022 on the 2018 machine-hall floor, while the two slabs
     written for them went unused. A name cannot slide. */
  rec: {
    r1979: ['#d6cfc0', '#8f8778'],   // pale stone, toned to the panel
    r1989: ['#d3d1c9', '#8b897f'],   // the national-leader threshold
    r1993: ['#c9ccd1', '#82868d'],   // the nineties office slab
    r2018: ['#eceef0', '#a9aeb4'],   // the machine hall, lit like an operating room
    r2023: ['#e8ebee', '#a4a9af'],   // the crossing
    r2017: ['#d4d9de', '#8e959c'],   // the glass hall: the render's own polished concrete
    rDR:   ['#dde1e6', '#989ea6'],   // digital revolution: cool light stone
    r2022: ['#e4e7ea', '#a3a9b0'],   // fastscan: the whitest slab of all
  },
  plaza: ['#9aa27f', '#5c6650'],  // outside: sunlit ground
};
/* the floor: every era owns its tone, and each recreation stands on its own
   light slab running column to column — the carpet lies on that slab, the
   era seams land visibly at the slab's edges */
function drawFloor(){
  // The floor must begin where the WALL ends, not at some depth behind the
  // bench: the strip between those two lines is normally hidden by the counter,
  // but wherever the counter breaks it was left unpainted and the room's dark
  // background showed through as a black slot — and since the wall's foot and
  // the counter's edge sit at different depths, that slot opened and closed as
  // the camera travelled.
  const kSeam = k(CFG.benchDepth);
  const kNear = k(-40);
  const T = FLOOR_TONES;
  const spans = [
    [SEGMENTS[0].x0 - 900, REC_L - STEP_PAD,  T.era[0], null, STEP_79_L],
    [REC_L - STEP_PAD,  REC_R + STEP_PAD,  T.rec.r1979, stepFoot(REC_L - STEP_PAD, R79_BAY_Z), stepFoot(REC_R + STEP_PAD, R79_BAY_Z)],
    [REC_R + STEP_PAD,  REC3_L - STEP_PAD, T.era[1], STEP_79_R, STEP_89_L],
    [REC3_L - STEP_PAD, REC3_R + STEP_PAD, T.rec.r1989, FSTP_89_L, FSTP_89_R],
    /* THE BAND'S FAR CORNERS ARE THE PANEL'S OWN TWO. The white strip on the
       wall is a vertical rectangle on the bay's plane and must stay one; what
       hangs off it is the floor. So the floor's far edge is drawn at the
       PANEL's corners — its world x at the panel's own depth — and the two
       neighbouring slabs take the same points for their shared edge, so all
       three still tile. The near edge is untouched, at the bay's own width on
       the near plane, exactly where it always was (Eldar, 2026-09-22: «дальняя
       часть прикреплена ровно к точкам края белой стенки, передняя — как
       была»). */
    [REC3_R + STEP_PAD, REC93_L, T.era[2], STEP_89_R, EDG93_L],
    [REC93_L, REC93_R, T.rec.r1993, FAR93_L, FAR93_R],
    [REC93_R, REC2_L - STEP_PAD, T.era[2], EDG93_R, STEP_DR_L],
    [REC2_L - STEP_PAD, REC2_R + STEP_PAD, T.rec.rDR, FSTP_DR_L, FSTP_DR_R],
    [REC2_R + STEP_PAD, REC17_L, T.era[3], STEP_DR_R, null],
    /* NO FLOOR IN THE GLASS HALL. That bay is a photograph of a room, and the
       room in it has a marble floor of its own running to the bottom of the
       frame; the hall's painted floor laid over it read as a white haze across
       the lower half of the render. The gap is not a gap: the photograph fills
       it. */
    [REC17_R, REC18_L - STEP_PAD, T.era[3], null, STEP_18_L],
    [REC18_L - STEP_PAD, REC18_R + STEP_PAD, T.rec.r2018, FSTP_18_L, FSTP_18_R],
    [REC18_R + STEP_PAD, REC4_L - STEP_PAD, T.era[3], STEP_18_R, STEP_22_L],
    [REC4_R + STEP_PAD, REC23_L, T.era[3], STEP_22_R, EDG23_L],
    [REC23_L, REC23_R, T.rec.r2023, FAR23_L, FAR23_R],
    [REC4_L - STEP_PAD, REC4_R + STEP_PAD, T.rec.r2022, FSTP_22_L, FSTP_22_R],
    /* From the crossover onward the approach, Hall and TODAY share one pale
       polished floor. The Hall is no longer a full-frame photograph laid over
       it, so its reflections can continue through the neighbouring bays. */
    [REC23_R, HALL_FRAME_L - 60, T.era[3]],
    [HALL_FRAME_L - 60, SEGMENTS[3].x1 + 900, T.rec.r2017],
  ];
  for (const [a, b, tone, fa, fb] of spans){
    const segF = segAt((a + b) / 2);
    /* The same line the wall's foot is drawn to, computed the same way. Taking
       one from the counter's depth and the other from the wall's is how a strip
       of naked background opens between them. */
    const yTop = py(1080, k(segF.z0 || 550));
    /* a far corner is a POINT, not just an x: a bay's foot sits lower than the
       wall's own foot line, and both slabs that meet there must use it. */
    const corner = (o, x) => {
      if (!o) return {x: px(x, kSeam), y: yTop};
      /* A STEP CORNER TRACES THE BLOCK'S OWN SILHOUETTE. Taking the far point on
         the counter's plane made the slab WIDER at the back than the block
         standing on it, and taking the side along the block's BASE let it
         stand proud of the block's outline: either way a pale wedge slid out
         from behind the step as the bay left the middle of the frame (Eldar,
         2026-09-22: «позади колонн слева и справа появляются ездящие уши
         белые»). The edge is now the block's outline exactly — its back plane's
         x on the wall's foot line, down to the tread's back corner, forward
         along the tread to the nose, down the riser to the floor — so no part
         of the floor can ever appear outside it. */

      return {x: px(o.x, k(o.z)), drop: !!o.drop,
              y: o.y != null ? py(o.y, k(o.yz)) : yTop};
    };
    const cL = corner(fa, a), cR = corner(fb, b);
    const xTL = cL.x, xTR = cR.x;
    const xBL = px(a, kNear), xBR = px(b, kNear);
    if (Math.max(xTR, xBR) < 0 || Math.min(xTL, xBL) > W) continue;
    const g = ctx.createLinearGradient(0, Math.min(cL.y, cR.y, yTop), 0, H);
    g.addColorStop(0, tone[0]);
    g.addColorStop(1, tone[1]);
    ctx.beginPath();
    // the far edge, left to right, with a step down at a neighbour's bay corner
    ctx.moveTo(cL.x, cL.y);
    if (cL.drop) ctx.lineTo(cL.x, yTop);
    if (cR.drop) ctx.lineTo(cR.x, yTop);
    ctx.lineTo(cR.x, cR.y);
    if (cR.via) for (const p of cR.via) ctx.lineTo(p.x, p.y);
    ctx.lineTo(xBR, H); ctx.lineTo(xBL, H);
    if (cL.via) for (let i = cL.via.length - 1; i >= 0; i--) ctx.lineTo(cL.via[i].x, cL.via[i].y);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    /* Where one floor meets another, lay a joint. Without it the two tones just
       abut along a diagonal and the eye reads a rendering fault rather than a
       change of material. */
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    ctx.lineWidth = 1.4 * SS;
    const jR = cR.via ? cR.via[cR.via.length - 1] : cR;   // the joint starts where the side does
    ctx.beginPath(); ctx.moveTo(jR.x, jR.y); ctx.lineTo(xBR, H); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(jR.x + 1.4 * SS, jR.y); ctx.lineTo(xBR + 1.4 * SS, H); ctx.stroke();
  }
}

function drawLampPool(x, intensity){
  // pool of light on the wall behind a beat, colored by its era — and from
  // 1970 on, by its NEW wiring: white light, not the pioneer amber
  const seg = segAt(x);
  const kk = k(wallZAt(x) - 4);
  const cx = px(x, kk), cy = py(330, kk);
  const r = seg.light.poolR * kk * SS;
  if (cx < -r || cx > W + r) return;
  const pool = (segIdx(x) === 0 && x >= SHIFT(2200)) ? '244,240,228' : seg.light.pool;
  drawGlow(pool, cx, cy - r*0.12, r, seg.light.poolA * intensity);
}

function benchTiles(tex, kk, srcY, srcH, dy, dh, wx0, wx1){
  // world-anchored texture tiles across [wx0..wx1] at depth scale kk
  const tileW = tex.width;   // world units per tile
  const worldLeft = cam.x - (W/2) / (kk * SS);
  let wx = Math.floor(Math.max(wx0, worldLeft) / tileW) * tileW;
  const sxEnd = Math.min(W, px(wx1, kk));
  for (; px(wx, kk) < sxEnd + 2; wx += tileW){
    ctx.drawImage(tex, 0, srcY, tex.width, srcH, px(wx, kk), dy, tileW * kk * SS + 1, dh);
  }
}
/* the line under the counter's lip: a colour of its own six units down the
   front, or — where the era asks for it — a darker shade right on the arris */
function benchRail(seg, x0, yTop, w){
  ctx.fillStyle = seg.rail;
  if (seg.railTop) ctx.fillRect(x0, yTop, w, 2 * SS);
  else ctx.fillRect(x0, yTop + 6 * SS, w, 3 * SS);
}
function drawBench(){
  ctx.save();
  const slices = 14;
  const kf = k(0);
  const yTopF = py(CFG.benchY, kf);
  for (const tb of TABLES){
    const seg = tb.seg, bx0 = tb.x0, bx1 = tb.x1;
    if (onPlate(tb) || sheetOf(tb)) continue;   // a photograph takes this run over
    const sx0f = px(bx0, kf), sx1f = px(bx1, kf);
    if (sx1f <= 0 || sx0f >= W) continue;
    const tex = TEX[seg.bench];
    // tabletop: horizontal slices from back (benchDepth) to front (0)
    for (let s = 0; s < slices; s++){
      const z1 = CFG.benchDepth * (1 - s/slices);
      const z0 = CFG.benchDepth * (1 - (s+1)/slices);
      const k1 = k(z1), k0 = k(z0);
      const y1 = py(CFG.benchY, k1), y0 = py(CFG.benchY, k0);
      const cx0 = Math.max(0, px(bx0, kf)), cx1 = Math.min(W, px(bx1, kf));
      if (cx1 <= 0 || cx0 >= W || cx1 <= cx0) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(cx0, y1, cx1 - cx0, (y0 - y1) + 1); ctx.clip();
      benchTiles(tex, k0, (s/slices)*(tex.height-90), 90, y1, (y0-y1)+1, bx0, bx1);
      ctx.fillStyle = `rgba(8,4,1,${(0.55 * (s? z1/CFG.benchDepth : 0)).toFixed(3)})`;
      ctx.fillRect(cx0, y1, cx1 - cx0, (y0 - y1) + 1);
      ctx.restore();
    }
    // front face — a cabinet is an OBJECT, so it keeps its own height in the
    // world (bench line down to the floor) instead of being stretched to the
    // bottom of the screen. Stretching it meant the doors squashed and
    // stretched as the camera dollied, which the photographic fascia shows
    // plainly: the counter appeared to breathe on every zoom.
    const fx0 = Math.max(0, sx0f), fx1 = Math.min(W, sx1f);
    const yBotF = py(1080, kf);
    const fh = yBotF - yTopF;
    if (fx1 > fx0 && fh > 1){
      ctx.save();
      ctx.beginPath(); ctx.rect(fx0, yTopF, fx1 - fx0, Math.min(H, yBotF) - yTopF); ctx.clip();
      const texF = TEX[seg.front];
      benchTiles(texF, kf, 0, texF.height, yTopF, fh, bx0, bx1);
      const shF = seg.shade != null ? seg.shade : 1;
      const gr = ctx.createLinearGradient(0, yTopF, 0, yBotF);
      gr.addColorStop(0, 'rgba(255,220,160,0.10)');
      gr.addColorStop(0.08, 'rgba(0,0,0,0.0)');
      gr.addColorStop(1, `rgba(0,0,0,${0.75*shF})`);
      ctx.fillStyle = gr; ctx.fillRect(fx0, yTopF, fx1 - fx0, fh);
      // year rail on the table edge
      benchRail(seg, fx0, yTopF, fx1 - fx0);
      ctx.restore();
      // visible table ends
      for (const [ex, edge] of [[bx0, 1], [bx1, -1]]){
        if (ex <= -800 || ex >= WORLD_END + 800) continue;
        const exs = px(ex, kf);
        if (exs < -40 || exs > W + 40) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.fillRect(edge > 0 ? exs : exs - 5*SS, yTopF, 5*SS, fh);
        ctx.fillStyle = 'rgba(255,240,210,0.10)';
        ctx.fillRect(edge > 0 ? exs + 5*SS : exs - 7*SS, yTopF, 2*SS, fh);
      }
    }
  }
  // year marks (per-beat era styling)
  ctx.textAlign = 'center';
  for (const b of BEATS){
    const bx = px(b.x, kf);
    if (bx > -100 && bx < W + 100){
      if (!TABLES.some(tb => b.x >= tb.x0 && b.x <= tb.x1)) continue;  // no table — no etched year
      const seg = segAt(b.x);
      ctx.font = `${Math.round(26*SS)}px ${seg.font}`;
      ctx.fillStyle = seg.railInk;
      ctx.fillRect(bx - 1, yTopF + 2*SS, 2, 14*SS);
      if ((!b.sub || b.under) && !b.plaque) ctx.fillText(b.y, bx, yTopF + 46*SS);   // one row down (at 25 it sat astride the counter's own edge), and far enough above the line under it to keep the caption's own leading
      if (b.under && !b.underHide){
        // a fact parked under the tabletop — quiet, until we find it a home
        ctx.font = `${Math.round(21*SS)}px ${seg.font}`;
        ctx.fillText(sentence(b.t), bx, yTopF + 72*SS);
        ctx.font = `italic ${Math.round(15*SS)}px ${seg.font}`;
        ctx.save(); ctx.globalAlpha = 0.7;
        ctx.fillText(b.th, bx, yTopF + 96*SS);
        ctx.restore();
        pushHit(bx - 200*SS, yTopF + 8*SS, 400*SS, 100*SS, {type:'study', beat: BEATS.indexOf(b)});
      }
      if (b.t === 'TODAY'){
        const pulse = 0.55 + 0.35*Math.sin(state.time*2.4);
        ctx.fillStyle = `rgba(120,215,255,${pulse})`;
        ctx.beginPath(); ctx.arc(bx, yTopF - 8*SS, 5*SS, 0, 7); ctx.fill();
        ctx.font = `${Math.round(20*SS)}px ${seg.font}`;
        ctx.fillStyle = `rgba(120,215,255,${0.5 + 0.3*Math.sin(state.time*2.4)})`;
        ctx.fillText('\u2014 we are here \u2014', bx, yTopF + 68*SS);
      }
    }
  }
  ctx.restore();
}

function drawSprite(sp, x, yCenter, z, wWorld, rotDeg, alpha, hit, sxRivet){
  const kk = k(z);
  const sx = sxRivet != null ? sxRivet : px(x, kk), sy = py(yCenter, kk);
  if (sx < -600 || sx > W + 600) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale/2, sp.w*scale, sp.h*scale, hit);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  // prints carry baked hairlines: they alone pay for the high-quality filter
  ctx.imageSmoothingQuality = 'high';
  ctx.translate(sx, sy);
  if (rotDeg) ctx.rotate(rotDeg * Math.PI/180);
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale/2, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function drawStandingPrint(sp, x, lz, wWorld, hit, lift){
  const kk = k(bz(lz));
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  const sw = sp.w * scale, sh = sp.h * scale;
  const syFoot = py(CFG.benchY - (lift || 2), kk);
  if (hit) pushHit(sx - sw/2, syFoot - sh, sw, sh, hit);
  // contact shadow
  ctx.save();
  ctx.translate(sx, syFoot); ctx.scale(1, 0.22); ctx.translate(-sx, -syFoot);
  const sg = ctx.createRadialGradient(sx, syFoot, 2, sx, syFoot, sw*0.55);
  sg.addColorStop(0, 'rgba(0,0,0,0.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sw*0.55, syFoot - sw*0.55, sw*1.1, sw*1.1);
  ctx.restore();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sp.c, sx - sw/2, syFoot - sh + 6*kk*SS, sw, sh);
  ctx.imageSmoothingQuality = 'medium';
}
function drawLyingPrint(sp, x, lz, wWorld, rotDeg, hit){
  // print lying on the tabletop — bolted to the counter's near plane
  const kk = k(bz(lz));
  const sx = px(x, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale*0.42, sp.w*scale, sp.h*scale*0.42, hit);
  contactShadow(sx, sy + sp.h * scale * 0.10, sp.w * scale * 0.58, 0.26);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rotDeg * Math.PI/180);
  ctx.scale(1, 0.42);                       // foreshortening
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale, sp.w*scale, sp.h*scale);
  ctx.restore();
}

/* THE TYPE GROWS, IT DOES NOT STEP. A flying year's size is a continuous
   function of the camera; rounding it to whole pixels turned that into a
   staircase — the numeral held, jumped a pixel, held again — and every jump
   re-rasterised the glyphs so the letters seemed to tremble. Canvas takes a
   fractional size, so the size stays what the camera says it is. */
function eraFont(sz, style, fam){ return `${style||''} ${(+sz.toFixed(2))}px ${fam || SEGMENTS[0].font}`.trim(); }

/* THE LABEL STANDS WITH WHAT IT NAMES. A plate for three portraits standing on
   a counter belongs on the counter in front of them, not hung on the plaster
   over their heads (Eldar drew the arrow). It is painted here, with the other
   things that stand on the counter, so the counter cannot swallow it. */
function drawBenchPlaque(b){
  const seg = segAt(b.x);

      const kk2 = k(bz(b.plaqueLz));
      /* its own offset: plaqueDX was measured against the wall's plane, and the
         same world step is a far bigger screen step out here on the counter */
      const cx2 = px(b.x + (b.plaqueBenchDX != null ? b.plaqueBenchDX : (b.plaqueDX || 0)), kk2);
      if (cx2 > -600 && cx2 < W + 600){
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = eraFont(23 * kk2 * SS, '', seg.font);   // narrow enough to stand between the cell and the cap
        try { ctx.letterSpacing = `${23*TRACK.plate*kk2*SS}px`; } catch(e){}
        const benchTx = sentence(b.t);
        const wP2 = ctx.measureText(benchTx).width + 46 * kk2 * SS;
        const hP2 = 54 * kk2 * SS;
        const footY2 = py(CFG.benchY - 1, kk2);
        const yP2 = footY2 - hP2;
        contactShadow(cx2, footY2, wP2 * 0.52, 0.26);
        const pg2 = ctx.createLinearGradient(cx2, yP2, cx2, footY2);
        pg2.addColorStop(0, 'rgba(252,253,254,0.97)'); pg2.addColorStop(1, 'rgba(222,227,232,0.97)');
        ctx.fillStyle = pg2;
        ctx.beginPath(); ctx.roundRect(cx2 - wP2/2, yP2, wP2, hP2, 3 * SS); ctx.fill();
        ctx.strokeStyle = 'rgba(120,132,144,0.5)'; ctx.lineWidth = 1.2 * SS;
        ctx.beginPath(); ctx.roundRect(cx2 - wP2/2 + 3*kk2*SS, yP2 + 3*kk2*SS, wP2 - 6*kk2*SS, hP2 - 6*kk2*SS, 2*SS); ctx.stroke();
        // the bevel that says it is a plate and not a card
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(cx2 - wP2/2, yP2, wP2, Math.max(1, 1.2 * SS));
        ctx.fillStyle = 'rgba(44,52,60,0.95)';
        ctx.fillText(benchTx, cx2, yP2 + hP2 * 0.66);
        try { ctx.letterSpacing = '0px'; } catch(e){}
        ctx.restore();
        pushHit(cx2 - wP2/2, yP2, wP2, hP2, {type:'study', beat: BEATS.indexOf(b)});
      }

}
/* ONE TRACKING FOR EVERY TITLE. The line under a year was set at 9 units of
   letter-spacing on a 46-unit face — a fifth of an em, which on a long title
   like FIRST DIGITAL CASE reads as a row of separate letters. It is 5.5
   everywhere now, and a minor beat's title keeps a little more of its size
   (0.78 rather than 0.6) so a stretch of wall does not step up and down. */
/* TRACKING, AS A FRACTION OF THE TYPE'S OWN SIZE. Everything in the hall was
   tracked in world units — 5.5 here, 8 there — which is not a typographic
   measure at all: the same 8 is generous on a 40pt plate and grotesque on a
   15pt line. Letter-spacing belongs in ems, and the accepted ranges are
   narrow: display type sits slightly TIGHT (-0.02em), text sits at 0, small
   labels take +0.02em, and only all-caps genuinely needs +0.05..0.1em, because
   capitals were drawn to stand inside lower-case words and crowd each other
   when set alone. Now that nothing in the hall is shouted, almost nothing
   needs the wide end of that range. */
const TRACK = {title: 0.02, label: 0.03, plate: 0.05};   // display and caps went unused once the hall stopped setting anything in capitals
/* NOTHING IS SHOUTED. The hall was set in full capitals throughout — titles,
   plates, headings, buttons — and Eldar's rule is plain: a word gets one
   capital, at its front, and only if it deserves one. The data keeps its own
   spelling (every lookup in the file is keyed by those titles), so the change
   is made where the words are DRAWN: this turns an all-caps string into a
   sentence, keeping the acronyms as acronyms and the brands as brands. A
   string that already has lower case in it is left exactly as written. */
const CAPS_KEEP = new Set(['AI','PFM','R&D','CAD','CAM','CAD/CAM','CDT','DDS','DMD','PHD','MD',

  CROWNAI:'CrownAI', MARGINAI:'MarginAI', FEDEX:'FedEx', 'FASTSCAN.IO':'fastscan.io',
  'GLIDEWELL.IO':'glidewell.io', 'FASTMILL.IO':'fastmill.io', 'FASTDESIGN.IO':'fastdesign.io',
  NITE:'Nite', HAHN:'Hahn', MISCH:'Misch', RESNIK:'Resnik', TAGGART:'Taggart', PLAYSAFE:'PlaySafe',

    const bare = tok.replace(/^[^A-Z0-9&.]+|[^A-Z0-9&.]+$/g, '');
    const pre = tok.slice(0, tok.indexOf(bare) < 0 ? 0 : tok.indexOf(bare));

    else if (CAPS_KEEP.has(bare) || !/[A-Z]/.test(bare)) out = bare;

      const low = bare.toLowerCase();
      out = started ? low : low.charAt(0).toUpperCase() + low.slice(1);

/* RELIEF. Everything written on a year mark is cut into the wall rather than

   stays where it is.) Eldar's note. */
function letterRelief(a){

     anything blurred reads as a second, rounder letter behind the first. */

   coverage — "2022" set on a bare canvas in the same browser does it at 93px
   and at 280px alike, so it is the rasteriser and not anything in this file.
   Every round apex therefore ends in a flat line one pixel wide, and on the
   hall's largest type that line reads as a cut (Eldar, 2026-09-22: «у годов,
   которые большие, сверху обрезано, как будто бы линия из одного, двух
   пикселей»). Neither a stroke over the fill nor a change of size moves it.
   What does is setting the numeral at twice the size on a sheet of its own and
   laying it down at half: the downsample gives the apex the coverage the
   rasteriser refused it. ONE sheet, kept between frames and only ever grown —
   a canvas per frame is a garbage machine, and at most three years are lettered

  if (!(sizePx > 26) || sizePx > 1400){ ctx.fillText(str, cx, yBase); return; }

    NUM_SHEET.height = Math.max(NUM_SHEET.height, h);

     the sheet and a smaller one after it reads a rectangle that still has the
     big one's rows just outside it. drawImage samples a hair beyond its source
     rectangle when it scales, so those rows bled back in: a faint rule under
     every year and the ghost of a bigger numeral behind it (Eldar, 2026-09-23:
     «что это?»). Clearing a few hundred square pixels three times a frame costs

   screen band rather than from a world coordinate, set wide the way cut letters

   round the perimeter — the same trick the concealed strip in the furniture

     and covering it with the dark face leaves a bright hairline all round it:
     the white body and the dark face are anti-aliased separately, so along every
     edge the white is a shade more covered than the dark that is meant to hide
     it, and what survives is a one-pixel outline. It showed on the unlit years
     too, because even a very faint white body has an edge.

    ctx.font = `100px ${seg.font}`;

    /* year lane: half the distance to the nearest neighbour, minus breathing
       room. A BEAT THAT LETTERS NO YEAR IS NOT A NEIGHBOUR. The lane is the
       room a NUMERAL has on the wall, so it is measured to the numerals either
       side of it — never to a beat that carries its name some other way (a
       plaque beat letters nothing on the plaster: 1970s has its bronze plate,
       2009–13 has the implant and a bench plate). And because one scale is
       shared by a whole era, a single such neighbour shrank every year in the
       room: the moment the implant took 2009–13's place, its 308-unit gap to
       the 2010s halved the white room's numerals, all of them (Eldar,
       2026-09-22: «почему на 2009 и далее поменялось начертание года?»). */
    const fs = 170 * (seg.tScale || 1);
    ctx.font = `${Math.round(fs)}px ${seg.font}`;
    const w = ctx.measureText(b.y).width;
    const j = LETTERED.indexOf(b);
    const pv = j > 0 ? LETTERED[j - 1] : null;
    const nx = j >= 0 && j < LETTERED.length - 1 ? LETTERED[j + 1] : null;
    const lane = Math.max(160, Math.min(pv ? b.x - pv.x : 1e9,
                          nx ? nx.x - b.x : 1e9) - 90);
    b._ys = j < 0 ? 1 : Math.min(1, lane / Math.max(1, w));
  }
  // one shared year scale per era — identical sizes inside each space
  for (const seg of SEGMENTS){
    const era = LETTERED.filter(b => b.x >= seg.x0 && b.x < seg.x1 && !b.sub);
    if (!era.length) continue;
    const m = Math.min(1, ...era.map(b => b._ys));
    era.forEach(b => b._ys = m);
  }
}

/* The welcome inscription lives inside drawWelcomeTV now: the mark, the title,
   the film and the tour line are one composition anchored at one depth, so the
   zoom-out cannot pull them apart. */

/* ---------------- WELCOME FILM · a flat panel on the bench ----------------
   The preview movie plays where the still life used to stand: a plain plasma
   panel with a thin border on a low foot — no chrome, no cyan, the era-1 lamp
   is the only theatre it gets. Autoplay is muted (the browser demands it);
   the first tap turns the sound on, the next taps pause and resume. */
const WELCOME_TV = {x: INTRO_X, lz: 70, w: 490, src: 'media/movie_pre.mp4', posterT: 2.2};   // the instruments on the drape: that shot runs 0.3\u20132.5s, and 3.0 was already the dentist
function initWelcomeTV(){
  const v = document.createElement('video');
  /* versioned: the film is re-graded from time to time and the browser will
     happily keep serving the copy it already has */
  v.src = vurl(WELCOME_TV.src); v.loop = true; v.playsInline = true;
  v.preload = 'auto'; v.muted = true;   // muted = not started yet
  /* NOTHING plays at first: the set holds the film's instruments frame — just
     past the black leader — as its poster. The show starts with the first
     gesture: a tap on the screen, or the first turn of the wheel. Play itself
     starts from the very top. */
  v.addEventListener('loadeddata', () => { if (v.muted){ try { v.currentTime = WELCOME_TV.posterT; } catch(e){} } });
  WELCOME_TV.v = v;
}
function startFilm(){
  const T = WELCOME_TV, v = T.v;
  if (!v || !v.muted) return;
  try { v.currentTime = 0; } catch(e){}
  v.muted = false; T.userPaused = false;
  v.play().catch(() => {
    /* the wheel is not a gesture the browser honours for sound: stay on the
       poster, and the first real touch anywhere starts the show properly */
    v.muted = true;
    try { v.pause(); v.currentTime = 0; } catch(e){}
    if (!T._armed){
      T._armed = true;
      const go = () => { window.removeEventListener('pointerdown', go); startFilm(); };
      window.addEventListener('pointerdown', go);
    }
  });
}
/* One film, many screens. The film is engaged once its sound is on; from then
   on it keeps playing while the visitor travels, and relay panels scattered
   down the rail pick the picture up wherever the welcome set is out of shot.
   Playback lives here, not in the draw: a screen out of the frame must not
   silence (or un-silence) the tape. */
function updateFilm(){
  const T = WELCOME_TV, v = T.v; if (!v) return;
  /* ANY PAGE OVER THE HALL PAUSES THE HALL. It used to be only another voice
     — a playing clip — that stopped the film, so a person's page could open
     with the person already talking while the film went on underneath. Eldar's
     rule: when a page opens, the world behind it fades down and stops, and
     comes back at its own timecode when the page closes. The fade below is
     the same one the film has always used; only the trigger widened. */
  /* the open case is NOT a page: the trays dissolving into digits is a thing
     happening IN the hall, and the film behind it goes on running (Eldar) */
  /* nor is an album opening on the counter, nor an object flying up to be
     looked at: both are things happening IN the hall, and the film behind them
     goes on running with its sound (Eldar again). Only a PAGE stops it. */
  const busy = state.clip || state.person || state.study || state.people || state.docOpen;
  const engaged = !v.muted;                 // sound on = a real showing
  const wanted = engaged && !T.userPaused && !busy;
  // the poster holds its frame: a not-yet-started set snaps back to the
  // instruments if anything (a lost seek, a stray reset) knocked it off
  if (!engaged && v.paused && v.readyState >= 2 &&
      Math.abs(v.currentTime - (T.posterT || 0)) > 0.4){
    try { v.currentTime = T.posterT || 0; } catch(e){}
  }
  /* the film never snaps: it bows out over a second — volume slides down,
     THEN it pauses, holding its place — and slides back up when it returns */
  const dt = state.dt || 0.016;
  // audible only while it is the soundtrack: hall music off, master sound on.
  // With music playing the film keeps rolling, silent — the picture stays.
  const audible = wanted && MUSIC.off && !SOUND.off;
  if (T.vol == null) T.vol = 1;
  T.vol += ((audible ? 1 : 0) - T.vol) * Math.min(1, dt * (audible ? 2.5 : 3.5));
  if (wanted){
    if (v.paused) v.play().catch(()=>{});
  } else if (!v.paused && T.vol < 0.06){
    v.pause();
  }
  try { v.volume = Math.max(0, Math.min(1, T.vol)); } catch(e){}
  // the master switch reaches every other voice in the hall
  if (state.clip && state.clip.v) state.clip.v.muted = SOUND.off;
  if (state.person && state.person.v) state.person.v.muted = SOUND.off;
  if (state.study && state.study.railV) state.study.railV.muted = SOUND.off;
}
/* Relay stands: one every ~1.5 screens of travel, wherever a table span has
   room — never inside a recreation, a cut bay, or a beat's own composition.
   Temporary furniture: the same plain panel everywhere, until each era gets
   its own set (a projector for the craft years, a monitor for the nineties). */
const FILM_RELAYS = [];
function initFilmRelays(){
  /* The film's furniture, era by era — hand-seated, not scattered:
     a 1970s wooden console under its own lamp, hanging tube sets for 1976 and
     1988, a nineties set for 1995, a projector throwing onto the wall for
     1999, a wall plasma between 2009 and the 2010s, a tiled screen wall
     between 2022 and 2023, and a plain panel before the finale.
     Every tube screen is 4:3 — the film keeps its middle, the ears go. */
  FILM_RELAYS.length = 0;
  // the seventies console stands under the first free-standing lamp to the
  // right of the founding bay (the bay itself is a photograph — nothing may
  // stand inside it at depth, or it slides against the painted counter)
  const bayEnd = PLATES.length ? PLATES[0].x + (PLATES[0].w || 0)/2 + 200 : SHIFT(3600);
  const lamp = LIGHT_GRID.map(L => L.x).filter(x => x > bayEnd && x < SHIFT(3450) - 320)
                         .sort((a, b) => a - b)[0];
  FILM_RELAYS.push(
    /* under the lamp, then a step right: the same air on both sides of the
       set — from Jim's things on the left to the PFM stages on the right
       (Eldar, 2026-09-10) */
    {kind: 'crt70',  x: (lamp != null ? lamp : bayEnd + 400) + 95, w: 250},
    /* 1976's hanging set: ABOVE the photograph, not on it. At cy 320 the set
       spanned 189–451 and the frames under it start at 360, so the film covered
       the top half of the right-hand photograph (Eldar, 2026-09-22: «телевизор
       сейчас на фотографии Джима — пусть чуть выше и чуть левее»). At cy 210 it
       spans 79–341 and clears the frames by 19 units. Seated from the year
       rather than from a fixed 6060, so it travels with the block: 560 puts it
       100 units left of the photograph's own dx of 660. */
    {kind: 'hang',   x: (BEATS.find(b => b.y === '1976') || {x: SHIFT(6060) - 560}).x + 560,
     w: 320, cy: 210, era: 0},
    /* 1988's hanging set: centred in the air between the year's last digit and
       the 1989 bay's pilaster, so it touches neither (Eldar) */
    {kind: 'hang',   x: ((BEATS.find(b => b.y === '1988') || {x: REC3_L - 700}).x + 215 + (REC3_L - 60)) / 2, w: 320, cy: 282, era: 1},
    /* НАБОР ДЕВЯНОСТЫХ САДИТСЯ ОТ ГОДА, А НЕ ОТ ЧИСЛА. Он был написан на
       SHIFT(12700), а 1995-й переставляет ритм-проход — они сошлись, и два
       монитора встали один поверх другого: экран с интервью и янтарный CAD
       (Эльдар, 2026-09-23: «три монитора, они закрывают один другого»).
       Теперь киноэкран стоит СПРАВА от года, янтарный — слева на своём dx,
       и между ними всегда полная ширина обоих. */
    {kind: 'crt95', lz: 70, w: 290,
     x: (BEATS.find(b => b.t === 'OPERATORY \u00b7 PLAYSAFE') || {x: SHIFT(12700) - 300}).x + 300},
    /* ПРОЕКТОР САДИТСЯ ОТ ЖУРНАЛОВ, А НЕ ОТ СЫРОЙ КООРДИНАТЫ. Он был написан
       на SHIFT(15330) — то есть где-то около 1999 года, — но годы эры
       переставляет ритм-проход, а реле стоит на месте: они сошлись, и картина
       светила ровно в «R&D is born», будто из-за постамента 2000-го (Эльдар,
       2026-09-23). Теперь левый край картины отмеряется от правого края
       обложек Chairside: правая обложка стоит на dx 340 при ширине 285, плюс
       60 воздуха, плюс полширины картины — и проектор больше никуда не уедет,
       как бы ни переставляли годы. */
    {kind: 'proj',
     x: (BEATS.find(b => b.t === 'CHAIRSIDE PERSPECTIVES') || {x: SHIFT(15330) - 1172}).x + 1172,
     w: 1260, cy: 318},
    /* ЭКРАН СЕРЕДИНЫ ДВУХТЫСЯЧНЫХ САДИТСЯ ОТ 2005-го, А НЕ ОТ 2002-го. Сперва
       я отмерил его от 2002-го — и он всё равно налезал на янтарный монитор:
       эти двое стоят на РАЗНЫХ планах (экран на lz 16, монитор на 130), и
       ближний кажется куда шире, чем говорит его мировая ширина. Разводить их
       внутри одного года бессмысленно; экран уходит к своему году — по
       исходному замыслу он и был «офисный LCD на прилавке перед 2005-м»
       (Эльдар, 2026-09-23). */
    {kind: 'lcd05', lz: 16, w: 235,
     x: (BEATS.find(b => b.t === 'PRISMATIK') || {x: SHIFT(17620) - 150}).x + 150},
    /* 16:9, as a plasma is — larger, and measured on the deep wall (k≈0.39) so
       its top clears the taglines (screen-wise below them) and its bottom stops
       short of the counters' line with a little air */
    {kind: 'plasma', x: SHIFT(22240), w: 880, cy: 648},           // between 2009 and the 2010s — up off the counter
    /* the LED wall hangs from the soffit's second downlight: the rig is four
       panels wide, and its first seam sits exactly under that fitting — the
       wall and the lights share one plane, so the two cannot slide apart */
    {kind: 'vwall',  x: REC4_L + 330 + 660 + 225, w: 900, top: -30, h: 850}   // between 2022 and 2023, where it always stood
  );
  /* ЗАКОН ТЯГОТЕНИЯ ДЛЯ КИНОЭКРАНОВ. Реквизит зала давно проверяется на то,
     что стоит на настоящем пролёте прилавка, а киноэкраны — нет: их писали
     числами, и числа попадали на прилавок случайно. Как только они стали
     отмеряться от своих годов, экран девяностых встал ровно над РАЗРЫВОМ между
     двумя прилавками и повис в воздухе (Эльдар, 2026-09-23). Те из них, что
     стоят на столешнице, теперь зажимаются в ближайший настоящий пролёт — по
     той же арифметике, что и реквизит: полная ширина внутрь, с полями. */
  if (typeof TABLES !== 'undefined' && TABLES.length){
    for (const r of FILM_RELAYS){
      if (!['crt70', 'crt95', 'lcd05', 'proj'].includes(r.kind)) continue;
      /* у проектора w — это ширина КАРТИНЫ на стене, а на прилавке стоит
         машинка шириной 70: считать его по картине значит требовать полтора
         метра столешницы там, где нужна ладонь */
      const half = (r.kind === 'proj' ? 70 : (r.w || 300)) * 0.5 + 24;
      if (TABLES.some(tb => r.x - half >= tb.x0 + 16 && r.x + half <= tb.x1 - 16)) continue;
      let best = null, bd = 1e9;
      for (const tb of TABLES){
        if (tb.x1 - tb.x0 < half * 2 + 48) continue;
        const cx = Math.max(tb.x0 + 16 + half, Math.min(tb.x1 - 16 - half, r.x));
        const d = Math.abs(cx - r.x);
        if (d < bd){ bd = d; best = cx; }
      }
      if (best != null) r.x = best;
    }
  }
  if (DBG) console.log('film screens:', FILM_RELAYS.map(r => r.kind + '@' + (r.x | 0)).join(', '));
}

function drawFilmPanel(x, wWorld, welcome){
  const T = WELCOME_TV, v = T.v;
  /* the welcome set stands on the PHOTOGRAPHED counter, and that counter is
     riveted to the front plane — so the set is too, or the zoom peels them
     apart and the set slides off the edge. It also stands a step back from
     the marble's lip. Relays on the procedural benches keep real depth. */
  const kk = k(welcome ? 8 : T.lz), sx = px(x, kk);
  const sw = wWorld * kk * SS, sh = sw * 9/16;
  if (sx < -sw || sx > W + sw) return null;
  const bez = 13 * kk * SS, neck = 18 * kk * SS, baseH = 13 * kk * SS;
  const footY = py(CFG.benchY - (welcome ? 30 : 2), kk);
  const top = footY - baseH - neck - sh - bez*2;
  const pr = 7 * kk * SS;                       // gently rounded corners
  // contact shadow — the same recipe the standing prints use
  ctx.save();
  ctx.translate(sx, footY); ctx.scale(1, 0.20); ctx.translate(-sx, -footY);
  const sg = ctx.createRadialGradient(sx, footY, 2, sx, footY, sw*0.6);
  sg.addColorStop(0, 'rgba(0,0,0,0.42)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - sw*0.6, footY - sw*0.6, sw*1.2, sw*1.2);
  ctx.restore();
  /* the stand, after the reference set: a short tapered neck flaring into a
     curved gloss base — not a flat bar. The WELCOME set has no foot at all:
     the tour line and its arrow live in that gap instead. */
  if (!welcome){
  const ng = ctx.createLinearGradient(0, footY - baseH - neck, 0, footY);
  ng.addColorStop(0, '#26282c'); ng.addColorStop(0.5, '#101114'); ng.addColorStop(1, '#050607');
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(sx - 13*kk*SS, footY - baseH - neck);
  ctx.lineTo(sx + 13*kk*SS, footY - baseH - neck);
  ctx.lineTo(sx + 21*kk*SS, footY - baseH + 2*SS);
  ctx.lineTo(sx - 21*kk*SS, footY - baseH + 2*SS);
  ctx.closePath(); ctx.fill();
  /* the base plate of the reference: a broad blade arched up to a hub under
     the neck, thick in the middle, tapering to slim tips that sit flat on the
     counter — one solid sweep, not a puck */
  const bL = sx - 118*kk*SS, bR = sx + 118*kk*SS;
  const hub = footY - baseH - 1*kk*SS;
  const bg2 = ctx.createLinearGradient(0, hub, 0, footY);
  bg2.addColorStop(0, '#3d4147'); bg2.addColorStop(0.4, '#191b1f'); bg2.addColorStop(1, '#060708');
  ctx.fillStyle = bg2;
  ctx.beginPath();
  ctx.moveTo(bL, footY - 4*kk*SS);
  ctx.quadraticCurveTo(sx - 42*kk*SS, hub, sx, hub);
  ctx.quadraticCurveTo(sx + 42*kk*SS, hub, bR, footY - 4*kk*SS);
  ctx.quadraticCurveTo(bR - 6*kk*SS, footY, bR - 16*kk*SS, footY);
  ctx.quadraticCurveTo(sx, footY - 1*kk*SS, bL + 16*kk*SS, footY);
  ctx.quadraticCurveTo(bL + 6*kk*SS, footY, bL, footY - 4*kk*SS);
  ctx.closePath(); ctx.fill();
  // the gloss riding the blade's top edge
  ctx.strokeStyle = 'rgba(232,240,247,0.38)'; ctx.lineWidth = 1.6*kk*SS;
  ctx.beginPath();
  ctx.moveTo(bL + 10*kk*SS, footY - 5*kk*SS);
  ctx.quadraticCurveTo(sx - 42*kk*SS, hub + 1*kk*SS, sx, hub + 1*kk*SS);
  ctx.quadraticCurveTo(sx + 42*kk*SS, hub + 1*kk*SS, bR - 10*kk*SS, footY - 5*kk*SS);
  ctx.stroke();
  }
  /* the panel: a gloss-black slab. The bezel carries a sheen falling from the
     top, and the outer edge is drawn by a cool rim light, brightest above —
     the outline of the reference set */
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath(); ctx.roundRect(sx - sw/2 - bez, top, sw + bez*2, sh + bez*2, pr); ctx.fill();
  const sheen = ctx.createLinearGradient(0, top, 0, top + sh + bez*2);
  sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
  sheen.addColorStop(0.18, 'rgba(255,255,255,0.03)');
  sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
  sheen.addColorStop(1, 'rgba(255,255,255,0.05)');
  ctx.fillStyle = sheen;
  ctx.beginPath(); ctx.roundRect(sx - sw/2 - bez, top, sw + bez*2, sh + bez*2, pr); ctx.fill();
  const rim = ctx.createLinearGradient(0, top, 0, top + sh + bez*2);
  rim.addColorStop(0, 'rgba(200,222,238,0.55)');
  rim.addColorStop(0.3, 'rgba(160,178,192,0.20)');
  rim.addColorStop(1, 'rgba(130,140,150,0.14)');
  ctx.strokeStyle = rim; ctx.lineWidth = 1.4*SS;
  ctx.beginPath(); ctx.roundRect(sx - sw/2 - bez + 0.7*SS, top + 0.7*SS, sw + bez*2 - 1.4*SS, sh + bez*2 - 1.4*SS, pr); ctx.stroke();
  // the screen sits in its own dark inset
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 1.2*SS;
  ctx.strokeRect(sx - sw/2 - 1.2*SS, top + bez - 1.2*SS, sw + 2.4*SS, sh + 2.4*SS);
  const vx = sx - sw/2, vy = top + bez;
  ctx.save();

  ctx.fillStyle = '#000';
  ctx.fillRect(vx, vy, sw, sh);
  if (v && v.videoWidth && v.readyState >= 2){
    const s = Math.max(sw / v.videoWidth, sh / v.videoHeight);
    ctx.drawImage(v, sx - v.videoWidth*s/2, vy + sh/2 - v.videoHeight*s/2,
                  v.videoWidth*s, v.videoHeight*s);

    ctx.font = eraFont(15 * kk * SS);
    ctx.fillText('The film', sx, vy + sh/2 + 5*kk*SS);
  }
  if (v && v.readyState >= 2 && (v.muted || T.userPaused)){
    // a thin outlined play mark, not a badge — on the poster and on a pause
    ctx.strokeStyle = 'rgba(252,250,244,0.9)'; ctx.lineWidth = 2*SS;
    ctx.beginPath();
    ctx.moveTo(sx - 9*kk*SS, vy + sh/2 - 15*kk*SS);
    ctx.lineTo(sx + 15*kk*SS, vy + sh/2);
    ctx.lineTo(sx - 9*kk*SS, vy + sh/2 + 15*kk*SS);
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
  pushHit(vx, vy, sw, sh, {type: 'welcomevid'});
  return {sx, kk, footY, top};
}

/* the film, cover-cropped into any rectangle (a 4:3 rect trims the ears),
   plus the tap target and the paused mark — shared by every era screen */
function filmInto(vx, vy, vw, vh, dim, tone){
  const v = WELCOME_TV.v;
  ctx.save();
  ctx.beginPath(); ctx.rect(vx, vy, vw, vh); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(vx, vy, vw, vh);
  if (v && v.videoWidth && v.readyState >= 2){
    const sc = Math.max(vw / v.videoWidth, vh / v.videoHeight);
    if (dim) ctx.globalAlpha = dim;
    ctx.drawImage(v, vx + vw/2 - v.videoWidth*sc/2, vy + vh/2 - v.videoHeight*sc/2,
                  v.videoWidth*sc, v.videoHeight*sc);
    ctx.globalAlpha = 1;
    /* the tube grades the tape — with BLEND FILLS, not ctx.filter: a filter on
       a video draw drops Chrome to the software rasterizer and eats the frame
       budget; a saturation/soft-light fill rides the GPU */
    if (tone === 'bw'){
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = '#808080'; ctx.fillRect(vx, vy, vw, vh);
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(196,210,224,0.05)'; ctx.fillRect(vx, vy, vw, vh);
    } else if (tone === 'color70'){
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = 'rgba(255,0,0,0.42)'; ctx.fillRect(vx, vy, vw, vh);
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = 'rgba(212,166,108,0.45)'; ctx.fillRect(vx, vy, vw, vh);
    } else if (tone === 'washed80'){
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = 'rgba(150,150,150,0.55)'; ctx.fillRect(vx, vy, vw, vh);
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(vx, vy, vw, vh);
    } else if (tone === 'soft'){
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = 'rgba(160,160,160,0.3)'; ctx.fillRect(vx, vy, vw, vh);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (WELCOME_TV.userPaused){
    ctx.strokeStyle = 'rgba(252,250,244,0.9)'; ctx.lineWidth = 2*SS;
    const m = Math.min(vw, vh);
    ctx.beginPath();
    ctx.moveTo(vx + vw/2 - m*0.06, vy + vh/2 - m*0.1);
    ctx.lineTo(vx + vw/2 + m*0.1, vy + vh/2);
    ctx.lineTo(vx + vw/2 - m*0.06, vy + vh/2 + m*0.1);
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
  pushHit(vx, vy, vw, vh, {type: 'welcomevid'});
}

let AMBI = {t: -1, c: '90,200,250'};
function ambiColor(v){
  if (state.time - AMBI.t > 0.7){
    AMBI.t = state.time;
    try {
      if (!AMBI.cv){ AMBI.cv = document.createElement('canvas'); AMBI.cv.width = 4; AMBI.cv.height = 4; }
      const g2 = AMBI.cv.getContext('2d', {willReadFrequently: true});
      g2.drawImage(v, 0, 0, 4, 4);
      const d = g2.getImageData(0, 0, 4, 4).data;
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < 64; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
      /* quantized to 24 steps: glowSprite caches a 256x256 canvas per colour
         STRING, and a freely drifting colour minted a new one every sample —
         an unbounded cache and an allocation every third of a second */
      const q = n => Math.min(255, Math.round(n / 24) * 24);
      AMBI.c = `${q(r/16*1.25)},${q(g/16*1.25)},${q(b/16*1.25)}`;
    } catch(e){}
  }
  return AMBI.c;
