/* THE FIRST AI CROWN, AS A THING BEING MADE. The bay used to hold a monitor
   with a CAD picture on it — the year told as a screenshot. Now it holds a tall
   lit niche, and in the niche the crown assembles itself out of data as you
   arrive: cold points scatter and gather into the silhouette, contour slices
   settle over them, and a white ceramic surface rises through the shape from
   the bottom as a clean horizontal edge. Under it, on its own small plinth in a
   glass cube, the first physical piece — the big one above is where it came
   from. The whole thing runs on the camera, like every other apex here: walk
   in and it builds, walk out and it comes apart again, and nothing restarts.
   The points are the crown's own (sampled once from its silhouette), the
   contours are its own rows, and the ceramic is the crown sprite the hall has
   milled and photographed everywhere else — one object, three states. */
/* WHEN THE CROWN BUILDS. It used to run over the whole approach, so the whole
   assembly happened while the bay before it was still fading down — you came
   out of the dark and the crown was already finished, and the animation had
   happened to nobody. It starts once you are properly inside the bay and
   finishes at its centre: the entire thing plays in the last 420 units. */
function rec18Phase(mid){
  const d = Math.abs(cam.x - mid);
  const u = Math.max(0, Math.min(1, 1 - (d - 60) / 420));
  return u * u * (3 - 2 * u);
}
const AI_VITRINE = {
  /* THE SCREEN IS DRAWN LARGER, NOT ZOOMED. Eldar, 2026-09-22: «увеличь
     (перегенерируй, кодом, не зумом) экран AI». Everything in it — the
     viewport, its grid, the type, the crown, the field of data under it — is
     drawn from world units, so the whole thing is put down through one
     transform about the niche's top centre and comes out at its own resolution
     rather than as a magnified picture. 1.22 is what the panel has room for:
     it grows downward and its foot stops about thirty pixels above the
     counter's line at the bay's own view. */
  grow: 1.22,
  /* AND THE WHOLE BLOCK SITS IN THE MIDDLE OF ITS AIR. With 2018 lettered up on
     the ceiling line there was 125 px between the year and the title and 26 px
     between the screen's foot and the counter — the block was hanging off the
     bottom of its space. Lifted by 113 units of the panel's plane (50 px at the
     bay's own view, 2100×1000) the two gaps are 75 and 76: the same air above
     and below, which is what Eldar's two green arrows ask for (2026-09-22). The
     title moves with it — it is the same block. */
  dy: 113,
  w: 500, top: 112, bot: 792,        // the niche in world units on the panel's plane
  crownW: 375, crownCY: 405,         // the big crown: ~60% of the free height, a little above centre
  smallW: 66, cubeW: 112,            // the physical piece and its glass
  rim: '117,216,255', rimA: 0.55,    // the one cool accent, and how hard it burns
};
/* the crown as a stencil, once: an alpha mask fine enough that even a crown
   drawn eight cells wide still reads as a tooth */
let CROWN_MASK = null;
function crownMask(){
  if (CROWN_MASK) return CROWN_MASK;
  const sp = PED_SPRITES.crown2; if (!sp) return null;
  const M = 40;
  const c = document.createElement('canvas'); c.width = c.height = M;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.drawImage(sp.c, 0, 0, M, M);
  const d = g.getImageData(0, 0, M, M).data;
  const m = new Uint8Array(M * M);
  let top = M, bot = 0, lft = M, rgt = 0;
  for (let y = 0; y < M; y++) for (let x = 0; x < M; x++){
    if (d[(y * M + x) * 4 + 3] > 70){
      m[y * M + x] = 1;
      if (y < top) top = y; if (y > bot) bot = y;
      if (x < lft) lft = x; if (x > rgt) rgt = x;
    }
  }
  // the sprite has air around it; the field wants the tooth itself
  return (CROWN_MASK = {m, M, top, bot, lft, rgt, w: rgt - lft + 1, h: bot - top + 1});
}
/* THE FIELD OF DATA, under the design screen. Its story, in order: noise →
   thirty crowns at once, all different → they thin out → four → they thin out
   → the one crown the machine settled on → noise again. Everything is drawn in
   cells, because what is being shown is not an object but a machine thinking
   about one: pixels and ones and zeros, flickering. */
function drawAiDataField(x0, y0, w, h, t, ph, walked){
  if (w < 20 || h < 10) return;
  const mask = crownMask();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x0, y0, w, h, 4 * SS); ctx.clip();
  ctx.fillStyle = '#05090f'; ctx.fillRect(x0, y0, w, h);
  const cell = Math.max(2, h / 40);   // finer, so a crown eight cells across still reads as one
  const cols = Math.max(10, Math.floor(w / cell)), rows = Math.max(8, Math.floor(h / cell));
  const ox = x0 + (w - cols * cell) / 2, oy = y0 + (h - rows * cell) / 2;
  /* the loop, quicker again: six and a half seconds for the whole story */
  const CYC = 6.5, u = (t % CYC) / CYC;
  const band = (a, b, fi, fo) => Math.max(0, Math.min(1, (u - a) / fi)) * Math.max(0, Math.min(1, (b - u) / fo));
  /* THE ACTS TOUCH. They used to be islands with dark water between them —
     nearly a fifth of the loop where the screen had almost nothing on it, and
     coming out of that darkness took longer than any of the acts. They overlap
     at the joins now, so each dissolves into the next THROUGH the noise, and
     the last act — the pair running the length of the panel — gets the longest
     stretch of the three. */
  const many  = band(0.02, 0.36, 0.05, 0.045);    // a field of them, tiled and drifting
  const four  = band(0.34, 0.65, 0.045, 0.045);   // then four
  const one   = band(0.63, 0.995, 0.045, 0.04);   // then the pair, for as long as the other two together
  /* is cell (cx, cy) inside a crown of `size` cells drawn at (bx, by)? the mask
     is sampled by its own tooth bounding box, so the shape fills its square */
  const maskAt = (gx, gy, size) => {
    if (!mask || gx < 0 || gy < 0 || gx >= size || gy >= size) return false;
    const mx = mask.lft + ((gx + 0.5) / size) * mask.w;
    const my = mask.top + ((gy + 0.5) / size) * mask.h;
    return !!mask.m[(my | 0) * mask.M + (mx | 0)];
  };
  const inCrown = (cxx, cyy, bx, by, size) => maskAt(cxx - bx, cyy - by, size);
  /* AND THEY WRAP. Sliding the crowns with the walk without wrapping them meant
     that two hundred units off the bay's centre every crown had left the panel
     and all that was left was static — which is what Eldar was looking at, and
     why the "transition" felt like a long darkness. The field is a loop the
     width of the panel now: what goes off the right comes back on the left. */
  const wrapIn = (cxx, cyy, bx, by, size) => {
    let gx = (cxx - bx) % cols; if (gx < 0) gx += cols;
    return maskAt(gx, cyy - by, size);
  };
  const noiseP = 0.13 + 0.13 * (1 - Math.max(many, Math.max(four, one)));
  /* EVERY ACT RUNS WITH THE WALK, at twice the speed the bay itself goes past:
     the wallpaper, the four, the pair. That is the whole point of the panel —
     it is a stream going by, and it only reads as one if it moves when you do.
     A slow clock underneath keeps it alive while you stand still. */
  const slide = -((walked || 0) * 2) / cell;
  const glyphRow = (t * 7) | 0;
  /* the digits are SCATTERED, not latticed. Picking them with (31x + 17y) % 13
     lays them on a diagonal of their own, and once the cells were small enough
     that a 5px glyph spilled past its cell, that diagonal read as stripes
     ruled across every crown. They are chosen by the cell's own noise now, and
     only while a cell is big enough to hold a character. */
  const useGlyph = cell >= 5;
  ctx.font = `${Math.max(4, cell * 0.95) | 0}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  // the three layouts, each centred in the field with equal air above and below
  /* THE LAST ACT IS A PAIR, AND THEY TRAVEL WITH YOU. One crown standing in
     the middle of the panel is a picture of a crown; two of them running the
     length of the screen, at twice the speed the bay itself moves past, is the
     stream the machine is drawing out of. The second is the same tooth from a
     different case — the mask flipped and pulled in a little, so it reads as
     another crown rather than a copy of the first. */
  const sizeOne = rows - 2, oneY = 1;
  const onePitch = sizeOne * 2.15;                      // the gap between them a little wider than the tooth itself
  const oneX = (((cols - sizeOne) / 2) + slide) | 0;
  const twoX = (oneX + onePitch) | 0;
  const sizeFour = Math.min(rows - 2, (cols / 4.6) | 0), fourY = ((rows - sizeFour) / 2) | 0;
  const fourStep = cols / 4, fourX = i => ((i + 0.5) * fourStep - sizeFour / 2 + slide) | 0;
  /* THE FIRST ACT IS WALLPAPER. Not a fixed grid of them but a tiled lattice —
     four rows, every other row shifted half a step so the crowns run in
     diagonals, and the whole pattern drifting sideways and wrapping, so there
     is no edge to it and no end: many crowns, endlessly. */
  const MR = 4;
  const manyStepY = Math.max(4, (rows / MR) | 0);
  const sizeMany = Math.max(4, (manyStepY * 0.80) | 0);
  const manyStepX = sizeMany + Math.max(3, (sizeMany * 0.5) | 0);
  const manyTop = ((rows - MR * manyStepY) / 2) | 0;
  const manyDrift = slide + t * manyStepX * 0.10;
  for (let cy2 = 0; cy2 < rows; cy2++){
    for (let cx2 = 0; cx2 < cols; cx2++){
      const seed = cx2 * 374761393 + cy2 * 668265263 + ((t * 8) | 0) * 2654435761;
      let r = (seed ^ (seed >>> 13)) >>> 0; r = (r * 1274126177) >>> 0;
      const rnd = (r >>> 8) / 16777216;
      /* the noise comes UP between the acts, so the crossfade is through
         static rather than through a hole */
      let on = rnd < noiseP, bright = 0.3 + 0.35 * rnd;
      if (one > 0.01 && rnd < 0.25 + 0.75 * one){
        if (wrapIn(cx2, cy2, oneX, oneY, sizeOne)){ on = true; bright = 0.8 + 0.2 * rnd; }
        else {
          // the second case: the same mask read backwards and a shade narrower
          let gx2 = (twoX + sizeOne - 1 - cx2) % cols; if (gx2 < 0) gx2 += cols;
          if (gx2 < sizeOne && maskAt(gx2 * 1.06 - sizeOne * 0.03, cy2 - oneY, sizeOne)){
            on = true; bright = 0.8 + 0.2 * rnd;
          }
        }
      }
      if (four > 0.01){
        for (let i = 0; i < 4; i++)
          if (wrapIn(cx2, cy2, fourX(i), fourY, sizeFour) && rnd < 0.25 + 0.75 * four){
            on = true; bright = 0.7 + 0.3 * rnd; break;
          }
      }
      if (many > 0.01 && !on){
        const gy = cy2 - manyTop;
        if (gy >= 0 && gy < MR * manyStepY){
          const j = (gy / manyStepY) | 0, ly = gy - j * manyStepY;
          if (ly < sizeMany){
            const shift = (j % 2) * manyStepX * 0.5 + manyDrift;
            let lx = (cx2 - shift) % manyStepX;
            if (lx < 0) lx += manyStepX;
            if (maskAt(lx, ly, sizeMany) && rnd < 0.30 + 0.70 * many){
              on = true; bright = 0.6 + 0.4 * rnd;
            }
          }
        }
      }
      if (!on) continue;
      const px2 = ox + cx2 * cell, py2 = oy + cy2 * cell;
      if (useGlyph && rnd > 0.945){
        ctx.fillStyle = `rgba(150,220,255,${(bright * 0.9).toFixed(2)})`;
        ctx.fillText(((cx2 + cy2 + glyphRow) & 1) ? '1' : '0', px2, py2);
      } else {
        ctx.fillStyle = `rgba(117,216,255,${bright.toFixed(2)})`;
        ctx.fillRect(px2, py2, Math.max(1, cell - 1), Math.max(1, cell - 1));
      }
    }
  }
  ctx.textBaseline = 'alphabetic';
  ctx.save();

/* THE DESIGN STATION. The first AI crown existed as a file before it existed
   as anything else, so this is where the year actually happens: fastdesign.io
   on a monitor, and the crown being proposed inside its viewport. Three
   candidates argue, one wins and fills — and only then does it leave the
   screen. The interface is drawn from the product: the wordmark and its tabs,
   the tool rails down both sides, the tooth strips top and bottom, and the
   milling preview waiting at the bottom right. It carries NO product name:

   designed in. What is drawn here is the layout, not the branding. */
function drawDesignStation(b, t){
  const g = b.rig, kk = k(bz(g.lz ?? 120));

  stG.addColorStop(0, '#8b9298'); stG.addColorStop(0.4, '#d5dade'); stG.addColorStop(1, '#7d848a');
  ctx.fillStyle = stG;
  ctx.fillRect(sx - 11 * kk * SS, y0 + H2, 22 * kk * SS, 26 * kk * SS);
  ctx.fillStyle = '#aeb5bb';
  ctx.beginPath(); ctx.ellipse(sx, foot, W2 * 0.17, 5 * kk * SS, 0, 0, 7); ctx.fill();
  // bezel
  ctx.fillStyle = '#e9ecef';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS, 4 * kk * SS);
  else ctx.rect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS);
  ctx.fill();

  const ph = latchedPhase(b.x, 450);
  const F = SEGMENTS[3].font, U = W2;               // one unit = the screen's width

  ctx.beginPath(); ctx.rect(x0, y0, W2, H2); ctx.clip();
  ctx.fillStyle = '#eef1f4'; ctx.fillRect(x0, y0, W2, H2);

  if (fade > 0.01){

    for (let c2 = 0; c2 < 3; c2++){
      ctx.strokeStyle = `rgba(28,110,180,${(fade * (c2 === lead ? 0.8 : 0.24)).toFixed(3)})`;

    ctx.fillStyle = `rgba(244,240,232,${(0.92 * Math.max(0, (ph - 0.62) / 0.38)).toFixed(3)})`;

  }

  for (const ty of [vp.y - H2*0.052, vp.y + vp.h + H2*0.008]){

  ctx.fillStyle = '#2b3844';
  ctx.fillRect(x0 + U*0.018, y0 + H2*0.042, U*0.078, H2*0.034);    // a mark, unnamed
  ctx.fillStyle = '#aeb8c1';

  ctx.fillStyle = '#1f7fd0';
  ctx.fillRect(x0 + U*0.32, y0 + H2*0.050, U*0.044, H2*0.018);
  ctx.fillStyle = '#f0f3f6'; ctx.fillRect(x0 + U*0.40, y0 + H2*0.030, U*0.18, H2*0.058);
  ctx.fillStyle = '#b9c2ca';
  ctx.beginPath(); ctx.arc(x0 + W2 - U*0.085, y0 + H2*0.058, H2*0.030, 0, 7); ctx.fill();
  // and the bottom bar, with the milling preview waiting at the end of it
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y0 + H2*0.905, W2, H2*0.095);
  ctx.fillStyle = '#1f7fd0';
  ctx.fillRect(x0 + U*0.010, y0 + H2*0.915, U*0.045, H2*0.075);
  ctx.fillRect(x0 + W2 - U*0.055, y0 + H2*0.915, U*0.045, H2*0.075);
  ctx.fillStyle = '#b3bcc4';
  ctx.fillRect(x0 + U*0.070, y0 + H2*0.940, U*0.11, H2*0.020);
  ctx.fillRect(x0 + W2 - U*0.180, y0 + H2*0.940, U*0.11, H2*0.020);
  ctx.restore();
  ctx.strokeStyle = 'rgba(120,130,140,0.55)'; ctx.lineWidth = 1.2 * SS;
  ctx.strokeRect(x0 - 4 * kk * SS, y0 - 4 * kk * SS, W2 + 8 * kk * SS, H2 + 8 * kk * SS);
  pushHit(x0, y0, W2, H2, {type: 'focus', beat: nearestBeat(b.x).i, anchor: b.x});
}


let AI_ROBOT_X = null, PENDANT_AT = null, PENDANT_X = null;
/* where a bay photograph put its plinth face this frame, by year — a title

const BAY_LABELS = {};

   coordinate. Stamped with the frame it was measured in: a bay that has been
   culled must not hand last frame's band to the type. */

/* THE PENDANT IS ON THE NEAR PLANE. It was drawn inside the cell, at the cell's
   depth — inside the counters' own depth range — so as the camera moved it slid
   out from behind the counter's end and stood in front of it: behind the table
   from one side of the aisle, in front of it from the other. It stands at the
   plinths' depth now and is painted after the counters, so it is in front of
   the table wherever you look at it from, with its foot at the counter's edge. */
function drawPendant(t){
  /* the counter's end is drawn flat, at its front edge's screen x for every
     depth — so a thing at z 400 must stand well inside the span, or from the
     right side of the aisle it shows in the gap past the end */
  PENDANT_X = FACT_X - 625;                 // half way from the 2018 screen to the first cell (Eldar), still inside the left counter's run
  if (Math.abs(cam.x - PENDANT_X) > 3800) return;
  /* BEHIND THE COUNTER. It stood on the near plane for a day and Eldar sent it
     back — "за стол": it stands on the floor BEHIND the left counter's back
     edge (the counter runs z 0..340; the pendant is at 400), inside the
     counter's own span, and the counter is painted after it — so the stalk
     goes down behind the table and only the box shows above the edge, from
     every camera position alike. */
  const cz = 400, kk = k(cz), S = kk * SS;
  const X = wx => px(wx, kk), Y = wy => py(wy, kk);
  const px2 = X(PENDANT_X);
  if (px2 < -200 || px2 > W + 200) return;
  const PT = 520, PB = 650;
  PENDANT_AT = {x: PENDANT_X, y: (PT + PB) / 2 - 12, z: cz};
  ctx.save();
  contactShadow(px2, Y(1080), 40 * S, 0.30);
  ctx.strokeStyle = 'rgba(168,174,180,0.9)'; ctx.lineWidth = Math.max(1, 6 * S);
  ctx.beginPath(); ctx.moveTo(px2, Y(1080)); ctx.lineTo(px2, Y(PB)); ctx.stroke();
  ctx.fillStyle = '#dcd8cf';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(px2 - 56 * S, Y(PT), 112 * S, (PB - PT) * S, 6 * S);
  else ctx.rect(px2 - 56 * S, Y(PT), 112 * S, (PB - PT) * S);
  ctx.fill();
  ctx.fillStyle = '#1a2b34';
  ctx.fillRect(px2 - 44 * S, Y(PT + 14), 88 * S, 62 * S);
  ctx.fillStyle = 'rgba(120,215,255,0.55)';
  for (let i2 = 0; i2 < 4; i2++) ctx.fillRect(px2 - 38 * S, Y(PT + 22 + i2 * 12), (54 - i2 * 9) * S, 3 * S);
  ctx.fillStyle = 'rgba(196,46,34,0.95)';
  ctx.beginPath(); ctx.arc(px2 - 34 * S, Y(PT + 100), 9 * S, 0, 7); ctx.fill();
  for (let i2 = 0; i2 < 12; i2++){
    ctx.fillStyle = 'rgba(150,156,162,0.7)';
    ctx.fillRect(px2 - 14 * S + (i2 % 6) * 10 * S, Y(PT + 92 + Math.floor(i2 / 6) * 12), 7 * S, 7 * S);
  }
  ctx.restore();
}
/* THE FIRST FILE TRAVELS TOO. Walk on from 2007 and the points of the case
   that became data lift off the cloud on its pedestal — the cloud itself stays,
   turning — and stream ahead of you into the browser window of the digital
   revolution, landing on the scan that window is showing, each one flashing
   as it arrives. Same idea as the 2018→2019 relay below: what crosses the room
   is the file, never the object. (Eldar, 2026-09-10.) */
let PC07 = null, CLOUD_BOX = null, PTS_BOX = null;
function drawDataRelay07(t){
  const b07 = BEATS.find(b => b.y === '2007' && b.ped && b.ped.points);
  if (!b07 || !PC07) return;
  const x07 = b07.x + (b07.ped.dx ?? -430), mid2 = (REC2_L + REC2_R) / 2;
  if (cam.x <= x07 + 40 || cam.x > mid2 + 700) return;
  const u = Math.max(0, Math.min(1, (cam.x - x07 - 40) / (mid2 - x07 - 40)));
  const p = u * u * (3 - 2 * u);
  if (p < 0.01) return;
  crownGeometry();
  if (!CROWN_PTS) return;
  // where they land: the scan drawn in the window's dark screen
  const sp = PED_SPRITES.crown2, kk2 = k(970);
  const cx2 = px(mid2, kk2), cy2 = py(400, kk2);
  const ws = 499 * kk2 * SS, hs = ws * sp.h / sp.w;
  /* where they leave: the cloud's ACTUAL box on screen, as the cloud itself
     reported it this frame — full width and full height, so the stream is as
     tall as the cloud and leaves from its edges (Eldar drew the gap). The
     sampled silhouette is normalised to its own bounds first, so it fills
     that box rather than four fifths of it. */
  if (!PTS_BOX){
    let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
    for (const [ux, uy] of CROWN_PTS){ if (ux < a) a = ux; if (ux > b) b = ux; if (uy < c) c = uy; if (uy > d) d = uy; }
    PTS_BOX = {cx: (a + b) / 2, cy: (c + d) / 2, w: Math.max(1e-3, b - a), h: Math.max(1e-3, d - c)};
  }
  const CB = CLOUD_BOX || {x0: PC07.cx - PC07.size / 2, x1: PC07.cx + PC07.size / 2, y0: PC07.footY - PC07.size * 0.6, y1: PC07.footY};
  const sw0 = (CB.x1 - CB.x0), sh0 = (CB.y1 - CB.y0), scx = (CB.x0 + CB.x1) / 2, scy = (CB.y0 + CB.y1) / 2;
  const head = p * 1.45;
  const leave = Math.min(1, p / 0.10);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pr = Math.max(0.9, 1.4 * SS);
  for (let i = 0; i < CROWN_PTS.length; i++){
    const [ux, uy] = CROWN_PTS[i];
    const h1 = Math.sin(i * 12.9898) * 43758.5453, h2 = Math.sin(i * 78.233) * 12345.678;
    const r1 = h1 - Math.floor(h1), r2 = h2 - Math.floor(h2);
    const q = head - r1 * 0.45;
    if (q <= 0) continue;
    const ex = cx2 + ux * ws, ey = cy2 + uy * hs;
    if (q >= 1){
      // arrived: it sits on the scan and flickers, small, until the walk has carried past
      const settle = Math.max(0, 1 - Math.max(0, p - 0.8) / 0.2);
      const fl = 0.35 + 0.65 * Math.abs(Math.sin(t * (7 + 5 * r2) + i));
      ctx.fillStyle = `rgba(200,236,255,${(0.55 * fl * settle).toFixed(3)})`;
      ctx.fillRect(ex - pr * 0.8, ey - pr * 0.8, pr * 1.6, pr * 1.6);
      continue;
    }
    const sx0 = scx + (ux - PTS_BOX.cx) / PTS_BOX.w * sw0, sy0 = scy + (uy - PTS_BOX.cy) / PTS_BOX.h * sh0;
    // straight across the aisle, like the 2018 relay: a beam of data, not a lob (Eldar)
    const x = sx0 + (ex - sx0) * q + (r2 - 0.5) * 6 * SS;
    const y = sy0 + (ey - sy0) * q + (r1 - 0.5) * 4 * SS;
    const a = leave * (0.25 + 0.75 * Math.sin(q * Math.PI));
    ctx.fillStyle = `rgba(170,220,255,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, pr * (0.7 + 0.6 * r2), 0, 7); ctx.fill();
  }
  ctx.restore();
}
/* THE DATA TRAVELS, NOT THE CROWN. A finished crown used to fly out of the
   2018 bay and into the line — an object crossing the room by itself, which is
   the one thing a crown never does. What actually leaves that bay is a file.
   So the same cold points the vitrine assembled the crown from lift off it as
   you move on, run as a stream across the aisle, and land in the screen of the
   control pendant in front of the first cell, which brightens as they arrive.
   Then the line makes the crown — that is what the cells are for. */
function drawAIRelay(t){
  if (AI_ROBOT_X == null){
    const b = BEATS.find(b2 => b2.y === '2019' && b2.t === 'BRUXZIR FACTORY');
    AI_ROBOT_X = b ? b.x : REC18_R + 720;
  }
  const mid = (REC18_L + REC18_R) / 2;
  const P = PENDANT_AT || {x: AI_ROBOT_X - 562, y: 613, z: 190};
  if (cam.x < mid - 2400 || cam.x > P.x + 1400) return;
  const u = Math.max(0, Math.min(1, (cam.x - mid) / (P.x - mid)));
  const p = u * u * (3 - 2 * u);
  const build = latchedPhase(mid, 450);
  if (build <= 0.28 || p < 0.02) return;
  crownGeometry();
  const V = AI_VITRINE, kv = k(1000);
  const ccx = px(mid, kv), ccy = py(V.crownCY, kv);
  const cw = V.crownW * kv * SS, ch = cw * PED_SPRITES.crown2.h / PED_SPRITES.crown2.w;
  const kp = k(P.z), ex = px(P.x, kp), ey = py(P.y, kp);
  const leave = Math.min(1, (p - 0.02) / 0.12);
  const head = p * 1.45;                            // the stream is ~0.45 long; the head reaches the screen at p≈0.69
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pr = Math.max(0.9, cw * 0.007);
  let arrived = 0;
  for (let i = 0; i < CROWN_PTS.length; i++){
    const [ux, uy] = CROWN_PTS[i];
    const h1 = Math.sin(i * 12.9898) * 43758.5453, h2 = Math.sin(i * 78.233) * 12345.678;
    const r1 = h1 - Math.floor(h1), r2 = h2 - Math.floor(h2);
    const q = head - r1 * 0.45;                     // this point's own progress along the run
    if (q >= 1){ arrived++; continue; }
    if (q <= 0) continue;
    const sx0 = ccx + ux * cw, sy0 = ccy + uy * ch;
    // straight across the aisle, from the crown to the screen — a beam of data, not a lob
    const x = sx0 + (ex - sx0) * q + (r2 - 0.5) * 6 * SS;
    const y = sy0 + (ey - sy0) * q + (r1 - 0.5) * 4 * SS;
    const a = leave * (0.25 + 0.75 * Math.sin(q * Math.PI)) * Math.min(1, build * 1.6);
    ctx.fillStyle = `rgba(${V.rim},${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, pr * (0.7 + 0.6 * r2), 0, 7); ctx.fill();
  }
  // the pendant takes the data behind its back: a halo around it, brightening with what has arrived, then settling
  const got = arrived / CROWN_PTS.length;
  if (got > 0.01){
    const settle = Math.max(0, 1 - Math.max(0, p - 0.72) / 0.28);
    drawGlow(V.rim, ex, ey, 110 * kp * SS * (1 + got), 0.22 * got * (0.4 + 0.6 * settle));
  }
  ctx.restore();
}

/* 1993 · NEWPORT BEACH. The one bay in the hall whose film the company shot
   itself: an architect's computer flythrough of a building that did not exist
   yet, cutting — same angle, single cut — to the same building finished. So the
   panel is a screen, and what stands on the counter in front of it is the
   massing model that flythrough was made from. */
function drawRec93(t){
  const mid = (REC93_L + REC93_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  const kk = k(REC93_Z);
  /* THE PANEL IS A PANEL: a vertical rectangle on the bay's own plane, at the
     bay's own width. It was briefly drawn as a quad with its foot on the floor's
     plane, to make the join — which skewed the white on the WALL, and a strip of
     wall does not lean (Eldar, 2026-09-22: «раньше эта линия была всё время
     вертикально, и так и должно быть; вертикальную линию не надо было
     трогать»). The join is made on the floor's side instead: the floor's far
     corners are drawn at THESE two points (FAR93_L/R in drawFloor). */
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC93_BL, kk), x1 = px(REC93_BR, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#c3cad0');
  wg.addColorStop(0.42, '#dee4e9');
  wg.addColorStop(1, '#979ea5');
  ctx.fillStyle = wg;
  ctx.fillRect(x0, 0, x1 - x0, yBase);
  // the reveal the picture lands in, so the film reads as hung and not floating
  const cx = px(mid, kk);
  // no reveal and no frame: the projector lays its own ground, in exactly the
  // shape of the picture it is about to add
}

/* The massing model. Drawn in cabinet oblique — the projection an architect's
   office actually used before it had a renderer — so it reads as a made object
   on a table and not as a picture of one. One light, upper left: the roofs take
   it full, the faces that turn away lose it in two steps. */
function m93(p, mx, my, mz){
  return [p.ox + (mx - mz * 0.50) * p.s, p.oy - (my - mz * 0.34) * p.s];
}
function quad93(p, pts, tone){
  ctx.fillStyle = tone;
  ctx.beginPath();
  pts.forEach((v, i) => {
    const q = m93(p, v[0], v[1], v[2]);
    i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
  });
  ctx.closePath(); ctx.fill();
}
const T93 = ['#f6f4ef', '#dedad2', '#b3aea6', '#8e8a83'];   // roof, front, side, shade
function box93(p, x0, x1, y0, y1, z0, z1, bands){
  quad93(p, [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], T93[0]);   // roof
  quad93(p, [[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[x1,y0,z0]], T93[2]);   // the side that turns away
  quad93(p, [[x0,y1,z1],[x1,y1,z1],[x1,y0,z1],[x0,y0,z1]], T93[1]);   // the face
  if (!bands) return;
  // three ribbon windows, recessed between the spandrels
  const h = (y1 - y0) / 2;
  for (let i = 0; i < 2; i++){
    const a = y0 + i * h + h * 0.30, b2 = y0 + i * h + h * 0.78;
    quad93(p, [[x0+3,b2,z1],[x1-3,b2,z1],[x1-3,a,z1],[x0+3,a,z1]], T93[3]);
    quad93(p, [[x1,b2,z0+3],[x1,b2,z1-3],[x1,a,z1-3],[x1,a,z0+3]], '#6f6c66');
  }
}
function roundPoly93(pts, rr){
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i + 1) % pts.length], c = pts[(i + 2) % pts.length];
    const d1 = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1, t1 = Math.min(rr / d1, 0.45);
    const d2 = Math.hypot(c[0]-b[0], c[1]-b[1]) || 1, t2 = Math.min(rr / d2, 0.45);
    const s1 = [a[0] + (b[0]-a[0]) * t1, a[1] + (b[1]-a[1]) * t1];
    const e1 = [b[0] - (b[0]-a[0]) * t1, b[1] - (b[1]-a[1]) * t1];
    if (i === 0) ctx.moveTo(s1[0], s1[1]); else ctx.lineTo(s1[0], s1[1]);
    ctx.lineTo(e1[0], e1[1]);
    ctx.quadraticCurveTo(b[0], b[1], b[0] + (c[0]-b[0]) * t2, b[1] + (c[1]-b[1]) * t2);
  }
  ctx.closePath();
}

/* The stand. A soft white slab with a fat rounded edge — the way a model of a
   place is presented when the place is the point, lifted off the floor so you
   look down onto it the way the flythrough looks down onto the building. */
let MODEL93 = null;
function drawModel93(wx, lz, wWorld, topWorldY){
  const kk = k(lz);
  const sx = px(wx, kk);
  const foot = py(topWorldY, kk);
  const XM = 132, ZM = 76;
  const s = wWorld * kk * SS / (XM + ZM * 0.50);
  const p = {s, ox: sx - (XM - ZM * 0.50) * s / 2, oy: foot - ZM * 0.34 * s};
  /* the site is stashed BEFORE the cull: the aeroplane now starts its approach
     while the building is still off the frame to the right, and it needs the
     site's coordinates to fly towards — a stale stash from the last time the
     model was on screen put its parking place in the wrong spot */
  MODEL93 = {p, s, XM, ZM, sx, kk};   // the plane parks on this site, in these units
  if (sx < -500 || sx > W + 500) return;

  // the plinth: the ground plane of the model, oversailed and extruded down
  /* One surface. The site used to be a separate slab laid on top of a separate
     box, and the two never looked like one thing — the card overhung the stand
     on one side and left it bare on the other, which is exactly the cut-and-
     paste look. The stand's top face IS the ground the site is laid out on now,
     so there is no seam between them to misalign. */
  const OV = 0, H = py(1080, kk) - foot;
  const A = m93(p, -2, 0, -2), B = m93(p, XM+2, 0, -2);
  const C = m93(p, XM+2, 0, ZM+2), D = m93(p, -2, 0, ZM+2);
  const rr = 14 * s;
  ctx.save();
  ctx.translate(sx, py(1080, kk)); ctx.scale(1, 0.16); ctx.translate(-sx, -py(1080, kk));
  const gsh = ctx.createRadialGradient(sx, py(1080, kk), 0, sx, py(1080, kk), (XM+2*OV) * s * 0.7);
  gsh.addColorStop(0, 'rgba(0,0,0,0.45)'); gsh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gsh;
  ctx.beginPath(); ctx.arc(sx, py(1080, kk), (XM+2*OV) * s * 0.7, 0, 7); ctx.fill();
  ctx.restore();
  const wallG = ctx.createLinearGradient(0, foot, 0, foot + H);
  wallG.addColorStop(0, '#f0f2f4'); wallG.addColorStop(0.35, '#dfe3e7'); wallG.addColorStop(1, '#a9b0b7');
  ctx.fillStyle = wallG;
  ctx.beginPath();
  ctx.moveTo(D[0], D[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(B[0], B[1] + H); ctx.lineTo(C[0], C[1] + H); ctx.lineTo(D[0], D[1] + H);
  ctx.closePath(); ctx.fill();
  roundPoly93([[A[0], A[1]+H], [B[0], B[1]+H], [C[0], C[1]+H], [D[0], D[1]+H]], rr);
  ctx.fillStyle = '#9ba2a9'; ctx.fill();
  roundPoly93([A, B, C, D], rr);
  const topG = ctx.createLinearGradient(A[0], A[1], C[0], C[1]);
  topG.addColorStop(0, '#ffffff'); topG.addColorStop(1, '#e4e8ec');
  ctx.fillStyle = topG; ctx.fill();


  /* The grounds. A building alone on a plate is a massing study; what the film
     shows is a place — asphalt, a lot with the stalls painted on it, young
     trees that have not filled out yet, and the walk up to the door. Painted
     flat on the ground plane in the same oblique, so it lies down properly. */
  const flat = (x0, x1, z0, z1, tone) => quad93(p, [[x0,0.4,z0],[x1,0.4,z0],[x1,0.4,z1],[x0,0.4,z1]], tone);
  const oval = (mx, mz, ax, az, tone, kerb) => {
    ctx.beginPath();
    for (let i = 0; i <= 30; i++){
      const th = Math.PI * 2 * i / 30;
      const q = m93(p, mx + Math.cos(th) * ax, 0.4, mz + Math.sin(th) * az);
      i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath();
    ctx.fillStyle = tone; ctx.fill();
    if (kerb){ ctx.strokeStyle = kerb; ctx.lineWidth = Math.max(0.8, 1.1 * s); ctx.stroke(); }
  };

  /* The grounds, read off the live footage: a broad pale drive sweeping past
     the entrance around an oval of lawn in a concrete kerb, raised beds of dark
     planting hugging the building, a row of bollards along the walk, and young
     trees everywhere — slender ones, the year they went in. */
  flat(4, XM-4, 4, ZM-4, '#dcded9');                      // lawn
  flat(6, 44, 40, 56, '#a8adb2');                         // the lot, off to one side
  ctx.lineWidth = Math.max(0.6, 0.7 * s);
  ctx.strokeStyle = 'rgba(250,250,248,0.7)';
  for (let i = 0; i < 6; i++){
    const xx = 10 + i * 5.6;
    const a = m93(p, xx, 0.6, 42), b2 = m93(p, xx, 0.6, 54);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
  }
  for (let i = 0; i < 4; i++)
    box93(p, 9 + i * 8.2, 15 + i * 8.2, 0.4, 4.4, 43 + (i % 2) * 6, 52 + (i % 2) * 6, false);
  flat(6, XM-6, 58, ZM-4, '#b7bcc1');                     // the drive across the front
  oval(66, 66, 24, 5.2, '#c6cfc2', 'rgba(245,246,242,0.85)');   // the lawn island in it
  flat(56, 76, 58, 66, '#ced2ce');                        // the walk to the door
  flat(6, 46, 34, 39, '#8e9a8a');                         // beds along the rear bar
  flat(86, XM-6, 34, 39, '#8e9a8a');
  flat(46, 86, 62, 67, '#8e9a8a');                        // and in front of the wing

  /* The building: a long bar with a wing brought forward out of its middle, two
     ribbons of glass, white pilasters at the ends and where the wing meets it,
     a plant room on the rear roof, and two octagonal columns standing free in
     the plaza either side of the wing. */
  box93(p, 6, 126, 0, 30, 10, 34, true);                  // the rear bar
  box93(p, 46, 86, 0, 30, 34, 62, true);                  // the wing, forward
  box93(p, 54, 78, 30, 36, 14, 26, false);                // the plant on the roof
  for (const [px2, zf] of [[5, 34], [39, 34], [86, 34], [119, 34], [45, 62], [79, 62]])
    box93(p, px2, px2 + 7, 0, 32, zf, zf + 5, false);     // pilasters
  // the two octagons out in front
  for (const ox2 of [32, 100]){
    const [ux, uy] = m93(p, ox2, 26, 52), [, ly] = m93(p, ox2, 0, 52);
    const r2 = 6 * s;
    const og = ctx.createLinearGradient(ux - r2, 0, ux + r2, 0);
    og.addColorStop(0, T93[1]); og.addColorStop(0.36, T93[0]); og.addColorStop(1, T93[2]);
    ctx.fillStyle = og;
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const th = Math.PI * 2 * i / 8 + Math.PI / 8;
      const X = ux + Math.cos(th) * r2, Y = uy + Math.sin(th) * r2 * 0.34;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.closePath();
    ctx.lineTo(ux + Math.cos(Math.PI/8) * r2, ly);
    ctx.fillRect(ux - r2, uy, r2 * 2, ly - uy);
    ctx.fill();
    ctx.fillStyle = T93[0];
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const th = Math.PI * 2 * i / 8 + Math.PI / 8;
      const X = ux + Math.cos(th) * r2, Y = uy + Math.sin(th) * r2 * 0.34;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.closePath(); ctx.fill();
  }
  // bollards along the walk
  for (let i = 0; i < 6; i++){
    const bx2 = 57 + i * 3.7;
    const [ux, uy] = m93(p, bx2, 3.6, 64), [, ly] = m93(p, bx2, 0, 64);
    ctx.fillStyle = T93[1];
    ctx.fillRect(ux - 1.2 * s, uy, 2.4 * s, ly - uy);
    ctx.fillStyle = T93[0];
    ctx.beginPath(); ctx.ellipse(ux, uy, 1.2 * s, 0.42 * s, 0, 0, 7); ctx.fill();
  }
  // young trees: slender, high-crowned, the year they went in
  for (const [tx2, tz2, r2] of [[10, 62, 3.6], [24, 70, 3.2], [40, 62, 3.8], [52, 72, 3.0],
                                [80, 72, 3.4], [92, 62, 3.6], [108, 70, 3.2], [124, 62, 3.4],
                                [24, 38, 3.0], [66, 8, 3.4], [104, 38, 3.2], [6, 30, 3.4],
                                [128, 30, 3.2], [46, 30, 2.8]]){
    const [ux, uy] = m93(p, tx2, 0.4, tz2);

    ctx.beginPath(); ctx.ellipse(ux - r2 * 0.28 * s, cy2 - r2 * 0.34 * s, r2 * 0.42 * s, r2 * 0.44 * s, 0, 0, 7); ctx.fill();

/* -------- THE FREIGHTER · 1989 to 1993, and back --------
   The case in the carton went somewhere. The moment the 1989 plinth clears the
   left edge of the frame a 727 comes in low behind it, overtakes the walk,
   settles onto the floor beside the 1993 building and waits there. Push on past
   the middle of 1993 and it turns about and climbs out the way it came. Every
   bit of it is a function of the scroll — there is no clock in it, so it is in
   the same place whenever you come back to it. */
const PLANE93 = {phase: 'idle', t0: 0};
const P93_IN = 4.6, P93_OUT = 2.5;             // the glide in, and the climb out
function drawPlane93(){
  const sp = PROP_SPRITES.ph_plane, P = MODEL93;
  if (!sp || !P) return;
  const mid = (REC93_L + REC93_R) / 2;
  const d = cam.x - mid;
  if (Math.abs(d) > 4200){ PLANE93.phase = 'idle'; return; }
  /* IT FLIES ON ITS OWN CLOCK, ONCE. The walk is only the cue: the bay coming
     in at the right edge of the frame starts the approach, and the bay leaving
     the middle sends it away again. In between it is parked, hidden behind the
     building — so what you see is an aeroplane arriving and leaving, not a
     drawing being dragged along by a scrollbar. */
  /* THE CUES ARE TWO CENTRES (Eldar, 2026-09-10). The approach begins the
     moment the 1989 pedestal — the mailed case on its column — stands in the
     middle of the frame: the aeroplane comes in from the left edge and flies
     right, to park behind a building that is still off the frame. It leaves
     when 1993 itself stands in the middle. */
  const x89 = (REC3_L + REC3_R) / 2;
  switch (PLANE93.phase){
    case 'idle':
      if (cam.x >= x89 - 10 && d < 0){ PLANE93.phase = 'in'; PLANE93.t0 = state.time; pingOnce(PLANE_SND, 0.42, 3200); }
      break;
    case 'in':
      if (state.time - PLANE93.t0 >= P93_IN) PLANE93.phase = 'parked';
      if (cam.x < x89 - 400) PLANE93.phase = 'idle';   // turned back before it got here
      break;
    case 'parked':
      if (d > -30){ PLANE93.phase = 'out'; PLANE93.t0 = state.time; pingOnce(PLANE_SND, 0.40, 2600); }
      break;
    case 'out':
      if (state.time - PLANE93.t0 >= P93_OUT) PLANE93.phase = 'gone';
      break;
    case 'gone':
      if (cam.x < x89 - 400) PLANE93.phase = 'idle';   // walked all the way back past 1989: it can come again
      break;
  }
  if (PLANE93.phase === 'idle' || PLANE93.phase === 'gone') return;
  /* IT LANDS ON THE SITE, NOT ON THE HALL'S FLOOR. At the hall's scale a 727 is
     the size of the counter; on the model's ground plane it is an aeroplane at
     the model's own scale. Everything below is in the model's units, so the
     perspective is the model's too, and it is painted before the model, which
     is why it parks out of sight behind the building. */
  const XPARK = 66, ZL = 8, LIFT = 96;               // a shallow approach: already on finals
  const wPx0 = 74 * P.s;
  /* far enough out to be off the frame, whatever the window: it used to stop at
     a fixed point on the site and simply cease to exist in mid-air */
  const XFAR = Math.min(-760, ((-wPx0 * 2.2 - P.p.ox) / P.p.s) + ZL * 0.5);
  let mx, lift, back = false;
  if (PLANE93.phase === 'in'){
    const u = Math.max(0, Math.min(1, (state.time - PLANE93.t0) / P93_IN));
    const eo = 1 - Math.pow(1 - u, 2.2);              // it comes in and rolls out
    mx = mixN(XFAR, XPARK, eo);
    lift = LIFT * Math.pow(Math.max(0, 1 - u / 0.76), 1.15);
  } else if (PLANE93.phase === 'parked'){
    mx = XPARK; lift = 0;
  } else {
    const u = Math.max(0, Math.min(1, (state.time - PLANE93.t0) / P93_OUT));
    const ei = u * u;
    mx = mixN(XPARK, XFAR, ei);
    lift = LIFT * Math.pow(Math.min(1, u / 0.8), 1.3);
    back = true;
  }
  const wPx = wPx0, hPx = wPx * sp.h / sp.w;          // the site is 132 across
  const pt = m93(P.p, mx, lift, ZL);
  const gpt = m93(P.p, mx, 0, ZL);
  if (pt[0] < -wPx * 2 || pt[0] > W + wPx * 2) return;
  if (lift < LIFT * 0.5){
    const g = 1 - lift / (LIFT * 0.5);
    softFootShadow(gpt[0], gpt[1], wPx * 0.32 * g, hPx * 0.05, 0.40 * g);
  }
  ctx.save();
  if (back){ ctx.translate(pt[0], 0); ctx.scale(-1, 1); ctx.translate(-pt[0], 0); }
  ctx.drawImage(spriteMip(sp, wPx, hPx), pt[0] - wPx / 2, pt[1] - hPx, wPx, hPx);
  ctx.restore();
}
/* -------- AND TWO PASSES THAT DO NOT LAND --------
   These are not tied to the scroll. Reaching the year is the cue; after that
   the aeroplane crosses the frame at its own speed and is gone, whether you
   keep walking, stop, or turn back — which is what an aeroplane passing over
   actually does. It re-arms once the year is well behind you. 1998 goes left to
   right and 2005 brings it back, on a lower line, so the two never run along
   the same rule. */
const PLANE_SND = 'ws13';                      // the longest swell in the set, and used by nothing else
const FLYBYS = [{y: '1998', dir: 1, cy: 178}, {y: '2005', dir: -1, cy: 292}];
const FLY_STATE = {};
const FLY_DUR = 2.3;   // a jet crossing the frame, not drifting over it
function drawFlybys(){
  const sp = PROP_SPRITES.ph_plane; if (!sp) return;
  const z = 640, kk = k(z);
  for (const f of FLYBYS){
    if (!f._b) f._b = BEATS.find(b => b.y === f.y);
    const b = f._b; if (!b) continue;
    const d = Math.abs(cam.x - b.x);
    const st = FLY_STATE[f.y] || (FLY_STATE[f.y] = {t0: -1});
    if (d > 1900){ st.t0 = -1; continue; }            // walked away: it can happen again
    if (st.t0 < 0){
      if (d > 300) continue;                          // the year has to be in the middle of the frame
      st.t0 = state.time;
      pingOnce(PLANE_SND, 0.34, 2600);
    }
    const u = (state.time - st.t0) / FLY_DUR;
    if (u < 0 || u >= 1) continue;
    const wW = 390 * kk * SS, hW = wW * sp.h / sp.w;
    const sx = f.dir > 0 ? mixN(-wW, W + wW, u) : mixN(W + wW, -wW, u);
    const cy = py(f.cy, kk);
    ctx.save();
    ctx.globalAlpha = 0.96;
    if (f.dir < 0){ ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    ctx.drawImage(spriteMip(sp, wW, hW), sx - wW / 2, cy - hW / 2, wW, hW);
    ctx.restore();
  }
}
function drawRec93Front(t){

function drawMapWall(t){
  const mid = (REC_L + REC_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  const kk = k(610);
  /* the bay stands ON its block: panel and pilasters end at the tread's back
     line, at the block's own plane, and the block takes it from there — and the
     background is drawn to the BLOCK's width, so no ledge of floor stands out
     beside it */
  const yBase = py(1040, k(R79_BAY_Z));
  const x0 = px(REC_L, kk), x1 = px(REC_R, kk);

  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#6d6455');
  wg.addColorStop(0.4, '#8a8070');
  wg.addColorStop(1, '#5c5346');
  ctx.fillStyle = wg;

    /* ONE PLANE FOR THE BAY'S OWN EDGE. The background was laid on the panel's
       plane while the pilasters stand on the bay's, so the same world x came
       out at two screen x and a hair of panel slid out from behind the column
       as the camera moved (Eldar, 2026-09-23: «полосочка правой стенки выезжает
       из-за колонны — её край должен быть спрятан за колонной и не двигаться»).

    const kb = k(R79_BAY_Z);

     the nine models now say standing on the counter, and the two together were
     the same idea told twice. The panel keeps its light and its columns; the
     models are the exhibit. */
  const cx = px(mid, kk);
  pushHit(cx - 300*kk*SS, py(180, kk), 600*kk*SS, py(700, kk) - py(180, kk),
          {type:'study', beat: BEATS.findIndex(b => b.y === '1979')});
  /* THE STEP AND THE RUNNER HAVE BOTH LEFT 1979. The step was built here first
     — the models' own block fills this mouth now, and it went on to the bays
     that still show bare floor under their panels (drawBayStep). The red runner
     went with it: a carpet under a row of building models reads as a rug in a

  // pilaster columns on both edges — same plane as the walls they join
  for (const wxc of [REC_L, REC_R]){

       panel, and against the light walls either side they read as a shadow
       laid over the wall rather than as a pilaster — Eldar circled both. They

    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#6f6959'); cg.addColorStop(0.42, '#a79f8c'); cg.addColorStop(1, '#645e50');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, yBase);
    // brass trim on both faces of the pilaster
    ctx.fillStyle = 'rgba(206,164,88,0.55)';
    ctx.fillRect(sxc - cw/2 + 2*SS, 0, 2.2*SS, yBase);
    ctx.fillRect(sxc + cw/2 - 4.2*SS, 0, 2.2*SS, yBase);
    ctx.fillStyle = 'rgba(255,230,180,0.12)';
    ctx.fillRect(sxc - cw/2 + 6*SS, 0, 3*SS, yBase);

     in the room and the columns are on the wall behind them. The eight little

     own stone top, and that stone lands on the hall's bench line. The plant
     they were all folded into stands behind them, its roof reaching exactly
     where the map on the wall used to end — the map itself is gone, because the

  {

      const kG = k(430);

      if (xG < W + wG && xG + wG > -wG){

        ctx.drawImage(spriteMip(gm, wG, hG), xG, yFootG - hG, wG, hG);

         platform's front ledge is a road: the van is at the plinth's left end
         as the bay comes in from the right, dead centre of the building at the
         moment 1979 is centred, and parked at the right end by the time the
         bay has gone past. One mapping, no timers — where the van is says

      const car = PROP_SPRITES.ph_car79;
      if (car){
        const D = 550 + (W / 2) / (kG * SS);   // the camera stands here when the bay is at the screen's edge

        const DW = 0.11, d2 = (u - 0.5) * 2, a2 = Math.abs(d2);

      if (xR < W + wR && xR + wR > -wR) ctx.drawImage(spriteMip(g8, wR, hR), xR, yFoot - hR, wR, hR);

         visit is re-rolled: a little over half the time there is a van, and
         which of the eight it pulls up at is drawn then too, so the same

      const van = PROP_SPRITES.ph_car79;
      if (van && VAN8.run){
        const vh = hR * 0.052, vw = vh * van.w / van.h;
        const vx = xR + VAN8.run.u * wR;
        const vy = (yFoot - hR) + hR * 0.152;   // the front lip of the plinth's own top, where the forecourts end
        if (vx > -vw && vx < W + vw){

          ctx.globalAlpha = 0.35;
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.ellipse(vx, vy, vw * 0.46, Math.max(0.8, vh * 0.13), 0, 0, 7);

          const hw = Math.max(vw, 26 * SS), hh = Math.max(vh * 2.2, 30 * SS);
          pushHit(vx - hw / 2, vy - hh, hw, hh, {type: 'van8'});
