function segIdx(x){ for (let i = SEGMENTS.length-1; i > 0; i--) if (x >= SEGMENTS[i].x0) return i; return 0; }
function segAt(x){ return SEGMENTS[segIdx(x)]; }
function mixN(a,b,t){ return a+(b-a)*t; }
/* the wall recedes continuously within each era */
function wallZAt(x){
  const s = segAt(x);
  const t = Math.max(0, Math.min(1, (x - s.x0) / (s.x1 - s.x0)));
  return s.z0 + (s.z1 - s.z0) * t;
}
/* ambient color/grain, blended across seam zones */
function ambient(x){
  const i = segIdx(x), s = SEGMENTS[i];
  const out = {bg:[...s.bgc], grain:s.grain};
  const blend = (o, t) => { out.bg = out.bg.map((v,j)=>mixN(v,o.bgc[j],t)); out.grain = mixN(out.grain,o.grain,t); };
  if (i+1 < SEGMENTS.length){
    const t = Math.max(0, Math.min(1, (x - (SEGMENTS[i+1].x0 - 500)) / 1000));
    if (t > 0) blend(SEGMENTS[i+1], t);
  }
  if (i > 0){
    const t = Math.max(0, Math.min(1, ((SEGMENTS[i].x0 + 500) - x) / 1000));
    if (t > 0) blend(SEGMENTS[i-1], t);
  }
  return out;
}

/* ---------------- ASSET DECODE ---------------- */
const IMGS = {};   // name -> {el, canvas (processed), w, h}
function loadAssets(){
  const names = Object.keys(window.ASSETS || {});
  return Promise.all(names.map(n => new Promise(res => {
    const el = new Image();
    el.onload = () => { IMGS[n] = {el, w: el.width, h: el.height}; res(); };
    el.onerror = () => { console.warn('asset failed', n); res(); };
    el.src = ASSETS[n];
  })));
}

/* Preprocess: tone + paper/frame + baked shadow, all into offscreen canvases. */
function makePrint(name, opts){
  const src = IMGS[name]; if (!src) return null;
  const style = opts.style || 'frame';    // 'frame' | 'print' | 'metal' | 'print2' | 'plastic'
  const pad = {frame:26, print:16, metal:44, print2:14, plastic:18, white:46}[style];
  const sh = 30;                                 // shadow margin
  const w = src.w + pad*2, h = src.h + pad*2;
  const c = document.createElement('canvas');
  c.width = w + sh*2; c.height = h + sh*2;
  const g = c.getContext('2d');
  // baked drop shadow
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.fillStyle = '#000';
  g.fillRect(sh, sh, w, h);
  g.restore();
  if (style === 'frame'){
    // dark wood frame with bevel
    const fg = g.createLinearGradient(sh, sh, sh, sh+h);
    fg.addColorStop(0, '#3a2a1a'); fg.addColorStop(.5, '#241708'); fg.addColorStop(1, '#170e05');
    g.fillStyle = fg; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,220,160,0.25)'; g.lineWidth = 2;
    g.strokeRect(sh+2, sh+2, w-4, h-4);
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'metal'){
    // 80s office: thin brushed-aluminum frame + white mat
    const mg = g.createLinearGradient(sh, sh, sh+w, sh+h);
    mg.addColorStop(0, '#63676c'); mg.addColorStop(.5, '#2c2f32'); mg.addColorStop(1, '#53575b');
    g.fillStyle = mg; g.fillRect(sh, sh, w, h);
    g.fillStyle = '#e9e8e1'; g.fillRect(sh+10, sh+10, w-20, h-20);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 2;
    g.strokeRect(sh+pad-2, sh+pad-2, src.w+4, src.h+4);
  } else if (style === 'white'){
    // gallery frame: white moulding + wide mat
    g.fillStyle = '#eceae3'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2;
    g.strokeRect(sh+1, sh+1, w-2, h-2);
    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.strokeRect(sh+10, sh+10, w-20, h-20);
    g.fillStyle = '#faf9f5'; g.fillRect(sh+12, sh+12, w-24, h-24);   // mat
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;
    g.strokeRect(sh+pad-3, sh+pad-3, src.w+6, src.h+6);
  } else if (style === 'plastic'){
    // 90s: thin black plastic frame, no mat
    g.fillStyle = '#1b1c1e'; g.fillRect(sh, sh, w, h);
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
    g.strokeRect(sh+1.5, sh+1.5, w-3, h-3);
  } else if (style === 'print2'){
    // crisp lab print, white border
    g.fillStyle = '#f0ede3'; g.fillRect(sh, sh, w, h);
  } else {
    // aged paper print border
    g.fillStyle = '#e8dcc2'; g.fillRect(sh, sh, w, h);
    g.fillStyle = 'rgba(120,90,40,0.12)'; g.fillRect(sh, sh, w, h);
  }
  // photo, era-toned
  g.save();
  g.filter = opts.tone || 'sepia(0.5) saturate(0.75) contrast(1.04) brightness(0.96)';
  g.drawImage(src.el, sh+pad, sh+pad);
  g.restore();
  // warm glass sheen
  const sheen = g.createLinearGradient(sh, sh, sh+w*0.7, sh+h);
  sheen.addColorStop(0, 'rgba(255,235,190,0.10)'); sheen.addColorStop(.4, 'rgba(255,235,190,0.0)');
  g.fillStyle = sheen; g.fillRect(sh+pad, sh+pad, src.w, src.h);
  return {c, w: c.width, h: c.height, inner: {x: sh, y: sh, w, h}};
}

/* ---------------- PROCEDURAL TEXTURES ---------------- */
function noiseTile(size, alpha){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const id = g.createImageData(size, size);
  for (let i = 0; i < id.data.length; i += 4){
    const v = 128 + (Math.random()*2-1)*110;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = alpha*255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function woodTexture({w=1024, h=1024, plank='v', plankSize=170, base='#241708', light='#3d2a13', gapCol='rgba(0,0,0,.55)'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const across = plank === 'v' ? w : h;
  const nP = Math.round(across / plankSize);
  for (let p = 0; p < nP; p++){
    const a0 = p * across / nP, aw = across / nP;
    const tone = 0.75 + Math.random()*0.5;
    g.save();
    if (plank === 'v'){ g.translate(a0, 0); } else { g.translate(0, a0); }
    const grad = g.createLinearGradient(0, 0, plank==='v'?aw:0, plank==='v'?0:aw);
    grad.addColorStop(0, base); grad.addColorStop(.5, light); grad.addColorStop(1, base);
    g.globalAlpha = tone * 0.9;
    g.fillStyle = grad;
    g.fillRect(0, 0, plank==='v'?aw:w, plank==='v'?h:aw);
    // grain streaks along plank
    g.globalAlpha = 1;
    for (let s = 0; s < 26; s++){
      g.strokeStyle = `rgba(${Math.random()<.5?'0,0,0':'255,215,150'},${(Math.random()*0.10+0.03).toFixed(3)})`;
      g.lineWidth = Math.random()*2+0.5;
      g.beginPath();
      const along = plank==='v'?h:w;
      const off = Math.random()*(plank==='v'?aw:aw);
      let px = off, py = -20;
      g.moveTo(plank==='v'?px:py, plank==='v'?py:px);
      for (let t = 0; t < along+40; t += 60){
        px += (Math.random()*2-1)*6;
        py += 60;
        g.lineTo(plank==='v'?px:py, plank==='v'?py:px);
      }
      g.stroke();
    }
    // plank gap
    g.strokeStyle = gapCol; g.lineWidth = 2.5;
    g.beginPath();
    if (plank === 'v'){ g.moveTo(0.5,0); g.lineTo(0.5,h); } else { g.moveTo(0,0.5); g.lineTo(w,0.5); }
    g.stroke();
    g.restore();
  }
  // dirt/noise
  const nz = noiseTile(256, 0.05);
  g.globalAlpha = 1; g.fillStyle = g.createPattern(nz, 'repeat');
  g.fillRect(0,0,w,h);
  return c;
}
function panelTexture({w=1200, h=900, base='#6e6b5e', groove=280}){
  // painted 80s workshop panelling
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.09)');

  vg.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);
  for (let x = groove/2; x < w; x += groove){

    g.fillStyle = 'rgba(255,255,255,0.09)'; g.fillRect(x+3, 0, 2, h);
  }
  for (let i = 0; i < 90; i++){  // scuffs and stains — soft, barely-there
    g.fillStyle = `rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${(Math.random()*0.02).toFixed(3)})`;
    g.beginPath();
    g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*130, 8+Math.random()*26, Math.random()*3, 0, 7);

function formicaTexture({w=1200, h=512, base='#867f71'}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');

    g.fillStyle = `rgba(${Math.random()<.55?'42,40,32':'236,233,222'},${(0.05+Math.random()*0.12).toFixed(3)})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1.7, 1.7);
  }
  const vg = g.createLinearGradient(0,0,0,h);
  vg.addColorStop(0, 'rgba(255,255,255,0.12)');

  vg.addColorStop(1, 'rgba(0,0,0,0.2)');

/* ---------------- INPUT ABSTRACTION ----------------
   Single point where the physical control plugs in.
   A driver pushes: impulse(dv) — velocity kick along the rail (world units/s),
                    action()    — the one button (focus / wake).
   Mouse today, flywheel encoder tomorrow: replace/add a driver, nothing else. */
const Input = (() => {
  let impulse = 0, action = false, anyInput = false, dragging = false;
  const api = {
    hover: null,   // last pointer position in canvas-buffer coords
    consume(){
      const out = {impulse, action, anyInput, dragging};
      impulse = 0; action = false; anyInput = false;
      return out;
    },
    push(dv){ impulse += dv; anyInput = true; },
    act(pt){ action = pt || true; anyInput = true; },
    setDragging(v){ dragging = v; anyInput = true; document.body.classList.toggle('dragging', v); },
  };
  return api;
})();
function toBuf(e){ return {x: e.clientX * (W / innerWidth), y: e.clientY * (H / innerHeight)}; }

function attachMouseDriver(el){
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
    Input.push(d * CFG.wheelGain);
  }, {passive:false});
  let lastX = 0, moved = 0, down = false;
  el.addEventListener('pointerdown', e => { down = true; moved = 0; lastX = e.clientX; Input.setDragging(true); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    Input.hover = toBuf(e);
    if (!down) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    // convert screen drag to world velocity kick (grab the bench, z=0)
    Input.push(-dx * 30);
  });
  el.addEventListener('pointerup', e => {
    down = false; Input.setDragging(false);
    if (moved < 6) Input.act(toBuf(e));  // a click = the button, aimed at a point
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') Input.push(900);
    else if (e.key === 'ArrowLeft') Input.push(-900);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Input.act(); }
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
}

/* ---------------- CAMERA / STATE ---------------- */
const cam = { x: 200, vel: 0, z: 340, zTarget: 340 };   // the tour opens zoomed on the title
const state = {
  mode: 'attract',        // 'attract' | 'live'
  idle: 0,
  attract: { phase: 'dwell', dwell: -2.2, beatIdx: -1, fade: 0 }, // opens holding the title close-up
  focusBeat: -1,          // index of beat we are dollied into
  albumLock: {},          // per-beat album override: true=open, false=closed
  inspect: null,          // a photo lifted to the camera
  restBeat: -1, restTime: 0,
  introHold: true,        // holding the opening close-up until the first move,
  splice: null,           // {dir, t} while the yard splice is playing
  spliceSide: 'L',        // which side of the yard we were on
  time: 0,
};

function nearestBeat(x){
  let best = -1, bd = 1e9;
  for (let i = 0; i < BEATS.length; i++){
    const d = Math.abs(BEATS[i].x - x);
    if (d < bd){ bd = d; best = i; }
  }
  return {i: best, d: bd};
}

/* the long bench is really a row of separate tables */
const BENCH_BREAKS = [1980, 3830, 7350, 9250, 13100, 17900, 21600, 26050]
  .map(x => ({x, half: 65}));
BENCH_BREAKS.push({x: 24190, half: 560});   // the BruxZir Factory line replaces the table
let TABLES = [];
function initTables(){
  // every pedestal claims a wide gap of its own, centered on it
  for (const b of BEATS)
    if (b.ped) BENCH_BREAKS.push({x: b.x + (b.ped.dx ?? -430), half: 330});
  // small breaks inside a pedestal zone would skew its centering — drop them
  const wide = BENCH_BREAKS.filter(v => v.half > 200);
  for (let i = BENCH_BREAKS.length - 1; i >= 0; i--){
    const br = BENCH_BREAKS[i];
    if (br.half <= 200 && wide.some(p => Math.abs(p.x - br.x) < p.half + 430))
      BENCH_BREAKS.splice(i, 1);
  }
  // fixed table objects step aside from any gap they would straddle,
  // then a spread pass keeps them from piling onto each other
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    const dodge = it => {
      const half = (it.w || 300) * 0.9 + 40;
      for (const br of BENCH_BREAKS){
        const x = b.x + it.dx;
        if (Math.abs(x - br.x) < br.half + half){
          const dir = x >= br.x ? 1 : -1;
          it.dx = br.x + dir * (br.half + half) - b.x;
        }
      }
    };
    items.forEach(dodge);
    items.sort((p, q) => p.dx - q.dx);
    for (let n = 1; n < items.length; n++){
      const need = ((items[n-1].w||300) + (items[n].w||300)) * 0.5 + 60;
      if (items[n].dx - items[n-1].dx < need){
        items[n].dx = items[n-1].dx + need;
        dodge(items[n]);
      }
    }
  }
  TABLES = [];
  for (const seg of SEGMENTS){
    const bx0 = (seg.x0 <= -2500 && !seg.bInsetL) ? seg.x0 : seg.x0 + (seg.bInsetL || 140);
    const bx1 = (seg.x1 >= WORLD_END + 800 && !seg.bInsetR) ? seg.x1 : seg.x1 - (seg.bInsetR || 140);
    let start = bx0;
    for (const br of BENCH_BREAKS.filter(v => v.x + v.half > bx0 && v.x - v.half < bx1).sort((a,b)=>a.x-b.x)){
      const L = br.x - br.half, R = br.x + br.half;
      if (R <= start + 120) continue;
      if (L > start + 240) TABLES.push({x0: start, x1: L, seg});
      start = Math.max(start, R);
    }
    if (bx1 > start + 240) TABLES.push({x0: start, x1: bx1, seg});
  }
}

/* ---------------- RENDER SETUP ---------------- */
const cv = document.getElementById('view');
const ctx = cv.getContext('2d', {alpha:false});
let W = 0, H = 0, SS = 1;  // canvas px, and scale ref->canvas
let RQ = 1;   // adaptive render quality (drops on weak hardware)
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
  W = cv.width = Math.round(innerWidth * dpr * RQ);
  H = cv.height = Math.round(innerHeight * dpr * RQ);
  SS = H / CFG.refH;
  VIG = null;
}
window.addEventListener('resize', resize);

let TEX = {};        // procedural textures
const GLOWS = {};
function glowSprite(col){
  if (GLOWS[col]) return GLOWS[col];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 2, 128, 128, 128);
  rg.addColorStop(0, `rgba(${col},1)`);
  rg.addColorStop(0.45, `rgba(${col},0.30)`);
  rg.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  return GLOWS[col] = c;
}
function drawGlow(col, cx, cy, r, alpha, squashY){
  if (alpha <= 0.004 || r <= 0) return;
  const sy = squashY || 1;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(glowSprite(col), cx - r, cy - r*sy, r*2, r*2*sy);
  ctx.globalAlpha = 1;
}
let HITS = [];       // clickable screen rects, rebuilt every frame
function pushHit(x, y, w, h, payload){
  if (x > W || y > H || x + w < 0 || y + h < 0) return;
  HITS.push({x, y, w, h, p: payload});
}
function hitAt(px_, py_){
  for (let i = HITS.length - 1; i >= 0; i--){
    const r = HITS[i];
    if (px_ >= r.x && px_ <= r.x + r.w && py_ >= r.y && py_ <= r.y + r.h) return r.p;
  }
  return null;
}
const SPRITES = {};  // processed photo sprites
const grains = [];

let BR = 0;   // camera breath — render-only micro-drift so a resting frame never freezes
function k(z){ return CFG.F / (CFG.F + z - cam.z); }
function px(x, kk){ return W/2 + (x - cam.x - BR) * kk * SS; }
function py(y, kk){ return (CFG.horizon + (y - CFG.horizon) * kk) * SS; }

/* ---------------- SCENE DRAWING ---------------- */
function drawWall(){
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));  // hidden behind bench anyway
  for (const seg of SEGMENTS){
    const wx0 = seg.x0 + (seg.wInsetL || 0), wx1 = seg.x1 - (seg.wInsetR || 0);
    const sx0 = Math.max(0, px(wx0, k(wallZAt(wx0)))), sx1 = Math.min(W, px(wx1, k(wallZAt(wx1))));
    if (sx1 <= 0 || sx0 >= W || sx1 <= sx0) continue;
    const tex = TEX[seg.wall];
    const tileW = tex.width * 0.9;   // world units per tile
    ctx.save();
    ctx.beginPath(); ctx.rect(sx0, 0, sx1 - sx0, yBase); ctx.clip();
    const worldLeft = cam.x - (W/2) / (k(seg.z0) * SS);
    let wx = wx0 + Math.max(0, Math.floor((worldLeft - wx0) / tileW)) * tileW;
    for (; px(wx, k(wallZAt(wx))) < sx1 + 2; wx += tileW){
      const kk = k(wallZAt(wx + tileW/2));   // per-tile depth: smooth recession
      const yBot = seg.floor ? Math.min(yBase, py(1080, kk)) : yBase;
      ctx.drawImage(tex, px(wx, kk), 0, tileW * kk * SS * 1.03, yBot);
    }
    // the far wall stands on a visible floor — the room reads huge
    if (seg.floor){
      const kk2 = k(wallZAt((wx0 + wx1) / 2));
      const yWallBase = py(1080, kk2);
      if (yWallBase < yBase){
        const fg = ctx.createLinearGradient(0, yWallBase, 0, yBase);
        fg.addColorStop(0, '#a9aeb3');
        fg.addColorStop(0.12, '#8f959a');
        fg.addColorStop(1, '#54585d');
        ctx.fillStyle = fg;
        ctx.fillRect(sx0, yWallBase, sx1 - sx0, yBase - yWallBase);
      }
    }
    // ambient darkening top and bottom of wall — each era keeps its own gloom
    const sh = seg.shade != null ? seg.shade : 1;
    const gr = ctx.createLinearGradient(0, 0, 0, yBase);
    gr.addColorStop(0, `rgba(5,2,0,${0.85*sh})`);
    gr.addColorStop(0.3, `rgba(5,2,0,${0.25*sh})`);
    gr.addColorStop(0.75, `rgba(5,2,0,${0.18*sh})`);
    gr.addColorStop(1, `rgba(5,2,0,${0.6*sh})`);
    ctx.fillStyle = gr; ctx.fillRect(sx0, 0, sx1 - sx0, yBase);
    ctx.restore();
  }
}

function drawLampPool(x, intensity){
  // pool of light on the wall behind a beat, colored by its era
  const seg = segAt(x);
  const kk = k(wallZAt(x) - 4);
  const cx = px(x, kk), cy = py(330, kk);
  const r = seg.light.poolR * kk * SS;
  if (cx < -r || cx > W + r) return;
  drawGlow(seg.light.pool, cx, cy - r*0.12, r, seg.light.poolA * intensity);
}

function benchTiles(tex, kk, srcY, srcH, dy, dh, wx0, wx1){
  // world-anchored texture tiles across [wx0..wx1] at depth scale kk
  const tileW = tex.width;   // world units per tile
  const worldLeft = cam.x - (W/2) / (kk * SS);
  let wx = Math.floor(Math.max(wx0, worldLeft) / tileW) * tileW;
  const sxEnd = Math.min(W, px(wx1, kk));
  for (; px(wx, kk) < sxEnd + 2; wx += tileW){
    ctx.drawImage(tex, 0, srcY, tex.width, srcH, px(wx, kk), dy, tileW * kk * SS + 1, dh);
  }
}
function drawBench(){
  const slices = 14;
  const kf = k(0);
  const yTopF = py(CFG.benchY, kf);
  for (const tb of TABLES){
    const seg = tb.seg, bx0 = tb.x0, bx1 = tb.x1;
    const sx0f = px(bx0, kf), sx1f = px(bx1, kf);
    if (sx1f <= 0 || sx0f >= W) continue;
    const tex = TEX[seg.bench];
    // tabletop: horizontal slices from back (benchDepth) to front (0)
    for (let s = 0; s < slices; s++){
      const z1 = CFG.benchDepth * (1 - s/slices);
      const z0 = CFG.benchDepth * (1 - (s+1)/slices);
      const k1 = k(z1), k0 = k(z0);
      const y1 = py(CFG.benchY, k1), y0 = py(CFG.benchY, k0);
      const cx0 = Math.max(0, px(bx0, kf)), cx1 = Math.min(W, px(bx1, kf));
      if (cx1 <= 0 || cx0 >= W || cx1 <= cx0) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(cx0, y1, cx1 - cx0, (y0 - y1) + 1); ctx.clip();
      benchTiles(tex, k0, (s/slices)*(tex.height-90), 90, y1, (y0-y1)+1, bx0, bx1);
      ctx.fillStyle = `rgba(8,4,1,${(0.55 * (s? z1/CFG.benchDepth : 0)).toFixed(3)})`;
      ctx.fillRect(cx0, y1, cx1 - cx0, (y0 - y1) + 1);
      ctx.restore();
    }
    // front face
    const fx0 = Math.max(0, sx0f), fx1 = Math.min(W, sx1f);
    if (fx1 > fx0){
      ctx.save();
      ctx.beginPath(); ctx.rect(fx0, yTopF, fx1 - fx0, H - yTopF); ctx.clip();
      const texF = TEX[seg.front];
      benchTiles(texF, kf, 0, texF.height, yTopF, H - yTopF, bx0, bx1);
      const shF = seg.shade != null ? seg.shade : 1;
      const gr = ctx.createLinearGradient(0, yTopF, 0, H);
      gr.addColorStop(0, 'rgba(255,220,160,0.10)');
      gr.addColorStop(0.08, 'rgba(0,0,0,0.0)');
      gr.addColorStop(1, `rgba(0,0,0,${0.75*shF})`);
      ctx.fillStyle = gr; ctx.fillRect(fx0, yTopF, fx1 - fx0, H - yTopF);
      // year rail on the table edge
      ctx.fillStyle = seg.rail;
      ctx.fillRect(fx0, yTopF + 6*SS, fx1 - fx0, 3*SS);
      ctx.restore();
      // visible table ends
      for (const [ex, edge] of [[bx0, 1], [bx1, -1]]){
        if (ex <= -800 || ex >= WORLD_END + 800) continue;
        const exs = px(ex, kf);
        if (exs < -40 || exs > W + 40) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(edge > 0 ? exs : exs - 9*SS, yTopF, 9*SS, H - yTopF);
        ctx.fillStyle = 'rgba(255,240,210,0.14)';
        ctx.fillRect(edge > 0 ? exs + 9*SS : exs - 11*SS, yTopF, 2*SS, H - yTopF);
      }
    }
  }
  // year marks (per-beat era styling)
  ctx.textAlign = 'center';
  for (const b of BEATS){
    const bx = px(b.x, kf);
    if (bx > -100 && bx < W + 100){
      if (!TABLES.some(tb => b.x >= tb.x0 && b.x <= tb.x1)) continue;  // no table — no etched year
      const seg = segAt(b.x);
      ctx.font = `${Math.round(26*SS)}px ${seg.font}`;
      ctx.fillStyle = seg.railInk;
      ctx.fillRect(bx - 1, yTopF + 2*SS, 2, 14*SS);
      if (!b.sub) ctx.fillText(b.y, bx, yTopF + 42*SS);
      if (b.t === 'TODAY'){
        const pulse = 0.55 + 0.35*Math.sin(state.time*2.4);
        ctx.fillStyle = `rgba(120,215,255,${pulse})`;
        ctx.beginPath(); ctx.arc(bx, yTopF - 8*SS, 5*SS, 0, 7); ctx.fill();
        ctx.font = `${Math.round(20*SS)}px ${seg.font}`;
        ctx.fillStyle = `rgba(120,215,255,${0.5 + 0.3*Math.sin(state.time*2.4)})`;
        ctx.fillText('— WE ARE HERE —', bx, yTopF + 68*SS);
      }
    }
  }
}

function drawSprite(sp, x, yCenter, z, wWorld, rotDeg, alpha, hit){
  const kk = k(z);
  const sx = px(x, kk), sy = py(yCenter, kk);
  if (sx < -600 || sx > W + 600) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale/2, sp.w*scale, sp.h*scale, hit);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(sx, sy);
  if (rotDeg) ctx.rotate(rotDeg * Math.PI/180);
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale/2, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function drawStandingPrint(sp, x, lz, wWorld, hit){
  const kk = k(lz);
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  const sw = sp.w * scale, sh = sp.h * scale;
  const syFoot = py(CFG.benchY - 2, kk);
  if (hit) pushHit(sx - sw/2, syFoot - sh, sw, sh, hit);
  // contact shadow
  ctx.save();
  ctx.translate(sx, syFoot); ctx.scale(1, 0.22); ctx.translate(-sx, -syFoot);
  const sg = ctx.createRadialGradient(sx, syFoot, 2, sx, syFoot, sw*0.55);
  sg.addColorStop(0, 'rgba(0,0,0,0.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sw*0.55, syFoot - sw*0.55, sw*1.1, sw*1.1);
  ctx.restore();
  ctx.drawImage(sp.c, sx - sw/2, syFoot - sh + 6*kk*SS, sw, sh);
}
function drawLyingPrint(sp, x, lz, wWorld, rotDeg, hit){
  // print lying on the tabletop at depth lz — foreshortened
  const kk = k(lz);
  const sx = px(x, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale*0.42, sp.w*scale, sp.h*scale*0.42, hit);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rotDeg * Math.PI/180);
  ctx.scale(1, 0.42);                       // foreshortening
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function eraFont(sz, style, fam){ return `${style||''} ${Math.round(sz)}px ${fam || SEGMENTS[0].font}`.trim(); }

function drawBeatText(b, focusAmt){
  const seg = b.ink ? Object.assign({}, segAt(b.x), {ink: b.ink}) : segAt(b.x);
  const wz = wallZAt(b.x);
  const dxW = b.x - cam.x;
  const near = Math.max(0, 1 - Math.abs(dxW)/1300);
  const sc = b.minor ? 0.6 : 1;
  // only the flagged landmark beats fly out — and only the nearest one at a time;
  // everything else stays painted on the wall
  let fly = !!b.fly;
  if (fly) for (const o of BEATS)
    if (o !== b && o.fly && Math.abs(o.x - cam.x) < Math.abs(dxW)){ fly = false; break; }
  if (fly){
    const passed = Math.max(0, Math.min(1, -dxW/560));   // 1 = far behind us
    const zT = 150 + (wz - 150) * Math.pow(1 - near, 1.7);
    const kk = k(zT);
    const cx = px(b.x, kk);
    const rise = 0;   // dissolve in place — no climbing into the lamps
    const alpha = Math.min(1, near*2.4) * (1 - passed);
    if (alpha > 0.01 && cx > -1200 && cx < W + 1200){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = eraFont(150 * kk * SS, '', seg.font);
      ctx.fillStyle = `rgba(${seg.ink},${(0.55 + 0.4*near) * alpha})`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 8*SS; ctx.shadowOffsetY = 4*SS;
      ctx.fillText(b.y, cx, py(185 - rise, kk));

      try { ctx.letterSpacing = `${9*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.5 + 0.45*near) * 0.92 * alpha})`;
      ctx.fillText(b.t, cx, py(248 - rise, kk));
      try { ctx.letterSpacing = '0px'; } catch(e){}

        ctx.font = eraFont(28 * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${(near-0.3)/0.7 * 0.72 * alpha})`;
        drawLines(b._th, cx, py(300 - rise, kk), 36 * kk * SS);
      }
      ctx.restore();
    }
  } else {
    // static wall text; it steps back while a flying neighbour holds the air
    let flyDim = 1;
    for (const f of BEATS){
      if (!f.fly || Math.abs(f.x - b.x) > 1200) continue;
      const dxF = f.x - cam.x;
      const nF = Math.max(0, 1 - Math.abs(dxF)/1300);
      const pF = Math.max(0, Math.min(1, -dxF/560));
      flyDim = Math.min(flyDim, 1 - 0.78 * Math.min(1, nF*2.4) * (1 - pF));
    }
    const kk = k(wz - 8);
    const cx = px(b.x, kk);
    if (cx > -900 && cx < W + 900){
      ctx.globalAlpha = flyDim;
      ctx.save();
      ctx.textAlign = 'center';
      if (b.sub){
        // a satellite of its year-stand: an arrow grows from the leader's numeral
        const lx = px(b.sub + 200, kk);
        const aA = Math.max(0, near*1.6 - 0.2) * 0.5;
        if (aA > 0.02){
          const yL = py(150, kk);
          ctx.strokeStyle = `rgba(${seg.ink},${aA})`;
          ctx.lineWidth = 2*SS;
          ctx.beginPath(); ctx.moveTo(lx, yL); ctx.lineTo(cx - 30*kk*SS, yL); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - 30*kk*SS, yL);
          ctx.lineTo(cx - 48*kk*SS, yL - 9*SS);
          ctx.lineTo(cx - 48*kk*SS, yL + 9*SS);
          ctx.closePath();
          ctx.fillStyle = `rgba(${seg.ink},${aA})`;
          ctx.fill();

      } else {
        ctx.font = eraFont(170 * sc * (seg.tScale||1) * (b._ys||1) * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${(0.5 + 0.45*near)*(b.minor?0.82:1)})`;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6*SS; ctx.shadowOffsetY = 3*SS;
        ctx.fillText(b.y, cx, py(b.minor ? 170 : 140, kk));
      }
      ctx.font = eraFont(46 * sc * (seg.tScale||1) * kk * SS, '', seg.font);
      try { ctx.letterSpacing = `${9*sc*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.45 + 0.5*near)*0.92})`;
      ctx.fillText(b.t, cx, py(b.minor ? 212 : 208, kk));
      try { ctx.letterSpacing = '0px'; } catch(e){}
      if (near > 0.25){
        ctx.font = eraFont(30 * (b.minor?0.8:1) * (seg.tScale||1) * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${(near-0.25)/0.75 * 0.72})`;
        drawLines(b._th, cx, py(b.minor ? 254 : 262, kk), 38 * (b.minor?0.8:1) * kk * SS);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  // description — anchored to the wall, appears at rest / focus
  let dAmt = Math.max(focusAmt, state.restBeat === BEATS.indexOf(b) ? Math.min(1, Math.max(0, (state.restTime - 0.7)/0.8)) : 0);
  if (b.album) dAmt *= 1 - (albumAnim[BEATS.indexOf(b)] || 0);
  if (dAmt > 0.02){

    drawLines(b._d, cw, py(655, kw), 34 * kw * SS);
    ctx.restore();
  }
}

function wrapCalc(text, maxW){
  const words = text.split(' ');
  let line = '', lines = [];
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLines(lines, cx, y, lh){
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i*lh);
}
/* line breaks are computed once at a reference size — they never re-flow */
function cacheWrap(){
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    const seg = segAt(b.x);
    ctx.font = `italic 100px ${seg.font}`;
    b._th = wrapCalc(b.th, 100 * 500/30);
    ctx.font = `100px ${seg.font}`;
    b._d = wrapCalc(b.d, 100 * 700/26);
    // year lane: half the distance to the nearest neighbour, minus breathing room
    const sc = (b.minor ? 0.6 : 1) * (seg.tScale || 1);
    const fs = 170 * sc;
    ctx.font = `${Math.round(fs)}px ${seg.font}`;
    const w = ctx.measureText(b.y).width;
    const lane = Math.min(i > 0 ? b.x - BEATS[i-1].x : 1e9,
                          i < BEATS.length-1 ? BEATS[i+1].x - b.x : 1e9) - 90;
    b._ys = Math.min(1, lane / Math.max(1, w));
  }
}

  const sp = MAP_SPRITE;
  const w = 440 * kk * SS, h = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(450, kk);
  pushHit(cx - w/2, cyS - h/2, w, h, {type:'photo', sp, wx: mid, cy: 450, z: 610, w: 440,
          cap: '1979 · nine labs across Southern California', beat: BEATS.findIndex(b => b.y === '1979')});
  ctx.drawImage(sp.c, cx - w/2, cyS - h/2, w, h);
  // columns on both edges
  for (const wxc of [REC_L, REC_R]){
    const kc = k(430);
    const sxc = px(wxc, kc);
    const cw = 110 * kc * SS;
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#2a2118'); cg.addColorStop(0.45, '#5a4c38'); cg.addColorStop(1, '#1d1710');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, H);
    ctx.fillStyle = 'rgba(255,230,180,0.12)';
    ctx.fillRect(sxc - cw/2 + 3*SS, 0, 3*SS, H);

}

/* doorways between eras — near-camera portals you pass through */
function drawDoorway(){
  const z = -460, kk = k(z);
  for (const seam of SEAMS){
    const cxSeam = px(seam.x, kk);
    if (seam.kind === 'video'){
      // the hall sinks into darkness at its end — the yard is hidden until the clip plays
      const kw = k(wallZAt(seam.x + 400));
      const cxS = px(seam.x + 400, kw);
      const halfD = 540 * kw * SS;
      if (cxS > -halfD - W && cxS < W + halfD + W){
        const g = ctx.createLinearGradient(cxS - halfD, 0, cxS + halfD, 0);
        g.addColorStop(0, 'rgba(3,3,3,0)');
        g.addColorStop(0.32, 'rgba(3,3,3,0.985)');
        g.addColorStop(0.68, 'rgba(3,3,3,0.985)');
        g.addColorStop(1, 'rgba(3,3,3,0)');
        ctx.fillStyle = g;
        ctx.fillRect(cxS - halfD, 0, halfD*2, H);
      }
    } else if (seam.kind === 'light'){
      // crossing into the white era is pure light: a soft veil, no geometry
      const d = Math.abs(cam.x + BR - seam.x);
      const v = Math.max(0, 1 - d/420);
      if (v > 0.01){
        const e = v*v*(3-2*v);
        ctx.fillStyle = `rgba(244,250,255,${(0.85*e).toFixed(3)})`;
        ctx.fillRect(0, 0, W, H);
      }
    } else {
      // a single column on the threshold — one pillar, light passing on both sides
      const halfC = 210 * kk * SS, core = 92 * kk * SS;
      if (cxSeam < -halfC - W || cxSeam > W + halfC + W) continue;
      const g = ctx.createLinearGradient(cxSeam - halfC, 0, cxSeam + halfC, 0);
      g.addColorStop(0, 'rgba(4,3,2,0)');
      g.addColorStop(0.5 - core/(2*halfC), 'rgba(4,3,2,0.97)');
      g.addColorStop(0.5 + core/(2*halfC), 'rgba(4,3,2,0.97)');
      g.addColorStop(1, 'rgba(4,3,2,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cxSeam - halfC, 0, halfC*2, H);
      // rim light on the column: the era behind on one flank, the era ahead on the other
      ctx.fillStyle = `rgba(${seam.back},0.22)`;
      ctx.fillRect(cxSeam - core - 3*SS, 0, 3*SS, H);
      ctx.fillStyle = `rgba(${seam.ahead},0.24)`;
      ctx.fillRect(cxSeam + core, 0, 3*SS, H);
    }
  }
}

const DUST = [];
function initDust(){
  for (const b of [{x:INTRO_X}, ...BEATS.filter(b => segAt(b.x).dust)]){
    for (let i = 0; i < 14; i++){

        bx: b.x, ox: (Math.random()*2-1)*330, y: 60 + Math.random()*560,

function drawDust(t){
  ctx.save();

    const x = d.bx + d.ox + Math.sin(t*0.3 + d.ph)*24;
    const kk = k(d.z);
    const sx = px(x, kk);
    if (sx < -50 || sx > W + 50) continue;
    const y = (d.y + Math.sin(t*d.spd*0.06 + d.ph)*30 + t*d.spd) % 640;

    ctx.beginPath(); ctx.arc(sx, sy, d.r*kk*SS, 0, 7); ctx.fill();

}

/* lamps hanging over each beat */
function lampFlicker(t, seed){
  return 0.86 + 0.10*Math.sin(t*11 + seed*7) * Math.sin(t*2.7 + seed*3) + 0.04*Math.sin(t*23 + seed);
}
function drawLamp(x, t, seed){
  const kk = k(240);

  if (sx < -300 || sx > W + 300) return 0;

/* crown-ish lathe mesh for the wireframe / point cloud */
const MESH = (() => {
  const prof = [[0,66],[30,62],[42,48],[46,26],[42,2],[34,-18],[30,-38],[36,-56],[20,-64],[0,-66]];
  const M = 14, rings = [];
  for (let m = 0; m < M; m++){
    const a = m/M * Math.PI*2, ring = [];
    for (const [r, y] of prof) ring.push([r*Math.cos(a), -y, r*Math.sin(a)]);
    rings.push(ring);
  }
  return {rings, M, P: prof.length};
})();
function projMesh(rot){
  const out = [];
  const ca = Math.cos(rot), sa = Math.sin(rot);
  for (const ring of MESH.rings){
    const pr = [];
    for (const [x,y,z] of ring){
      const rx = x*ca - z*sa, rz = x*sa + z*ca;
      const pp = 1 / (1 + rz/420);
      pr.push([rx*pp, y*pp + rz*0.06, rz]);
    }
    out.push(pr);
  }
  return out;
}
function drawScreenCAD(g, r, t, amber){
  // phosphor wireframe crown, slowly turning — green or amber
  const dim = amber ? 'rgba(160,120,40,0.25)' : 'rgba(70,160,110,0.25)';
  g.fillStyle = amber ? '#130d04' : '#06130a'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = dim; g.lineWidth = 1;
  for (let i = 1; i < 6; i++){ // faint grid
    g.beginPath(); g.moveTo(r.x, r.y + r.h*i/6); g.lineTo(r.x + r.w, r.y + r.h*i/6); g.stroke();
    g.beginPath(); g.moveTo(r.x + r.w*i/6, r.y); g.lineTo(r.x + r.w*i/6, r.y + r.h); g.stroke();
  }
  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(t*0.5);
  g.lineWidth = Math.max(1, s*1.1);
  for (let m = 0; m < MESH.M; m++){
    const a = pts[m], b = pts[(m+1) % MESH.M];
    for (let p = 0; p < MESH.P; p++){
      const depth = (a[p][2] + 70) / 140;   // 0 near .. 1 far
      g.strokeStyle = `rgba(${amber ? '255,190,90' : '120,235,160'},${(0.75 - 0.55*depth).toFixed(2)})`;
      if (p < MESH.P-1){
        g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);
        g.lineTo(cx + a[p+1][0]*s, cy + a[p+1][1]*s); g.stroke();
      }
      g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);
      g.lineTo(cx + b[p][0]*s, cy + b[p][1]*s); g.stroke();
    }
  }
  g.fillStyle = amber ? 'rgba(255,205,120,0.85)' : 'rgba(140,240,175,0.85)';
  g.font = `${Math.max(8, 9*s)}px monospace`;
  g.textAlign = 'left';
  g.fillText(amber ? 'CEREC 1 · chairside' : 'CAD · crown 14 · milling queue', r.x + 8*s, r.y + r.h - 8*s);
  // scanlines
  g.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = r.y; y < r.y + r.h; y += 3) g.fillRect(r.x, y, r.w, 1);
}
function drawScreenScan(g, r, t){
  // blue point-cloud of an intraoral scan arriving
  g.fillStyle = '#060a12'; g.fillRect(r.x, r.y, r.w, r.h);
  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(-t*0.35);
  const reveal = (t*0.13) % 1.25;           // cloud keeps re-assembling
  let n = 0, total = MESH.M * MESH.P;
  for (let m = 0; m < MESH.M; m++){
    for (let p = 0; p < MESH.P; p++){
      n++;
      if (n/total > reveal) break;
      const q = pts[m][p];
      const depth = (q[2] + 70) / 140;
      g.fillStyle = `rgba(110,190,255,${(0.9 - 0.6*depth).toFixed(2)})`;
      g.fillRect(cx + q[0]*s, cy + q[1]*s, Math.max(1, 1.6*s*(1-depth*0.5)), Math.max(1, 1.6*s*(1-depth*0.5)));
    }
  }
  g.fillStyle = 'rgba(140,200,255,0.85)';
  g.font = `${Math.max(8, 9*s)}px monospace`;
  g.textAlign = 'left';
  g.fillText(`receiving scan … ${Math.min(100, Math.round(reveal/1.0*100))}%`, r.x + 8*s, r.y + r.h - 8*s);
}
function drawMonitor(p, x, z, wWorld, t){
  const mon = MONS[p.kind]; if (!mon) return;
  const kk = k(z);
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / mon.w) * kk * SS;
  const syFoot = py(CFG.benchY - 2, kk);
  const dx = sx - mon.w*scale/2, dy = syFoot - mon.foot*scale;
  pushHit(dx, dy, mon.w*scale, mon.h*scale, {type:'focus', beat: BEATS.findIndex(bb => (bb.props||[]).includes(p))});
  ctx.drawImage(mon.c, dx, dy, mon.w*scale, mon.h*scale);
  // live screen
  const r = {x: dx + mon.screen.x*scale, y: dy + mon.screen.y*scale,
             w: mon.screen.w*scale, h: mon.screen.h*scale};
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  if (p.kind === 'crt') drawScreenCAD(ctx, r, t, p.col === 'amber'); else drawScreenScan(ctx, r, t);
  ctx.restore();
  // screen light spills into the room
  const glow = p.kind === 'crt' ? (p.col === 'amber' ? '235,170,80' : '110,220,150') : '110,180,255';
  const flick = 0.8 + 0.2*Math.sin(t*9 + x);
  drawGlow(glow, r.x + r.w/2, r.y + r.h/2, r.w*1.6, 0.10*flick);
}

/* Every important camera moment is a guarded zone. Anything from the near or
   mid plane that would sit across it gets moved or removed — checked in code,
   not by eye, so new content can never reintroduce the collision. */
function auditPlacements(){
  const guards = [];
  for (const b of BEATS){
    if (b.ped){
      const pedX = b.x + (b.ped.dx ?? -430);
      guards.push({c: pedX + (b.x - pedX) * 0.35, r: 750, pedX, pedZ: -90});
    }
    if (!b.minor) guards.push({c: b.x, r: 420});
  }
  guards.push({c: 11050, r: 620});   // the splice stop
  guards.push({c: 12500, r: 620});   // the splice resume
  // near plane: a passer-by parks at screen center when cam ≈ its x
  for (let i = FG_ITEMS.length - 1; i >= 0; i--){
    if (guards.some(g => Math.abs(FG_ITEMS[i].x - g.c) < g.r * 1.3)){
      console.warn('audit: foreground item removed at', FG_ITEMS[i].x);
      FG_ITEMS.splice(i, 1);
    }
  }
  // mid plane: a figure crosses a pedestal or a wall photo on screen at one
  // camera position — that position must stay outside the guarded window
  const kOf = z => 900 / (900 + z);
  const crossTargets = guards.filter(g => g.pedX)
    .map(g => ({x: g.pedX, z: g.pedZ, c: g.c, r: g.r}));
  for (const b of BEATS)
    for (const it of b.wall)
      crossTargets.push({x: b.x + it.dx, z: wallZAt(b.x) - 12, c: b.x, r: 520});
  for (const f of FIGURES){
    for (const g of crossTargets){
      const kP = kOf(g.z), kF = kOf(f.z);
      if (Math.abs(kP - kF) < 0.05){
        // near-same depth: they simply must not overlap in world space
        for (let tries = 0; tries < 10 && Math.abs(f.x - g.x) < 430; tries++) f.x += 240;
        continue;
      }
      for (let tries = 0; tries < 10; tries++){
        const cross = (g.x * kP - f.x * kF) / (kP - kF);
        if (Math.abs(cross - g.c) > g.r * 1.05) break;
        f.x += 240;
        if (tries === 9) console.warn('audit: figure could not fully clear target near', g.x);
      }
    }
  }
}
function drawSheets(){
  for (const sh of SHEETS){
    if (Math.abs(sh.x - cam.x) > 2200) continue;
    const kk = k(wallZAt(sh.x) - 10);
    const sx = px(sh.x, kk);
    if (sx < -300 || sx > W + 300) continue;
    const scale = (sh.w / sh.sprite.w) * kk * SS;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(sx, py(sh.cy, kk));
    ctx.rotate(sh.rot * Math.PI/180);
    ctx.drawImage(sh.sprite.c, -sh.sprite.w*scale/2, -sh.sprite.h*scale/2,
                  sh.sprite.w*scale, sh.sprite.h*scale);
    ctx.restore();
  }
}
function drawFigures(){
  for (const f of FIGURES){
    if (Math.abs(f.x - cam.x) > 2200) continue;
    const kk = k(f.z);
    const sx = px(f.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (f.h / f.sprite.h) * kk * SS;
    const syFoot = py(f.seated ? 900 : 1080, kk);
    ctx.globalAlpha = 0.92;
    ctx.drawImage(f.sprite.c, sx - f.sprite.w*scale/2, syFoot - f.sprite.h*scale,
                  f.sprite.w*scale, f.sprite.h*scale);
    ctx.globalAlpha = 1;
  }
}
function drawProps(midPass){
  for (const p of PROPS){
    if ((!!p.mid) !== !!midPass) continue;
    if (Math.abs(p.x - cam.x) > 2200) continue;
    const sp = PROP_SPRITES[p.kind];
    const kk = k(p.z);
    const sx = px(p.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (p.w / sp.w) * kk * SS;
    const syFoot = p.mid ? py(1080, kk) : py(CFG.benchY - 2, kk);
    ctx.save();
    if (p.flip){ ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    ctx.globalAlpha = 0.95;
    ctx.drawImage(sp.c, sx - sp.w*scale/2, syFoot - sp.h*scale, sp.w*scale, sp.h*scale);
    ctx.restore();
  }
}

function makeAlbumSpread(pair, tone){
  const c = document.createElement('canvas'); c.width = 800; c.height = 520;
  const g = c.getContext('2d');
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 14; g.shadowOffsetY = 7;
  g.fillStyle = '#e9e0c8'; g.fillRect(16, 16, 768, 478);
  g.restore();
  for (let i = 0; i < 4; i++){   // stacked page edges
    g.fillStyle = `rgba(120,100,60,${0.25 - i*0.05})`;
    g.fillRect(16 - i*2, 490 + i*2, 768 + i*4, 2);
  }
  // gutter
  const gut = g.createLinearGradient(360, 0, 440, 0);
  gut.addColorStop(0, 'rgba(90,70,40,0)'); gut.addColorStop(.5, 'rgba(60,45,25,0.4)'); gut.addColorStop(1, 'rgba(90,70,40,0)');
  g.fillStyle = gut; g.fillRect(360, 16, 80, 478);
  // photos on pages, photo-corner mounts
  pair.forEach((name, side) => {
    const im = IMGS[name]; if (!im) return;
    const cx = side ? 592 : 208, cy = 250;
    const fit = Math.min(300/im.w, 380/im.h);
    const w = im.w*fit, h = im.h*fit;
    g.save();
    g.translate(cx, cy); g.rotate((side ? 1 : -1) * 0.015);
    g.fillStyle = '#f4f0e2'; g.fillRect(-w/2-10, -h/2-10, w+20, h+20);
    g.filter = tone;
    g.drawImage(im.el, -w/2, -h/2, w, h);
    g.filter = 'none';
    g.fillStyle = 'rgba(40,25,10,0.5)';
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([qx,qy]) => {
      g.beginPath();
      g.moveTo(qx*(w/2+10), qy*(h/2+10));
      g.lineTo(qx*(w/2+10) - qx*26, qy*(h/2+10));
      g.lineTo(qx*(w/2+10), qy*(h/2+10) - qy*26);
      g.closePath(); g.fill();
    });
    g.restore();
  });
  return {c, w: c.width, h: c.height};
}
function initAlbums(){
  const tone = 'sepia(0.5) saturate(0.75) contrast(1.04)';
  BEATS.forEach((b, i) => {
    if (!b.album) return;
    ALBUM_SPRITES[i] = {
      cover: makeAlbumCover(b.album.title, segIdx(b.x)),
      spreads: b.album.photos.map(pair => makeAlbumSpread(pair, tone)),
    };
    albumAnim[i] = 0;
  });
}
function drawAlbum(b, i, t, dt){
  const A = ALBUM_SPRITES[i]; if (!A) return;
  const lockV = state.albumLock[i];
  if (Math.abs(b.x - cam.x) > 900) delete state.albumLock[i];
  const open = lockV === true ||
    (lockV !== false && ((state.restBeat === i && state.restTime > 0.5) || state.focusBeat === i));
  albumAnim[i] += ((open ? 1 : 0) - albumAnim[i]) * Math.min(1, dt*4);
  const a = albumAnim[i];
  const kk = k(b.album.lz);
  const sx = px(b.x + b.album.dx, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const ease = a*a*(3-2*a);
  const hw = b.album.w * (1 + 0.9*ease) * kk * SS;
  pushHit(sx - hw/2, sy - hw*0.5, hw, hw*0.52, {type:'album', beat: i});
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-4 * Math.PI/180);
  ctx.scale(1, 0.42);
  if (ease < 0.97){                       // closed cover
    const w = b.album.w * kk * SS * (1 - 0.12*ease);
    const h = w * A.cover.h / A.cover.w;
    ctx.globalAlpha = 1 - ease;
    ctx.drawImage(A.cover.c, -w/2, -h, w, h);
  }
  if (ease > 0.03){                       // open spread
    const sp = A.spreads[(t/4.5|0) % A.spreads.length];
    const w = b.album.w * 1.55 * kk * SS * (0.75 + 0.25*ease);
    const h = w * sp.h / sp.w;
    ctx.globalAlpha = ease;
    ctx.drawImage(sp.c, -w/2, -h, w, h);
  }
  ctx.restore();
}

function drawPedestal(b, t, hero){
  const ped = b.ped; if (!ped) return;
  const z = -90, kk = k(z);
  const x = b.x + (ped.dx ?? -430);
  const sx = px(x, kk);
  const colW = 165 * (ped.big ? 1.5 : 1) * kk * SS;
  if (sx < -colW*2 || sx > W + colW*2) return;
  const era = segIdx(b.x);
  const big = ped.big ? 1.6 : 1;
  const yTop = py(ped.big ? 470 : (ped.low ? 668 : 535), kk);
  pushHit(sx - colW*0.7*big, yTop - 150*kk*SS*big, colW*1.4*big, H - yTop + 150*kk*SS, {type:'focus', beat: BEATS.indexOf(b)});
  const warmC = era === 0 ? '255,215,140' : '225,240,255';
  // two side spotlights swing in and lock their beams exactly on the exhibit;
  // brightness peaks AT the object, then the light falls away
  if (hero > 0.02){
    const lock = Math.min(1, hero * 1.7);
    const objSprite = PED_SPRITES[ped.obj];
    const objH = 120 * (ped.big ? 1.6 : 1) * kk * SS * objSprite.h / objSprite.w;
    const yObj = yTop - objH * 0.6;
    const yEnd = yTop + (H - yTop) * 0.5;
    for (const s of [-1, 1]){
      const fx = sx + s * colW * 3.0;                    // the fixture, up top
      // beam direction: straight down -> through the exhibit, by lock
      const xEnd = fx + ((sx - fx) * (yEnd / Math.max(1, yObj))) * lock;
      const tObj = Math.max(0.05, Math.min(0.92, yObj / yEnd));
      const beam = ctx.createLinearGradient(0, 0, 0, yEnd);
      beam.addColorStop(0, `rgba(${warmC},${(0.03*hero).toFixed(3)})`);
      beam.addColorStop(tObj, `rgba(${warmC},${(0.22*hero*lock).toFixed(3)})`);
      beam.addColorStop(Math.min(1, tObj + 0.25), `rgba(${warmC},${(0.07*hero).toFixed(3)})`);
      beam.addColorStop(1, `rgba(${warmC},0)`);
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(fx - colW*0.22, 0);
      ctx.lineTo(fx + colW*0.22, 0);
      ctx.lineTo(xEnd + colW*0.62, yEnd);
      ctx.lineTo(xEnd - colW*0.62, yEnd);
      ctx.closePath(); ctx.fill();
      // the fixture itself
      ctx.fillStyle = 'rgba(20,20,22,0.9)';
      ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
      ctx.fillStyle = `rgba(${warmC},${(0.75*hero).toFixed(2)})`;
      ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
    }
    // the hot spot where both beams meet the exhibit
    drawGlow(warmC, sx, yObj, objH * 1.6, 0.22 * lock * hero);
  }
  // column
  const cg = ctx.createLinearGradient(sx - colW/2, 0, sx + colW/2, 0);
  if (era === 0){
    cg.addColorStop(0, '#241408'); cg.addColorStop(.45, '#43290f'); cg.addColorStop(1, '#180d05');
  } else if (era === 3){
    cg.addColorStop(0, '#c3c8cc'); cg.addColorStop(.45, '#eef1f3'); cg.addColorStop(1, '#a9aeb3');
  } else {
    cg.addColorStop(0, '#5e6266'); cg.addColorStop(.45, '#9aa0a4'); cg.addColorStop(1, '#4a4e52');
  }
  ctx.fillStyle = cg;
  ctx.fillRect(sx - colW/2, yTop, colW, H - yTop);
  // top plate
  ctx.fillStyle = era === 0 ? '#5b3a17' : (era === 3 ? '#f4f6f8' : '#c9ced2');
  ctx.beginPath();
  ctx.ellipse(sx, yTop, colW*0.62, 10*kk*SS, 0, 0, 7);
  ctx.fill();
  // the object
  const obj = PED_SPRITES[ped.obj];
  const ow = 120 * big * kk * SS, oh = ow * obj.h / obj.w;
  ctx.drawImage(obj.c, sx - ow/2, yTop - oh - 4*kk*SS, ow, oh);
  // glass dome: one clean outline, the sheen lives on the glass itself
  ctx.strokeStyle = 'rgba(235,245,255,0.30)';
  ctx.lineWidth = 1.6*SS;
  ctx.beginPath();
  ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.52, oh*1.22, 0, Math.PI, 0);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3*SS;
  ctx.beginPath();
  ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.42, oh*1.04, 0, Math.PI*1.12, Math.PI*1.42);
  ctx.stroke();

}

/* a freestanding table plane, rotated in plan — any yaw, anywhere on the floor */
function drawYawedTable(cx, cz, yawDeg, wW, dW, topY, hW, tone){
  const a = yawDeg * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const P = (lx, lz) => {                     // local table coords -> screen
    const wx = cx + lx*ca - lz*sa, wz = cz + lx*sa + lz*ca;
    return {x: px(wx, k(wz)), kt: k(wz), z: wz};
  };
  const c1 = P(-wW/2, -dW/2), c2 = P(wW/2, -dW/2), c3 = P(wW/2, dW/2), c4 = P(-wW/2, dW/2);
  const top = (p) => py(topY, p.kt), bot = (p) => py(topY + hW, p.kt);
  // legs/skirt: the two faces whose outer edge is nearest the camera
  const faces = [[c1, c2], [c2, c3], [c3, c4], [c4, c1]]
    .filter(([p, q]) => (p.z + q.z)/2 <= cz)       // faces angled toward us
    .sort((f, g) => (g[0].z + g[1].z) - (f[0].z + f[1].z));
  for (const [p, q] of faces){
    const g = ctx.createLinearGradient(0, top(p), 0, bot(p));
    g.addColorStop(0, tone.side0); g.addColorStop(1, tone.side1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x, top(p)); ctx.lineTo(q.x, top(q));
    ctx.lineTo(q.x, bot(q)); ctx.lineTo(p.x, bot(p));
    ctx.closePath(); ctx.fill();
  }
  // the top plane
  ctx.fillStyle = tone.top;
  ctx.beginPath();
  ctx.moveTo(c1.x, top(c1)); ctx.lineTo(c2.x, top(c2));
  ctx.lineTo(c3.x, top(c3)); ctx.lineTo(c4.x, top(c4));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = tone.edge; ctx.lineWidth = 1.5*SS;
  ctx.stroke();
  return {c1, c2, c3, c4, P};
}

/* BruxZir Factory: collaborative arms pick shade blocks and feed the mills */
const FACT_X = 24190;
function drawRobotArm(bx, bz, t, phase){
  const kk = k(bz);
  const X = wx => px(wx, kk), Y = wy => py(wy, kk);
  const sx = X(bx);
  if (sx < -400 || sx > W + 400) return;
  // plinth
  ctx.fillStyle = '#c9cdd1';
  ctx.fillRect(X(bx-70), Y(950), (140)*kk*SS, Y(1080)-Y(950));
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(X(bx-70), Y(1062), 140*kk*SS, Y(1080)-Y(1062));
  // animated joints (a slow pick -> place cycle)
  const w = t*0.9 + phase;
  const a1 = -0.35 + 0.62*Math.sin(w);                 // shoulder, from vertical
  const a2 = 0.95 + 0.55*Math.sin(w + 1.1);            // elbow, relative
  const L1 = 300, L2 = 250;
  const sxw = bx, syw = 930;
  const e1x = sxw + Math.sin(a1)*L1, e1y = syw - Math.cos(a1)*L1;
  const a12 = a1 + a2 - 1.3;
  const e2x = e1x + Math.sin(a12)*L2, e2y = e1y - Math.cos(a12)*L2;
  const seg = (x0,y0,x1,y1,wd,col) => {
    ctx.strokeStyle = col; ctx.lineWidth = wd*kk*SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke();
  };
  seg(sxw, syw, e1x, e1y, 58, '#33373c');              // dark inner shadow pass
  seg(sxw, syw, e1x, e1y, 46, '#e3e6e9');
  seg(e1x, e1y, e2x, e2y, 48, '#33373c');
  seg(e1x, e1y, e2x, e2y, 38, '#dfe2e5');
  // joints with the collaborative-blue caps
  for (const [jx, jy, r] of [[sxw, syw, 42], [e1x, e1y, 36], [e2x, e2y, 26]]){
    ctx.fillStyle = '#2c3036';
    ctx.beginPath(); ctx.arc(X(jx), Y(jy), r*kk*SS, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a90d9';
    ctx.beginPath(); ctx.arc(X(jx), Y(jy), r*0.45*kk*SS, 0, 7); ctx.fill();
  }
  // the zirconia block in the gripper, when the arm is carrying
  const carry = Math.max(0, Math.sin(w + 0.5));
  if (carry > 0.25){
    ctx.globalAlpha = Math.min(1, (carry-0.25)*3);
    ctx.fillStyle = '#f0f2ef';
    ctx.fillRect(X(e2x) - 16*kk*SS, Y(e2y) + 10*kk*SS, 32*kk*SS, 24*kk*SS);
    ctx.globalAlpha = 1;
  }
}

/* foreground occluders — soft dark shapes passing close to camera:
   mostly potted plants and people, the odd structural post */
const FG_ITEMS = [4900, 8250]
  .map((x, i) => ({x, kind: ['plant','person'][i % 2], seed: i}));
const FG_SPRITES = {};
function makeFgSprite(kind, seed){
  const R = rng(seed*31337 + 5);
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.filter = 'blur(5px)';
  g.fillStyle = '#050403';
  if (kind === 'plant'){
    c.width = 760; c.height = 720; g.filter = 'blur(5px)'; g.fillStyle = '#050403';
    // pot
    g.beginPath();
    g.moveTo(315, 560); g.lineTo(445, 560); g.lineTo(425, 700); g.lineTo(335, 700);
    g.closePath(); g.fill();
    // fan of leaves — well inside the canvas, no clipping
    for (let i = 0; i < 9; i++){
      const a = -Math.PI/2 + (i - 4) * 0.24 + (R()-0.5)*0.1;
      const len = 190 + R()*110;
      const tx = 380 + Math.cos(a)*len, ty = 555 + Math.sin(a)*len;
      g.save();
      g.translate(tx, ty);
      g.rotate(a + Math.PI/2);
      g.beginPath(); g.ellipse(0, 0, 26 + R()*12, 90 + R()*36, 0, 0, 7); g.fill();
      g.restore();
      g.beginPath();
      g.moveTo(380, 565);
      g.lineTo(tx, ty);
      g.lineWidth = 10; g.strokeStyle = '#050403'; g.stroke();
    }
  } else {
    c.width = 260; c.height = 640; g.filter = 'blur(6px)'; g.fillStyle = '#050403';
    const hx = 130 + (R()-0.5)*20, lean = (R()-0.5)*24;
    g.beginPath(); g.arc(hx, 74, 44 + R()*6, 0, 7); g.fill();
    g.beginPath();
    g.moveTo(hx - 88, 640); g.lineTo(hx - 74 + lean, 210);
    g.quadraticCurveTo(hx - 70 + lean, 128, hx, 122);
    g.quadraticCurveTo(hx + 70 + lean, 128, hx + 74 + lean, 210);
    g.lineTo(hx + 88, 640); g.closePath(); g.fill();
  }
  return {c, w: c.width, h: c.height};
}

function drawInspect(){
  const I = state.inspect; if (!I) return;
  I.amt += ((I.closing ? 0 : 1) - I.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (I.closing && I.amt < 0.03){ state.inspect = null; return; }
  const e = I.amt*I.amt*(3-2*I.amt);
  const sp = I.sp;
  // source: where the photo lives in the world right now
  let sx0, sy0, sw0, sh0;
  if (I.table){
    const kk = k(I.lz);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale*0.42;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(CFG.benchY, kk) - sh0;
  } else {
    const kk = k(I.z);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(I.cy, kk) - sh0/2;
  }
  // target: filling the view
  const th = Math.min(H*0.78, W*0.72*sp.h/sp.w);
  const tw = th * sp.w/sp.h;
  const tx = W/2 - tw/2, ty = H*0.46 - th/2;
  ctx.fillStyle = `rgba(3,2,2,${0.62*e})`;
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sp.c, mixN(sx0,tx,e), mixN(sy0,ty,e), mixN(sw0,tw,e), mixN(sh0,th,e));
  if (e > 0.6){
    const b = BEATS[I.beat];
    const seg = segAt(b.x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(30*SS, '', seg.font);
    ctx.fillStyle = `rgba(${seg.ink},${(e-0.6)/0.4 * 0.9})`;
    ctx.fillText(I.cap || (b.y + ' · ' + b.t), W/2, ty + th + 52*SS);
    ctx.restore();
  }
}

function drawAttractHint(t){

/* ---------------- UPDATE ---------------- */
function update(dt){
  const inp = Input.consume();
  state.time += dt;
  state.dt = dt;

  if (inp.anyInput){
    state.idle = 0;
    if (state.mode === 'attract'){
      state.mode = 'live';
      state.attract.fade = 0;
    }
  } else {
    state.idle += dt;
    if (state.mode === 'live' && state.idle > CFG.idleToAttract){
      state.mode = 'attract';
      state.attract.phase = 'cruise';
      state.focusBeat = -1; cam.zTarget = 0;
    }
  }

  if (state.mode === 'live'){
    if (state.inspect){
      // a photo is up close: any strong scroll or click puts it back
      if (inp.action || Math.abs(inp.impulse) > 260) state.inspect.closing = true;
      cam.vel = 0;
    } else {
      cam.vel += inp.impulse;
    }
    if (inp.action && !state.inspect){
      const aimed = (typeof inp.action === 'object') ? hitAt(inp.action.x, inp.action.y) : null;
      if (aimed && aimed.type === 'photo'){
        state.inspect = {sp: aimed.sp, wx: aimed.wx, cy: aimed.cy, z: aimed.z, w: aimed.w,
                         cap: aimed.cap, beat: aimed.beat, table: false, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'photoTable'){
        state.inspect = {sp: aimed.sp, wx: aimed.wx, lz: aimed.lz, w: aimed.w,
                         cap: aimed.cap, beat: aimed.beat, table: true, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'album'){
        const open = (albumAnim[aimed.beat] || 0) > 0.5;
        state.albumLock[aimed.beat] = !open;
      } else if (aimed && aimed.type === 'focus'){
        if (state.focusBeat === aimed.beat){ state.focusBeat = -1; cam.zTarget = 0; }
        else { state.focusBeat = aimed.beat; cam.zTarget = CFG.focusCamZ; cam.vel = 0; }
      } else {
        const nb = nearestBeat(cam.x);
        if (state.focusBeat === nb.i){ state.focusBeat = -1; cam.zTarget = 0; }
        else if (nb.d < 500){ state.focusBeat = nb.i; cam.zTarget = CFG.focusCamZ; cam.vel = 0; }
      }
    }
    if (state.focusBeat >= 0){
      if (Math.abs(inp.impulse) > 250){ state.focusBeat = -1; cam.zTarget = 0; }
      else {
        // glued to the beat while focused
        const b = BEATS[state.focusBeat];
        cam.x += (b.x - cam.x) * Math.min(1, dt*4);
        cam.vel = 0;
      }
    }
  } else {
    // attract autopilot
    const A = state.attract;
    if (A.phase === 'cruise'){
      const nb = nearestBeat(cam.x + 240);
      const target = CFG.attractCruise;
      cam.vel += (target - cam.vel) * Math.min(1, dt*4);
      if (nb.d < 18 && nb.i !== A.beatIdx && !BEATS[nb.i].minor){
        A.phase = 'dwell'; A.dwell = 0; A.beatIdx = nb.i;
      }
      if (cam.x > WORLD_END - 600) A.phase = 'fadeout';
    } else if (A.phase === 'dwell'){
      cam.vel *= Math.pow(0.001, dt);
      A.dwell += dt;
      if (A.dwell > CFG.attractDwell) A.phase = 'cruise';
    } else if (A.phase === 'fadeout'){
      cam.vel *= Math.pow(0.01, dt);
      A.fade = Math.min(1, A.fade + dt*1.2);
      if (A.fade >= 1){ cam.x = 200; cam.vel = 0; cam.z = 340; cam.zTarget = 340; state.introHold = true; A.phase = 'fadein'; A.beatIdx = -1; }
    } else if (A.phase === 'fadein'){
      A.fade = Math.max(0, A.fade - dt*1.2);
      if (A.fade <= 0){ A.phase = 'dwell'; A.dwell = -2.2; }
    }
  }

  // physics
  cam.vel = Math.max(-CFG.maxVel, Math.min(CFG.maxVel, cam.vel));
  cam.vel *= Math.pow(Math.E, -CFG.friction * dt);
  cam.x += cam.vel * dt;

  // ---- the yard video splice ----
  const SE = spliceEdges();
  if (state.splice){
    const S = state.splice;
    S.t += dt;
    cam.vel = 0;
    if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
      cam.x = S.from;
      if (SEAM_VIDEO.ended || S.skip) S.done = true;
    } else {
      // placeholder until the clip exists: a breath of light, and we are there
      cam.x = S.t < SPLICE.dur/2 ? S.from : S.to;
      if (S.t >= SPLICE.dur || S.skip) S.done = true;
    }
    if (S.done){
      cam.x = S.to + S.dir * 8;
      cam.vel = S.dir * 260;
      state.spliceSide = S.dir > 0 ? 'R' : 'L';
      state.splice = null;
    }
  } else {
    if (cam.x < SE.inL - 2){ state.spliceSide = 'L'; state.spliceArm = 0; }
    else if (cam.x > SE.outR + 2){ state.spliceSide = 'R'; state.spliceArm = 0; }
    else {
      // the rail ends here: hold the composition — this is the clip's first frame
      const dir = state.spliceSide === 'L' ? 1 : -1;
      const from = dir > 0 ? SE.inL : SE.outR;
      cam.x = from; cam.vel = 0;
      state.spliceArm = (state.spliceArm || 0) + dt;
      const push = dir > 0 ? inp.impulse > 140 : inp.impulse < -140;
      const go = state.mode === 'live'
        ? (push && state.spliceArm > 0.3)
        : state.spliceArm > 3.0;
      if (go){
        state.splice = {dir, t: 0, from, to: dir > 0 ? SE.outR : SE.inL};
        if (SEAM_VIDEO){ try { SEAM_VIDEO.currentTime = 0; SEAM_VIDEO.play(); } catch(err){} }
      }
    }
  }
  if (state.splice && inp.action) state.splice.skip = true;

  // soft bounds
  if (cam.x < -300){ cam.x = -300; cam.vel = Math.max(0, cam.vel); }
  if (cam.x > WORLD_END + 300){ cam.x = WORLD_END + 300; cam.vel = Math.min(0, cam.vel); }

  // beat magnetism when slow (live mode, not focused)
  if (state.mode === 'live' && state.focusBeat < 0 && Math.abs(cam.vel) < CFG.magnetVel){
    const nb = nearestBeat(cam.x);
    if (nb.d < CFG.magnetDist){
      cam.vel += (BEATS[nb.i].x - cam.x) * CFG.magnetK * dt * 0.6;
    }
  }

  // rest detection (for description reveal)
  const nb = nearestBeat(cam.x);
  if (nb.d < 120 && Math.abs(cam.vel) < 30){
    if (state.restBeat === nb.i) state.restTime += dt;
    else { state.restBeat = nb.i; state.restTime = 0; }
  } else { state.restBeat = -1; state.restTime = 0; }

  // the opening close-up releases on the first real movement
  if (state.introHold && (Math.abs(cam.vel) > 60 || Math.abs(cam.x - 200) > 350)){
    state.introHold = false;
    cam.zTarget = 0;
  }

  // dolly
  cam.z += (cam.zTarget - cam.z) * Math.min(1, dt*3);
}

/* ---------------- FRAME ---------------- */
function frame(){
  const t = state.time;
  HITS = [];
  BR = (Math.sin(t*0.32)*6 + Math.sin(t*0.11)*3) * Math.min(1, Math.abs(cam.vel)/140);
  // base — ambient color drifts cooler era by era
  const amb = ambient(cam.x);
  ctx.fillStyle = `rgb(${amb.bg[0]|0},${amb.bg[1]|0},${amb.bg[2]|0})`;
  ctx.fillRect(0, 0, W, H);

  drawMapWall(t);
  drawWall();

  // lamp pools on wall (behind photos)
  drawLampPool(INTRO_X, lampFlicker(t, 0));
  for (let i = 0; i < BEATS.length; i++) drawLampPool(BEATS[i].x, lampFlicker(t, i+1));

  drawIntro();
  drawOutro();
  drawSheets();

  // wall layer: photos and panels sit deepest
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 2400) continue;
    for (const it of b.wall){
      const sp = SPRITES[it.img]; if (!sp) continue;
      const wz = wallZAt(b.x) - 12;
      drawSprite(sp, b.x + it.dx, it.cy, wz, it.w, it.rot || 0, null,
                 {type:'photo', sp, wx: b.x + it.dx, cy: it.cy, z: wz, w: it.w, cap: it.cap, beat: i});
      if (it.cap){
        const kk = k(wz);
        const seg = segAt(b.x);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = eraFont(19 * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},0.55)`;
        const hW = it.w * (sp.inner.h / sp.inner.w);
        ctx.fillText(it.cap, px(b.x + it.dx, kk), py(it.cy + hW/2 + 44, kk));
        ctx.restore();
      }
    }
    if (b.plasma) drawPlasmaPanel(b, t);
  }
  drawBanners(t);

  // mid-ground: people and machines stand in front of the wall...
  drawStage(t);
  drawFigures();
  drawProps(true);

  drawBench();

  // table items
  drawFactory(t);
  drawProps(false);
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 2400) continue;
    for (const it of b.table){
      const sp = SPRITES[it.img]; if (!sp) continue;
      drawLyingPrint(sp, b.x + it.dx, it.lz, it.w, it.rot || 0,
                     {type:'photoTable', sp, wx: b.x + it.dx, lz: it.lz, w: it.w, cap: it.cap, beat: i});
    }
    for (const it of (b.st || [])){
      const sp = SPRITES[it.img]; if (!sp) continue;
      const hW = sp.h * (it.w / sp.inner.w);
      drawStandingPrint(sp, b.x + it.dx, it.lz, it.w,
        {type:'photo', sp, wx: b.x + it.dx, cy: CFG.benchY - hW/2, z: it.lz, w: it.w, cap: it.cap, beat: i});
    }
    for (const p of (b.props || [])) drawMonitor(p, b.x + p.dx, p.lz, p.w, t);
    if (b.album) drawAlbum(b, i, t, state.dt || 0.016);
    if (b.y === '2020–22') drawBookPyramid(b, t);
  }

  // the floating text reads above everything on the walls and tables
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 2400) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    drawBeatText(b, focusAmt);
  }

  // lamps + dust + foreground
  drawLamp(INTRO_X, t, 0);
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (segAt(b.x).lamp === 'tube') drawTube(b.x, t, i+1);
    else drawLamp(b.x, t, i+1);
  }
  drawDust(t);

  // hero pass: as you pass a landmark stand, the world dims and a spotlight takes it
  let hero = 0;
  for (const b of BEATS){
    if (!b.ped) continue;
    const pedX = b.x + (b.ped.dx ?? -430);
    const focusX = pedX + (b.x - pedX) * 0.35;   // sweet spot between stand and beat
    const d = Math.abs(focusX - cam.x);
    const h = Math.max(0, 1 - d/680);
    hero = Math.max(hero, h*h*(3-2*h));
  }
  state.hero = hero;
  if (hero > 0.01){
    ctx.fillStyle = `rgba(2,2,3,${(0.38*hero).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  for (const b of BEATS) if (b.ped && Math.abs(b.x - cam.x) < 2000) drawPedestal(b, t, hero);

  drawForeground();
  drawDoorway();
  drawSeamVideo();
  drawGrade(t);
  drawInspect();
  drawAttractHint(t);
  // pointer affordance
  if (Input.hover && state.mode === 'live'){
    document.body.style.cursor = (!state.inspect && hitAt(Input.hover.x, Input.hover.y)) ? 'pointer' : '';
  }

  // attract fade
  if (state.attract.fade > 0){
    ctx.fillStyle = `rgba(5,2,0,${state.attract.fade})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (DEBUG){
    ctx.fillStyle = '#0f0'; ctx.font = `${14*SS}px monospace`; ctx.textAlign = 'left';
    ctx.fillText(`x=${cam.x|0} v=${cam.vel|0} mode=${state.mode} fps=${fps|0}`, 10, 20*SS);
  }
}

/* ---------------- MAIN LOOP ---------------- */
const DEBUG = /debug/.test(location.search);
let last = 0, fps = 60, qFrames = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016);
  last = ts;
  fps = fps*0.95 + (1/Math.max(dt,1e-3))*0.05;
  // adaptive quality: weak hardware renders smaller, CSS upscales
  if (++qFrames > 150){
    qFrames = 0;
    if (fps < 40 && RQ > 0.55){ RQ = Math.max(0.55, RQ - 0.15); resize(); }
    else if (fps > 56 && RQ < 1){ RQ = Math.min(1, RQ + 0.15); resize(); }
  }
  update(dt);
  frame();
  requestAnimationFrame(loop);
}

/* ---------------- BOOT ---------------- */
async function boot(){
  resize();
  await loadAssets();
  TEX.wall1 = woodTexture({plank:'v', plankSize:150, base:'#20150b', light:'#372712', w:1400, h:900});
  TEX.bench1 = woodTexture({plank:'h', plankSize:110, base:'#3a2812', light:'#5a4020', w:1200, h:512});
  TEX.front1 = woodTexture({plank:'v', plankSize:190, base:'#170f07', light:'#2a1c0c', w:1200, h:600});
  TEX.wall2 = panelTexture({w:1400, h:900, base:'#5d5b47', groove:300});
  TEX.bench2 = formicaTexture({w:1200, h:512});
  TEX.front2 = panelTexture({w:1200, h:600, base:'#39392f', groove:220});
  TEX.wall3 = panelTexture({w:1400, h:900, base:'#71746c', groove:470});
  TEX.bench3 = formicaTexture({w:1200, h:512, base:'#a09a8e'});
  TEX.front3 = panelTexture({w:1200, h:600, base:'#45463f', groove:240});
  TEX.wall4 = panelTexture({w:1400, h:900, base:'#e0e3e6', groove:600});
  TEX.bench4 = formicaTexture({w:1200, h:512, base:'#eef0f2'});
  TEX.front4 = panelTexture({w:1200, h:600, base:'#c8ccd0', groove:420});
  cacheWrap();
  TEX.outside = makeOutside();
  SECTIONS.old = makeSection('old');
  SECTIONS.neu = makeSection('neu');
  initSeamVideo();
  MAP_SPRITE = makeMapSprite();
  MONS.crt = makeMonitor('crt');
  MONS.lcd = makeMonitor('lcd');
  for (let i = 0; i < 3; i++) grains.push({c: noiseTile(256, 1)});
  // build sprites — tone and framing by era
  const eraStyle = [
    {wall:'frame',   table:'print',  tone:'sepia(0.55) saturate(0.7) contrast(1.05) brightness(0.95)'},
    {wall:'metal',   table:'print2', tone:'sepia(0.22) saturate(0.82) contrast(1.03)'},
    {wall:'plastic', table:'print2', tone:'saturate(0.9) contrast(1.02)'},
    {wall:'white',   table:'print2', tone:'saturate(0.96) contrast(1.02)'},
  ];
  const spec = {};
  for (const b of BEATS){
    const es = eraStyle[segIdx(b.x)];
    for (const it of b.wall) spec[it.img] = {style: it.style || es.wall, tone:es.tone};
    for (const it of (b.st || [])) spec[it.img] = {style: it.style || es.wall, tone:es.tone};
    for (const it of b.table) spec[it.img] = {style:es.table, tone:es.tone};
  }
  for (const [n, o] of Object.entries(spec)){
    const sp = makePrint(n, o);
    if (sp) SPRITES[n] = sp;
  }
  PED_SPRITES.crown = makePedObj('crown');
  PED_SPRITES.logo1970 = makePedObj('logo1970');
  PED_SPRITES.logoG = makePedObj('logoG');
  PED_SPRITES.puck = makePedObj('puck');
  PED_SPRITES.scanner = makePedObj('scanner');
  PED_SPRITES.crown2 = makePedObj('crown2');
  PED_SPRITES.millSt = makePedObj('millSt');
  initAlbums();
  // wall photos live in the band below the text (top 360, bottom 690) —
  // and always on an actual wall, never over a gap or a column
  for (const b of BEATS){
    const seg = segAt(b.x);
    const wallL = seg.x0 + (seg.wInsetL || 0), wallR = seg.x1 - (seg.wInsetR || 0);
    for (const it of b.wall){
      const sp = SPRITES[it.img]; if (!sp) continue;
      let h = sp.h * (it.w / sp.inner.w);
      if (h > 330){ it.w *= 330 / h; h = 330; }
      it.cy = 360 + h/2;
      const half = sp.w * (it.w / sp.inner.w) / 2 + 30;
      const x = b.x + it.dx;
      if (x - half < wallL) it.dx = wallL + half - b.x;
      if (x + half > wallR) it.dx = wallR - half - b.x;
    }
  }
  initBanners();
  initTables();
  initDust();
  initDecor();
  attachMouseDriver(document.body);
  requestAnimationFrame(loop);
}
window.addEventListener('load', boot);   // assets block sits below — wait for it
