/* THE ARTICLES, keyed by the beat's title (or its year where it has no title).
   Written 2026-09-11 from two sources: Jim Glidewell's memoir 'Constant Change'
   (Harriman House, 2020) — every quotation marked with his name is his — and the
   production research base (data_beats.js). A paragraph that opens with '## ' is a
   subheading; a line that opens with '• ' is a bullet. Where the two sources
   disagree on a figure, the article says so rather than choosing. */
const STUDY_BY_TITLE = {
  "LOST-WAX CASTING": "In 1907 William H. Taggart demonstrated a practical lost-wax casting method for dental restorations — molten gold cast into a mold formed around a hand-carved wax pattern. The technique made precisely fitting cast crowns and inlays reproducible, and it defined the craft for the rest of the century: every restoration began as wax shaped by hand, one case at a time, days or weeks per mouth. This is the analog baseline the whole tour measures itself against — the world Glidewell was born into, and the one it would spend fifty years making faster, cheaper and more precise.\n\n## What a crown cost, in hands\nFor the whole of the century that follows, a crown is made the way Taggart made it: a wax pattern carved by hand, invested, burned out, cast in gold, then fitted, layered with porcelain, fired, glazed and polished. Every step is a person, and every person is a place where the case can go wrong. A restoration is days of one technician's attention, and a laboratory is as good as the hands it can hire.\n\n## Why the hall starts here\nEverything Glidewell will do is measured against this bench. The mail, the merger of nine labs into one, the digital scan, the milled crown, the robot — each one removes a pair of hands from the chain, or moves them to where they matter. The founder learned the craft at exactly this bench, and spent fifty years automating it.\n\n“If you make crowns the old analog way, fair warning: you'd better be old enough to retire, because you will not survive.” — Jim Glidewell, Constant Change",
  "FOUNDED": "In January 1970 Jim Glidewell opened his own dental laboratory in Tustin, California: a ground-floor space of about five hundred square feet at 130 El Camino Real, fitted out with four thousand dollars of used equipment and a porcelain furnace a fellow sold him for three hundred. He was twenty-four, a Navy veteran of the Tonkin Gulf, and a year out of the dental technology program at Orange Coast College, where he had graduated in a class of thirteen.\n\n## How a lab begins on a Friday night\nHe had not planned to be an owner. He was working for Dr. Bill Stanley, the dentist who had taught him the trade, when Stanley was locked out of his office for three months' unpaid rent and took a job in Los Angeles. “There's no ‘we’ in this equation,” Stanley told him. Jim was out of work on a Friday. By Monday he was running his own lab, with enough cash in his pocket to pay three months' rent in advance. A second dentist, Dr. Bob Hubbert, sent him his first customers — and kept sending them. “It seemed as if every time the door opened to my small lab, he was standing there with another dentist.” Within weeks Jim was working for twenty dentists.\n\n## Eighteen months without a day off\nFrom January 6, 1970, until August 1971 he did not take a day off: an average of a hundred and twenty hours a week, forty-hour stretches at the bench, six hours' sleep on the lab couch, home twice a week to shower. He could work as much as three people, he reasoned, and the two salaries he did not pay went back into equipment. His first employee, Joyce, a classmate from Orange Coast, quit a month in by throwing a bowl of plaster at his head. “My first employee Joyce was a doll and I was a jerk. Wherever you are, Joyce, I apologize!” His second wife, Sandi, a hairdresser and artist, sat at a bench whenever a ceramist tried to hold the little company hostage.\n\n## The goal was two hundred dollars a week\nHe did not set out to build the largest dental laboratory in the world; he set out to make two hundred dollars a week and feed his family. The first year the business earned thirty-nine thousand dollars, the second seventy — more than his father had made in a lifetime on the railroad. And yet his college roommate had already told him, in his first year of school: “You'd make a lot more friends if you weren't always telling people that you're going to build the biggest dental lab in the world.”\n\n## What he brought from Kentucky\nJim was born in Las Vegas in May 1945 and raised, from four to nine, on his grandparents' farm near Burkesville, Kentucky, without electricity, running water or indoor plumbing, in a one-room schoolhouse where he was the only child in his grade. His father, a Depression-era railroad conductor, once stopped the truck to pick a rusty wrench out of the dirt. Fifty years later the founder of a five-thousand-person company drives a fourteen-year-old Hummer, buys used equipment, and explains it the same way: he will not drive a car his average employee cannot afford.\n\n“There are no extraordinary men, only ordinary men with extraordinary reactions to ordinary circumstances.” — Jim Glidewell, Constant Change",
  "SECOND LAB": "Growth, in the seventies, meant another room. Jim's second laboratory was a third-floor space at 172 North Tustin Avenue in Orange, a few miles from the first. Over the next decade the company would occupy a run of small addresses in Orange — 1722 East Rose, where the first marketing promotion was photographed; 303 West Palm Avenue, four thousand square feet, home from 1975 to 1984 — and then, one by one, labs in other towns.\n\n## Addition before system\nThis is what a young laboratory did: it grew by adding places. Each new lab was a new set of benches, a new manager, a new set of overheads and habits, and no two of them worked the same way. Jim was in his late twenties, younger than some of the men he hired to run them, and for a while he deferred to their age. “I remember walking into a lab in Torrance and seeing a fair number of empty beer cans all over the floor.” Employees came back from lunch legally drunk. It took him weeks to put his foot down and say the obvious: they were making medical devices for real patients, and patients deserved sober hands.\n\n## What the second lab taught\nTwo things came out of those rooms. The first was standard operating procedures — the realization that a task done well in one lab was done differently in the next unless someone wrote it down. The second was a habit that never left the company: try an idea in one small place before you bet the whole business on it. “Having multiple dental labs has allowed me to try out ideas on one small lab, before implementing anything on a larger scale.”\n\n## The years\nBy 1975 the company was in its four-thousand-square-foot lab on West Palm Avenue and Jim, thirty, had been made a pilot and president of the Santa Ana 20/30 Club. It was, he says, big enough by then that people assumed he had inherited it.\n\n“Hope is not a business plan.” — Jim Glidewell, Constant Change",
  "PFM ERA": "The crown that built the lab. Porcelain-fused-to-metal was invented at the end of the 1950s by Abraham Weinstein, a New York dental technician: fire a thin porcelain veneer onto a cast metal coping and you get a tooth that is strong where gold is strong and white where a tooth is white. His patent was filed on 15 October 1959; VITA in Germany brought out VMK, the first commercial metal-ceramic system, in 1962. For the next half-century the PFM was simply what a crown was — cast by hand, layered by hand, fired by hand, one case at a time. The 1970s refined it: better oxide bonding, fewer chipped veneers, porcelains that finally matched a shade guide.\n\nThis is the world Jim Glidewell opened his door into in January 1970 — a ceramist by training, and PFM was the ceramist's trade. It was also the lab's engine. Through the 1980s and 1990s Glidewell grew into the largest dental laboratory in the world largely on the back of PFM volume: a single labour-intensive product, made by hand, in staggering quantities, at a price a general dentist could put in front of any patient. That is the thesis of this hall in its first form — the best available restoration, made affordable by doing it at scale.\n\nAnd then Jim did the thing that defines him: he killed his own best-seller. BruxZir, in 2009, was a crown with no porcelain to chip and no metal to show at the gumline, milled instead of hand-layered. Within a decade monolithic zirconia had displaced the PFM as the default, and Glidewell later stopped making the traditional feldspathic PFM altogether, moving what remained of the metal-ceramic category onto its own Obsidian lithium silicate. The lab that grew up on the PFM is the lab that ended it.\n\n## The alloy that opened hundreds of doors\nIn the early 1980s many laboratories would fuse porcelain only to gold. Jim's labs offered PFM crowns on non-precious alloys as well — cheaper for the dentist, the same porcelain on top — and picked up hundreds of new accounts for it. It is the first small instance of the pattern that would define the company: take the standard restoration and take the cost out of it.\n\n## Where it went\nThe PFM stayed the dominant crown for another quarter-century, until a monolithic material arrived that could do without the metal and the porcelain both. When it did, this whole bench — the wax, the casting, the opaque, the layering, the firing — disappeared from the lab in a few short years. “As ceramists, the knowledge we've acquired over many years of practice has vanished in the course of just a few short years.” The six stages on the counter are what was lost, and what was replaced.",
  "DIRECT-MAIL": "In 1976 Jim Glidewell put the laboratory in an envelope. He mailed dentists an offer: post us the impression, and the finished crown comes back to you the same way. The trade ran on couriers and neighbourhoods — a lab served the practices its driver could reach and back before the end of the day — so the offer read as a stunt. It is the thing that turned a local workshop into a national one.\n\n## What came before it\n\nBy the middle of the seventies Jim was running several small laboratories across Southern California, and hand-to-hand had hit its ceiling: the business could grow only as far as a van could drive, and it lived on the loyalty of the dentists on that route.\n\nHe wanted steady work for the people at the benches, and steady work means a steady flow of cases — which meant reaching past the county. The post office was already national. A dentist had to do nothing but put the impression in a box; the lab did not have to run a fleet to fetch it.\n\n## What it did to the business\n\n• Scale. Mail let the work be gathered into one plant instead of spread across nine. By 1989, 95% of it arrived at a single address by post, from more than 3,500 dentists across the country.\n• Standards. Jim’s rule was that quality falls the moment you stop watching it — and volume is what makes a written procedure worth having. At that scale the lab could dose materials by machine instead of by eye, and take the guesswork out of the steps where one hand differs from another.\n• Price, worked backwards. The flow made a published price possible — the famous $99 crown. He did it in reverse: start from the number a dentist says yes to without thinking, then rebuild the inside of the company until that number pays. Volume, not the margin on a single unit, is what makes that arithmetic work.\n\n## The rules he took from it\n\n• Marketing is the tax you pay to survive. Don’t advertise and you stay the best-kept secret in town. The advertising brings the cases, and the cases are what let you promise anybody a job.\n• Perception is reality. He deliberately kept out of meetings with customers: a meeting can undo a brand in a minute, while print says exactly what you decided it should say.\n• Faster, better, less expensive. Speed to market is a product in its own right — and FedEx and UPS turned out to be quicker and steadier than a van and a driver.\n• Honest self-interest. Jim never pretended people come to work for him rather than for themselves. Management, in his words, is getting people to reach the company’s goals out of their own selfish interests — and the mail-order scale is what let the benches earn more on piecework than anywhere else in the trade.\n\n## What is left of it\n\nThe box became a file. The impression is a scan, the courier is a network, the crown is designed before anyone has touched it. The idea underneath is the one from 1976: take the distance between the dentist and the laboratory out of the question.\n\n## The advertising department is a salesman on a couch\nIn 1978 an old salesman for a local printer began stopping by Jim's office every couple of months to sit on the couch and talk about beauty in nature — “Anything that is not in harmony with nature will cease to exist.” He also convinced Jim to do his own advertising in-house: buy some paste-up materials, shoot a photograph with half the lens covered, cut and glue an ad together. Glidewell has done its own marketing ever since. The last outside agency was let go in 1980, after its owner insisted that dentistry was just another product. Today about ninety people work on some two hundred advertising projects a week.\n\n## The rules of the mail\nDirect mail is still the channel that brings in dentists; magazine ads, Jim says, mainly telegraph your strategy to your competitors. Never drop the whole budget at once — “like feeding a pig to a python” — send five thousand pieces a month and take five to ten new customers a week, no more than you can serve properly. Put the price in the ad. Never advertise in December. And remember the rule of six and a hundred and twenty-five: an unhappy customer tells six people, who each tell six; a happy one tells two.\n\n“You can be the best technician in America, but if you don't advertise, you're simply the best-kept secret in town.” — Jim Glidewell, Constant Change",
  "NINE LABS": "By the end of the 1970s the one-man lab of 1970 had become nine: Orange, San Diego, Irvine, Costa Mesa, Torrance, Garden Grove, Riverside, Fullerton, and an outlier across the state line in Lake Havasu, Arizona. It was real scale — and scale by addition. Nine sets of overhead, nine managers, nine places where the same crown was made a slightly different way.\n\n## The ledger\nJim's own accounting is blunt: most of the time Orange and Lake Havasu made money, three of the labs broke even, and four lost money. But nine labs were nine experiments. He could try a pricing idea, a procedure or a manager in one and watch what happened, in a way a single laboratory never allows. “I was able to experiment with each lab to determine what worked. I couldn't have done that if I only had one lab.”\n\n## The pull in two directions\nMeanwhile the mail had already broken the rule that a lab serves the dentists down the road. Cases were arriving from far beyond any one lab's neighbourhood, and the demand was becoming national while production was still local and fragmented. That tension is the whole point of this bay: nine little buildings on one plinth, and a van running between them.\n\n## How it ended\nJim merged most of the business into the Orange office and sold — or simply gave — the other labs to the men who ran them. Not one survived a year. When he handed the keys of the Newport Beach lab to its head technician and asked how he planned to stop losing money, the answer was: “Now that we're working for ourselves, we'll work a lot harder!” Ten months later the man came back looking for a job. Jim gave him one, at Lake Havasu. “Sometimes you either have it or you don't. But I was the one who rehired him — goes to show that I'm a slow learner sometimes.”\n\n“Growing at anything approaching forty per cent, you run the risk of outrunning your capacity to manage it. Today fifteen per cent allows me to sleep well at night.” — Jim Glidewell, Constant Change",
  "STUDY PROGRAM": "In 1980 Glidewell began flying dentists in from Japan and other countries to train in the United States — the International Study Program. For a laboratory just beginning to scale, it was an odd thing to spend money on, and it became one of the milestones that shaped the company for decades: teaching, long before teaching was a marketing channel.\n\n## Education as a bond\nJim used teaching as a way to build a relationship with the profession, not as an add-on to a product. His view is plain — in business it is critical that people like and trust you; “people don't buy from people they don't like.” Hosting dentists, teaching them a technique and having them succeed with it built something closer to a family bond than a customer list. That instinct grew into a whole education wing: the newsletter of 1998, the Chairside magazine, the courses, the symposia, and the Glidewell International Technology Center that opened in Irvine in July 2011 to train dentists from around the world.\n\n## Thirty-five, and no longer deferring\n1980 is also the year Jim describes a private turn. He was thirty-five and had stopped believing that every man older than him was wiser. “Some of these people were just middle-aged, with bad habits they'd been repeating for the past thirty years.” It is when standard operating procedures arrived in his labs — written instructions for how a task is done well — and when he took the company's advertising out of an outside agency's hands for good.\n\n## A modem, a day late\nA year later, in 1981, curious about microcomputers, he took a class at Chapman College and, with two engineers from Bechtel, spent a month designing a device that would let computers talk over a telephone line. Then they opened a magazine and found the Hayes Micromodem already on the market. “When you think about fast-moving, emerging new markets, you aren't the only one who sees the writing on the wall. You better be first, or all your efforts will be in vain.” The lesson would decide how the company handled every technology after it.\n\n“The secret? It's simple really: hire smart people, train smart people, and retain smart people.” — Jim Glidewell, Constant Change",
  "CONSOLIDATION": "In 1983 the company was working out of a four-thousand-square-foot office. Jim bought a fifteen-thousand-square-foot building in Orange and moved forty people into it. “Naysayers predicted our doom, as they felt we'd over-expanded.” Nine scattered labs became one plant, fed by mail from across the country — the model that could finally scale.\n\n## One machine, one standard\nA single building meant a single way of doing things. Cases from anywhere arrived at one door, were made to one standard and left by one carrier. The overhead of nine managers and nine leases collapsed into one, and volume — not the location of the bench — began to set the price. It is the birth of the operating model the company still runs: centralise production, standardise it, and let scale drive the cost down.\n\n## The rule of ten per thousand\nJim's rule for a laboratory is that when headcount reaches ten people per thousand square feet, it is time to move — and to move into a building four times the size of the one you are leaving. “When you have that space available, you can grow into it. If you don't have the space and you hit a wall, you stop selling. You start turning work away without even knowing it.” The forty people in the new building grew to a hundred and fifty before the walls closed in again, and the next move, in 1993, was to Newport Beach.\n\n## The tax that came with size\nGrowth brought its own bills. From 1985 a business billing five million dollars a year for three years had to move to accrual accounting and pay tax on what it had invoiced rather than collected. Glidewell crossed that line at the moment of Jim's second divorce; the six hundred thousand dollars in receivables became taxable income overnight, and he borrowed to pay it. He lived in an apartment a block from the office, he says, so that he could walk to work if he could not afford a car.\n\n“Expand your physical facilities in advance of your anticipated growth. Add at least ten per cent more physical space every year. Even that might not be enough.” — Jim Glidewell, Constant Change",
  "BIOTEMPS": "## What it is\n\nBioTemps are lab-fabricated provisional (temporary) crowns and bridges in tooth-colored PMMA acrylic — roughly a 6-month wear life, three-day lab turnaround. (There's also a chairside version, “BioTemps NOW,” milled in-office from PMMA blocks.)\n\nWhy it's more than a temporary. The real value is as an esthetic blueprint: the provisional's design is stored and reused for the final restoration (later a BruxZir or e.max crown), so the patient can see, wear and approve the look, bite and speech before committing — “no surprises on the final visit.” It also shapes gum tissue and restores collapsed bite height. A clean early example of the Glidewell pattern: own the whole workflow in-house and take the risk out for the dentist.\n\nBy around 2002 the BioTemps business had grown into its own dedicated fixed-ceramics lab. BioTemps showed the vertical, in-house, materials-driven model Glidewell would later scale dramatically with BruxZir zirconia.\n\n## The company in 1988, from the loading dock\nDarryl Withrow arrived that January from Maine with a degree in archaeology and enough money for a month. He applied for a delivery job in a tie, passed Jim's famous two-minute math test, and was hired. There were sixty-five employees, forty of them technicians paid by the piece. On his third day he uncovered a driver skimming twenty dollars a fill-up on the company gas card; on his fifth his own boss was fired. Within a year he could log and invoice a case, and within a few he was measuring the whole lab — and found that the “five-day turnaround” every manager swore by was being missed four times out of five. Three months of published numbers took that to one in five; today it is around four per cent.\n\n“Quality only slips without constant attention.” — Jim Glidewell, Constant Change",
  "NATIONAL LEADER": "By 1989 the laboratory in Orange had done something no lab was supposed to be able to do: it served dentists across the country without leaving the county. Ninety-five per cent of cases came in by mail, and the local delivery car — the belly-to-belly relationship every laboratory believed it lived on — had simply been done away with. “We at Glidewell do not own a single delivery car,” Jim still tells rooms full of lab owners, and watches their mouths drop.\n\n## What arrived in the box\nThe exhibit on this plinth is the object the whole model turned on: a mailed case, still in its trays. A dentist anywhere took the impression, packed it, posted it; a week later the crown came back the same way. The lab became a factory with a mailbox instead of a front door, and the country became its neighbourhood.\n\n## The numbers, honestly\nThe company's own history gives the lab a hundred and seventy-five people and more than three and a half thousand dentists in 1989. Jim's memoir counts differently: sixty-five employees in January 1988, a hundred and fifty at the move to Newport Beach in 1993, sales passing ten million dollars in 1991 with around five hundred active dentists. The figures come from different ledgers and different definitions of a customer; both agree on the shape of the thing — a laboratory in one town growing by mail at a rate the trade had never seen.\n\n## The founder, on the side\nEarly in 1989 Jim put twenty thousand dollars into a silver account at Merrill Lynch and six weeks later was sitting on half a million in gains — until the exchange raised margin requirements and silver collapsed overnight. He walked away with a hundred and twenty-five thousand, and used it as the down payment on a house on Evening Star Lane, on the water in Newport Beach. It is one of exactly two outside investments he admits to. “Since 1982, with a couple of exceptions, I've never invested in anything outside of my total control. It has to be a dental lab, or I have no interest.”\n\n“Most labs are tooth-makers who think they are a delivery system.” — Jim Glidewell, Constant Change",
  "1993": "In 1992 Jim bought a seventy-thousand-square-foot office building at 4141 MacArthur Boulevard in Newport Beach from the Bank of Boston, for fifty dollars a square foot. “I don't think anybody ever got a better deal in Newport Beach on an office building than I did at that time.” The banks he knew wanted three committees and a refusal; the Far East National Bank, a Chinese bank so new they were still hanging wallpaper, made him its first customer and lent him two point seven million dollars. On April 15, 1993, the company moved in — a hundred and fifty employees on the top floor of an almost empty building, doing twelve million dollars a year in sales.\n\n## The developer on the golf course\nNobody had money in 1992. Not long after the purchase, Jim met the building's developer on a golf course and told him about the deal. “That's my building!” The man's company had put its cash into it and handed the keys back to the bank when it could not make the payments. Jim let him stay on as a tenant at fifty cents a square foot; they became friends, and the developer's company prospered and moved on. The two other tenants downstairs both went bankrupt.\n\n## The article, and the men at the door\nThe Orange County Register reported the purchase, with Jim's photograph and the size of his down payment: eight hundred thousand dollars. A week later, at five on a Wednesday evening, with sixteen guests due for dinner, two well-dressed men with a police badge and a police radio came to his door in Newport Beach to “investigate a neighbour.” On the patio one of them put a nine-millimetre pistol to his ear: the money in the upstairs safe, or fifteen seconds. There was no safe and no cash — nobody buys a building with bills — and while Jim kept them talking by the boat dock, an off-duty policeman friend inside called it in. Forced to drive his own car with the gun at the back of his head, he heard the police helicopter on the intruders' scanner, waited until the gunman stepped out to talk to the second car, and floored it. The police caught up with him a minute later and put him face down on the asphalt. “I'm the victim!” The men were never caught. Dinner was served at a quarter to seven. “Visibility equals vulnerability,” he wrote; he has avoided the press ever since.\n\n## The building on the screen\nThe company still shows the film that was made of the place before it was finished: an architect's computer flythrough, cutting from the model to the completed building from the same angle. The massing model on the plinth is what that film was made from. The building appreciated six-fold; the business inside it grew forty-fold. “As it turns out, Time Warner and Federal Express weren't exactly wrong. Find and stick to your core competency.”\n\n“Own your own buildings and rent them back to yourself. I do!” — Jim Glidewell, Constant Change",
  "OPERATORY · PLAYSAFE": "In 1995 Glidewell opened a small in-house dental operatory — a working clinic inside the lab — so the company could test materials and restorations on real patients rather than only on bench models. The same year it launched PlaySafe, a line of custom-fitted athletic mouthguards\n\n## Why it matters\n\nTwo small things start here. First, R&D realism: a crown that survives a lab jig is not the same as one that survives a human bite, saliva, and a hurried dentist — putting chairs in the building meant Glidewell could see failure where it actually happens. Second, it is the company's first clear step beyond the crown, into prevention and sport. Modest in scale, but it shows the instinct that later defines the firm: control more of the chain, and don't stop at the restoration.\n\n## The people who arrived that year\nIn November 1995 a nineteen-year-old refugee from Sarajevo, in the country a few months, took a job at Glidewell as a fulfilment clerk. Leila Fejzagic worked her way through fulfilment, customer service and the technical departments, left to try science, came back to human resources, and is now the company's vice-president of human resources — one of the many who, in Jim's phrase, grew up in the business. Over thirty nationalities work at the lab; Jim's own hiring lesson from these years was to place job advertisements in Cantonese, Vietnamese and Mandarin, and to give every applicant, for any position, the same two-minute math test.\n\n“Every single hire on our payroll has passed that surprise, two-minute math test, regardless of the department or type of position for which they're applying.” — Jim Glidewell, Constant Change",
  "SILENT NITE": "In 1996, Glidewell introduced the Silent Nite sleep appliance — a custom, dentist-delivered oral device that gently advances the lower jaw to keep the airway open during sleep, reducing snoring and mild obstructive sleep apnea. It was deliberately built to be comfortable, adjustable, and inexpensive enough for any general dentist to fit, not just sleep specialists.\n\n## Why it matters\n\nEvery previous Glidewell product fixed something already broken: a worn tooth, a missing tooth, a failed restoration. Silent Nite is different — it keeps a problem from starting. It is prevention, not repair. That is a quiet but real shift in what a dental lab believes it is for: not only rebuilding mouths, but protecting sleep, breathing, and health.\n\n## Two or three a year\nSilent Nite is the first clear instance of a rule Jim set for his research department and has never relaxed: bring two or three viable new products to market every year — a sleep appliance, a material, a process that simplifies a day in the practice. “Do not rely on vendors' new products to be your strategy for future growth. They don't care about your future; they care about theirs.”\n\n## The same year, at sea\n1996 was also the year the company sat under a federal labour lawsuit for sixteen months, drawn out by its own attorney's billable hours, and Jim took three months on a boat to ask whether the effort was worth it. The answer was yes, with two lessons: manage your own lawyers, and keep everything you can — legal, design, food, cleaning — inside the company, where people's interests are the company's interests. Glidewell has had its own attorneys on staff ever since.",
  "CHAIRSIDE PERSPECTIVES": "In August 1998 Glidewell began mailing a modest clinical newsletter to its dentist customers — “Chairside Perspectives” It was short, practical, and unglamorous: proven tips and techniques shared by the lab's own on-staff clinicians, the dentists who practiced inside what was becoming the nation's largest dental laboratory. It ran in this newsletter form for roughly eight years before outgrowing the format.\n\n## Why it matters\n\nA few mailed pages did not move the industry in 1998. What matters is what it seeded — the founding instinct that Glidewell should not only make restorations but teach the dentist how to use them. That instinct is the through-line from the 1980 “education as a bond” beat to everything that follows. Reach, even small reach, was being converted into trust.\n\nThe newsletter outgrew its own format and became Chairside magazine, which is edited today by Neil Park — a dentist who ran his own practice for twelve years, then spent nineteen at Nobel Biocare building the courses that teach dentists a new technique. The job the 1998 mailing invented is still the job.\n\n## The persona on paper\nJim's business cards carry his photograph; so, by rule, do everyone's at Glidewell. People do not throw away a photograph, he reasons, and a customer who knows you only from print keeps the image you gave them. He prefers it that way — he does not meet customers if he can help it, because “if you meet your customers, you have the ability to ruin their perception of who you are.” A teaching publication is the same idea at scale: the laboratory speaks to the dentist in its own voice, on its own terms, every month.\n\n## What the channel became\nToday the company has more than two hundred and fifty training videos on YouTube, a weekly online study club, live courses, a flagship symposium and the magazine Neil Park edits — and the newsletter of 1998 is where that voice first learned to speak to a clinician at the chair.",
  "IN-CERAM ZIRCONIA": "Zirconia came into the laboratory quietly, a full decade before it changed everything. In-Ceram Zirconia, an alumina-zirconia core material from Vita, arrived in the late 1990s as one of several ways to build a crown without metal: a strong ceramic substructure, veneered with porcelain, in place of the cast coping. It was slow, expensive and technique-sensitive, and it did not take over. But it put the word in the room.\n\n## A glass crown and a potato\nJim's own search for a metal-free, affordable crown had begun earlier, at a medical products show in Anaheim in the early 1990s, where he met a materials specialist from Specialty Glass in Florida named Dick Pettigrew. Jim's idea was a castable dental glass for the poor world: a wax pattern, a burn-out, a lump of glass in the sprue melted with an acetylene torch — and half a potato pressed over the hot ring, so that its steam forced the glass into the mould. “This process may sound silly, but it actually works perfectly.” They worked on it for a year with a research technician, Al Botkin. Then a sixty-five-page agreement arrived that made Glidewell a mere distributor and gave the glass company half of Jim's distribution and all of the manufacturing. He did not sign. Pettigrew's three patents went to Pentron, Pentron's to Ivoclar, and with years of development Ivoclar launched IPS e.max — the esthetic monolithic crown the market had been waiting for.\n\n## The lesson, and the lineage\n“This experience taught me to develop all of my ‘inspirations’ in-house.” Glidewell has had full-time patent attorneys on staff ever since. And the line from here runs straight: Dicor's cast glass in the early 1980s, Coors' alumina Cerestore, In-Ceram's zirconia core, e.max's lithium disilicate — every one an attempt at a crown made of a single material. The one that finally did it, in 2009, was full-contour zirconia, milled in one piece, and it came out of this laboratory.\n\n## Meanwhile, on the night shift\nIn 1999 a Bosnian refugee named Dzevad Ceranic joined the lab as a dental technician on nights. He would not meet the owner for years — until a dinner at a friend's house in Newport Beach turned out to be Jim's house. “Where do you work?” “I work for you, sir. On the third floor.” “That's where I work too!” Today he is vice-president of laboratory operations.\n\n“Monolithic is the new standard.” — Jim Glidewell, Constant Change",
  "RESEARCH AND DEVELOPMENT": "Around the turn of the 2000s Glidewell stopped relying on outside vendors for its key materials and began building its own Research & Development. Two moments pushed Jim there. First, a bad experience betting on an outside material — Artglass, a lab veneering composite — taught him that if you don't own the material, you don't own your quality or your future. Second, a conversation with independent researcher Dr. Rella Christensen about a “Volkscrown” — a people's crown, affordable to everyone, that performed like cast gold. Together they pointed at one conclusion: to make the best dentistry affordable and dependable, Glidewell needed its own science.\n\n## Why it matters\n\nEvery later breakthrough — the CAD/CAM build-out of 2002–2006, BruxZir (2009), the automated factory (2019), AI-driven design — grows out of this one decision to build in-house R&D. It is the structural reason the company can keep making the best affordable: it controls the materials and the process end to end. By about 2000 Glidewell had already developed dozens of materials and lab services and was expanding the R&D team that today numbers 150+ people, including a dozen-plus PhDs.\n\nWhat the decision bought first was the machine. The milling laboratory built out from 2002, and the crown that comes out of it in 2009, are this same decision carried through; the mill has a station of its own two years along this wall.\n\n## The structure arrives with the science\nThe same years brought the company its first professional back office. After the dot-com bust of 2000 Rob Grice, who had run mergers with Cisco, walked up to Jim at a neighbourhood barbecue and asked to be considered for CFO; Jim took him to the Fort Lauderdale boat show for three days to watch how he handled people, and hired him. Grice built the HR, IT and R&D leadership that is still in place, and was Jim's closest friend until his death in 2010. “At the time he joined us, we were an overgrown dental laboratory lacking some of the sophisticated management systems necessary to grow a lot larger.”\n\n## The rule\nResearch at Glidewell is not a department that waits for a vendor's catalogue. Jim's standing instruction is two or three viable products a year, an R&D budget on the order of eight per cent of sales, and everything developed inside the building. Thirty patents have been issued, thirty more are pending — “mostly patents that allow us to manufacture without having someone else's patents preventing us.” The crown that made the company's name carries no patent at all.\n\n“Make sure you have a research and development department that brings two or three new products to market every year.” — Jim Glidewell, Constant Change",
  "PLASTIC INJECTION": "Around 2000 the laboratory started making its own plastic: the case boxes the impressions travel in, articulators, the small supplies a lab consumes by the thousand. It is a footnote as a product and a headline as a principle. Glidewell is vertically integrated to a degree almost no company its size attempts — it prints its own advertising, designs and builds its own laboratory interiors, machines its own titanium parts, mixes its own zirconia, runs its own cafeterias and employs its own attorneys.\n\n## Time compression\nJim's argument for it is not cost but speed. Expand into ten thousand square feet the normal way — interview designers, wait for the good one to finish other jobs, put the cabinets out to bid, wait for the winning shop to fit you in — and six months pass before the space earns anything. His own designers and cabinet shop do it in two and a half. “Vertical integration is the mother of time compression. It allows you to accomplish everything faster and at less expense.” He concedes it does not always guarantee quality — sometimes it gives what he calls adequate results — but it gives supercharged growth, and “speed to market is a product.”\n\n## What in-house looks like\nThe company's 2019 headcount shows the shape of it: 2,851 people in dental production — and 350 in logistics, 342 in facilities, 254 in engineering and technology, 196 in manufacturing, 107 in advertising and marketing, 75 in research, 66 in accounting, 57 in education. Do you think, Jim asks, that McDonald's hires outside designers to build fast-food restaurants?\n\n## The other side of the ledger\nOwning the chain has costs he does not hide: six hundred cars parked off-site every month, eight hundred and fifty people on a night shift, a German laboratory losing money against a market where every dentist employs a technician of his own. The polar bear, as the old printer salesman told him, will not make it in Panama.\n\n“Forget about virtual corporations. Build a vertical corporation.” — Jim Glidewell, Constant Change",
  "WEB · CLINICAL VOICE": "The first Glidewell Laboratories website went live in 2001, and the same years gave the company a clinical voice on camera: Dr. Michael DiTolla, a working dentist who joined around 2001 and became the face of its education — and, eight years later, the on-camera champion of BruxZir.\n\n## Perception is reality\nJim had been managing the company's image on paper for twenty years, and the web was paper that reached everyone at once. His rules for print carried straight over: colour, never black and white; the right-hand page, never the left; the price in the advertisement, always — “tell potential customers the price upfront and they will be essentially prequalified when they contact you”; the logo bottom right, where the eye leaves the page. Seventy per cent of readers decide on the headline, the photograph and the caption; the body copy is for the other thirty.\n\n## Why a lab speaks\nMarketing, in Jim's telling, is not a cost centre but the reason the jobs exist. “All of my employees should recognize that their jobs might not be here if it weren't for our marketing team's execution in crafting our story and delivering it to dentists nationwide.” Where the company once served five hundred dentists it now serves fifty-eight thousand — around forty per cent of the profession — and it picks up some eight thousand new customers a year in a country that graduates forty-five hundred dentists. The budget he recommends to any laboratory is four to ten per cent of sales, and he spends at the top of it.\n\n## The addresses today\nThe company Jim built keeps its front door on the web: the sites, the shop and the social channels are linked below, each opening in its own window.\n\n“Perception is reality.” — Jim Glidewell, Constant Change",
  "CAD/CAM ENTERS THE LAB": "In the early 2000s the laboratory's half of the crown went digital. Instead of carving a coping in wax and casting it, a technician scanned the stone model, designed the coping on a screen and milled it out of a block. Nothing changed at the dentist's end — the impression was still taken in silicone, poured into a model and posted in a box — but inside the building the machine had arrived.\n\n## Who got there first, and it was not Glidewell\nThe idea is older than the company's use of it. François Duret designed the first dental CAD/CAM in the 1970s; in 1985 Werner Mörmann and Marco Brandestini put CEREC into a dental office in Zurich and milled a restoration while the patient sat in the chair. Nobel Biocare's Procera made the CAD/CAM ceramic substructure a commercial product in the mid-1990s, and around 2001 milled-zirconia frameworks arrived from 3M ESPE (Lava), Dentsply (Cercon) and Nobel (Procera Forte). Those outside systems opened the door.\n\n## What Glidewell did\nIt walked through early, and then built its own. As one of the largest laboratories in the country it took up the outside systems around 2002 — Cercon and Wol-Ceram — and in about 2004 hired an engineer from 3D Systems, Mervyn Rudgley, to lead digital manufacturing, with one explicit brief: a zirconia substructure at the price of a PFM. In 2006 that became Prismatik CZ, the company's own milling-and-software system paired with a 3Shape scanner. A clever trick — milling thin copings from a soft, bisque-fired block and sintering them afterwards — let it skip costly diamond tooling and drive the cost down. The angle was never the newest technology; it was the best one at a price a working dentist could say yes to.\n\n## Why this is the hinge\nThe first half of this hall is a craft: many skilled hands, several weeks, one restoration. Everything after 2009 is a process: a file, a mill, a line. This is where the one becomes the other. Without the quiet build-out of these years there is no BruxZir in 2009 and no automated factory in 2019 — the company would have had to buy its revolution from somebody else, at somebody else's price.\n\n## And what it still was not\nThe model on the scanner's table was a physical model, poured from a silicone impression that had travelled to Orange County in a box. Digital began at the laboratory's door. Five years later it would begin in the patient's mouth — and that is the year standing next to this one.\n\n“Do things faster, better, and less expensive than the competition.” — Jim Glidewell, Constant Change",

  "THE DIGITAL REVOLUTION": "A revolution is easier to name than to date. This one has no single year — it has four, and this stretch of the hall walks you through all of them.\n\n## The four moments\n• 2002 — the mill arrives. The laboratory takes up outside CAD/CAM systems, Cercon and Wol-Ceram: a technician scans the stone model, designs the coping on a screen and mills it. The dentist's end of the job has not changed at all.\n• 2006 — the system becomes its own. Prismatik CZ: Glidewell's own milling and software, paired with a 3Shape scanner, built to a brief of a zirconia substructure at a PFM price.\n• 2007 — the case stops being a thing. The first intraoral scan arrives straight from a practice, with no impression and no model behind it. From here every case leaves a record.\n• 2009 — the crown becomes one piece. BruxZir: full-contour zirconia milled from a solid blank, with no porcelain to chip — the point at which the digital laboratory stops making the old crown a better way and starts making a different crown.\n\n## Two different things, five years apart\nThe word digital covers how a crown is MADE and how a case ARRIVES, and they did not happen together. Production went first: wax and casting gave way to a screen and a mill, while the impression still came in a box. The case followed in 2007 — and that one turned out to matter more, because a file leaves a record and a stone model does not. The thirty-million-case archive behind today's automatic design begins on the day the box stopped coming.\n\n## The wall in front of you\n“The impression becomes a scan. The crown becomes a file.” Both sentences are true of this whole stretch, not of one year in it. The crown turning on the plinth is being read, designed and cut in the same breath, which is what the decade was for. The man who later automated that design, Sergei Azernikov, is the voice on this page.\n\n“The machine won't replace you — someone who knows how to use it will.” — Sergei Azernikov, interview, July 2026",

  "PRISMATIK": "In January 2005 Glidewell launched Prismatik, its own line of leucite-reinforced pressed ceramics — the esthetic front tooth made in-house rather than bought in. A year later Prismatik Dentalcraft became a manufacturing division in its own right, and the name would go on to stand for everything the company machines and mixes for itself: milling systems, titanium implant components, zirconia.\n\n## The material was half of it\nThe machine was the other half, and it was already running: the milling laboratory had been built out from 2002, and in 2006 this same Prismatik name went onto Prismatik CZ, the company's own milling-and-software system — the station before this one on the wall. Here the name means what it meant first: a material poured, pressed and fired in-house rather than bought in by the case.\n\n## e.max, Obsidian and a friend across a lawsuit\nThe company also became one of the largest users of Ivoclar's IPS e.max, the lithium-disilicate crown that finally gave the metal-free front tooth its material — thirty-five hundred units a week even today, down from six thousand before zirconia. When Glidewell developed its own glass ceramic, Obsidian lithium silicate, engineered around Ivoclar's patents, Ivoclar sued anyway. “Bob, we didn't violate your patents,” Jim told its chief executive, Robert Ganley. The two remain friends; Obsidian found its own ground bonded to metal frameworks for long-span bridges, and e.max kept its playground. “Litigation is the burden of every successful company.”\n\n“Our motto is and always will be: do things faster, better, and less expensive than the competition.” — Jim Glidewell, Constant Change",
  "FIRST DIGITAL CASE": "In 2007 the laboratory took in its first digital impression — an intraoral scan sent straight from a practice — instead of a silicone impression in a box or a poured stone model. Most of the industry was still pouring impressions. The company dates the start of its digital case database to that moment.\n\n## The quietest, most consequential beat on the line\nEverything visible about it was convenience: no goop, no shipping a physical model. The invisible part was the real one. From then on every case left behind a digital record, and two decades later that archive is more than thirty million cases — the training data behind the systems that now design crowns and mark margins automatically. The moat was not the software; it was starting to collect twenty years early. Behind the number stand the eighty-four certified dental technicians, with clinicians, material scientists and engineers, whose judgement shaped what the system learned: the machine learned from named craftspeople, not from nowhere.\n\n## The chain it starts\n• 2007 — the first digital case, when most of the industry was still pouring impressions.\n• 2016 — machine learning built into the design software.\n• 2017 — the first crown designed by a generative adversarial network is milled and seated.\n• Today — more than ninety-five per cent of the lab's restoration designs are proposed by the model, on thirty million cases and counting.\n\n## Why a dentist buys a scanner\nJim's explanation of the whole transition fits in a sentence: “Dentists don't want to buy a scan, they want to buy a crown.” A crown from a digital scan costs the dentist less than one from an elastomeric impression, so to reach the cheaper crown the practice buys the scanner. The cloud of points on this plinth is the case that arrived that year, read as what it really was — data — and as you walk on, it leaves for the screen ahead.\n\n“Let's continue to make quality crowns untouched by technicians and charge less for the effort.” — Jim Glidewell, Constant Change",
  "BRUXZIR": "In 2009 Glidewell launched BruxZir — a full-contour crown milled from one solid piece of zirconia, with no porcelain veneer to chip. Zirconia and CAD/CAM were already in dentistry; In-Ceram Zirconia had been in the lab since 1999, Lava and Cercon since 2001. What the company did was take monolithic zirconia, drive it through its own high-volume lab, and offer it at a price and a turnaround an ordinary dentist could say yes to — then make it the default. The first pitch was blunt: more brawn than beauty, a near-unbreakable crown for grinders, implant cases and tight-bite molars where a metal-backed crown or gold used to be the only safe answer.\n\n## Who made it\nThree roles, not one. The founder's bet — Jim funded the in-house milling and materials research that let it exist, and credits “our R&D teams.” The technical creator — Robin Carden, vice-president of R&D, who led development and holds the process patent for the binder-free slip-cast zirconia blank. The clinical champion — Dr. Michael DiTolla, who drove adoption through the magazine and the on-camera hammer test. The crown itself carries no patent. “We don't even have a patent on BruxZir zirconia crowns, despite the fact that we were the first to develop and popularize them. Being first to market is the most important part of a launch.”\n\n## How a revolution goes mainstream\nNot through advertising. It went mainstream when dentists started phoning their own local laboratories and asking for “that BruxZir thing,” and the labs had to find a way to make it. Demand pulled it in. Independent research followed: Rella Christensen's TRAC Research ran a multi-brand monolithic-zirconia study over more than a decade, the strongest outside validation the material has. Today the lab mills some forty thousand BruxZir units a week; the brand counts tens of millions placed. In 2018 a more translucent BruxZir Esthetic arrived for the smile zone at a hundred and nine dollars, and grew at seventy per cent a year — the affordable workhorse got beautiful.\n\n## The year the donuts stopped\n2009 was also the only year in the company's history that sales fell — by two per cent, in the recession — and two managers saved eighty thousand dollars by cancelling the Friday donuts. A fourteen-year employee caught stealing gold explained herself with one sentence: “You used to get us donuts on Fridays, and you don't do that anymore.” When the donuts came back the floor cheered like a war had been won. Jim would have kept her — “I would have put her in charge of loss prevention.”\n\n## What a crown costs now\nJim reverse-engineered the ninety-nine-dollar crown — “an easy number for dentists to embrace” — and made it work at a fifty per cent gross margin on ninety thousand units a week, against an industry average of a hundred and forty-eight. The material markup on a zirconia crown is about five dollars, where other materials carry twenty to seventy. “Zirconia as a commodity is good for dentistry. That's progress for dentistry, but very disruptive if you're a materials vendor.”\n\n“The introduction of BruxZir Solid Zirconia caused a change that is still reverberating nearly ten years after its launch. We not only adapt to change; we've created change.” — Jim Glidewell, Constant Change",
  "SCREW-RETAINED": "For decades dentists stayed with cement-retained crowns even though screw-retained ones are easier to retrieve and avoid cement left under the gum. The reason was rarely clinical — it was cost and complexity. Titanium bases, UCLA abutments and clinical screws were sold by the implant OEMs (Nobel, Straumann and others) at prices that could roughly double the lab cost of a case.\n\nWhat Glidewell did — two moves.\n1) Made the parts itself. Through its own precision-machining operation, Prismatik Dentalcraft, the company began producing the Inclusive® Prosthetic Components line — titanium bases, esthetic and multi-unit abutments, analogs, screws, temporary and UCLA abutments, transfer copings — compatible with the major implant systems. That broke the OEM parts bottleneck and let Glidewell quote a flat lab fee for a screw-retained crown. Screw retention stopped being a premium option and became something an ordinary practice could afford.\n2) Solved the material problem. Screw retention stresses the crown around the screw channel, and porcelain-fused-to-metal chipped there. BruxZir monolithic zirconia (2009) could take it. The lab began bonding the BruxZir crown to the titanium base before shipping, so the dentist received one finished unit: seat it, torque the screw, done. No cement in the patient's mouth at all.\n\nWhy it belongs on this line. It is the same mechanism as every other beat here, applied to a technique instead of a product: the best option existed already, and Glidewell removed the price and the complexity that kept ordinary dentists away. It is also the clearest case of vertical integration paying off clinically — owning the machining is what made the flat fee possible.\n\n## Used, not new\nThe machining operation that made the flat fee possible began, characteristically, with an argument about equipment. To start a dental implant department, the CFO and the COO bought a two-hundred-and-fifty-thousand-dollar Swiss milling machine — brand new, because “you want to do it right.” It took a Swiss technician a month to get it running. Once it was clear the parts could be made, the next twenty machines were bought used, at an average of sixty thousand dollars each. “I would resist the urge to believe one must start a new enterprise with nothing but the best equipment.” Jim's first laboratory, after all, was four thousand dollars of used equipment; forty years on, he still buys large machines at auction.",
  "SCANNERS · SCALE": "August 2012: Glidewell bought IOS Technologies outright, and with it the FastScan intraoral scanner and the TS150 mill — rather than wait for someone else to build the scanner its whole digital flow depended on. The International Technology Center had opened the year before. It is a milestone, and a cautionary one.\n\n## The scanner that was too good\nYears earlier Jim had lent eight hundred thousand dollars to two brothers in San Diego who had spent five million developing an intraoral scanner and were months from a sale. The sale never came; to protect the loan the company put in three hundred thousand a month, then bought them out. Eight years and eighteen million dollars later, in 2016, the project was shut down. The IOS scanner was probably the most accurate ever built — and it was too delicate to handle without care, its cart and hand piece too large, and it needed reflective powder to scan. Others shipped smaller, laptop-driven, powder-free units for less. “It all boils down to the same mantra: faster, better, and less expensive.” The one lesson he takes from it: if a piece of technology takes seven years to bring to market, the market has moved on.\n\n## The on-ramp, not the story\nScanning is now near-universal — roughly seventy per cent of dentists have switched — so it is not what sets Glidewell apart. What does is downstream: the design software that proposes the crown, the automated factory that mills it, the chairside mill that makes it in one visit. The intraoral scanner is the front door to all of that, and the company's own scanner, fastscan.io, would finally arrive in 2022, built with Medit.\n\n“If it takes seven years to bring a high-tech piece of equipment to market, you are producing outdated merchandise.” — Jim Glidewell, Constant Change",
  "HAHN TAPERED IMPLANT": "## Chronology\n\n• 1997 — Dr. Jack Hahn (creator of the NobelReplace implant) designs the original tapered implant; his own pre-history, not Glidewell's. • 2000s–early 2010s — Glidewell enters implants from the side, not with its own implant: the Inclusive line of FDA-cleared prosthetic components (abutments, screws, copings) compatible with most third-party systems, made in-house by Prismatik Dentalcraft. The point is vertical integration — cut the OEM markup, offer flat, predictable lab fees. • 2014 — Hahn begins working with Glidewell's engineers and Jim Glidewell to design a new implant. • 2015 — LAUNCH of the Hahn Tapered Implant System. It becomes one of the fastest-growing implant systems in the US, adopted by thousands of dentists. Stated goal: a high-quality implant at a fraction of the price, finished with a BruxZir crown, under a lifetime warranty from implant to restoration. • 2019 — the Inclusive component line expands to 22 major implant systems; clinical studies (2-year, then 6-year) show a 99.2% success rate and under 0.2 mm bone loss. • 2020 — medical-grade titanium scan bodies bring implant restorations into the digital workflow. • ~2023–24 — Hahn Tapered is renamed the Glidewell HT Implant System. • 2024–25 — the Glidewell Tooth Replacement Solution (full digital bundle) and major 2025 upgrades (a 6.0 mm implant, new guided-surgery kits).\n\nWhat it is today. As a private company Glidewell publishes no product-level revenue split, so an exact share can't be cited. Qualitatively: it is one of Glidewell's core product lines and one of the fastest-growing implant systems in the US; Glidewell has restored hundreds of thousands of implant cases and makes both the implant and its components in-house through Prismatik Dentalcraft (ISO-certified, FDA-cleared), positioning implant dentistry as a standard of care across the economic spectrum.\n\nThe connections (why implants link to so much on the timeline). • BruxZir / restorative — the implant is finished with the same BruxZir crown; one warranty from implant to restoration. • Vertical integration — Prismatik makes the parts in-house, kills the markup, enables flat pricing; the same move as the 2000 plastic-injection beat. • Digital / glidewell.io — scan bodies, guided surgery, digital treatment planning. • CE / education — world-class education and symposia, the Misch lineage through Resnik, teaching GPs to place implants. • Jim personally — Hahn and Jim Glidewell co-devised the system. • Accessibility — the throughline: a fraction of the price, across the economic spectrum.\n\n## Twenty-five to three hundred\nDzevad Ceranic, the night-shift technician Jim had met at a dinner party, was made general manager of the implant department when it had twenty-five people. Two years later it had over three hundred. “Running this fast-growing department often felt like we were drinking from a fire hose.” Implants were still a technology many dentists mistrusted; the department grew by making the parts and the training ordinary. Jim's note to the young manager is the one he sends everyone who grows too fast: “People are like bananas: once you bruise a banana, you can't take the bruise out.”\n\n## And the other end of the price list\nThe same year, 2015, a director of lab operations named Monica Carmona was given a room, some equipment and a brief: start a limited-service laboratory for price-conscious dentists. Crown World sells a seventy-nine-dollar crown and became a multi-million-dollar business. Whether the dentist passes the saving to the patient, Jim admits, the lab cannot know. Some do, and advertise it — “that is our greatest hope. Our job would be done!”",
  "GLIDEWELL.IO": "In November 2017, at its first Glidewell Dental Symposium in Dallas, Glidewell unveiled glidewell.io — a complete in-office ecosystem that put the lab's whole workflow on the dentist's own counter. Three pieces: an intraoral scanner (the iTero Element, through a partnership with Align), fastdesign.io software that uses machine-learning to propose the crown design, and the fastmill.io in-office mill. The breakthrough material was BruxZir NOW — a fully-sintered zirconia block that comes out of the mill finished, with no firing oven required. The promise: scan, design, mill and seat a single crown in roughly one visit — about an hour — instead of sending an impression to a lab and bringing the patient back in two weeks.\n\n## Why it matters\n\nFor decades the lab was a separate place: you took an impression, mailed it, waited, called back the patient. glidewell.io collapses that distance — the lab's capability now lives inside the operatory. Access, again: fewer visits for the patient, less travel, faster care.\n\nWho it reaches is the test of it. Paresh Patel works the cheap end of the same argument — five thousand implants placed, three and a half thousand of them mini implants, which exist for the patient who cannot afford the conventional case or cannot take the surgery. The mill on the counter and the small implant are one idea in two pieces of hardware.\n\n## A division that competes with the company\nA chairside mill cuts the laboratory out of the crown. For a laboratory to build one looks like an unnatural act, and Jim describes it exactly that way — and as the only way to survive. “Sears could have outcompeted Amazon, but they failed to see the future in online sales. By nature, it's hard to start a division that competes against your core business.” If same-visit milling is the inevitable future, the choice is to build it or watch someone else build it. “Rest assured that if we don't develop it, someone else will. Chairside milling might as well be our next innovative transformation.” The memoir ends on that page, with one word: Onward!",
  "2018": "In 2018 the laboratory milled and seated the first crown designed by a generative adversarial network — a neural network trained on fifteen hundred pairs of scans to propose the surface between opposing teeth that technicians find hardest to draw. The paper, written with the University of California, Berkeley, is called “Learning Beyond Human Expertise.” To the company's knowledge it was the first time anyone had generated a physical object with the technique.\n\n## What the network learned from\nThe training data was the archive that had been quietly accumulating since the first digital case in 2007: by then millions of scanned cases and the designs that eighty-four certified technicians had made for them. The model did not invent a tooth; it learned what a good one looks like from people who had made hundreds of thousands. Sergei Azernikov, who leads the company's CAD/CAM software, describes what followed as a closed loop — every case the lab ships trains the next design, so the system gets better without a new factory or a new hire. Today more than ninety-five per cent of the lab's restoration designs come out of the model, and a technician is the first human to see the case, mostly to approve it.\n\n## From one crown to the default path\n• 2016 — machine learning is built into the design software.\n• 2017–18 — the first GAN-designed crown is milled and placed in a mouth.\n• 2019 — the automated factory: designs routed straight to robotic mills.\n• Today — CrownAI and MarginAI propose the crown and its margin line; a designer went from about fifty crowns a day to about two hundred, and the job became quality control.\n\n## The company in 2018\nThe same year Glidewell bought two more office buildings — a quarter of a million square feet, about eighty-eight million dollars — to have room to grow into, launched BruxZir Esthetic, and said goodbye to Jim Shuck, the marketer who had worked beside Jim for twenty-five years and taken the company from ten million dollars in sales to over four hundred. Jim's projection at the time: ten thousand employees by 2025.\n\n“The machine won't replace you — someone who knows how to use it will.” — Sergei Azernikov, interview, July 2026",
  "BRUXZIR FACTORY": "In 2019 Glidewell crossed the line from digital-assisted to digital-native production: fully automated, AI-designed, robotic manufacturing of monolithic zirconia crowns. Designs are proposed by the generative model, routed to production lines where robotic arms feed BruxZir blanks into banks of interconnected mills, and every restoration is checked by automated metrology before it ships. No hand-waxing, no manual nudging of the CAD. The machine designs the tooth and the machine makes it.\n\n## Set against the first bench\nThis is the climax of the arc the hall has been walking since 1907. There: a technician, wax, casting, a fired porcelain layer, hours of judgement per unit. Here: software draws the crown, a robot cuts it, a sensor checks it. The goal is the same — a tooth that fits and looks right — and the labour, the variability and the cost are transformed. Automation is how the best dentistry gets made affordable and brought to scale: not by cutting corners but by removing variability and the human bottleneck.\n\n## How a zirconia crown is actually made\nYttria-stabilised zirconia powder is spray-dried into granules, pressed into blanks — Glidewell casts its own, binder-free — and pre-sintered into a soft, chalk-like disc you can scratch with a fingernail. The soft disc is milled oversized into crown shapes, under a spray of coolant, then fully sintered at around fifteen hundred degrees, where it shrinks a fifth in every dimension, densifies and gains both its strength and its translucency. Mill soft, then fire: soft zirconia cuts fast without wrecking tools, and the furnace turns chalk into one of the hardest things in the mouth.\n\n## The man and the dog\nJim likes the line of the organisational scholar Warren Bennis: “The factory of the future will have only two employees, a man and a dog. The man will be there to feed the dog. The dog will be there to keep the man from touching the equipment.” In the same breath he warns the small laboratories he speaks to: every day three of them close; the analog talent they spent a life acquiring is being made useless by digital engineering; go digital, learn digital, think digital. The factory on this floor is that warning, built.\n\n## Who made it\nDavid Leeson, the company's vice-president of engineering, is the architect of the automated line — the robots, the mills, the micro-CT check. Azernikov's software imagines the tooth; Leeson's metal makes it real. Behind them, in 2019, stood 2,851 people in dental production and 75 in research, in a company of about five thousand.\n\n“Digital manufacturing has erased the errors caused by humans!” — Jim Glidewell, Constant Change",
  "GUIDING LEADERS": "In 2019 Glidewell launched Guiding Leaders — a free leadership and practice-development program built and run by Bobbie Norton at the Irvine campus. It was created as the profession tipped toward a new majority: women now make up more than half of graduating dentists, and clinical school teaches none of the business, communication and leadership skills a practice owner actually needs. Guiding Leaders fills that gap at no cost to the dentist. It has around a hundred alumni, each cohort earning up to about eighty continuing-education units between the spring start and the autumn graduation.\n\n## The thesis, turned outward\nJim spent fifty years making the best dentistry affordable for patients. Guiding Leaders is the same instinct pointed at the profession itself — removing the cost barrier to the skills that let a dentist own, grow and survive. It is reinvestment, not marketing: the company gives away the playbook and asks nothing clinical in return, and it reframes a laboratory that sells crowns into one that grows the people who place them.\n\n## Let your good people run\nThe program is the outward face of how the company has always been run inside. Jim does not micromanage — “telling an employee what they have to do every step of the way ruins them” — and promotes from within on ability rather than seniority; one of Darryl Withrow's managers, now running a hundred-and-ten-person facilities team, started as a cabinet installer. Every hire, for any job, passes the same two-minute math test; job advertisements run in Cantonese, Vietnamese and Mandarin; and the managers who write about him in his own book — a refugee from Bosnia who became VP of lab operations, a fulfilment clerk who became VP of human resources, a delivery boy who became VP of operations — are the proof he offers that go-getters with a sharp mind, given room, rise.\n\n## The faces on the counter\nThree of the alumni stand on the counter of this bay: Ellen Paulisick, who built a new practice entirely on the Glidewell system; Nadia Rodriguez, a young cosmetic dentist in New York; Bianca Clark, working in 3D printing. Their pages are a tap away.\n\n“Management is having employees accomplish the company's objectives for their own selfish reasons.” — Jim Glidewell, Constant Change",
  "FASTSCAN.IO": "In 2022 fastscan.io, built with Medit, folded an intraoral scanner into the Glidewell ecosystem — the front door to the all-digital workflow. Capturing the mouth digitally is the cheapest possible front of the flywheel: no physical impressions, no remakes, data straight into the box that designs and mills the crown. With fastdesign and fastmill already in the operatory, the scanner completed the set — from the first look at the tooth to the finished restoration, the case never leaves the digital chain.\n\n## Three moves in three years\nThe scanner arrived at the end of a turn at the top of the house. In December 2020 Jim published his memoir, “Constant Change: Adventures in Business and Life — My Journey from Start-Up to 5,000 Employees” — his own account of the Kentucky farm, the Navy, the Tustin lab, and the decision, again and again, never to sell or go public. And fastscan.io, built with Medit, put the company's own scanner at the front of its digital flow.\n\n## The spring the cases stopped\nThe book was finished in December 2019. Its addendum was written after the spring of 2020. The first two weeks of March were the strongest in the company's history — a hundred thousand units a week. By the third week the incoming count had fallen to five thousand, and Jim was in hospital with the virus, two weeks on eight litres of oxygen, thirty-two pounds lighter when he came out. While he was there his managers furloughed two and a half thousand people, then fifteen hundred more, and the CFO secured a thirty-seven-million-dollar credit line with one phone call. Sales fell from fifty million a month to five. By June they had recovered completely; eighty million dollars and about three hundred positions were lost for good. “It is the lowest point in my professional career.” The memoir's title was chosen before any of it.\n\n“Never have an exit strategy. You owe it to your employees to never sell your company.” — Jim Glidewell, Constant Change",
  "THE CROSSOVER": "In March 2023, for the first time, more digital impressions arrived at Glidewell in a month than physical ones. Nothing announced it. It is simply the month the two lines crossed — sixteen years after the first digital case came in, in 2007.\n\n## What crosses\nOn one side, the case the mail was built on: two impressions in their trays, wrapped and boxed, posted, opened, poured into stone, trimmed, mounted, and only then read by a technician. On the other, a file: a scan taken at the chair, sent in a second, opened in the design software the same hour, with no model to pour and no box to lose. The carton on this page is the physical one, and you can do to it what the month did.\n\n## Why the line moved\nJim had explained the mechanism years before it happened. “Dentists don't want to buy a scan, they want to buy a crown. But a crown produced from a digital scan, rather than an elastomeric impression, costs them less. So, for a dentist to access these cheaper crowns, they need to buy a scanner.” The scanner makers — Align, 3Shape, Medit, Sirona and, from 2022, Glidewell itself — did the rest. He also saw where it led: an intraoral scanner lets a dentist send a digitised impression to a laboratory anywhere in the world and get a finished crown back overnight. The delivery car, the local lab's oldest advantage, is gone with the box.\n\n## What it changed in the building\nThe model-and-die room — the least valued and, Jim insists, the most critical department in any laboratory, where most remakes are born — shrinks as the cases that need it shrink. A designer opens a scan instead of a stone model. The data that trains the design software arrives already digital. And the appliances the company built its categories on follow the same path: the Silent Nite of 1996 is now the Silent Nite 3D, designed and printed from a scan.\n\n“Intraoral scanners will allow a dentist to send his digitized impression to a laboratory anywhere in the world and receive a finished crown back overnight.” — Jim Glidewell, Constant Change",
  "2026": "This is the present — 2026. Automated monolithic milling, the same-visit zirconia crown Glidewell helped push to scale, is no longer remarkable; it is simply how chairside dentistry runs. The frontier has moved to three converging fronts: AI that reads scans and drafts restoration designs, robotics that guide the hand in surgery, and the single-visit promise extended from the crown to the whole treatment. By late 2025, AI-assisted CAD tools were reported to cut design time by 30–45 minutes per case and reduce remakes by roughly 18 percent, while Neocis cleared its next-generation Yomi S implant robot with FDA, its planning AI auto-segmenting anatomy from CBCT scans — a system now reachable by general dentists, not just specialists.\n\n## Why it matters\n\nThe 2026 frontier is that same throughline, now carried by software and machines. AI design and chairside automation compress chair time, labor, and remakes — and cost follows time. Nobody here “invented” single-visit or robotic dentistry; the claim is that the tools are being made the default and brought within reach of the everyday practice, which is exactly where access lives or dies.\n\n## Growth or death\nJim's own reading of the present is biological. A company is a living organism; the moment it stops growing it begins to die, because the best people leave first. His target is fifteen per cent a year; his practice is to carry a few per cent more staff and ten per cent more space than the business needs, to reinvest every pre-tax dollar, and to build the division that competes with the core before a competitor does. “No business lasts forever. But you can transform and grow a company by keeping some of the old parts while you start up new viable divisions.”\n\n## The unfinished part\nFor all the millions of smiles the laboratory and the industry have restored, about half the United States population is priced out of dentistry or afraid of it, and in Jim's own words dentistry and medicine ought to be treated as non-profit enterprises — though he does not claim to know how. The ninety-nine-dollar crown, the seventy-nine-dollar crown, the same-visit crown and the crown a model designs in seconds are his answer so far. The story, as his book says, has no definitive ending.\n\n“Either the sun will rise tomorrow, or it will not. Everything in between can be negotiated.” — Jim Glidewell, Constant Change",
  "AI · SCALE": "By the early 2020s Glidewell folds generative AI design into the heart of its lab — tools like CrownAI and MarginAI that propose a finished crown and its margin line automatically, rather than waiting for a technician to draw every case from scratch. This sits on top of staggering volume: a reported about 500,000 restorations a month, more than 5,000 staff, and the standing of the largest dental lab in the world. Glidewell did not invent AI; it brought AI design to scale and made it the default path for routine cases. Sergei Azernikov, VP of CAD/CAM Software and the de-facto AI lead, describes a closed quality loop: millions of cloud cases train a generative model that now produces more than 95% of the lab's restoration designs (Glidewell, 2025–26) — the design is good enough that a human rarely needs to touch it.\n\n## Why it matters\n\nAI design is where that flywheel becomes visible and undeniable. When a model designs the crown in seconds — now more than 95% of restoration designs — across roughly half a million units a month, the cost of the single most labor-intensive step collapses — and scale plus AI becomes the affordability proof, not a slogan. Access is the throughline, and here it stops being aspiration and becomes arithmetic.",

           bio:["A Kentucky farm near the Cumberland River, a latchkey childhood, and a Navy hitch during the Vietnam era. At twenty-one he came home and sold Prudential and New York Life insurance door to door in Las Vegas — which is where the instinct behind the 1976 direct-mail campaign comes from, long before there was a lab to mail anything for.",

let NAME_RE_MAP = new Map();
const NAME_RE = (() => {
  const forms = [];
  for (const pair of NAME_FORMS) for (const f of pair[1]) forms.push([f, pair[0]]);
  forms.sort((a, b) => b[0].length - a[0].length);
  for (const f of forms) NAME_RE_MAP.set(f[0], f[1]);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(?<![\\w-])(' + forms.map(f => esc(f[0])).join('|') + ')(?![\\w-])', 'g');
