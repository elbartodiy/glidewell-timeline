  const pitch = Math.max(4*SS, 8 * kk * SS);
  ctx.strokeStyle = 'rgba(0,0,0,0.30)';
  ctx.lineWidth = Math.max(1, pitch * 0.24);
  ctx.beginPath();
  for (let gx = x0 + pitch; gx < x0 + vw; gx += pitch){ ctx.moveTo(gx, y0); ctx.lineTo(gx, y1); }
  for (let gy = y0 + pitch; gy < y1; gy += pitch){ ctx.moveTo(x0, gy); ctx.lineTo(x0 + vw, gy); }
  ctx.stroke();
  // and the panel seams of the rig it is built from
  ctx.strokeStyle = 'rgba(5,6,8,0.85)'; ctx.lineWidth = 2.4*SS;
  ctx.beginPath();
  for (let i = 1; i < 4; i++){ ctx.moveTo(x0 + vw*i/4, y0); ctx.lineTo(x0 + vw*i/4, y1); }
  for (let i = 1; i < 3; i++){ ctx.moveTo(x0, y0 + hgt*i/3); ctx.lineTo(x0 + vw, y0 + hgt*i/3); }
  ctx.stroke();
}
function drawFilmRelays(){
  const v = WELCOME_TV.v;
  // the era screens light up only for the engaged film: no sound, no furniture
  if (!v || v.muted || v.readyState < 2) return;
  for (const r of FILM_RELAYS){
    if (Math.abs(r.x - cam.x) > CULL_BAY) continue;
    if (r.kind === 'crt70') drawFilmCRT70(r);
    else if (r.kind === 'hang') drawFilmHangTV(r);
    else if (r.kind === 'crt95') drawFilmCRT95(r);
    else if (r.kind === 'lcd05') drawFilmLCD05(r);
    else if (r.kind === 'proj') drawFilmProjector(r);
    else if (r.kind !== 'vwall' && r.kind !== 'plasma') drawFilmPanel(r.x, r.w || 430, false);
  }
}

/* Финальный стол придвинут на 450 ближе к ковру: сцену перед ним разобрали, и
   между ковром и столом остался провал (Эльдар, 2026-09-23). */
const FIN_X = SHIFT(29750) - 450;
/* ТАБЛО МЕРОПРИЯТИЙ — как расписание вылетов, на стене финала.
   Зал заканчивается тем, что компания делает прямо сейчас, и это единственный
   объект в нём, который меняется сам: настоящие ближайшие курсы, город, даты,
   преподаватели, остались ли места (Эльдар, 2026-09-23).

   Данные лежат в data/events.json СВОИМ файлом. Витрина, откуда они берутся,
   не отдаёт CORS — из браузера её не прочитать, — а зал может стоять на машине
   в здании без интернета, и табло, зависящее от запроса наружу, однажды
   погаснет на глазах у посетителей. Файл обновляет скрипт (expo/tools/
   fetch_events.py) по ночам; зал перечитывает его раз в четверть часа. */
/* СВОЙ КУСОК СТЕНЫ. На 1560 оно налезало на карточку CrownAI и на строчку
   «An arc the length of one life»; 2400 — пустой участок левее их обоих. */
const BOARD_X = SHIFT(29750) - 3400;   // своё место на стене, от стола не зависит: он подвинулся, табло нет
/* РАЗМЕРЫ ТАБЛО. Сверху его держит ореховый карниз (низ на −90), снизу —
   столешница (700). Всё, что между ними, — его полоса; залезть на карниз значит
   читаться как наклейка поверх потолка. */
/* ПРОПОРЦИИ ЭКРАНА, А НЕ ЛЕНТЫ. 2260×585 — это почти 4:1, такой формы панелей
   на стенах не бывает, и доска читалась как наклейка (Эльдар, 2026-09-23:
   «слишком широкое и короткое, надо реалистичнее»). 16:9 — то, что действительно
   висит: высоту берём всю, какая есть между карнизом (низ на −90) и столешницей
   (700), ширина следует из неё. */
const BOARD_H = 740, BOARD_W = Math.round(BOARD_H * 16 / 9), BOARD_TOP = -48;
/* Низ держится выше, чем начинается карточка CrownAI: она висит на ближней
   плоскости и по экрану едет быстрее стены, поэтому при некоторых камерах
   наезжает на угол. Развести их расстоянием нельзя — только высотой. */
/* ОДНА ШКАЛА НА ВСЁ. Строки не должны касаться друг друга, а кегли — спорить:
   высота строки втрое больше названия курса, вторичное — ровно вдвое меньше
   главного, поля одинаковые со всех сторон (Эльдар, 2026-09-23: «не впритык,
   стильно и удобно»). Всё в мировых единицах, на экран переводится через u. */
const BD = {pad: 52, head: 112, row: 118, date: 40, mon: 19, title: 30, who: 19.5,
            city: 25, tag: 18, brand: 34};
let BOARD = {rows: [], updated: null, scroll: 0, tried: 0, age: null};
function boardLoad(){
  const now = (typeof state !== 'undefined' ? state.time : 0) || 0;
  if (BOARD.tried && now - BOARD.tried < 900) return;      // раз в 15 минут
  BOARD.tried = now || 1e-6;
  fetch('data/events.json?nc=' + Date.now())
    .then(r => r.json())
    .then(d => {
      /* ФАЙЛ МОЖЕТ БЫТЬ СТАРЫМ — ЗАЛ ЭТО ПЕРЕЖИВЁТ. Обновлялка ходит по
         расписанию, но день без сети или упавшая задача бывают у всех, а
         табло, показывающее вчерашний курс, хуже пустого. Прошедшее зал
         отбрасывает сам, по своим часам. */
      const today = new Date().toISOString().slice(0, 10);
      BOARD.rows = (d.events || []).filter(e => e.to >= today);
      BOARD.updated = d.updated;
      BOARD.age = d.updated ? (Date.now() - new Date(d.updated)) / 86400000 : null;
    })
    .catch(() => {});
}
const BOARD_MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
/* ТАБЛО МЕРОПРИЯТИЙ на стене финала: настоящие ближайшие курсы — город, даты,
   преподаватели, остались ли места. Единственный объект в зале, который меняется
   сам (Эльдар, 2026-09-23). Данные лежат СВОИМ файлом в data/events.json: витрина,
   откуда они берутся, не отдаёт CORS, а зал может стоять на машине в здании без
   интернета — табло, зависящее от запроса наружу, однажды погаснет на людях. */
function drawEventBoard(t){
  if (Math.abs(cam.x - BOARD_X) > CULL_BAY) return;
  boardLoad();
  const seg = SEGMENTS[3];
  const kw = k((seg.z0 || 1400) - 6);
  const u = kw * SS;
  const x0 = px(BOARD_X - BOARD_W/2, kw), x1 = px(BOARD_X + BOARD_W/2, kw);
  if (x1 < -40 || x0 > W + 40) return;
  const yTop = py(BOARD_TOP, kw), yBot = py(BOARD_TOP + BOARD_H, kw);
  const w = x1 - x0, h = yBot - yTop, pad = BD.pad * u;
  const F = seg.font;
  ctx.save();

  /* ---- корпус: тёмное стекло в тонкой светлой оправе ---- */
  ctx.shadowColor = 'rgba(16,22,30,0.30)'; ctx.shadowBlur = 30 * u; ctx.shadowOffsetY = 10 * u;
  const body = ctx.createLinearGradient(0, yTop, 0, yBot);
  body.addColorStop(0, '#171b21'); body.addColorStop(1, '#0d1014');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.roundRect(x0, yTop, w, h, 10 * u); ctx.fill();
  noShadow();
  ctx.strokeStyle = 'rgba(206,218,230,0.22)'; ctx.lineWidth = Math.max(1, 1.4 * u);
  ctx.beginPath(); ctx.roundRect(x0 + 0.5, yTop + 0.5, w - 1, h - 1, 10 * u); ctx.stroke();

  /* ---- шапка ---- */
  const hy = yTop + BD.head * 0.56 * u;
  ctx.font = eraFont(BD.brand * u, '600', F);
  try { ctx.letterSpacing = `${BD.brand * 0.16 * u}px`; } catch(e){}
  ctx.fillStyle = 'rgba(240,245,250,0.95)';
  ctx.fillText('GLIDEWELL EDUCATION', x0 + pad, hy);
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(BD.tag * u, '', F);
  ctx.fillStyle = 'rgba(128,140,152,0.9)';
  ctx.fillText('Upcoming courses', x0 + pad, hy + BD.brand * 0.78 * u);
  {   /* состояние справа: точка и слово, янтарём если файл старше суток */
    const stale = BOARD.age != null && BOARD.age > 1;
    const label = stale ? Math.floor(BOARD.age) + ' d ago' : 'Live';
    ctx.font = eraFont(BD.tag * u, '600', F);
    try { ctx.letterSpacing = `${BD.tag * 0.12 * u}px`; } catch(e){}
    ctx.textAlign = 'right';
    ctx.fillStyle = stale ? 'rgba(232,176,72,0.92)' : 'rgba(118,208,150,0.92)';
    ctx.fillText(label.toUpperCase(), x1 - pad, hy);
    const tw = ctx.measureText(label.toUpperCase()).width;
    ctx.beginPath();
    ctx.arc(x1 - pad - tw - 14 * u, hy - BD.tag * 0.3 * u, 4.5 * u, 0, 7);
    ctx.fill();
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = 'rgba(206,218,230,0.16)';
  ctx.fillRect(x0 + pad, yTop + BD.head * u, w - pad * 2, Math.max(1, 1 * u));

  /* ---- строки ---- */
  const rows = BOARD.rows;
  const listTop = yTop + BD.head * u, listH = h - BD.head * u - 22 * u;
  if (!rows.length){
    ctx.font = eraFont(BD.who * u, 'italic', F);
    ctx.fillStyle = 'rgba(128,140,152,0.75)';
    ctx.fillText('—', x0 + pad, listTop + 60 * u);
    ctx.restore(); return;
  }
  /* РОВНОЕ ДВИЖЕНИЕ: накопитель в МИРОВЫХ единицах, растёт на dt и заворачивается
     по длине списка; список рисуется дважды подряд, поэтому оборота не видно. */
  BOARD.scroll = (BOARD.scroll + (state.dt || 0.016) * 34) % (rows.length * BD.row);
  const rowH = BD.row * u;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 + 2, listTop, w - 4, listH); ctx.clip();
  const today = new Date();
  /* КОЛОНКА ДАТЫ ШИРИНОЙ С САМУЮ ДЛИННУЮ ДАТУ, а не с ту, что попалась. «11–12
     DEC» шире, чем «2 OCT», и упиралась в название (Эльдар, 2026-09-23). Меряем
     все строки разом и от самой широкой отступаем; так столкнуться нельзя. */
  let dateW = 0;
  for (const e of rows){
    const a = new Date(e.from + 'T00:00'), b = new Date(e.to + 'T00:00');
    const dd = a.getDate() === b.getDate() ? String(a.getDate())
             : a.getDate() + '\u2013' + b.getDate();
    ctx.font = eraFont(BD.date * u, '600', F);
    let ww = ctx.measureText(dd).width + 12 * u;
    ctx.font = eraFont(BD.mon * u, '600', F);
    try { ctx.letterSpacing = `${BD.mon * 0.14 * u}px`; } catch(e2){}
    ww += ctx.measureText(BOARD_MON[a.getMonth()]).width;
    try { ctx.letterSpacing = '0px'; } catch(e2){}
    if (ww > dateW) dateW = ww;
  }
  const colCity = x0 + w * 0.695, colTag = x1 - pad;
  for (let i = 0; i < rows.length * 2; i++){
    const e = rows[i % rows.length];
    const yr = listTop + i * rowH - BOARD.scroll * u;     // верх строки
    if (yr < listTop - rowH || yr > listTop + listH) continue;
    const ym = yr + rowH * 0.5;                            // её середина
    /* волосок-разделитель, а не полосатая заливка: спокойнее и чище */
    ctx.fillStyle = 'rgba(206,218,230,0.075)';
    ctx.fillRect(x0 + pad, yr, w - pad * 2, Math.max(1, 0.8 * u));

    const d1 = new Date(e.from + 'T00:00'), d2 = new Date(e.to + 'T00:00');
    const day = d1.getDate() === d2.getDate() ? String(d1.getDate())
              : d1.getDate() + '–' + d2.getDate();
    ctx.font = eraFont(BD.date * u, '600', F);
    ctx.fillStyle = 'rgba(236,180,74,0.96)';
    ctx.fillText(day, x0 + pad, ym + BD.date * 0.12 * u);
    const dw = ctx.measureText(day).width;
    ctx.font = eraFont(BD.mon * u, '600', F);
    try { ctx.letterSpacing = `${BD.mon * 0.14 * u}px`; } catch(e){}
    ctx.fillStyle = 'rgba(148,160,172,0.9)';
    ctx.fillText(BOARD_MON[d1.getMonth()], x0 + pad + dw + 12 * u, ym + BD.date * 0.12 * u);
    try { ctx.letterSpacing = '0px'; } catch(e){}

    const cx2 = x0 + pad + dateW + 40 * u;
    const colW = colCity - cx2 - 40 * u;
    ctx.font = eraFont(BD.title * u, '', F);
    ctx.fillStyle = 'rgba(234,240,246,0.96)';
    let ttl = e.title;
    while (ctx.measureText(ttl).width > colW && ttl.length > 8) ttl = ttl.slice(0, -1);
    ctx.fillText(ttl === e.title ? ttl : ttl.trim() + '…', cx2, ym - BD.title * 0.22 * u);
    /* преподавателей режем по ИМЕНАМ, а не по буквам: «Dr. Jinny» посреди
       фамилии читается как опечатка, а «+6» — как факт */
    ctx.font = eraFont(BD.who * u, '', F);
    ctx.fillStyle = 'rgba(128,140,152,0.9)';
    const names = e.instructors || [];
    let who = names.join(' · '), cut = names.length;
    while (cut > 1 && ctx.measureText(who).width > colW){
      cut--; who = names.slice(0, cut).join(' · ') + '   +' + (names.length - cut);
    }
    while (ctx.measureText(who).width > colW && who.length > 6) who = who.slice(0, -1);
    ctx.fillText(who, cx2, ym + BD.title * 0.74 * u);

    ctx.font = eraFont(BD.city * u, '', F);
    ctx.fillStyle = 'rgba(206,216,226,0.92)';
    ctx.fillText(e.city, colCity, ym + BD.city * 0.12 * u);

    /* состояние — тихая пилюля, а не крик */
    const days = Math.round((d1 - today) / 86400000);
    const st = !e.open ? ['SOLD OUT', '226,96,100'] : days <= 7 ? ['CLOSING', '236,180,74'] : ['OPEN', '118,208,150'];
    ctx.font = eraFont(BD.tag * u, '600', F);
    try { ctx.letterSpacing = `${BD.tag * 0.12 * u}px`; } catch(e2){}
    const pw = ctx.measureText(st[0]).width, ph = BD.tag * 2.1 * u;
    const px0 = colTag - pw - 22 * u, py0 = ym - ph / 2;
    ctx.fillStyle = `rgba(${st[1]},0.13)`;
    ctx.beginPath(); ctx.roundRect(px0, py0, pw + 22 * u, ph, ph / 2); ctx.fill();
    ctx.fillStyle = `rgba(${st[1]},0.95)`;
    ctx.textAlign = 'right';
    ctx.fillText(st[0], colTag - 11 * u, ym + BD.tag * 0.34 * u);
    ctx.textAlign = 'left';
    try { ctx.letterSpacing = '0px'; } catch(e2){}
  }
  ctx.restore();
  /* растворения сверху и снизу, чтобы строки уходили, а не обрубались */
  const f1 = ctx.createLinearGradient(0, listTop, 0, listTop + 34 * u);
  f1.addColorStop(0, '#161a20'); f1.addColorStop(1, 'rgba(22,26,32,0)');
  ctx.fillStyle = f1; ctx.fillRect(x0 + 2, listTop, w - 4, 34 * u);
  const f2 = ctx.createLinearGradient(0, yBot - 40 * u, 0, yBot - 2);
  f2.addColorStop(0, 'rgba(13,16,20,0)'); f2.addColorStop(1, '#0d1014');
  ctx.fillStyle = f2; ctx.fillRect(x0 + 2, yBot - 40 * u, w - 4, 38 * u);
  ctx.restore();
}

    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(40, 132, 22, 276);

}

/* a full-screen video insert can live on the seam: drop a clip in and it
   fades in as you cross (slot — no clip embedded yet) */
let SEAM_VIDEO = null;
/* ---------------- THE PROJECTOR ----------------
   A real machine standing in the hall, not a rectangle pasted on the wall.
   What sells a projection is never the picture: it is that the picture is
   MADE OF LIGHT. So the frame is drawn additively over the masonry — the
   wall's own texture reads straight through the highlights, exactly as it
   does in a room — the beam hangs in the air with dust turning in it, the
   lamp breathes, the gate weaves a hair, and the throw is keystoned because
   the machine sits below the centre of its own picture. */
/* The reel belongs to 1993, not 1995: the film IS about this building. It is
   the window out of the middle of the tape — 12.6s to 23.4s of Timeline 5 —
   which is the architect's computer flythrough handing over, in a single cut
   and from the same angle, to the finished building. THE WINDOW IS CUT INTO
   THE FILE, not seeked to: the reel used to be the whole 26-second tape with
   `currentTime` pushed back to 12.6 every loop, and a server that does not
   answer byte-range requests (a plain `python3 -m http.server`, a kiosk that
   serves from disk) cannot seek at all — the tape sat on its first frame, a
   white slate, and the wall showed a blank lit rectangle. Now it loops
   natively, no seek, no dip in readyState at the join, and the file is half
   the weight. `pz` pins the picture to the recreation's own panel rather than
   to the era wall standing behind it. */
const PROJECTORS = [
  {x: (REC93_L + REC93_R) / 2, wallDX: 0, w: 1020, cy: 385, pz: 728,
   /* the stand moved to the RIGHT of the composition and the machine is
      mirrored with it, so it throws across from that side — the left of the
      slab is where the 727 puts down */
   /* mdx 340 put the stand on the bay's own pale slab, which is the room in the
      film, not the room you are standing in; 660 clears the slab's edge and
      sets it on the era's blue floor (Eldar, 2026-09-23) */
   src: 'media/reel_1993.mp4', throwZ: 240, mdx: 660, mirror: true, stand: true, ground: true,
   clip: {name: '4141 MacArthur Blvd', label: 'the building, before it was built',
          src: 'media/reel_1993.mp4'}},
];
function initProjectors(){
  for (const p of PROJECTORS){
    const v = document.createElement('video');
    v.src = p.src; v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = 'auto';
    v.addEventListener('loadeddata', () => {
      p.ready = true;
      // start inside the window, not at the head of the tape
      if (p.in != null) { try { v.currentTime = p.in; } catch(e){} }
      // the reel is pillarboxed: measure the black ears once and never throw them
      try {
        const c = document.createElement('canvas'); c.width = 96; c.height = 54;
        const g = c.getContext('2d', {willReadFrequently: true});
        g.drawImage(v, 0, 0, 96, 54);
        const d = g.getImageData(0, 0, 96, 54).data;
        const lum = x => { let m = 0; for (let y = 4; y < 50; y++){ const i = (y*96+x)*4; m = Math.max(m, (d[i]+d[i+1]+d[i+2])/3); } return m; };
        let a0 = 0, a1 = 95;
        while (a0 < 40 && lum(a0) < 14) a0++;
        while (a1 > 56 && lum(a1) < 14) a1--;
        p.crop = {x0: a0 / 96, x1: (a1 + 1) / 96};
      } catch(e){ p.crop = {x0: 0, x1: 1}; }
    });
    v.play().catch(() => {                      // a browser that wants a gesture first
      const go = () => { v.play().catch(()=>{}); window.removeEventListener('pointerdown', go); };
      window.addEventListener('pointerdown', go);
    });
    p.v = v;
  }
}
function drawProjectors(t, phase){
  for (const p of PROJECTORS){
    // a kiosk PC should not decode a reel nobody is looking at
    const near = Math.abs(p.x - cam.x) < 3600;
    if (p.v){
      const wanted = near && !state.clip;   // the spoken cut takes over from the loop
      if (wanted && p.v.paused) p.v.play().catch(()=>{});
      else if (!wanted && !p.v.paused) p.v.pause();
    }
    if (!near) continue;
    const seg = segAt(p.x);
    const wz = (p.pz != null ? p.pz : (seg.z0 || 550)) - 6;
    const kk = k(wz);
    // the frame takes its offset in WORLD units, the same units the machine
    // below uses, so the two never drift apart and the beam stays true
    const sx = px(p.x + p.wallDX, k(p.pz != null ? p.pz - 8 : exhibitZ(p.x)));
    /* The window is the whole point of this reel, so it is enforced from both
       ends: a tape that has run past it goes back, and a tape that has looped
       round to its head is caught before a single frame of the run-up shows. */
    if (p.v && p.in != null){
      if (p.out != null && p.v.currentTime > p.out) p.v.currentTime = p.in;
      else if (p.v.currentTime < p.in - 0.05) p.v.currentTime = p.in;
    }
    // the gate is sized to the reel AFTER its black ears are cut: a 4:3 film
    // gets a 4:3 rectangle, fitted inside the same box, never stretched
    const c0 = p.crop || {x0: 0, x1: 1};
    const asp = ((p.v && p.v.videoWidth) ? p.v.videoWidth * (c0.x1 - c0.x0) / p.v.videoHeight : 16/9);
    const boxW = p.w * kk * SS, boxH = boxW * 9 / 16;
    const vw = asp >= 16/9 ? boxW : boxH * asp;
    const vh = asp >= 16/9 ? boxW / asp : boxH;
    if (sx < -vw || sx > W + vw) continue;
    const sy = py(p.cy, kk);
    const live = p.ready && p.v.readyState >= 2;

    // the lamp: a slow breath with an occasional stumble in the gate
    const lamp = 0.90 + 0.07 * Math.sin(t * 7.3) + 0.04 * Math.sin(t * 2.1)
                 + (Math.sin(t * 31.7) > 0.985 ? -0.16 : 0);
    // gate weave — a projected frame never sits perfectly still
    const wx2 = Math.sin(t * 4.7) * 0.9 * kk * SS + Math.sin(t * 11.3) * 0.35 * kk * SS;
    const wy2 = Math.cos(t * 3.9) * 0.7 * kk * SS;

    // the machine, standing on the bench below the picture
    const kp = k(p.throwZ);
    const mxp = px(p.x + (p.mdx != null ? p.mdx : p.wallDX), kp);
    const myp = py(CFG.benchY - 2, kp);
    const bw = 150 * kp * SS, bh = 74 * kp * SS;
    /* THE MACHINE IS A PHOTOGRAPH. It was drawn — a putty wedge on a drawn
       post — and Eldar sent the real thing: a nineties LCD data projector on
       its own adjustable stand, shot against nothing. It goes in whole, foot on
       the floor, and the beam is made to leave ITS glass: the lens sits at
       (0.845, 0.055) of the cut-out, measured off the file. */
    const pjs = PROP_SPRITES.ph_prj93;
    let ph93 = null;
    if (pjs){
      const hW93 = 470;                                  // floor to the top of the head, in world units
      const shp = hW93 * kp * SS, swp = shp * pjs.w / pjs.h;
      const fy93 = py(1080, kp);
      const lensU = p.mirror ? 0.155 : 0.845;   // the lens crosses with the machine
      ph93 = {sp: pjs, x0: mxp - swp / 2, y0: fy93 - shp, w: swp, h: shp, foot: fy93,
              flip: !!p.mirror,
              lx: mxp - swp / 2 + swp * lensU, ly: fy93 - shp + shp * 0.055};
    }

    /* A MACHINE ON THE FLOOR IS BEHIND THE FURNITURE. The projectors used to
       be painted in one pass after the counters, which is right for the ones
       standing ON a counter and wrong for the one standing on the floor beside
       it — 1993's was walking in front of the era's own bench. The two go in
       separate passes now, and the floor-standing one goes first. */
    if (phase === 'machine' || phase === 'machineGround'){
      if ((phase === 'machineGround') !== !!p.ground) continue;
      projMachine(p, t, lamp, mxp, myp, bw, bh, kp, ph93); continue;
    }
    ctx.save();
    // 1 — the beam: apex at the lens, spreading to the frame on the wall
    // a beam from a lamp onto a rectangle is bounded by the two extreme corners
    // as seen FROM the lamp — true whether it stands under the picture or beside it
    const lx = ph93 ? ph93.lx : mxp, ly = ph93 ? ph93.ly : myp - bh * 0.45;
    const corners = [[sx - vw/2, sy - vh/2], [sx + vw/2, sy - vh/2],
                     [sx + vw/2, sy + vh/2], [sx - vw/2, sy + vh/2]];
    const ang = corners.map(c => Math.atan2(c[1] - ly, c[0] - lx));
    let iA = 0, iB = 0;
    for (let i = 1; i < 4; i++){
      if (ang[i] < ang[iA]) iA = i;
      if (ang[i] > ang[iB]) iB = i;
    }
    const beam = ctx.createLinearGradient(lx, ly, sx, sy);
    beam.addColorStop(0, `rgba(255,246,222,${(0.20 * lamp).toFixed(3)})`);
    beam.addColorStop(1, 'rgba(255,246,222,0.015)');
    ctx.fillStyle = beam;
    const nrm = Math.hypot(sx - lx, sy - ly) || 1;
    const ox2 = -(sy - ly) / nrm * 5 * kp * SS, oy2 = (sx - lx) / nrm * 5 * kp * SS;
    ctx.beginPath();
    ctx.moveTo(lx + ox2, ly + oy2);
    ctx.lineTo(lx - ox2, ly - oy2);
    ctx.lineTo(corners[iA][0], corners[iA][1]);
    ctx.lineTo(corners[iB][0], corners[iB][1]);
    ctx.closePath(); ctx.fill();
    // motes turning in the beam
    for (let i = 0; i < 14; i++){
      const u = ((i * 0.137 + t * 0.05) % 1);
      const bx = mxp + (sx - mxp) * u + Math.sin(t * 0.7 + i) * 12 * SS * u;
      const by = (myp - bh * 0.45) + (sy - (myp - bh * 0.45)) * u + Math.cos(t * 0.5 + i * 2) * 9 * SS * u;
      ctx.fillStyle = `rgba(255,248,228,${(0.06 + 0.05 * Math.sin(t * 2 + i)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, by, (0.9 + 0.8 * u) * SS, 0, 7); ctx.fill();
    }

    // 2 — the picture is assembled on its own transparent sheet and then ADDED
    //     to the wall. Feathering it in place would erase the masonry with it
    //     and read as a dark border round the frame — light never does that.
    const gx0 = sx - vw / 2 + wx2, gy0 = sy - vh / 2 + wy2;
    const key = 0.018 * vw;   // the machine sits below its picture: top edge wider
    const ow = Math.max(8, Math.ceil(vw + key * 2)), oh = Math.max(8, Math.ceil(vh));
    if (!p.off || p.off.width !== ow || p.off.height !== oh){
      p.off = document.createElement('canvas'); p.off.width = ow; p.off.height = oh;
      p.og = p.off.getContext('2d');
    }
    const g2 = p.og;
    g2.clearRect(0, 0, ow, oh);
    // a lit rectangle even where the reel is black — the lamp is always on
    g2.fillStyle = `rgba(52,47,38,${(0.60 * lamp).toFixed(3)})`;
    g2.fillRect(0, 0, ow, oh);
    if (live){
      const sw0 = p.v.videoWidth || 1280, sh0 = p.v.videoHeight || 720;
      g2.globalAlpha = 0.95 * lamp;
      g2.drawImage(p.v, sw0 * c0.x0, 0, sw0 * (c0.x1 - c0.x0), sh0, 0, 0, ow, oh);
      g2.globalAlpha = 1;
    }
    // hot centre, falling away the way a lens actually throws
    const hot = g2.createRadialGradient(ow/2, oh*0.44, oh*0.12, ow/2, oh*0.5, ow*0.72);
    hot.addColorStop(0, `rgba(255,250,235,${(0.10 * lamp).toFixed(3)})`);
    hot.addColorStop(1, 'rgba(255,250,235,0)');
    g2.fillStyle = hot; g2.fillRect(0, 0, ow, oh);
    // the edges run out into transparency ON THE SHEET, where erasing is free
    g2.save();
    g2.globalCompositeOperation = 'destination-out';
    const F = Math.max(2, 11 * kk * SS);
    for (const [ex, ey, ew, eh, vert, near] of [
      [0, 0, ow, F, 1, 1], [0, oh - F, ow, F, 1, 0],
      [0, 0, F, oh, 0, 1], [ow - F, 0, F, oh, 0, 0]]){
      const g = vert ? g2.createLinearGradient(0, ey, 0, ey + eh)
                     : g2.createLinearGradient(ex, 0, ex + ew, 0);
      g.addColorStop(0, `rgba(0,0,0,${near})`); g.addColorStop(1, `rgba(0,0,0,${1 - near})`);
      g2.fillStyle = g; g2.fillRect(ex, ey, ew, eh);
    }
    g2.restore();
    if (p.ground){
      /* A projected picture on a LIGHT wall cannot be added and still be seen;
         it needs something dark underneath. Anything drawn by hand around it
         reads as a frame — which is what you were seeing. So the ground is the
         picture's own silhouette: same canvas, same feather, no edge anywhere
         for the eye to find. */
      if (!p.gnd || p.gnd.width !== ow || p.gnd.height !== oh){
        p.gnd = document.createElement('canvas');
        p.gnd.width = ow; p.gnd.height = oh;
        const g3 = p.gnd.getContext('2d');
        g3.fillStyle = '#12171c'; g3.fillRect(0, 0, ow, oh);
        g3.globalCompositeOperation = 'destination-out';
        const F2 = Math.max(2, 11 * kk * SS);
        for (const [ex, ey, ew, eh, vert, nr] of [
          [0, 0, ow, F2, 1, 1], [0, oh - F2, ow, F2, 1, 0],
          [0, 0, F2, oh, 0, 1], [ow - F2, 0, F2, oh, 0, 0]]){
          const gg = vert ? g3.createLinearGradient(0, ey, 0, ey + eh)
                          : g3.createLinearGradient(ex, 0, ex + ew, 0);
          gg.addColorStop(0, `rgba(0,0,0,${nr})`); gg.addColorStop(1, `rgba(0,0,0,${1 - nr})`);
          g3.fillStyle = gg; g3.fillRect(ex, ey, ew, eh);
        }
      }
      // only when there is a picture to sit under. A lamp with no film in the
      // gate throws a warm empty rectangle; it does not throw darkness.
      if (live) ctx.drawImage(p.gnd, gx0 - key, gy0);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(p.off, gx0 - key, gy0);
    ctx.restore();

    // 4 — halation: the wall around the frame catches the spill
    const spill = ctx.createRadialGradient(sx, sy, vh * 0.4, sx, sy, vw * 0.95);
    spill.addColorStop(0, `rgba(255,244,214,${(0.055 * lamp).toFixed(3)})`);
    spill.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = spill; ctx.fillRect(sx - vw, sy - vh, vw * 2, vh * 2);

    ctx.restore();

    pushHit(sx - vw / 2, sy - vh / 2, vw, vh,
            {type: 'study', beat: nearestBeat(p.x).i});   // the reel opens its year's page — never a player of its own
  }
}
/* the machine stands ON the bench, so it is painted after it — while the
   picture it throws was painted before, and the bench crops it the way a real
   counter crops a projection that falls behind it */
function projMachine(p, t, lamp, mxp, myp, bw, bh, kp, ph93){
  const u = kp * SS;                       // one world unit at the machine's depth
  if (ph93){
    // the photographed machine: its own stand, its own shadow, its own lamp
    /* a steel base plate on four feet: the same soft smear, at the plate's own
       width, with the near feet showing where it really touches */
    softFootShadow(mxp, ph93.foot + ph93.h * 0.005, ph93.w * 0.38, ph93.h * 0.008, 0.72);
    softFootShadow(mxp, ph93.foot, ph93.w * 0.26, ph93.h * 0.004, 0.62);
    for (const f of [-0.30, 0.30])
      softFootShadow(mxp + ph93.w * f, ph93.foot, ph93.w * 0.032, ph93.h * 0.0025, 0.5);
    ctx.save();
    if (ph93.flip){ ctx.translate(mxp, 0); ctx.scale(-1, 1); ctx.translate(-mxp, 0); }
    ctx.drawImage(spriteMip(ph93.sp, ph93.w, ph93.h), ph93.x0, ph93.y0, ph93.w, ph93.h);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('255,240,200', ph93.lx, ph93.ly, 26 * u, 0.55 * lamp);
    ctx.restore();
    return;
  }
  contactShadow(mxp, p.stand ? py(1080, kp) : myp, bw * 1.1, 0.34);
  ctx.save();
  if (p.stand){
    // it stands on the floor beside the whole composition, not on a worktop
    const fy = py(1080, kp);
    const sg = ctx.createLinearGradient(mxp - 9 * u, 0, mxp + 9 * u, 0);
    sg.addColorStop(0, '#23211e'); sg.addColorStop(0.4, '#585349'); sg.addColorStop(1, '#1c1a17');
    ctx.fillStyle = sg;
    ctx.fillRect(mxp - 9 * u, myp, 18 * u, fy - myp);
    ctx.fillStyle = 'rgba(26,24,21,0.9)';
    ctx.beginPath(); ctx.ellipse(mxp, fy, 46 * u, 12 * u, 0, 0, 7); ctx.fill();
  }
  /* NOT A FILM PROJECTOR. This used to be a dark box with two reels turning on
     top of it, which is the wrong machine by twenty years: what it throws is an
     architect's computer flythrough, and the year is 1993. In Focus shipped the
     first data projector in 1991 and by 1993 the multimedia LCD projector was
     what a room used to put a computer on a wall. So: a putty-coloured plastic
     wedge, tall at the back and sloping down to a single lens at the front,
     with a moulded handle, louvres and one amber lamp light. The lens sits
     exactly where the beam's apex is computed, so the light leaves the glass. */
  const x0 = mxp - bw / 2, xR = mxp + bw / 2;
  const yBot = myp, yBack = myp - bh, yFront = myp - bh * 0.74;
  const ly = myp - bh * 0.45;              // the optical axis — the beam's apex
  const r = 4 * u;
  const body = () => {
    ctx.beginPath();
    ctx.moveTo(x0 + r, yBack);
    ctx.lineTo(xR - r, yFront);
    ctx.quadraticCurveTo(xR, yFront, xR, yFront + r);
    ctx.lineTo(xR, yBot - r);
    ctx.quadraticCurveTo(xR, yBot, xR - r, yBot);
    ctx.lineTo(x0 + r, yBot);
    ctx.quadraticCurveTo(x0, yBot, x0, yBot - r);
    ctx.lineTo(x0, yBack + r);
    ctx.quadraticCurveTo(x0, yBack, x0 + r, yBack);
    ctx.closePath();
  };
  const bg = ctx.createLinearGradient(0, yBack, 0, yBot);
  bg.addColorStop(0, '#dcd7c8'); bg.addColorStop(0.42, '#c3bdad'); bg.addColorStop(1, '#8e8779');
  ctx.fillStyle = bg; body(); ctx.fill();
  ctx.strokeStyle = 'rgba(60,56,48,0.45)'; ctx.lineWidth = Math.max(0.6, 1.1 * u);
  body(); ctx.stroke();
  // the seam between the two halves of the case, and the moulded handle well
  ctx.save(); body(); ctx.clip();
  ctx.strokeStyle = 'rgba(70,66,57,0.35)'; ctx.lineWidth = Math.max(0.5, 0.9 * u);
  ctx.beginPath(); ctx.moveTo(x0, yBot - bh * 0.30); ctx.lineTo(xR, yBot - bh * 0.30); ctx.stroke();
  ctx.fillStyle = 'rgba(90,85,74,0.45)';
  ctx.beginPath(); ctx.roundRect(x0 + bw * 0.10, yBack + bh * 0.07, bw * 0.30, bh * 0.10, 2.5 * u); ctx.fill();
  // louvres over the lamp housing
  ctx.fillStyle = 'rgba(76,71,62,0.40)';
  for (let i = 0; i < 5; i++)
    ctx.fillRect(x0 + bw * 0.13 + i * bw * 0.055, yBot - bh * 0.24, bw * 0.028, bh * 0.15);
  ctx.restore();
  // the lens: a barrel out of the front face, focus collar, coated glass
  const lw = bw * 0.16, lh = bh * 0.36;
  const lg = ctx.createLinearGradient(0, ly - lh / 2, 0, ly + lh / 2);
  lg.addColorStop(0, '#6d6a63'); lg.addColorStop(0.5, '#3a3833'); lg.addColorStop(1, '#22211d');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.roundRect(xR - lw * 0.30, ly - lh / 2, lw, lh, 2.5 * u); ctx.fill();
  ctx.fillStyle = 'rgba(196,190,176,0.85)';                       // the focus collar
  ctx.fillRect(xR + lw * 0.22, ly - lh / 2, lw * 0.16, lh);
  const gl = ctx.createRadialGradient(xR + lw * 0.62, ly - lh * 0.10, lh * 0.05,
                                      xR + lw * 0.62, ly, lh * 0.46);
  gl.addColorStop(0, `rgba(255,248,226,${(0.95 * lamp).toFixed(2)})`);
  gl.addColorStop(0.45, `rgba(150,170,190,${(0.55 * lamp).toFixed(2)})`);
  gl.addColorStop(1, 'rgba(18,20,24,0.95)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.ellipse(xR + lw * 0.62, ly, lh * 0.30, lh * 0.44, 0, 0, 7); ctx.fill();
  // the one light on the case, and the glow the lamp throws round its own glass
  ctx.fillStyle = `rgba(255,176,86,${(0.75 + 0.2 * Math.sin(t * 2.4)).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(x0 + bw * 0.055, yBot - bh * 0.13, 1.9 * u, 0, 7); ctx.fill();   // clear of the louvres
  drawGlow('255,240,200', xR + lw * 0.62, ly, 30 * u, 0.5 * lamp);
  ctx.restore();
}

/* ---------------- WHOOSHES ----------------
   Twenty cinematic whooshes, cut out of one compilation, one per moment worth
   marking: every recreation and every landmark year. A cue fires ONCE on
   arrival and re-arms only after you have left again, so scrolling back and
   forth cannot machine-gun it — and a global cooldown thins a fast run down
   the hall instead of firing all twenty into each other. A speaking voice
   always wins: nothing is thrown over a person talking.

   THIS TABLE IS MEANT TO BE ARGUED WITH. Every line is a year, a title and a
   file: to move a whoosh, swap the file; to drop one, delete the line. Open
   the hall with ?ws=audition to hear all twenty in order, named in the
   console, without walking to them. */
/* WHERE EACH WHOOSH PEAKS, in seconds from its head — measured from the
   files' own loudness envelopes. A cue is not started on arrival; it is started
   so that its PEAK lands on arrival: the hall reads the camera's speed, works
   out how many seconds away the moment is, and lets the sound go that early.
   Arrive faster than expected and the file is entered part-way, so the peak
   still falls where it should. */
const WHOOSH_PEAK = {ws01: 0.35, ws02: 0.7, ws03: 1.22, ws04: 0.43, ws05: 0.3, ws06: 0.3, ws07: 1.2, ws08: 0.08, ws09: 0.98, ws10: 0.14, ws11: 0.53, ws12: 0.32, ws13: 1.05, ws14: 0.37, ws15: 0.35, ws16: 0.41, ws17: 0.41, ws18: 0.59, ws19: 0.41, ws20: 0.81};
const WHOOSH = {
  dir: 'audio/whoosh/', gain: 0.55, radius: 340, rearm: 900, cool: 0.85,
  last: -9, pool: {},
  cues: [
    /* SIX SOUNDS, CHOSEN BY EAR. Eldar walked the hall with all twenty and kept
       these; the rest are gone, and the minor years fall silent. What is left is
       spread over the main moments — the founding, the recreations, the apexes —
       and every one of them is timed to peak on arrival. */
    {y:'1907',  t:'LOST-WAX CASTING',   f:'ws18', g:0.80},

function initWhoosh(){
  const RECS = {DR: [REC2_L, REC2_R], '1979': [REC_L, REC_R], '1989': [REC3_L, REC3_R],
                '1993': [REC93_L, REC93_R], '2018': [REC18_L, REC18_R],
                '2022': [REC4_L, REC4_R], '2023': [REC23_L, REC23_R]};
  for (const c of WHOOSH.cues){
    if (c.rec){                                   // a recreation with no year of its own
      const r = RECS[c.rec];
      if (!r){ console.warn('whoosh: no recreation', c.rec); continue; }
      c.x = (r[0] + r[1]) / 2; c.armed = true;
    } else {
      const b = BEATS.find(q => q.y === c.y && (q.t || '') === (c.t || ''));
      if (!b){ console.warn('whoosh: no beat for', c.y, c.t); continue; }
      c.x = b.x; c.armed = true;
    }
    if (!WHOOSH.pool[c.f]){
      const a = new Audio(WHOOSH.dir + c.f + '.m4a');
      a.preload = 'auto'; a.volume = 0;
      WHOOSH.pool[c.f] = a;
    }
  }
  if (/[?&]ws=audition/.test(location.search)) setTimeout(auditionWhoosh, 600);
}
/* every cut in order, named, so a set of twenty can be judged in half a minute
   instead of by walking the hall twenty times */
function auditionWhoosh(){
  const names = Object.keys(WHOOSH.pool).sort();
  let i = 0;
  const step = () => {
    if (i >= names.length){ console.log('whoosh audition: done'); return; }
    const f = names[i++], a = WHOOSH.pool[f];
    const who = WHOOSH.cues.filter(c => c.f === f)
                  .map(c => c.rec ? (c.rec + ' recreation') : (c.y + (c.t ? ' ' + c.t : ''))).join(' / ');
    console.log('whoosh', f, '→', who);
    try { a.currentTime = 0; } catch(e){}
    a.volume = 0.8; a.play().catch(err => console.warn('needs a click first', err.name));
    setTimeout(step, Math.max(1400, (a.duration || 1.5) * 1000 + 350));
  };

}
function updateWhoosh(){
  const t = state.time;
  // a voice always wins, and nothing fires over an open page or the title hold
  const voice = (state.clip && state.clip.v && !state.clip.v.paused) ||
                (state.person && state.person.v && !state.person.v.paused) ||
                (state.study && state.study.railV && !state.study.railV.paused);
  const quiet = SOUND.off || voice || state.introHold || state.study || state.person ||
                state.people || state.inspect || state.docOpen;
  for (const c of WHOOSH.cues){
    if (c.x == null) continue;
    const dS = c.x - cam.x, d = Math.abs(dS);
    if (!c.armed){ if (d > WHOOSH.rearm) c.armed = true; continue; }
    const peak = WHOOSH_PEAK[c.f] || 0;
    /* SECONDS UNTIL THE CAMERA IS ON THE SPOT. A visitor's wheel is a shove
       that friction brakes exponentially, so the camera will cover exactly v/f
       more units and no more: if that is short of the spot it is not arriving,
       and nothing is thrown early. If it is, the arrival time follows from the
       same law. The attract tour holds its speed instead, so there it is plain
       distance over speed. */
    const toward = dS * cam.vel > 0, v = Math.abs(cam.vel);
    let tta = Infinity;
    if (toward){
      if (state.mode === 'attract') tta = 1.15 * d / Math.max(40, v);   // the tour brakes into its stop: measured 15% longer
      else if (v / CFG.friction > d + 1) tta = -Math.log(1 - d * CFG.friction / v) / CFG.friction;
    }
    const early = toward && d < 1400 && tta <= peak + 0.04;   // let the peak land on the moment
    if (!early && d > WHOOSH.radius) continue;
    c.armed = false;                                  // spent either way
    if (quiet || t - WHOOSH.last < WHOOSH.cool) continue;
    const a = WHOOSH.pool[c.f]; if (!a) continue;
    WHOOSH.last = t;
    // arrived sooner than the sound needs — or simply already here? enter the
    // file part-way in, so the peak is now, with a breath of lead-in
    const lead = Math.max(0.12, Math.min(peak, isFinite(tta) ? tta : 0));
    try { a.currentTime = Math.max(0, peak - lead); } catch(e){}
    a.volume = Math.max(0, Math.min(1, WHOOSH.gain * (c.g != null ? c.g : 1)));
    a.play().catch(() => {});
  }
}

/* ---------------- MUSIC ----------------

/* a small mark in the corner, kept quiet: the room should not look like a

function musicMarkBox(){ const s = 22 * SS; return {x: 26 * SS, y: 26 * SS, w: s, h: s}; }

    ctx.strokeStyle = `rgba(${seg.ink},${a.toFixed(3)})`;
    ctx.fillStyle = `rgba(${seg.ink},${a.toFixed(3)})`;

function initMusic(){

function updateMusic(dt){
  const a = MUSIC.el; if (!a) return;
  // a speaking voice always wins; the attract loop plays a little lower still
  let want = (MUSIC.off || SOUND.off) ? 0 : MUSIC.vol;
  const voice = state.person && state.person.v;
  const rail = state.study && state.study.railV;
  const speaking = state.clip || (voice && !voice.paused && !voice.muted) ||
        (rail && !rail.paused && !rail.muted);
  if (speaking) want *= MUSIC.duck;
  if (state.mode === 'attract') want *= 0.75;
  want *= 1 - (state.attract.fade || 0);
  MUSIC.cur += (want - MUSIC.cur) * Math.min(1, dt * 2.2);
  a.volume = Math.max(0, Math.min(1, MUSIC.cur));

function initSeamVideo(){

/* THE CENTURY RULE — a quiet hairline at the foot of the frame answering one
   question: how far along the hundred years are we. Deliberately not a
   scrollbar: no track, no thumb, nothing to grab. It is drawn furniture that
   knows the hall's real structure — each era is its own division in its own
   ink, the breaks are the recreations you actually walk through, every beat
   leaves a tick, and a lit marker rides the rule with the year beside it. It
   bows out whenever the hall has something better to say: the welcome, an open
   reading page, a playing clip, the closing packshot. */
/* the rule wears the era it is standing in: brass under tungsten, pale steel
   through the mail-order years, grey machine-work as the lab goes digital, and
   ice with a lit edge in the white era. Materials, not decoration — the same
   progression the room itself makes. */
const RULE_STYLE = [
  {thumb: '236,212,168', edge: '255,232,190', glow: '255,186,96',  form: 'clamp', tick: 'line'},
  {thumb: '222,220,206', edge: '244,242,232', glow: '255,214,150', form: 'plate', tick: 'line'},
  {thumb: '226,229,228', edge: '246,249,248', glow: '200,228,246', form: 'frame', tick: 'line'},
  {thumb: '242,248,252', edge: '255,255,255', glow: '150,215,255', form: 'glass', tick: 'dot'},
];
function ruleStyle(){ return RULE_STYLE[Math.max(0, Math.min(3, segIdx(cam.x)))]; }
/* how far the rule has turned white at a point along it (0..1 of its length):
   untouched through the first half of the hall, white by the end */
function ruleWhite(u){
  const t = Math.max(0, Math.min(1, (u - 0.45) / 0.55));
  return t * t * (3 - 2 * t);
}

/* Each era holds the line with its own hardware, not merely its own colour:
   a brass clamp filed by hand, a stamped plate on rivets, a selection frame
   borrowed from a screen, and finally a frameless slab of lit glass. */
function drawRuleThumb(mx, y, tw, S, A, warm){
  const h = 18 * SS, top = y - h/2, bot = y + h/2;
  const body = `rgba(${S.thumb},${((0.13 + 0.10 * warm) * A).toFixed(3)})`;
  const edge = `rgba(${S.edge},${((0.55 + 0.35 * warm) * A).toFixed(3)})`;
  const bright = `rgba(${S.edge},${(0.92 * A).toFixed(3)})`;
  ctx.save();
  ctx.lineWidth = 1.6 * SS;
  if (S.form === 'clamp'){
    // filed by hand: a pill with a screw through each jaw
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.roundRect(mx - tw/2, top, tw, h, h/2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.arc(mx + s * (tw/2 - h*0.42), y, 2.2 * SS, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.35 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + h*0.5, top + 3*SS); ctx.lineTo(mx + tw/2 - h*0.5, top + 3*SS); ctx.stroke();
  } else if (S.form === 'plate'){
    // stamped and riveted: a STRAIGHT plate — square ends, two square heads
    ctx.fillStyle = body; ctx.strokeStyle = edge;
    ctx.beginPath(); ctx.rect(mx - tw/2, top, tw, h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = bright;
    for (const s of [-1, 1]) ctx.fillRect(mx + s * (tw/2 - 11*SS) - 1.6*SS, y - 1.6*SS, 3.2*SS, 3.2*SS);
  } else if (S.form === 'frame'){
    // lifted off a screen: corner brackets and a centre notch, nothing else
    ctx.fillStyle = `rgba(${S.thumb},${(0.07 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = edge;
    const L = Math.min(12 * SS, tw * 0.28);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]){
      const cx0 = mx + sx * tw/2, cy0 = y + sy * h/2;
      ctx.beginPath();
      ctx.moveTo(cx0 - sx * L, cy0); ctx.lineTo(cx0, cy0); ctx.lineTo(cx0, cy0 - sy * (h*0.42));
      ctx.stroke();
    }
    ctx.strokeStyle = `rgba(${S.edge},${(0.5 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx, top + 2*SS); ctx.lineTo(mx, top + 6*SS); ctx.stroke();
  } else {
    // frameless: two thin jaws, a hairline between them, and a lit sill
    ctx.fillStyle = `rgba(${S.thumb},${(0.06 * A).toFixed(3)})`;
    ctx.fillRect(mx - tw/2, top, tw, h);
    ctx.strokeStyle = `rgba(${S.edge},${(0.30 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(mx - tw/2, y); ctx.lineTo(mx + tw/2, y); ctx.stroke();
    ctx.strokeStyle = `rgba(${S.glow},${(0.60 * A).toFixed(3)})`;
    ctx.lineWidth = 2.2 * SS;
    ctx.beginPath(); ctx.moveTo(mx - tw/2 + 2*SS, bot); ctx.lineTo(mx + tw/2 - 2*SS, bot); ctx.stroke();
  }
  // the jaws: the edges of the frame you are looking through, in every era
  ctx.fillStyle = bright;
  for (const s of [-1, 1]){
    const w2 = S.form === 'glass' ? 2.2 * SS : 3 * SS;
    ctx.beginPath();
    ctx.roundRect(mx + s * (tw/2) - w2/2, top, w2, h, S.form === 'clamp' ? w2/2 : 0.5 * SS);
    ctx.fill();
  }
  ctx.restore();
}

function ruleGeom(){
  const x0 = W * 0.13, x1 = W * 0.87;
  const W0 = INTRO_X, W1 = FIN_X;
  const seg = segAt(cam.x);
  // the thumb is as wide as the screen actually shows: the world span visible
  // at the plane the years live on. That is the honest answer to "what part of
  // the line am I looking at" — a point could never say it.
  const half = (W / 2) / (k(seg.tz || seg.z0 || 550) * SS);
  return {
    x0, x1, y: H - 40 * SS, W0, W1, half,
    at:  wx => x0 + (x1 - x0) * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0))),
    toWorld: sx => W0 + (W1 - W0) * Math.max(0, Math.min(1, (sx - x0) / (x1 - x0))),
  };
}
function ruleHit(pt){
  if (!pt || state.ruleA < 0.45) return false;
  const g = ruleGeom();
  return pt.y > g.y - 26 * SS && pt.y < g.y + 26 * SS &&
         pt.x > g.x0 - 40 * SS && pt.x < g.x1 + 40 * SS;
}
function ruleSeek(pt, instant, grabOff){
  const g = ruleGeom();
  const to = g.toWorld(pt.x) + (grabOff || 0);
  state.introHold = false;
  if (instant){ cam.x = to; cam.vel = 0; state.glide = null; }
  else state.glide = to;               // a click glides; the hall never teleports
  state.focusBeat = -1; cam.zTarget = 0;
  state.mode = 'live'; state.idle = 0;
}

const DBG = /[?&]dbg/.test(location.search);

      const sx = px(wx, kf);
      if (sx < -50 || sx > W + 50) continue;
      ctx.strokeStyle = 'rgba(120,180,255,0.95)'; ctx.lineWidth = 2*SS;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      ctx.fillStyle = 'rgba(120,180,255,0.95)'; ctx.fillText(`${lbl} ${wx|0}`, sx + 5*SS, 60*SS);
    }
  }
  const wsx = px(wallSwitchX(), k(wallZAt(cam.x) - 8));
  ctx.strokeStyle = 'rgba(255,220,90,0.9)'; ctx.lineWidth = 2*SS;
  ctx.beginPath(); ctx.moveTo(wsx, 0); ctx.lineTo(wsx, H); ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,90,0.95)';
  ctx.fillText(`WALL SWITCH ${wallSwitchX()|0}`, wsx + 5*SS, 90*SS);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(`cam ${cam.x|0}  bench top ${py(CFG.benchY, kf)|0}  floor ${py(1080, kf)|0}`, 12*SS, H - 100*SS);
  ctx.restore();
}

/* TALL UNITS — a drawer bank standing against the wall, full height. It earns
   its place twice: it gives the craft era the storage a real lab had, and it
   stands exactly where the wall changes material, so the change happens behind
   furniture instead of down an open joint. */
const TALL_UNITS = [
  /* `wallAt` is where the dark boards give way to the plaster. It used to be
     derived from this unit's own edge, which meant the seam followed the
     cabinet everywhere it went; it is stated here so the cabinet can be placed
     against it instead of dragging it along. The cabinet sits a little past the
     seam, so rather more than half of it stands in the light era. */
  {x: bayStart(0) + CUTS[0].w / 2 + 295, w: 440, hw: 960, wallAt: bayStart(0) + CUTS[0].w / 2 + 220,
   cols: 2, rows: 5, top: 150},
];
function drawTallUnits(){
  for (const u of TALL_UNITS){
    const seg = segAt(u.x);
    const kk = k((seg.z0 || 550) - 40);         // furniture stands just off the wall
    const sx = px(u.x, kk), w = u.w * kk * SS;
    if (sx < -w || sx > W + w) continue;
    /* THE CABINET IS A PHOTOGRAPH. It used to be a drawn drawer bank ending at
       the counter's height, which is why it read as hanging: it had no feet and
       nothing under it. This one is a real instrument cabinet, cut out, and it
       stands on the FLOOR on its own legs — so the eye can see what holds it up. */
    if (PHOTO_TEX.ph_cabinet){
      const im = PHOTO_TEX.ph_cabinet;
      const hW = u.hw || 640;                    // its height in world units
      const wW = hW * im.width / im.height;
      const sw2 = wW * kk * SS, sh2 = hW * kk * SS;
      /* 44. Fifty put it five too low; the fifteen was applied in the same breath as the wall
         becoming a plane, and that moved the wall's foot 28 px DOWN — so against
         the room the cabinet came out fifteen higher than it started, which is
         what you saw. Measured off the frames: it used to stand 37 px in front
         of the wall's base and now stands 22, so it needs 15 for the request and
         28 to undo what the floor did underneath it. */
      const foot = py(1080, kk) + 44 * SS;
      /* THE SHADOW OF A CABINET IS NOT A POOL. A round pool belongs under a
         round thing; this is a tall rectangular case on two feet, standing
         against a wall under a lamp that hangs above and a little in front of
         it. So what it actually casts is: a short, soft-ended RECTANGLE thrown
         forward across the boards, widening very slightly as it comes toward
         you and dying within a foot or so; a hard, dark contact line where the
         case meets the floor; the dark void under the carcass, which shows
         between the legs and is the darkest thing in the picture; and two
         small pools where the feet actually touch. */
      /* the case is in the air on four little feet, so the floor gets a wide
         soft smear under the whole piece and a tighter, darker one under the
         carcass, where no light reaches at all */
      softFootShadow(sx, foot + sh2 * 0.014, sw2 * 0.44, sh2 * 0.012, 0.55);
      softFootShadow(sx, foot + sh2 * 0.004, sw2 * 0.33, sh2 * 0.007, 0.60);
      /* the void under the case: painted BEFORE the photograph, so it shows
         only through the gap between the legs, which is where it belongs */
      {
        const vh = Math.max(2, sh2 * 0.030);
        const g = ctx.createLinearGradient(0, foot - vh, 0, foot);
        g.addColorStop(0, 'rgba(0,0,0,0.62)'); g.addColorStop(1, 'rgba(0,0,0,0.34)');
        ctx.fillStyle = g;
        ctx.fillRect(sx - sw2 * 0.46, foot - vh, sw2 * 0.92, vh);
      }
      for (const f of [-0.47, 0.47])
        softFootShadow(sx + sw2 * f, foot, sw2 * 0.028, sh2 * 0.005, 0.60);
      ctx.drawImage(im, sx - sw2 / 2, foot - sh2, sw2, sh2);
      continue;
    }
    const yTop = py(u.top, kk), yBot = py(CFG.benchY + 90, kk);
    const h = yBot - yTop;
    const x0 = sx - w / 2;
    ctx.save();
    // the carcass, in the era's own cabinet wood
    const tex = TEX[seg.front];
    ctx.beginPath(); ctx.rect(x0, yTop, w, h); ctx.clip();
    if (tex) for (let yy = yTop; yy < yBot; yy += w * 0.62)
      ctx.drawImage(tex, x0, yy, w, w * 0.62 + 1);
    else { ctx.fillStyle = '#2a1c10'; ctx.fillRect(x0, yTop, w, h); }
    // drawers: a grid of shallow fronts, each with a shadow under its lip
    const cw = w / u.cols, ch = h / u.rows;
    for (let r = 0; r < u.rows; r++)
      for (let c = 0; c < u.cols; c++){
        const dx0 = x0 + c * cw + 3 * kk * SS, dy0 = yTop + r * ch + 3 * kk * SS;
        const dw = cw - 6 * kk * SS, dh = ch - 6 * kk * SS;
        const g = ctx.createLinearGradient(0, dy0, 0, dy0 + dh);
        g.addColorStop(0, 'rgba(255,238,205,0.06)');
        g.addColorStop(0.10, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.30)');
        ctx.fillStyle = g; ctx.fillRect(dx0, dy0, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = Math.max(1, 1.4 * kk * SS);
        ctx.strokeRect(dx0, dy0, dw, dh);
        // the pull
        ctx.fillStyle = 'rgba(24,18,12,0.85)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1.5, 3.4 * kk * SS));
        ctx.fillStyle = 'rgba(255,236,200,0.16)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1, 1.2 * kk * SS));
      }
    ctx.restore();
    // cornice, and the shadow the unit throws onto the wall beside it
    ctx.fillStyle = 'rgba(38,26,16,0.95)';
    ctx.fillRect(x0 - 5 * kk * SS, yTop - 9 * kk * SS, w + 10 * kk * SS, 9 * kk * SS);
    for (const s of [-1, 1]){
      const gx = sx + s * (w / 2);
      const sh = ctx.createLinearGradient(gx, 0, gx + s * 46 * kk * SS, 0);
      sh.addColorStop(0, 'rgba(0,0,0,0.40)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh;
      ctx.fillRect(Math.min(gx, gx + s * 46 * kk * SS), yTop, 46 * kk * SS, h);
    }
  }
}

function drawProgress(t){
  const busy = state.study || state.person || state.people || state.inspect || state.clip || state.introHold;
  const hidden = Math.max(state.introFade || 0, state.finFade || 0, state.attract.fade || 0);
  const want = busy ? 0 : (1 - hidden);
  state.ruleA += (want - state.ruleA) * Math.min(1, (state.dt || 0.016) * 6);
  const A = state.ruleA;
  if (A < 0.02) return;

  const x0 = W * 0.13, x1 = W * 0.87, span = x1 - x0;
  const y = H - 40 * SS;
  const W0 = INTRO_X, W1 = FIN_X;
  const at = wx => x0 + span * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0)));
  const RECS = [[REC_L, REC_R], [REC3_L, REC3_R], [REC93_L, REC93_R],
                [REC2_L, REC2_R], [REC17_L, REC17_R], [REC18_L, REC18_R], [REC4_L, REC4_R],
                [REC23_L, REC23_R]];
  // 1970 is a recreation too — the founding bench stands in its own cut bay, so
  // it earns the same pip as the other portals. The gap is taken at the width
  // the others use, not the bay's full 2320, so the rule keeps its rhythm.
  if (CUTS[1].on){
    const fc = bayStart(1) + CUTS[1].w / 2;
    RECS.push([fc - 540, fc + 540]);
  }

  ctx.save();
  ctx.lineCap = 'butt';
  // each era draws its own stretch in its own ink; the recreations are the gaps
  for (const seg of SEGMENTS){
    const a0 = Math.max(seg.x0, W0), a1 = Math.min(seg.x1, W1);
    if (a1 <= a0) continue;
    let cuts = [[a0, a1]];
    for (const [rl, rr] of RECS){
      const next = [];
      for (const [c0, c1] of cuts){
        if (rr <= c0 || rl >= c1) { next.push([c0, c1]); continue; }
        if (rl > c0) next.push([c0, rl]);
        if (rr < c1) next.push([rr, c1]);
      }
      cuts = next;
    }
    /* THE LINE ENDS WHITE. Eldar: the rule should arrive at the far end as a
       white line with round points on it. Each era still starts its stretch in
       its own ink; from the middle of the hall on, the ink drains toward white
       and the line brightens, so it is unmistakably white under the last era. */
    ctx.lineWidth = 2 * SS;
    const inkRGB = seg.ink.split(',').map(Number);
    for (const [c0, c1] of cuts){
      const sx0 = at(c0), sx1 = at(c1);
      const gr = ctx.createLinearGradient(sx0, 0, Math.max(sx0 + 1, sx1), 0);
      for (const [wx, stop] of [[c0, 0], [(c0 + c1) / 2, 0.5], [c1, 1]]){
        const f = ruleWhite((wx - W0) / (W1 - W0));
        const c = inkRGB.map(v => Math.round(v + (255 - v) * f));
        gr.addColorStop(stop, `rgba(${c.join(',')},${((0.30 + 0.30 * f) * A).toFixed(3)})`);
      }
      ctx.strokeStyle = gr;
      ctx.beginPath(); ctx.moveTo(sx0, y); ctx.lineTo(sx1, y); ctx.stroke();
    }
  }
  /* THE PORTALS: a pip where the hall changes era. Eldar asked for the pips to
     turn, one by one, from the cut diamond of the first portal into the plain
     round point of the last — the hardware of the line ages the way the hall
     does. Each pip is a polar blend between a rhombus and a circle, its place
     in the row deciding how far along it is; the last one IS a circle, and
     the pips whiten and brighten with the line under them. */
  const pips = RECS.map(([rl, rr]) => (rl + rr) / 2).sort((a, b) => a - b);
  pips.forEach((wx, i) => {
    const cx = at(wx), u = pips.length > 1 ? i / (pips.length - 1) : 1;
    const rx = (3.4 + (4.3 - 3.4) * u) * SS, ry = (5 + (4.3 - 5) * u) * SS;
    const f = ruleWhite((wx - W0) / (W1 - W0));
    const c = [235, 225, 205].map(v => Math.round(v + (255 - v) * f));
    ctx.fillStyle = `rgba(${c.join(',')},${((0.34 + 0.40 * u) * A).toFixed(3)})`;
    ctx.beginPath();
    for (let j = 0; j <= 40; j++){
      const th = j / 40 * Math.PI * 2, cs = Math.cos(th), sn = Math.sin(th);
      const r = (1 / (Math.abs(cs) + Math.abs(sn))) * (1 - u) + u;   // rhombus → circle
      const xj = cx + rx * r * cs, yj = y + ry * r * sn;
      if (j) ctx.lineTo(xj, yj); else ctx.moveTo(xj, yj);
    }
    ctx.closePath(); ctx.fill();
  });
  // a tick per beat; the landmark years stand a little taller, and the white
  // era marks its years with points rather than strokes
  for (const b of BEATS){
    if (b.under) continue;
    const bx = at(b.x), tall = (b.tier === 1 || b.fly) ? 5 : 3;
    const st = RULE_STYLE[Math.max(0, Math.min(3, segIdx(b.x)))];
    const al = (b.minor ? 0.22 : 0.40) * A;
    if (st.tick === 'dot'){
      ctx.fillStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, y, (b.minor ? 1.3 : 1.9) * SS, 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.lineWidth = 1.4 * SS;
      ctx.beginPath(); ctx.moveTo(bx, y - tall * SS); ctx.lineTo(bx, y + tall * SS); ctx.stroke();
    }
  }
  // the thumb: not a point but the stretch of line the screen is showing
  const segNow = segAt(cam.x);
  const g = ruleGeom();
  const tx0 = g.at(cam.x - g.half), tx1 = g.at(cam.x + g.half);
  const mx = (tx0 + tx1) / 2, tw = Math.max(14 * SS, tx1 - tx0);
  const warm = ruleHit(Input.hover) || state.ruleDrag ? 1 : 0;
  const S = ruleStyle();
  drawGlow(S.glow, mx, y, tw + 90 * SS, (0.20 + 0.14 * warm) * A);
  drawRuleThumb(mx, y, tw, S, A, warm);
  const nb = nearestBeat(cam.x);
  if (nb.i >= 0 && BEATS[nb.i].y){
    ctx.font = eraFont(17 * SS, '', segNow.font);
    ctx.textAlign = 'center';
    try { ctx.letterSpacing = `${3 * SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(${segNow.ink},${(0.62 * A).toFixed(3)})`;
    ctx.fillText(BEATS[nb.i].y, mx, y - 17 * SS);   // in the era's own face
    try { ctx.letterSpacing = '0px'; } catch(e){}
  }
  ctx.restore();
}

/* Bloom. The single largest difference between a drawing and a photograph is
   that in a photograph light spills: a lamp, a neon ring, a lit rim of glass
   bleeds into what surrounds it, because the lens cannot keep it inside its
   own edge. Everything above 0.85 is lifted off the finished frame at a
   quarter resolution, blurred, and added back — cheap enough for the N100 at
   480x270, and it is what makes the hall stop looking vector. `?nobloom` off. */
const BLOOM_ON = !/[?&]nobloom/.test(location.search);
let BLOOM = null, BLOOM_S = null;
let BLOOM_TICK = 0, BLOOM_WARM = false;
/* THE SPILL IS TAKEN OFF THE FRAME BEFORE THIS ONE.

   Reading the canvas you are in the middle of drawing into is not a copy, it is
   a barrier: the driver has to finish everything already queued for this frame
   before it can hand the pixels back. That is why the same copy measures a
   third of a millisecond in a tight loop and five to fifteen in the hall — the
   time is not the copy, it is the wait. Profiled across the whole walk, EVERY
   frame over 22ms had this at the top of it, eighty-four of them.

   So it is taken at the very top of the frame instead, before anything has been
   drawn over it. At that moment the canvas still holds the last frame, which
   the GPU finished and put on the glass long ago, so there is nothing to wait
   for. The glow is one frame stale: it is a soft wash at eleven per cent
   behind everything else, and a frame of it has never been seen by anybody.

   brightness 0.47 + contrast 8 puts the knee at ~0.93, so only what is already
   near white spills and a lit wall stays a wall. The knee goes on the
   quarter-size copy — a canvas2d `filter` drops that draw onto the software
   rasterizer, so it is worth a sixteenth of the pixels. The BLUR is not a
   filter either: bilinear minification IS a blur, and it rides the GPU. */
function bloomCapture(){
  if (!BLOOM_ON || !W || !H) return;
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  if (!BLOOM || BLOOM.width !== bw || BLOOM.height !== bh){
    BLOOM = document.createElement('canvas');
    BLOOM.width = bw; BLOOM.height = bh;
    BLOOM_WARM = false;
  }
  const sw2 = Math.max(2, bw >> 2), sh2 = Math.max(2, bh >> 2);
  if (!BLOOM_S || BLOOM_S.width !== sw2 || BLOOM_S.height !== sh2){
    BLOOM_S = document.createElement('canvas');
    BLOOM_S.width = sw2; BLOOM_S.height = sh2;
    BLOOM_WARM = false;
  }
  /* and it gives ground when the frame is tight: rebuilt every other frame at
     speed, every fourth once the rate sags, with the one already there
     carrying the frames between */
  BLOOM_TICK++;
  const every = (typeof fps !== 'undefined' && fps < 50) ? 4 : 2;
  if ((BLOOM_TICK % every) !== 0 && BLOOM_WARM) return;
  const g = BLOOM.getContext('2d');
  g.clearRect(0, 0, bw, bh);
  g.drawImage(ctx.canvas, 0, 0, bw, bh);        // last frame, already on the glass
  const g2 = BLOOM_S.getContext('2d');
  g2.clearRect(0, 0, sw2, sh2);
  g2.imageSmoothingEnabled = true;
  g2.filter = 'brightness(0.47) contrast(8)';
  g2.drawImage(BLOOM, 0, 0, sw2, sh2);
  g2.filter = 'none';
  BLOOM_WARM = true;
}
function drawBloom(){
  if (!BLOOM_ON || !BLOOM_WARM || !BLOOM_S) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.11;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(BLOOM_S, 0, 0, W, H);
  ctx.restore();
}

function drawSeamVideo(){
  const S = state.splice;
  if (!S) return;
  if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
    // the generated clip carries the whole transition
    const a = Math.min(1, S.t * 4);
    ctx.globalAlpha = a;
    const vw = SEAM_VIDEO.videoWidth, vh = SEAM_VIDEO.videoHeight;
    const sc = Math.max(W/vw, H/vh);
    ctx.drawImage(SEAM_VIDEO, W/2 - vw*sc/2, H/2 - vh*sc/2, vw*sc, vh*sc);
    ctx.globalAlpha = 1;
  } else {
    // placeholder: a veil of light carries us across
    const e = Math.max(0, Math.min(1, Math.min(S.t * 3.4, (SPLICE.dur - S.t) * 3.4)));
    ctx.fillStyle = `rgba(240,246,252,${(0.97 * e * e).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* 1979 DOES NOT GO DARK, IT COMES UP. Every other apex in the hall dims the
   room and throws a spotlight; this bay is a model shop under gallery light,
   and Eldar's note is plain — arriving here should LIGHT the place, not shade
   it. So the veil is off for this one (see the hero pass) and the two fixtures
   above it wash the whole bay warm as you come to the middle. */
function drawMapHero(t, h){
  if (h < 0.02) return;
  const mid = (REC_L + REC_R) / 2;
  const kk = k(610);
  const w = 440 * kk * SS, hh = w * 0.633;
  const cx = px(mid, kk), cyS = py(450, kk);
  /* the wash: the bay lifts, its own panel and the models with it */
  {
    const kc = k(604), x0b = px(REC_L, kc), x1b = px(REC_R, kc);
    const yb = py(CFG.benchY + 260, k(CFG.benchDepth));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const wash = ctx.createLinearGradient(0, 0, 0, yb);
    wash.addColorStop(0, `rgba(255,246,224,${(0.10 * h).toFixed(3)})`);
    wash.addColorStop(0.55, `rgba(255,246,224,${(0.055 * h).toFixed(3)})`);
    wash.addColorStop(1, 'rgba(255,246,224,0)');
    ctx.fillStyle = wash;
    ctx.fillRect(Math.min(x0b, x1b), 0, Math.abs(x1b - x0b), yb);
    ctx.restore();
  }
  // twin beams crossing over the models
  const yEnd = cyS + hh * 1.4;
  for (const s of [-1, 1]){
    const fx = px(mid + s * 470, kk);
    const xEnd = fx + ((cx - fx) * (yEnd / Math.max(1, cyS))) * Math.min(1, h * 1.7);
    // the same soft-shouldered shaft the rest of the hall uses — these two
    // were the last hard-edged quads standing
    const tMap = Math.max(0.05, Math.min(0.9, cyS / yEnd));
    /* the beam opens wide enough that AT the map it is as broad as the map:
       target half-width at the picture's level, back-solved to the foot */
    const halfB = (26*SS + (w/2 - 26*SS) / tMap);
    softBeam(fx, xEnd, 0, yEnd, 26*SS, halfB, '255,246,220', 0.065 * h,
             [[0, 0.2], [tMap, 1], [tMap + (1 - tMap) * 0.5, 0.4], [1, 0]]);
    ctx.fillStyle = 'rgba(20,20,22,0.9)';
    ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
    ctx.fillStyle = `rgba(255,246,220,${(0.75*h).toFixed(2)})`;
    ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
  }
}

/* 2023 · THE CROSSOVER. Every other apex in this hall is an invention. This
   one is an arithmetic fact: in March 2023 more digital impressions arrived in
   a month than physical ones, and nothing marked the day. So it is staged as
   the only thing it honestly is — two lines crossing, and a balance going
   level. Both reach dead centre at the same instant, and that instant is the
   moment the recreation is centred on your screen. Past it the beam does not
   swing back: a century does not end twice. */
function crossPhase(mid){
  const d = cam.x - mid;
  if (d <= 0){
    const u = Math.max(0, Math.min(1, 1 + d / 700));
    return 0.5 * (u * u * (3 - 2 * u));
  }
  const u = Math.max(0, Math.min(1, d / 450));
  return 0.5 + 0.5 * (u * u * (3 - 2 * u));
}
// a logistic through (0.5, 0.5): whatever the real curve was, it crossed in
// the middle, and that is the only property this drawing may assert
function digShare(u){
  const a = 2.4, p1 = Math.pow(Math.max(1e-4, u), a), p2 = Math.pow(Math.max(1e-4, 1 - u), a);
  return p1 / (p1 + p2);
}
function drawRec23(t){
  const mid = (REC23_L + REC23_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  ctx.save();   // after the cull, for the same reason
  const kk = k(1000);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC23_L, kk), x1 = px(REC23_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#e4e9ed'); wg.addColorStop(0.45, '#f6f9fb'); wg.addColorStop(1, '#c8ced4');
  ctx.fillStyle = wg; ctx.fillRect(x0, 0, x1 - x0, yBase);
  const cx = px(mid, kk);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(58 * kk * SS, '700', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${58*TRACK.title*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(32,42,54,0.96)';
  ctx.fillText('The crossover', cx, py(46, kk));
  /* THE PANEL PUBLISHES ITS EMPTY BAND. The year over this bay is not drawn
     here — it is the hall's own numeral, on the era's type plane — so the only
     way it can sit centred in the white above the title is for the panel to
     say, every frame, where that white ends. Measured off the title's own ink,
     not off its baseline, so the band is what the eye actually sees.
     (Eldar, 2026-09-15: "год должен быть в центре по вертикали внутри
     свободного пространства".) */
  BAY_FREE['2023'] = {top: 0, bot: py(46, kk) - ctx.measureText('The crossover').actualBoundingBoxAscent,
                      frame: state.time};
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(30 * kk * SS, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(60,70,84,0.95)';
  /* twenty units under a fifty-eight unit line is not a gap, it is a collision:
     the sub sat inside the descenders of the title. It gets its own air now. */
  ctx.fillText('march 2023 \u00b7 the digital impressions outnumber the physical', cx, py(96, kk));
  ctx.restore();

  const ph = crossPhase(mid);
  const pw2 = 700 * kk * SS, pl = cx - pw2 / 2;
  const pTop = py(220, kk), pBot = py(560, kk), pH = pBot - pTop;
  ctx.strokeStyle = 'rgba(90,102,116,0.30)'; ctx.lineWidth = 1 * SS;
  ctx.beginPath(); ctx.moveTo(pl, pBot); ctx.lineTo(pl + pw2, pBot); ctx.stroke();
  const N = 64, upto = Math.max(0.02, ph);
  for (const [who, col, wid] of [['phys', '110,122,136', 2.4], ['dig', '40,140,210', 3.0]]){
    ctx.strokeStyle = `rgba(${col},0.92)`;
    ctx.lineWidth = wid * kk * SS;
    ctx.beginPath();
    for (let i = 0; i <= N; i++){
      const u = (i / N) * upto;
      const v = who === 'dig' ? digShare(u) : 1 - digShare(u);
      const X = pl + pw2 * u, Y = pBot - pH * (0.12 + 0.76 * v);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }
  ctx.font = eraFont(24 * kk * SS, '700', SEGMENTS[3].font);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(110,122,136,0.9)';
  ctx.fillText('Physical', pl, pBot - pH * 0.94);
  ctx.fillStyle = 'rgba(40,140,210,0.9)';
  ctx.fillText('Digital', pl, pBot - pH * 0.06);
  ctx.textAlign = 'center';
  if (ph >= 0.5){
    const mx2 = pl + pw2 * 0.5, my2 = pBot - pH * 0.50;
    const a2 = Math.min(1, (ph - 0.5) * 5);
    ctx.strokeStyle = `rgba(30,40,52,${(0.5 * a2).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    ctx.setLineDash([4 * SS, 4 * SS]);
    ctx.beginPath(); ctx.moveTo(mx2, my2); ctx.lineTo(mx2, pBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(30,40,52,${(0.9 * a2).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(mx2, my2, 4.5 * kk * SS, 0, 7); ctx.fill();
    ctx.font = eraFont(22 * kk * SS, '700', SEGMENTS[3].font);
    ctx.fillText('March 2023', mx2, pBot + 26 * kk * SS);
  }
  // the instant itself, caught on the crossing of dead centre and not before
  const dxm = cam.x - mid;
  if (state._x23 != null && Math.sign(dxm) !== Math.sign(state._x23) && Math.abs(dxm) < 400)
    state._x23flash = 1;
  state._x23 = dxm;
  if (state._x23flash > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('210,236,255', pl + pw2 * 0.5, pBot - pH * 0.5, pw2 * 0.8, 0.5 * state._x23flash);
    ctx.restore();
    state._x23flash *= 0.90;
  }
  ctx.restore();
}

/* THE PILE. Not a metaphor — the thing itself: the boxes the physical
   impressions arrived in, stacked the way they stacked in a mailroom. They go
   one at a time, from the top down, as you come through: half the pile by the
   moment the two lines cross, and by the time you have walked on, a tenth of it
   is left standing at the bottom. That is the whole of March 2023. */
/* Forty-eight boxes at twice the size. The pile stands tall enough to cross
   the lines behind it, and that is fine: by the time it is in front of them
   most of it has already gone, and what is left is below the crossing. */
const BOX_ROWS = [7, 6, 6, 5, 5, 4, 4, 3, 3, 2, 2, 1];   // 48, bottom row first
let BOX_PILE = null;
function boxPile(){
  if (BOX_PILE) return BOX_PILE;
  BOX_PILE = [];
  BOX_ROWS.forEach((cnt, r) => {
    for (let i = 0; i < cnt; i++){
      const jitter = ((r * 7 + i * 13) % 9 - 4) / 40;    // stacked by hand, not by machine
      BOX_PILE.push({r, u: (i - (cnt - 1) / 2) * 1.06 + jitter, lean: ((r * 5 + i * 11) % 7 - 3) * 0.006});
    }
  });
  return BOX_PILE;
}
function drawBoxPile(b, t){
  const g = b.rig, kk = k(bz(g.lz ?? 150));
  const sx = px(b.x + (g.dx || 0), kk);
  const S1 = (g.w || 300) * kk * SS / 240;
  const foot = py(CFG.benchY - 2, kk);
  if (sx < -500 || sx > W + 500) return;
  const ph = crossPhase(b.x);
  const P = boxPile(), N = P.length;
  const live = Math.max(Math.round(N * 0.10), Math.ceil(N * (1 - 0.90 * ph)));
  const bw = 26 * S1, bh = 15 * S1, dp = 9 * S1;        // one carton

  ctx.save();
  ctx.translate(sx, foot); ctx.scale(1, 0.20); ctx.translate(-sx, -foot);
  const csh = ctx.createRadialGradient(sx, foot, 0, sx, foot, bw * 4.4);
  csh.addColorStop(0, `rgba(0,0,0,${(0.42 * (0.35 + 0.65 * live / N)).toFixed(3)})`);
  csh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = csh;
  ctx.beginPath(); ctx.arc(sx, foot, bw * 4.4, 0, 7); ctx.fill();
  ctx.restore();

  for (let i = 0; i < live; i++){
    const q = P[i];
    const bx = sx + q.u * bw, by = foot - q.r * bh;
    const goingA = Math.max(0, Math.min(1, (live - i) / 1.0));    // the top one is mid-flight
    ctx.save();
    ctx.globalAlpha = goingA;
    ctx.translate(bx, by); ctx.rotate(q.lean); ctx.translate(-bx, -by);
    // the face, the lid and the side it turns away
    ctx.fillStyle = '#d5cbb8';
    ctx.fillRect(bx - bw/2, by - bh, bw, bh);
    ctx.fillStyle = '#e9e1d3';
    ctx.beginPath();
    ctx.moveTo(bx - bw/2, by - bh);
    ctx.lineTo(bx - bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2, by - bh);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b3a892';
    ctx.beginPath();
    ctx.moveTo(bx + bw/2, by - bh);
    ctx.lineTo(bx + bw/2 + dp, by - bh - dp * 0.62);
    ctx.lineTo(bx + bw/2 + dp, by - dp * 0.62);
    ctx.lineTo(bx + bw/2, by);
    ctx.closePath(); ctx.fill();
    // the tape down the middle, and the docket stuck on the front
    ctx.fillStyle = 'rgba(160,150,132,0.55)';
    ctx.fillRect(bx - 1.1 * S1, by - bh, 2.2 * S1, bh);
    ctx.fillStyle = 'rgba(252,250,244,0.9)';
    ctx.fillRect(bx - bw * 0.36, by - bh * 0.72, bw * 0.26, bh * 0.34);
    ctx.strokeStyle = 'rgba(120,112,98,0.5)'; ctx.lineWidth = 0.9 * SS;
    ctx.strokeRect(bx - bw/2, by - bh, bw, bh);
    ctx.restore();
  }
  pushHit(sx - bw * 4, foot - BOX_ROWS.length * bh - dp, bw * 8, BOX_ROWS.length * bh + dp * 2,
          {type: 'openbox'});
}

/* 2018 · THE FIRST AI CROWN — and the arm that takes it on.
   Every other machine in this hall does something TO the crown: the scanner
   measures it, the mill cuts it away, the laser reads it. Here nothing touches
   it. Three candidate forms are proposed over the prepared tooth, they flicker
   against each other, one wins and closes into a solid. No tool appears at any
   point, because that is the entire fact of 2018. Then the crown leaves the
   screen: it drifts forward out of the panel's plane into the room, growing as
   it comes, and turns from a wireframe into an object exactly as the arm from
   the year after closes on it and carries it into production. It is the only
   thing in the hall that travels between two beats. */
function crownSilhouette(cx, cy, w, h, warp){
  crownGeometry();
  const rows = CROWN_ROWS;
  ctx.beginPath();
  for (let i = 0; i < rows.length; i++){
    const d = warp ? warp(i, -1) : 0;
    const x = cx + (rows[i][0] + d) * w, y = cy + rows[i][2] * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let i = rows.length - 1; i >= 0; i--){
    const d = warp ? warp(i, 1) : 0;
    ctx.lineTo(cx + (rows[i][1] + d) * w, cy + rows[i][2] * h);
  }
  ctx.closePath();
}
const AI_WARP = c => (i, side) =>
  side * (0.034 * Math.sin(i * 0.9 + c * 2.1) + 0.014 * Math.cos(i * 1.7 + c * 3.3));

function drawRec18(t){
  const mid = (REC18_L + REC18_R) / 2;
  if (Math.abs(cam.x - mid) > CULL_BAY) return;
  const kk = k(1000);
  /* the bay stands ON its block: the panel ends on the tread line and is drawn
     to the BLOCK's width, on the BLOCK's own plane */
  const yBase = py(1040, k(R18_BAY_Z));
  const x0 = px(REC18_L, kk), x1 = px(REC18_R, kk);
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#e6eaee'); wg.addColorStop(0.45, '#f7fafc'); wg.addColorStop(1, '#cad0d6');
  ctx.fillStyle = wg;
  {
    const kb = k(R18_BAY_Z);
    ctx.fillRect(px(REC18_L - STEP_PAD, kb), 0,
                 px(REC18_R + STEP_PAD, kb) - px(REC18_L - STEP_PAD, kb), yBase);
  }
  const cx = px(mid, kk);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(58 * kk * SS, '700', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${58*TRACK.title*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(32,42,54,0.96)';
  ctx.fillText('The first AI crown', cx, py(46 - AI_VITRINE.dy, kk));
  try { ctx.letterSpacing = '0px'; } catch(e){}
  /* THE TITLE STANDS ALONE. The line under it — «no hand drew it · no tool cut
     it · it was proposed» — is gone: the bay shows the crown being made, and
     Eldar took the caption off it (2026-09-22). */
  ctx.restore();

  drawAiCrownVitrine(mid, kk, t);
  for (const wxc of [REC18_L, REC18_R]){
    const kc = k(994), sxc = px(wxc, kc), cw = 116 * kc * SS;
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#8f979f'); cg.addColorStop(0.45, '#d8dee3'); cg.addColorStop(1, '#7d858c');
    ctx.fillStyle = cg;

  drawBayStep(REC18_L, REC18_R, STEP_TONE.white, R18_BAY_Z, noseOf(R18_BAY_Z));
