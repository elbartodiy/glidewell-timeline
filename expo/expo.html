  ctx.fillStyle = 'rgba(255,220,90,0.95)';
  ctx.fillText(`WALL SWITCH ${wallSwitchX()|0}`, wsx + 5*SS, 90*SS);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(`cam ${cam.x|0}  bench top ${py(CFG.benchY, kf)|0}  floor ${py(1080, kf)|0}`, 12*SS, H - 100*SS);
  ctx.restore();
}

/* TALL UNITS — a drawer bank standing against the wall, full height. It earns
   its place twice: it gives the craft era the storage a real lab had, and it
   stands exactly where the wall changes material, so the change happens behind
   furniture instead of down an open joint. */
const TALL_UNITS = [
  {x: bayStart(0) + CUTS[0].w / 2, w: 440, cols: 2, rows: 5, top: 150},
];
function drawTallUnits(){
  for (const u of TALL_UNITS){
    const seg = segAt(u.x);
    const kk = k((seg.z0 || 550) - 40);         // furniture stands just off the wall
    const sx = px(u.x, kk), w = u.w * kk * SS;
    if (sx < -w || sx > W + w) continue;
    const yTop = py(u.top, kk), yBot = py(CFG.benchY + 90, kk);
    const h = yBot - yTop;
    const x0 = sx - w / 2;
    ctx.save();
    // the carcass, in the era's own cabinet wood
    const tex = TEX[seg.front];
    ctx.beginPath(); ctx.rect(x0, yTop, w, h); ctx.clip();
    if (tex) for (let yy = yTop; yy < yBot; yy += w * 0.62)
      ctx.drawImage(tex, x0, yy, w, w * 0.62 + 1);
    else { ctx.fillStyle = '#2a1c10'; ctx.fillRect(x0, yTop, w, h); }
    // drawers: a grid of shallow fronts, each with a shadow under its lip
    const cw = w / u.cols, ch = h / u.rows;
    for (let r = 0; r < u.rows; r++)
      for (let c = 0; c < u.cols; c++){
        const dx0 = x0 + c * cw + 3 * kk * SS, dy0 = yTop + r * ch + 3 * kk * SS;
        const dw = cw - 6 * kk * SS, dh = ch - 6 * kk * SS;
        const g = ctx.createLinearGradient(0, dy0, 0, dy0 + dh);
        g.addColorStop(0, 'rgba(255,238,205,0.06)');
        g.addColorStop(0.10, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.30)');
        ctx.fillStyle = g; ctx.fillRect(dx0, dy0, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = Math.max(1, 1.4 * kk * SS);
        ctx.strokeRect(dx0, dy0, dw, dh);
        // the pull
        ctx.fillStyle = 'rgba(24,18,12,0.85)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1.5, 3.4 * kk * SS));
        ctx.fillStyle = 'rgba(255,236,200,0.16)';
        ctx.fillRect(dx0 + dw * 0.32, dy0 + dh * 0.52, dw * 0.36, Math.max(1, 1.2 * kk * SS));
      }
    ctx.restore();
    // cornice, and the shadow the unit throws onto the wall beside it
    ctx.fillStyle = 'rgba(38,26,16,0.95)';
    ctx.fillRect(x0 - 5 * kk * SS, yTop - 9 * kk * SS, w + 10 * kk * SS, 9 * kk * SS);
    for (const s of [-1, 1]){
      const gx = sx + s * (w / 2);
      const sh = ctx.createLinearGradient(gx, 0, gx + s * 46 * kk * SS, 0);
      sh.addColorStop(0, 'rgba(0,0,0,0.40)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh;
      ctx.fillRect(Math.min(gx, gx + s * 46 * kk * SS), yTop, 46 * kk * SS, h);
    }
  }
}

function drawProgress(t){
  const busy = state.study || state.inspect || state.clip || state.introHold;
  const hidden = Math.max(state.introFade || 0, state.finFade || 0, state.attract.fade || 0);
  const want = busy ? 0 : (1 - hidden);
  state.ruleA += (want - state.ruleA) * Math.min(1, (state.dt || 0.016) * 6);
  const A = state.ruleA;
  if (A < 0.02) return;

  const x0 = W * 0.13, x1 = W * 0.87, span = x1 - x0;
  const y = H - 40 * SS;
  const W0 = INTRO_X, W1 = FIN_X;
  const at = wx => x0 + span * Math.max(0, Math.min(1, (wx - W0) / (W1 - W0)));
  const RECS = [[REC_L, REC_R], [REC3_L, REC3_R], [REC2_L, REC2_R], [REC4_L, REC4_R]];
  // 1970 is a recreation too — the founding bench stands in its own cut bay, so
  // it earns the same pip as the other portals. The gap is taken at the width
  // the others use, not the bay's full 2320, so the rule keeps its rhythm.
  if (CUTS[1].on){
    const fc = bayStart(1) + CUTS[1].w / 2;
    RECS.push([fc - 540, fc + 540]);
  }

  ctx.save();
  ctx.lineCap = 'butt';
  // each era draws its own stretch in its own ink; the recreations are the gaps
  for (const seg of SEGMENTS){
    const a0 = Math.max(seg.x0, W0), a1 = Math.min(seg.x1, W1);
    if (a1 <= a0) continue;
    let cuts = [[a0, a1]];
    for (const [rl, rr] of RECS){
      const next = [];
      for (const [c0, c1] of cuts){
        if (rr <= c0 || rl >= c1) { next.push([c0, c1]); continue; }
        if (rl > c0) next.push([c0, rl]);
        if (rr < c1) next.push([rr, c1]);
      }
      cuts = next;
    }
    ctx.strokeStyle = `rgba(${seg.ink},${(0.30 * A).toFixed(3)})`;
    ctx.lineWidth = 2 * SS;
    for (const [c0, c1] of cuts){
      ctx.beginPath(); ctx.moveTo(at(c0), y); ctx.lineTo(at(c1), y); ctx.stroke();
    }
  }
  // the portals: a brighter pip where the hall changes era
  for (const [rl, rr] of RECS){
    const cx = at((rl + rr) / 2);
    ctx.fillStyle = `rgba(235,225,205,${(0.34 * A).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(cx, y - 5 * SS); ctx.lineTo(cx + 3.4 * SS, y);
    ctx.lineTo(cx, y + 5 * SS); ctx.lineTo(cx - 3.4 * SS, y); ctx.closePath(); ctx.fill();
  }
  // a tick per beat; the landmark years stand a little taller, and the white
  // era marks its years with points rather than strokes
  for (const b of BEATS){
    if (b.under) continue;
    const bx = at(b.x), tall = (b.tier === 1 || b.fly) ? 5 : 3;
    const st = RULE_STYLE[Math.max(0, Math.min(3, segIdx(b.x)))];
    const al = (b.minor ? 0.22 : 0.40) * A;
    if (st.tick === 'dot'){
      ctx.fillStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(bx, y, (b.minor ? 1.3 : 1.9) * SS, 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(${segAt(b.x).ink},${al.toFixed(3)})`;
      ctx.lineWidth = 1.4 * SS;
      ctx.beginPath(); ctx.moveTo(bx, y - tall * SS); ctx.lineTo(bx, y + tall * SS); ctx.stroke();
    }
  }
  // the thumb: not a point but the stretch of line the screen is showing
  const segNow = segAt(cam.x);
  const g = ruleGeom();
  const tx0 = g.at(cam.x - g.half), tx1 = g.at(cam.x + g.half);
  const mx = (tx0 + tx1) / 2, tw = Math.max(14 * SS, tx1 - tx0);
  const warm = ruleHit(Input.hover) || state.ruleDrag ? 1 : 0;
  const S = ruleStyle();
  drawGlow(S.glow, mx, y, tw + 90 * SS, (0.20 + 0.14 * warm) * A);
  drawRuleThumb(mx, y, tw, S, A, warm);
  const nb = nearestBeat(cam.x);
  if (nb.i >= 0 && BEATS[nb.i].y){
    ctx.font = eraFont(17 * SS, '', segNow.font);
    ctx.textAlign = 'center';
    try { ctx.letterSpacing = `${3 * SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(${segNow.ink},${(0.62 * A).toFixed(3)})`;
    ctx.fillText(BEATS[nb.i].y, mx, y - 17 * SS);   // in the era's own face
    try { ctx.letterSpacing = '0px'; } catch(e){}
  }
  ctx.restore();
}

/* Bloom. The single largest difference between a drawing and a photograph is
   that in a photograph light spills: a lamp, a neon ring, a lit rim of glass
   bleeds into what surrounds it, because the lens cannot keep it inside its
   own edge. Everything above 0.85 is lifted off the finished frame at a
   quarter resolution, blurred, and added back — cheap enough for the N100 at
   480x270, and it is what makes the hall stop looking vector. `?nobloom` off. */
const BLOOM_ON = !/[?&]nobloom/.test(location.search);
let BLOOM = null;
function drawBloom(){
  if (!BLOOM_ON || !W || !H) return;
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  if (!BLOOM || BLOOM.width !== bw || BLOOM.height !== bh){
    BLOOM = document.createElement('canvas');
    BLOOM.width = bw; BLOOM.height = bh;
  }
  const g = BLOOM.getContext('2d');
  g.clearRect(0, 0, bw, bh);
  // brightness 0.515 + contrast 8 puts the knee at ~0.85 and blows what is
  // over it to white; the blur then spreads only that
  g.filter = `brightness(0.515) contrast(8) blur(${Math.max(2, bw*0.008).toFixed(1)}px)`;
  g.drawImage(ctx.canvas, 0, 0, bw, bh);
  g.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.20;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(BLOOM, 0, 0, W, H);
  ctx.restore();
}

function drawSeamVideo(){
  const S = state.splice;
  if (!S) return;
  if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
    // the generated clip carries the whole transition
    const a = Math.min(1, S.t * 4);
    ctx.globalAlpha = a;
    const vw = SEAM_VIDEO.videoWidth, vh = SEAM_VIDEO.videoHeight;
    const sc = Math.max(W/vw, H/vh);
    ctx.drawImage(SEAM_VIDEO, W/2 - vw*sc/2, H/2 - vh*sc/2, vw*sc, vh*sc);
    ctx.globalAlpha = 1;
  } else {
    // placeholder: a veil of light carries us across
    const e = Math.max(0, Math.min(1, Math.min(S.t * 3.4, (SPLICE.dur - S.t) * 3.4)));
    ctx.fillStyle = `rgba(240,246,252,${(0.97 * e * e).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* after the world dims, the 1979 map gets its crossed beams — and is redrawn
   on top so it never loses its contrast */
function drawMapHero(t, h){
  if (h < 0.02 || !MAP_SPRITE) return;
  const mid = (REC_L + REC_R) / 2;
  const kk = k(610);
  const sp = MAP_SPRITE;
  const w = 440 * kk * SS, hh = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(450, kk);
  // twin beams crossing on the map
  const yEnd = cyS + hh * 1.4;
  for (const s of [-1, 1]){
    const fx = px(mid + s * 470, kk);
    const xEnd = fx + ((cx - fx) * (yEnd / Math.max(1, cyS))) * Math.min(1, h * 1.7);
    const beam = ctx.createLinearGradient(0, 0, 0, yEnd);
    beam.addColorStop(0, `rgba(255,246,220,${(0.03*h).toFixed(3)})`);
    beam.addColorStop(Math.max(0.05, Math.min(0.9, cyS/yEnd)), `rgba(255,246,220,${(0.15*h).toFixed(3)})`);
    beam.addColorStop(1, 'rgba(255,246,220,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(fx - 26*SS, 0); ctx.lineTo(fx + 26*SS, 0);
    ctx.lineTo(xEnd + 90*kk*SS, yEnd); ctx.lineTo(xEnd - 90*kk*SS, yEnd);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(20,20,22,0.9)';
    ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
    ctx.fillStyle = `rgba(255,246,220,${(0.75*h).toFixed(2)})`;
    ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
  }
  // the map itself rides above the dim and the light — crisp
  ctx.drawImage(sp.c, cx - w/2, cyS - hh/2, w, hh);
}

/* the 1979 panel: a light wall between two columns, carrying the map of
   Southern California with the nine labs on it */
let MAP_SPRITE = null, MAPWALL_TEX = null;
function makeMapSprite(){
  const c = document.createElement('canvas'); c.width = 920; c.height = 660;
  const g = c.getContext('2d');
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 20; g.shadowOffsetY = 9;
  g.fillStyle = '#2e1f10'; g.fillRect(16, 16, 888, 628);
  g.restore();
  g.fillStyle = '#e9e0c8'; g.fillRect(40, 40, 840, 580);
  g.fillStyle = 'rgba(150,120,70,0.08)';
  for (let i = 0; i < 5; i++) g.fillRect(40, 40 + i*116, 840, 58);
  // the coast of Southern California
  g.strokeStyle = 'rgba(70,90,110,0.85)'; g.lineWidth = 5; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(70, 150);
  g.lineTo(210, 190); g.lineTo(300, 250); g.lineTo(360, 310);
  g.lineTo(430, 350); g.lineTo(520, 420); g.lineTo(560, 490); g.lineTo(600, 560);
  g.stroke();
  g.fillStyle = 'rgba(120,160,190,0.20)';
  g.beginPath();
  g.moveTo(70, 150); g.lineTo(210, 190); g.lineTo(300, 250); g.lineTo(360, 310);
  g.lineTo(430, 350); g.lineTo(520, 420); g.lineTo(560, 490); g.lineTo(600, 560);
  g.lineTo(40, 560); g.lineTo(40, 150); g.closePath(); g.fill();
  // faint inland grid
  g.strokeStyle = 'rgba(90,70,40,0.15)'; g.lineWidth = 1.5;
  for (let i = 1; i < 8; i++){
    g.beginPath(); g.moveTo(40 + i*105, 40); g.lineTo(40 + i*105, 620); g.stroke();
    if (i < 6){ g.beginPath(); g.moveTo(40, 40 + i*97); g.lineTo(880, 40 + i*97); g.stroke(); }
  }
  // the nine labs
  const dots = [[470,330],[520,300],[560,350],[500,390],[590,300],[620,380],[545,255],[660,330],[610,430]];
  g.strokeStyle = 'rgba(190,60,45,0.35)'; g.lineWidth = 2;
  for (let i = 1; i < dots.length; i++){
    g.beginPath(); g.moveTo(dots[0][0], dots[0][1]); g.lineTo(dots[i][0], dots[i][1]); g.stroke();
  }
  for (const [dx, dy] of dots){
    g.fillStyle = 'rgba(190,60,45,0.25)';
    g.beginPath(); g.arc(dx, dy, 16, 0, 7); g.fill();
    g.fillStyle = '#c23a2c';
    g.beginPath(); g.arc(dx, dy, 7, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(80,60,35,0.9)';
  g.textAlign = 'center';
  g.font = '600 34px Georgia, serif';
  try { g.letterSpacing = '6px'; } catch(e){}
  g.fillText('SOUTHERN CALIFORNIA', 460, 590);
  return {c, w: c.width, h: c.height, inner: {w: c.width, h: c.height}};
}
function drawMapWall(t){
  const mid = (REC_L + REC_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  const kk = k(610);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC_L, kk), x1 = px(REC_R, kk);
  // the light wall panel
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#6d6455');
  wg.addColorStop(0.4, '#8a8070');
  wg.addColorStop(1, '#5c5346');
  ctx.fillStyle = wg;
  ctx.fillRect(x0, 0, x1 - x0, yBase);
  // the map, centered
  const sp = MAP_SPRITE;
  const w = 440 * kk * SS, h = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(450, kk);
  pushHit(cx - w/2, cyS - h/2, w, h, {type:'photo', sp, wx: mid, cy: 450, z: 610, w: 440,
          cap: '1979 · nine labs across Southern California', beat: BEATS.findIndex(b => b.y === '1979')});
  ctx.drawImage(sp.c, cx - w/2, cyS - h/2, w, h);
  // the red carpet running up to the map
  {
    const kNear = k(-40), kFar = k(590);
    const yNear = H, yFar = py(1064, kFar);
    const cxN = px(mid, kNear), cxF = px(mid, kFar);
    const wN = 330 * kNear * SS, wF = 150 * kFar * SS;
    const cg = ctx.createLinearGradient(0, yFar, 0, yNear);
    cg.addColorStop(0, '#5a0f18');
    cg.addColorStop(0.6, '#7c1622');
    cg.addColorStop(1, '#8f1a27');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(cxN - wN, yNear); ctx.lineTo(cxF - wF, yFar);
    ctx.lineTo(cxF + wF, yFar); ctx.lineTo(cxN + wN, yNear);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(235,195,120,0.4)'; ctx.lineWidth = 2.5*SS;
    ctx.beginPath(); ctx.moveTo(cxN - wN + 10*SS, yNear); ctx.lineTo(cxF - wF + 5*SS, yFar); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cxN + wN - 10*SS, yNear); ctx.lineTo(cxF + wF - 5*SS, yFar); ctx.stroke();
  }
  // pilaster columns on both edges — same plane as the walls they join
  for (const wxc of [REC_L, REC_R]){
    const kc = k(604);
    const sxc = px(wxc, kc);
    const cw = 120 * kc * SS;
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#2a2118'); cg.addColorStop(0.45, '#5a4c38'); cg.addColorStop(1, '#1d1710');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, yBase);
    // brass trim on both faces of the pilaster
    ctx.fillStyle = 'rgba(206,164,88,0.55)';
    ctx.fillRect(sxc - cw/2 + 2*SS, 0, 2.2*SS, yBase);
    ctx.fillRect(sxc + cw/2 - 4.2*SS, 0, 2.2*SS, yBase);
    ctx.fillStyle = 'rgba(255,230,180,0.12)';
    ctx.fillRect(sxc - cw/2 + 6*SS, 0, 3*SS, yBase);
  }
}

/* the Digital Revolution recreation: grey era | column | a backlit white
   panel carrying a giant glowing crown | column | the white era */
/* THE DIGITAL REVOLUTION, as three states of one crown.
   Scan, file, mill — the actual chain of those years, and the only honest triad
   here: AI belongs to the 2020s, not to 2009. The three stand on the SAME world
   x at three depths, so they are three separate objects everywhere in the hall
   and lock into a single concentric silhouette at the one camera position the
   composition is built for. The middle state descends as you arrive: the file
   is what the room assembles in front of you. */
let CROWN_PTS = null, CROWN_ROWS = null;
function crownGeometry(){
  if (CROWN_PTS) return;
  const sp = PED_SPRITES.crown2;
  const c = document.createElement('canvas'); c.width = sp.w; c.height = sp.h;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.drawImage(sp.c, 0, 0);
  const d = g.getImageData(0, 0, sp.w, sp.h).data;
  const inside = (x, y) => d[((y|0) * sp.w + (x|0)) * 4 + 3] > 40;
  const R = rng(90210);
  CROWN_PTS = [];
  for (let i = 0; i < 900 && CROWN_PTS.length < 260; i++){
    const x = R() * sp.w, y = R() * sp.h;
    if (inside(x, y)) CROWN_PTS.push([x / sp.w - 0.5, y / sp.h - 0.5]);
  }
  CROWN_ROWS = [];
  for (let y = 2; y < sp.h - 2; y += Math.max(2, sp.h / 14)){
    let a = -1, b = -1;
    for (let x = 0; x < sp.w; x++){ if (inside(x, y)){ if (a < 0) a = x; b = x; } }
    if (a >= 0 && b - a > 3) CROWN_ROWS.push([a / sp.w - 0.5, b / sp.w - 0.5, y / sp.h - 0.5]);
  }
}
/* the scan: the surface as a cloud of measured points, nothing solid yet */
function drawCrownScan(cx, cy, w, a){
  crownGeometry();
  const sp = PED_SPRITES.crown2, h = w * sp.h / sp.w;
  ctx.save();
  for (const [ux, uy] of CROWN_PTS){
    const px_ = cx + ux * w, py_ = cy + uy * h;
    ctx.fillStyle = `rgba(150,225,255,${(a * (0.35 + 0.5 * Math.abs(uy))).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px_, py_, Math.max(0.7, w * 0.006), 0, 7); ctx.fill();
  }
  ctx.restore();
}
/* the file: contour rings, the way a design is actually held in a machine —
   and they are not simply there. A laser comes in from above and to the left,
   sweeps down through the crown's space, and each ring appears as the beam
   reaches it, burns bright at the moment of the cut, then settles. The mesh is
   the record of the pass, which is what a scan actually is. */
/* `ph` is not time — it is how far the camera has come into the recreation, so
   the scanner cuts the crown exactly as fast as the hand pushes forward and
   finishes the file at the instant the three elements line up. Nothing here
   moves on its own. */
function drawCrownFile(cx, cy, w, a, ph){
  crownGeometry();
  const sp = PED_SPRITES.crown2, h = w * sp.h / sp.w;
  const beamY = cy - h * 0.58 + ph * h * 1.16;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';          // neon: light added, not painted
  // the rings themselves are deep and saturated, the bloom around them cool
  ctx.shadowColor = `rgba(40,150,255,${(a * 0.9).toFixed(3)})`;
  ctx.shadowBlur = Math.max(3, w * 0.05);
  ctx.lineWidth = Math.max(1, w * 0.009);
  for (const [ax, bx, uy] of CROWN_ROWS){
    const y = cy + uy * h, rx = (bx - ax) * w / 2, mx = cx + (ax + bx) * w / 2;
    // a ring exists once the beam has passed it; it flares at the cut itself
    const d = (beamY - y) / h;
    if (d < -0.03) continue;
    const born = d < 0 ? 1 + d / 0.03 : 1;
    const cut = Math.exp(-Math.abs(d) * 26);
    ctx.strokeStyle = `rgba(${50 + 160*cut},${150 + 80*cut},${215 + 40*cut},${(a * (0.55 + 0.45*cut) * born).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(mx, y, rx, Math.max(1.5, h * 0.022), 0, 0, 7); ctx.stroke();
  }
  // one white line down the axis — the tube inside the glow
  ctx.shadowColor = `rgba(150,220,255,${(a * 0.9).toFixed(3)})`;
  ctx.shadowBlur = Math.max(4, w * 0.07);
  ctx.strokeStyle = `rgba(255,255,255,${(a * 0.95).toFixed(3)})`;
  ctx.lineWidth = Math.max(1, w * 0.012);
  ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.52); ctx.lineTo(cx, cy + h * 0.52); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(120,200,240,${(a * 0.55).toFixed(3)})`;
  ctx.beginPath();
  for (let i = 0; i < CROWN_ROWS.length; i++){
    const [ax, , uy] = CROWN_ROWS[i];
    const x = cx + ax * w, y = cy + uy * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < CROWN_ROWS.length; i++){
    const [, bx, uy] = CROWN_ROWS[i];
    const x = cx + bx * w, y = cy + uy * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  // the plane of light it lays across the crown's space
  ctx.shadowBlur = 0;
  const pg2 = ctx.createLinearGradient(cx - w/2, beamY - h*0.035, cx - w/2, beamY + h*0.035);
  pg2.addColorStop(0, 'rgba(180,240,255,0)');
  pg2.addColorStop(0.5, `rgba(215,248,255,${(a*0.34).toFixed(3)})`);
  pg2.addColorStop(1, 'rgba(180,240,255,0)');
  ctx.fillStyle = pg2;
  ctx.fillRect(cx - w*0.62, beamY - h*0.035, w*1.24, h*0.07);
  ctx.restore();
}

/* THE SCANNER. Its head is bolted to the ceiling of the bay — a fixed point in
   the room, so the beam pivots as you walk past it instead of travelling along
   with you. The light passes in FRONT of the crown, sweeping its space
   diagonally, and comes to rest with its edge on the lower left of the crown at
   the exact instant the three elements align. Past that instant it is simply
   switched off: the mesh it cut stays behind on the screen. It is a shaft, not
   a stroked line — a narrow aperture opening into a wide footprint, striated by
   a fixed comb of blades the way any beam looks crossing air that has dust in
   it, so nothing here crawls of its own accord. */
function drawScanBeam(cx, cy, w, h, kn, ph, a){
  const mid = (REC2_L + REC2_R) / 2;
  const ex = px(mid - 300, kn), ey = py(58, kn);
  const aimX = cx + w * (0.52 - 1.02 * ph);
  const aimY = cy + h * (-0.55 + 1.15 * ph);
  ctx.save();
  // the head on the ceiling
  const hw2 = 15 * kn * SS, hh2 = 9 * kn * SS;
  ctx.fillStyle = 'rgba(24,32,40,0.92)';
  ctx.fillRect(ex - hw2, ey - hh2 * 2.4, hw2 * 2, hh2 * 2.4);
  ctx.fillStyle = `rgba(150,220,255,${(0.85 * a).toFixed(3)})`;
  ctx.fillRect(ex - hw2 * 0.55, ey - hh2 * 0.5, hw2 * 1.1, hh2 * 0.5);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('150,220,255', ex, ey, w * 0.34, a * 0.35);
  const bdx = aimX - ex, bdy = aimY - ey, bl = Math.hypot(bdx, bdy) || 1;
  const nxp = -bdy / bl, nyp = bdx / bl;
  const ap = Math.max(1.1, w * 0.030), fp = w * 0.145;
  const shaft = (s0, s1, al) => {
    ctx.beginPath();
    ctx.moveTo(ex + nxp * ap * s0, ey + nyp * ap * s0);
    ctx.lineTo(ex + nxp * ap * s1, ey + nyp * ap * s1);
    ctx.lineTo(aimX + nxp * fp * s1, aimY + nyp * fp * s1);
    ctx.lineTo(aimX + nxp * fp * s0, aimY + nyp * fp * s0);
    ctx.closePath();
    const g = ctx.createLinearGradient(ex, ey, aimX, aimY);
    g.addColorStop(0,    `rgba(110,200,255,${(a * al * 0.34).toFixed(3)})`);
    g.addColorStop(0.72, `rgba(165,230,255,${(a * al * 0.78).toFixed(3)})`);
    g.addColorStop(1,    `rgba(225,248,255,${(a * al).toFixed(3)})`);
    ctx.fillStyle = g; ctx.fill();
  };
  shaft(-1, 1, 0.13);
  for (const s of [-0.80, -0.50, -0.22, 0.05, 0.31, 0.59, 0.85])
    shaft(s - 0.062, s + 0.062, 0.09 + 0.05 * (1 - Math.abs(s)));
  shaft(-0.10, 0.10, 0.44);
  drawGlow('225,248,255', aimX, aimY, w * 0.34, a * 0.6);
  ctx.restore();
}

/* the front of the composition: the milled crown stands nearer than the
   recreation's own columns, so it is painted with the other near-plane
   exhibits rather than inside the portal that frames it */
function drawRec2Front(t){
  const mid = (REC2_L + REC2_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  const kk = k(970), cx = px(mid, kk);
  const lock = Math.max(0, 1 - Math.abs(cam.x - mid) / 900);
  const ease = lock * lock * (3 - 2 * lock);
  const kn = k(-90), cw = 148 * kn * SS;
  const nx = px(mid, kn), ny = py(417, kn);
  const spm = PED_SPRITES.crown2, chh = cw * spm.h / spm.w;
  const plY = ny + chh * 0.5, pw = 150 * kn * SS;
  /* The plinth is a cylinder of frosted glass. It cannot be truly transparent:
     the sentence painted on the panel behind would read straight through it and
     the window set into its face would stop meaning anything. So it is glass
     the way frosted glass actually behaves — it carries light, not detail. */
  const pgv = ctx.createLinearGradient(0, plY, 0, H);
  pgv.addColorStop(0,    '#e8f2f8');       // bright where the crown stands on it
  pgv.addColorStop(0.20, '#cfdde7');
  pgv.addColorStop(0.72, '#9fb1bd');
  pgv.addColorStop(1,    '#7c8d99');       // and heavier toward the floor
  ctx.fillStyle = pgv; ctx.fillRect(nx - pw/2, plY, pw, H - plY);
  // the barrel: dark at the shoulders, one specular band left of centre, and
  // the two vertical seams where the light catches the thickness of the glass
  const pgh = ctx.createLinearGradient(nx - pw/2, 0, nx + pw/2, 0);
  pgh.addColorStop(0,     'rgba(26,40,52,0.58)');
  pgh.addColorStop(0.055, 'rgba(216,238,250,0.55)');
  pgh.addColorStop(0.17,  'rgba(26,40,52,0.15)');
  pgh.addColorStop(0.40,  'rgba(255,255,255,0.44)');
  pgh.addColorStop(0.60,  'rgba(255,255,255,0.05)');
  pgh.addColorStop(0.89,  'rgba(26,40,52,0.26)');
  pgh.addColorStop(0.955, 'rgba(198,228,246,0.50)');
  pgh.addColorStop(1,     'rgba(18,30,40,0.62)');
  ctx.fillStyle = pgh; ctx.fillRect(nx - pw/2, plY, pw, H - plY);
  // the crown's own light pours down inside the column and fades out
  const pgl = ctx.createLinearGradient(0, plY, 0, plY + (H - plY) * 0.6);
  pgl.addColorStop(0, 'rgba(150,220,255,0.40)');
  pgl.addColorStop(1, 'rgba(150,220,255,0)');
  ctx.fillStyle = pgl; ctx.fillRect(nx - pw/2, plY, pw, (H - plY) * 0.6);
  // the top is a slab of glass with real thickness — underside, then the edge
  // that runs round it and catches the light, then the face
  const capRx = pw * 0.56, capRy = 13 * kn * SS, capT = 10 * kn * SS;
  ctx.fillStyle = 'rgba(139,160,175,0.95)';
  ctx.beginPath(); ctx.ellipse(nx, plY + capT, capRx, capRy, 0, 0, 7); ctx.fill();
  const eg = ctx.createLinearGradient(nx - capRx, 0, nx + capRx, 0);
  eg.addColorStop(0,    'rgba(28,42,55,0.60)');
  eg.addColorStop(0.10, 'rgba(206,232,247,0.62)');
  eg.addColorStop(0.36, 'rgba(255,255,255,0.60)');
  eg.addColorStop(0.72, 'rgba(198,224,240,0.28)');
  eg.addColorStop(0.94, 'rgba(206,232,247,0.55)');
  eg.addColorStop(1,    'rgba(24,36,48,0.62)');
  ctx.fillStyle = eg;
  ctx.fillRect(nx - capRx, plY, capRx * 2, capT);
  ctx.fillStyle = 'rgba(238,249,255,0.96)';
  ctx.beginPath(); ctx.ellipse(nx, plY, capRx, capRy, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 1.3 * SS;
  ctx.beginPath(); ctx.ellipse(nx, plY, capRx, capRy, 0, 0, 7); ctx.stroke();
  /* A display set into the pedestal, dead on the line the caption runs along.
     It is NOT a marquee: the words inside it stand exactly where the painted
     words stand on the panel behind — same face, same size, same centre. The
     window belongs to the column and travels with it, the sentence belongs to
     the wall and stays put, so the movement you see is the column sliding
     across a line that never moves. Paint, then light, then paint again. */
  if (ease > 0.15){
    const stripY = py(730, kk), sh2 = 19 * kn * SS;
    const iw = pw - 34 * kn * SS;              // air at both sides: it is set INTO the column
    const R = (iw / 2) * 1.18;                 // the cylinder it is wrapped around
    // the line as it is written on the wall, rendered flat once
    const ow2 = Math.ceil(W), oh2 = Math.ceil(sh2) + 2;
    if (!state.rec2Strip || state.rec2Strip.width !== ow2 || state.rec2Strip.height !== oh2){
      state.rec2Strip = document.createElement('canvas');
      state.rec2Strip.width = ow2; state.rec2Strip.height = oh2;
    }
    const gs = state.rec2Strip.getContext('2d');
    gs.clearRect(0, 0, ow2, oh2);
    gs.textAlign = 'center';
    gs.font = eraFont(20 * kk * SS, '700', SEGMENTS[3].font);
    try { gs.letterSpacing = `${5*kk*SS}px`; } catch(e){}
    gs.fillStyle = `rgba(150,228,255,${(0.60 + 0.4 * ease).toFixed(3)})`;
    gs.fillText('SCANNED \u00b7 DESIGNED \u00b7 MILLED', cx, oh2 * 0.72);
    ctx.save();
    // the recess, its edges curved by the barrel of the column
    const yTopC = stripY - sh2/2, yBotC = stripY + sh2/2, bow = 3.2 * kn * SS;
    ctx.beginPath();
    ctx.moveTo(nx - iw/2, yTopC);
    ctx.quadraticCurveTo(nx, yTopC + bow, nx + iw/2, yTopC);
    ctx.lineTo(nx + iw/2, yBotC);
    ctx.quadraticCurveTo(nx, yBotC + bow, nx - iw/2, yBotC);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#0b1216';
    ctx.fillRect(nx - iw/2, yTopC - 2, iw, sh2 + 6);
    // re-lay the flat line onto the barrel: a slice at screen x reads the line
    // at the arc distance that lands there, so letters crowd toward the edges
    const step = Math.max(1, Math.round(1.5 * SS));
    for (let x = -iw/2; x < iw/2; x += step){
      const u = Math.max(-0.999, Math.min(0.999, x / R));
      const s = R * Math.asin(u);
      // the frame's edge is a quadratic Bezier with its control point at `bow`,
      // and such a curve only reaches HALF of it at the middle — the letters
      // were sagging twice as far as the glass they sit behind
      const sag = bow * 0.5 * (1 - (x / (iw/2)) * (x / (iw/2)));
      ctx.drawImage(state.rec2Strip,
                    Math.round(nx + s), 0, step + 1, oh2,
                    Math.round(nx + x), yTopC + sag - 1, step + 1, oh2);
    }
    // the glass, brighter along the crown of the barrel
    const sg2 = ctx.createLinearGradient(nx - iw/2, 0, nx + iw/2, 0);
    sg2.addColorStop(0, 'rgba(0,0,0,0.34)');
    sg2.addColorStop(0.42, 'rgba(255,255,255,0.10)');
    sg2.addColorStop(0.58, 'rgba(255,255,255,0.06)');
    sg2.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = sg2; ctx.fillRect(nx - iw/2, yTopC - 2, iw, sh2 + 6);
    ctx.restore();
    // the bezel, and the light it spills onto the column
    ctx.strokeStyle = `rgba(210,240,255,${(0.22 + 0.18 * ease).toFixed(3)})`;
    ctx.lineWidth = 1.2 * SS;
    ctx.beginPath();
    ctx.moveTo(nx - iw/2, yTopC); ctx.quadraticCurveTo(nx, yTopC + bow, nx + iw/2, yTopC);
    ctx.moveTo(nx - iw/2, yBotC); ctx.quadraticCurveTo(nx, yBotC + bow, nx + iw/2, yBotC);
    ctx.stroke();
    drawGlow('120,215,255', nx, stripY, pw * 1.5, 0.10 + 0.18 * ease);
  }
  drawGlow('225,245,255', nx, ny, cw * 1.5, 0.22 + 0.25 * ease);
  ctx.drawImage(spm.c, nx - cw/2, ny - chh/2, cw, chh);
  // the scanner crosses in FRONT of that crown, and goes out once you pass it
  const bLive = Math.max(0, 1 - Math.max(0, cam.x - mid) / 240);
  if (bLive > 0.01 && ease > 0.02)
    drawScanBeam(nx, ny, cw, chh, kn, scanPhase(mid), bLive * (0.3 + 0.7 * ease));
  pushHit(nx - cw/2, ny - chh/2, cw, chh,
          {type: 'focus', beat: nearestBeat(mid).i, anchor: mid});
}

/* How far the scanner has got: it cuts as you come in and is finished exactly
   at the alignment; once you are past, it stays finished rather than undoing
   itself, because the file has been made and a made file does not unmake. */
function scanPhase(mid){
  const d = cam.x - mid;
  if (d >= 0) return 1;
  const u = Math.max(0, Math.min(1, 1 + d / 900));
  return u * u * (3 - 2 * u);
}

function drawRec2(t){
  const mid = (REC2_L + REC2_R) / 2;
  if (Math.abs(cam.x - mid) > 2800) return;
  const lock0 = Math.max(0, 1 - Math.abs(cam.x - mid) / 900);
  const ease0 = lock0 * lock0 * (3 - 2 * lock0);
  const kk = k(970);
  const yBase = py(CFG.benchY + 240, k(CFG.benchDepth));
  const x0 = px(REC2_L, kk), x1 = px(REC2_R, kk);
  // the luminous panel
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#dfe5ea');
  wg.addColorStop(0.45, '#f2f6f9');
  wg.addColorStop(1, '#c2c9cf');
  ctx.fillStyle = wg;
  ctx.fillRect(x0, 0, x1 - x0, yBase);
  // a dark display niche, and the crown glowing inside it
  const sp = PED_SPRITES.crown2;
  const w = 360 * kk * SS, h = w * sp.h / sp.w;
  const cx = px(mid, kk), cyS = py(400, kk);
  const nw = 600 * kk * SS, nh = 560 * kk * SS;
  const ng = ctx.createLinearGradient(0, cyS - nh/2, 0, cyS + nh/2);
  ng.addColorStop(0, '#1f242b'); ng.addColorStop(1, '#2c333c');
  ctx.fillStyle = ng;
  ctx.beginPath(); ctx.roundRect(cx - nw/2, cyS - nh/2, nw, nh, 10*SS); ctx.fill();
  drawGlow('160,220,255', cx, cyS, w * 1.15, 0.45);
  // the back plane holds the SCAN: measured points, not yet an object
  const ws = 499 * kk * SS, hs = ws * sp.h / sp.w;
  drawCrownScan(cx, cyS, ws, 1);
  // THE MOMENT OF ALIGNMENT: when the three states lock, the form the points
  // have only been describing flares into being for an instant — the data
  // becomes the object, once, and then the room settles back
  if (!state.rec2) state.rec2 = {fired: false, t0: -9, prev: null};
  const dxm = cam.x - mid;
  const crossed = state.rec2.prev != null && state.rec2.prev !== 0 &&
                  Math.sign(state.rec2.prev) !== Math.sign(dxm);
  if (!state.rec2.fired && (crossed || Math.abs(dxm) < 6)){
    state.rec2.fired = true; state.rec2.t0 = t;
  }
  if (Math.abs(dxm) > 320) state.rec2.fired = false;   // re-armed once you leave
  state.rec2.prev = dxm;
  const fl = Math.max(0, 1 - (t - state.rec2.t0) / 0.75);
  if (fl > 0.001){
    const f = fl * fl;
    drawGlow('200,242,255', cx, cyS, ws * 2.4, 0.55 * f);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9 * f;
    ctx.drawImage(sp.c, cx - ws/2, cyS - hs/2, ws, hs);
    ctx.restore();
    // and the panel itself takes the light for that instant
    ctx.fillStyle = `rgba(215,245,255,${(0.16 * f).toFixed(3)})`;
    ctx.fillRect(x0, 0, x1 - x0, yBase);
  }
  pushHit(cx - w/2, cyS - h/2, w, h, {type:'photo', sp: Object.assign({inner:{w:sp.w,h:sp.h}}, sp),
          wx: mid, cy: 400, z: 968, w: 360, cap: '2009 · the digital revolution',
          beat: BEATS.findIndex(b => b.t === 'BRUXZIR')});
  const ease = ease0;

  // the three states name themselves on the panel itself, which means the
  // pilasters stand in front of the words — see the strip on the column below
  if (ease > 0.15){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(20 * kk * SS, '700', SEGMENTS[3].font);
    try { ctx.letterSpacing = `${5*kk*SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(70,110,135,${(0.75 * ease).toFixed(3)})`;
    ctx.fillText('SCANNED \u00b7 DESIGNED \u00b7 MILLED', cx, py(730, kk));
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.restore();
  }

  // THE FILE — it descends from above as you arrive, on its own suspension
  {
    const kf = k(500), fw = 311 * kf * SS;
    const fx = px(mid, kf);
    const rest = py(408, kf), from = py(408, kf) - 260 * kf * SS;
    const fy = rest + (from - rest) * (1 - ease);
    ctx.strokeStyle = `rgba(150,210,235,${(0.25 * ease).toFixed(3)})`;
    ctx.lineWidth = 1 * SS;
    ctx.beginPath(); ctx.moveTo(fx, 0); ctx.lineTo(fx, fy - fw * 0.5); ctx.stroke();
    drawCrownFile(fx, fy, fw, 0.25 + 0.75 * ease, scanPhase(mid));
  }

  // the inscription crowns the panel: the plinth in front of it owns the
  // lower centre, so the title cannot live down there
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(34 * kk * SS, '', SEGMENTS[3].font);
  try { ctx.letterSpacing = `${8*kk*SS}px`; } catch(e){}
  ctx.fillStyle = 'rgba(58,68,80,0.85)';
  ctx.fillText('THE DIGITAL REVOLUTION', cx, py(60, kk));
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.font = eraFont(27 * kk * SS, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(66,76,88,0.95)';
  ctx.fillText('the impression becomes a scan \u00b7 the crown becomes a file', cx, py(100, kk));
  // era markers on the panel shoulders: inside the panel, clear of the columns
  ctx.font = eraFont(24 * kk * SS, '700', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(110,120,132,0.7)';
  ctx.textAlign = 'left';
  ctx.fillText('\u2190 THE ANALOG CENTURY', x0 + 100*kk*SS, py(800, kk));
  ctx.textAlign = 'right';

/* crown-ish lathe mesh for the wireframe / point cloud */
const MESH = (() => {
  // a molar crown, not a vase: the lathe profile is modulated per meridian —
  // a superellipse plan (rounded-square, like a real molar footprint), four
  // cusps lifting the occlusal rim, and a pole kept low as the central fossa
  const prof = [[0,44],[27,58],[42,50],[47,28],[48,2],[45,-24],[38,-46],[24,-60],[0,-64]];
  const M = 16, rings = [];
  for (let m = 0; m < M; m++){
    const a = m/M * Math.PI*2;
    const sq = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 3) + Math.pow(Math.abs(Math.sin(a)), 3), 1/3);
    const cusp = Math.pow(Math.cos(2*a + Math.PI/4), 2);
    const ring = [];
    for (let p = 0; p < prof.length; p++){
      let r = prof[p][0], y = prof[p][1];
      r *= 0.88 + 0.14*sq;
      if (p === 1) y += 7*cusp - 3;
      ring.push([r*Math.cos(a), -y, r*Math.sin(a)]);
    }
    rings.push(ring);
  }
  return {rings, M, P: prof.length};
})();
function projMesh(rot){
  const out = [];
  const ca = Math.cos(rot), sa = Math.sin(rot);
  for (const ring of MESH.rings){
    const pr = [];
    for (const [x,y,z] of ring){
      const rx = x*ca - z*sa, rz = x*sa + z*ca;
      const pp = 1 / (1 + rz/420);
      pr.push([rx*pp, y*pp + rz*0.06, rz]);
    }
    out.push(pr);
  }
  return out;
}
function drawScreenCAD(g, r, t, amber){
  // phosphor wireframe crown, slowly turning — green or amber
  const dim = amber ? 'rgba(160,120,40,0.25)' : 'rgba(70,160,110,0.25)';
  g.fillStyle = amber ? '#130d04' : '#06130a'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = dim; g.lineWidth = 1;
  for (let i = 1; i < 6; i++){ // faint grid
    g.beginPath(); g.moveTo(r.x, r.y + r.h*i/6); g.lineTo(r.x + r.w, r.y + r.h*i/6); g.stroke();
    g.beginPath(); g.moveTo(r.x + r.w*i/6, r.y); g.lineTo(r.x + r.w*i/6, r.y + r.h); g.stroke();
  }
  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(t*0.5);
  g.lineWidth = Math.max(1, s*1.1);
  for (let m = 0; m < MESH.M; m++){
    const a = pts[m], b = pts[(m+1) % MESH.M];
    for (let p = 0; p < MESH.P; p++){
      const depth = (a[p][2] + 70) / 140;   // 0 near .. 1 far
      g.strokeStyle = `rgba(${amber ? '255,190,90' : '120,235,160'},${(0.75 - 0.55*depth).toFixed(2)})`;
      if (p < MESH.P-1){
        g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);
        g.lineTo(cx + a[p+1][0]*s, cy + a[p+1][1]*s); g.stroke();
      }
      g.beginPath(); g.moveTo(cx + a[p][0]*s, cy + a[p][1]*s);
      g.lineTo(cx + b[p][0]*s, cy + b[p][1]*s); g.stroke();
    }
  }
  g.fillStyle = amber ? 'rgba(255,205,120,0.85)' : 'rgba(140,240,175,0.85)';
  g.font = `${Math.max(8, 9*s)}px monospace`;
  g.textAlign = 'left';
  g.fillText(amber ? 'Glidewell · chairside' : 'CAD · crown 14 · milling queue', r.x + 8*s, r.y + r.h - 8*s);
  // scanlines

function drawScreenScan(g, r, t){
  // blue point-cloud of an intraoral scan arriving
  g.fillStyle = '#060a12'; g.fillRect(r.x, r.y, r.w, r.h);
  const cx = r.x + r.w/2, cy = r.y + r.h/2 + r.h*0.04, s = r.h/170;
  const pts = projMesh(-t*0.35);
  const reveal = (t*0.13) % 1.25;           // cloud keeps re-assembling
  let n = 0, total = MESH.M * MESH.P;
  for (let m = 0; m < MESH.M; m++){
    for (let p = 0; p < MESH.P; p++){
      n++;
      if (n/total > reveal) break;
      const q = pts[m][p];
      const depth = (q[2] + 70) / 140;
      g.fillStyle = `rgba(110,190,255,${(0.9 - 0.6*depth).toFixed(2)})`;
      g.fillRect(cx + q[0]*s, cy + q[1]*s, Math.max(1, 1.6*s*(1-depth*0.5)), Math.max(1, 1.6*s*(1-depth*0.5)));
    }

  g.fillStyle = 'rgba(140,200,255,0.85)';
  g.font = `${Math.max(8, 9*s)}px monospace`;
  g.textAlign = 'left';

}
function drawMonitor(p, x, z, wWorld, t){
  const mon = MONS[p.kind]; if (!mon) return;
  const kk = k(z);
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / mon.w) * kk * SS;
  const syFoot = py(CFG.benchY - 2, kk);
  const dx = sx - mon.w*scale/2, dy = syFoot - mon.foot*scale;
  pushHit(dx, dy, mon.w*scale, mon.h*scale, {type:'focus', beat: BEATS.findIndex(bb => (bb.props||[]).includes(p)), anchor: x});
  ctx.drawImage(mon.c, dx, dy, mon.w*scale, mon.h*scale);
  if (p.label){
    const segL = segAt(x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.round(17*kk*SS)}px ${segL.font}`;
    try { ctx.letterSpacing = `${4*kk*SS}px`; } catch(e){}
    ctx.fillStyle = `rgba(${segL.ink},0.6)`;
    ctx.fillText(p.label, sx, syFoot + 34*kk*SS);
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.restore();
  }
  // live screen
  const r = {x: dx + mon.screen.x*scale, y: dy + mon.screen.y*scale,
             w: mon.screen.w*scale, h: mon.screen.h*scale};
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  if (p.kind === 'crt') drawScreenCAD(ctx, r, t, p.col === 'amber'); else drawScreenScan(ctx, r, t);
  ctx.restore();
  // screen light spills into the room
  const glow = p.kind === 'crt' ? (p.col === 'amber' ? '235,170,80' : '110,220,150') : '110,180,255';
  const flick = 0.8 + 0.2*Math.sin(t*9 + x);
  drawGlow(glow, r.x + r.w/2, r.y + r.h/2, r.w*1.6, 0.10*flick);
}

const PROPS = [], SHEETS = [], FIGURES = [];
/* PHOTO SKIN (pilot) — real photographed artifacts replace the drawn
   placeholders when the page runs with ?skin=photo. Assets live in
   assets/photo/ (see SKIN_SPEC.md); each is a neutral-lit cutout that the
   engine lights and shades itself. Same slots, same physics, same audits. */
// the photographed hall IS the hall now; ?skin=flat brings back the drawn one
const PHOTO_SKIN = !/[?&]skin=flat/.test(location.search);

/* SCENE PLATES — a fully generated frame of the hall dropped between beats.
   A plate is a matte painting: flat, one depth, so everything inside it moves
   at a single parallax rate. Hung on the open wall it would shear against the
   procedural room; set BACK at the wall's own depth it reads as a recessed
   alcove — the reveal at its edges explains the step in the counter line, and
   the hall's bench passes in front of it the way a real counter passes a niche.
   Data-driven: drop a file in assets/photo/ and add one row. */
/* A plate may be cut into depth layers. The trick is that layers share a
   SCREEN width, not a world width: a band at depth z is given world width
   sw/k(z), so it projects back to exactly sw and the bands stay glued when the
   camera is centred — but each then travels at its own parallax rate, the wall
   with the masonry and the counter with the bench.

   The catch, and it decides how the plate must be generated: anything BAKED on
   the counter travels with whichever band it was cut into. Objects sitting on
   the counter belong to neither band, so with a baked still life they slide
   along the counter as you scroll — the exact artefact the rivet law exists to
   prevent. So: a layered plate must be generated EMPTY (wall, counter and
   cabinets only) and carry its objects as sprites in `props`, which stand at
   their own depth and can be lit and clicked like everything else in the hall.
   A plate WITH objects baked in must stay single-layer (`layers` omitted):
   flat, at wall depth, where nothing inside it can slide against anything. */
/* The founding bench, whole. Its scale is not chosen by eye: the counter's own
   top surface — from where the wall meets it to its front edge — is made to
   match the hall's, 71 px of photograph onto 74 px of room. Front edge to front
   edge, back edge to the wall; everything else then follows, and the picture
   comes out a fifth smaller than it was. */
const PLATES = GAP.on ? [{
  x: bayStart(1) + CUTS[1].w / 2, sw: 1874, benchFrac: 0.611,
  layers: [{img: 'plate_bay_front.png', z: 0}],
}] : [];
async function loadPlates(){
  const jobs = [];
  for (const p of PLATES)
    for (const L of (p.layers || [{img: p.img, z: p.z}]))
      jobs.push(new Promise(res => {
        const tryLoad = (bust) => {
          const im = new Image();
          im.onload = () => { L.sp = im; res(); };
          im.onerror = () => {
            if (!bust) return tryLoad(true);          // a cached miss deserves one retry
            console.error('plate layer missing:', L.img, '— the bench will not appear');
            L.sp = null; res();
          };
          im.src = vurl('assets/photo/' + L.img) + (bust ? '&r=' + Date.now() : '');
        };
        tryLoad(false);
      }));
  await Promise.all(jobs);
  for (const p of PLATES) p.layers = (p.layers || []).filter(L => L.sp);
}
/* drawn straight after the bench, so the plate's own counter and cabinets
   stand in for the procedural ones inside the niche */
/* A plate owns its bay: the hall's ambient furniture — bench props, pinned
   sheets, passers-by — must not stand inside the picture it brings, or they
   read as junk floating over someone's workbench. Culled at boot, by data. */
function snapPlatesToTables(){
  for (const p of PLATES){
    const half = (p.sw || 1390) / 2;
    const left = p.x - half;
    let best = null, bd = 1e9;
    for (const tb of TABLES) for (const e of [tb.x0, tb.x1]){
      const d = Math.abs(e - left);
      if (d < bd){ bd = d; best = e; }
    }
    if (best != null && bd < 260){
      p.x += best - left;                       // butt the picture onto that edge
      if (DBG) console.log(`plate snapped ${bd.toFixed(0)} units to the table edge at ${best}`);
    }
  }
}
function clearPlateBays(){
  // a plate owns its bay, and so does a piece of furniture: nothing of the
  // hall's own scatter may stand inside either, or a pinned sheet ends up
  // glued to the face of a cabinet
  const bays = PLATES.map(p => {
    const half = (p.sw || 1390) / 2 + 40;      // world units at the bench plane
    return [p.x - half, p.x + half];
  });
  for (const u of TALL_UNITS) bays.push([u.x - u.w / 2 - 150, u.x + u.w / 2 + 150]);
  // and the bays the cuts opened, whole: they exist for one composition each
  for (let i = 0; i < CUTS.length; i++)
    if (CUTS[i].on) bays.push([bayStart(i), bayStart(i) + CUTS[i].w]);
  if (!bays.length) return;
  const inBay = x => bays.some(([a, b]) => x > a && x < b);
  for (let i = PROPS.length - 1; i >= 0; i--) if (inBay(PROPS[i].x)) PROPS.splice(i, 1);
  // a sheet is cleared if any part of it reaches into the bay, not merely its pin
  for (let i = SHEETS.length - 1; i >= 0; i--){
    const s = SHEETS[i], hw = (s.w || 160) * 0.6;
    if (inBay(s.x) || inBay(s.x - hw) || inBay(s.x + hw)) SHEETS.splice(i, 1);
  }
  for (let i = FIGURES.length - 1; i >= 0; i--) if (inBay(FIGURES[i].x)) FIGURES.splice(i, 1);
  for (let i = FG_ITEMS.length - 1; i >= 0; i--) if (inBay(FG_ITEMS[i].x)) FG_ITEMS.splice(i, 1);
}

function drawPlates(t){
  for (const p of PLATES){
    const layers = p.layers || [];
    if (!layers.length) continue;
    const seg = segAt(p.x);
    const wallZ = seg.z0 || 550;
    const sw = (p.sw || 1390) * SS;              // screen width — shared by every layer,
    const ref = layers[0].sp;                    // which is what keeps them glued when centred
    const sh = sw * ref.naturalHeight / ref.naturalWidth;
    const bf = p.benchFrac || 0.666;
    // the counter line lands on the hall's own bench line, so the plate's
    // counter continues the hall's counter instead of stepping away from it
    const frontZ = layers[layers.length - 1].z ?? wallZ;
    const y0 = py(CFG.benchY, k(frontZ)) - sh * bf;
    const fade = 0.05;
    for (const L of layers){
      const z = L.z != null ? L.z : wallZ;
      const kk = k(z);
      const sx = px(p.x, kk);
      if (sx < -sw || sx > W + sw) continue;
      const ow = Math.max(8, Math.round(sw)), oh = Math.max(8, Math.round(sh));
      if (!L.sheet || L.sheet.width !== ow || L.sheet.height !== oh){
        L.sheet = document.createElement('canvas');
        L.sheet.width = ow; L.sheet.height = oh;
        const g2 = L.sheet.getContext('2d');
        g2.drawImage(L.sp, 0, 0, ow, oh);
        // the join is a butt joint: both sides are the same material now, so
        // only a hair of blend is needed to kill the aliasing on the cut
        // no feather: this is an object standing on a counter, not a second
        // counter laid over the first — it has edges, not seams
        void fade;
      }
      ctx.drawImage(L.sheet, sx - sw/2, y0);
      // no reveal, no jamb shadow: a niche needs them, a counter that simply
      // continues the hall's own counter must not announce itself at all
    }
    // sprites standing on the plate's counter — they live at their own depth,
    // so they never slide against the surface they stand on
    for (const it of (p.props || [])){
      const sp = PROP_SPRITES[it.kind]; if (!sp) continue;
      const kk = k(it.z);
      const sx = px(p.x + it.dx, kk);
      const scale = (it.w / sp.w) * kk * SS;
      ctx.drawImage(sp.c, sx - sp.w*scale/2, py(CFG.benchY - 2, kk) - sp.h*scale,
                    sp.w*scale, sp.h*scale);
    }
  }
}
const PHOTO_TEX = {};
/* the skin's files are re-cut under the same names as the room is tuned, so a
   browser that has already seen one keeps serving it back; every photo asset
   carries the build stamp and a new cut is fetched the moment it exists */
const ASSET_V = '20260821-1930';
const vurl = p => p + (p.includes('?') ? '&' : '?') + 'v=' + ASSET_V;
/* the procedural era walls (tools/make_wall.py) stand in for the drawn ones —
   same slot, same tiling, so drawWall never learns the difference */
/* the wall changes material inside era 1: dark boards for the analog century,
   the 1970 lab's sprayed plaster from the bench onward */
function wallSwitchX(){
  // the analog century keeps the dark boards; the 1970 lab's plaster starts
  // ahead of the founding pedestal, so that pedestal stands against the new
  // wall rather than on the threshold of it
  const u = TALL_UNITS[0];
  // the bank is made of the craft era's own wood, so it stands ON the dark
  // wall and the plaster begins at its far edge
  return u ? u.x + u.w / 2 : bayStart(0);
}
function applyPhotoTextures(){
  TEX.wall1_dark = TEX.wall1;          // kept for the years before the 1970 bench
  for (const [slot, key] of [['wall1','wall_e1'], ['wall2','wall_e2'], ['wall3','wall_e3'], ['wall4','wall_e4'],
                             ['bench1','bench_top_e1'], ['front1','bench_face_e1']])
    if (PHOTO_TEX[key]) TEX[slot] = PHOTO_TEX[key];
}
async function loadPhotoSkin(){
  const want = {
    wall_e1: 'wall_e1.jpg', wall_e2: 'wall_e2.jpg', wall_e3: 'wall_e3.jpg', wall_e4: 'wall_e4.jpg',
    bench_top_e1: 'bench_top_e1.jpg', bench_face_e1: 'bench_face_e1.jpg',
    ph_furnace: 'furnace_0.png',
    ph_articulator: 'articulator_0.png',
    ph_jars: 'jars_0.png',
    ph_polisher: 'polisher_0.png',
    ph_tray34: 'tray_2.png',
    ph_crate: 'crate_0.png',
  };
  await Promise.all(Object.entries(want).map(([key, file]) => new Promise(res => {
    const im = new Image();
    im.onload = () => {
      PHOTO_TEX[key] = im;
      PROP_SPRITES[key] = {c: im, w: im.naturalWidth, h: im.naturalHeight};
      res();
    };
    im.onerror = () => { console.error('photo skin: missing asset', file); res(); };
    im.src = vurl('assets/photo/' + file);
  })));
}
function initDecor(){
  for (const kind of ['jar','plaster','toolbox','mailtray','box','papers','crtOff','mill','palmNear','jaw1','jaw2','gradcap'])
    PROP_SPRITES[kind] = makeProp(kind);
  const eraProps = [['jar','jaw1','toolbox','plaster','jaw1'], ['mailtray','jaw1','box','plaster'], ['papers','jaw2','crtOff','jaw2'], ['jaw2','papers']];
  const R = rng(20260819);
  // bench props between beats
  for (let si = 0; si < SEGMENTS.length; si++){
    const s = SEGMENTS[si];
    const bx0 = (s.x0 <= -2500 && !s.bInsetL) ? s.x0 : s.x0 + (s.bInsetL || 140);
    const bx1 = (s.x1 >= WORLD_END + 800 && !s.bInsetR) ? s.x1 : s.x1 - (s.bInsetR || 140);
    const a = Math.max(700, bx0 + 250), b = Math.min(WORLD_END - 300, bx1 - 250);
    for (let x = a; x < b; x += 260 + R()*260){
      if (!eraProps[si].length) break;
      if (BEATS.some(bt => Math.abs(bt.x - x) < 430)) continue;
      if (BENCH_BREAKS.some(v => Math.abs(v.x - x) < v.half + 130)) continue;
      const kinds = eraProps[si];
      PROPS.push({x, z: 45 + R()*60, kind: kinds[(R()*kinds.length)|0],
                  w: 95 + R()*60, flip: R() > 0.5});
    }
    // pinned sheets between beats (not in the white room)
    for (let x = a + 300; si < 3 && x < b; x += 620 + R()*480){
      if (BEATS.some(bt => Math.abs(bt.x - x) < 560)) continue;
      SHEETS.push({x, cy: 210 + R()*230, era: si, rot: (R()-0.5)*7,
                   w: 130 + R()*60, sprite: makeSheet(si, (x|0))});
    }
  }
  // mid-ground people & machines (the wall is far enough now)
  FIGURES.push({x: SHIFT(16460), z: 560, h: 700, sprite: makeFigure(7)});         // ~2000 · the CAD operator
  // mills receding behind the factory line
  // the graduates' mortarboard behind the alumnae portraits
  PROPS.push({x: SHIFT(25640), z: 245, kind: 'gradcap', w: 165});

  // the welcome still life — placeholder heirlooms of the craft century
  // a tight triangle: the cast jaw is the hero dead under the title,
  // the toolbox and the plaster molds are its shoulders
  if (PHOTO_SKIN && PROP_SPRITES.ph_articulator){
    // the real heirlooms: kiln — articulator with the cast jaws — powder jars
    PROPS.push({x: INTRO_X - 170, z: 110, kind: 'ph_furnace', w: 112});
    PROPS.push({x: INTRO_X - 5,   z: 45,  kind: 'ph_articulator', w: 118});
    PROPS.push({x: INTRO_X + 160, z: 85,  kind: 'ph_jars', w: 150});
  } else {
    PROPS.push({x: INTRO_X - 155, z: 105, kind: 'toolbox', w: 165});
    PROPS.push({x: INTRO_X - 5,   z: 45,  kind: 'jaw1', w: 135});
    PROPS.push({x: INTRO_X + 150, z: 80, kind: 'plaster', w: 160, flip: true});
  }
  // one line, one depth: two mills standing at different z drifted against each
  // other and against the arms, and the whole bank stopped reading as one machine
  PROPS.push({x: FACT_X - 120, z: 340, kind: 'mill', w: 470, mid: true});
  PROPS.push({x: FACT_X + 330, z: 340, kind: 'mill', w: 440, mid: true});
  // the symposium audience at the finale — spaced so the stage stays visible
  const AUD = [[SHIFT(28960), 390, 640], [SHIFT(29060), 470, 615], [SHIFT(29120), 300, 660]];
  AUD.forEach(([ax, az, ah], i) => FIGURES.push({x: ax, z: az, h: ah, sprite: makeFigure(60 + i)}));

  // ambient props obey gravity too: full footprint on a real table span,
  // or they leave the hall (background décor is optional, levitation is not)
  for (let i = PROPS.length - 1; i >= 0; i--){
    const p = PROPS[i];
    if (p.mid) continue;                       // floor machines stand on the floor
    const half = (p.w || 120) * 0.5 + 16;
    if (TABLES.some(tb => p.x - half >= tb.x0 + 14 && p.x + half <= tb.x1 - 14)) continue;
    let best = null, bestD = 1e9;
    for (const tb of TABLES){
      if (tb.x1 - tb.x0 < half*2 + 40) continue;
      const cx = Math.max(tb.x0 + 14 + half, Math.min(tb.x1 - 14 - half, p.x));
      const d = Math.abs(cx - p.x);
      if (d < bestD){ bestD = d; best = cx; }
    }
    if (best != null && bestD < 260) p.x = best;
    else PROPS.splice(i, 1);
  }

  JIM_FIG = makeFigure(99);
  BOOK_SPRITE = makeBookPyramid();
  BOOK_CARD = makeBookCard();
  for (let v = 0; v < 3; v++){
    FG_SPRITES['plant' + v] = makeFgSprite('plant', v);
    FG_SPRITES['person' + v] = makeFgSprite('person', v + 7);
  }
  FIGURES.sort((f1, f2) => f2.z - f1.z);
  auditPlacements();
}

/* Every important camera moment is a guarded zone. Anything from the near or
   mid plane that would sit across it gets moved or removed — checked in code,
   not by eye, so new content can never reintroduce the collision. */
function auditPlacements(){
  const guards = [];
  for (const b of BEATS){
    if (b.ped){
      const pedX = b.x + (b.ped.dx ?? -430);
      guards.push({c: pedX, r: 750, pedX, pedZ: -90});
    }
    if (!b.minor) guards.push({c: b.x, r: 420});
  }
  // near plane: a passer-by parks at screen center when cam ≈ its x
  for (let i = FG_ITEMS.length - 1; i >= 0; i--){
    if (guards.some(g => Math.abs(FG_ITEMS[i].x - g.c) < g.r * 1.3)){
      console.warn('audit: foreground item removed at', FG_ITEMS[i].x);
      FG_ITEMS.splice(i, 1);
    }
  }
  // mid plane: a figure crosses a pedestal or a wall photo on screen at one
  // camera position — that position must stay outside the guarded window
  const kOf = z => 900 / (900 + z);
  const crossTargets = guards.filter(g => g.pedX)
    .map(g => ({x: g.pedX, z: g.pedZ, c: g.c, r: g.r}));
  for (const b of BEATS)
    for (const it of b.wall)
      crossTargets.push({x: b.x + it.dx, z: it.pz != null ? it.pz : wallZAt(b.x) - 8, c: b.x, r: 520});
  for (const f of FIGURES){
    for (const g of crossTargets){
      const kP = kOf(g.z), kF = kOf(f.z);
      if (Math.abs(kP - kF) < 0.05){
        // near-same depth: they simply must not overlap in world space —
        // and they step aside on their own side, never marching across the hall
        const dirN = f.x >= g.x ? 1 : -1;
        for (let tries = 0; tries < 10 && Math.abs(f.x - g.x) < 430; tries++) f.x += 240 * dirN;
        continue;
      }
      const dirC = f.x >= g.c ? 1 : -1;
      for (let tries = 0; tries < 10; tries++){
        const cross = (g.x * kP - f.x * kF) / (kP - kF);
        if (Math.abs(cross - g.c) > g.r * 1.05) break;
        f.x += 240 * dirC;
        if (tries === 9) console.warn('audit: figure could not fully clear target near', g.x);
      }
    }
  }
}
function drawSheets(){
  for (const sh of SHEETS){
    if (Math.abs(sh.x - cam.x) > 3200) continue;
    const kk = k(wallZAt(sh.x) - 10);
    const sx = px(sh.x, kk);
    if (sx < -300 || sx > W + 300) continue;
    const scale = (sh.w / sh.sprite.w) * kk * SS;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(sx, py(sh.cy, kk));
    ctx.rotate(sh.rot * Math.PI/180);
    ctx.drawImage(sh.sprite.c, -sh.sprite.w*scale/2, -sh.sprite.h*scale/2,
                  sh.sprite.w*scale, sh.sprite.h*scale);
    ctx.restore();
  }
}
function drawFigures(){
  for (const f of FIGURES){
    if (Math.abs(f.x - cam.x) > 2200) continue;
    const kk = k(f.z);
    const sx = px(f.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (f.h / f.sprite.h) * kk * SS;
    const syFoot = py(f.seated ? 900 : 1080, kk);
    ctx.globalAlpha = 0.92;
    ctx.drawImage(f.sprite.c, sx - f.sprite.w*scale/2, syFoot - f.sprite.h*scale,
                  f.sprite.w*scale, f.sprite.h*scale);
    ctx.globalAlpha = 1;
  }
}
function drawProps(midPass){
  for (const p of PROPS){
    if ((!!p.mid) !== !!midPass) continue;
    if (Math.abs(p.x - cam.x) > 2200) continue;
    const sp = PROP_SPRITES[p.kind];
    const kk = k(p.z);
    const sx = px(p.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (p.w / sp.w) * kk * SS;
    const syFoot = p.mid ? py(1080, kk) : py(CFG.benchY - 2, kk);
    ctx.save();
    if (p.flip){ ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    ctx.globalAlpha = 0.95;
    ctx.drawImage(sp.c, sx - sp.w*scale/2, syFoot - sp.h*scale, sp.w*scale, sp.h*scale);
    ctx.restore();
  }
}

/* ---------------- ALBUMS · books that open when you stop ---------------- */
const ALBUM_SPRITES = {};   // beat index -> {cover, spreads:[canvas]}
const albumAnim = {};       // beat index -> 0..1 open amount
function makeAlbumCover(title, era){
  const c = document.createElement('canvas'); c.width = 420; c.height = 300;
  const g = c.getContext('2d');
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 16; g.shadowOffsetY = 8;
  const lg = g.createLinearGradient(0, 0, 420, 300);
  lg.addColorStop(0, '#4a2018'); lg.addColorStop(.5, '#31130d'); lg.addColorStop(1, '#200b07');
  g.fillStyle = lg;
  g.beginPath(); g.roundRect(14, 14, 392, 272, 10); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(225,190,130,0.5)'; g.lineWidth = 2.5;
  g.strokeRect(34, 34, 352, 232);
  g.strokeStyle = 'rgba(225,190,130,0.25)';
  g.strokeRect(42, 42, 336, 216);
  g.fillStyle = 'rgba(230,198,140,0.85)';
  g.font = '26px Georgia, serif';
  g.textAlign = 'center';
  try { g.letterSpacing = '4px'; } catch(e){}
  g.fillText(title, 210, 158);
  return {c, w: c.width, h: c.height};
}
function makeAlbumSpread(pair, tone){
  const c = document.createElement('canvas'); c.width = 800; c.height = 520;
  const g = c.getContext('2d');
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 14; g.shadowOffsetY = 7;
  g.fillStyle = '#e9e0c8'; g.fillRect(16, 16, 768, 478);
  g.restore();
  for (let i = 0; i < 4; i++){   // stacked page edges
    g.fillStyle = `rgba(120,100,60,${0.25 - i*0.05})`;
    g.fillRect(16 - i*2, 490 + i*2, 768 + i*4, 2);
  }
  // gutter
  const gut = g.createLinearGradient(360, 0, 440, 0);
  gut.addColorStop(0, 'rgba(90,70,40,0)'); gut.addColorStop(.5, 'rgba(60,45,25,0.4)'); gut.addColorStop(1, 'rgba(90,70,40,0)');
  g.fillStyle = gut; g.fillRect(360, 16, 80, 478);
  // photos on pages, photo-corner mounts
  pair.forEach((name, side) => {
    const im = IMGS[name]; if (!im) return;
    const cx = side ? 592 : 208, cy = 250;
    const fit = Math.min(300/im.w, 380/im.h);
    const w = im.w*fit, h = im.h*fit;
    g.save();
    g.translate(cx, cy); g.rotate((side ? 1 : -1) * 0.015);
    g.fillStyle = '#f4f0e2'; g.fillRect(-w/2-10, -h/2-10, w+20, h+20);
    g.filter = tone;
    g.drawImage(im.el, -w/2, -h/2, w, h);
    g.filter = 'none';
    g.fillStyle = 'rgba(40,25,10,0.5)';
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([qx,qy]) => {
      g.beginPath();
      g.moveTo(qx*(w/2+10), qy*(h/2+10));
      g.lineTo(qx*(w/2+10) - qx*26, qy*(h/2+10));
      g.lineTo(qx*(w/2+10), qy*(h/2+10) - qy*26);
      g.closePath(); g.fill();
    });
    g.restore();
  });
  return {c, w: c.width, h: c.height};
}
function initAlbums(){
  const tone = 'sepia(0.5) saturate(0.75) contrast(1.04)';
  BEATS.forEach((b, i) => {
    if (!b.album) return;
    ALBUM_SPRITES[i] = {
      cover: makeAlbumCover(b.album.title, segIdx(b.x)),
      spreads: b.album.photos.map(pair => makeAlbumSpread(pair, tone)),
    };
    albumAnim[i] = 0;
  });
}
function drawAlbum(b, i, t, dt){
  const A = ALBUM_SPRITES[i]; if (!A) return;
  const lockV = state.albumLock[i];
  if (Math.abs(b.x - cam.x) > 900) delete state.albumLock[i];
  const open = lockV === true ||
    (lockV !== false && ((state.restBeat === i && state.restTime > 0.5) || state.focusBeat === i));
  albumAnim[i] += ((open ? 1 : 0) - albumAnim[i]) * Math.min(1, dt*4);
  const a = albumAnim[i];
  const kk = k(b.album.lz);
  const sx = px(b.x + b.album.dx, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const ease = a*a*(3-2*a);
  const hw = b.album.w * (1 + 0.9*ease) * kk * SS;
  pushHit(sx - hw/2, sy - hw*0.5, hw, hw*0.52, {type:'album', beat: i});
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-4 * Math.PI/180);
  ctx.scale(1, 0.42);
  if (ease < 0.97){                       // closed cover
    const w = b.album.w * kk * SS * (1 - 0.12*ease);
    const h = w * A.cover.h / A.cover.w;
    ctx.globalAlpha = 1 - ease;
    ctx.drawImage(A.cover.c, -w/2, -h, w, h);
  }
  if (ease > 0.03){                       // open spread
    const sp = A.spreads[(t/4.5|0) % A.spreads.length];
    const w = b.album.w * 1.55 * kk * SS * (0.75 + 0.25*ease);
    const h = w * sp.h / sp.w;
    ctx.globalAlpha = ease;
    ctx.drawImage(sp.c, -w/2, -h, w, h);
  }
  ctx.restore();
}

/* ---------------- PEDESTALS · landmarks of the revolutionary beats ---------------- */
const PED_SPRITES = {};
function makePedObj(kind){
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  if (kind === 'dataTooth'){
    // the case that arrived as data: a point-cloud tooth, faintly holographic
    c.width = 190; c.height = 170;
    g.translate(95, 92);
    const pts = projMesh(0.6);
    g.fillStyle = 'rgba(110,215,255,0.06)';
    g.beginPath(); g.arc(0, -6, 82, 0, 7); g.fill();
    for (let m = 0; m < MESH.M; m++){
      for (let p = 0; p < MESH.P; p++){
        const [x, y, z] = pts[m][p];
        const depth = (z + 70) / 140;
        const r = 2.6 - 1.3*depth;
        g.fillStyle = `rgba(${depth < 0.4 ? '150,230,255' : '90,180,220'},${(0.95 - 0.6*depth).toFixed(2)})`;
        g.beginPath(); g.arc(x*1.05, y*1.05 - 6, Math.max(0.8, r), 0, 7); g.fill();
      }
    }
    // a scan sweep line
    g.strokeStyle = 'rgba(160,235,255,0.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-70, 8); g.lineTo(70, 8); g.stroke();
    return {c, w: c.width, h: c.height};
  }
  if (kind === 'crown'){
    c.width = 170; c.height = 150;
    g.save(); g.translate(85, 78);
    const lg = g.createLinearGradient(-55, -60, 55, 60);
    lg.addColorStop(0, '#f4efe1'); lg.addColorStop(.55, '#ddd3bd'); lg.addColorStop(1, '#b3a78d');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(-52, 48);
    g.bezierCurveTo(-60, 8, -54, -28, -38, -46);
    g.quadraticCurveTo(-26, -58, -14, -46);
    g.quadraticCurveTo(-6, -36, 0, -46);
    g.quadraticCurveTo(6, -56, 16, -46);
    g.quadraticCurveTo(28, -58, 40, -44);
    g.bezierCurveTo(56, -24, 60, 10, 50, 48);
    g.quadraticCurveTo(0, 62, -52, 48);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.65)';
    g.beginPath(); g.ellipse(-26, -26, 9, 15, -0.5, 0, 7); g.fill();
    g.restore();
  } else if (kind === 'logo1970'){
    c.width = 190; c.height = 180;

    g.fillStyle = '#5e0f22';

    g.restore();

      g.save();

      g.drawImage(IMGS.logo1970.el, 20, 12, 150, 150);
      g.restore();

    g.beginPath(); g.roundRect(20.5, 12.5, 149, 149, 6); g.stroke();
  } else if (kind === 'bizcard'){
    c.width = 220; c.height = 150;

    g.fillStyle = '#f2f2ee';

function drawPedestal(b, t, hero){
  const ped = b.ped; if (!ped) return;
  const z = -90, kk = k(z);
  const x = b.x + (ped.dx ?? -430);
  const sx = px(x, kk);
  const colW = 165 * (ped.big ? 1.35 : 1) * kk * SS;
  if (sx < -colW*2 || sx > W + colW*2) return;
  const era = segIdx(b.x);
  const big = ped.big ? 1.3 : 1;
  const yTop = py(ped.big ? 540 : (ped.low ? 668 : 535), kk);
  pushHit(sx - colW*0.7*big, yTop - 150*kk*SS*big, colW*1.4*big, H - yTop + 150*kk*SS, {type:'focus', beat: BEATS.indexOf(b), anchor: x});
  const warmC = era === 0 ? '255,215,140' : '225,240,255';
  // two side spotlights swing in and lock their beams exactly on the exhibit;
  // brightness peaks AT the object, then the light falls away
  if (hero > 0.02){
    const lock = Math.min(1, hero * 1.7);
    const objSprite = PED_SPRITES[ped.obj];
    const objH = 120 * (ped.big ? 1.3 : 1) * kk * SS * objSprite.h / objSprite.w;
    const yObj = yTop - objH * 0.6;
    const yEnd = yTop + (H - yTop) * 0.5;
    for (const s of [-1, 1]){
      const fx = sx + s * colW * 3.0;                    // the fixture, up top
      // beam direction: straight down -> through the exhibit, by lock
      const xEnd = fx + ((sx - fx) * (yEnd / Math.max(1, yObj))) * lock;
      const tObj = Math.max(0.05, Math.min(0.92, yObj / yEnd));
      const beam = ctx.createLinearGradient(0, 0, 0, yEnd);
      beam.addColorStop(0, `rgba(${warmC},${(0.03*hero).toFixed(3)})`);
      beam.addColorStop(tObj, `rgba(${warmC},${(0.22*hero*lock).toFixed(3)})`);
      beam.addColorStop(Math.min(1, tObj + 0.25), `rgba(${warmC},${(0.07*hero).toFixed(3)})`);
      beam.addColorStop(1, `rgba(${warmC},0)`);
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(fx - colW*0.22, 0);
      ctx.lineTo(fx + colW*0.22, 0);
      ctx.lineTo(xEnd + colW*0.62, yEnd);
      ctx.lineTo(xEnd - colW*0.62, yEnd);
      ctx.closePath(); ctx.fill();
      // the fixture itself

      ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
      ctx.fillStyle = `rgba(${warmC},${(0.75*hero).toFixed(2)})`;
      ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
    }

    drawGlow(warmC, sx, yObj, objH * 1.6, 0.22 * lock * hero);
  }

  const cg = ctx.createLinearGradient(sx - colW/2, 0, sx + colW/2, 0);
  if (era === 0){
    cg.addColorStop(0, '#241408'); cg.addColorStop(.45, '#43290f'); cg.addColorStop(1, '#180d05');
  } else if (era === 3){
    cg.addColorStop(0, '#c3c8cc'); cg.addColorStop(.45, '#eef1f3'); cg.addColorStop(1, '#a9aeb3');
  } else {
    cg.addColorStop(0, '#5e6266'); cg.addColorStop(.45, '#9aa0a4'); cg.addColorStop(1, '#4a4e52');
  }
  ctx.fillStyle = cg;
  ctx.fillRect(sx - colW/2, yTop, colW, H - yTop);
  // the cap is a real cylinder slice: rim wall, top face, edge light
  {
    const rx = colW*0.62, ry = 11*kk*SS, capH = 9*kk*SS;
    const rim = ctx.createLinearGradient(sx - rx, 0, sx + rx, 0);
    if (era === 0){ rim.addColorStop(0,'#2a1809'); rim.addColorStop(.45,'#4e3012'); rim.addColorStop(1,'#1c0f06'); }
    else if (era === 3){ rim.addColorStop(0,'#b6bbc0'); rim.addColorStop(.45,'#e2e6e9'); rim.addColorStop(1,'#9aa0a5'); }
    else { rim.addColorStop(0,'#54585c'); rim.addColorStop(.45,'#8f9599'); rim.addColorStop(1,'#43474b'); }
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.ellipse(sx, yTop + capH, rx, ry, 0, 0, Math.PI);
    ctx.lineTo(sx - rx, yTop);
    ctx.ellipse(sx, yTop, rx, ry, 0, Math.PI, 0, true);
    ctx.closePath(); ctx.fill();
    const topg = ctx.createLinearGradient(sx - rx, yTop - ry, sx + rx, yTop + ry);
    if (era === 0){ topg.addColorStop(0,'#6b4a20'); topg.addColorStop(1,'#4a2d10'); }
    else if (era === 3){ topg.addColorStop(0,'#ffffff'); topg.addColorStop(1,'#dfe3e6'); }
    else { topg.addColorStop(0,'#d7dcdf'); topg.addColorStop(1,'#b4b9bd'); }
    ctx.fillStyle = topg;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2*SS;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx - 0.6*SS, ry - 0.6*SS, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();

  ctx.strokeStyle = 'rgba(235,245,255,0.30)';
  ctx.lineWidth = 1.6*SS;
  ctx.beginPath();
  ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.52, oh*1.22, 0, Math.PI, 0);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3*SS;
  ctx.beginPath();
  ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.42, oh*1.04, 0, Math.PI*1.12, Math.PI*1.42);
  ctx.stroke();
  // halo of its own little spotlight — swells with the hero pass
  const inten = (0.9 + 0.1*Math.sin(t*3 + b.x)) * (1 + (hero||0)*1.4);
  drawGlow(warmC, sx, yTop - oh*0.6, colW*1.5, 0.16*inten);
}

/* a freestanding table plane, rotated in plan — any yaw, anywhere on the floor */
function drawYawedTable(cx, cz, yawDeg, wW, dW, topY, hW, tone){
  const a = yawDeg * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const P = (lx, lz) => {                     // local table coords -> screen
    const wx = cx + lx*ca - lz*sa, wz = cz + lx*sa + lz*ca;
    return {x: px(wx, k(wz)), kt: k(wz), z: wz};
  };
  const c1 = P(-wW/2, -dW/2), c2 = P(wW/2, -dW/2), c3 = P(wW/2, dW/2), c4 = P(-wW/2, dW/2);
  const top = (p) => py(topY, p.kt), bot = (p) => py(topY + hW, p.kt);
  // legs/skirt: the two faces whose outer edge is nearest the camera
  const faces = [[c1, c2], [c2, c3], [c3, c4], [c4, c1]]
    .filter(([p, q]) => (p.z + q.z)/2 <= cz)       // faces angled toward us
    .sort((f, g) => (g[0].z + g[1].z) - (f[0].z + f[1].z));
  for (const [p, q] of faces){
    const g = ctx.createLinearGradient(0, top(p), 0, bot(p));
    g.addColorStop(0, tone.side0); g.addColorStop(1, tone.side1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x, top(p)); ctx.lineTo(q.x, top(q));
    ctx.lineTo(q.x, bot(q)); ctx.lineTo(p.x, bot(p));
    ctx.closePath(); ctx.fill();
  }
  // the top plane
  ctx.fillStyle = tone.top;
  ctx.beginPath();
  ctx.moveTo(c1.x, top(c1)); ctx.lineTo(c2.x, top(c2));
  ctx.lineTo(c3.x, top(c3)); ctx.lineTo(c4.x, top(c4));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = tone.edge; ctx.lineWidth = 1.5*SS;
  ctx.stroke();
  return {c1, c2, c3, c4, P};
}

/* BruxZir Factory: collaborative arms pick shade blocks and feed the mills */
const FACT_X = SHIFT(24870);
function drawRobotArm(bx, bz, t, phase){
  const kk = k(bz);
  const X = wx => px(wx, kk), Y = wy => py(wy, kk);
  const sx = X(bx);
  if (sx < -400 || sx > W + 400) return;
  // plinth
  ctx.fillStyle = '#c9cdd1';
  ctx.fillRect(X(bx-70), Y(950), (140)*kk*SS, Y(1080)-Y(950));
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(X(bx-70), Y(1062), 140*kk*SS, Y(1080)-Y(1062));
  // animated joints (a slow pick -> place cycle)
  const w = t*0.9 + phase;
  const a1 = -0.35 + 0.62*Math.sin(w);                 // shoulder, from vertical
  const a2 = 0.95 + 0.55*Math.sin(w + 1.1);            // elbow, relative
  const L1 = 300, L2 = 250;
  const sxw = bx, syw = 930;
  const e1x = sxw + Math.sin(a1)*L1, e1y = syw - Math.cos(a1)*L1;
  const a12 = a1 + a2 - 1.3;
  const e2x = e1x + Math.sin(a12)*L2, e2y = e1y - Math.cos(a12)*L2;
  const seg = (x0,y0,x1,y1,wd,col) => {
    ctx.strokeStyle = col; ctx.lineWidth = wd*kk*SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke();
  };
  seg(sxw, syw, e1x, e1y, 58, '#33373c');              // dark inner shadow pass
  seg(sxw, syw, e1x, e1y, 46, '#e3e6e9');
  seg(e1x, e1y, e2x, e2y, 48, '#33373c');
  seg(e1x, e1y, e2x, e2y, 38, '#dfe2e5');
  // joints with the collaborative-blue caps
  for (const [jx, jy, r] of [[sxw, syw, 42], [e1x, e1y, 36], [e2x, e2y, 26]]){
    ctx.fillStyle = '#2c3036';
    ctx.beginPath(); ctx.arc(X(jx), Y(jy), r*kk*SS, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a90d9';
    ctx.beginPath(); ctx.arc(X(jx), Y(jy), r*0.45*kk*SS, 0, 7); ctx.fill();
  }
  // the zirconia block in the gripper, when the arm is carrying
  const carry = Math.max(0, Math.sin(w + 0.5));
  if (carry > 0.25){
    ctx.globalAlpha = Math.min(1, (carry-0.25)*3);
    ctx.fillStyle = '#f0f2ef';
    ctx.fillRect(X(e2x) - 16*kk*SS, Y(e2y) + 10*kk*SS, 32*kk*SS, 24*kk*SS);
    ctx.globalAlpha = 1;
  }
}

/* foreground occluders — soft dark shapes passing close to camera:

const FG_ITEMS = [4900, 8250]
  .map((x, i) => ({x, kind: ['plant','person'][i % 2], seed: i}));
const FG_SPRITES = {};
function makeFgSprite(kind, seed){
  const R = rng(seed*31337 + 5);
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.filter = 'blur(5px)';
  g.fillStyle = '#050403';
  if (kind === 'plant'){
    c.width = 760; c.height = 720; g.filter = 'blur(5px)'; g.fillStyle = '#050403';
    // pot
    g.beginPath();
    g.moveTo(315, 560); g.lineTo(445, 560); g.lineTo(425, 700); g.lineTo(335, 700);
    g.closePath(); g.fill();
    // fan of leaves — well inside the canvas, no clipping
    for (let i = 0; i < 9; i++){
      const a = -Math.PI/2 + (i - 4) * 0.24 + (R()-0.5)*0.1;
      const len = 190 + R()*110;
      const tx = 380 + Math.cos(a)*len, ty = 555 + Math.sin(a)*len;
      g.save();
      g.translate(tx, ty);
      g.rotate(a + Math.PI/2);
      g.beginPath(); g.ellipse(0, 0, 26 + R()*12, 90 + R()*36, 0, 0, 7); g.fill();
      g.restore();
      g.beginPath();
      g.moveTo(380, 565);
      g.lineTo(tx, ty);
      g.lineWidth = 10; g.strokeStyle = '#050403'; g.stroke();
    }
  } else {
    c.width = 260; c.height = 640; g.filter = 'blur(6px)'; g.fillStyle = '#050403';
    const hx = 130 + (R()-0.5)*20, lean = (R()-0.5)*24;
    g.beginPath(); g.arc(hx, 74, 44 + R()*6, 0, 7); g.fill();
    g.beginPath();
    g.moveTo(hx - 88, 640); g.lineTo(hx - 74 + lean, 210);
    g.quadraticCurveTo(hx - 70 + lean, 128, hx, 122);
    g.quadraticCurveTo(hx + 70 + lean, 128, hx + 74 + lean, 210);
    g.lineTo(hx + 88, 640); g.closePath(); g.fill();
  }
  return {c, w: c.width, h: c.height};
}

function drawGrade(t){
