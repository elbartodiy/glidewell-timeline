function nearestBeat(x){
  let best = -1, bd = 1e9;
  for (let i = 0; i < BEATS.length; i++){
    const d = Math.abs(BEATS[i].x - x);
    if (d < bd){ bd = d; best = i; }
  }
  return {i: best, d: bd};
}

/* the long bench is really a row of separate tables */
/* Table joints. 1980 used to sit well before the threshold; once the threshold
   bay was cut it landed at 2680 — a hand's width past the change of wall — and
   punched a bright slot straight through the dark counter. Moved back to where
   it was in the room rather than where it was in the array. */
/* 3830 landed 200 units from 1973 — a joint in the counter directly under
   that year's photographs. Moved to the midpoint between 1970s and 1973,
   where a joint reads as the seam between two bays. */
/* 17900 landed 470 units from the 2007 plinth and left a 405-wide scrap of
   counter marooned between the two gaps — the little island. Moved back to
   16900, where it divides a long run instead of stranding a piece of one. */
const BENCH_BREAKS = [1700, 3345, 7350, 9250, 13100, 16900, 22280]
  .map(x => ({x: SHIFT(x), half: 65}));
BENCH_BREAKS.push({x: SHIFT(24870), half: 560});   // the BruxZir Factory line replaces the table
// the counter clears out from the 1989 portal all the way past the 1993 stand:
// a model of a place should stand on the floor of a room, not on a worktop
BENCH_BREAKS.push({x: (REC3_R + REC93_R + 65) / 2, half: (REC93_R + 65 - REC3_R) / 2});

let TABLES = [];
let LIGHT_GRID = [];
function initLights(){
  LIGHT_GRID = [];
  for (const seg of SEGMENTS){
    const a = Math.max(seg === SEGMENTS[0] ? 950 : -400, seg.x0 + 120), b = Math.min(WORLD_END + 300, seg.x1 - 120);
    const n = Math.max(1, Math.round((b - a) / 940));
    const step = (b - a) / n;
    for (let i = 0; i < n; i++){
      let lx = a + step * (i + 0.5);
      for (const bt of BEATS){
        if (bt.fly && Math.abs(bt.x - lx) < 300) lx = bt.x + (lx >= bt.x ? 300 : -300);
        if (bt.ped){
          const px_ = bt.x + (bt.ped.dx ?? 0);
          if (Math.abs(px_ - lx) < 320) lx = px_ + (lx >= px_ ? 320 : -320);
        }
      }
      LIGHT_GRID.push({x: lx, seg});
    }
  }
  // a year is an exhibit: its lamp hangs over it, not beside it
  for (const b of BEATS){
    if (b.minor || b.under || b.plaque || b.ped) continue;
    let best = -1, bd = 1e9;
    for (let i = 0; i < LIGHT_GRID.length; i++){
      const d = Math.abs(LIGHT_GRID[i].x - b.x);
      if (d < bd){ bd = d; best = i; }
    }
    if (best >= 0 && bd < 620) LIGHT_GRID[best].x = b.x;
  }
  LIGHT_GRID.push({x: INTRO_X, seg: SEGMENTS[0]});   // the welcome lamp, dead over the inscription
  LIGHT_GRID.push({x: FIN_X, seg: SEGMENTS[3]});     // and its mirror over the finale
}
function initTables(){
  // every pedestal claims a wide gap of its own, centered on it
  for (const b of BEATS)
    if (b.ped) BENCH_BREAKS.push({x: b.x + (b.ped.dx ?? -430), half: b.ped.gapHalf || 330});
  /* THE CABINET STANDS IN A BREAK. It read as hanging because the counter ran
     straight past in front of it with nothing under its feet. The counter now
     stops short of it and picks up again where the jar used to stand, so the
     cabinet is on the floor with its own legs showing. A break rather than a
     start: making the era's counter BEGIN here would empty the opening scene
     and the 1907 bay of every surface and everything standing on one. */
  for (const u of TALL_UNITS){
    const im = PHOTO_TEX.ph_cabinet;
    const half = (im ? (u.hw || 640) * im.width / im.height : u.w) / 2 + 110;
    BENCH_BREAKS.push({x: u.x, half});
    PLATE_FROM = u.x + half;      // the photographed counter starts past the cabinet
  }
  /* THE 2022 RECREATION OPENS THE FLOOR. The alumnae keep a small island of
     counter before the portal; from the portal's left edge to where the book
     pile lies there is no counter at all — the white years' table STARTS at
     the books, and the first thing lying on it is the book. */
  /* The 2005 scrap is gone a better way. A break here merged with the 2007
     pedestal's own gap and ate the counter on its LEFT approach — 880 units of
     void on one side against 330 on the other. Removing it leaves one long run
     from the 2000 plinth to the 2007 plinth, and the pedestal stands centred in
     its own gap, the same air on both hands. */
  {
    const b22 = BEATS.find(b => b.y === '2022');
    const bookL = (b22 && b22.pyr ? b22.x + b22.pyr.dx : REC4_R + 640) - 270;
    if (bookL > REC4_L + 200)
      BENCH_BREAKS.push({x: (REC4_L + bookL) / 2, half: (bookL - REC4_L) / 2});
  }
  /* A photographic counter and a procedural one cannot be made into one surface
     by tuning a constant: the photograph was taken with a different camera, so
     its worktop is seen at a different angle and shows a different depth of its
     own top. Every attempt to line them up is a fit for a single frame. They
     are two pieces of furniture — so the hall's counter ENDS at each edge of a
     plate, with the end cap it already knows how to draw. A joint with an end
     reads as two things standing side by side; a joint without one reads as one
     surface that failed to meet itself. */
  /* A plate needs NO break of its own: it is painted after the bench and simply
     covers it, and beyond its edges the hall's counter continues on exactly the
     same line in exactly the same material. There WAS a loop here putting a
     24-unit half-break at each plate edge, directly under this paragraph saying
     it should not be there — I had reasoned my way to removing it and left the
     code. It made two 48-unit gaps at x 3 349 and 5 223: narrower than the
     worktop's own front lip is deep, half of each falling outside the picture,
     so what you saw was a hairline of naked room beside the centrepiece. A gap
     that small is not a pause in the furniture, it is a seam on it. */
  // small breaks inside a pedestal zone would skew its centering — drop them
  const wide = BENCH_BREAKS.filter(v => v.half > 200);
  for (let i = BENCH_BREAKS.length - 1; i >= 0; i--){
    const br = BENCH_BREAKS[i];
    if (br.half <= 200 && wide.some(p => Math.abs(p.x - br.x) < p.half + 430))
      BENCH_BREAKS.splice(i, 1);
  }
  // fixed table objects step aside from any gap they would straddle,
  // then a spread pass keeps them from piling onto each other
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    const dodge = it => {
      const half = (it.w || 300) * 0.55 + 30;
      for (const br of BENCH_BREAKS){
        const x = b.x + it.dx;
        if (Math.abs(x - br.x) < br.half + half){
          const dir = x >= br.x ? 1 : -1;
          it.dx = br.x + dir * (br.half + half) - b.x;
        }
      }
    };
    items.forEach(dodge);
    items.sort((p, q) => p.dx - q.dx);
    for (let n = 1; n < items.length; n++){
      const need = ((items[n-1].w||300) + (items[n].w||300)) * 0.5 + 24;
      if (items[n].dx - items[n-1].dx < need){
        items[n].dx = items[n-1].dx + need;
        dodge(items[n]);
      }
    }
  }
  TABLES = [];
  for (const seg of SEGMENTS){
    let bx0 = (seg.x0 <= -2500 && !seg.bInsetL) ? seg.x0 : seg.x0 + (seg.bInsetL != null ? seg.bInsetL : -110);
    if (seg.benchFrom != null) bx0 = Math.max(bx0, seg.benchFrom);
    const bx1 = (seg.x1 >= WORLD_END + 800 && !seg.bInsetR) ? seg.x1 : seg.x1 - (seg.bInsetR != null ? seg.bInsetR : -110);
    let start = bx0;
    for (const br of BENCH_BREAKS.filter(v => v.x + v.half > bx0 && v.x - v.half < bx1).sort((a,b)=>a.x-b.x)){
      const L = br.x - br.half, R = br.x + br.half;
      if (R <= start + 120) continue;
      if (L > start + 240) TABLES.push({x0: start, x1: L, seg});
      start = Math.max(start, R);
    }
    if (bx1 > start + 240) TABLES.push({x0: start, x1: bx1, seg});
  }
  // the law of gravity: every table object stands on an actual table span,
  // full footprint inside — nothing rides a gap, nothing levitates
  for (const b of BEATS){
    const items = [...(b.st||[]), ...(b.table||[]), ...(b.props||[]),
                   ...(b.album?[b.album]:[]), ...(b.pyr?[b.pyr]:[])];
    for (const it of items){
      const half = (it.w || 300) * 0.5 + 20;
      const x = b.x + it.dx;
      if (TABLES.some(tb => x - half >= tb.x0 + 16 && x + half <= tb.x1 - 16)) continue;
      let best = null, bestD = 1e9;
      for (const tb of TABLES){
        if (tb.x1 - tb.x0 < half*2 + 48) continue;
        const cx = Math.max(tb.x0 + 16 + half, Math.min(tb.x1 - 16 - half, x));
        const d = Math.abs(cx - x);
        if (d < bestD){ bestD = d; best = cx; }
      }
      if (best != null) it.dx = best - b.x;
    }
  }
  /* the film relays are seated by the same tables — reseat them whenever the
     tables change (the photo-skin rebuild moves the spans after boot) */
  try { initFilmRelays(); } catch(e){}
}

/* ---------------- RENDER SETUP ---------------- */
const cv = document.getElementById('view');
cv.style.transform = 'translateZ(0)';   // pin the canvas to its own compositor layer (anti-ghosting)
const ctx = cv.getContext('2d', {alpha:false});
let W = 0, H = 0, SS = 1;  // canvas px, and scale ref->canvas
let RQ = 1;   // adaptive render quality (drops on weak hardware)
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
  W = cv.width = Math.round(innerWidth * dpr * RQ);
  H = cv.height = Math.round(innerHeight * dpr * RQ);
  /* 'medium' filtering globally: 'high' was applied to EVERYTHING, including
     the era-1 counter — the largest photograph in the hall, repainted every
     frame — and 1970 began to stutter. The photo prints, where thin baked
     lines actually crawl, opt into 'high' for their own draw only. */
  ctx.imageSmoothingQuality = 'medium';
  SS = H / CFG.refH;
  VIG = null;
}
window.addEventListener('resize', resize);

let TEX = {};        // procedural textures
const GLOWS = {};
function glowSprite(col){
  if (GLOWS[col]) return GLOWS[col];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 2, 128, 128, 128);
  rg.addColorStop(0, `rgba(${col},1)`);
  rg.addColorStop(0.45, `rgba(${col},0.30)`);
  rg.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  return GLOWS[col] = c;
}
/* THE JOIN. An object without a shadow is not on a surface, it is in front of
   one, and no amount of detail in the object itself will fix that. One
   implementation, used by everything that stands on something. */
function contactShadow(sx, syFoot, wide, strength){
  const r = Math.max(2, wide * 0.60);
  ctx.save();
  ctx.translate(sx, syFoot); ctx.scale(1, 0.20); ctx.translate(-sx, -syFoot);
  const g = ctx.createRadialGradient(sx, syFoot, 0, sx, syFoot, r);
  const a = strength != null ? strength : 0.40;
  g.addColorStop(0, `rgba(0,0,0,${a.toFixed(3)})`);
  g.addColorStop(0.55, `rgba(0,0,0,${(a * 0.38).toFixed(3)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sx, syFoot, r, 0, 7); ctx.fill();
  ctx.restore();
}
/* A SHAFT OF LIGHT WITH SOFT SHOULDERS. A single quad gives a hard edge down
   both sides, which is what made these read as cut paper. Real light has no
   edge: it is brightest along its axis and dies outward, and it dies faster the
   further it has travelled. So the shaft is laid in nested passes — the widest
   faintest, the narrowest brightest — and each pass spreads more at the foot
   than at the head, which is the feather from top to bottom. */
const BEAM_PASSES = (() => {
  /* nine nested passes on a smooth power curve: five flat steps read as
     stripes when the beam is large — the shoulder needs a gradient's worth
     of layers to die away like light */
  const P = [];
  for (let i = 0; i < 9; i++){
    const t = i / 8;
    P.push([1.7 - 1.56 * t, 0.62 * (0.06 + 0.94 * Math.pow(t, 1.7))]);
  }
  return P;
})();
function softBeam(xa, xb, yA, yB, halfA, halfB, rgb, peak, stops){
  const n = BEAM_PASSES.length;
  for (let i = 0; i < n; i++){
    const [w, a] = BEAM_PASSES[i];
    /* THE FOOT OF THE BEAM IS A LINE, NOT A POINT. With one shared fade curve
       the faint outer passes drop below visibility long before the bright
       core does, and the envelope sharpens to a spike. So the fainter a pass,
       the SLOWER its curve (m^p, p<1): every pass now reaches zero at the same
       height, and the beam ends wide, together. `comp` gives back the
       brightness the gentler curve would otherwise add. */
    const p = 0.26 + 0.74 * (i / (n - 1));
    const comp = Math.pow(0.52, 1 - p);
    const g = ctx.createLinearGradient(0, yA, 0, yB);
    for (const [t, m] of stops)
      g.addColorStop(t, `rgba(${rgb},${(peak * a * Math.pow(m, p) * comp).toFixed(4)})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    // the head keeps its width; the foot is where the spread happens
    const hA = halfA * (1 + (w - 1) * 0.45), hB = halfB * w;
    ctx.moveTo(xa - hA, yA); ctx.lineTo(xa + hA, yA);
    ctx.lineTo(xb + hB, yB); ctx.lineTo(xb - hB, yB);
    ctx.closePath(); ctx.fill();
  }
}

function drawGlow(col, cx, cy, r, alpha, squashY){
  if (alpha <= 0.004 || r <= 0) return;
  const sy = squashY || 1;
  /* Put back what the caller had, not the literal 1. drawClip fades itself in
     by holding globalAlpha and calls this in the middle of doing so; resetting
     to 1 meant the rest of that fade drew at full strength. */
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(glowSprite(col), cx - r, cy - r*sy, r*2, r*2*sy);
  ctx.globalAlpha = prev;
}
let HITS = [];       // clickable screen rects, rebuilt every frame
function pushHit(x, y, w, h, payload){
  if (x > W || y > H || x + w < 0 || y + h < 0) return;
  HITS.push({x, y, w, h, p: payload});
}
function hitAt(px_, py_){
  for (let i = HITS.length - 1; i >= 0; i--){
    const r = HITS[i];
    if (px_ >= r.x && px_ <= r.x + r.w && py_ >= r.y && py_ <= r.y + r.h) return r.p;
  }
  return null;
}
const SPRITES = {};  // processed photo sprites
const grains = [];

let BR = 0;   // camera breath — render-only micro-drift so a resting frame never freezes
function k(z){ return CFG.F / (CFG.F + z - cam.z); }
/* THE BOLT. Objects standing ON a counter take the counter's near plane, not
   their own depth: at depth they slide against the front edge with every turn
   of the wheel, and the hall read as furniture on casters. Floor machinery
   keeps its real depth — the floor is deep by nature. */
function bz(z){ return Math.min(z == null ? 60 : z, 18); }
function px(x, kk){ return W/2 + (x - cam.x - BR) * kk * SS; }
function py(y, kk){ return (CFG.horizon + (y - CFG.horizon) * kk) * SS; }

/* ---------------- SCENE DRAWING ---------------- */
/* Where a wall meets a recreation, the two are on DIFFERENT PLANES: the era's
   wall stands at its own depth (550 / 680 / 850 / 1400) and the recreation's
   panel at its own (610 / 728 / 970 / 1000). They are told to meet at the same
   world coordinate, but the same world coordinate does not land on the same
   screen pixel at two depths — and the discrepancy is proportional to how far
   you have travelled from it. Past the Digital Revolution that is 0.09 px of
   naked background per unit of distance, which is the black slot that opens up
   behind you and widens as you go. The cure is to let the wall run PAST its
   nominal edge, as far as the neighbour's plane puts that edge on screen; the
   recreations are painted after the walls, so the overlap is never seen. */
const REC_PANELS = [[REC_L, REC_R, 610], [REC3_L, REC3_R, 728],
                    [REC2_L, REC2_R, 970], [REC4_L, REC4_R, 1000]];
function abutPanelZ(wx){
  for (const [l, r, z] of REC_PANELS)
    if (Math.abs(wx - l) < 1 || Math.abs(wx - r) < 1) return z;
  return null;
}
function drawWall(){
  for (const seg of SEGMENTS){
    const wx0 = seg.x0 + (seg.wInsetL || 0), wx1 = seg.x1 - (seg.wInsetR || 0);
    const kw = k(seg.z0);
    let ex0 = wx0, ex1 = wx1;
    const zL = abutPanelZ(seg.x0), zR = abutPanelZ(seg.x1);
    if (zL != null) ex0 = Math.min(ex0, cam.x + (px(wx0, k(zL)) - W/2) / (kw * SS));
    if (zR != null) ex1 = Math.max(ex1, cam.x + (px(wx1, k(zR)) - W/2) / (kw * SS));
    const sx0 = Math.max(0, px(ex0, kw)), sx1 = Math.min(W, px(ex1, kw));
    if (sx1 <= 0 || sx0 >= W || sx1 <= sx0) continue;
    const tex = TEX[seg.wall];
    const tileW = tex.width * 0.9;   // world units per tile
    /* THE WALL'S FOOT, at the wall's own depth. Everything below — the clip, the
       backstop tone, the shading — used to be measured to a line taken at the
       COUNTER's depth, so they all stopped short of where the wall actually
       meets the floor and a strip of naked room opened between the two. */
    const yFoot = py(1080, kw);
    ctx.save();
    ctx.beginPath(); ctx.rect(sx0, 0, sx1 - sx0, yFoot); ctx.clip();
    // Belt and braces: paint the era's own average tone across the whole span
    // first. Tiling can miss by a pixel at a seam for a dozen reasons; when it
    // does you should see wall, not the room's black background.
    ctx.fillStyle = wallTone(tex);
    ctx.fillRect(sx0, 0, sx1 - sx0, yFoot);
    const worldLeft = cam.x - (W/2) / (k(seg.z0) * SS);
    let wx = wx0 + Math.floor((Math.min(worldLeft, ex0) - wx0) / tileW) * tileW;
    const PURE_X = REC4_R;   // beyond the 2022 recreation: clean futurist white, no panels
    const swx = (PHOTO_SKIN && seg === SEGMENTS[0] && TEX.wall1_dark) ? wallSwitchX() : -1e9;
    /* A WALL IS A PLANE, NOT A CURTAIN. It used to be drawn from the top of the
       frame down to a line computed at the COUNTER's depth — so its foot
       travelled at the counter's rate rather than its own, and because the top
       was pinned to the edge of the screen the whole image stretched and
       squashed between the two as the camera dollied. Pull back and the wall
       visibly climbed. It now hangs between two world lines at its own depth:
       well above the frame at the top, the floor at the bottom. It moves the way
       the room it belongs to moves, and its texture no longer breathes. */
    const yTopW = py(-520, kw), hW = yFoot - yTopW;
    for (; px(wx, kw) < sx1 + 2; wx += tileW){
      const kk = kw;   // the SEGMENT's depth — never wallZAt(), which reads the
                       // world position and in the extension returns the era next door
      const straddles = swx > wx && swx < wx + tileW;
      const texT = (wx + tileW/2 < swx) ? TEX.wall1_dark : tex;
      if (seg.floor && wx + tileW > PURE_X){
        const xA = px(Math.max(wx, PURE_X), kk);
        ctx.fillStyle = '#e6e7e9';
        ctx.fillRect(xA, yTopW, px(wx + tileW, kk) - xA + 1, hW);
        if (wx < PURE_X)
          ctx.drawImage(texT, px(wx, kk), yTopW, (PURE_X - wx) * kk * SS * 1.03, hW);
      } else if (straddles){
        // the material changes mid-tile: draw the tile twice, each half clipped
        // to its own side of the line, so the joint is a butt joint
        const xs = px(swx, kk), tw = tileW * kk * SS * 1.03, tx = px(wx, kk);
        ctx.save();
        ctx.beginPath(); ctx.rect(tx - 2, yTopW, Math.max(0, xs - tx) + 2, hW); ctx.clip();
        ctx.drawImage(TEX.wall1_dark, tx, yTopW, tw, hW);
        ctx.restore();
        ctx.save();
        ctx.beginPath(); ctx.rect(xs, yTopW, Math.max(0, tx + tw - xs) + 2, hW); ctx.clip();
        ctx.drawImage(tex, tx, yTopW, tw, hW);
        ctx.restore();
      } else {
        ctx.drawImage(texT, px(wx, kk), yTopW, tileW * kk * SS * 1.03, hW);
      }
    }
    if (seg.floor){
      // the blue diode line along the white wall's base
      const kl = k(seg.z0 - 6);
      const lx0 = Math.max(sx0, px(REC4_R, kl));
      const ly = py(1076, kl);
      if (lx0 < sx1){
        const pulse = 0.55 + 0.2*Math.sin(state.time*1.8);
        ctx.fillStyle = `rgba(120,205,255,${pulse.toFixed(3)})`;
        ctx.fillRect(lx0, ly, sx1 - lx0, 2.2*SS);
        drawGlow('120,205,255', (lx0+sx1)/2, ly, (sx1-lx0)*0.7, 0.08*pulse);
      }
    }
    // the far wall stands on a visible floor — the room reads huge
    if (seg.floor){
      const kk2 = k(wallZAt((wx0 + wx1) / 2));
      const yWallBase = py(1080, kk2);
      if (yWallBase < yFoot){
        const fg = ctx.createLinearGradient(0, yWallBase, 0, yFoot);
        fg.addColorStop(0, '#a9aeb3');
        fg.addColorStop(0.12, '#8f959a');
        fg.addColorStop(1, '#54585d');
        ctx.fillStyle = fg;
        ctx.fillRect(sx0, yWallBase, sx1 - sx0, yFoot - yWallBase);
      }
    }
    // ambient darkening top and bottom of wall — each era keeps its own gloom
    const sh = seg.shade != null ? seg.shade : 1;
    /* The gloom above the lamps used to fall from 0.85 to 0.25 across the top
       third and then flatten — the change of slope read as a horizontal EDGE,
       a dark band with a visible bottom. It is a curve now, and the white room
       (shade 0.46) keeps only a breath of it: sh^1.7 rather than sh. */
    const top = Math.pow(sh, 1.7);
    const gr = ctx.createLinearGradient(0, 0, 0, yFoot);
    gr.addColorStop(0, `rgba(5,2,0,${(0.85*top).toFixed(3)})`);
    gr.addColorStop(0.10, `rgba(5,2,0,${(0.56*top).toFixed(3)})`);
    gr.addColorStop(0.20, `rgba(5,2,0,${(0.34*top).toFixed(3)})`);
    gr.addColorStop(0.32, `rgba(5,2,0,${(0.22*sh).toFixed(3)})`);
    gr.addColorStop(0.75, `rgba(5,2,0,${(0.18*sh).toFixed(3)})`);
    gr.addColorStop(1, `rgba(5,2,0,${(0.6*sh).toFixed(3)})`);
    ctx.fillStyle = gr; ctx.fillRect(sx0, 0, sx1 - sx0, yFoot);
    ctx.restore();
  }
}

/* the floor: each era has its own material tone; the change lands exactly
   on the recreation line — the ground is part of the aging, not a black hole */
const FLOOR_TONES = {
  era: [
    ['#4a2f17', '#1d1108'],   // craft: dark oiled wood
    ['#485042', '#1e2119'],   // workshop: worn linoleum
    ['#5f656e', '#2c3037'],   // office: carpet-tile grey, lit like the room after it
    ['#686d75', '#31353b'],   // white room: polished light concrete
  ],
  /* Keyed by the bay, not by its position in this list. They were positional,
     and inserting three rows in the middle silently moved two portals onto
     slabs meant for other years — the Digital Revolution ended up on the 1993
     office floor and 2022 on the 2018 machine-hall floor, while the two slabs
     written for them went unused. A name cannot slide. */
  rec: {
    r1979: ['#d6cfc0', '#8f8778'],   // pale stone, toned to the panel
    r1989: ['#d3d1c9', '#8b897f'],   // the national-leader threshold
    r1993: ['#c9ccd1', '#82868d'],   // the nineties office slab
    r2018: ['#eceef0', '#a9aeb4'],   // the machine hall, lit like an operating room
    r2023: ['#e8ebee', '#a4a9af'],   // the crossing
    rDR:   ['#dde1e6', '#989ea6'],   // digital revolution: cool light stone
    r2022: ['#e4e7ea', '#a3a9b0'],   // fastscan: the whitest slab of all
  },
  plaza: ['#9aa27f', '#5c6650'],  // outside: sunlit ground
};
/* the floor: every era owns its tone, and each recreation stands on its own
   light slab running column to column — the carpet lies on that slab, the
   era seams land visibly at the slab's edges */
function drawFloor(){
  // The floor must begin where the WALL ends, not at some depth behind the
  // bench: the strip between those two lines is normally hidden by the counter,
  // but wherever the counter breaks it was left unpainted and the room's dark
  // background showed through as a black slot — and since the wall's foot and
  // the counter's edge sit at different depths, that slot opened and closed as
  // the camera travelled.
  const kSeam = k(CFG.benchDepth);
  const kNear = k(-40);
  const T = FLOOR_TONES;
  const spans = [
    [SEGMENTS[0].x0 - 900, REC_L,  T.era[0]],
    [REC_L,  REC_R,  T.rec.r1979],
    [REC_R,  REC3_L, T.era[1]],
    [REC3_L, REC3_R, T.rec.r1989],
    [REC3_R, REC93_L, T.era[2]],
    [REC93_L, REC93_R, T.rec.r1993],
    [REC93_R, REC2_L, T.era[2]],
    [REC2_L, REC2_R, T.rec.rDR],
    [REC2_R, REC18_L, T.era[3]],
    [REC18_L, REC18_R, T.rec.r2018],
    [REC18_R, REC4_L, T.era[3]],
    [REC4_R, REC23_L, T.era[3]],
    [REC23_L, REC23_R, T.rec.r2023],
    [REC4_L, REC4_R, T.rec.r2022],
    [REC23_R, SEGMENTS[3].x1 + 900, T.era[3]],
  ];
  for (const [a, b, tone] of spans){
    const segF = segAt((a + b) / 2);
    /* The same line the wall's foot is drawn to, computed the same way. Taking
       one from the counter's depth and the other from the wall's is how a strip
       of naked background opens between them. */
    const yTop = py(1080, k(segF.z0 || 550));
    const xTL = px(a, kSeam), xTR = px(b, kSeam);
    const xBL = px(a, kNear), xBR = px(b, kNear);
    if (Math.max(xTR, xBR) < 0 || Math.min(xTL, xBL) > W) continue;
    const g = ctx.createLinearGradient(0, yTop, 0, H);
    g.addColorStop(0, tone[0]);
    g.addColorStop(1, tone[1]);
    ctx.beginPath();
    ctx.moveTo(xTL, yTop); ctx.lineTo(xTR, yTop);
    ctx.lineTo(xBR, H); ctx.lineTo(xBL, H);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    /* Where one floor meets another, lay a joint. Without it the two tones just
       abut along a diagonal and the eye reads a rendering fault rather than a
       change of material. */
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    ctx.lineWidth = 1.4 * SS;
    ctx.beginPath(); ctx.moveTo(xTR, yTop); ctx.lineTo(xBR, H); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(xTR + 1.4 * SS, yTop); ctx.lineTo(xBR + 1.4 * SS, H); ctx.stroke();
  }
}

function drawLampPool(x, intensity){
  // pool of light on the wall behind a beat, colored by its era — and from
  // 1970 on, by its NEW wiring: white light, not the pioneer amber
  const seg = segAt(x);
  const kk = k(wallZAt(x) - 4);
  const cx = px(x, kk), cy = py(330, kk);
  const r = seg.light.poolR * kk * SS;
  if (cx < -r || cx > W + r) return;
  const pool = (segIdx(x) === 0 && x >= SHIFT(2200)) ? '244,240,228' : seg.light.pool;
  drawGlow(pool, cx, cy - r*0.12, r, seg.light.poolA * intensity);
}

function benchTiles(tex, kk, srcY, srcH, dy, dh, wx0, wx1){
  // world-anchored texture tiles across [wx0..wx1] at depth scale kk
  const tileW = tex.width;   // world units per tile
  const worldLeft = cam.x - (W/2) / (kk * SS);
  let wx = Math.floor(Math.max(wx0, worldLeft) / tileW) * tileW;
  const sxEnd = Math.min(W, px(wx1, kk));
  for (; px(wx, kk) < sxEnd + 2; wx += tileW){
    ctx.drawImage(tex, 0, srcY, tex.width, srcH, px(wx, kk), dy, tileW * kk * SS + 1, dh);
  }
}
function drawBench(){
  ctx.save();
  const slices = 14;
  const kf = k(0);
  const yTopF = py(CFG.benchY, kf);
  for (const tb of TABLES){
    const seg = tb.seg, bx0 = tb.x0, bx1 = tb.x1;
    if (onPlate(tb) || era1Photo(tb) || era2Photo(tb)) continue;   // a photograph takes this run over
    const sx0f = px(bx0, kf), sx1f = px(bx1, kf);
    if (sx1f <= 0 || sx0f >= W) continue;
    const tex = TEX[seg.bench];
    // tabletop: horizontal slices from back (benchDepth) to front (0)
    for (let s = 0; s < slices; s++){
      const z1 = CFG.benchDepth * (1 - s/slices);
      const z0 = CFG.benchDepth * (1 - (s+1)/slices);
      const k1 = k(z1), k0 = k(z0);
      const y1 = py(CFG.benchY, k1), y0 = py(CFG.benchY, k0);
      const cx0 = Math.max(0, px(bx0, kf)), cx1 = Math.min(W, px(bx1, kf));
      if (cx1 <= 0 || cx0 >= W || cx1 <= cx0) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(cx0, y1, cx1 - cx0, (y0 - y1) + 1); ctx.clip();
      benchTiles(tex, k0, (s/slices)*(tex.height-90), 90, y1, (y0-y1)+1, bx0, bx1);
      ctx.fillStyle = `rgba(8,4,1,${(0.55 * (s? z1/CFG.benchDepth : 0)).toFixed(3)})`;
      ctx.fillRect(cx0, y1, cx1 - cx0, (y0 - y1) + 1);
      ctx.restore();
    }
    // front face — a cabinet is an OBJECT, so it keeps its own height in the
    // world (bench line down to the floor) instead of being stretched to the
    // bottom of the screen. Stretching it meant the doors squashed and
    // stretched as the camera dollied, which the photographic fascia shows
    // plainly: the counter appeared to breathe on every zoom.
    const fx0 = Math.max(0, sx0f), fx1 = Math.min(W, sx1f);
    const yBotF = py(1080, kf);
    const fh = yBotF - yTopF;
    if (fx1 > fx0 && fh > 1){
      ctx.save();
      ctx.beginPath(); ctx.rect(fx0, yTopF, fx1 - fx0, Math.min(H, yBotF) - yTopF); ctx.clip();
      const texF = TEX[seg.front];
      benchTiles(texF, kf, 0, texF.height, yTopF, fh, bx0, bx1);
      const shF = seg.shade != null ? seg.shade : 1;
      const gr = ctx.createLinearGradient(0, yTopF, 0, yBotF);
      gr.addColorStop(0, 'rgba(255,220,160,0.10)');
      gr.addColorStop(0.08, 'rgba(0,0,0,0.0)');
      gr.addColorStop(1, `rgba(0,0,0,${0.75*shF})`);
      ctx.fillStyle = gr; ctx.fillRect(fx0, yTopF, fx1 - fx0, fh);
      // year rail on the table edge
      ctx.fillStyle = seg.rail;
      ctx.fillRect(fx0, yTopF + 6*SS, fx1 - fx0, 3*SS);
      ctx.restore();
      // visible table ends
      for (const [ex, edge] of [[bx0, 1], [bx1, -1]]){
        if (ex <= -800 || ex >= WORLD_END + 800) continue;
        const exs = px(ex, kf);
        if (exs < -40 || exs > W + 40) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.fillRect(edge > 0 ? exs : exs - 5*SS, yTopF, 5*SS, fh);
        ctx.fillStyle = 'rgba(255,240,210,0.10)';
        ctx.fillRect(edge > 0 ? exs + 5*SS : exs - 7*SS, yTopF, 2*SS, fh);
      }
    }
  }
  // year marks (per-beat era styling)
  ctx.textAlign = 'center';
  for (const b of BEATS){
    const bx = px(b.x, kf);
    if (bx > -100 && bx < W + 100){
      if (!TABLES.some(tb => b.x >= tb.x0 && b.x <= tb.x1)) continue;  // no table — no etched year
      const seg = segAt(b.x);
      ctx.font = `${Math.round(26*SS)}px ${seg.font}`;
      ctx.fillStyle = seg.railInk;
      ctx.fillRect(bx - 1, yTopF + 2*SS, 2, 14*SS);
      if ((!b.sub || b.under) && !b.plaque) ctx.fillText(b.y, bx, yTopF + 25*SS);
      if (b.under){
        // a fact parked under the tabletop — quiet, until we find it a home
        ctx.font = `${Math.round(21*SS)}px ${seg.font}`;
        ctx.fillText(b.t, bx, yTopF + 72*SS);
        ctx.font = `italic ${Math.round(15*SS)}px ${seg.font}`;
        ctx.save(); ctx.globalAlpha = 0.7;
        ctx.fillText(b.th, bx, yTopF + 96*SS);
        ctx.restore();
        pushHit(bx - 200*SS, yTopF + 8*SS, 400*SS, 100*SS, {type:'study', beat: BEATS.indexOf(b)});
      }
      if (b.t === 'TODAY'){
        const pulse = 0.55 + 0.35*Math.sin(state.time*2.4);
        ctx.fillStyle = `rgba(120,215,255,${pulse})`;
        ctx.beginPath(); ctx.arc(bx, yTopF - 8*SS, 5*SS, 0, 7); ctx.fill();
        ctx.font = `${Math.round(20*SS)}px ${seg.font}`;
        ctx.fillStyle = `rgba(120,215,255,${0.5 + 0.3*Math.sin(state.time*2.4)})`;
        ctx.fillText('— WE ARE HERE —', bx, yTopF + 68*SS);
      }
    }
  }
  ctx.restore();
}

function drawSprite(sp, x, yCenter, z, wWorld, rotDeg, alpha, hit, sxRivet){
  const kk = k(z);
  const sx = sxRivet != null ? sxRivet : px(x, kk), sy = py(yCenter, kk);
  if (sx < -600 || sx > W + 600) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale/2, sp.w*scale, sp.h*scale, hit);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  // prints carry baked hairlines: they alone pay for the high-quality filter
  ctx.imageSmoothingQuality = 'high';
  ctx.translate(sx, sy);
  if (rotDeg) ctx.rotate(rotDeg * Math.PI/180);
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale/2, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function drawStandingPrint(sp, x, lz, wWorld, hit, lift){
  const kk = k(bz(lz));
  const sx = px(x, kk);
  if (sx < -500 || sx > W + 500) return;
  const scale = (wWorld / sp.inner.w) * kk * SS;
  const sw = sp.w * scale, sh = sp.h * scale;
  const syFoot = py(CFG.benchY - (lift || 2), kk);
  if (hit) pushHit(sx - sw/2, syFoot - sh, sw, sh, hit);
  // contact shadow
  ctx.save();
  ctx.translate(sx, syFoot); ctx.scale(1, 0.22); ctx.translate(-sx, -syFoot);
  const sg = ctx.createRadialGradient(sx, syFoot, 2, sx, syFoot, sw*0.55);
  sg.addColorStop(0, 'rgba(0,0,0,0.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sw*0.55, syFoot - sw*0.55, sw*1.1, sw*1.1);
  ctx.restore();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sp.c, sx - sw/2, syFoot - sh + 6*kk*SS, sw, sh);
  ctx.imageSmoothingQuality = 'medium';
}
function drawLyingPrint(sp, x, lz, wWorld, rotDeg, hit){
  // print lying on the tabletop — bolted to the counter's near plane
  const kk = k(bz(lz));
  const sx = px(x, kk);
  if (sx < -600 || sx > W + 600) return;
  const sy = py(CFG.benchY, kk);
  const scale = (wWorld / sp.inner.w) * kk * SS;
  if (hit) pushHit(sx - sp.w*scale/2, sy - sp.h*scale*0.42, sp.w*scale, sp.h*scale*0.42, hit);
  contactShadow(sx, sy + sp.h * scale * 0.10, sp.w * scale * 0.58, 0.26);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rotDeg * Math.PI/180);
  ctx.scale(1, 0.42);                       // foreshortening
  ctx.drawImage(sp.c, -sp.w*scale/2, -sp.h*scale, sp.w*scale, sp.h*scale);
  ctx.restore();
}

function eraFont(sz, style, fam){ return `${style||''} ${Math.round(sz)}px ${fam || SEGMENTS[0].font}`.trim(); }

function drawBeatText(b, focusAmt){
  if (b.under) return;   // this fact lives under the tabletop, on the bench face
  if (b.plaque){
    // no numeral, no lines — just a small engraved plate on the wall
    const segP = segAt(b.x);
    const kk = k(wallZAt(b.x) - 8);
    const cx = px(b.x, kk);
    if (cx > -600 && cx < W + 600){
      /* the plate wears its era: bronze on the craft century's boards, a pale
         museum label in the white room — and it is cut to fit its own words,
         so a long name is not squeezed into a plate made for a short one */
      const white = segIdx(b.x) === 3;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = eraFont(40 * kk * SS, '', segP.font);
      try { ctx.letterSpacing = `${8*kk*SS}px`; } catch(e){}
      const wP = Math.max(320*kk*SS, ctx.measureText(b.t).width + 84*kk*SS);
      const hP = 88*kk*SS, yP = py(150, kk);
      const pg = ctx.createLinearGradient(cx, yP, cx, yP + hP);
      if (white){ pg.addColorStop(0, 'rgba(250,251,252,0.96)'); pg.addColorStop(1, 'rgba(226,230,234,0.96)'); }
      else      { pg.addColorStop(0, 'rgba(70,58,40,0.92)');    pg.addColorStop(1, 'rgba(44,36,24,0.92)'); }
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.roundRect(cx - wP/2, yP, wP, hP, 6*SS); ctx.fill();
      ctx.strokeStyle = white ? 'rgba(120,132,144,0.45)' : `rgba(${segP.ink},0.4)`;
      ctx.lineWidth = 1.5*SS;
      ctx.strokeRect(cx - wP/2 + 5*kk*SS, yP + 5*kk*SS, wP - 10*kk*SS, hP - 10*kk*SS);
      ctx.fillStyle = white ? 'rgba(44,52,60,0.95)' : `rgba(${segP.ink},0.95)`;
      ctx.fillText(b.t, cx, yP + hP*0.66);
      try { ctx.letterSpacing = '0px'; } catch(e){}
      ctx.restore();
      pushHit(cx - wP/2, yP, wP, hP, {type:'study', beat: BEATS.indexOf(b)});
    }
    return;
  }
  const seg = b.ink ? Object.assign({}, segAt(b.x), {ink: b.ink}) : segAt(b.x);
  const wz = seg.tz || wallZAt(b.x);   // one shared text plane per era group — equal type everywhere
  const dxW = b.x - cam.x;
  const near = Math.max(0, 1 - Math.abs(dxW)/1300);
  const sc = b.minor ? 0.6 : 1;
  const tY = segIdx(b.x) === 0 ? 232 : 208;   // the serif era breathes wider under its numerals
  // during a pedestal dolly the headline recomposes: it steps down into the
  // zoomed frame and yields size, so the exhibit stays the hero
  const fScale = 1 - 0.30 * focusAmt;
  const fFade = 1 - focusAmt;   // the thesis bows out while the exhibit is the hero
  // flagged landmark beats fly: at distance they rest on the wall in the
  // standard typography, grow to full size at screen center, then settle back
  if (b.fly){
    // the year lifts off the wall as you approach and settles back afterwards —
    // its resting state is the standard wall typography, same as every other year
    const zT = 265 + (wz - 8 - 265) * Math.pow(1 - near, 1.7);   // apex plane keeps the numerals fully in frame
    const kk = k(zT);
    // riveted to the wall: the numeral grows straight toward the camera,
    // it never slides left or right off its own spot
    let cx = px(b.x, k(b.pinZ || (wz - 8)));
    const ts = (seg.tScale || 1) * (b._ys || 1);
    if (cx > -1200 && cx < W + 1200){
      ctx.save();
      ctx.textAlign = 'center';
      let hitTopF = py(20 - (b.yLift || 0), kk);
      const bandF = hungBand(b.x);
      if (bandF){
        const r = drawHungYear(b, seg, cx, bandF, fScale, focusAmt, near);
        hitTopF = r.yBase - r.cap - 18 * SS;
      } else {
        ctx.font = eraFont(170 * ts * fScale * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${Math.min(1, 0.5 + 0.6*near)})`;
        ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 8*SS; ctx.shadowOffsetY = 4*SS;
        ctx.fillText(b.y, cx, mixN(py(140 - (b.yLift || 0), kk), H*0.16, focusAmt));
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      }
      pushHit(cx - 340*kk*SS, hitTopF, 680*kk*SS, py(330, kk) - hitTopF,
              {type:'study', beat: BEATS.indexOf(b)});
      const cd = b._capDrop || 0;
      ctx.font = eraFont(46 * (seg.tScale || 1) * kk * SS, '', seg.font);
      try { ctx.letterSpacing = `${9*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.45 + 0.5*near) * 0.92})`;
      ctx.fillText(b.t, cx, mixN(py(tY + cd - (b.yLift || 0), kk), H*0.16 + 62*SS, focusAmt));
      try { ctx.letterSpacing = '0px'; } catch(e){}
      if (near > 0.25 && b.th && fFade > 0.05){
        ctx.font = eraFont(30 * (seg.tScale || 1) * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${((near-0.25)/0.75 * 0.72 * fFade).toFixed(3)})`;
        drawLines(b._th, cx, py(tY + 54 + cd - (b.yLift || 0), kk), 38 * kk * SS);
      }
      ctx.restore();
    }
  } else {
    // static wall text; it steps back while a flying neighbour holds the air
    let flyDim = 1;
    for (const f of BEATS){
      if (!f.fly || Math.abs(f.x - b.x) > 1200) continue;
      const nF = Math.max(0, 1 - Math.abs(f.x - cam.x)/1300);
      flyDim = Math.min(flyDim, 1 - 0.7 * Math.pow(nF, 1.4));
    }
    if (state.focusBeat >= 0 && BEATS[state.focusBeat] !== b)
      flyDim = Math.min(flyDim, 0.3);   // a focused exhibit owns the frame
    const kk = k(wz - 8);
    const cx = px(b.x, kk);
    if (cx > -900 && cx < W + 900){
      ctx.globalAlpha = flyDim;
      ctx.save();
      ctx.textAlign = 'center';
      if (b.sub){
        // a satellite of its year-stand: no numeral of its own — the title carries it
      }
      let hitTop = py(20 - (b.yLift || 0), kk);
      if (!b.sub){
        /* IN THE SHOWROOM THE YEAR HANGS. It is a set of cut letters on two
           wires, sitting on the timber soffit — so it is sized and placed from
           the soffit's own band rather than from a world coordinate, and it is
           backlit: the face stays a dark silhouette and the light spills round
           the perimeter, which is the same trick the furniture's concealed
           strip plays. That is also what fixes it reading dark — a backlit sign
           is legible because of the halo, not because the letter is pale. */
        const band = hungBand(b.x);
        if (band){
          const r = drawHungYear(b, seg, cx, band, fScale, focusAmt, near);
          hitTop = r.yBase - r.cap - 18 * SS;
        } else {
          ctx.font = eraFont(170 * (seg.tScale||1) * (b._ys||1) * fScale * kk * SS, '', seg.font);
          ctx.fillStyle = `rgba(${seg.ink},${0.5 + 0.45*near})`;
          ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6*SS; ctx.shadowOffsetY = 3*SS;
          // a numeral can be lifted clear of whatever stands under it on the panel
          ctx.fillText(b.y, cx, mixN(py(140 - (b.yLift || 0), kk), H*0.16, focusAmt));
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        }
      }
      pushHit(cx - 320*kk*SS, hitTop, 640*kk*SS, py(330, kk) - hitTop,
              {type:'study', beat: BEATS.indexOf(b)});
      const cd = b._capDrop || 0;
      ctx.font = eraFont(46 * sc * (seg.tScale||1) * kk * SS, '', seg.font);
      try { ctx.letterSpacing = `${9*sc*kk*SS}px`; } catch(e){}
      ctx.fillStyle = `rgba(${seg.ink},${(0.45 + 0.5*near)*0.92})`;
      ctx.fillText(b.t, cx, mixN(py((b.minor ? tY + 4 : tY) + cd - (b.yLift || 0), kk), H*0.16 + 62*SS, focusAmt));
      try { ctx.letterSpacing = '0px'; } catch(e){}
      if (near > 0.25 && b.th){
        ctx.font = eraFont(30 * (b.minor?0.8:1) * (seg.tScale||1) * kk * SS, 'italic', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},${(near-0.25)/0.75 * 0.72})`;
        if (fFade > 0.05) drawLines(b._th, cx, py((b.minor ? tY + 46 : tY + 54) + cd - (b.yLift || 0), kk), 38 * (b.minor?0.8:1) * kk * SS);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

/* rest-descriptions live on the bench face, under the etched year line —
   drawn above everything, era ink, so no pedestal or prop ever hides them */
/* A caption on a dark bench face has to be light — but light in the colour of
   the era's own light. A cold grey under tungsten reads as a foreign object in
   the room; the craft years want warm cream, the white era wants cool. Taken
   from each era's ink, lifted where that ink is too dark to read on wood. */
/* THE HUNG YEAR. In the showroom a year is a set of cut letters on two wires,
   sitting on the horizontal walnut strip: sized and placed from the strip's own
   screen band rather than from a world coordinate, set wide the way cut letters
   are, and backlit. The face stays a dark silhouette and white light spills
   round the perimeter — the same trick the concealed strip in the furniture
   plays, and the reason a dark numeral reads at all against a white wall.
   Both the flying beats and the static ones come through here: I wrote it into
   one branch first and the finale, which flies, was left behind. */
function drawHungYear(b, seg, cx, band, fScale, focusAmt, near){
  const label = b.sign || b.y;      // the finale is hung as a word, not a number
  ctx.save();
  ctx.textAlign = 'center';
  const track = 13;                         // cut letters are set apart
  ctx.font = eraFont(100, '', seg.font);
  try { ctx.letterSpacing = `${track}px`; } catch(e){}
  const c0 = ctx.measureText(label).actualBoundingBoxAscent || 72;
  const fpx = 100 * ((band.yB - band.yT) * 0.74) / c0 * fScale;   // shy of the strip
  ctx.font = eraFont(fpx, '', seg.font);
  try { ctx.letterSpacing = `${(track * fpx / 100).toFixed(2)}px`; } catch(e){}
  const m = ctx.measureText(label);
  const cap = m.actualBoundingBoxAscent || fpx * 0.72;
  const wid = m.width;
  const yBase = mixN((band.yT + band.yB) / 2 + cap / 2, H * 0.16, focusAmt);
  // the two wires, the gauge and colour the banners hang on
  ctx.strokeStyle = 'rgba(120,128,136,0.5)';
  ctx.lineWidth = Math.max(1, 1.4 * SS);
  for (const s of [-0.34, 0.34]){
    ctx.beginPath();
    ctx.moveTo(cx + wid * s, 0);
    // never past the band: a wire that overshoots lands on whatever hangs below
    ctx.lineTo(cx + wid * s, Math.min(yBase - cap, band.yB + 6 * SS));
    ctx.stroke();
  }
  /* THE HALO IS CAST, NOT PAINTED. Laying the glow by filling the glyph in white
     and covering it with the dark face leaves a bright hairline all round it:
     the white body and the dark face are anti-aliased separately, so along every
     edge the white is a shade more covered than the dark that is meant to hide
     it, and what survives is a one-pixel outline. It showed on the unlit years
     too, because even a very faint white body has an edge.
     So the glyph that makes the shadow is drawn far off the canvas and only its
     shadow is thrown back into place. There is no body to leak. */
  const lit = Math.max(0, Math.min(1, near)) ** 1.6;
  if (lit > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#fff';
    const OFF = W + 4000;
    ctx.shadowOffsetX = OFF; ctx.shadowOffsetY = 0;
    for (const [bl, a] of [[54, 0.40], [27, 0.34], [12, 0.26]]){
      ctx.shadowColor = `rgba(255,255,255,${(a * lit).toFixed(3)})`;
      ctx.shadowBlur = bl * SS;
      ctx.fillText(label, cx - OFF, yBase);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = `rgba(${seg.ink},0.94)`;
  ctx.fillText(label, cx, yBase);
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.restore();
  return {yBase, cap};
}
const hungBand = x => (x >= SHOW_L - 200 && x <= SHOW_R) ? timberBand() : null;

function descInk(seg){
  const c = (seg.ink || '218,222,227').split(',').map(Number);
  const mean = (c[0] + c[1] + c[2]) / 3;
  if (mean >= 150) return seg.ink;                    // already a light era ink
  // a dark era ink (the white era): keep its hue, raise it to read on a dark face
  const mx = Math.max(1, Math.max(c[0], c[1], c[2]));
  const g = 232 / mx;
  return c.map(v => Math.round(Math.min(255, 40 + v * g))).join(',');
}

let CAP_RECT = null;                 // where the caption actually landed, last frame
function drawBenchDescs(){
  CAP_RECT = null;
  const kf = k(0);
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (b.under || Math.abs(b.x - cam.x) > 2400) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    let dAmt = Math.max(focusAmt, state.restBeat === i ? Math.min(1, Math.max(0, (state.restTime - 0.45)/0.7)) : 0);
    if (b.album) dAmt *= 1 - (albumAnim[i] || 0);
    if (dAmt < 0.02) continue;
    const seg = segAt(b.x);
    if (b.descWall){
      // machinery owns floor, wall and air here: the line reads as a plaque
      // at the foot of the frame, light ink over the vignette
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = eraFont(23 * SS, '', seg.font);
      ctx.fillStyle = `rgba(${descInk(seg)},${(dAmt * 0.92).toFixed(3)})`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 8*SS; ctx.shadowOffsetY = 2*SS;
      // 0.925 put this line straight through the century rule and the hint under
  // it; the rule owns the bottom of the frame, so the caption stops above it
  /* drawLines takes the FIRST baseline, so a four-line caption starting at a
     fixed height ran its last line off the bottom of the frame. Anchor the
     block by its foot instead: the last line always lands on the same rule, and
     longer captions grow upward. */
  {
        const top = H * 0.905 - (b._d.length - 1) * 32 * SS;
        let wide = 0;
        for (const ln of b._d) wide = Math.max(wide, ctx.measureText(ln).width);
        drawLines(b._d, W * 0.5, top, 32 * SS);
        CAP_RECT = {x0: W/2 - wide/2 - 14 * SS, x1: W/2 + wide/2 + 14 * SS,
                    y0: top - 30 * SS, y1: H * 0.905 + 12 * SS};
      }
      ctx.restore();
      continue;
    }
    let cw = px(b.x, kf);
    let onTable = TABLES.find(t => b.x >= t.x0 && b.x <= t.x1);
    // a pedestal break may leave the beat without a table right under it —
    // the label then steps onto the nearest counter, unless a recreation
    // slab owns this ground
    const inRec = (b.x > REC_L && b.x < REC_R) || (b.x > REC3_L && b.x < REC3_R) ||
                  (b.x > REC93_L && b.x < REC93_R) || (b.x > REC18_L && b.x < REC18_R) ||
                  (b.x > REC23_L && b.x < REC23_R) ||
                  (b.x > REC2_L && b.x < REC2_R) || (b.x > REC4_L && b.x < REC4_R);
    if (!onTable && !inRec){
      // prefer the counter to the right: the tour reads left to right,
      // the label leads the eye onward past the pedestal
      let best = null, bd = 1e9;
      for (const tt of TABLES){
        let d = b.x < tt.x0 ? tt.x0 - b.x : (b.x > tt.x1 ? b.x - tt.x1 : 0);
        if (tt.x1 < b.x) d += 500;
        if (d < bd){ bd = d; best = tt; }
      }
      if (bd < 1400) onTable = best;
    }
    let ink = descInk(seg), shadow = true, slabDrop = 0;   // light ink, in the era's own light
    // the white era needs dark ink on its pale face — unless the hero dim
    // has already sunk the scene, where light ink glows over the dark
    if (segIdx(b.x) === 3 && (state.hero || 0) < 0.25){ ink = '55,61,69'; shadow = false; }
    if (onTable){
      // pinned to the beat's own table span — the line never crosses a gap
      const half = 350*SS;
      const lo = px(onTable.x0, kf) + half, hi = px(onTable.x1, kf) - half;
      if (lo < hi) cw = Math.max(lo, Math.min(hi, cw));
      // a light pedestal column would swallow light ink — the label steps
      // aside like a museum plate beside its sculpture
      if (b.ped){
        const kp = k(-90);
        const pedSx = px(b.x + (b.ped.dx ?? -430), kp);
        const pedHalf = 165 * (b.ped.big ? 1.35 : 1) * kp * SS * 0.62;
        const need = pedHalf + half + 18*SS;
        if (Math.abs(cw - pedSx) < need){
          const right = pedSx + need, left = pedSx - need;
          if (lo < hi){
            // to the right by preference — the tour reads left to right,
            // the label leads the eye onward; and never off the screen
            if (right <= hi && right + 350*SS < W - 30*SS) cw = right;
            else if (left >= lo && left - 350*SS > 30*SS) cw = left;
          }
        }
      }
      // whatever the counters allow, the line must live on the screen
      cw = Math.max(385*SS, Math.min(W - 385*SS, cw));
    } else {
      // a recreation beat: the line reads off the light floor slab in dark ink —
      // except 1979, where the red runner underfoot asks for light ink
      const onCarpet = b.x > REC_L && b.x < REC_R;
      ink = onCarpet ? '236,228,218' : '52,58,66';
      shadow = onCarpet; slabDrop = 130*SS;
    }
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(23 * SS, '', seg.font);
    ctx.fillStyle = `rgba(${ink},${(dAmt * 0.9).toFixed(3)})`;
    if (shadow){ ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6*SS; ctx.shadowOffsetY = 2*SS; }
    const capTop = py(CFG.benchY, kf) + 78*SS + slabDrop;
    let capW = 0;
    for (const ln of b._d) capW = Math.max(capW, ctx.measureText(ln).width);
    drawLines(b._d, cw, capTop, 32 * SS);
    CAP_RECT = {x0: cw - capW/2 - 14 * SS, x1: cw + capW/2 + 14 * SS,
                y0: capTop - 30 * SS, y1: capTop + b._d.length * 32 * SS};
    ctx.restore();
  }
}

function wrapCalc(text, maxW){
  const words = text.split(' ');
  let line = '', lines = [];
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLines(lines, cx, y, lh){
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i*lh);
}
/* line breaks are computed once at a reference size — they never re-flow */
function cacheWrap(){
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    const seg = segAt(b.x);
    ctx.font = `italic 100px ${seg.font}`;
    b._th = wrapCalc(b.th, 100 * 500/30);
    ctx.font = `100px ${seg.font}`;
    b._d = wrapCalc(b.d, 100 * 700/26);
    // year lane: half the distance to the nearest neighbour, minus breathing room
    const fs = 170 * (seg.tScale || 1);
    ctx.font = `${Math.round(fs)}px ${seg.font}`;
    const w = ctx.measureText(b.y).width;
    const lane = Math.max(160, Math.min(i > 0 ? b.x - BEATS[i-1].x : 1e9,
                          i < BEATS.length-1 ? BEATS[i+1].x - b.x : 1e9) - 90);
    b._ys = Math.min(1, lane / Math.max(1, w));
  }
  // one shared year scale per era — identical sizes inside each space
  for (const seg of SEGMENTS){
    const era = BEATS.filter(b => b.x >= seg.x0 && b.x < seg.x1 && !b.sub);
    const m = Math.min(1, ...era.map(b => b._ys));
    era.forEach(b => b._ys = m);
  }
}

/* The welcome inscription lives inside drawWelcomeTV now: the mark, the title,
   the film and the tour line are one composition anchored at one depth, so the
   zoom-out cannot pull them apart. */

/* ---------------- WELCOME FILM · a flat panel on the bench ----------------
   The preview movie plays where the still life used to stand: a plain plasma
   panel with a thin border on a low foot — no chrome, no cyan, the era-1 lamp
   is the only theatre it gets. Autoplay is muted (the browser demands it);
   the first tap turns the sound on, the next taps pause and resume. */
const WELCOME_TV = {x: INTRO_X, lz: 70, w: 490, src: 'media/movie_pre.mp4', posterT: 3.0};
function initWelcomeTV(){
  const v = document.createElement('video');
  v.src = WELCOME_TV.src; v.loop = true; v.playsInline = true;
  v.preload = 'auto'; v.muted = true;   // muted = not started yet
  /* NOTHING plays at first: the set holds the film's instruments frame — just
     past the black leader — as its poster. The show starts with the first
     gesture: a tap on the screen, or the first turn of the wheel. Play itself
     starts from the very top. */
  v.addEventListener('loadeddata', () => { if (v.muted){ try { v.currentTime = WELCOME_TV.posterT; } catch(e){} } });
  WELCOME_TV.v = v;
}
function startFilm(){
  const T = WELCOME_TV, v = T.v;
  if (!v || !v.muted) return;
  try { v.currentTime = 0; } catch(e){}
  v.muted = false; T.userPaused = false;
  v.play().catch(() => {
    /* the wheel is not a gesture the browser honours for sound: stay on the
       poster, and the first real touch anywhere starts the show properly */
    v.muted = true;
    try { v.pause(); v.currentTime = 0; } catch(e){}
    if (!T._armed){
      T._armed = true;
      const go = () => { window.removeEventListener('pointerdown', go); startFilm(); };
      window.addEventListener('pointerdown', go);
    }
  });
}
/* One film, many screens. The film is engaged once its sound is on; from then
   on it keeps playing while the visitor travels, and relay panels scattered
   down the rail pick the picture up wherever the welcome set is out of shot.
   Playback lives here, not in the draw: a screen out of the frame must not
   silence (or un-silence) the tape. */
function updateFilm(){
  const T = WELCOME_TV, v = T.v; if (!v) return;
  // only another VOICE stops the film — reading pages does not
  const busy = state.clip || (state.person && state.person.playing != null) ||
        (state.study && state.study.railV && !state.study.railV.paused);
  const engaged = !v.muted;                 // sound on = a real showing
  const wanted = engaged && !T.userPaused && !busy;
  // the poster holds its frame: a not-yet-started set snaps back to the
  // instruments if anything (a lost seek, a stray reset) knocked it off
  if (!engaged && v.paused && v.readyState >= 2 &&
      Math.abs(v.currentTime - (T.posterT || 0)) > 0.4){
    try { v.currentTime = T.posterT || 0; } catch(e){}
  }
  /* the film never snaps: it bows out over a second — volume slides down,
     THEN it pauses, holding its place — and slides back up when it returns */
  const dt = state.dt || 0.016;
  // audible only while it is the soundtrack: hall music off, master sound on.
  // With music playing the film keeps rolling, silent — the picture stays.
  const audible = wanted && MUSIC.off && !SOUND.off;
  if (T.vol == null) T.vol = 1;
  T.vol += ((audible ? 1 : 0) - T.vol) * Math.min(1, dt * (audible ? 2.5 : 3.5));
  if (wanted){
    if (v.paused) v.play().catch(()=>{});
  } else if (!v.paused && T.vol < 0.06){
    v.pause();
  }
  try { v.volume = Math.max(0, Math.min(1, T.vol)); } catch(e){}
  // the master switch reaches every other voice in the hall
  if (state.clip && state.clip.v) state.clip.v.muted = SOUND.off;
  if (state.person && state.person.v) state.person.v.muted = SOUND.off;
  if (state.study && state.study.railV) state.study.railV.muted = SOUND.off;
}
/* Relay stands: one every ~1.5 screens of travel, wherever a table span has
   room — never inside a recreation, a cut bay, or a beat's own composition.
   Temporary furniture: the same plain panel everywhere, until each era gets
   its own set (a projector for the craft years, a monitor for the nineties). */
const FILM_RELAYS = [];
function initFilmRelays(){
  /* The film's furniture, era by era — hand-seated, not scattered:
     a 1970s wooden console under its own lamp, hanging tube sets for 1976 and
     1988, a nineties set for 1995, a projector throwing onto the wall for
     1999, a wall plasma between 2009 and the 2010s, a tiled screen wall
     between 2022 and 2023, and a plain panel before the finale.
     Every tube screen is 4:3 — the film keeps its middle, the ears go. */
  FILM_RELAYS.length = 0;
  // the seventies console stands under the first free-standing lamp to the
  // right of the founding bay (the bay itself is a photograph — nothing may
  // stand inside it at depth, or it slides against the painted counter)
  const bayEnd = PLATES.length ? PLATES[0].x + (PLATES[0].w || 0)/2 + 200 : SHIFT(3600);
  const lamp = LIGHT_GRID.map(L => L.x).filter(x => x > bayEnd && x < SHIFT(3450) - 320)
                         .sort((a, b) => a - b)[0];
  FILM_RELAYS.push(
    {kind: 'crt70',  x: lamp != null ? lamp : bayEnd + 400, w: 250},
    {kind: 'hang',   x: SHIFT(6060),  w: 320, cy: 320, era: 0},   // after 1976, before the 1979 column
    {kind: 'hang',   x: (BEATS.find(b => b.y === '1988') || {x: SHIFT(10250) - 520}).x + 520, w: 320, cy: 282, era: 1},   // 1988 — right of the year, and it moves with it
    {kind: 'crt95',  x: SHIFT(12700), lz: 70, w: 290},            // the nineties set by 1995
    {kind: 'proj',   x: SHIFT(15330), w: 1260, cy: 318},          // 1999: high on the wall, air under it
    {kind: 'lcd05',  x: SHIFT(17330), lz: 16, w: 235},            // the office LCD on the counter before 2005
    /* 16:9, as a plasma is — larger, and measured on the deep wall (k≈0.39) so
       its top clears the taglines (screen-wise below them) and its bottom stops
       short of the counters' line with a little air */
    {kind: 'plasma', x: SHIFT(22240), w: 880, cy: 648},           // between 2009 and the 2010s — up off the counter
    {kind: 'vwall',  x: 33330, w: 900, top: -30, h: 850}          // the backdrop wall behind 2022 → 2023, up to the soffit
  );
  if (DBG) console.log('film screens:', FILM_RELAYS.map(r => r.kind + '@' + (r.x | 0)).join(', '));
}

function drawFilmPanel(x, wWorld, welcome){
  const T = WELCOME_TV, v = T.v;
  /* the welcome set stands on the PHOTOGRAPHED counter, and that counter is
     riveted to the front plane — so the set is too, or the zoom peels them
     apart and the set slides off the edge. It also stands a step back from

let AMBI = {t: -1, c: '90,200,250'};
function ambiColor(v){
  if (state.time - AMBI.t > 0.7){
    AMBI.t = state.time;
    try {
      if (!AMBI.cv){ AMBI.cv = document.createElement('canvas'); AMBI.cv.width = 4; AMBI.cv.height = 4; }
      const g2 = AMBI.cv.getContext('2d', {willReadFrequently: true});
      g2.drawImage(v, 0, 0, 4, 4);
      const d = g2.getImageData(0, 0, 4, 4).data;
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < 64; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }

         STRING, and a freely drifting colour minted a new one every sample —
         an unbounded cache and an allocation every third of a second */
      const q = n => Math.min(255, Math.round(n / 24) * 24);

/* ---------------- THE PROJECTOR ----------------
   A real machine standing in the hall, not a rectangle pasted on the wall.
   What sells a projection is never the picture: it is that the picture is
   MADE OF LIGHT. So the frame is drawn additively over the masonry — the
   wall's own texture reads straight through the highlights, exactly as it
   does in a room — the beam hangs in the air with dust turning in it, the
   lamp breathes, the gate weaves a hair, and the throw is keystoned because
   the machine sits below the centre of its own picture. */

   a window out of the middle of the tape — 12.6s to 23.4s — which is the
   architect's computer flythrough handing over, in a single cut and from the
   same angle, to the finished building. After 23.4 the tape goes to the harbour
   and we round it back. `pz` pins the picture to the recreation's own panel
   rather than to the era wall standing behind it. */
const PROJECTORS = [
  {x: (REC93_L + REC93_R) / 2, wallDX: 0, w: 1020, cy: 385, pz: 728,
   src: 'media/timeline5.mp4', throwZ: 240, mdx: -420, stand: true, ground: true,

function initProjectors(){
  for (const p of PROJECTORS){
    const v = document.createElement('video');
    v.src = p.src; v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = 'auto';
    v.addEventListener('loadeddata', () => {
      p.ready = true;
      // start inside the window, not at the head of the tape
      if (p.in != null) { try { v.currentTime = p.in; } catch(e){} }
      // the reel is pillarboxed: measure the black ears once and never throw them
      try {
        const c = document.createElement('canvas'); c.width = 96; c.height = 54;
        const g = c.getContext('2d', {willReadFrequently: true});
        g.drawImage(v, 0, 0, 96, 54);
        const d = g.getImageData(0, 0, 96, 54).data;
        const lum = x => { let m = 0; for (let y = 4; y < 50; y++){ const i = (y*96+x)*4; m = Math.max(m, (d[i]+d[i+1]+d[i+2])/3); } return m; };
        let a0 = 0, a1 = 95;
        while (a0 < 40 && lum(a0) < 14) a0++;
        while (a1 > 56 && lum(a1) < 14) a1--;
        p.crop = {x0: a0 / 96, x1: (a1 + 1) / 96};
      } catch(e){ p.crop = {x0: 0, x1: 1}; }
    });
    v.play().catch(() => {                      // a browser that wants a gesture first
      const go = () => { v.play().catch(()=>{}); window.removeEventListener('pointerdown', go); };
      window.addEventListener('pointerdown', go);
    });

function drawProjectors(t, phase){

    const near = Math.abs(p.x - cam.x) < 3600;
    if (p.v){
      const wanted = near && !state.clip;   // the spoken cut takes over from the loop
      if (wanted && p.v.paused) p.v.play().catch(()=>{});

       round to its head is caught before a single frame of the run-up shows. */
