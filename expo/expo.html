function drawInspect(){
  const I = state.inspect; if (!I) return;
  I.amt += ((I.closing ? 0 : 1) - I.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (I.closing && I.amt < 0.03){ state.inspect = null; return; }
  const e = I.amt*I.amt*(3-2*I.amt);
  const sp = I.sp;
  // source: where the photo lives in the world right now
  let sx0, sy0, sw0, sh0;
  if (I.table){
    const kk = k(I.lz);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale*0.42;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(CFG.benchY, kk) - sh0;
  } else {
    const kk = k(I.z);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(I.cy, kk) - sh0/2;
  }
  // target: filling the view
  const th = Math.min(H*0.78, W*0.72*sp.h/sp.w);
  const tw = th * sp.w/sp.h;
  const tx = W/2 - tw/2, ty = H*0.46 - th/2;
  ctx.fillStyle = `rgba(3,2,2,${0.62*e})`;
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sp.c, mixN(sx0,tx,e), mixN(sy0,ty,e), mixN(sw0,tw,e), mixN(sh0,th,e));
  if (e > 0.6){
    const b = BEATS[I.beat];
    const seg = segAt(b.x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(30*SS, '', seg.font);
    ctx.fillStyle = `rgba(${seg.ink},${(e-0.6)/0.4 * 0.9})`;
    ctx.fillText(I.cap || (b.y + ' · ' + b.t), W/2, ty + th + 52*SS);
    if (I.link){
      const label = 'OPEN THE CHAIRSIDE ARCHIVE  \u2192';
      ctx.font = eraFont(22*SS, '', seg.font);
      try { ctx.letterSpacing = `${3*SS}px`; } catch(err){}
      const wL = ctx.measureText(label).width + 56*SS;
      const yL = ty + th + 86*SS;
      const aL = (e-0.6)/0.4;
      ctx.fillStyle = `rgba(140,205,250,${(0.14*aL).toFixed(3)})`;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.fill();
      ctx.strokeStyle = `rgba(140,205,250,${(0.5*aL).toFixed(3)})`; ctx.lineWidth = 1.2*SS;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.stroke();
      ctx.fillStyle = `rgba(170,220,255,${(0.95*aL).toFixed(3)})`;
      ctx.fillText(label, W/2, yL + 35*SS);
      try { ctx.letterSpacing = '0px'; } catch(err){}
      pushHit(W/2 - wL/2, yL, wL, 52*SS, {type:'ext', url: I.link});
    }
    ctx.restore();
  }
}

const STUDY_MORE = {"2450": "In January 1970, Jim Glidewell opened a one-man dental ceramics lab in Orange County, California, working off a kitchen table — at once the founder and the sole employee. He had finished studying dental technology at Orange Coast College in 1969 and started as a bench technician who knew the craft with his hands. Before any of this came the hard road: a Kentucky farm upbringing near the Cumberland River, a latchkey childhood, and a Navy hitch during the Vietnam era.", "6900": "By 1979 the one-man ceramics lab Jim opened in 1970 had multiplied into nine separate labs spread across Southern California. It was real scale — but scale by addition: nine locations, nine sets of overhead, nine places to manage, rather than one machine. \n\nWhy it matters — scattered scale. This is the company a half-step before its defining idea. The first direct-mail campaign had already broken the “only serve dentists nearby” rule — cases were now arriving by post from far beyond any single lab’s neighborhood. So the nine-lab sprawl and the mail-order reach pull in opposite directions: demand is becoming national while production is still local and fragmented. That tension is the whole point of the beat — it is the problem that forces the next move. \n\nThe pivot it sets up. It leads straight to 1984: the nine labs merge into a single centralized plant in Orange (15,000 sq ft, 42 staff), fed nationally by mail. That is the birth of the model that actually scales — one machine, one standard, cost driven down by volume. Tell 1979 as the “before,” and 1984 lands as the turn.", "7750": "In 1980 Glidewell began flying dentists in from Japan and other countries to train in the US — the International Study Program. It was a bold move for a lab that was only just beginning to scale nationally, and it became one of the foundational milestones that shaped the company's philosophy for decades.\n\nEducation as a bond. Jim used teaching long before it became a standard marketing tool. For him it was a way to build bridges and exchange know-how with the profession — a connection, not an add-on to the product. That instinct later grew into a full media and education wing (the Chairside and Lab Perspectives magazines among them). His conviction is blunt: in business it is critical that people like and trust you — “people don't buy from people they don't like.” Teaching, and hosting guests in his own home, became the tools for building that almost family-like bond.", "9850": "What it is. BioTemps are lab-fabricated provisional (temporary) crowns and bridges in tooth-colored PMMA acrylic — roughly a 6-month wear life, ~3-day lab turnaround. (There's also a chairside version, “BioTemps NOW,” milled in-office from PMMA blocks.)\n\nWhy it's more than a temporary. The real value is as an esthetic blueprint: the provisional's design is stored and reused for the final restoration (later a BruxZir or e.max crown), so the patient can see, wear and approve the look, bite and speech before committing — “no surprises on the final visit.” It also shapes gum tissue and restores collapsed bite height. A clean early example of the Glidewell pattern: own the whole workflow in-house and take the risk out for the dentist.\n\nBy around 2002 the BioTemps business had grown into its own dedicated fixed-ceramics lab. BioTemps showed the vertical, in-house, materials-driven model Glidewell would later scale dramatically with BruxZir zirconia.", "12450": "In 1995 Glidewell opened a small in-house dental operatory — a working clinic inside the lab — so the company could test materials and restorations on real patients rather than only on bench models. The same year it launched PlaySafe, a line of custom-fitted athletic mouthguards\n\nWhy it matters (the realism move). Two small things start here. First, R&D realism: a crown that survives a lab jig is not the same as one that survives a human bite, saliva, and a hurried dentist — putting chairs in the building meant Glidewell could see failure where it actually happens. Second, it is the company's first clear step beyond the crown, into prevention and sport. Modest in scale, but it shows the instinct that later defines the firm: control more of the chain, and don't stop at the restoration.", "13640": "In 1996, Glidewell introduced the Silent Nite sleep appliance — a custom, dentist-delivered oral device that gently advances the lower jaw to keep the airway open during sleep, reducing snoring and mild obstructive sleep apnea. It was deliberately built to be comfortable, adjustable, and inexpensive enough for any general dentist to fit, not just sleep specialists.\n\nWhy it matters — dentistry beyond repair. Every previous Glidewell product fixed something already broken: a worn tooth, a missing tooth, a failed restoration. Silent Nite is different — it keeps a problem from starting. It is prevention, not repair. That is a quiet but real shift in what a dental lab believes it is for: not only rebuilding mouths, but protecting sleep, breathing, and health.", "14260": "In August 1998 Glidewell began mailing a modest clinical newsletter to its dentist customers — “Chairside Perspectives” It was short, practical, and unglamorous: proven tips and techniques shared by the lab's own on-staff clinicians, the dentists who practiced inside what was becoming the nation's largest dental laboratory. It ran in this newsletter form for roughly eight years before outgrowing the format.\n\nWhy it matters. This is a connective beat, not a headline event. A few mailed pages did not move the industry in 1998. What matters is what it seeded — the founding instinct that Glidewell should not only make restorations but teach the dentist how to use them. That instinct is the through-line from the 1980 “education as a bond” beat to everything that follows. Reach, even small reach, was being converted into trust.", "15700": "Around the turn of the 2000s Glidewell stopped relying on outside vendors for its key materials and began building its own Research & Development. Two moments pushed Jim there. First, a bad experience betting on an outside material — Artglass, a lab veneering composite — taught him that if you don't own the material, you don't own your quality or your future. Second, a conversation with independent researcher Dr. Rella Christensen about a “Volkscrown” — a people's crown, affordable to everyone, that performed like cast gold. Together they pointed at one conclusion: to make the best dentistry affordable and dependable, Glidewell needed its own science.\n\nWhy it matters — the engine room. This belongs early in the story, before BruxZir, not after. Every later breakthrough — the CAD build-out (~2000), BruxZir (2009), the automated factory (2019), AI-driven design — grows out of this one decision to build in-house R&D. It is the structural reason the company can keep making the best affordable: it controls the materials and the process end to end. By ~2000 Glidewell had already developed dozens of materials and lab services and was expanding the R&D team that today numbers 150+ people, including a dozen-plus PhDs.\n\nThrough the late 1990s and early 2000s the dental laboratory went digital. Instead of building a crown's substructure (coping) by hand, technicians began scanning the model, designing the coping on a computer, and milling it from a block. CAD/CAM moved from a niche into the mainstream of the lab.\n\nWho actually pioneered it. Not Glidewell. Nobel Biocare's Procera (mid-1990s) was the first CAD/CAM ceramic substructure; around 2001–2002 milled-zirconia frameworks arrived from others — 3M ESPE's Lava, Dentsply's Cercon, Nobel's Procera Forte. Those outside systems opened the door.\n\nWhat Glidewell did. As one of the largest labs, Glidewell adopted digital manufacturing early (working with the Cercon and Wol-Ceram systems around 2002), then built its own. Around 2004 it hired engineer Mervyn Rudgley (from 3D Systems) to lead digital manufacturing, with one explicit goal: make a zirconia substructure at a PFM price. In 2006 that became Prismatik CZ — Glidewell's own milling-plus-software system, paired with a 3Shape scanner. A clever trick (milling thin copings from a softer, bisque-fired block and sintering afterward) let them skip costly diamond tooling and push cost down.\n\nThis is the hinge between the analog craft of Part 1 and the monolithic-zirconia revolution of 2009. It is the moment the machine first enters Glidewell's bench — and, true to the thesis, the angle from day one was not 'newest technology' but 'best technology at an affordable price.' Without this quiet early-2000s digital build-out, BruxZir (2009) and the automated factory (2019) would not have been possible.", "18700": "In 2007 Glidewell took in its first digital optical impression — an intraoral scan sent straight from a practice — instead of a silicone impression or a poured stone model. Most of the industry was still pouring impressions at the time. The company dates the start of its digital case database to that moment.", "21080": "In late 2009 Glidewell launched BruxZir — a full-contour, monolithic solid-zirconia crown milled as one solid piece, with no porcelain veneering layer to chip. Worth knowing: zirconia and CAD/CAM were already in dentistry (In-Ceram Zirconia ~1999; Lava, Cercon, Procera ~2001–02). Glidewell did not invent zirconia. What it did was take monolithic full-contour zirconia, drive it through its own high-volume lab, and offer it at a price and turnaround ordinary dentists could actually say yes to — then make it the default. The first pitch was blunt: “more brawn than beauty” — a tough, near-unbreakable crown for grinders, implant cases and tight-bite molars where metal-backed crowns (PFMs) or gold used to be the only safe answer.\n\nWhy it matters — the revolution. A monolithic crown has no veneer to fracture, mills fast, and undercuts the PFM on price. The narrative nugget is the tell: the revolution went mainstream not through advertising but when dentists started phoning their own local labs and asking for “that BruxZir thing.” Demand pulled it in. Today BruxZir reportedly makes up the majority of Glidewell's fixed-crown volume and the brand counts tens of millions of units placed since 2009. This is where “affordable access” stops being a slogan and becomes a crown in a real patient's mouth.\n\nWho actually made it. Three roles, not one — the “Jim vs Carden” question dissolves once you separate them. Founder vision & funding — Jim Glidewell: no source, not even Glidewell's own, says he invented it at the bench; his own words credit “our R&D teams.” His real, substantial credit is the bet — investing in in-house milling and materials research so it could exist. The technical creator — Robin (Robert) A. Carden, VP of R&D: he led development and holds the process patent (US 9,434,651 B2, granted 2016) for the binder-free colloidal / slip-cast zirconia-blank method, and is the subject of the 2013 “I Made BruxZir” interview. Clinical champion — Dr. Mike DiTolla: drove dentist adoption (Chairside magazine, the on-camera “hammer test”) — an evangelist, not a materials inventor. In one line: “Developed by Glidewell's R&D team, led by Robin Carden, on founder Jim Glidewell's bet — launched 2009.”", "21930": "For decades dentists stayed with cement-retained crowns even though screw-retained ones are easier to retrieve and avoid cement left under the gum. The reason was rarely clinical — it was cost and complexity. Titanium bases, UCLA abutments and clinical screws were sold by the implant OEMs (Nobel, Straumann and others) at prices that could roughly double the lab cost of a case.\n\nWhat Glidewell did — two moves.\n1) Made the parts itself. Through its own precision-machining operation, Prismatik Dentalcraft, the company began producing the Inclusive® Prosthetic Components line — titanium bases, esthetic and multi-unit abutments, analogs, screws, temporary and UCLA abutments, transfer copings — compatible with the major implant systems. That broke the OEM parts bottleneck and let Glidewell quote a flat lab fee for a screw-retained crown. Screw retention stopped being a premium option and became something an ordinary practice could afford.\n2) Solved the material problem. Screw retention stresses the crown around the screw channel, and porcelain-fused-to-metal chipped there. BruxZir monolithic zirconia (2009) could take it. The lab began bonding the BruxZir crown to the titanium base before shipping, so the dentist received one finished unit: seat it, torque the screw, done. No cement in the patient's mouth at all.\n\nWhy it belongs on this line. It is the same mechanism as every other beat here, applied to a technique instead of a product: the best option existed already, and Glidewell removed the price and the complexity that kept ordinary dentists away. It is also the clearest case of vertical integration paying off clinically — owning the machining is what made the flat fee possible.", "22550": "Through the 2010s intraoral scanners went from novelty to near-universal — by the mid-2020s roughly 70% of dentists had switched from goopy physical impressions to digital scans. The old way was slow and error-prone: trays, silicone, gagging patients, remakes when a margin didn't read. Scanning became the on-ramp to everything downstream — AI crown design, the automated BruxZir factory, chairside milling — and in these years Glidewell grew into the largest dental laboratory in the world, fed by that digital stream.", "23170": "Chronology. • 1997 — Dr. Jack Hahn (creator of the NobelReplace implant) designs the original tapered implant; his own pre-history, not Glidewell's. • 2000s–early 2010s — Glidewell enters implants from the side, not with its own implant: the Inclusive line of FDA-cleared prosthetic components (abutments, screws, copings) compatible with most third-party systems, made in-house by Prismatik Dentalcraft. The point is vertical integration — cut the OEM markup, offer flat, predictable lab fees. • 2014 — Hahn begins working with Glidewell's engineers and Jim Glidewell to design a new implant. • 2015 — LAUNCH of the Hahn Tapered Implant System. It becomes one of the fastest-growing implant systems in the US, adopted by thousands of dentists. Stated goal: a high-quality implant at a fraction of the price, finished with a BruxZir crown, under a lifetime warranty from implant to restoration. • 2019 — the Inclusive component line expands to 22 major implant systems; clinical studies (2-year, then 6-year) show a 99.2% success rate and under 0.2 mm bone loss. • 2020 — medical-grade titanium scan bodies bring implant restorations into the digital workflow. • ~2023–24 — Hahn Tapered is renamed the Glidewell HT Implant System. • 2024–25 — the Glidewell Tooth Replacement Solution (full digital bundle) and major 2025 upgrades (a 6.0 mm implant, new guided-surgery kits).\n\nWhat it is today. As a private company Glidewell publishes no product-level revenue split, so an exact share can't be cited. Qualitatively: it is one of Glidewell's core product lines and one of the fastest-growing implant systems in the US; Glidewell has restored hundreds of thousands of implant cases and makes both the implant and its components in-house through Prismatik Dentalcraft (ISO-certified, FDA-cleared), positioning implant dentistry as a standard of care across the economic spectrum.\n\nThe connections (why implants link to so much on the timeline). • BruxZir / restorative — the implant is finished with the same BruxZir crown; one warranty from implant to restoration. • Vertical integration — Prismatik makes the parts in-house, kills the markup, enables flat pricing; the same move as the 2000 plastic-injection beat. • Digital / glidewell.io — scan bodies, guided surgery, digital treatment planning. • CE / education — world-class education and symposia, the Misch lineage through Resnik, teaching GPs to place implants. • Jim personally — Hahn and Jim Glidewell co-devised the system. • Accessibility — the throughline: a fraction of the price, across the economic spectrum.", "24020": "In November 2017, at its first Glidewell Dental Symposium in Dallas, Glidewell unveiled glidewell.io — a complete in-office ecosystem that put the lab's whole workflow on the dentist's own counter. Three pieces: an intraoral scanner (the iTero Element, through a partnership with Align), fastdesign.io software that uses machine-learning to propose the crown design, and the fastmill.io in-office mill. The breakthrough material was BruxZir NOW — a fully-sintered zirconia block that comes out of the mill finished, with no firing oven required. The promise: scan, design, mill and seat a single crown in roughly one visit — about an hour — instead of sending an impression to a lab and bringing the patient back in two weeks.\n\nWhy it matters — the lab moves into the chair. For decades the lab was a separate place: you took an impression, mailed it, waited, called back the patient. glidewell.io collapses that distance — the lab's capability now lives inside the operatory. Access, again: fewer visits for the patient, less travel, faster care.", "24870": "In 2019 Glidewell crossed the line from digital-assisted to digital-native production: the launch of fully automated, AI-designed, robotic monolithic-zirconia manufacturing — what the company frames as Glidewell Intelligent Manufacturing. Crown designs are proposed automatically by generative AI (reportedly generative-adversarial networks), then routed to production lines where robotic arms feed BruxZir zirconia blocks into banks of interconnected mills; each restoration is verified by automated metrology before it ships. No hand-waxing, no manual CAD nudging — the machine designs the tooth and the machine makes it.\n\nWhy it matters — the climax of the analog→digital arc. Set it directly against the 1907 / PFM hand-craft baseline: a technician at a bench, wax, casting, a fired porcelain layer, hours of human judgment per unit. Now: software draws the crown, a robot arm cuts it, a sensor checks it. Same goal — a tooth that fits and looks right — but the labor, the variability, and the cost structure are transformed. That transformation is the thesis made physical: automation is how the best dentistry gets made affordable and brought to scale, not by cutting corners but by removing variability and human bottlenecks.", "25490": "In 2019, Glidewell launched Guiding Leaders — a free leadership and practice-development program built and run by Bobbie Norton, held at the Irvine campus. It was created as the profession was tipping toward a new majority: women now make up more than half of graduating dentists, yet clinical school never teaches the business, communication, and leadership skills a practice owner actually needs. Guiding Leaders fills that gap at no cost to the dentist. Today it has roughly 100 alumni, with each cohort earning up to about 80 CE units across the run from spring to the fall graduation.\n\nWhy it matters (the thesis made human). This is the access thesis turned outward. It is reinvestment, not marketing: Glidewell gives away the playbook and asks nothing clinical in return. That reframes the company from a lab that sells crowns into one that grows the people who place them.", "26340": "In 2022 fastscan.io, built with Medit, folded an intraoral scanner into the Glidewell ecosystem — the front door to the all-digital workflow. Capturing the mouth digitally is the cheapest possible front of the flywheel: no physical impressions, no remakes, data straight into the box that designs and mills the crown. With fastdesign and fastmill already in the operatory, the scanner completed the set — from the first look at the tooth to the finished restoration, the case never leaves the digital chain.", "27190": "By the early 2020s Glidewell folds generative AI design into the heart of its lab — tools like CrownAI and MarginAI that propose a finished crown and its margin line automatically, rather than waiting for a technician to draw every case from scratch. This sits on top of staggering volume: a reported ~500,000 restorations a month, 5,000+ staff, and the standing of the largest dental lab in the world. The point is not that Glidewell “invented AI” — it did not — but that it brought AI design to scale and made it the default path for routine cases. Sergei Azernikov, VP of CAD/CAM Software and the de-facto AI lead, describes a closed quality loop: millions of cloud cases train a generative model that now produces more than 95% of the lab's restoration designs (Glidewell, 2025–26) — the design is good enough that a human rarely needs to touch it.\n\nWhy it matters — the flywheel. This beat IS the thesis made concrete. AI design is where that flywheel becomes visible and undeniable. When a model designs the crown in seconds — now more than 95% of restoration designs — across roughly half a million units a month, the cost of the single most labor-intensive step collapses — and scale plus AI becomes the affordability proof, not a slogan. Access is the throughline, and here it stops being aspiration and becomes arithmetic.", "28180": "This is the present — 2026. Automated monolithic milling, the same-visit zirconia crown Glidewell helped push to scale, is no longer remarkable; it is simply how chairside dentistry runs. The frontier has moved to three converging fronts: AI that reads scans and drafts restoration designs, robotics that guide the hand in surgery, and the single-visit promise extended from the crown to the whole treatment. By late 2025, AI-assisted CAD tools were reported to cut design time by 30–45 minutes per case and reduce remakes by roughly 18 percent, while Neocis cleared its next-generation Yomi S implant robot with FDA, its planning AI auto-segmenting anatomy from CBCT scans — a system now reachable by general dentists, not just specialists.\n\nWhy it matters — access, today. The 2026 frontier is that same throughline, now carried by software and machines. AI design and chairside automation compress chair time, labor, and remakes — and cost follows time. The honest claim here is not that anyone “invented” single-visit or robotic dentistry; it is that the tools are being made the default and brought within reach of the everyday practice, which is exactly where access lives or dies.", "1400": "In 1907 William H. Taggart demonstrated a practical lost-wax casting method for dental restorations — molten gold cast into a mold formed around a hand-carved wax pattern. The technique made precisely fitting cast crowns and inlays reproducible, and it defined the craft for the rest of the century: every restoration began as wax shaped by hand, one case at a time, days or weeks per mouth. This is the analog baseline the whole tour measures itself against — the world Glidewell was born into, and the one it would spend fifty years making faster, cheaper and more precise."};

    ctx.font = K.font(19);
    ctx.textAlign = 'left';
    ctx.fillText(b.y + ' — ' + b.t + '.txt', wx0 + 20*SS, wy0 + 30*SS);
  }
  // content clips inside the window
  ctx.beginPath(); ctx.roundRect(wx0 + 2*SS, wy0 + (era === 2 ? 46*SS : 2*SS), ww - 4*SS, wh - (era === 2 ? 50*SS : 4*SS), K.r*SS); ctx.clip();
  let y = wy0 + (era === 2 ? 168 : 130) * SS - S.scroll * SS;
  const topClip = wy0 - 80*SS, botClip = wy0 + wh + 80*SS;
  ctx.textAlign = 'left';
  ctx.font = K.font(130);
  ctx.fillStyle = `rgba(${K.ink},0.98)`;
  ctx.fillText(b.y, left, y); y += 58 * SS;
  ctx.font = K.font(38);
  try { ctx.letterSpacing = `${7*SS}px`; } catch(err){}
  ctx.fillStyle = `rgba(${K.ink},0.92)`;
  ctx.fillText(b.t, left, y);
  try { ctx.letterSpacing = '0px'; } catch(err){}
  y += 54 * SS;
  if (b.th){
    ctx.font = K.font(27, 'italic');
    ctx.fillStyle = `rgba(${K.dim},0.95)`;
    let tl = '';
    for (const wd of b.th.split(' ')){
      const test = tl ? tl + ' ' + wd : wd;
      if (ctx.measureText(test).width > textW && tl){ ctx.fillText(tl, left, y); y += 38*SS; tl = wd; }
      else tl = test;
    }
    if (tl){ ctx.fillText(tl, left, y); y += 48 * SS; }
  }
  ctx.fillStyle = K.rule;
  ctx.fillRect(left, y, colW, 1.5*SS); y += 42 * SS;
  ctx.font = K.font(27);
  ctx.fillStyle = `rgba(${K.ink},0.95)`;
  let line = '';
  for (const wd of b.d.split(' ')){
    const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > textW && line){ ctx.fillText(line, left, y); y += 40*SS; line = wd; }
    else line = test;
  }
  if (line){ ctx.fillText(line, left, y); y += 40*SS; }
  y += 36 * SS;
  const more = STUDY_MORE[b.x];
  if (more){
    ctx.font = K.font(24);
    ctx.fillStyle = `rgba(${K.ink},0.85)`;
    for (const para of more.split('\n\n')){
      for (const rawLine of para.split('\n')){
        let ln = '';
        for (const wd of rawLine.split(' ')){
          const test = ln ? ln + ' ' + wd : wd;
          if (ctx.measureText(test).width > textW && ln){ if (y > topClip && y < botClip) ctx.fillText(ln, left, y); y += 36*SS; ln = wd; }
          else ln = test;
        }
        if (ln){ if (y > topClip && y < botClip) ctx.fillText(ln, left, y); y += 36*SS; }
      }
      y += 24 * SS;
    }
    y += 10 * SS;
  }
  if (media && media.length){
    // the voices ride as a rail to the right of the text
    const mx = left + textW + 40*SS;
    let my = wy0 + (era === 2 ? 168 : 130) * SS - S.scroll * SS;
    ctx.font = K.font(19);
    ctx.fillStyle = `rgba(${K.dim},0.9)`;
    if (my > topClip && my < botClip) ctx.fillText('WATCH', mx, my);
    my += 26 * SS;
    for (let mi = 0; mi < media.length; mi++){
      const m = media[mi];
      const tw = 300*SS, th = 170*SS;
      const ty = my;
      if (ty + th > topClip && ty < botClip){
        ctx.save();
        ctx.beginPath(); ctx.roundRect(mx, ty, tw, th, 10*SS); ctx.clip();
        ctx.fillStyle = '#14181d';
        ctx.fillRect(mx, ty, tw, th);
        const im = thumbFor(m) || IMGS[m.img];   // a real interview frame, portrait until it loads
        if (im){
          const s = Math.max(tw/im.w, th/im.h);
          ctx.globalAlpha = 0.9;
          ctx.drawImage(im.el, mx + tw/2 - im.w*s/2, ty + th/2 - im.h*s/2, im.w*s, im.h*s);
          ctx.globalAlpha = 1;
        }
        const pg = ctx.createLinearGradient(0, ty + th*0.5, 0, ty + th);
        pg.addColorStop(0, 'rgba(8,10,14,0)'); pg.addColorStop(1, 'rgba(8,10,14,0.85)');
        ctx.fillStyle = pg; ctx.fillRect(mx, ty, tw, th);
        // play badge
        ctx.fillStyle = 'rgba(250,252,255,0.92)';
        ctx.beginPath(); ctx.arc(mx + tw/2, ty + th/2 - 8*SS, 25*SS, 0, 7); ctx.fill();
        ctx.fillStyle = '#1a2027';
        ctx.beginPath();
        ctx.moveTo(mx + tw/2 - 7*SS, ty + th/2 - 21*SS);
        ctx.lineTo(mx + tw/2 + 13*SS, ty + th/2 - 8*SS);
        ctx.lineTo(mx + tw/2 - 7*SS, ty + th/2 + 5*SS);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(240,244,248,0.95)';
        ctx.font = K.font(18);
        ctx.fillText(m.name, mx + 14*SS, ty + th - 34*SS);
        ctx.font = K.font(15, 'italic');
        ctx.fillStyle = 'rgba(200,206,214,0.85)';
        ctx.fillText(m.label, mx + 14*SS, ty + th - 12*SS);
        ctx.restore();
        ctx.strokeStyle = K.edge; ctx.lineWidth = 1.2*SS;
        ctx.beginPath(); ctx.roundRect(mx, ty, tw, th, 10*SS); ctx.stroke();
        pushHit(mx, ty, tw, th, {type:'clip', media: m, wx: b.x});
      }
      my += th + 46*SS;
    }
  }
  const ppl = BEAT_PEOPLE[b.x];
  if (ppl && ppl.length){
    ctx.fillStyle = K.rule;
    ctx.fillRect(left, y, colW, 1.5*SS); y += 38 * SS;
    ctx.font = K.font(19);
    ctx.fillStyle = `rgba(${K.dim},0.9)`;
    ctx.fillText('PEOPLE OF THIS MOMENT', left, y); y += 42 * SS;
    let px_ = left;
    ctx.font = K.font(24);
    for (const pid of ppl){
      const P = PEOPLE[pid]; if (!P) continue;
      const label = P.name + '  →';
      const wLbl = ctx.measureText(label).width + 40*SS;
      if (px_ + wLbl > left + colW){ px_ = left; y += 58*SS; }
      ctx.fillStyle = `rgba(${K.accent},0.16)`;
      ctx.beginPath(); ctx.roundRect(px_, y - 28*SS, wLbl, 44*SS, 22*SS); ctx.fill();
      ctx.strokeStyle = `rgba(${K.accent},0.5)`; ctx.lineWidth = 1.2*SS;
      ctx.beginPath(); ctx.roundRect(px_, y - 28*SS, wLbl, 44*SS, 22*SS); ctx.stroke();
      ctx.fillStyle = `rgba(${K.accent},0.98)`;
      ctx.fillText(label, px_ + 20*SS, y + 2*SS);
      pushHit(px_, y - 28*SS, wLbl, 44*SS, {type:'person', id: pid});
      px_ += wLbl + 16*SS;
    }
    y += 52 * SS;
  }
  ctx.font = K.font(18);
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(${K.dim},0.7)`;
  ctx.fillText('· scroll to explore · tap to return ·', W/2, y + 28*SS);
  ctx.restore();
  S.maxScroll = Math.max(1, (y + 170*SS + S.scroll * SS - (wy0 + wh)) / SS);
}

function drawClip(){
  // the speaker is projected straight onto the wall: a cone of light from
  // above, feathered edges, faint grain — no frame, no window, no buttons
  const C = state.clip; if (!C) return;
  C.amt += ((C.closing ? 0 : 1) - C.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (C.closing && C.amt < 0.03){ closeClip(); return; }
  const e = C.amt*C.amt*(3-2*C.amt);
  const seg = segAt(C.wx);
  const kk = k((seg.tz || 680) - 6);
  // the hall falls dark, the wall stays as the screen
  ctx.fillStyle = `rgba(2,3,5,${(0.72*e).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  if (e < 0.15) return;
  const a = (e - 0.15) / 0.85;
  const vw = Math.min(1150 * kk * SS, W * 0.6);
  const vh = vw * 9/16;
  const cx = Math.max(vw/2 + 30*SS, Math.min(W - vw/2 - 30*SS, px(C.wx, kk)));
  const x0 = cx - vw/2, y0 = py(150, kk);
  ctx.save();
  ctx.globalAlpha = a;
  // the projector beam
  const apexY = -30*SS;
  const bg = ctx.createLinearGradient(0, apexY, 0, y0 + vh);
  bg.addColorStop(0, 'rgba(235,240,250,0.16)');
  bg.addColorStop(1, 'rgba(235,240,250,0.02)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(cx - 16*SS, apexY);
  ctx.lineTo(cx + 16*SS, apexY);
  ctx.lineTo(x0 + vw, y0 + vh);
  ctx.lineTo(x0, y0 + vh);
  ctx.closePath(); ctx.fill();
  drawGlow('235,240,250', cx, 4*SS, 90*SS, 0.4);
  // the picture, cast on the wall
  const v = C.v;
  const flick = 0.86 + 0.05*Math.sin(state.time*37) + 0.03*Math.sin(state.time*9.3);
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, vw, vh); ctx.clip();
  if (v && v.videoWidth){
    ctx.globalAlpha = a * flick;
    const s = Math.max(vw / v.videoWidth, vh / v.videoHeight);
    ctx.drawImage(v, cx - v.videoWidth*s/2, y0 + vh/2 - v.videoHeight*s/2,
                  v.videoWidth*s, v.videoHeight*s);
    ctx.globalAlpha = a;
  }
  // feathered edges: the light melts into the dark wall
  const F = 46*SS, DIM = 'rgba(2,3,5,';
  for (const [gx0, gy0, gx1, gy1, rx, ry, rw, rh] of [
    [x0, 0, x0 + F, 0, x0, y0, F, vh],
    [x0 + vw, 0, x0 + vw - F, 0, x0 + vw - F, y0, F, vh],
    [0, y0, 0, y0 + F, x0, y0, vw, F],
    [0, y0 + vh, 0, y0 + vh - F, x0, y0 + vh - F, vw, F],
  ]){
    const g2 = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
    g2.addColorStop(0, DIM + '0.9)'); g2.addColorStop(1, DIM + '0)');
    ctx.fillStyle = g2;
    ctx.fillRect(rx, ry, rw, rh);
  }
  // grain of the throw
  const gn = grains[(state.time*10|0) % grains.length];
  ctx.globalAlpha = a * 0.06;
  ctx.fillStyle = gn.pat || (gn.pat = ctx.createPattern(gn.c, 'repeat'));
  ctx.fillRect(x0, y0, vw, vh);
  ctx.globalAlpha = a;
  ctx.restore();
  // progress: a thin light line under the throw, part of the projection
  if (v && v.duration){
    ctx.fillStyle = 'rgba(200,225,245,0.25)';
    ctx.fillRect(x0 + F, y0 + vh + 14*SS, vw - 2*F, 2*SS);
    ctx.fillStyle = 'rgba(200,225,245,0.7)';
    ctx.fillRect(x0 + F, y0 + vh + 14*SS, (vw - 2*F) * (v.currentTime / v.duration), 2*SS);
  }
  // the caption, painted in light
  ctx.textAlign = 'center';
  ctx.font = eraFont(24*SS, '', seg.font);
  ctx.fillStyle = 'rgba(225,238,248,0.75)';
  try { ctx.letterSpacing = `${4*SS}px`; } catch(err){}
  ctx.fillText(C.name.toUpperCase(), cx, y0 + vh + 56*SS);
  try { ctx.letterSpacing = '0px'; } catch(err){}
  ctx.font = eraFont(19*SS, 'italic', seg.font);
  ctx.fillStyle = 'rgba(190,205,218,0.55)';
  ctx.fillText(C.label, cx, y0 + vh + 88*SS);
  ctx.restore();
}

function drawAttractHint(t){
  if (state.mode !== 'attract') return;
  const a = 0.35 + 0.2*Math.sin(t*1.8);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = eraFont(24*SS);
  try { ctx.letterSpacing = `${5*SS}px`; } catch(e){}
  // warm ink only in the craft era; translucent white once 1979 is crossed
  ctx.fillStyle = cam.x < REC_L ? `rgba(225,198,155,${a})` : `rgba(255,255,255,${(a*0.85).toFixed(3)})`;
  // the rule owns the foot of the frame; the invitation stands above it
  ctx.fillText('TURN THE WHEEL · TRAVEL THROUGH TIME', W/2, H - 78*SS);
  ctx.restore();
}

/* ---------------- UPDATE ---------------- */
function update(dt){
  const inp = Input.consume();
  state.time += dt;
  state.dt = dt;
  updateMusic(dt);

  if (inp.anyInput){
    state.idle = 0;
    if (state.mode === 'attract'){
      state.mode = 'live';
      state.attract.fade = 0;
    }
  } else {
    state.idle += dt;
    if (state.mode === 'live' && state.idle > CFG.idleToAttract){
      state.mode = 'attract';
      state.study = null;
      closeClip();
      state.attract.phase = 'cruise';
      state.focusBeat = -1; cam.zTarget = 0;
    }
  }

  if (state.mode === 'live'){
    if (state.inspect){
      // a photo is up close: the archive pill opens the magazine,
      // any other click or a strong scroll puts the photo back
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'ext'){ try { window.open(aimed.url, '_blank'); } catch(err){} }
        else state.inspect.closing = true;
      } else if (inp.action === true || Math.abs(inp.impulse) > 260) state.inspect.closing = true;
      cam.vel = 0;
    } else if (state.clip){
      // the speaker window: any click or a strong scroll puts it back
      if (inp.action || Math.abs(inp.impulse) > 260) state.clip.closing = true;
      cam.vel = 0;
    } else if (state.study){
      // the reading page: the wheel scrolls, names open their people, a click closes
      const S = state.study;
      S.scroll += inp.impulse * 0.55 * dt * 60 / 60;
      if (inp.action && typeof inp.action === 'object'){
        const aimed = hitAt(inp.action.x, inp.action.y);
        if (aimed && aimed.type === 'clip'){
          openClip(aimed.media, aimed.wx);
        } else if (aimed && aimed.type === 'person' && PERSON_SPRITES[aimed.id]){
          const P = PEOPLE[aimed.id], sp = PERSON_SPRITES[aimed.id];
          state.inspect = {sp, wx: cam.x, cy: 400, z: 200, w: 300,
                           cap: P.name + ' \u00b7 ' + P.role, beat: S.beat, table: false, amt: 0};
        } else S.closing = true;
      } else if (S.scroll < -90 || inp.action === true) S.closing = true;
      S.scroll = Math.max(-120, Math.min(S.maxScroll, S.scroll));
      cam.vel = 0;
    } else {
      cam.vel += inp.impulse;
    }
    if (inp.action && !state.inspect && !state.study){
      const aimed = (typeof inp.action === 'object') ? hitAt(inp.action.x, inp.action.y) : null;
      if (aimed && aimed.type === 'photo'){
        state.inspect = {sp: aimed.sp, wx: aimed.wx, cy: aimed.cy, z: aimed.z, w: aimed.w,
                         cap: aimed.cap, link: aimed.link, beat: aimed.beat, table: false, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'photoTable'){
        state.inspect = {sp: aimed.sp, wx: aimed.wx, lz: aimed.lz, w: aimed.w,
                         cap: aimed.cap, beat: aimed.beat, table: true, amt: 0};
        cam.vel = 0;
      } else if (aimed && aimed.type === 'album'){
        const open = (albumAnim[aimed.beat] || 0) > 0.5;
        state.albumLock[aimed.beat] = !open;
      } else if (aimed && aimed.type === 'focus'){
        if (state.focusBeat === aimed.beat){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
        else { state.focusBeat = aimed.beat; state.focusAnchor = aimed.anchor != null ? aimed.anchor : null;
               cam.zTarget = CFG.focusCamZ; cam.vel = 0; }
      } else if (aimed && aimed.type === 'study'){
        openStudy(aimed.beat);
      } else {
        // empty space is empty: a click there only releases a focus,
        // it never opens anything the visitor didn't aim at
        if (state.focusBeat >= 0){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
      }
    }
    if (state.focusBeat >= 0){
      if (Math.abs(inp.impulse) > 250){ state.focusBeat = -1; state.focusAnchor = null; cam.zTarget = 0; }
      else {
        // glued to what was clicked while focused
        const b = BEATS[state.focusBeat];
        const ax = state.focusAnchor != null ? state.focusAnchor : b.x;
        cam.x += (ax - cam.x) * Math.min(1, dt*4);
        cam.vel = 0;
      }
    }
  } else {
    // attract autopilot: it stops only at real compositions — landmark
    // stands, recreations, the factory, the stage — and it brakes so the
    // apex lands exactly at screen center, never short, never past
    const A = state.attract;
    if (A.phase === 'cruise'){
      if (A.stopX == null){
        let best = null;
        for (const sx of ATTRACT_STOPS) if (sx > cam.x + 60 && (best == null || sx < best)) best = sx;
        A.stopX = best != null ? best : WORLD_END + 9999;
      }
      const d = A.stopX - cam.x;
      const target = Math.min(CFG.attractCruise, Math.max(70, d * 1.15));
      cam.vel += (target - cam.vel) * Math.min(1, dt*4);
      if (d < 6){
        cam.x = A.stopX; cam.vel = 0;
        A.atFinale = Math.abs(A.stopX - FIN_X) < 10;
        A.phase = 'dwell'; A.dwell = A.atFinale ? -2.4 : 0; A.stopX = null;
      }
      if (cam.x > WORLD_END + 220) A.phase = 'fadeout';
    } else if (A.phase === 'dwell'){
      cam.vel *= Math.pow(0.001, dt);
      A.dwell += dt;
      if (A.dwell > CFG.attractDwell) A.phase = A.atFinale ? 'fadeout' : 'cruise';   // the story ends on the packshot, then loops
    } else if (A.phase === 'fadeout'){
      cam.vel *= Math.pow(0.01, dt);
      A.fade = Math.min(1, A.fade + dt*1.2);
      if (A.fade >= 1){ cam.x = INTRO_X; cam.vel = 0; cam.z = 430; cam.zTarget = 430; state.introHold = true; A.phase = 'fadein'; A.beatIdx = -1; }
    } else if (A.phase === 'fadein'){
      A.fade = Math.max(0, A.fade - dt*1.2);
      if (A.fade <= 0){ A.phase = 'dwell'; A.dwell = -2.2; }
    }
  }

  // physics
  cam.vel = Math.max(-CFG.maxVel, Math.min(CFG.maxVel, cam.vel));
  cam.vel *= Math.pow(Math.E, -CFG.friction * dt);
  cam.x += cam.vel * dt;

  // ---- the yard video splice ----
  const SE = spliceEdges();
  if (state.splice){
    const S = state.splice;
    S.t += dt;
    cam.vel = 0;
    if (SEAM_VIDEO && SEAM_VIDEO.videoWidth){
      cam.x = S.from;
      if (SEAM_VIDEO.ended || S.skip) S.done = true;
    } else {
      // placeholder until the clip exists: a breath of light, and we are there
      cam.x = S.t < SPLICE.dur/2 ? S.from : S.to;
      if (S.t >= SPLICE.dur || S.skip) S.done = true;
    }
    if (S.done){
      cam.x = S.to + S.dir * 8;
      cam.vel = S.dir * 260;
      state.spliceSide = S.dir > 0 ? 'R' : 'L';
      state.splice = null;
    }
  } else {
    if (cam.x < SE.inL - 2){ state.spliceSide = 'L'; state.spliceArm = 0; }
    else if (cam.x > SE.outR + 2){ state.spliceSide = 'R'; state.spliceArm = 0; }
    else {
      // the rail ends here: hold the composition — this is the clip's first frame
      const dir = state.spliceSide === 'L' ? 1 : -1;
      const from = dir > 0 ? SE.inL : SE.outR;
      cam.x = from; cam.vel = 0;
      state.spliceArm = (state.spliceArm || 0) + dt;
      const push = dir > 0 ? inp.impulse > 140 : inp.impulse < -140;
      const go = state.mode === 'live'
        ? (push && state.spliceArm > 0.3)
        : state.spliceArm > 3.0;
      if (go){
        state.splice = {dir, t: 0, from, to: dir > 0 ? SE.outR : SE.inL};
        if (SEAM_VIDEO){ try { SEAM_VIDEO.currentTime = 0; SEAM_VIDEO.play(); } catch(err){} }
      }
    }
  }
  if (state.splice && inp.action) state.splice.skip = true;

  // soft bounds
  // a click on the rule glides there; any real input cancels the trip
  if (state.glide != null){
    if (Math.abs(inp.impulse) > 40) state.glide = null;
    else {
      cam.x += (state.glide - cam.x) * Math.min(1, dt * 4.5);
      cam.vel = 0;
      if (Math.abs(state.glide - cam.x) < 8){ cam.x = state.glide; state.glide = null; }
    }
  }
  if (cam.x < INTRO_X - 1000){ cam.x = INTRO_X - 1000; cam.vel = Math.max(0, cam.vel); }
  if (cam.x > WORLD_END + 300){ cam.x = WORLD_END + 300; cam.vel = Math.min(0, cam.vel); }

  // beat magnetism when slow (live mode, not focused)
  if (state.mode === 'live' && state.focusBeat < 0 && Math.abs(cam.vel) < CFG.magnetVel){
    const nb = nearestBeat(cam.x);
    if (nb.d < CFG.magnetDist){
      cam.vel += (BEATS[nb.i].x - cam.x) * CFG.magnetK * dt * 0.6;
    }
  }

  // rest detection (for description reveal)
  const nb = nearestBeat(cam.x);
  if (nb.d < 120 && Math.abs(cam.vel) < 30){
    if (state.restBeat === nb.i) state.restTime += dt;
    else { state.restBeat = nb.i; state.restTime = 0; }
  } else { state.restBeat = -1; state.restTime = 0; }

  // the opening close-up releases on the first real movement
  if (state.introHold && (Math.abs(cam.vel) > 60 || Math.abs(cam.x - INTRO_X) > 350)){
    state.introHold = false;
    cam.zTarget = 0;
  }
  state.introFade += ((state.introHold ? 1 : 0) - state.introFade) * Math.min(1, dt*2.2);

  // the finale packshot: coming to rest on the product still life pulls the
  // camera in, cinema-tight; leaving lets the hall back in
  if (!state.study && !state.inspect && state.focusBeat < 0 && !state.introHold){
    if (!state.finHold && cam.x > FIN_X - 170 && cam.vel > -40){ state.finHold = true; cam.zTarget = 430; }
    else if (state.finHold && (cam.x < FIN_X - 300 || cam.vel < -60)){ state.finHold = false; if (!state.introHold) cam.zTarget = 0; }
    if (state.finHold){
      // one ending only: the camera glues onto the packshot — but a pull
      // backward always breaks the hold, no trap
      cam.x += (FIN_X - cam.x) * Math.min(1, dt*2.5);
      if (cam.vel > 0) cam.vel *= Math.pow(0.005, dt);
    }
  } else if (state.finHold && state.focusBeat >= 0){ state.finHold = false; }
  state.finFade = (state.finFade || 0) + ((state.finHold ? 1 : 0) - (state.finFade || 0)) * Math.min(1, dt*2.2);

  // dolly
  cam.z += (cam.zTarget - cam.z) * Math.min(1, dt*3);
}

/* ---------------- FRAME ---------------- */
function frame(){
  const t = state.time;
  HITS = [];
  BR = (Math.sin(t*0.32)*6 + Math.sin(t*0.11)*3) * Math.min(1, Math.abs(cam.vel)/140);
  // base — ambient color drifts cooler era by era
  const amb = ambient(cam.x);
  ctx.fillStyle = `rgb(${amb.bg[0]|0},${amb.bg[1]|0},${amb.bg[2]|0})`;
  ctx.fillRect(0, 0, W, H);

  drawFloor();
  drawWall();
  // recreations stand proud of the deeper era walls — they paint on top
  drawMapWall(t);
  drawRec3(t);
  drawRec2(t);
  drawRec4(t);

  // lamp pools on wall (behind photos) — one per ceiling fixture
  for (let i = 0; i < LIGHT_GRID.length; i++) drawLampPool(LIGHT_GRID[i].x, lampFlicker(t, i+1));

  drawTallUnits();      // furniture against the wall, before anything hung on it
  drawIntro();
  drawOutro();
  drawSheets();

  // wall layer: photos and panels sit deepest
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 3400) continue;
    for (const it of b.wall){
      const sp = SPRITES[it.img]; if (!sp) continue;
      // sized on the era's text plane (equal framing everywhere), but
      // riveted to the wall for motion — the rivet law
      const wz = it.pz != null ? it.pz : (segAt(b.x).tz || wallZAt(b.x)) - 12;
      const ax = it.pz != null ? px(b.x + it.dx, k(it.pz))
                               : wallSX(b.x, it.dx, k(wz));
      rivet('wall:' + (it.img || '') + ':' + b.x, ax, k(it.pz != null ? it.pz : exhibitZ(b.x)));
      drawSprite(sp, b.x + it.dx, it.cy, wz, it.w, it.rot || 0, null,
                 {type:'photo', sp, wx: b.x + it.dx, cy: it.cy, z: wz, w: it.w, cap: it.cap, link: it.link, beat: i}, ax);
      if (it.cap){
        const kk = k(wz);
        const seg = segAt(b.x);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = eraFont(19 * kk * SS, '', seg.font);
        ctx.fillStyle = `rgba(${seg.ink},0.55)`;
        const hW = it.w * (sp.inner.h / sp.inner.w);
        ctx.fillText(it.cap, ax, py(it.cy + hW/2 + 44, kk));
        ctx.restore();
      }
    }
    if (b.plasma) drawPlasmaPanel(b, t);
  }
  drawBanners(t);
  drawProjectors(t, 'light');   // light lands on the WALL; the bench will crop it

  // mid-ground: people and machines stand in front of the wall...
  drawStage(t);
  drawFigures();
  drawProps(true);

  drawBench();
  drawProjectors(t, 'machine');   // it stands on the bench, so it comes after it

  // table items
  drawFactory(t);
  drawFinaleTable(t);
  drawProps(false);
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 3400) continue;
    for (const it of b.table){
      const sp = SPRITES[it.img]; if (!sp) continue;
      drawLyingPrint(sp, b.x + it.dx, it.lz, it.w, it.rot || 0,
                     {type:'photoTable', sp, wx: b.x + it.dx, lz: it.lz, w: it.w, cap: it.cap, beat: i});
    }
    for (const it of (b.st || [])){
      const sp = SPRITES[it.img]; if (!sp) continue;
      const hW = sp.h * (it.w / sp.inner.w);
      drawStandingPrint(sp, b.x + it.dx, it.lz, it.w,
        {type:'photo', sp, wx: b.x + it.dx, cy: CFG.benchY - hW/2, z: it.lz, w: it.w, cap: it.cap, beat: i});
    }
    for (const p of (b.props || [])) drawMonitor(p, b.x + p.dx, p.lz, p.w, t);
    if (b.album) drawAlbum(b, i, t, state.dt || 0.016);
    if (b.pyr) drawBookPyramid(b, t);
  }


  // lamps + dust + foreground — evenly spaced fixtures per era
  for (let i = 0; i < LIGHT_GRID.length; i++){
    const L = LIGHT_GRID[i];
    // a plate brings its own lamp; the hall's fixture would hang in front of it
    if (PLATES.some(p => p.sp && Math.abs(L.x - p.x) < p.w * 0.5)) continue;
    // the cool eras keep their light but lose the fixture: a black slab hung
    // over the numerals was reading as a bar across the composition
    if (L.seg.lamp === 'tube') continue;
    drawLamp(L.x, t, i+1);
  }
  drawDust(t);

  // a focus dolly turns the hall down: everything painted so far recedes,
  // the headline and the pedestal (drawn after) carry the frame alone
  const focusA = state.focusBeat >= 0 ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
  if (focusA > 0.01){
    ctx.fillStyle = `rgba(3,4,6,${(0.45*focusA).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // the floating text reads above everything — walls, tables, even the lamps
  for (let i = 0; i < BEATS.length; i++){
    const b = BEATS[i];
    if (Math.abs(b.x - cam.x) > 3400) continue;
    const focusAmt = state.focusBeat === i ? Math.min(1, cam.z / CFG.focusCamZ) : 0;
    drawBeatText(b, focusAmt);
  }

  // hero pass: as you pass a landmark stand, the world dims and a spotlight takes it
  let hero = 0;
  for (const b of BEATS){
    if (!b.ped) continue;
    const pedX = b.x + (b.ped.dx ?? -430);
    const d = Math.abs(pedX - cam.x);            // catharsis lands dead center
    const h = Math.max(0, 1 - d/680);
    hero = Math.max(hero, h*h*(3-2*h));
  }
  // the factory line, the stage and the 1979 map have their apex at center too
  for (const hx of [FACT_X, STAGE_X]){
    const h = Math.max(0, 1 - Math.abs(hx - cam.x)/680);
    hero = Math.max(hero, h*h*(3-2*h) * 0.7);
  }
  const hMap = (() => {
    const h = Math.max(0, 1 - Math.abs((REC_L + REC_R)/2 - cam.x)/680);
    return h*h*(3-2*h);
  })();
  hero = Math.max(hero, hMap * 0.85);
  state.hero = hero;
  if (hero > 0.01){
    ctx.fillStyle = `rgba(2,2,3,${(0.38*hero).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  for (const b of BEATS) if (b.ped && Math.abs(b.x - cam.x) < 2000) drawPedestal(b, t, hero);
  drawMapHero(t, hMap);
  drawRec2Front(t);      // the milled crown belongs to the near plane, in front of its portal
  // the founding bench stands IN FRONT of its own year: the numerals are
  // painted on the wall behind it, so the still life passes over them the way
  // any object in the room passes over what is written on the plaster
  drawPlates(t);
  drawBenchDescs();

  drawForeground();
  drawDoorway();
  if (Math.max(state.introFade, state.finFade || 0) > 0.01){
    // packshot curtains: the welcome and the finale both close their frame
    const IF = Math.max(state.introFade, state.finFade || 0);
    const edge = 300*SS, soft = 640*SS;
    for (const s of [-1, 1]){
      const x0 = W/2 + s*edge, x1 = W/2 + s*(edge + soft);
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, 'rgba(6,4,2,0)');
      g.addColorStop(1, `rgba(6,4,2,${(0.97*IF).toFixed(3)})`);
      ctx.fillStyle = g;
      ctx.fillRect(Math.min(x0,x1), 0, soft, H);
      ctx.fillStyle = `rgba(6,4,2,${(0.97*IF).toFixed(3)})`;
      if (s > 0) ctx.fillRect(x1, 0, Math.max(0, W - x1), H);
      else ctx.fillRect(0, 0, Math.max(0, x1), H);
    }
  }
  drawSeamVideo();
  drawBloom();
  drawGrade(t);
  drawProgress(t);
  drawMusicMark();
  drawDebug();
  drawStudy();
  drawClip();      // the speaker's voice — a video window above the page
  drawInspect();   // a person card opens above the reading page
  drawAttractHint(t);
  // pointer affordance
  if (Input.hover && state.mode === 'live'){
    document.body.style.cursor = musicMarkHit(Input.hover) ? 'pointer'
      : ruleHit(Input.hover) ? 'ew-resize'
      : ((!state.inspect && hitAt(Input.hover.x, Input.hover.y)) ? 'pointer' : '');
  }

  // attract fade
  if (state.attract.fade > 0){
    ctx.fillStyle = `rgba(5,2,0,${state.attract.fade})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (DEBUG){
    ctx.fillStyle = '#0f0'; ctx.font = `${14*SS}px monospace`; ctx.textAlign = 'left';
    ctx.fillText(`x=${cam.x|0} v=${cam.vel|0} mode=${state.mode} fps=${fps|0}`, 10, 20*SS);
  }
}

/* ---------------- MAIN LOOP ---------------- */
const DEBUG = /debug/.test(location.search);
let last = 0, fps = 60, qFrames = 0, qCool = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016);
  last = ts;
  fps = fps*0.95 + (1/Math.max(dt,1e-3))*0.05;
  // adaptive quality: weak hardware renders smaller, CSS upscales.
  // wide hysteresis + a long cool-down — the buffer must never oscillate,
  // reallocating it mid-motion is what reads as a doubled frame
  if (qCool > 0) qCool--;
  else if (++qFrames > 150){
    qFrames = 0;
    if (fps < 36 && RQ > 0.55){ RQ = Math.max(0.55, RQ - 0.15); resize(); qCool = 900; }
    else if (fps > 59 && RQ < 1){ RQ = Math.min(1, RQ + 0.15); resize(); qCool = 900; }
  }
  // a tab that boots hidden measures 0x0 — never draw a zero frame
  if (!W || !H){ resize(); if (!W || !H){ requestAnimationFrame(loop); return; } }
  update(dt);
  frame();
  requestAnimationFrame(loop);
}

/* ---------------- BOOT ---------------- */
async function boot(){
  resize();
  applyCut();          // before anything reads a beat position
  await loadAssets();
  if (PHOTO_SKIN) await loadPhotoSkin();
  await loadPlates();
  TEX.wall1 = woodTexture({plank:'v', plankSize:150, base:'#20150b', light:'#372712', w:1400, h:900});
  TEX.bench1 = woodTexture({plank:'h', plankSize:110, base:'#3a2812', light:'#5a4020', w:1200, h:512});
  TEX.front1 = woodTexture({plank:'v', plankSize:190, base:'#170f07', light:'#2a1c0c', w:1200, h:600});
  TEX.wall2 = panelTexture({w:1400, h:900, base:'#5d5b47', groove:300});
  TEX.bench2 = formicaTexture({w:1200, h:512});
  TEX.front2 = panelTexture({w:1200, h:600, base:'#39392f', groove:220});
  TEX.wall3 = panelTexture({w:1400, h:900, base:'#71746c', groove:470});
  TEX.bench3 = formicaTexture({w:1200, h:512, base:'#a09a8e'});
  TEX.front3 = panelTexture({w:1200, h:600, base:'#45463f', groove:240});
  TEX.wall4 = panelTexture({w:1400, h:900, base:'#e0e3e6', groove:600});
  TEX.bench4 = formicaTexture({w:1200, h:512, base:'#eef0f2'});
  TEX.front4 = panelTexture({w:1200, h:600, base:'#c8ccd0', groove:420});
  if (PHOTO_SKIN) applyPhotoTextures();
  cacheWrap();
  TEX.outside = makeOutside();
  SECTIONS.old = makeSection('old');
  SECTIONS.neu = makeSection('neu');
  initSeamVideo();
  initProjectors();
  initMusic();
  MAP_SPRITE = makeMapSprite();
  USA_SPRITE = makeUsaSprite();
  MONS.crt = makeMonitor('crt');
  MONS.lcd = makeMonitor('lcd');
  for (let i = 0; i < 3; i++) grains.push({c: noiseTile(256, 1)});
  // build sprites — tone and framing by era
  const eraStyle = [
    {wall:'frame',   table:'print',  tone:'sepia(0.55) saturate(0.7) contrast(1.05) brightness(0.95)'},
    {wall:'metal',   table:'print2', tone:'sepia(0.22) saturate(0.82) contrast(1.03)'},
    {wall:'plastic', table:'print2', tone:'saturate(0.9) contrast(1.02)'},
    {wall:'white',   table:'print2', tone:'saturate(0.96) contrast(1.02)'},
  ];
  const spec = {};
  for (const b of BEATS){
    const es = eraStyle[segIdx(b.x)];
    for (const it of b.wall) spec[it.img] = {style: it.style || es.wall, tone:es.tone};
    for (const it of (b.st || [])) spec[it.img] = {style: it.style || es.wall, tone:es.tone};
    for (const it of b.table) spec[it.img] = {style:es.table, tone:es.tone};
  }
  for (const [n, o] of Object.entries(spec)){
    const sp = makePrint(n, o);
    if (sp) SPRITES[n] = sp;
  }
  PED_SPRITES.crown = makePedObj('crown');
  PED_SPRITES.logo1970 = makePedObj('logo1970');
  PED_SPRITES.logoG = makePedObj('logoG');
  PED_SPRITES.bizcard = makePedObj('bizcard');
  PED_SPRITES.puck = makePedObj('puck');
  PED_SPRITES.scanner = makePedObj('scanner');
  PED_SPRITES.dataTooth = makePedObj('dataTooth');
  PED_SPRITES.crown2 = makePedObj('crown2');
  PED_SPRITES.millSt = makePedObj('millSt');
  for (const pid in PEOPLE)
    if (IMGS[PEOPLE[pid].img]) PERSON_SPRITES[pid] = makePrint(PEOPLE[pid].img, {style:'white'});
  initAlbums();
  // wall photos live in the band below the text (top 360, bottom 690) —
  // and always on an actual wall, never over a gap or a column
  for (const b of BEATS){
    const seg = segAt(b.x);
    const wallL = seg.x0 + (seg.wInsetL || 0), wallR = seg.x1 - (seg.wInsetR || 0);
    for (const it of b.wall){
      const sp = SPRITES[it.img]; if (!sp) continue;
      let h = sp.h * (it.w / sp.inner.w);
      if (h > 330){ it.w *= 330 / h; h = 330; }
      it.cy = 360 + h/2;
      const half = sp.w * (it.w / sp.inner.w) / 2 + 30;
      const x = b.x + it.dx;
      if (x - half < wallL) it.dx = wallL + half - b.x;
      if (x + half > wallR) it.dx = wallR - half - b.x;
    }
  }
  // cross-beat pass: no two wall photos may overlap anywhere on the line —
  // greedy left-to-right separation inside each photo's own wall extents
  {
    const items = [];
    for (const b of BEATS)
      for (const it of b.wall){
        const sp = SPRITES[it.img]; if (!sp) continue;
        const half = sp.w * (it.w / sp.inner.w) / 2 + 30;
        const seg = segAt(b.x);
        items.push({b, it, half,
                    wallL: seg.x0 + (seg.wInsetL || 0), wallR: seg.x1 - (seg.wInsetR || 0)});
      }
    items.sort((p, q) => (p.b.x + p.it.dx) - (q.b.x + q.it.dx));
    for (let i = 1; i < items.length; i++){
      const a = items[i-1], c = items[i];
      const gap = (c.b.x + c.it.dx - c.half) - (a.b.x + a.it.dx + a.half);
      if (gap >= 24) continue;
      const need = 24 - gap;
      const cMax = c.wallR - c.half - (c.b.x + c.it.dx);   // room to the right
      const push = Math.min(need, Math.max(0, cMax));
      c.it.dx += push;
      const rest = need - push;
      if (rest > 0) a.it.dx -= Math.min(rest, Math.max(0, (a.b.x + a.it.dx - a.half) - a.wallL));
    }
  }
  initBanners();
  initCapLanes();
  initTables();
  initLights();
  initAttractStops();
  initDust();
  initDecor();
  snapPlatesToTables();
  clearPlateBays();
  attachMouseDriver(document.body);
  auditStatics();
  window.__photoSkinReady = true;
  if (/[?&]audit/.test(location.search)) setTimeout(auditRivets, 400);
  requestAnimationFrame(loop);
}
window.addEventListener('load', boot);   // assets block sits below — wait for it
</script>
