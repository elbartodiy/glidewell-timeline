/* Every important camera moment is a guarded zone. Anything from the near or
   mid plane that would sit across it gets moved or removed — checked in code,
   not by eye, so new content can never reintroduce the collision. */
function auditPlacements(){
  const guards = [];
  for (const b of BEATS){
    if (b.ped){
      const pedX = b.x + (b.ped.dx ?? -430);
      guards.push({c: pedX, r: 750, pedX, pedZ: -90});
    }
    if (b.rig) guards.push({c: b.x + (b.rig.dx || 0), r: 560});
    if (!b.minor) guards.push({c: b.x, r: 420});
  }
  // near plane: a passer-by parks at screen center when cam ≈ its x
  for (let i = FG_ITEMS.length - 1; i >= 0; i--){
    if (guards.some(g => Math.abs(FG_ITEMS[i].x - g.c) < g.r * 1.3)){
      console.warn('audit: foreground item removed at', FG_ITEMS[i].x);
      FG_ITEMS.splice(i, 1);
    }
  }
  // mid plane: a figure crosses a pedestal or a wall photo on screen at one
  // camera position — that position must stay outside the guarded window
  const kOf = z => 900 / (900 + z);
  const crossTargets = guards.filter(g => g.pedX)
    .map(g => ({x: g.pedX, z: g.pedZ, c: g.c, r: g.r}));
  for (const b of BEATS)
    for (const it of b.wall)
      crossTargets.push({x: b.x + it.dx, z: it.pz != null ? it.pz : wallZAt(b.x) - 8, c: b.x, r: 520});

    for (const g of crossTargets){
      const kP = kOf(g.z), kF = kOf(f.z);
      if (Math.abs(kP - kF) < 0.05){
        // near-same depth: they simply must not overlap in world space —
        // and they step aside on their own side, never marching across the hall
        const dirN = f.x >= g.x ? 1 : -1;
        for (let tries = 0; tries < 10 && Math.abs(f.x - g.x) < 430; tries++) f.x += 240 * dirN;
        continue;
      }
      const dirC = f.x >= g.c ? 1 : -1;
      for (let tries = 0; tries < 10; tries++){
        const cross = (g.x * kP - f.x * kF) / (kP - kF);
        if (Math.abs(cross - g.c) > g.r * 1.05) break;
        f.x += 240 * dirC;
        if (tries === 9) console.warn('audit: figure could not fully clear target near', g.x);
      }

}
function drawSheets(){
  for (const sh of SHEETS){
    if (Math.abs(sh.x - cam.x) > 3200) continue;
    const kk = k(wallZAt(sh.x) - 10);
    const sx = px(sh.x, kk);
    if (sx < -300 || sx > W + 300) continue;
    const scale = (sh.w / sh.sprite.w) * kk * SS;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(sx, py(sh.cy, kk));
    ctx.rotate(sh.rot * Math.PI/180);

  }
}
function drawFigures(){
  for (const f of FIGURES){
    if (Math.abs(f.x - cam.x) > 2200) continue;
    const kk = k(f.z);
    const sx = px(f.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (f.h / f.sprite.h) * kk * SS;
    const syFoot = py(f.seated ? 900 : 1080, kk);
    // the sprites are near-black. Against the wood and plaster of the analog
    // century that reads as a person standing in shadow; against the white
    // rooms it read as a hole cut in the wall, so it thins out with the era.
    contactShadow(sx, syFoot, f.sprite.w * scale * 0.55, segIdx(f.x) <= 1 ? 0.36 : 0.16);
    ctx.globalAlpha = segIdx(f.x) <= 1 ? 0.92 : 0.32;
    ctx.drawImage(f.sprite.c, sx - f.sprite.w*scale/2, syFoot - f.sprite.h*scale,

}
function drawProps(midPass){
  for (const p of PROPS){
    /* era 1's counter is a photograph up to the cabinet: things standing on a
       painted surface take a lifted foot, or they read sunk below its lip */
    if (p._lifted == null){ p._lifted = (p.x < PLATE_FROM) ? 26 : 0; }
    if (midPass === 'late'){ if (!p.late) continue; }
    else if ((!!p.mid) !== !!midPass || p.late) continue;
    if (Math.abs(p.x - cam.x) > 2200) continue;
    const sp = PROP_SPRITES[p.kind];
    const kk = k(p.mid ? p.z : bz(p.z));
    const sx = px(p.x, kk);
    if (sx < -260 || sx > W + 260) continue;
    const scale = (p.w / sp.w) * kk * SS;
    const syFoot = (p.mid && midPass !== 'late') ? py(1080, kk) : py(CFG.benchY - 2 - p._lifted, kk);
    /* The join. Every one of these was a single drawImage with nothing under
       it, so fifty objects hovered a hair above the counter in every frame —
       while a mere pinned photograph got a proper contact shadow. An object
       without a shadow is not on a surface, it is in front of one, and no
       amount of detail in the sprite itself will fix that. */
    const pw2 = sp.w * scale, ph2 = sp.h * scale;
    contactShadow(sx, syFoot, pw2, 0.42);
    // and the dark line where it actually meets the surface
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(sx - pw2 * 0.30, syFoot - 1.4 * SS, pw2 * 0.60, 2.4 * SS);
    ctx.save();
    if (p.flip){ ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    ctx.globalAlpha = 0.95;
    ctx.drawImage(sp.c, sx - pw2/2, syFoot - ph2, pw2, ph2);
    ctx.restore();

}

function drawAlbum(b, i, t, dt){

  const open = lockV === true ||

function drawPedestal(b, t, hero){
  const ped = b.ped; if (!ped) return;
  const z = -90, kk = k(z);
  const x = b.x + (ped.dx ?? -430);
  const sx = px(x, kk);
  const colW = 165 * (ped.big ? 1.35 : (ped.vitrine ? 0.8 : 1)) * kk * SS;
  if (sx < -colW*2 || sx > W + colW*2) return;
  const era = segIdx(b.x);
  const big = ped.big ? 1.3 : 1;
  const yTop = py(ped.big ? 540 : (ped.low ? 668 : (ped.vitrine ? 625 : 535)), kk);
  pushHit(sx - colW*0.7*big, yTop - 150*kk*SS*big, colW*1.4*big, H - yTop + 150*kk*SS, {type:'focus', beat: BEATS.indexOf(b), anchor: x});
  const warmC = era === 0 ? '255,215,140' : '225,240,255';
  // two side spotlights swing in and lock their beams exactly on the exhibit;
  // brightness peaks AT the object, then the light falls away
  if (hero > 0.02 && !ped.vitrine){   // a vitrine glows from its own capsule — no crossed spotlights
    const lock = Math.min(1, hero * 1.7);
    const objSprite = PED_SPRITES[ped.obj];
    const objH = 120 * (ped.big ? 1.3 : 1) * kk * SS * objSprite.h / objSprite.w;
    const yObj = yTop - objH * 0.6;
    /* A BEAM DIES ON WHAT IT LIGHTS. Two fixtures cross their beams on the
       exhibit, which is right — but the beams ran on to halfway down the screen
       past the crossing point, and past a crossing they diverge again. Two
       beams became four shafts spreading across the whole room: a soft X over
       the counter, the wall and the year. Ending them just below the plinth's
       cap means they converge and stop, which is what a spotlight does. */
    /* the beam RUNS ON past the exhibit: brightest where it lands, then a long
       slow death down the table's face — starting to fade at the counter's
       height and gone by the middle of the front. Nothing is cut. */
    const yEnd = py(885, kk);
    for (const s of [-1, 1]){
      const fx = sx + s * colW * 3.0;                    // the fixture, up top
      // beam direction: straight down -> through the exhibit, by lock
      const xEnd = fx + ((sx - fx) * (yEnd / Math.max(1, yObj))) * lock;
      const tObj = Math.max(0.05, Math.min(0.8, yObj / yEnd));
      const tAbove = Math.max(tObj + 0.04, Math.min(0.9, py(628, kk) / yEnd));
      const tTable = Math.max(tAbove + 0.04, Math.min(0.95, py(700, kk) / yEnd));
      /* wider at the foot, and the power starts leaking just ABOVE the table:
         from there down it is haze, not beam */
      softBeam(fx, xEnd, 0, yEnd, colW * 0.22, colW * 0.48, warmC, hero,
               [[0, 0.12], [tObj, 1], [tAbove, 0.55], [tTable, 0.26],
                [tTable + (1 - tTable) * 0.5, 0.09], [1, 0]]);
      // the fixture itself
      ctx.fillStyle = 'rgba(20,20,22,0.9)';
      ctx.fillRect(fx - 9*SS, 0, 18*SS, 12*SS);
      ctx.fillStyle = `rgba(${warmC},${(0.75*hero).toFixed(2)})`;
      ctx.fillRect(fx - 5*SS, 10*SS, 10*SS, 4*SS);
    }

  } else {
    cg.addColorStop(0, '#5e6266'); cg.addColorStop(.45, '#9aa0a4'); cg.addColorStop(1, '#4a4e52');
  }

  // the cap is a real cylinder slice: rim wall, top face, edge light
  {
    const rx = colW*0.62, ry = 11*kk*SS, capH = 9*kk*SS;
    const rim = ctx.createLinearGradient(sx - rx, 0, sx + rx, 0);
    if (era === 0){ rim.addColorStop(0,'#2a1809'); rim.addColorStop(.45,'#4e3012'); rim.addColorStop(1,'#1c0f06'); }
    else if (era === 3){ rim.addColorStop(0,'#b6bbc0'); rim.addColorStop(.45,'#e2e6e9'); rim.addColorStop(1,'#9aa0a5'); }
    else { rim.addColorStop(0,'#54585c'); rim.addColorStop(.45,'#8f9599'); rim.addColorStop(1,'#43474b'); }
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.ellipse(sx, yTop + capH, rx, ry, 0, 0, Math.PI);
    ctx.lineTo(sx - rx, yTop);
    ctx.ellipse(sx, yTop, rx, ry, 0, Math.PI, 0, true);
    ctx.closePath(); ctx.fill();
    const topg = ctx.createLinearGradient(sx - rx, yTop - ry, sx + rx, yTop + ry);
    if (era === 0){ topg.addColorStop(0,'#6b4a20'); topg.addColorStop(1,'#4a2d10'); }
    else if (era === 3){ topg.addColorStop(0,'#ffffff'); topg.addColorStop(1,'#dfe3e6'); }
    else { topg.addColorStop(0,'#d7dcdf'); topg.addColorStop(1,'#b4b9bd'); }
    ctx.fillStyle = topg;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2*SS;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx - 0.6*SS, ry - 0.6*SS, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
    /* contact shade where the column meets the cap — CLIPPED to the column:
       drawn wider, its ends hung in the air beside the shaft and read as a
       stray line under the disc */
    ctx.save();
    ctx.beginPath(); ctx.rect(sx - colW/2 + 1*SS, yTop + capH, colW - 2*SS, 14*kk*SS);
    ctx.clip();

    ctx.restore();
  }

  const obj = PED_SPRITES[ped.obj];

}

/* a freestanding table plane, rotated in plan — any yaw, anywhere on the floor */
function drawYawedTable(cx, cz, yawDeg, wW, dW, topY, hW, tone){
  const a = yawDeg * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const P = (lx, lz) => {                     // local table coords -> screen
    const wx = cx + lx*ca - lz*sa, wz = cz + lx*sa + lz*ca;
    return {x: px(wx, k(wz)), kt: k(wz), z: wz};
  };
  const c1 = P(-wW/2, -dW/2), c2 = P(wW/2, -dW/2), c3 = P(wW/2, dW/2), c4 = P(-wW/2, dW/2);
  const top = (p) => py(topY, p.kt), bot = (p) => py(topY + hW, p.kt);
  // legs/skirt: the two faces whose outer edge is nearest the camera
  const faces = [[c1, c2], [c2, c3], [c3, c4], [c4, c1]]
    .filter(([p, q]) => (p.z + q.z)/2 <= cz)       // faces angled toward us
    .sort((f, g) => (g[0].z + g[1].z) - (f[0].z + f[1].z));
  for (const [p, q] of faces){
    const g = ctx.createLinearGradient(0, top(p), 0, bot(p));
    g.addColorStop(0, tone.side0); g.addColorStop(1, tone.side1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x, top(p)); ctx.lineTo(q.x, top(q));
    ctx.lineTo(q.x, bot(q)); ctx.lineTo(p.x, bot(p));
    ctx.closePath(); ctx.fill();
  }
  // the top plane
  ctx.fillStyle = tone.top;
  ctx.beginPath();
  ctx.moveTo(c1.x, top(c1)); ctx.lineTo(c2.x, top(c2));
  ctx.lineTo(c3.x, top(c3)); ctx.lineTo(c4.x, top(c4));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = tone.edge; ctx.lineWidth = 1.5*SS;
  ctx.stroke();
  return {c1, c2, c3, c4, P};
}

/* A six-axis arm, not two sticks and three dots. What made the old one read as
   a toy was that every part was the same width and every joint was a flat
   circle: real links are CASTINGS — wide at the joint they carry, narrow at the
   one they reach with, ribbed down the middle, with the cable conduit slung
   outside the elbow in a loop that moves with the arm. The joints are housings
   with a flange and a boss, seen as a cylinder end rather than a disc. One
   light, from the left, so each link has a lit face and a shaded one. */
function drawArmInside(bx, bz, t, phase, gx0, gx1, yGl, yBase){
  /* An arm inside a cabin has to FIT the cabin, through its whole swing. Ours
     had a 550-unit reach inside a 290-unit aperture, so it swung straight out
     through the glass. The linkage is unchanged and simply scaled to the
     opening — reach set to a little over half the door's height, which is the
     proportion a real cell is built to — and it is pivoted on the cabin's own
     floor, so it stands inside rather than on a plinth of its own. */
  /* The fault was never the scale. The shoulder sat at world 1042 while the
     glass stops at 872 — the arm was bolted 170 units BELOW the bottom of its
     own window, so the clip threw away everything but the tip, which is why it
     read as an insect in a big pane. It is mounted on the cabin floor now, just
     inside the glass, and scaled so its whole reach fills the opening rather
     than so its stump does. */
  const kb = k(bz);
  const sc = Math.max(0.24, Math.min(1.15, (yBase - yGl) * 0.94 / (550 * kb * SS)));
  const bxs = px(bx, kb), bys = yBase - 10 * kb * SS;
  /* THE ENVELOPE. Clipping to the glass was a lie: the arm leaned into the wall
     and simply vanished at the pane's edge instead of hitting anything. A real
     cell solves this the other way round — the arm's travel is limited so it
     cannot reach its own enclosure. Its scaled reach here is about three times
     the pane's half width, so the honest swing is small: work out the angle at
     which the tip would touch the side wall and keep inside it. What you get is
     the tight, deliberate motion of a machine in a box rather than something
     swaying in a breeze. */
  const reach = 550 * sc * kb * SS;
  const room = (gx1 - gx0) * 0.5 - 16 * kb * SS;
  const amp = Math.max(0.10, Math.min(0.55, Math.asin(Math.max(0.05, Math.min(1, room / Math.max(1, reach))))));
  ctx.save();
  ctx.beginPath(); ctx.rect(gx0, yGl, gx1 - gx0, yBase - yGl); ctx.clip();
  ctx.translate(bxs, bys); ctx.scale(sc, sc); ctx.translate(-bxs, -bys);
  ctx.globalAlpha = 0.94;
  drawRobotArm(bx, bz, t, phase, true, amp);
  ctx.restore();
}
function drawRobotArm(bx, bz, t, phase, inside, amp){
  const kk = k(bz);

  const A1 = amp != null ? amp : 0.62, A2 = amp != null ? amp * 0.85 : 0.55;
  const a1 = (amp != null ? -0.06 : -0.35) + A1 * Math.sin(w);
  const a2 = (amp != null ? 0.62 : 0.95) + A2 * Math.sin(w + 1.1);

  const a12 = a1 + a2 - 1.3;
  const j2 = {x: j1.x + Math.sin(a12) * L2, y: j1.y - Math.cos(a12) * L2};

  const bw = 96;
  if (!inside){ // a cell's arm has no plinth of its own: the cabin is its base
  ctx.fillStyle = '#8f959b';
  ctx.beginPath();
  ctx.moveTo(X(bx - bw), Y(1080)); ctx.lineTo(X(bx - bw * 0.72), Y(986));
  ctx.lineTo(X(bx + bw * 0.72), Y(986)); ctx.lineTo(X(bx + bw), Y(1080));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.fillRect(X(bx - bw * 0.70), Y(986), bw * 1.4 * S, 3 * S);
  ctx.fillStyle = 'rgba(20,24,28,0.35)';
  ctx.fillRect(X(bx - bw), Y(1064), bw * 2 * S, Y(1080) - Y(1064));
  for (const s of [-1, 1]){
    ctx.fillStyle = 'rgba(46,52,58,0.75)';
    ctx.beginPath(); ctx.arc(X(bx + s * bw * 0.52), Y(1020), 5 * S, 0, 7); ctx.fill();
  }
  // the turret it slews on
  const tg = ctx.createLinearGradient(X(bx - 56), 0, X(bx + 56), 0);
  tg.addColorStop(0, '#7f858b'); tg.addColorStop(0.34, '#e6e9ec');
  tg.addColorStop(0.68, '#b9bec3'); tg.addColorStop(1, '#6d737a');

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(X(bx), Y(918), 56 * S, 12 * S, 0, 0, 7); ctx.fill();
  }

    ctx.fillStyle = 'rgba(70,58,20,0.9)';
    ctx.beginPath(); ctx.ellipse(X(bx), Y(876), 66 * S, 15 * S, 0, 0, 7); ctx.fill();
  }

     its tip, with a rib down its spine. */
  const link = (a, b, wa, wb, rib) => {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const P = (p, o, wd) => [X(p.x + nx * o * wd), Y(p.y + ny * o * wd)];
    const q = [P(a, -0.5, wa), P(b, -0.5, wb), P(b, 0.5, wb), P(a, 0.5, wa)];

    if (inside){                      // a Fanuc in a cabin is yellow, and lit from behind

      g.addColorStop(0.76, '#8e7220'); g.addColorStop(1, '#5f4c16');
    } else {

    jg.addColorStop(0.7, '#6c7278'); jg.addColorStop(1, '#3d4349');
    ctx.fillStyle = jg;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * S, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(232,236,240,0.45)'; ctx.lineWidth = Math.max(0.8, 1.6 * S);
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * 0.80 * S, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(38,44,50,0.85)';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r * 0.30 * S, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(X(p.x) - r * 0.28 * S, Y(p.y) - r * 0.30 * S, r * 0.16 * S, 0, 7); ctx.fill();
  };

  link(j0, j1, 104, 66, true);        // an upper arm carries the whole reach
  link(j1, j2, 74, 40, true);
  // the maker's stripe at the root of each link — the one warm mark on a machine
  const stripe = (a, b2, wd) => {
    const dx = b2.x - a.x, dy = b2.y - a.y, L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    ctx.fillStyle = inside ? 'rgba(150,34,26,0.85)' : 'rgba(196,46,34,0.88)';
    ctx.beginPath();
    for (const [o, d2] of [[-0.5, 0.10], [0.5, 0.10], [0.5, 0.17], [-0.5, 0.17]])
      ctx.lineTo(X(a.x + ux * L * d2 + nx * o * wd), Y(a.y + uy * L * d2 + ny * o * wd));
    ctx.closePath(); ctx.fill();
  };
  stripe(j0, j1, 96); stripe(j1, j2, 68);
  // the conduit, slung outside the elbow and carried along the forearm
  ctx.strokeStyle = 'rgba(52,58,64,0.62)';
  ctx.lineWidth = Math.max(1.2, 7 * S);
  ctx.beginPath();
  ctx.moveTo(X(j0.x + 40), Y(j0.y + 24));
  ctx.quadraticCurveTo(X(j1.x + 76), Y(j1.y + 40), X(j1.x + 22), Y(j1.y - 6));
  ctx.quadraticCurveTo(X((j1.x + j2.x) / 2 + 26), Y((j1.y + j2.y) / 2), X(j2.x + 12), Y(j2.y + 8));
  ctx.stroke();
  joint(j0, 46); joint(j1, 38);

  ctx.save();
  ctx.translate(X(j2.x), Y(j2.y)); ctx.rotate(wa);
  ctx.fillStyle = '#8d939a';
  ctx.fillRect(0, -14 * S, 26 * S, 28 * S);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, -14 * S, 26 * S, 3 * S);
  const grip = 0.5 + 0.5 * Math.sin(w + 0.5);
  ctx.fillStyle = '#5b6167';
  for (const s of [-1, 1])
    ctx.fillRect(26 * S, s * (5 + 7 * grip) * S - 4 * S, 20 * S, 8 * S);

    ctx.globalAlpha = Math.min(1, (carry - 0.25) * 3);
    const bg2 = ctx.createLinearGradient(X(j2.x) - 18 * S, 0, X(j2.x) + 18 * S, 0);
    bg2.addColorStop(0, '#fbfaf6'); bg2.addColorStop(0.6, '#e6e3da'); bg2.addColorStop(1, '#c6c2b6');
    ctx.fillStyle = bg2;
    ctx.fillRect(X(j2.x) - 17 * S, Y(j2.y) + 26 * S, 34 * S, 26 * S);
    ctx.strokeStyle = 'rgba(90,86,78,0.4)'; ctx.lineWidth = Math.max(0.7, 1 * S);

  /* LIGHT ON THE CELLS. They were standing in the era's flat ambient with
     nothing thrown at them, so arriving at 2019 felt like walking into a

let VIG = null;

  const vg = g.createRadialGradient(VIG.width/2, VIG.height*0.46, VIG.height*0.35, VIG.width/2, VIG.height*0.52, VIG.height*0.95);

function drawGrade(t){
  if (!VIG) makeVignette();
  // the vignette never pops at the era seam: it holds through the BruxZir
  // hero and eases away only as you leave the crown behind
  /* The white era carries less vignette than the analog century — that is the
     point of it. But the ease into it was pinned to the raw world coordinate
     21150, and every cut added to the timeline moved the portal right while
     that number stayed put: it had fallen 4520 units behind, so what was meant
     to be a 900-unit fade had become a step change of 45 per cent in the
     darkness of the whole frame, landing on one world coordinate at the edge of
     the recreation. That is the lightening you can see from across the room. It
     is anchored to the portal itself now, and eased across 2280 units. */
  let sh = segAt(cam.x).shade != null ? segAt(cam.x).shade : 1;
  if (SEGMENTS[3].shade != null){
    const a0 = REC2_L - 300, a1 = REC2_R + 900;
    const tt = Math.max(0, Math.min(1, (cam.x - a0) / (a1 - a0)));

  ctx.globalAlpha = 1;
  // film grain — settles down as time moves forward, and already eases off
  // through the late seventies, before the era even turns

  let gr = ambient(cam.x).grain;
  if (segIdx(cam.x) === 0 && cam.x > SHIFT(2200))
    gr *= 1 - 0.35 * Math.min(1, (cam.x - SHIFT(2200)) / Math.max(1, REC_L - SHIFT(2200)));
  ctx.globalAlpha = gr;
  ctx.fillStyle = g.pat || (g.pat = ctx.createPattern(g.c, 'repeat'));
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* One case, taken off the pile and opened. What was inside every one of those
   forty-eight boxes: an impression of both jaws — and it arrives IN ITS TRAYS.
   The dentist seats the tray, the material sets in the mouth around it, and
   tray and impression travel to the lab together; the lab pours the model out
   of it. An impression without a tray would never have been in the post. */
function drawImpression(cx, cy, w, upper){
  /* Drawn from the photograph. Three materials, and they matter: the tray is a
     pale cream, the impression is a vivid orchid, and the handle is stamped
     metal with a hole through it. The teeth are the point — fourteen distinct
     forms pressed into the material, each one a hollow with a lit rim, wide at
     the back and narrow at the front, not a row of dots. */
  const h = w * 0.94;
  const A0 = Math.PI * 0.08, A1 = Math.PI * 0.92;
  const orx = w * 0.50, ory = h * 0.50;      // the tray
  const prx = w * 0.425, pry = h * 0.435;    // the material, outer
  const irx = w * 0.235, iry = h * 0.255;    // the material, inner
  const arch = (rx, ry, a0, a1) => ctx.ellipse(cx, cy, rx, ry, 0, a0, a1, true);
  ctx.save();

  // the handle, out at the front, behind everything else
  const hw = w * 0.125, hh = w * 0.34, hy = cy - ory * 0.94;
  const hg = ctx.createLinearGradient(cx - hw/2, 0, cx + hw/2, 0);
  hg.addColorStop(0, '#8f959b'); hg.addColorStop(0.34, '#e2e6e9');
  hg.addColorStop(0.62, '#aab1b7'); hg.addColorStop(1, '#767c82');
  ctx.fillStyle = hg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - hw/2, hy - hh, hw, hh + hh * 0.30, hw * 0.34);
  else ctx.rect(cx - hw/2, hy - hh, hw, hh);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,118,126,0.7)'; ctx.lineWidth = 1.1 * SS; ctx.stroke();
  ctx.fillStyle = 'rgba(58,64,70,0.9)';
  ctx.beginPath(); ctx.arc(cx, hy - hh * 0.62, hw * 0.20, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(120,128,136,0.55)';
  ctx.fillRect(cx - hw * 0.26, hy - hh * 0.30, hw * 0.52, hh * 0.045);

  // the tray: a pale block, flat across the open end
  ctx.beginPath(); arch(orx, ory, A0, A1); ctx.closePath();
  const tg = ctx.createLinearGradient(cx - orx, cy - ory, cx + orx * 0.4, cy + ory);
  tg.addColorStop(0, '#f6f2ea'); tg.addColorStop(0.55, '#e4ddd0'); tg.addColorStop(1, '#c3bbab');
  ctx.fillStyle = tg;
  ctx.shadowColor = 'rgba(24,14,20,0.45)'; ctx.shadowBlur = 15 * SS; ctx.shadowOffsetY = 7 * SS;
  ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // the material
  ctx.beginPath();
  arch(prx, pry, A0 + 0.05, A1 - 0.05);
  if (upper){ ctx.closePath(); }
  else { ctx.ellipse(cx, cy, irx, iry, 0, A1 - 0.05, A0 + 0.05, false); ctx.closePath(); }
  const pg = ctx.createLinearGradient(cx - prx, cy - pry, cx + prx * 0.5, cy + pry);
  pg.addColorStop(0, '#e07ac2'); pg.addColorStop(0.30, '#c74aa2');
  pg.addColorStop(0.68, '#ad2f8b'); pg.addColorStop(1, '#7f1f66');
  ctx.fillStyle = pg; ctx.fill();
  if (upper){
    // the palate, a smooth dome inside the arch
    ctx.beginPath(); ctx.ellipse(cx, cy - h * 0.02, irx * 1.02, iry * 1.02, 0, 0, 7);
    const dg = ctx.createRadialGradient(cx - irx * 0.3, cy - iry * 0.5, irx * 0.1,
                                        cx, cy - h * 0.02, irx * 1.1);
    dg.addColorStop(0, '#d264b2'); dg.addColorStop(1, '#94266f');
    ctx.fillStyle = dg; ctx.fill();
  }

  // fourteen teeth, wide at the back and close at the front
  const mrx = (prx + irx) / 2, mry = (pry + iry) / 2, band = (prx - irx);
  for (let i = 0; i < 14; i++){
    const t2 = (i + 0.5) / 14;
    const th = Math.PI * 0.12 - t2 * Math.PI * 1.24;
    const px2 = cx + Math.cos(th) * mrx, py2 = cy + Math.sin(th) * mry;
    const back = Math.abs(t2 - 0.5) * 2;                  // 0 at the front, 1 at the back
    const tw = band * (0.30 + 0.30 * back), tl = band * (0.40 + 0.12 * back);
    ctx.save();
    ctx.translate(px2, py2); ctx.rotate(th + Math.PI / 2);
    ctx.fillStyle = 'rgba(96,22,74,0.92)';                // the hollow
    ctx.beginPath(); ctx.ellipse(0, 0, tw, tl, 0, 0, 7); ctx.fill();
    if (back > 0.45){                                     // molars keep their cusps
      ctx.fillStyle = 'rgba(140,44,110,0.8)';
      for (const [ox2, oy2] of [[-tw*0.38, -tl*0.34], [tw*0.38, -tl*0.34],
                                [-tw*0.38, tl*0.34], [tw*0.38, tl*0.34]]){
        ctx.beginPath(); ctx.ellipse(ox2, oy2, tw * 0.34, tl * 0.30, 0, 0, 7); ctx.fill();
      }
    }
    ctx.strokeStyle = 'rgba(244,178,222,0.55)';           // the lit rim of the hollow
    ctx.lineWidth = Math.max(0.8, tw * 0.16);
    ctx.beginPath(); ctx.ellipse(0, -tl * 0.06, tw * 0.96, tl * 0.94, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.restore();
  }

  // the wet look, only on the material
  ctx.save();
  ctx.beginPath();
  arch(prx, pry, A0 + 0.05, A1 - 0.05);
  if (upper) ctx.closePath();
  else { ctx.ellipse(cx, cy, irx, iry, 0, A1 - 0.05, A0 + 0.05, false); ctx.closePath(); }
  ctx.clip();
  const sg = ctx.createLinearGradient(cx - prx, cy - pry, cx - prx * 0.1, cy + pry * 0.4);
  sg.addColorStop(0, 'rgba(255,228,248,0.50)');
  sg.addColorStop(0.45, 'rgba(255,228,248,0.07)');
  sg.addColorStop(1, 'rgba(255,228,248,0)');
  ctx.fillStyle = sg; ctx.fillRect(cx - prx, cy - pry, prx * 2, pry * 2);
  ctx.restore();
  ctx.restore();
}
function drawBits(cx, cy, w, dz, seed){
  const h = w * 0.94, rx = w * 0.5, ry = h * 0.5, ix = w * 0.29, iy = h * 0.31;
  const R = rng(seed);
  ctx.textAlign = 'center';
  for (let i = 0; i < 220; i++){
    const t2 = R(), rr = R(), thr = R() * 0.60, ch = R() < 0.5 ? '0' : '1';
    const sp = 0.7 + R() * 0.9, jx = R() - 0.5;
    const u = (dz - thr) / 0.40;
    if (u <= 0 || u >= 1) continue;
    const th = Math.PI * 0.13 - t2 * Math.PI * 1.26;
    const mrx = ix + (rx - ix) * rr, mry = iy + (ry - iy) * rr;
    const x = cx + Math.cos(th) * mrx + jx * w * 0.10 * u;
    const y = cy + Math.sin(th) * mry - u * u * w * 0.46 * sp;
    const al = Math.sin(Math.PI * u);
    ctx.font = `${(w * 0.052 * (0.7 + 0.5 * rr)).toFixed(1)}px monospace`;
    ctx.fillStyle = `rgba(${(150 + 60 * rr) | 0},${(215 + 30 * rr) | 0},255,${(al * 0.92).toFixed(3)})`;
    ctx.fillText(ch, x, y);
  }
  ctx.textAlign = 'left';
}
function drawOpenBox(){
  const O = state.openBox; if (!O) return;
  const dt = state.dt || 0.016;
  if (O.closing){
    O.diss = Math.min(1, (O.diss || 0) + dt * 0.80);
    if (O.diss >= 1) O.amt += (0 - O.amt) * Math.min(1, dt * 7);
  } else {
    O.amt += (1 - O.amt) * Math.min(1, dt * 7);
  }
  if (O.closing && O.diss >= 1 && O.amt < 0.02){ state.openBox = null; return; }
  const dz = O.diss || 0;
  const e = O.amt * O.amt * (3 - 2 * O.amt), a = e;
  ctx.save();
  ctx.fillStyle = `rgba(8,10,13,${(0.74 * a).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.50, S2 = Math.min(W / 1120, H / 760) * (0.86 + 0.14 * e);
  const bw2 = 640 * S2, bh2 = 380 * S2, fl = 132 * S2;
  ctx.globalAlpha = a;
  const box = PROP_SPRITES.ph_casebox;
  if (box){
    // the real thing, photographed — the drawn carton is retired. On closing,
    // the trays still dissolve into digits: the case becoming data.
    const ph = Math.min(H * 0.70, W * 0.60 * box.h / box.w);
    const pw = ph * box.w / box.h;
    const bx = cx - pw/2, by = cy - ph/2;
    ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.15);
    ctx.drawImage(box.c, bx, by, pw, ph);
    if (dz > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawBits(bx + pw*0.37, by + ph*0.55, pw*0.30, dz, 20230301);
      drawBits(bx + pw*0.67, by + ph*0.57, pw*0.26, dz, 20230302);
      ctx.restore();
    }
    ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.6);
    ctx.textAlign = 'center';
    ctx.font = eraFont(26 * S2, '700', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(232,238,244,0.92)';
    ctx.fillText('ONE CASE, AS IT ARRIVED', cx, by - 44 * S2);
    ctx.font = eraFont(20 * S2, '', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(190,200,212,0.8)';
    ctx.fillText('both jaws, still in the trays they were taken in', cx, by - 14 * S2);
    ctx.font = eraFont(17 * S2, '', SEGMENTS[3].font);
    ctx.fillStyle = 'rgba(150,162,175,0.7)';
    ctx.fillText('click anywhere to close', cx, by + ph + 40 * S2);
    ctx.restore();
    return;
  }
  // the flaps, folded back
  ctx.fillStyle = '#c8bda6';
  for (const [x0, y0, x1, y1, x2, y2, x3, y3] of [
    [cx - bw2/2, cy - bh2/2, cx + bw2/2, cy - bh2/2, cx + bw2/2 - fl*0.5, cy - bh2/2 - fl, cx - bw2/2 + fl*0.5, cy - bh2/2 - fl],
    [cx - bw2/2, cy + bh2/2, cx + bw2/2, cy + bh2/2, cx + bw2/2 - fl*0.5, cy + bh2/2 + fl, cx - bw2/2 + fl*0.5, cy + bh2/2 + fl],
    [cx - bw2/2, cy - bh2/2, cx - bw2/2, cy + bh2/2, cx - bw2/2 - fl*0.8, cy + bh2/2 - fl*0.4, cx - bw2/2 - fl*0.8, cy - bh2/2 + fl*0.4],
    [cx + bw2/2, cy - bh2/2, cx + bw2/2, cy + bh2/2, cx + bw2/2 + fl*0.8, cy + bh2/2 - fl*0.4, cx + bw2/2 + fl*0.8, cy - bh2/2 + fl*0.4]]){
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(140,128,108,0.6)'; ctx.lineWidth = 1.2 * SS; ctx.stroke();
  }
  // the inside of the carton, and the paper it is packed with
  const ig = ctx.createLinearGradient(0, cy - bh2/2, 0, cy + bh2/2);
  ig.addColorStop(0, '#9c9078'); ig.addColorStop(0.30, '#cfc5ad'); ig.addColorStop(1, '#b8ad94');
  ctx.fillStyle = ig;
  ctx.fillRect(cx - bw2/2, cy - bh2/2, bw2, bh2);
  ctx.fillStyle = 'rgba(246,243,235,0.55)';
  ctx.beginPath();
  ctx.moveTo(cx - bw2*0.46, cy + bh2*0.40); ctx.lineTo(cx - bw2*0.30, cy - bh2*0.36);
  ctx.lineTo(cx + bw2*0.44, cy - bh2*0.30); ctx.lineTo(cx + bw2*0.34, cy + bh2*0.42);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,80,64,0.55)'; ctx.lineWidth = 2 * SS;
  ctx.strokeRect(cx - bw2/2, cy - bh2/2, bw2, bh2);
  // both halves of the case — and, once you close it, their departure
  const L = {x: cx - bw2 * 0.23, y: cy - bh2 * 0.02, w: bw2 * 0.40};
  const Rr = {x: cx + bw2 * 0.24, y: cy + bh2 * 0.03, w: bw2 * 0.36};
  ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.25);
  drawImpression(L.x, L.y, L.w, true);
  drawImpression(Rr.x, Rr.y, Rr.w, false);
  ctx.globalAlpha = a;
  if (dz > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawBits(L.x, L.y, L.w, dz, 20230301);
    drawBits(Rr.x, Rr.y, Rr.w, dz, 20230302);
    ctx.restore();
  }
  ctx.globalAlpha = a * Math.max(0, 1 - dz * 1.6);
  ctx.textAlign = 'center';
  ctx.font = eraFont(26 * S2, '700', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(232,238,244,0.92)';
  ctx.fillText('ONE CASE, AS IT ARRIVED', cx, cy - bh2/2 - fl - 34 * S2);
  ctx.font = eraFont(20 * S2, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(190,200,212,0.8)';
  ctx.fillText('both jaws, still in the trays they were taken in', cx, cy - bh2/2 - fl - 6 * S2);
  ctx.font = eraFont(17 * S2, '', SEGMENTS[3].font);
  ctx.fillStyle = 'rgba(150,162,175,0.7)';
  ctx.fillText('click anywhere to close', cx, cy + bh2/2 + fl + 34 * S2);
  ctx.restore();
}

function drawInspect(){
  const I = state.inspect; if (!I) return;
  I.amt += ((I.closing ? 0 : 1) - I.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (I.closing && I.amt < 0.03){ state.inspect = null; return; }
  const e = I.amt*I.amt*(3-2*I.amt);
  const sp = I.sp;
  // source: where the photo lives in the world right now
  let sx0, sy0, sw0, sh0;
  if (I.table){
    const kk = k(I.lz);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale*0.42;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(CFG.benchY, kk) - sh0;
  } else {
    const kk = k(I.z);
    const scale = (I.w / sp.inner.w) * kk * SS;
    sw0 = sp.w*scale; sh0 = sp.h*scale;
    sx0 = px(I.wx, kk) - sw0/2; sy0 = py(I.cy, kk) - sh0/2;
  }
  // target: filling the view
  const th = Math.min(H*0.78, W*0.72*sp.h/sp.w);
  const tw = th * sp.w/sp.h;
  const tx = W/2 - tw/2, ty = H*0.46 - th/2;
  ctx.fillStyle = `rgba(3,2,2,${0.62*e})`;
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sp.c, mixN(sx0,tx,e), mixN(sy0,ty,e), mixN(sw0,tw,e), mixN(sh0,th,e));
  if (e > 0.6){
    const b = BEATS[I.beat];
    const seg = segAt(b.x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(30*SS, '', seg.font);
    ctx.fillStyle = `rgba(${seg.ink},${(e-0.6)/0.4 * 0.9})`;
    ctx.fillText(I.cap || (b.y + ' · ' + b.t), W/2, ty + th + 52*SS);
    if (I.link){
      const label = 'OPEN THE CHAIRSIDE ARCHIVE  \u2192';
      ctx.font = eraFont(22*SS, '', seg.font);
      try { ctx.letterSpacing = `${3*SS}px`; } catch(err){}
      const wL = ctx.measureText(label).width + 56*SS;
      const yL = ty + th + 86*SS;
      const aL = (e-0.6)/0.4;
      ctx.fillStyle = `rgba(140,205,250,${(0.14*aL).toFixed(3)})`;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.fill();
      ctx.strokeStyle = `rgba(140,205,250,${(0.5*aL).toFixed(3)})`; ctx.lineWidth = 1.2*SS;
      ctx.beginPath(); ctx.roundRect(W/2 - wL/2, yL, wL, 52*SS, 26*SS); ctx.stroke();
      ctx.fillStyle = `rgba(170,220,255,${(0.95*aL).toFixed(3)})`;
      ctx.fillText(label, W/2, yL + 35*SS);
      try { ctx.letterSpacing = '0px'; } catch(err){}
      pushHit(W/2 - wL/2, yL, wL, 52*SS, {type:'ext', url: I.link});
    }
    ctx.restore();
  }
}

const STUDY_MORE = {"2450": "In January 1970, Jim Glidewell opened a one-man dental ceramics lab in Orange County, California, working off a kitchen table — at once the founder and the sole employee. He had finished studying dental technology at Orange Coast College in 1969 and started as a bench technician who knew the craft with his hands. Before any of this came the hard road: a Kentucky farm upbringing near the Cumberland River, a latchkey childhood, and a Navy hitch during the Vietnam era.", "6900": "By 1979 the one-man ceramics lab Jim opened in 1970 had multiplied into nine separate labs spread across Southern California. It was real scale — but scale by addition: nine locations, nine sets of overhead, nine places to manage, rather than one machine. \n\nWhy it matters — scattered scale. This is the company a half-step before its defining idea. The first direct-mail campaign had already broken the “only serve dentists nearby” rule — cases were now arriving by post from far beyond any single lab’s neighborhood. So the nine-lab sprawl and the mail-order reach pull in opposite directions: demand is becoming national while production is still local and fragmented. That tension is the whole point of the beat — it is the problem that forces the next move. \n\nThe pivot it sets up. It leads straight to 1984: the nine labs merge into a single centralized plant in Orange (15,000 sq ft, 42 staff), fed nationally by mail. That is the birth of the model that actually scales — one machine, one standard, cost driven down by volume. Tell 1979 as the “before,” and 1984 lands as the turn.", "7750": "In 1980 Glidewell began flying dentists in from Japan and other countries to train in the US — the International Study Program. It was a bold move for a lab that was only just beginning to scale nationally, and it became one of the foundational milestones that shaped the company's philosophy for decades.\n\nEducation as a bond. Jim used teaching long before it became a standard marketing tool. For him it was a way to build bridges and exchange know-how with the profession — a connection, not an add-on to the product. That instinct later grew into a full media and education wing (the Chairside and Lab Perspectives magazines among them). His conviction is blunt: in business it is critical that people like and trust you — “people don't buy from people they don't like.” Teaching, and hosting guests in his own home, became the tools for building that almost family-like bond.", "9850": "What it is. BioTemps are lab-fabricated provisional (temporary) crowns and bridges in tooth-colored PMMA acrylic — roughly a 6-month wear life, ~3-day lab turnaround. (There's also a chairside version, “BioTemps NOW,” milled in-office from PMMA blocks.)\n\nWhy it's more than a temporary. The real value is as an esthetic blueprint: the provisional's design is stored and reused for the final restoration (later a BruxZir or e.max crown), so the patient can see, wear and approve the look, bite and speech before committing — “no surprises on the final visit.” It also shapes gum tissue and restores collapsed bite height. A clean early example of the Glidewell pattern: own the whole workflow in-house and take the risk out for the dentist.\n\nBy around 2002 the BioTemps business had grown into its own dedicated fixed-ceramics lab. BioTemps showed the vertical, in-house, materials-driven model Glidewell would later scale dramatically with BruxZir zirconia.", "12450": "In 1995 Glidewell opened a small in-house dental operatory — a working clinic inside the lab — so the company could test materials and restorations on real patients rather than only on bench models. The same year it launched PlaySafe, a line of custom-fitted athletic mouthguards\n\nWhy it matters (the realism move). Two small things start here. First, R&D realism: a crown that survives a lab jig is not the same as one that survives a human bite, saliva, and a hurried dentist — putting chairs in the building meant Glidewell could see failure where it actually happens. Second, it is the company's first clear step beyond the crown, into prevention and sport. Modest in scale, but it shows the instinct that later defines the firm: control more of the chain, and don't stop at the restoration.", "13640": "In 1996, Glidewell introduced the Silent Nite sleep appliance — a custom, dentist-delivered oral device that gently advances the lower jaw to keep the airway open during sleep, reducing snoring and mild obstructive sleep apnea. It was deliberately built to be comfortable, adjustable, and inexpensive enough for any general dentist to fit, not just sleep specialists.\n\nWhy it matters — dentistry beyond repair. Every previous Glidewell product fixed something already broken: a worn tooth, a missing tooth, a failed restoration. Silent Nite is different — it keeps a problem from starting. It is prevention, not repair. That is a quiet but real shift in what a dental lab believes it is for: not only rebuilding mouths, but protecting sleep, breathing, and health.", "14260": "In August 1998 Glidewell began mailing a modest clinical newsletter to its dentist customers — “Chairside Perspectives” It was short, practical, and unglamorous: proven tips and techniques shared by the lab's own on-staff clinicians, the dentists who practiced inside what was becoming the nation's largest dental laboratory. It ran in this newsletter form for roughly eight years before outgrowing the format.\n\nWhy it matters. This is a connective beat, not a headline event. A few mailed pages did not move the industry in 1998. What matters is what it seeded — the founding instinct that Glidewell should not only make restorations but teach the dentist how to use them. That instinct is the through-line from the 1980 “education as a bond” beat to everything that follows. Reach, even small reach, was being converted into trust.\n\nThe newsletter outgrew its own format and became Chairside magazine, which is edited today by Neil Park — a dentist who ran his own practice for twelve years, then spent nineteen at Nobel Biocare building the courses that teach dentists a new technique. The job the 1998 mailing invented is still the job.", "15700": "Around the turn of the 2000s Glidewell stopped relying on outside vendors for its key materials and began building its own Research & Development. Two moments pushed Jim there. First, a bad experience betting on an outside material — Artglass, a lab veneering composite — taught him that if you don't own the material, you don't own your quality or your future. Second, a conversation with independent researcher Dr. Rella Christensen about a “Volkscrown” — a people's crown, affordable to everyone, that performed like cast gold. Together they pointed at one conclusion: to make the best dentistry affordable and dependable, Glidewell needed its own science.\n\nWhy it matters — the engine room. This belongs early in the story, before BruxZir, not after. Every later breakthrough — the CAD build-out (~2000), BruxZir (2009), the automated factory (2019), AI-driven design — grows out of this one decision to build in-house R&D. It is the structural reason the company can keep making the best affordable: it controls the materials and the process end to end. By ~2000 Glidewell had already developed dozens of materials and lab services and was expanding the R&D team that today numbers 150+ people, including a dozen-plus PhDs.\n\nThrough the late 1990s and early 2000s the dental laboratory went digital. Instead of building a crown's substructure (coping) by hand, technicians began scanning the model, designing the coping on a computer, and milling it from a block. CAD/CAM moved from a niche into the mainstream of the lab.\n\nWho actually pioneered it. Not Glidewell. Nobel Biocare's Procera (mid-1990s) was the first CAD/CAM ceramic substructure; around 2001–2002 milled-zirconia frameworks arrived from others — 3M ESPE's Lava, Dentsply's Cercon, Nobel's Procera Forte. Those outside systems opened the door.\n\nWhat Glidewell did. As one of the largest labs, Glidewell adopted digital manufacturing early (working with the Cercon and Wol-Ceram systems around 2002), then built its own. Around 2004 it hired engineer Mervyn Rudgley (from 3D Systems) to lead digital manufacturing, with one explicit goal: make a zirconia substructure at a PFM price. In 2006 that became Prismatik CZ — Glidewell's own milling-plus-software system, paired with a 3Shape scanner. A clever trick (milling thin copings from a softer, bisque-fired block and sintering afterward) let them skip costly diamond tooling and push cost down.\n\nThis is the hinge between the analog craft of Part 1 and the monolithic-zirconia revolution of 2009. It is the moment the machine first enters Glidewell's bench — and, true to the thesis, the angle from day one was not 'newest technology' but 'best technology at an affordable price.' Without this quiet early-2000s digital build-out, BruxZir (2009) and the automated factory (2019) would not have been possible.", "18700": "In 2007 Glidewell took in its first digital optical impression — an intraoral scan sent straight from a practice — instead of a silicone impression or a poured stone model. Most of the industry was still pouring impressions at the time. The company dates the start of its digital case database to that moment.", "21080": "In late 2009 Glidewell launched BruxZir — a full-contour, monolithic solid-zirconia crown milled as one solid piece, with no porcelain veneering layer to chip. Worth knowing: zirconia and CAD/CAM were already in dentistry (In-Ceram Zirconia ~1999; Lava, Cercon, Procera ~2001–02). Glidewell did not invent zirconia. What it did was take monolithic full-contour zirconia, drive it through its own high-volume lab, and offer it at a price and turnaround ordinary dentists could actually say yes to — then make it the default. The first pitch was blunt: “more brawn than beauty” — a tough, near-unbreakable crown for grinders, implant cases and tight-bite molars where metal-backed crowns (PFMs) or gold used to be the only safe answer.\n\nWhy it matters — the revolution. A monolithic crown has no veneer to fracture, mills fast, and undercuts the PFM on price. The narrative nugget is the tell: the revolution went mainstream not through advertising but when dentists started phoning their own local labs and asking for “that BruxZir thing.” Demand pulled it in. Today BruxZir reportedly makes up the majority of Glidewell's fixed-crown volume and the brand counts tens of millions of units placed since 2009. This is where “affordable access” stops being a slogan and becomes a crown in a real patient's mouth.\n\nWho actually made it. Three roles, not one — the “Jim vs Carden” question dissolves once you separate them. Founder vision & funding — Jim Glidewell: no source, not even Glidewell's own, says he invented it at the bench; his own words credit “our R&D teams.” His real, substantial credit is the bet — investing in in-house milling and materials research so it could exist. The technical creator — Robin (Robert) A. Carden, VP of R&D: he led development and holds the process patent (US 9,434,651 B2, granted 2016) for the binder-free colloidal / slip-cast zirconia-blank method, and is the subject of the 2013 “I Made BruxZir” interview. Clinical champion — Dr. Mike DiTolla: drove dentist adoption (Chairside magazine, the on-camera “hammer test”) — an evangelist, not a materials inventor. In one line: “Developed by Glidewell's R&D team, led by Robin Carden, on founder Jim Glidewell's bet — launched 2009.”", "21930": "For decades dentists stayed with cement-retained crowns even though screw-retained ones are easier to retrieve and avoid cement left under the gum. The reason was rarely clinical — it was cost and complexity. Titanium bases, UCLA abutments and clinical screws were sold by the implant OEMs (Nobel, Straumann and others) at prices that could roughly double the lab cost of a case.\n\nWhat Glidewell did — two moves.\n1) Made the parts itself. Through its own precision-machining operation, Prismatik Dentalcraft, the company began producing the Inclusive® Prosthetic Components line — titanium bases, esthetic and multi-unit abutments, analogs, screws, temporary and UCLA abutments, transfer copings — compatible with the major implant systems. That broke the OEM parts bottleneck and let Glidewell quote a flat lab fee for a screw-retained crown. Screw retention stopped being a premium option and became something an ordinary practice could afford.\n2) Solved the material problem. Screw retention stresses the crown around the screw channel, and porcelain-fused-to-metal chipped there. BruxZir monolithic zirconia (2009) could take it. The lab began bonding the BruxZir crown to the titanium base before shipping, so the dentist received one finished unit: seat it, torque the screw, done. No cement in the patient's mouth at all.\n\nWhy it belongs on this line. It is the same mechanism as every other beat here, applied to a technique instead of a product: the best option existed already, and Glidewell removed the price and the complexity that kept ordinary dentists away. It is also the clearest case of vertical integration paying off clinically — owning the machining is what made the flat fee possible.", "22550": "Through the 2010s intraoral scanners went from novelty to near-universal — by the mid-2020s roughly 70% of dentists had switched from goopy physical impressions to digital scans. The old way was slow and error-prone: trays, silicone, gagging patients, remakes when a margin didn't read. Scanning became the on-ramp to everything downstream — AI crown design, the automated BruxZir factory, chairside milling — and in these years Glidewell grew into the largest dental laboratory in the world, fed by that digital stream.", "23170": "Chronology. • 1997 — Dr. Jack Hahn (creator of the NobelReplace implant) designs the original tapered implant; his own pre-history, not Glidewell's. • 2000s–early 2010s — Glidewell enters implants from the side, not with its own implant: the Inclusive line of FDA-cleared prosthetic components (abutments, screws, copings) compatible with most third-party systems, made in-house by Prismatik Dentalcraft. The point is vertical integration — cut the OEM markup, offer flat, predictable lab fees. • 2014 — Hahn begins working with Glidewell's engineers and Jim Glidewell to design a new implant. • 2015 — LAUNCH of the Hahn Tapered Implant System. It becomes one of the fastest-growing implant systems in the US, adopted by thousands of dentists. Stated goal: a high-quality implant at a fraction of the price, finished with a BruxZir crown, under a lifetime warranty from implant to restoration. • 2019 — the Inclusive component line expands to 22 major implant systems; clinical studies (2-year, then 6-year) show a 99.2% success rate and under 0.2 mm bone loss. • 2020 — medical-grade titanium scan bodies bring implant restorations into the digital workflow. • ~2023–24 — Hahn Tapered is renamed the Glidewell HT Implant System. • 2024–25 — the Glidewell Tooth Replacement Solution (full digital bundle) and major 2025 upgrades (a 6.0 mm implant, new guided-surgery kits).\n\nWhat it is today. As a private company Glidewell publishes no product-level revenue split, so an exact share can't be cited. Qualitatively: it is one of Glidewell's core product lines and one of the fastest-growing implant systems in the US; Glidewell has restored hundreds of thousands of implant cases and makes both the implant and its components in-house through Prismatik Dentalcraft (ISO-certified, FDA-cleared), positioning implant dentistry as a standard of care across the economic spectrum.\n\nThe connections (why implants link to so much on the timeline). • BruxZir / restorative — the implant is finished with the same BruxZir crown; one warranty from implant to restoration. • Vertical integration — Prismatik makes the parts in-house, kills the markup, enables flat pricing; the same move as the 2000 plastic-injection beat. • Digital / glidewell.io — scan bodies, guided surgery, digital treatment planning. • CE / education — world-class education and symposia, the Misch lineage through Resnik, teaching GPs to place implants. • Jim personally — Hahn and Jim Glidewell co-devised the system. • Accessibility — the throughline: a fraction of the price, across the economic spectrum.", "24020": "In November 2017, at its first Glidewell Dental Symposium in Dallas, Glidewell unveiled glidewell.io — a complete in-office ecosystem that put the lab's whole workflow on the dentist's own counter. Three pieces: an intraoral scanner (the iTero Element, through a partnership with Align), fastdesign.io software that uses machine-learning to propose the crown design, and the fastmill.io in-office mill. The breakthrough material was BruxZir NOW — a fully-sintered zirconia block that comes out of the mill finished, with no firing oven required. The promise: scan, design, mill and seat a single crown in roughly one visit — about an hour — instead of sending an impression to a lab and bringing the patient back in two weeks.\n\nWhy it matters — the lab moves into the chair. For decades the lab was a separate place: you took an impression, mailed it, waited, called back the patient. glidewell.io collapses that distance — the lab's capability now lives inside the operatory. Access, again: fewer visits for the patient, less travel, faster care.\n\nWho it reaches is the test of it. Paresh Patel works the cheap end of the same argument — five thousand implants placed, three and a half thousand of them mini implants, which exist for the patient who cannot afford the conventional case or cannot take the surgery. The mill on the counter and the small implant are one idea in two pieces of hardware.", "24870": "In 2019 Glidewell crossed the line from digital-assisted to digital-native production: the launch of fully automated, AI-designed, robotic monolithic-zirconia manufacturing — what the company frames as Glidewell Intelligent Manufacturing. Crown designs are proposed automatically by generative AI (reportedly generative-adversarial networks), then routed to production lines where robotic arms feed BruxZir zirconia blocks into banks of interconnected mills; each restoration is verified by automated metrology before it ships. No hand-waxing, no manual CAD nudging — the machine designs the tooth and the machine makes it.\n\nWhy it matters — the climax of the analog→digital arc. Set it directly against the 1907 / PFM hand-craft baseline: a technician at a bench, wax, casting, a fired porcelain layer, hours of human judgment per unit. Now: software draws the crown, a robot arm cuts it, a sensor checks it. Same goal — a tooth that fits and looks right — but the labor, the variability, and the cost structure are transformed. That transformation is the thesis made physical: automation is how the best dentistry gets made affordable and brought to scale, not by cutting corners but by removing variability and human bottlenecks.", "25490": "In 2019, Glidewell launched Guiding Leaders — a free leadership and practice-development program built and run by Bobbie Norton, held at the Irvine campus. It was created as the profession was tipping toward a new majority: women now make up more than half of graduating dentists, yet clinical school never teaches the business, communication, and leadership skills a practice owner actually needs. Guiding Leaders fills that gap at no cost to the dentist. Today it has roughly 100 alumni, with each cohort earning up to about 80 CE units across the run from spring to the fall graduation.\n\nWhy it matters (the thesis made human). This is the access thesis turned outward. It is reinvestment, not marketing: Glidewell gives away the playbook and asks nothing clinical in return. That reframes the company from a lab that sells crowns into one that grows the people who place them.", "26340": "In 2022 fastscan.io, built with Medit, folded an intraoral scanner into the Glidewell ecosystem — the front door to the all-digital workflow. Capturing the mouth digitally is the cheapest possible front of the flywheel: no physical impressions, no remakes, data straight into the box that designs and mills the crown. With fastdesign and fastmill already in the operatory, the scanner completed the set — from the first look at the tooth to the finished restoration, the case never leaves the digital chain.", "27190": "By the early 2020s Glidewell folds generative AI design into the heart of its lab — tools like CrownAI and MarginAI that propose a finished crown and its margin line automatically, rather than waiting for a technician to draw every case from scratch. This sits on top of staggering volume: a reported ~500,000 restorations a month, 5,000+ staff, and the standing of the largest dental lab in the world. The point is not that Glidewell “invented AI” — it did not — but that it brought AI design to scale and made it the default path for routine cases. Sergei Azernikov, VP of CAD/CAM Software and the de-facto AI lead, describes a closed quality loop: millions of cloud cases train a generative model that now produces more than 95% of the lab's restoration designs (Glidewell, 2025–26) — the design is good enough that a human rarely needs to touch it.\n\nWhy it matters — the flywheel. This beat IS the thesis made concrete. AI design is where that flywheel becomes visible and undeniable. When a model designs the crown in seconds — now more than 95% of restoration designs — across roughly half a million units a month, the cost of the single most labor-intensive step collapses — and scale plus AI becomes the affordability proof, not a slogan. Access is the throughline, and here it stops being aspiration and becomes arithmetic.", "28180": "This is the present — 2026. Automated monolithic milling, the same-visit zirconia crown Glidewell helped push to scale, is no longer remarkable; it is simply how chairside dentistry runs. The frontier has moved to three converging fronts: AI that reads scans and drafts restoration designs, robotics that guide the hand in surgery, and the single-visit promise extended from the crown to the whole treatment. By late 2025, AI-assisted CAD tools were reported to cut design time by 30–45 minutes per case and reduce remakes by roughly 18 percent, while Neocis cleared its next-generation Yomi S implant robot with FDA, its planning AI auto-segmenting anatomy from CBCT scans — a system now reachable by general dentists, not just specialists.\n\nWhy it matters — access, today. The 2026 frontier is that same throughline, now carried by software and machines. AI design and chairside automation compress chair time, labor, and remakes — and cost follows time. The honest claim here is not that anyone “invented” single-visit or robotic dentistry; it is that the tools are being made the default and brought within reach of the everyday practice, which is exactly where access lives or dies.", "1400": "In 1907 William H. Taggart demonstrated a practical lost-wax casting method for dental restorations — molten gold cast into a mold formed around a hand-carved wax pattern. The technique made precisely fitting cast crowns and inlays reproducible, and it defined the craft for the rest of the century: every restoration began as wax shaped by hand, one case at a time, days or weeks per mouth. This is the analog baseline the whole tour measures itself against — the world Glidewell was born into, and the one it would spend fifty years making faster, cheaper and more precise."};

/* Cut a paragraph into tokens: plain words, and whole names carrying a person

   with a space in front of it. */
function nameTokens(text, seen){
  const out = [];

    if (!s) return;
    out.push({s, pid, glue: at > 0 && text[at - 1] !== ' '});

    let i = from;

  const sp = ctx.measureText(' ').width;

    if (line.length && y > o.top && y < o.bot){
      let cx = x;
      for (let i = 0; i < line.length; i++){
        const t = line[i];
        if (i && !t.glue) cx += sp;
        const w = ctx.measureText(t.s).width;
        if (t.pid){

  for (const t of toks){
    const w = ctx.measureText(t.s).width;
    const gap = (line.length && !t.glue) ? sp : 0;
    // a glued token never starts a line — punctuation stays with its word
    if (line.length && !t.glue && wLine + gap + w > maxW){ flush(); line = [t]; wLine = w; }

      ctx.strokeStyle = `rgba(${K.accent},0.5)`; ctx.lineWidth = 1.2*SS;
      ctx.beginPath(); ctx.roundRect(px_, y - 28*SS, wLbl, 44*SS, 22*SS); ctx.stroke();

/* THE WALL OF VOICES. One page holding everyone the film talks to, shaped the
   way the working timeline shapes them: a small square face, the name beside
   it, and the line that says who they are — three to a row. Tapping a face
   opens that person's page over the wall, so going back lands you here. */
function openPeople(){ state.people = {scroll: 0, amt: 0, maxScroll: 1}; }
function personInitials(nm){
  return (nm || '').replace(/^(Dr\.|Mr\.|Ms\.|Mrs\.)\s+/, '')
    .split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2)
    .map(w => w[0].toUpperCase()).join('');
}
/* the role as a card can carry it: the first clause, and no more than fits */
function roleShort(role){
  let r = (role || '').split(/[;(]/)[0].trim().replace(/,$/, '');
  return r || (role || '');
}
/* THE WHEEL ON A READING PAGE. The impulse is a VELOCITY — it is what the hall
   adds to cam.vel — and the pages were multiplying it by dt as though it were
   one, so a notch moved a three-thousand-unit page by two and a half units:
   a thousand turns to reach the bottom. A notch is a displacement, and now
   moves about an eighth of the window. A drag keeps roughly the hand's own
   distance instead of ten times it. */
function pageScroll(S, inp, dt){
  S.scroll += inp.impulse * (inp.dragging ? 0.055 : 0.43);
  S.scroll = Math.max(-240, Math.min(S.maxScroll, S.scroll));
}
function drawPeople(){
  const S = state.people; if (!S) return;
  S.amt += ((S.closing ? 0 : 1) - S.amt) * Math.min(1, (state.dt || 0.016) * 5);
  if (S.closing && S.amt < 0.03){ state.people = null; return; }

  const K = PSKIN;
  ctx.fillStyle = `rgba(4,5,7,${(0.62*e).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  if (e < 0.35) return;
  const a = (e - 0.35) / 0.65;
  const colW = Math.min(W * 0.80, 1520 * SS);
  const left = W/2 - colW/2;
  const padX = 58 * SS;
  const wx0 = left - padX, ww = colW + padX*2;
  const wy0 = H * 0.06 + (1 - a) * 36 * SS, wh = H * 0.88;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 42*SS; ctx.shadowOffsetY = 14*SS;
  ctx.fillStyle = K.bg;
  ctx.beginPath(); ctx.roundRect(wx0, wy0, ww, wh, K.r*SS); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = K.edge; ctx.lineWidth = 1.4*SS;
  ctx.beginPath(); ctx.roundRect(wx0 + SS, wy0 + SS, ww - 2*SS, wh - 2*SS, K.r*SS); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(wx0 + 2*SS, wy0 + 2*SS, ww - 4*SS, wh - 4*SS, K.r*SS); ctx.clip();
  let y = wy0 + 96*SS - S.scroll * SS;
  const topClip = wy0 - 120*SS, botClip = wy0 + wh + 120*SS;
  ctx.textAlign = 'left';
  ctx.font = K.font(52);
  ctx.fillStyle = `rgba(${K.ink},0.98)`;
  ctx.fillText('THE VOICES', left, y); y += 30 * SS;
  ctx.font = K.font(18);
  ctx.fillStyle = `rgba(${K.dim},0.95)`;
  const roster = PEOPLE_ORDER.filter(id => PEOPLE[id]);
  ctx.fillText(roster.length + ' PEOPLE ON CAMERA · TAP A FACE FOR THEIR PAGE', left, y);
  y += 24 * SS;
  ctx.fillStyle = `rgba(${K.red},1)`;
  ctx.fillRect(left, y, 68*SS, 3*SS); y += 40 * SS;
  const COLS = 3, gap = 28 * SS;
  const cw = (colW - gap * (COLS - 1)) / COLS;
  const th = 104 * SS;                       // the face, square and small
  const rowH = th + 30 * SS;
  for (let i = 0; i < roster.length; i++){

      ctx.drawImage(im.el, cx + th/2 - im.w*s/2, cy + th/2 - im.h*s/2, im.w*s, im.h*s);
    } else {
      ctx.fillStyle = 'rgba(26,28,30,0.06)';
      ctx.fillRect(cx, cy, th, th);
      ctx.textAlign = 'center';
      ctx.font = K.font(th * 0.34);
      ctx.fillStyle = `rgba(${K.dim},0.42)`;
      ctx.fillText(personInitials(P.name), cx + th/2, cy + th/2 + th*0.12);

    ctx.strokeStyle = 'rgba(26,28,30,0.14)'; ctx.lineWidth = 1*SS;
    ctx.beginPath(); ctx.roundRect(cx, cy, th, th, 5*SS); ctx.stroke();

      ctx.fillRect(cx, cy, 3.5*SS, th);

  ctx.textAlign = 'center';
  ctx.font = K.font(18);
  ctx.fillStyle = `rgba(${K.dim},0.75)`;
  ctx.fillText('· scroll · tap a face · tap the margin to return ·', W/2, y);
  ctx.restore();
  state.cardRect = {x: wx0, y: wy0, w: ww, h: wh, r: K.r*SS};
  S.maxScroll = Math.max(1, (y + 120*SS + S.scroll * SS - (wy0 + wh)) / SS);

/* THE PERSON'S PAGE. Same window and the same reading rhythm as a year card,
   but stripped to white: this page is about one voice, not one moment, so it
   drops the era's costume. One red element carries it — the rule under the
   name, and the play mark on every preview.

   It has two modes. Reading: the life on the left, the face and the clips down
   the right. Watching: the clip plays where the text was, held still, while the
   rail beside it goes on scrolling — pick the next one without losing this one.

   thing a page of interviews should not have to teach. */
const PSKIN = {bg:'rgba(252,252,251,0.985)', edge:'rgba(26,28,30,0.16)', r:6,

function openPerson(id){
  if (!PEOPLE[id]) return;
  if (state.person) personStop(state.person);
  state.person = {id, scroll: 0, amt: 0, maxScroll: 1, playing: null, v: null};
  // the voice starts as the page opens; the hall film bows out on its own
  if (PEOPLE[id].clips && PEOPLE[id].clips.length) personPlay(state.person, 0);

function personPlay(S, i){
  const P = PEOPLE[S.id], c = P.clips && P.clips[i];

  if (S.v){ try { S.v.pause(); } catch(e){} }
  let v = VIDEO_EL[c.src];
  if (!v){
    v = document.createElement('video');
    v.src = c.src; v.preload = 'auto'; v.playsInline = true;
    VIDEO_EL[c.src] = v;
  }
  S.playing = i; S.v = v; S.scroll = 0;
  try { if (v.paused) v.currentTime = 0; v.play(); } catch(e){}
}
function personStop(S){
  if (S && S.v){ try { S.v.pause(); } catch(e){} }
  if (S){ S.playing = null; S.v = null; }
}
function drawPerson(){
  const S = state.person; if (!S) return;
  S.amt += ((S.closing ? 0 : 1) - S.amt) * Math.min(1, (state.dt || 0.016) * 5);

  const top0 = wy0 + 158*SS;
  const topClip = wy0 - 80*SS, botClip = wy0 + wh + 80*SS;
  ctx.textAlign = 'left';
  let y = top0 - (watching ? 0 : S.scroll * SS);

  // the way back — to the page when a clip is up, to the wall when it is not
  ctx.font = K.font(17);
  try { ctx.letterSpacing = `${3*SS}px`; } catch(err){}
  ctx.fillStyle = `rgba(${K.red},0.92)`;

  if (y - 70*SS > topClip){
    ctx.fillText(backTx, left, y - 70*SS);
    pushHit(left - 8*SS, y - 94*SS, ctx.measureText(backTx).width + 18*SS, 34*SS,
