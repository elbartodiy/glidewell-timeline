    cg.addColorStop(0, '#241408'); cg.addColorStop(.45, '#43290f'); cg.addColorStop(1, '#180d05');
  } else if (era === 3){
    cg.addColorStop(0, '#c3c8cc'); cg.addColorStop(.45, '#eef1f3'); cg.addColorStop(1, '#a9aeb3');
  } else {
    cg.addColorStop(0, '#5e6266'); cg.addColorStop(.45, '#9aa0a4'); cg.addColorStop(1, '#4a4e52');
  }
  ctx.fillStyle = cg;
  ctx.fillRect(sx - colW/2, yTop, colW, H - yTop);
  // the cap is a real cylinder slice: rim wall, top face, edge light
  {
    const rx = colW*0.62, ry = 11*kk*SS, capH = 9*kk*SS;
    const rim = ctx.createLinearGradient(sx - rx, 0, sx + rx, 0);
    if (era === 0){ rim.addColorStop(0,'#2a1809'); rim.addColorStop(.45,'#4e3012'); rim.addColorStop(1,'#1c0f06'); }
    else if (era === 3){ rim.addColorStop(0,'#b6bbc0'); rim.addColorStop(.45,'#e2e6e9'); rim.addColorStop(1,'#9aa0a5'); }
    else { rim.addColorStop(0,'#54585c'); rim.addColorStop(.45,'#8f9599'); rim.addColorStop(1,'#43474b'); }
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.ellipse(sx, yTop + capH, rx, ry, 0, 0, Math.PI);
    ctx.lineTo(sx - rx, yTop);
    ctx.ellipse(sx, yTop, rx, ry, 0, Math.PI, 0, true);
    ctx.closePath(); ctx.fill();
    const topg = ctx.createLinearGradient(sx - rx, yTop - ry, sx + rx, yTop + ry);
    if (era === 0){ topg.addColorStop(0,'#6b4a20'); topg.addColorStop(1,'#4a2d10'); }
    else if (era === 3){ topg.addColorStop(0,'#ffffff'); topg.addColorStop(1,'#dfe3e6'); }
    else { topg.addColorStop(0,'#d7dcdf'); topg.addColorStop(1,'#b4b9bd'); }
    ctx.fillStyle = topg;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2*SS;
    ctx.beginPath(); ctx.ellipse(sx, yTop, rx - 0.6*SS, ry - 0.6*SS, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
    /* contact shade where the column meets the cap — CLIPPED to the column:
       drawn wider, its ends hung in the air beside the shaft and read as a
       stray line under the disc */
    ctx.save();
    ctx.beginPath(); ctx.rect(sx - colW/2 + 1*SS, yTop + capH, colW - 2*SS, 14*kk*SS);
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(sx, yTop + capH + 2*SS, colW*0.52, ry*0.7, 0, 0, Math.PI); ctx.fill();
    ctx.restore();
  }
  }
  // the object
  const obj = PED_SPRITES[ped.obj];
  /* a wide, low machine needs more of the cap than a puck does — `wide` lets
     an exhibit ask for it, and the dome is 172 units across, so it still fits */
  const ow = 120 * (ped.wide || 1) * (ped.vitrine ? 1.25 : big) * kk * SS, oh = ow * obj.h / obj.w;
  /* NOT snapped to whole pixels. The 2022 bay is one big rectangle with
     nothing beside it at its own scale, so rounding its position is invisible;
     a group of objects is the opposite case — each one sits at its own
     fractional offset and crosses its pixel boundary at its own moment, so on
     a slow scroll they shuffle against one another like loose type. The
     prescaled copy already removes the boiling; the position stays smooth. */
  if (ped.points){
    /* THE CASE BECAME DATA, so at 2007 the exhibit is not an object under
       glass — it is the object as a cloud of points, turning on its own axis
       and lighting the plinth from inside itself. The mesh is the crown's own
       lathe: its vertices, rotated, projected, and drawn as dots. No spotlights
       on it and no dome over it; nothing to look through. */
    /* A FIFTH LARGER, AND STANDING ON NOTHING. Eldar, 2026-09-22: the cloud a
       little bigger (1.35 → 1.62, his «на 0,2») and the plinth under it gone
       altogether — which is the beat's own argument, since what is on show here
       is not an object but the case turned into data. It keeps the height it
       had: cloudFoot is still measured from where the cap was. */
    const cloudFoot = yTop - 30 * kk * SS;          // lifted clear of where the cap was (Eldar: "чуть повыше")
    drawPointCloud(sx, cloudFoot, ow * 1.62, t, hero);
    PC07 = {cx: sx, footY: cloudFoot, size: ow * 1.62};   // the data relay leaves from here
  } else if (ped.spin){
    const footY3 = yTop - 3*kk*SS;
    // the shade it puts on the stone, sized to the crown's own footprint
    const preW = ow * 0.98;
    const csh = ctx.createRadialGradient(sx, footY3, 0, sx, footY3, preW * 0.62);
    csh.addColorStop(0, 'rgba(20,26,34,0.34)'); csh.addColorStop(0.55, 'rgba(20,26,34,0.14)');
    csh.addColorStop(1, 'rgba(20,26,34,0)');
    ctx.save(); ctx.translate(sx, footY3); ctx.scale(1, 0.22); ctx.translate(-sx, -footY3);
    ctx.fillStyle = csh;
    ctx.beginPath(); ctx.arc(sx, footY3, preW * 0.62, 0, 7); ctx.fill();
    ctx.restore();
    const r3 = drawCrown3D(sx, footY3, preW, 1);
    pushHit(sx - ow*0.6, r3.top, ow*1.2, footY3 - r3.top, {type:'spin'});
  } else {
    ctx.drawImage(spriteMip(obj, ow, oh), sx - ow/2, yTop - oh - 4*kk*SS, ow, oh);
  }
  // glass dome: one clean outline, the sheen lives on the glass itself
  // (a vitrine pedestal has the capsule for a case — no dome, no spotlight halo;
  //  and a cloud of points is not a thing you put under glass)
  if (!ped.vitrine && !ped.points){
    ctx.strokeStyle = 'rgba(235,245,255,0.30)';
    ctx.lineWidth = 1.6*SS;
    ctx.beginPath();
    ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.52, oh*1.22, 0, Math.PI, 0);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 3*SS;
    ctx.beginPath();
    ctx.ellipse(sx, yTop - 4*kk*SS, colW*0.42, oh*1.04, 0, Math.PI*1.12, Math.PI*1.42);
    ctx.stroke();
    // halo of its own little spotlight — swells with the hero pass
    const inten = (0.9 + 0.1*Math.sin(t*3 + b.x)) * (1 + (hero||0)*1.4);
    drawGlow(warmC, sx, yTop - oh*0.6, colW*1.5, 0.16*inten);
  }
}

/* A TYPED SHEET, PINNED. It hangs on the same line as the old prints and in
   the same frames, because it is standing in their row — but it is paper, not
   a photograph: a heading, a rule, and the grey suggestion of type. It is a
   working document, so it says so, and it does not pretend to be an exhibit. */
/* ПАТЕНТНЫЙ ЛИСТ — ЕДИНСТВЕННЫЙ ЭКСПОНАТ 2000 ГОДА.
   Станция про собственную науку не показывает предмет: она показывает
   ДОКУМЕНТ. Название изобретения на листе — это и есть тезис года, поэтому со
   стены он снят: «Own the science, so you can own the quality and the price».
   Лист висит ровно по метке года, постамент с коронкой и лучами убран
   (Эльдар, 2026-09-23: «всё это нужно написать в виде патента... с такой
   печатью... патент пусть на стене прямо ровно по этой R&D метке»).

   Номер патента НЕ печатается. Выдумать номер — значит поставить на стене
   выставки про настоящую компанию ссылку на чужой настоящий документ. Вместо
   номера — даты и правило, которые в компании действительно есть: подан в
   2000-м, и два-три новых продукта в год с тех пор. Печать символическая, и
   это видно: по кольцу идёт имя отдела и город, в середине — год.

   Каждая строка ВПИСЫВАЕТСЯ измерением, а не долей ширины на глаз: на этом
   листе уже один раз вылезла шапка (qa/lint.mjs R1). */
function drawPatentCard(b){
  const d = b.patent;
  const wz = (segAt(b.x).tz || wallZAt(b.x)) - 12, kk = k(wz);
  const ax = wallSX(b.x, d.dx, kk);
  rivet('patent:' + b.x, ax, k(exhibitZ(b.x)));
  const w = d.w * kk * SS, h = w * 1.28;
  const cy = py(d.cy, kk);
  if (ax < -w * 2 || ax > W + w * 2) return;
  const SER = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
  const SAN = '"Helvetica Neue", Arial, sans-serif';
  /* ставит кегль и разрядку и ужимает их ВМЕСТЕ, пока строка не влезет:
     разрядка входит в измеренную ширину, поэтому мерить надо после неё */
  const fit = (txt, maxW, size, track, weight, fam) => {
    let fs = size, tr = track;
    for (let i = 0; i < 7; i++){
      ctx.font = `${weight ? weight + ' ' : ''}${fs.toFixed(2)}px ${fam}`;
      try { ctx.letterSpacing = tr.toFixed(2) + 'px'; } catch(e){}
      const tw = ctx.measureText(txt).width;
      if (tw <= maxW) break;
      const f = maxW / tw; fs *= f; tr *= f;
    }
    return fs;
  };
  const clearTrack = () => { try { ctx.letterSpacing = '0px'; } catch(e){} };

  ctx.save();
  ctx.translate(ax, cy);
  ctx.rotate((d.rot || 0) * Math.PI / 180);

  // рамка, стекло, бумага
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 14 * kk * SS; ctx.shadowOffsetY = 6 * kk * SS;
  ctx.fillStyle = '#e7e4dc';
  ctx.fillRect(-w/2, -h/2, w, h);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const pad = w * 0.045;
  const pg = ctx.createLinearGradient(0, -h/2, 0, h/2);
  pg.addColorStop(0, '#fdfcf6'); pg.addColorStop(1, '#f2eee1');
  ctx.fillStyle = pg;
  ctx.fillRect(-w/2 + pad, -h/2 + pad, w - pad*2, h - pad*2);
  // печатная рамка документа — двойная линейка, как на бланке
  const bx = -w/2 + pad*1.9, by = -h/2 + pad*1.9, bw2 = w - pad*3.8, bh2 = h - pad*3.8;
  ctx.strokeStyle = 'rgba(46,50,56,0.55)';
  ctx.lineWidth = Math.max(1, w*0.006); ctx.strokeRect(bx, by, bw2, bh2);
  ctx.lineWidth = Math.max(1, w*0.002); ctx.strokeRect(bx + w*0.012, by + w*0.012, bw2 - w*0.024, bh2 - w*0.024);

  const ix = bx + w*0.045, iw = bw2 - w*0.09;
  let y = by + w*0.075;

  // ── шапка ──
  ctx.fillStyle = 'rgba(40,44,50,0.88)';
  ctx.textAlign = 'center';
  fit('UNITED STATES PATENT', iw, w*0.056, w*0.022, '600', SAN);
  ctx.fillText('UNITED STATES PATENT', 0, y);
  clearTrack();
  y += w*0.030;
  ctx.strokeStyle = 'rgba(46,50,56,0.5)'; ctx.lineWidth = Math.max(1, w*0.004);
  ctx.beginPath(); ctx.moveTo(ix, y); ctx.lineTo(ix + iw, y); ctx.stroke();

  // ── строка заявителя и даты ──
  y += w*0.042;
  ctx.fillStyle = 'rgba(60,64,70,0.75)';
  ctx.textAlign = 'left';
  fit('James R. Glidewell Dental Ceramics · Irvine, California', iw*0.72, w*0.030, 0, '', SER);
  ctx.fillText('James R. Glidewell Dental Ceramics · Irvine, California', ix, y);
  ctx.textAlign = 'right';
  fit('Filed 2000', iw*0.26, w*0.030, 0, '', SER);
  ctx.fillText('Filed 2000', ix + iw, y);

  // ── название изобретения: это и есть тезис года ──
  y += w*0.052;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(28,32,38,0.92)';
  const TITLE = ['OWN THE SCIENCE,', 'SO YOU CAN OWN THE', 'QUALITY AND THE PRICE'];
  let ts = w*0.072, tt = w*0.006;
  for (const ln of TITLE) ts = Math.min(ts, fit(ln, iw*0.94, ts, tt, '600', SER));
  for (const ln of TITLE){
    fit(ln, iw*0.94, ts, tt, '600', SER);
    ctx.fillText(ln, 0, y);
    y += ts * 1.24;
  }
  clearTrack();

  /* ── ПОЛОСЫ ЛИСТА. Всё, что ниже заголовка, делится на полосы ЗАРАНЕЕ, и
     каждая вещь живёт в своей. Сперва чертёж был нарисован «на глаз» от
     середины — и залез на заголовок, а выноски ушли за край листа на стену
     (Эльдар увидел сразу). Масштаб чертежа теперь берётся из меньшего: что
     позволяет ширина набора и что позволяет высота полосы. */
  const restTop = y + w*0.020;
  const restBot = by + bh2 - w*0.085;
  const figH = (restBot - restTop) * 0.50;
  const figCy = restTop + figH * 0.46;
  const S2 = Math.min(iw / 205, figH / 175);

  // ── FIG. 1 — коронка в разрезе ──
  ctx.save();
  ctx.translate(0, figCy);
  ctx.scale(S2, S2);
  const tooth = (sx, sy) => {
    ctx.save(); ctx.scale(sx, sy);
    ctx.beginPath();
    ctx.moveTo(-52, 48);
    ctx.bezierCurveTo(-60, 8, -54, -28, -38, -46);
    ctx.quadraticCurveTo(-26, -58, -14, -46);
    ctx.quadraticCurveTo(-6, -36, 0, -46);
    ctx.quadraticCurveTo(6, -56, 16, -46);
    ctx.quadraticCurveTo(28, -58, 40, -44);
    ctx.bezierCurveTo(56, -24, 60, 10, 50, 48);
    ctx.quadraticCurveTo(0, 62, -52, 48);
    ctx.closePath();
    ctx.restore();
  };
  ctx.save();
  ctx.beginPath(); tooth(1, 1); ctx.clip();
  ctx.strokeStyle = 'rgba(36,40,46,0.26)'; ctx.lineWidth = 1;
  for (let hx = -130; hx < 130; hx += 8){
    ctx.beginPath(); ctx.moveTo(hx, -75); ctx.lineTo(hx + 75, 75); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(36,40,46,0.9)'; ctx.lineWidth = 2.4;
  tooth(1, 1); ctx.stroke();
  tooth(0.74, 0.68); ctx.stroke();
  ctx.strokeStyle = 'rgba(36,40,46,0.75)'; ctx.lineWidth = 1.1;
  ctx.fillStyle = 'rgba(36,40,46,0.9)';
  ctx.font = '15px ' + SAN;
  ctx.textAlign = 'left';
  const lead = (x0, y0, x1, y1, n) => {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.arc(x0, y0, 2.4, 0, 7); ctx.fill();
    ctx.fillText(n, x1 + 6, y1 + 5);
  };
  lead(-47, -16, -84, -40, '10');
  lead(-22, 10, -84, 34, '12');
  lead(45, 26, 66, 52, '14');
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(60,64,70,0.8)';
  fit('FIG. 1', iw*0.3, w*0.030, w*0.012, '600', SAN);
  ctx.fillText('FIG. 1', 0, restTop + figH);
  clearTrack();

  /* ── «ОПИСАНИЕ» СЛЕВА, ПЕЧАТЬ СПРАВА. Две колонки серых линеек залезали под
     печать; теперь текст занимает левые 58% полосы, печать стоит в правых. */
  {
    const specTop = restTop + figH + w*0.030;
    const specW = iw * 0.56;
    const rows = [0.96, 0.88, 0.94, 0.71, 0.92, 0.85, 0.63, 0.90];
    const stepY = Math.max(w*0.020, (restBot - specTop) / (rows.length + 0.5));
    ctx.fillStyle = 'rgba(70,74,80,0.24)';
    let ry = specTop;
    for (const r of rows){
      if (ry > restBot) break;
      ctx.fillRect(ix, ry, specW * r, Math.max(1, w*0.009));
      ry += stepY;
    }

    // ── ПЕЧАТЬ ──
    const R = Math.min(w*0.115, (restBot - specTop) * 0.46);
    const sx = ix + iw - R*1.02, sy2 = (specTop + restBot) / 2;
    ctx.save();
    ctx.translate(sx, sy2);
    ctx.fillStyle = 'rgba(126,42,38,0.13)';
    ctx.beginPath();
    for (let i = 0; i < 72; i++){
      const a = i / 72 * Math.PI * 2, rr = R * (i % 2 ? 1 : 0.955);
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(126,42,38,0.55)';
    ctx.lineWidth = Math.max(1, w*0.005);
    ctx.beginPath(); ctx.arc(0, 0, R*0.90, 0, 7); ctx.stroke();
    ctx.lineWidth = Math.max(1, w*0.002);
    ctx.beginPath(); ctx.arc(0, 0, R*0.80, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R*0.50, 0, 7); ctx.stroke();
    const ring = (txt, radius, from, to, size, flip) => {
      ctx.font = `600 ${size.toFixed(2)}px ${SAN}`;
      ctx.textAlign = 'center';
      const step = (to - from) / Math.max(1, txt.length - 1);
      for (let i = 0; i < txt.length; i++){
        ctx.save();
        ctx.rotate(from + step * i);
        ctx.translate(0, flip ? radius : -radius);
        if (flip) ctx.rotate(Math.PI);
        ctx.fillText(txt[i], 0, 0);
        ctx.restore();
      }
    };
    ctx.fillStyle = 'rgba(126,42,38,0.72)';
    ring('RESEARCH AND DEVELOPMENT', R*0.855, -Math.PI*0.60, Math.PI*0.60, R*0.135, false);
    ring('IRVINE  CALIFORNIA', R*0.855, -Math.PI*0.28, Math.PI*0.28, R*0.135, true);
    ctx.save();
    ctx.scale(R*0.0062, R*0.0062);
    ctx.strokeStyle = 'rgba(126,42,38,0.75)'; ctx.lineWidth = 5;
    tooth(0.62, 0.62); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(126,42,38,0.85)';
    ctx.textAlign = 'center';
    fit('2000', R*0.8, R*0.26, R*0.04, '700', SAN);
    ctx.fillText('2000', 0, R*0.40);
    clearTrack();
    ctx.restore();
  }

  // ── нижняя строка: правило, которое в компании действительно есть ──
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(60,64,70,0.7)';
  const FOOT = 'Renewed every year since — two or three new products a year';
  fit(FOOT, iw*0.62, w*0.028, 0, '', SER);
  ctx.fillText(FOOT, ix, by + bh2 - w*0.030);

  ctx.restore();

  if (d.cap){
    const seg = segAt(b.x);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = eraFont(19 * kk * SS, '', seg.font);
    ctx.fillStyle = `rgba(${seg.ink},0.55)`;
    ctx.fillText(d.cap, ax, py(d.cy + d.w * 1.28 / 2 + 44, kk));
    ctx.restore();
  }
}
function drawDocCard(b, bi){
  const d = b.doc;
  const wz = (segAt(b.x).tz || wallZAt(b.x)) - 12, kk = k(wz);
  const ax = wallSX(b.x, d.dx, kk);
  rivet('doc:' + b.x, ax, k(exhibitZ(b.x)));
  const w = d.w * kk * SS, h = w * 1.28;
  const cy = py(d.cy, kk);
  if (ax < -w * 2 || ax > W + w * 2) return;
  const hot = state.docHot ? 1 : 0;
  ctx.save();
  ctx.translate(ax, cy);
  ctx.rotate((d.rot || 0) * Math.PI / 180);
  // the frame, then the paper inside it
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14 * kk * SS; ctx.shadowOffsetY = 6 * kk * SS;
  ctx.fillStyle = '#2c2118';
  ctx.fillRect(-w/2, -h/2, w, h);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const pad = w * 0.055;
  const pg = ctx.createLinearGradient(0, -h/2, 0, h/2);
  pg.addColorStop(0, '#efe6d2'); pg.addColorStop(1, '#d9cdb4');
  ctx.fillStyle = pg;
  ctx.fillRect(-w/2 + pad, -h/2 + pad, w - pad*2, h - pad*2);
  // heading, rule, and the grey ghost of the text under it
  const ix = -w/2 + pad*2.1, iw = w - pad*4.2;
  ctx.fillStyle = 'rgba(52,42,30,0.92)';
  ctx.font = `600 ${(w*0.082).toFixed(1)}px "Helvetica Neue", Arial, sans-serif`;
  ctx.textAlign = 'left';
  try { ctx.letterSpacing = (w*0.014).toFixed(1) + 'px'; } catch(e){}
  ctx.fillText('Open items', ix, -h/2 + pad*3.6);
  try { ctx.letterSpacing = '0px'; } catch(e){}
  ctx.fillStyle = 'rgba(120,40,30,0.75)';
  ctx.fillRect(ix, -h/2 + pad*4.5, iw * 0.42, Math.max(1, w*0.012));
  const rows = [0.92, 0.74, 0.86, 0.55, 0, 0.88, 0.70, 0.90, 0.62, 0, 0.84, 0.66, 0.79];
  let ry = -h/2 + pad*6.4;
  for (const r of rows){
    if (r > 0){
      ctx.fillStyle = 'rgba(70,60,46,' + (0.30 + 0.16*hot).toFixed(2) + ')';
      ctx.fillRect(ix, ry, iw * r, Math.max(1, w*0.016));
    }
    ry += h * 0.052;
  }
  ctx.restore();
  pushHit(ax - w/2, cy - h/2, w, h, {type:'doc'});
}

/* ---------------- PLASMAS · living wall screens of the white room ---------------- */
function drawPlasmaPanel(b, t){
  const p = b.plasma;
  const kk = k((segAt(b.x).tz || wallZAt(b.x)) - 14);

/* a freestanding table plane, rotated in plan — any yaw, anywhere on the floor */
function drawYawedTable(cx, cz, yawDeg, wW, dW, topY, hW, tone){
  const a = yawDeg * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const P = (lx, lz) => {                     // local table coords -> screen
    const wx = cx + lx*ca - lz*sa, wz = cz + lx*sa + lz*ca;
    return {x: px(wx, k(wz)), kt: k(wz), z: wz};
  };
  const c1 = P(-wW/2, -dW/2), c2 = P(wW/2, -dW/2), c3 = P(wW/2, dW/2), c4 = P(-wW/2, dW/2);
  const top = (p) => py(topY, p.kt), bot = (p) => py(topY + hW, p.kt);
  // legs/skirt: the two faces whose outer edge is nearest the camera
  const faces = [[c1, c2], [c2, c3], [c3, c4], [c4, c1]]
    .filter(([p, q]) => (p.z + q.z)/2 <= cz)       // faces angled toward us
    .sort((f, g) => (g[0].z + g[1].z) - (f[0].z + f[1].z));
  for (const [p, q] of faces){
    const g = ctx.createLinearGradient(0, top(p), 0, bot(p));
    g.addColorStop(0, tone.side0); g.addColorStop(1, tone.side1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x, top(p)); ctx.lineTo(q.x, top(q));
    ctx.lineTo(q.x, bot(q)); ctx.lineTo(p.x, bot(p));
    ctx.closePath(); ctx.fill();
  }
  // the top plane
  ctx.fillStyle = tone.top;
  ctx.beginPath();
  ctx.moveTo(c1.x, top(c1)); ctx.lineTo(c2.x, top(c2));
  ctx.lineTo(c3.x, top(c3)); ctx.lineTo(c4.x, top(c4));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = tone.edge; ctx.lineWidth = 1.5*SS;
  ctx.stroke();
  return {c1, c2, c3, c4, P};
}
