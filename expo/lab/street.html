<!doctype html>
<!--
  БЛОК 1989: ПОЛ, СТЕНА, СТУПЕНЬКА, КОЛОННЫ. БОЛЬШЕ НИЧЕГО.

  Эльдар, 2026-09-25: «удали всё и создай только тот блок с полом, стеной и
  ступенькой и колоннами 1989, больше ничего». И следом, по первому заходу:
  «почему так вплотную к стене», «почему не идентично нашей геометрии»,
  «где правая стенка ступеньки», «почему всё поплыло».

  ВСЕ ТРИ ЖАЛОБЫ БЫЛИ ОБ ОДНОМ: я ПЕРЕСКАЗАЛ код зала вместо того, чтобы его
  скопировать. Отсюда и разъехалось:

  1. «Вплотную к стене» — зал считает масштаб как SS = H / 1080, то есть от
     ВЫСОТЫ холста против опорной высоты, а я взял devicePixelRatio. При том
     же окне мир получался вдвое крупнее. Теперь строка та же, что в зале.
  2. «Где правая стенка ступеньки» — у блока в зале есть ТОРЦЫ, и они
     открываются, когда бухта уходит от центра кадра. Я оборвал функцию на
     носике и торцы просто не перенёс.
  3. «Не идентично» — носик рисовался другой толщины, у подступёнка не было
     подсветки скрытой лентой, у торца не было своей.

  Поэтому здесь теперь не пересказ: три блока ниже помечены «ДОСЛОВНО ИЗ
  ЗАЛА» и скопированы из expo.html как есть, вместе с их же комментариями.
  Если что-то расходится с залом — это ошибка копии, и чинить надо копию.

  Камера: перетаскивание и стрелки — вдоль ленты; Home — обратно на бухту.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Блок 1989</title>
<style>
  html,body{margin:0;height:100%;background:#0e1114;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas.drag{cursor:grabbing}
  #hud{position:fixed;left:14px;top:12px;color:rgba(255,255,255,.55);
       font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       text-shadow:0 1px 6px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
(() => {
/* ══ ЧИСЛА ЗАЛА. Скопированы из expo.html, менять здесь нельзя ═══════════ */
const CFG = {F: 900, horizon: 430, floor: 1080, refH: 1080, dprCap: 2};
const REC3_L = 13620, REC3_R = 14720;   // бухта 1989 на готовой ленте
const R89_BAY_Z = 680;                  // SEGMENTS[1].z0 — плоскость её пилястр
const STEP_PAD = 60;                    // насколько блок выходит за пилястры
const STEP_DEPTH = 88;                  // noseOf(z) = z - STEP_DEPTH
const noseOf = zBay => zBay - STEP_DEPTH;
/* STEP_TONE.steel и FLOOR_TONES.rec.r1989 — оттуда же */
const STEP_TONE_STEEL = {tread: ['#b9bcbb', '#d2d5d3'], riser: ['#9ea2a2', '#787c7d', '#4e5254'],
                         nosing: 'rgba(238,244,246,0.9)', glow: '214,236,246'};
const FLOOR_89 = ['#d3d1c9', '#8b897f'];

/* ?x=<единиц> ставит камеру сразу — нужно, чтобы снимать одно и то же место
   и сверять его с залом, а не ловить перетаскиванием */
const camQ = /[?&]x=(-?\d+)/.exec(location.search);
const cam = {x: camQ ? +camQ[1] : (REC3_L + REC3_R) / 2, z: 0};
let W = 0, H = 0, SS = 1;
const k  = z => CFG.F / (CFG.F + z - cam.z);
const px = (x, kk) => W / 2 + (x - cam.x) * kk * SS;
const py = (y, kk) => (CFG.horizon + (y - CFG.horizon) * kk) * SS;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
/* ── ДОСЛОВНО ИЗ ЗАЛА: resize(). Масштаб берётся от ВЫСОТЫ холста против
   опорной высоты 1080 — именно это и делает кадр тем же, что в зале. */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
  W = cv.width  = Math.round(innerWidth  * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  ctx.imageSmoothingQuality = 'medium';
  SS = H / CFG.refH;
  draw();
}

/* ── ДОСЛОВНО ИЗ ЗАЛА: drawBayStep() ─────────────────────────────────────
   Со всеми его частями, включая торцы — их-то и не хватало. */
function drawBayStep(L, R, tone, zBack, zNose){
  const zB = zBack != null ? zBack : 590;
  const zF = zNose != null ? zNose : (zBack != null ? zBack - 82 : 520);
  const kFar = k(zB), kStep = k(zF), zTread = 1040;
  /* THE BACK EDGE IS THE WALL'S FOOT. A block standing in a niche is deeper
     than the wall beside it, so a back edge taken at the block's own plane sits
     ABOVE the skirting and the two lines never meet. */
  const yTreadBack = py(zTread, kFar);
  const yNose = py(zTread, kStep), yStepFoot = py(1080, kStep);
  /* AND THE BLOCK KEEPS ITS THICKNESS AT THE BACK: the base is the tread's own
     line plus the block's own height at that plane, so the end is a quad. */
  const yBackFoot = py(1080, kFar);
  /* BOLTED TO THE BAY: it runs from pilaster to pilaster, half a column past
     each, in the bay's own world coordinates. */
  const wx0 = L - STEP_PAD, wx1 = R + STEP_PAD;
  const bx0 = px(wx0, kFar), bx1 = px(wx1, kFar);
  const nx0 = px(wx0, kStep), nx1 = px(wx1, kStep);
  if (nx1 < -200 || nx0 > W + 200) return;
  const T = tone;
  const tg = ctx.createLinearGradient(0, yTreadBack, 0, yNose);
  tg.addColorStop(0, T.tread[0]); tg.addColorStop(1, T.tread[1]);
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.moveTo(bx0, yTreadBack); ctx.lineTo(bx1, yTreadBack);
  ctx.lineTo(nx1, yNose); ctx.lineTo(nx0, yNose); ctx.closePath(); ctx.fill();
  const rg = ctx.createLinearGradient(0, yNose, 0, yStepFoot);
  rg.addColorStop(0, T.riser[0]); rg.addColorStop(0.5, T.riser[1]); rg.addColorStop(1, T.riser[2]);
  ctx.fillStyle = rg;
  ctx.fillRect(nx0, yNose, nx1 - nx0, yStepFoot - yNose);
  ctx.fillStyle = T.nosing;
  ctx.fillRect(nx0, Math.round(yNose), nx1 - nx0, Math.max(1, 1.4 * SS));
  /* THE BLOCK HAS ENDS, AND THEY ARE THE SAME STONE. Each end is a quad from
     the back edge to the nose; it takes the riser's own three tones, the
     concealed strip turns the corner at half strength, and the only difference
     left is a tenth of shade. */
  const eg = ctx.createLinearGradient(0, yNose, 0, yStepFoot);
  eg.addColorStop(0, T.riser[0]); eg.addColorStop(0.5, T.riser[1]); eg.addColorStop(1, T.riser[2]);
  const endFace = (xb, xn) => {
    if (Math.abs(xn - xb) < 0.5) return;
    const path = () => { ctx.beginPath(); ctx.moveTo(xb, yTreadBack); ctx.lineTo(xn, yNose);
                         ctx.lineTo(xn, yStepFoot); ctx.lineTo(xb, yBackFoot); ctx.closePath(); };
    ctx.fillStyle = eg; path(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const eglow = ctx.createLinearGradient(0, yNose + 2 * SS, 0, yStepFoot);
    eglow.addColorStop(0, `rgba(${T.glow},0.62)`); eglow.addColorStop(0.4, `rgba(${T.glow},0.24)`);
    eglow.addColorStop(1, `rgba(${T.glow},0.03)`);
    ctx.fillStyle = eglow; path(); ctx.fill();
    ctx.restore();
  };
  if (nx1 < bx1) endFace(bx1, nx1);   // правый торец открывается, когда бухта левее центра
  if (nx0 > bx0) endFace(bx0, nx0);   // левый — когда правее
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createLinearGradient(0, yNose + 2 * SS, 0, yStepFoot);
  lg.addColorStop(0, `rgba(${T.glow},0.80)`); lg.addColorStop(0.4, `rgba(${T.glow},0.30)`);
  lg.addColorStop(1, `rgba(${T.glow},0.04)`);
  ctx.fillStyle = lg; ctx.fillRect(nx0, yNose + 2 * SS, nx1 - nx0, yStepFoot - yNose - 2 * SS);
  ctx.restore();
}

/* ── ДОСЛОВНО ИЗ ЗАЛА: пол бухты (плита из drawFloor) ────────────────────
   Дальние углы — на плоскости самой бухты, на её линии пола 1080
   (stepFoot(x, R89_BAY_Z) даёт ровно эту пару); ближний край — на плоскости
   -40 и дальше вниз за кадр. Градиент от дальней линии до низа кадра. */
function drawBayFloor(){
  const kBay = k(R89_BAY_Z), kNear = k(-40);
  const wx0 = REC3_L - STEP_PAD, wx1 = REC3_R + STEP_PAD;
  const yFar = py(CFG.floor, kBay);
  const g = ctx.createLinearGradient(0, yFar, 0, H);
  g.addColorStop(0, FLOOR_89[0]); g.addColorStop(1, FLOOR_89[1]);
  ctx.beginPath();
  ctx.moveTo(px(wx0, kBay), yFar); ctx.lineTo(px(wx1, kBay), yFar);
  ctx.lineTo(px(wx1, kNear), H);   ctx.lineTo(px(wx0, kNear), H);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();
}

/* ── ДОСЛОВНО ИЗ ЗАЛА: панель и пилястры (из drawRec3) ──────────────────── */
function drawBayWallAndColumns(){
  const yBase = py(1040, k(R89_BAY_Z));
  const x0 = px(REC3_L - STEP_PAD, k(R89_BAY_Z)), x1 = px(REC3_R + STEP_PAD, k(R89_BAY_Z));
  const wg = ctx.createLinearGradient(0, 0, 0, yBase);
  wg.addColorStop(0, '#7d8894');
  wg.addColorStop(0.4, '#9aa5b0');
  wg.addColorStop(1, '#5f6873');
  ctx.fillStyle = wg;
  ctx.fillRect(x0, 0, x1 - x0, yBase);
  for (const wxc of [REC3_L, REC3_R]){
    const kc = k(R89_BAY_Z);
    const sxc = px(wxc, kc);
    const cw = 120 * kc * SS;
    const yFootC = py(1080, kc);
    if (sxc < -cw || sxc > W + cw) continue;
    const cg = ctx.createLinearGradient(sxc - cw/2, 0, sxc + cw/2, 0);
    cg.addColorStop(0, '#23262b'); cg.addColorStop(0.45, '#5c636b'); cg.addColorStop(1, '#1b1e22');
    ctx.fillStyle = cg;
    ctx.fillRect(sxc - cw/2, 0, cw, yFootC);
    // brushed-steel trim
    ctx.fillStyle = 'rgba(198,210,220,0.5)';
    ctx.fillRect(sxc - cw/2 + 2*SS, 0, 2.2*SS, yFootC);
    ctx.fillRect(sxc + cw/2 - 4.2*SS, 0, 2.2*SS, yFootC);
    ctx.fillStyle = 'rgba(210,235,255,0.14)';
    ctx.fillRect(sxc - cw/2 + 6*SS, 0, 3*SS, yFootC);
  }
}

/* ── ОДНА ПЛОСКОСТЬ ПЕРПЕНДИКУЛЯРНО, С ОКНОМ ─────────────────────────────
   Эльдар, 2026-09-25: «добавь одну такую плоскость перпендикулярно ровно.
   Там дырка — окно». На его кадре она закрашена зелёным и идёт от правого
   края блока вправо и НА НАС, а в ней белый проём.

   Что значит «перпендикулярно» в нашей проекции: это плоскость постоянного
   x, уходящая по z. Каждая её точка — (y, z) при одном и том же x, и k
   берётся по собственному z точки. Дальний край стоит на плоскости бухты
   (680), ближний вынесен к нам; поэтому на экране она раскрывается клином
   вправо и вниз — ровно как на его кадре.

   Дырка сделана вторым, обратным контуром и заливкой 'evenodd': так проём
   вырезан В САМОЙ плоскости, а не нарисован поверх неё, и сквозь него видно
   то, что лежит дальше. */
const COL_W = 120;        // ширина пилястры в зале — на неё и сдвинута вторая стена
const WALL = {
  x: REC3_R + STEP_PAD,   // от правого края блока — там, где кончился белый пол
  /* ВТОРАЯ ТАКАЯ ЖЕ, ПРАВЕЕ НА ШИРИНУ КОЛОННЫ. Эльдар, 2026-09-25: «ровно
     такую же создай стену и положи её правее рядом (сдвигается вправо на
     ширину колонны)». Это те же четыре числа, только x другой. */
  dx2: COL_W,
  zFar: R89_BAY_Z,        // дальний край: на плоскости бухты
  zNear: -400,            // ближний: вынесен к нам
  top: -520,              // потолок зала
  bot: 1080,              // пол
  /* ОКНО НЕ КОНЧАЕТСЯ — ОНО ДОХОДИТ ДО БЛИЖНЕГО КРАЯ ПЛОСКОСТИ. Сперва я
     оставил справа от проёма полосу стены; Эльдар зачеркнул её: «я не просил
     это рисовать — там нет стены, там окно продолжается» (2026-09-25).
     Поэтому ближний край проёма совпадает с ближним краем самой плоскости, и
     стена остаётся только сверху, снизу и в дальнем конце. */
  winZ0: 560, winZ1: null,     // null = до ближнего края плоскости
  winTop: -260, winBot: 700,   // по высоте: низ на линии прилавка
};
function drawSideWall(xw){
  const Wl = WALL;
  const P = (y, z) => [px(xw, k(z)), py(y, k(z))];
  const outer = [P(Wl.top, Wl.zFar), P(Wl.top, Wl.zNear), P(Wl.bot, Wl.zNear), P(Wl.bot, Wl.zFar)];
  const wz1 = Wl.winZ1 != null ? Wl.winZ1 : Wl.zNear;
  const hole  = [P(Wl.winTop, Wl.winZ0), P(Wl.winBot, Wl.winZ0),
                 P(Wl.winBot, wz1), P(Wl.winTop, wz1)];   // обратный обход
  /* грань под прямым углом к свету теряет часть его — берём тон панели бухты
     и гасим, иначе плоскость читается продолжением стены, а не поворотом */
  const g = ctx.createLinearGradient(...outer[0], ...outer[1]);
  g.addColorStop(0, '#6c7681'); g.addColorStop(1, '#8b95a0');
  ctx.beginPath();
  outer.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  hole.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill('evenodd');
}

/* порядок тот же, что в зале: пол → панель с пилястрами → блок поверх их подошв */
function draw(){
  if (!W) return;
  ctx.fillStyle = '#0e1114'; ctx.fillRect(0, 0, W, H);
  drawBayFloor();
  drawBayWallAndColumns();
  drawBayStep(REC3_L, REC3_R, STEP_TONE_STEEL, R89_BAY_Z, noseOf(R89_BAY_Z));
  /* ПЛОСКОСТЬ РИСУЕТСЯ ПОСЛЕ БУХТЫ, А НЕ ДО. Она стоит на x правого края
     блока и уходит ОТ плоскости бухты К НАМ (z от 680 до −400), то есть она
     ближе всего, что есть в бухте. Пока камера левее её, она раскрывается
     вправо и ни на что не налезает — и первый заход, где она рисовалась
     первой, этого не показывал. Стоит камере пройти её, как плоскость
     раскрывается ВЛЕВО, ложится на панель бухты — и панель, нарисованная
     позже, стирала её целиком. Эльдар: «когда стена проходит свой катарсис,
     она пропадает» (2026-09-25). Ближнее рисуется последним. */
  /* ДАЛЬНЯЯ ОТ КАМЕРЫ — ПЕРВОЙ. Две параллельные стены в 120 единицах друг
     от друга перекрываются на экране; порядок решает, какая из них видна
     сквозь окно другой. Считаем по |x − cam.x|: та, что дальше вбок, ложится
     раньше. Иначе, пройдя их, зал показал бы изнанку — ту же ошибку, что с
     пропадавшей стеной. */
  for (const xw of [WALL.x, WALL.x + WALL.dx2].sort((a, b) => Math.abs(b - cam.x) - Math.abs(a - cam.x)))
    drawSideWall(xw);
  document.getElementById('hud').textContent =
    'блок 1989 · ' + REC3_L + '…' + REC3_R + ' · плоскость ' + R89_BAY_Z +
    ' · нос ' + noseOf(R89_BAY_Z) + ' · SS ' + SS.toFixed(3) + ' · камера ' + Math.round(cam.x);
}

/* ── КАМЕРА ──────────────────────────────────────────────────────────── */
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = {x: e.clientX, cam: cam.x};
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.x = drag.cam - (e.clientX - drag.x) * 4; draw();
});
const stop = () => { drag = null; cv.classList.remove('drag'); };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  cam.x += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 4; draw();
}, {passive: false});
addEventListener('keydown', e => {
  const step = e.shiftKey ? 600 : 150;
  if (e.key === 'ArrowRight') cam.x += step;
  else if (e.key === 'ArrowLeft') cam.x -= step;
  else if (e.key === 'Home') cam.x = (REC3_L + REC3_R) / 2;
  else return;
  draw();
});
addEventListener('resize', resize);
resize();
})();
</script>
</body>
</html>
