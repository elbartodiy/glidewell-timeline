# The bridge between the Tapo C113 and the hall's browser.
# The camera speaks RTSP (H.264); a browser cannot. go2rtc re-serves the same
# stream as WebRTC without re-encoding, on this computer only.
# Credentials are NOT here: they come from camera.env (see README.md), which
# is never committed.
api:
  listen: "127.0.0.1:1984"   # the hall asks here
  origin: "*"                # the hall may be served from GitHub Pages or localhost
rtsp:
  listen: ""                 # we re-serve nothing as RTSP
webrtc:
  listen: ":8555"
streams:
  tapo:    rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream1   # 2K, for photos and screens
  tapo_sd: rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream2   # 640x360, light
