<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glidewell — Documentary timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13171B;--ink-2:#4A555F;--paper:#F4F6F8;--card:#FFFFFF;--line:#E4E8EC;
    --navy:#1C2024;--slate:#9098A0;--teal:#137C7C;--clay:#E11B2A;
    --red:#E11B2A;--red-bright:#F5404B;--red-tint:#FCEDEE;
    --ok:#1F7A57;--warn:#B07A16;--mute:#8A929B;
    --disp:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;line-height:1.05}
  .mono{font-family:var(--mono)}

  header.top{background:var(--ink);color:#EDF1F5;padding:12px 26px;position:relative}
  header.top .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red-bright)}
  header.top h1{font-family:var(--disp);font-weight:300;font-size:12.5px;letter-spacing:.01em;margin:0;max-width:none;color:#E11B2A;white-space:normal;line-height:1.3;display:flex;flex-direction:column}
  header.top h1 .hmsg{display:block}
  header.top h1 .hmsg.mid{font-style:normal;color:#fff;font-weight:400}
  header.top .brandrow{display:flex;align-items:center;gap:14px}
  header.top .gwmark{flex:none;display:block;line-height:0;text-decoration:none}
  header.top .gwmark svg{display:block}
  header.top .gwmark .gw-logo-svg{height:30px;width:auto}
  header.top .brandtext{min-width:0}
  .hmsg-link{color:inherit;text-decoration:none;border:none;font:inherit;cursor:default}
  footer .aimos{display:inline-flex;align-items:center;gap:18px;color:#9FB0BE;text-decoration:none;text-transform:none;letter-spacing:.02em}
  footer .aimos img{height:18px;width:auto;display:block;opacity:.95}
  footer .aimos .aimos-wm{font-family:var(--disp);font-weight:600;letter-spacing:.02em;color:#EDF1F5}
  footer .aimos .aimos-logo{height:38px;width:auto;display:block;mix-blend-mode:screen}
  footer .aimos .mw-txt{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:var(--slate)}
  footer .sheetlink{color:inherit;text-decoration:none;cursor:text}
  header.top .hint{font-family:var(--mono);font-size:12px;color:#9FB0BE;margin-top:8px;letter-spacing:.02em;max-width:90ch}
  .langtoggle{margin-left:auto;display:flex;border:1px solid #2A3744;border-radius:16px;overflow:hidden}
  .langtoggle button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:#10161D;color:#9FB0BE;border:0;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .langtoggle button[aria-pressed="true"]{background:var(--red);color:#fff}

  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#9FB0BE;margin-left:auto;margin-right:0}
  .bar .nav{display:flex;gap:6px;flex-wrap:wrap}
  .bar button{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:#C7D1DA;background:#1B232C;border:1px solid #2A3744;border-radius:16px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .bar button:hover{border-color:var(--red-bright);color:#fff}
  .bar .legend{margin-left:6px;display:flex;gap:14px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .bar .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .lg-g i{background:var(--red)} .lg-i i{background:#3E7BD6} .lg-s i{background:#fff;border-radius:50%}

  .scroller{overflow-x:auto;overflow-y:hidden;cursor:grab}
  .scroller.grabbing{cursor:grabbing}
  .scroller::-webkit-scrollbar{height:12px}
  .scroller::-webkit-scrollbar-track{background:#E1E6EC}
  .scroller::-webkit-scrollbar-thumb{background:#B9C2CC;border-radius:8px;border:3px solid #E1E6EC}
  .stage{position:relative;height:940px}
  .stage.dim .chip:not(.hl){opacity:.32}
  .stage.dim .ev:not(.hl){opacity:.4}

  svg.draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .stalk{stroke:#AAB2BC;stroke-width:1.6px;fill:none;transition:stroke .15s}
  .stalk.hl{stroke:var(--clay);stroke-width:2.4px}
  .mainrail{filter:drop-shadow(0 1.5px 1px rgba(28,32,36,.18))}
  .nd{stroke:#fff;stroke-width:2px;transition:r .18s cubic-bezier(.2,.7,.2,1),fill .18s;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 1px 1.5px rgba(28,32,36,.22))}
  .nd.t-g{fill:var(--navy)} .nd.t-i{fill:var(--slate)} .nd.t-m{fill:var(--teal)}
  .nd:hover{r:9} .nd.hl{fill:var(--clay);r:8.5}
  .nd:focus-visible{outline:none;stroke:var(--clay);stroke-width:3px}
  .eraband{fill:#000;opacity:.022}
  .eradiv{stroke:#E0E4E9;stroke-width:1px;stroke-dasharray:2 5}
  .eralbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;fill:#8A94A0;text-transform:uppercase}
  .baseline-cap{font-family:var(--mono);font-size:11px;fill:#9AA3AE}

  .chip{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:6px 12px 6px 10px;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(20,30,40,.06);transition:opacity .15s,box-shadow .15s,border-color .15s;z-index:5}
  .chip:hover,.chip.hl{border-color:var(--clay);background:var(--red-tint);box-shadow:0 3px 10px rgba(225,27,42,.12)}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .chip .nm{font-family:var(--body);font-weight:500;font-size:13px;color:var(--ink)}
  .chip .rl{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.02em}
  /* dot = group marker on the line. For now: only Glidewell staff (Internal) shown, in red. Other groups hidden until we wire a scheme. */
  .dot.g-g{background:var(--clay)} .dot.g-x,.dot.g-k,.dot.g-e{display:none}

  .ev{position:absolute;transform:translateX(-50%);width:226px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;border-top:3px solid var(--red);padding:12px 13px;cursor:pointer;transition:box-shadow .15s,transform .15s,opacity .15s;z-index:4;min-height:250px}
  .ev.t-i{border-top-color:var(--teal)}
  .ev:hover,.ev.hl{box-shadow:0 10px 28px -6px rgba(28,32,36,.20),0 2px 6px rgba(28,32,36,.08);transform:translateX(-50%) translateY(-3px);border-color:var(--slate)}
  .ev:focus-visible{outline:none;box-shadow:0 0 0 2px var(--clay);transform:translateX(-50%) translateY(-3px)}
  .ev .yr{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--red)}
  .ev.t-i .yr{color:var(--teal)}
  .ev h3{font-size:18px;letter-spacing:-.01em;margin:3px 0 5px;padding-right:56px}
  .ev-ico{position:absolute;top:10px;right:12px;width:52px;height:36px;object-fit:contain;object-position:center;pointer-events:none}
  .ev .d{font-size:12px;line-height:1.45;color:var(--ink-2)}
  .ev .th{font-size:11.5px;line-height:1.4;color:var(--teal);font-style:italic;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  .ev .star{position:absolute;top:-9px;right:-7px;background:var(--clay);color:#fff;font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:10px}
  .morep{position:absolute;z-index:5;background:var(--card);border:1px dashed var(--slate);border-radius:8px;padding:7px 11px;cursor:pointer;max-width:172px;transition:box-shadow .15s,transform .15s}
  .morep:hover{box-shadow:0 4px 14px rgba(19,23,27,.10);transform:translateY(-2px)}
  .morep .mp-ttl{font-family:var(--body);font-size:13px;font-weight:600;color:var(--navy)}
  .morep .mp-sub{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:2px}
  .scq{margin:14px 0;padding:12px 14px;background:var(--card);border:1px solid var(--slate);border-radius:10px}
  .scq-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .scq-h img{width:44px;height:44px;border-radius:50%;object-fit:cover}
  .scq-h b{cursor:pointer}
  .scq-ok{color:#1DA24A;font-weight:800}
  .scq.plan{border-style:dashed}
  .scq-ask{color:#8A93A3;font-weight:800}
  .qbank{margin:2px 0 0;padding-left:0;list-style:none}
  .qbank li{font-size:13px;line-height:1.5;margin:7px 0;padding-left:2px}
  .qs-src{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:1px 6px;margin-right:7px;white-space:nowrap;color:#fff}
  .qs-neil{background:#5B8DEF} .qs-az{background:#4F93A6} .qs-prep{background:#9AA6B2}
  .scq-role{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid;border-radius:9px;padding:1px 7px;white-space:nowrap}
  .scq-d{color:var(--mute);font-size:12px}
  .scq-b{font-size:13.5px;line-height:1.55}
  .linelegend{position:absolute;z-index:5;font-family:var(--mono);white-space:nowrap}
  .linelegend .lgnd-ttl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .lgnd-row{display:flex;align-items:center;gap:8px;font-size:11px;white-space:nowrap;color:var(--ink-2);cursor:pointer;padding:2px 5px;border-radius:5px;transition:background .15s}
  .lgnd-row:hover{background:var(--card)}
  .lgnd-sw{width:22px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 auto}
  .catsw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;display:inline-block}
  .catrow{cursor:default}
  .catrow:hover{background:transparent!important}
  .lgnd-sep{height:1px;background:var(--line,#d9d6cf);opacity:.7;margin:6px 5px}
  .linelegend{min-height:128px;box-sizing:border-box}
  .topbtn{width:158px;height:54px;box-sizing:border-box;display:flex;flex-direction:row;align-items:center;gap:10px;text-align:left}
  .topbtn .mp-ttl{font-size:12px}
  .pers-ico{height:30px;width:auto;pointer-events:none}
  .calbtn{width:128px;height:128px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .calbtn .cal-ico{height:46px;width:auto;pointer-events:none}
  .calbtn .mp-ttl{font-size:13px}
  #panel .cal-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  #panel .cal-btn{font-family:var(--mono);font-size:12px;text-decoration:none;border-radius:999px;padding:7px 14px;border:1px solid var(--line,#e5e3df);background:var(--card);color:var(--ink)}
  #panel .cal-btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  #panel .cal-embed{margin-top:10px}
  #panel .cal-embed iframe{width:100%;height:58vh;min-height:420px;border:0;border-radius:10px;background:#fff}
  .lgnd-sw.cap{border-top-color:#E11B2A}
  .lgnd-sw.terr{border-top-color:#2C6E9E}
  .lgnd-sw.emp{border-top-color:#5A5550;border-top-style:dashed}
  .bld{position:absolute;z-index:6;transform:translateX(-50%);cursor:pointer;line-height:0}
  .bld::after{content:"";position:absolute;left:50%;top:16px;width:1px;height:22px;background:#2C6E9E;opacity:.4}
  .bld .bld-ico{display:block;fill:#2C6E9E;stroke:var(--paper,#fdfcf9);stroke-width:1.6px;paint-order:stroke;transition:fill .15s}
  .bld:hover .bld-ico{fill:var(--red)}
  .bld:hover{transform:translateX(-50%) translateY(-2px)}
  .ppl{position:absolute;z-index:6;transform:translateX(-50%);cursor:pointer;line-height:0}
  .ppl::after{content:"";position:absolute;left:50%;top:16px;width:1px;height:22px;background:#5A5550;opacity:.4}
  .ppl .ppl-ico{display:block;fill:#5A5550;stroke:var(--paper,#fdfcf9);stroke-width:1.4px;paint-order:stroke;transition:fill .15s}
  .ppl:hover .ppl-ico{fill:var(--red)}
  .ppl:hover{transform:translateX(-50%) translateY(-2px)}
  #panel .scthemes{display:flex;flex-direction:column;gap:11px;margin-top:4px}
  #panel .scth-t{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.4}
  #panel .scth-who{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  #panel .thspk{font-family:var(--mono);font-size:11px;background:var(--card,#f3f1ec);border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
  #panel .thspk:hover{border-color:var(--red);color:var(--red)}
  #panel .scth-none{font-size:12px;color:var(--mute);font-style:italic}
  /* preview frame thumbnails on the line */
  .frame-thumb{position:absolute;z-index:5;border-radius:4px;overflow:hidden;cursor:pointer;background:#EAEEF1;border:1px solid var(--line,#d9d6cf);box-shadow:0 1px 4px rgba(19,23,27,.08);transition:transform .15s,box-shadow .15s}
  .frame-thumb:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(19,23,27,.16);border-color:var(--red)}
  .frame-thumb .frame-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .frame-thumb .frame-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .line-photo{position:absolute;z-index:6;border-radius:4px;overflow:hidden;background:#EAEEF1;border:1px solid var(--line,#d9d6cf);box-shadow:0 1px 5px rgba(19,23,27,.12);transition:transform .15s,box-shadow .15s}
  .line-photo:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 18px rgba(19,23,27,.2);border-color:var(--red)}
  .line-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .lp-film{cursor:pointer}
  .lp-film .lp-badge{position:absolute;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(16,20,24,.85));color:#fff;font-family:var(--mono,monospace);font-size:9px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:12px 3px 3px;line-height:1;pointer-events:none}
  .lp-film:hover .lp-badge{background:linear-gradient(transparent,rgba(225,27,42,.9))}
  .spk-brief{font-size:12.5px;line-height:1.6;color:var(--ink)}
  .spk-brief b{color:var(--navy);font-weight:700}
  .allsc{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .allsc-row{border-left:3px solid var(--line);padding-left:12px}
  .allsc-h{background:none;border:none;padding:0;cursor:pointer;font-family:var(--head,inherit);font-size:15px;font-weight:700;color:var(--navy);text-align:left;line-height:1.3}
  .allsc-h:hover{color:var(--red)}
  .allsc-n{font-family:var(--mono);font-size:11px;color:var(--mute);margin-right:4px}
  .allsc-d{font-size:13px;line-height:1.55;color:var(--ink);margin-top:4px}
  /* enlarged frames at the top of the scene panel */
  #panel .scframes{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
  #panel .scframe{margin:0;flex:0 1 auto;max-width:240px}
  #panel .scframe img{display:block;width:auto;max-width:240px;max-height:150px;border-radius:8px;border:1px solid var(--line)}
  #panel .scframe.noimg img{display:none}
  #panel .scframe.noimg{width:200px;height:120px;border:1px dashed var(--slate);border-radius:8px;background:var(--card)}
  #panel .scframe figcaption{font-size:11.5px;color:var(--mute);margin-top:5px;line-height:1.4;max-width:240px}
  #panel .metric-rows .mrow{font-size:13.5px;line-height:1.5;margin:5px 0;color:var(--ink-2)}
  #panel .metric-rows .mrow b{color:var(--ink);font-family:var(--mono);margin-right:8px}
  #panel .mp-row{font-size:14px;line-height:1.5;margin:6px 0;color:var(--ink-2);display:flex;align-items:center;gap:9px}
  #panel .mp-row b{color:var(--ink)}
  #panel .mp-av{height:60px;width:60px;flex:0 0 auto;border-radius:7px;object-fit:cover;background:var(--line,#e5e3df)}
  #panel .mp-tx{min-width:0}
  #panel .pers-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  #panel .pers-card{display:flex;align-items:center;gap:11px;width:calc(50% - 6px);cursor:pointer;padding:7px;border-radius:9px;transition:background .12s}
  #panel .pers-card:hover{background:var(--line,#ece9e4)}
  #panel .pers-card img{height:72px;width:72px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:var(--line,#e5e3df)}
  #panel .pers-card .pc-nm{font-size:14px;font-weight:600;color:var(--ink)}
  #panel .pers-card .pc-role{font-size:12px;line-height:1.35;color:var(--ink-2);margin-top:2px}
  /* survey controls inside the Personalities panel */
  #panel .sv-card{align-items:flex-start;cursor:default}
  #panel .sv-card:hover{background:transparent}
  #panel .sv-card .pc-tx{flex:1;min-width:0}
  #panel .sv-card img{cursor:pointer}
  #panel .sv-card .pc-nm{cursor:pointer;display:inline-block}
  #panel .sv-card .pc-nm:hover{text-decoration:underline;text-underline-offset:2px}
  #panel .sv-fams{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 6px}
  #panel .sv-connected{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 11px;border-radius:20px;background:#E4F4D6;color:#3C7A2E;border:1px solid #C5E5AE;cursor:default;user-select:none}
  .gw-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 3px;margin-left:7px;border:1.4px solid var(--red,#E11B2A);border-radius:4px;color:var(--red,#E11B2A);font-weight:800;font-size:11px;line-height:1;vertical-align:middle;font-family:var(--disp,Georgia,serif);cursor:default}
  #panel .sv-fam{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  #panel .sv-fam:hover{border-color:var(--slate)}
  #panel .sv-fam.on{background:var(--navy,#1E3A8A);color:#fff;border-color:var(--navy,#1E3A8A)}
  #panel .sv-connect{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;box-sizing:border-box}
  #panel .sv-foot{position:sticky;bottom:-30px;background:var(--paper,#fdfcf9);padding:12px 0 34px;margin-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:0 -10px 14px -10px rgba(19,23,27,.14)}
  #panel .sv-name{font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;flex:0 1 240px;max-width:240px;min-width:140px}
  #panel .sv-send{font-family:var(--mono);font-size:13px;padding:9px 18px;border:none;border-radius:7px;background:var(--red,#E11B2A);color:#fff;cursor:pointer}
  #panel .sv-send:hover{opacity:.9}
  #panel .sv-status{font-size:12px;color:var(--mute)}
  #panel .sv-resplink{color:inherit;text-decoration:none;cursor:text}
  #panel .sv-back{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:2px 0 16px;padding:10px 13px;border:1px solid var(--navy,#1E3A8A);border-radius:9px;background:rgba(30,58,138,.06);color:var(--navy,#1E3A8A);font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s}
  #panel .sv-back:hover{background:rgba(30,58,138,.13)}
  #panel .sv-back-note{margin-left:auto;font-family:var(--ui,system-ui);font-weight:400;font-size:11px;color:var(--mute);white-space:nowrap}
  #panel .pers-card .pc-tx{min-width:0}

  #panel{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -10px 40px rgba(20,30,40,.18);transform:translateY(110%);transition:transform .28s ease;height:38vh;overflow:hidden}
  #panel.open{transform:none}
  #panel.full{height:100vh;height:100dvh}

  footer{background:var(--ink);color:#9FB0BE;padding:24px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;display:flex;justify-content:flex-start;flex-wrap:wrap;gap:12px}

  /* meanings tier — the 5 journeys */
  .tierdiv{stroke:#CDD4DC;stroke-width:1px}

  .cast-status.tbd{background:#EEF1F3;color:var(--mute)}

  .cast-status.rec:hover{background:#D9EEE9}
  .cast-sum{font-size:12.5px;line-height:1.42;color:var(--ink-2);margin:5px 0 7px}
  .cast-sec{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:20px 0 4px}
  .jlane{pointer-events:auto;cursor:pointer;transition:opacity .15s}
  .jlane .jhit{fill:transparent;pointer-events:all}
  .jbar{stroke-width:7px;stroke-linecap:round;opacity:.82;transition:stroke-width .15s,opacity .15s}
  .jmk{fill:#fff;stroke-width:2px;transition:r .15s}

  .stage.dim .jlane:not(.hl){opacity:.3}

  /* Jim — parallel life line */
  .jimline{stroke:#C6CCD2;stroke-width:1.5px;stroke-linecap:round}
  .jim-ev{pointer-events:auto;cursor:pointer;transition:opacity .15s}

  /* storyboard / film line */
  .filmline{stroke:#C6CCD2;stroke-width:1.5px;stroke-linecap:round}
  .film-ev{pointer-events:auto;cursor:pointer;transition:opacity .15s}
  .film-ev .fhit{fill:transparent;pointer-events:all}
  .film-clip{fill:#fff;stroke:#C6CCD2;stroke-width:1px;transition:fill .15s,stroke .15s;pointer-events:all}
  .film-clip.alt{fill:#EAEEF1}
  .film-n{font-family:var(--mono);font-size:10px;fill:#5A5550;text-anchor:middle;transition:fill .15s}
  .film-lbl{font-family:var(--mono);font-size:11px;fill:#5A5550;text-anchor:middle;opacity:0;transition:opacity .15s;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}

  .film-ev:hover .film-n,.film-ev.hl .film-n{fill:var(--red)}
  .film-ev:hover .film-lbl,.film-ev.hl .film-lbl{opacity:1;fill:var(--ink)}
  .arl{stroke:var(--red);stroke-width:1.4px;stroke-dasharray:4 4;opacity:0;transition:opacity .15s;pointer-events:none}

  .stage.dim .film-ev:not(.hl){opacity:.3}
  /* storyboard scene blocks (HTML) */
  .film-block{position:absolute;box-sizing:border-box;background:#fff;border:1px solid #C6CCD2;border-radius:7px;padding:6px 9px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:background .12s,border-color .12s,box-shadow .12s}

  .film-block .fb-en.down{color:#A2561E}
  .film-block .fb-title{font-family:var(--body);font-size:12px;line-height:1.2;color:var(--ink);font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .stage.dim .film-block:not(.hl){opacity:.32}
  /* pillar dots inside each storyboard part — sit right after the number */
  .film-block .fb-top{justify-content:flex-start}

  .film-block .fb-pills{display:inline-flex;gap:3px;align-items:center}

  .fb-pill:hover{transform:scale(1.4)}
  /* production calendar lane (months) — clickable month blocks, markers sit on the line */
  .cal-month{position:absolute;overflow:hidden;box-sizing:border-box;background:#fff;border:1px solid #C6CCD2;border-radius:7px;display:flex;align-items:center;justify-content:flex-start;padding-left:11px;color:#5A5550;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}

  .cal-month.alt{background:#F5F7F8}

  .cal-month:hover .cm-nm{color:var(--red)}

  .cal-ev .ce-dot{flex:none;display:block;width:13px;height:13px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.22);transition:transform .1s}

  .cal-ev:hover .ce-lbl{text-decoration:underline}
  .cal-daydot{position:absolute;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#8A93A3;box-shadow:0 0 0 1.5px var(--paper,#EFF2F6);z-index:4;cursor:pointer;transition:transform .1s,background .1s}
  .cal-daydot.tbc{background:var(--paper,#EFF2F6);border:1.5px solid #9AA6B2;box-shadow:none}
  .cal-daydot:hover{transform:translate(-50%,-50%) scale(1.5);background:var(--red)}

  /* ============================================================

  #scroller{

// what each scene is actually about — shown in the scene card
const SCENE_DESC = {
  1:{en:"The film opens by showing what dentistry used to be: a slow, analog craft where a single crown or denture was shaped by hand in wax and plaster, took weeks to make, and left the patient waiting and uncomfortable. We watch a craftsman at his bench in this almost-vanished world — and though it is shot today, it is staged to look at first like old archive footage, with the truth revealed only later. This is the film’s baseline, the “before” against which everything that follows is measured, so we can feel just how far dentistry has come — and how much faster, cheaper, and easier Glidewell would help make it.",ru:"Фильм открывается тем, какой стоматология была раньше: медленное аналоговое ремесло, где одну коронку или протез вручную лепили из воска и гипса, на изготовление уходили недели, а пациент всё это время ждал и терпел неудобство. Мы видим мастера за рабочим столом в этом почти исчезнувшем мире — и хотя снято это сегодня, подано так, что поначалу выглядит как старая архивная плёнка, а правда раскрывается лишь позже. Это точка отсчёта фильма, то самое «до», с которым сравнивается всё последующее, чтобы зритель почувствовал, как далеко шагнула стоматология — и насколько быстрее, дешевле и проще её помогла сделать Glidewell."},
  2:{en:"This part makes the problem personal. Before any technology, the film pauses on people: someone who covers their mouth when they laugh, who puts off a crown because it costs too much, who lives with a missing tooth because good dental work was slow, expensive, or simply out of reach. We hear what that gap actually costs — the shame of a hidden smile, the self-esteem that erodes, the health quietly lost by those who could never afford care. It sets the human stakes the rest of the film answers: this is the pain that makes the mission — the best dentistry, made affordable — worth pursuing.",ru:"Эта часть делает проблему личной. Ещё до всякой технологии фильм останавливается на людях: на том, кто прикрывает рот, когда смеётся; кто откладывает коронку, потому что слишком дорого; кто живёт с отсутствующим зубом, потому что хорошая стоматология была медленной, дорогой или попросту недоступной. Мы видим, чего на самом деле стоит этот разрыв — стыд за спрятанную улыбку, подтачиваемую самооценку, тихо теряемое здоровье тех, кто так и не смог позволить себе помощь. Здесь задаются человеческие ставки, на которые отвечает весь остальной фильм: это та боль, ради которой стоит браться за миссию — сделать лучшую стоматологию доступной."},
  3:{en:"The film's engine starts here: the same act, cut side by side across fifty years — the impression tray against the scanning wand, the hand wax-up against an AI design proposal, the courier box against a file in the cloud. And the spine begins: one real same-day crown, timecoded from a broken tooth in the morning to a seated crown by late afternoon. The patient stays in the chair and watches their own crown designed and milled — “put the block in, change the bur, close the door, hit start.” What used to be the entire plot of a crown — weeks, second visits, waiting with a hole in your smile — becomes a single scene. The film’s promise, made physical.",ru:"Здесь запускается двигатель фильма: одно и то же действие, смонтированное встык через пятьдесят лет — ложка со слепочной массой против сканера, восковка руками против ИИ-предложения дизайна, коробка курьера против файла в облаке. И начинается хребет: одна настоящая same-day коронка с таймкодом — от сломанного зуба утром до установленной коронки к вечеру. Пациент остаётся в кресле и смотрит, как его коронку проектируют и фрезеруют — «поставь блок, смени бор, закрой дверцу, нажми старт». То, что раньше было целым сюжетом коронки — недели, вторые визиты, ожидание с дыркой в улыбке, — становится одной сценой. Обещание фильма, ставшее физическим."},
  4:{en:"The honest counterweight: roughly half the profession still pours physical impressions — and the film refuses to mock them. The barriers are real: an investment around $55K, a learning curve that eats your evenings, and the quiet fear of “who do I call if the software fails mid-appointment.” Nobody converts on camera here — the longitudinal arc is gone by design. Instead, the people who DID cross tell what the crossing cost: Abdul was skeptical, kept backup impressions “just in case technology fails me,” and needed a pandemic to make the leap; even the company’s own people admit change is difficult for everybody. This chapter gives resistance its dignity — because the film’s thesis only lands if the wall is real.",ru:"Честный противовес: примерно половина профессии до сих пор льёт физические слепки — и фильм отказывается над ними смеяться. Барьеры реальны: вложение около $55K, кривая обучения, съедающая вечера, и тихий страх «кому я позвоню, если софт упадёт посреди приёма». Никто не конвертируется в кадре — лонгитюдная арка убрана сознательно. Вместо этого те, кто перешёл, рассказывают, чего стоил переход: Абдул был скептиком, держал страховочные слепки «на случай, если технология меня подведёт», и ему понадобилась пандемия, чтобы сделать прыжок; даже люди самой компании признают — перемены трудны для всех. Эта глава даёт сопротивлению его достоинство: тезис фильма работает, только если стена настоящая."},
  5:{en:"The film follows the start of the production pipeline: Glidewell specialists taking the physical molds a dentist sends in and converting them into clean, precise digital files. On screen you see the people and machines on the line — impressions being scanned, raw shapes turning into 3D data that a technician checks and tidies up. This is the upstream source that feeds everything downstream: the same digital cases train and guide the AI and drive the automated factory. It matters to the film's thesis because affordable, scalable dentistry begins with capturing every case as reliable data, and it shows the largely invisible workforce of roughly five thousand people whose hands make that scale possible.",ru:"Здесь фильм показывает начало производственного конвейера: специалисты Glidewell берут физические слепки, присланные стоматологом, и превращают их в чистые, точные цифровые файлы. На экране — люди и техника «на линии»: слепки сканируются, сырые формы становятся трёхмерными данными, которые техник проверяет и доводит до чистоты. Это исток всего потока: те же оцифрованные кейсы обучают и направляют ИИ и питают автоматизированную фабрику. Для тезиса фильма это важно, потому что доступная и масштабируемая стоматология начинается с превращения каждого случая в надёжные данные, и здесь показана почти невидимая рабочая сила — около пяти тысяч человек, чьи руки и делают этот масштаб возможным."},
  6:{en:"The other half of the gap: even when the technology is ready, the patient does not come. The walls are fear (numbing, discomfort, someone working in your mouth), time, and money — “dentistry is not cheap.” And a quieter wall: awareness. Most people do not know a same-day crown exists — ask on the street and they will say no. The chapter’s answer is not a gadget: trust is the number one factor, the relationship that calms everything else; showing the patient the process reinforces it. This is where the film says its hardest sentence out loud: technology by itself does not equal access.",ru:"Вторая половина разрыва: даже когда технология готова, пациент не приходит. Стены — страх (анестезия, дискомфорт, кто-то работает у тебя во рту), время и деньги — «стоматология не дешёвая». И стена потише: осведомлённость. Большинство не знает, что same-day коронка существует, — спроси на улице, и скажут «нет». Ответ главы — не гаджет: доверие — фактор номер один, отношения, которые успокаивают всё остальное; показ пациенту процесса это доверие усиливает. Здесь фильм произносит вслух свою самую трудную фразу: технология сама по себе не равна доступу."},
  7:{en:"The film names the problem the rest of the story answers: good dentistry has long been slow and expensive — and the two are the same fact. Here the viewer feels the old workflow from the patient’s side of the chair: visits stretched across weeks, time off work, the bill — and that quieter tax, the second appointment that was “easy work” for the dentist but another numbing, another absence, another fee for the patient. The chapter runs on the visits arithmetic: two or three appointments where one now suffices; chair time that cost the dentist and the patient alike. It sets up the question the price-formula chapter answers with numbers: why does a crown cost what it costs — and which line items did the change of eras actually delete?",ru:"Фильм называет проблему, на которую отвечает вся остальная история: хорошая стоматология долго была медленной и дорогой — и это один и тот же факт. Здесь зритель чувствует старый workflow со стороны пациента: визиты, растянутые на недели, отгулы, счёт — и тихий налог: второй приём, который для врача был «лёгкой работой», а для пациента — ещё одной анестезией, ещё одним отсутствием, ещё одной оплатой. Глава держится на арифметике визитов: два-три приёма там, где теперь хватает одного; кресло-часы, которые стоили и врачу, и пациенту. Она ставит вопрос, на который глава формулы цены ответит цифрами: почему коронка стоит столько — и какие строки затрат смена эпох реально удалила?"},
  8:{en:"The film turns from the problem to the man who answered it: this is where the film shows how Jim Glidewell actually solved the cost-versus-quality bind. We meet the man behind it — a self-taught craftsman who started a removable-dental lab on his own in 1970, and we see how his hard-won principles became a way of running a business. The heart of the chapter is the flywheel: make the work cheaper, which widens the market because more dentists and patients can afford it, then reinvest the gains to make it cheaper still. It matters because this is the engine of the whole thesis — affordability is not a discount, it is a self-reinforcing loop that keeps spinning, and everything later in the film rides on it.",ru:"Здесь фильм поворачивает от проблемы к человеку, который её решил: здесь фильм показывает, как именно Джим Глайдвелл развязал узел «цена против качества». Мы знакомимся с самим этим человеком — мастером-самоучкой, который в 1970-м сам, в одиночку, открыл лабораторию съёмного протезирования; и видим, как его выстраданные принципы превратились в способ вести дело. Сердце главы — маховик: сделать работу дешевле, отчего рынок расширяется, ведь больше стоматологов и пациентов могут себе её позволить, а выигрыш реинвестируется, чтобы сделать ещё дешевле. Это важно, потому что здесь — двигатель всего тезиса: доступность это не скидка, а самоподдерживающийся цикл, который продолжает раскручиваться, и на нём держится всё дальнейшее в фильме."},
  9:{en:"The film breaks open the price of a dental restoration to show what actually drives it: a simple formula of line-items times the number of patient visits. The viewer sees how a traditional crown stacks up cost on every return trip and every outside lab and provider involved, then watches that math collapse when the work is done chairside in a single visit — using same-day milling (fastmill.io/glidewell.io), Next-Day turnaround and materials like BruxZir. The takeaway is the strategy itself: cut the visits, cut the providers, and the price falls with them. It is the mechanical heart of the film’s thesis — vertical integration is how the best dentistry is made affordable, not by cutting corners but by collapsing the formula.",ru:"Здесь фильм разбирает цену зубной реставрации, чтобы показать, из чего она реально складывается: простая формула — число позиций, умноженное на число визитов пациента. Зритель видит, как обычная коронка накапливает стоимость с каждым повторным визитом и каждой внешней лабораторией и исполнителем, а затем наблюдает, как эта арифметика схлопывается, когда работа делается в кресле за один визит — благодаря фрезеровке в тот же день (fastmill.io/glidewell.io), производству Next-Day и материалам вроде BruxZir. Главная мысль — сама стратегия: сократи визиты, сократи число исполнителей, и цена падает вместе с ними. Это механическое сердце тезиса фильма: вертикальная интеграция — это способ сделать лучшую стоматологию доступной, не срезая углы, а схлопывая саму формулу."},
  10:{en:"This part steps back from the story to state Glidewell's core philosophy in plain terms: drive the cost of quality dentistry down, widen access so more patients can be treated, and keep pushing the field forward — all powered by one tightly controlled, end-to-end vertical system that owns each step from materials to milling to finished restoration.<br><br>On screen the viewer sees that machine in motion: the company disrupting its own products, the wave of new materials it brought to market through the 2010s, its education arm (symposia, CE centers, the Online Study Club, Guiding Leaders), and direct-to-dentist channels like Glidewell Direct and chairside milling. Because Glidewell sells to dentists rather than patients, the payoff is leverage — make something cheaper and better once, and it spreads across thousands of practices and the patients they serve.<br><br>It lands as the film’s thesis stated outright, the spine that ties the earlier chapters together before the arc moves toward proof and what comes next.",ru:"Эта часть делает шаг назад от повествования и проговаривает философию Glidewell начистоту: снижать стоимость качественной стоматологии, расширять доступ, чтобы помощь получало больше пациентов, и постоянно двигать отрасль вперёд — и всё это за счёт одной плотно контролируемой вертикальной системы, которая владеет каждым шагом от материалов до фрезеровки и готовой реставрации.<br><br>На экране зритель видит эту машину в работе: компанию, которая не боится конкурировать сама с собой, волну новых материалов, выведенных на рынок в 2010-х, образовательное крыло (симпозиумы, CE-центры, Online Study Club, Guiding Leaders) и прямые каналы к стоматологу вроде Glidewell Direct и фрезеровки у кресла. Поскольку Glidewell продаёт стоматологам, а не пациентам, эффект масштабируется: сделай что-то дешевле и лучше один раз — и это расходится по тысячам клиник и их пациентам.<br><br>Это звучит как прямо высказанный тезис фильма, стержень, связывающий предыдущие главы воедино, прежде чем дуга движется к доказательствам и к тому, что будет дальше."},
  11:{en:"This part shows that the future the film has been building toward is already underway — and lets us see who is making it. We go onto the floor of Glidewell’s automated, AI-driven manufacturing. This is the BruxZir factory that, by the company’s own figures, turns out on the order of half a million restorations a month.<br><br>David Leeson’s engineering team runs the banks of robotic mills; Sergei Azernikov’s software designs the crowns with AI before they are ever cut — the company says that, as of April 2026, more than 30 million cases sit in its cloud and over 95% of restoration designs are now proposed by the AI.<br><br>Around the factory are the tools reaching dentists right now: the glidewell.io system that lets a practice scan, design and seat a crown in a single visit; an in-house micro-CT scanner that checks each unit’s quality (a step the independent press has covered); and the new fastsmile.io facial scanner. The point for the thesis is concrete — this is not a promise about tomorrow but production happening today, and as it scales, the same affordable, high-quality dentistry reaches hundreds of thousands more patients.",ru:"Эта часть показывает, что будущее, к которому фильм вёл зрителя, уже наступает — и даёт увидеть, кто его делает. Мы выходим в цех автоматизированного производства Glidewell на базе ИИ. Это фабрика BruxZir, которая, по собственным данным компании, выпускает порядка полумиллиона реставраций в месяц.<br><br>Инженерная команда Дэвида Лисона ведёт связки роботизированных фрезеров; программа Сергея Азерникова проектирует коронки с помощью ИИ ещё до того, как их вырежут, — компания сообщает, что на апрель 2026 года в её облаке больше 30 миллионов кейсов, и свыше 95% дизайнов реставраций теперь предлагает ИИ.<br><br>Вокруг фабрики — инструменты, доходящие до врачей прямо сейчас: система glidewell.io, позволяющая практике отсканировать, спроектировать и установить коронку за один визит; собственный микро-КТ-сканер, проверяющий качество каждой единицы (этот шаг освещала независимая пресса); и новый сканер лица fastsmile.io. Для главной идеи фильма мысль предельно конкретна — это не обещание про завтра, а производство, идущее сегодня, и по мере масштабирования та же доступная и качественная стоматология доходит до сотен тысяч новых пациентов."},
  12:{en:"The film turns from Glidewell’s past to its future — where the company is placing its next bets. Behind that future is a real engine room: an R&D group of more than 150 people, including roughly a dozen PhDs, a U.S. patent portfolio approaching 100 (with dozens more pending as of 2023), and an enormous library of digital scan data — which is what actually trains the company’s AI.<br><br>A few people carry that future most directly, and each is worth an interview. Sergei Azernikov built and runs the AI that now designs the crowns — software that proposes the shape of the tooth before a human ever touches it. David Leeson is the engineer behind the automated, robotic factory that then makes those crowns at scale. Maggie Liu’s materials team works the next frontier: 3D-printed permanent restorations and dentures, the likely successor to milling. They work under CEO Stephenie Goddard, while founder and president Jim Glidewell holds the “why” — all of it exists to drive the cost of good dentistry down.<br><br>The company also grows by buying its way into new ground — for example ORB Innovations in 2023, a smart sensor mouthguard that points it toward data and prevention — and by keeping its platform open to scans from any scanner, not just its own. The honest throughline: every one of these bets aims at a single goal — making the best dentistry reachable for more patients — but technology by itself is not access. It still takes the next generation of dentists to carry it to the people who need it.",ru:"Здесь фильм разворачивается от прошлого Glidewell к будущему — куда компания делает следующие ставки. За этим будущим стоит настоящее «машинное отделение»: подразделение R&D больше чем из 150 человек, включая около десятка докторов наук, патентный портфель под сотню в США (и ещё десятки в рассмотрении на 2023 год) и огромная библиотека цифровых данных сканирования — именно она и обучает ИИ компании.<br><br>Несколько человек несут это будущее напрямую, и каждого стоит снять. Сергей Азерников создал и ведёт ИИ, который теперь проектирует коронки, — программу, предлагающую форму зуба ещё до того, как к ней притронется человек. Дэвид Лисон — инженер, стоящий за автоматизированной роботизированной фабрикой, которая затем делает эти коронки в масштабе. Команда Мэгги Лю по материалам работает над следующим рубежом: 3D-печатными постоянными реставрациями и протезами, вероятным преемником фрезеровки. Все они работают под началом CEO Стефани Годдард, тогда как основатель и президент Джим Глайдвелл держит «зачем» — всё это существует, чтобы снижать стоимость хорошей стоматологии.<br><br>Компания растёт и через покупки — например, ORB Innovations в 2023 году, умный сенсорный капп, разворачивающий её в сторону данных и профилактики, — и через открытую платформу, которая принимает скан с любого сканера, а не только своего. Честная сквозная мысль такая: каждая из этих ставок целит в одно — сделать лучшую стоматологию доступнее большему числу пациентов, — но технология сама по себе доступом не является. Донести её до тех, кому она нужна, всё равно должно новое поколение врачей."},
  13:{en:"The film closes by turning toward the future: the young dental interns and residents who will carry the craft forward. We meet the next generation through Glidewell’s education and mentorship programs — Guiding Leaders, the continuing-education centers, the symposia — where new clinicians learn implants, esthetics, and the discipline of the trade. This is the flywheel reinvesting in itself: the profits and know-how from making great dentistry affordable are plowed back into the people who will keep that mission going. It matters because the thesis only holds if the craft outlives any one company or founder — the future of dentistry depends on who gets trained next.",ru:"Фильм завершается поворотом к будущему: молодые стоматологи-интерны и ординаторы, которым предстоит понести ремесло дальше. Со следующим поколением мы знакомимся через образовательные и наставнические программы Glidewell — Guiding Leaders, центры непрерывного образования, симпозиумы, — где новые врачи осваивают имплантацию, эстетику и саму дисциплину профессии. Это маховик, реинвестирующий сам в себя: прибыль и знания, полученные от того, что качественную стоматологию сделали доступной, вкладываются обратно в людей, которые продолжат эту миссию. Это важно, потому что тезис фильма держится только если ремесло переживёт любую отдельную компанию или основателя — будущее стоматологии зависит от того, кого обучат следующим."},
  14:{en:"The film closes by looking ahead: if the past chapters showed how Glidewell drove down the cost of high-quality dentistry, this part asks where that road leads—10 years out, then 50. Through the people we have followed and voices from across the field, we hear an optimistic forecast: better materials, faster digital and chairside workflows, and care that keeps reaching more patients who once couldn’t afford it. The tone is hopeful rather than triumphant, anchored in Jim Glidewell’s creed of constant change and in glidewell.io as a signpost of where the work is headed. It lands on the emotional payoff of the whole arc—the smiles that haven’t lit up yet, the ones this future is meant to make possible.",ru:"Фильм завершается взглядом вперёд: если предыдущие главы показали, как Glidewell снижала стоимость качественной стоматологии, то эта часть спрашивает, куда ведёт эта дорога — через 10 лет, а затем через 50. Через героев, за которыми мы следили, и голоса со всей отрасли звучит оптимистичный прогноз: лучшие материалы, более быстрые цифровые и кресельные процессы и помощь, доходящая до всё большего числа пациентов, которым она раньше была не по карману. Тон скорее обнадёживающий, чем триумфальный, и опирается на кредо Джима Глайдвелла о постоянных переменах и на glidewell.io как ориентир того, куда движется работа. Финал выходит на эмоциональную развязку всей арки — на улыбки, которые ещё не зажглись, те самые, ради которых и задумано это будущее."}

  1:{en:"The opening looks like old film, though it is shot in the present. We move through tight, detail shots: (A) a technician carving a prosthesis by hand; (B) a dentist mixing material and taking a physical impression; then A and B together. Over it runs voice-over about how it used to be done. We gradually pull out to wide shots — and only at the end, from the details (a finished restoration; the dentist on the phone), do we realize this is the present day. Two recurring figures are seeded here: intern #1 (learning the old way in university training) and an old-school dentist who still mails Glidewell physical impressions rather than scans.<br><br>⚙ <b>Open production question:</b> we don’t yet have a place to FILM this legacy, hand-made process (carving a crown, casting, taking a physical impression the old way). We need to find one — a friendly lab or workshop, a university program, or Orange Coast College (where Jim trained — it may still teach the analog method and let us shoot the process). This is a question for Eric. Ties to tasks t2 (old-school dentist) and t8 (analog lab).",

     ru:"Контрапункт: олдскульный дантист снимает слепок по-старинке в современной (по дате) клинике. Пациент — об эмоциях процесса; врач — о самой процедуре и что дальше: слепок едет в Glidewell. Пока он работает, раскрываем, почему он до сих пор выбирает олдскул. Блок завершается отправкой слепка в Glidewell. Спикеры заодно объясняют, чем труден аналог и до какого предела его довели — насколько точным он мог быть."},

         ru:"Наша первая съёмка героя — д-р Абдул Алас (Герой №1) в Бейкерсфилде. По итогам тёплого звонка-планирования Абдул полностью за и щедр по времени («I'll give you a long time»). Формат: интервью (штатив, свет) про профессиональный опыт и опыт с Glidewell, плюс B-roll в тот же день — работа с интернами, процесс fastmill / chairside, что доступно в этот день.\n**Почему пока НЕ утверждено:** дата не зафиксирована — Эльдар шлёт Эрику обе даты-кандидата (10 / 17 июля), чтобы свести съёмочную группу видеопродакшена; окно тесное (это узкое место). Июль, не август — истории собираем сейчас, его материал нужен рано, чтобы строить арку.\n**До съёмки:** отправить Абдулу больше инфо + пару вопросов на подготовку и референс-ролик / каркас того, что строим (он просил дважды — хочет попасть в видение); ближе к дате поделиться планом/сценами, чтобы ему и интернам было легко. Пометка: одна из интернов (девушка) выпускается в этом году — естественный времязависимый момент, стоит отдельной съёмки."}},
  {m:7,d:16,c:"#4F93A6",star:true,short:{en:"Guiding Leaders · 16–17"+glTag(7),ru:"Guiding Leaders · 16–17"+glTag(7)},

   desc:{en:"The Guiding Leaders cohort is physically on campus July 16–17 — our window to capture the program in motion and the alumni hero candidates Bobbie recommended (Ellen Paulisick, Nadia Rodriguez, Bianca Clark, Jim Lam). We shoot Friday the 17th. Coordinate logistics and consent with Bobbie Norton ahead of time; this is the first big multi-hero shoot day.\n**Education interviews to grab here** (the theme from all angles — short, in-context, emotionally charged & open to talk):\n• **Bobbie Norton** — runs GL; why Glidewell gives it away free.\n• **Jim Glidewell** — education as a bond (1980 study program → GITC → symposia); why he invests in teaching.\n• **David Rice (IgniteDDS)** — mentor to the next generation; the pipeline voice.\n• **Setareh Lavasani** — academic educator (3D imaging); training the next gen on modern tech.\n• **Dar Radfar** — trains thousands of practices (sleep/laser); expanding what a dentist treats; a personal redirect story.\n• **Eric Johnson** — leadership & burnout coach, Glidewell KOL/Study Club; the human side of the profession.\n• **Jinny Bender** — reinvented late-career around digital; teaches glidewell.io (the re-tooling arc).\n• **Christina Do** — OC Dental Society leader + fastmill early adopter; access + innovation.\n• **Danielle Brown** — Inglewood, community-clinic roots; representation & access.\n• **Justin Chi / Taylor Manalili** — internal clinical-tech & prosthodontics educators.\n• **GL alumni** (Ellen / Bianca / Jim Lam / Nadia) — what the program changed for them.\n**GL 2026 dates (map at hand, all in-person, Irvine — bold = still upcoming, with its number in the run):** "+glDatesLine('en')+".",
         ru:"Группа Guiding Leaders физически на кампусе 16–17 июля — наше окно, чтобы снять программу в движении и кандидатов-героев из выпускников, которых рекомендовала Бобби (Ellen Paulisick, Nadia Rodriguez, Bianca Clark, Jim Lam). Снимаем в пятницу 17-го. Логистику и согласия заранее свести с Бобби Нортон; это первый большой съёмочный день с несколькими героями.\n**Образовательные интервью, которые брать здесь** (тема со всех сторон — короткие, в контексте, заряженные и открытые к разговору):\n• **Bobbie Norton** — ведёт GL; почему Glidewell отдаёт это бесплатно.\n• **Jim Glidewell** — образование как связь (программа 1980 → GITC → симпозиумы); почему вкладывается в обучение.\n• **David Rice (IgniteDDS)** — наставник следующего поколения; голос «пайплайна».\n• **Setareh Lavasani** — академический преподаватель (3D-визуализация); учит новое поколение читать современную технику.\n• **Dar Radfar** — обучает тысячи практик (сон/лазеры); расширяет, что лечит дантист; личная история-разворот.\n• **Eric Johnson** — коуч по лидерству и выгоранию, KOL/Study Club Glidewell; человеческая сторона профессии.\n• **Jinny Bender** — заново собрала карьеру вокруг цифры; учит glidewell.io (арка переоснащения).\n• **Christina Do** — лидер OC Dental Society + ранний адаптер fastmill; доступ + инновации.\n• **Danielle Brown** — Инглвуд, корни в общинных клиниках; репрезентация и доступ.\n• **Justin Chi / Taylor Manalili** — внутренние преподаватели по клин-технологиям и ортопедии.\n• **Выпускницы GL** (Ellen / Bianca / Jim Lam / Nadia) — что программа изменила для них.\n**Даты GL 2026 (карта под рукой, всё очно, Ирвайн — жирным = ещё впереди, с номером в серии):** "+glDatesLine('ru')+"."}},

   desc:{en:"Opportunistic window — Neil Park is on campus, so we film him with no travel. He’s our top candidate for the film’s narrator / host voice.\n**Shot list:** (A) backstage before he goes on — the ⭐ look-to-camera just before the entrance + candids; (B) live on stage — clean entrance/walk-out + the talk; (C) ~90-min interview AFTER the talk (our 5 questions + a host-narration line test); (D) profile B-roll — walk him to the robots / factory floor / around campus and let him narrate on the move (lively, off-script, doubles as host footage); plus his real habitat (Chairside Live set, editor’s desk). NOT as a practicing clinician / no fake operatory — he doesn’t practice; (E) ask him to help line up other internal speakers.\nFull prep: Documents/07_23_Neil_Park_Shoot_Prep.md. Lock exact time + crew + a studio room this week; send Park the premise + questions beforehand.",
         ru:"Окно, которое не упустить — Нил Парк на кампусе, снимаем без выездов. Наш главный кандидат на голос-ведущего / нарратора фильма.\n**Шот-лист:** (A) закулисье перед выходом — ⭐ взгляд в камеру прямо перед выходом + кэндиды; (B) лайв на сцене — чистый выход + выступление; (C) интервью ~90 мин ПОСЛЕ выступления (5 вопросов + тест нарраторских строк); (D) профайл B-roll в его настоящей среде (площадка Chairside Live, стол редактора, кампус) — стилизованные кадры с инструментом/руками держать художественно, НЕ фейковая операционная; (E) попросить свести других внутренних спикеров.\nПолный план: Documents/07_23_Neil_Park_Shoot_Prep.md. На этой неделе забить точное время + команду + студийную комнату; заранее отправить Парку премис + вопросы."}},
  {m:10,d:15,c:"#4F93A6",star:true,short:{en:"Dentistry on the Rise · 15–16"+glTag(10),ru:"Dentistry on the Rise · 15–16"+glTag(10)},
   t:{en:"Graduation"+glTag(10)+" — “Dentistry on the Rise” (15–16)",ru:"Выпуск"+glTag(10)+" — «Dentistry on the Rise» (15–16)"},

   desc:{en:"The Guiding Leaders finale — the DOTR symposium, Oct 15–16 at the Glidewell Clinical Education Center, Irvine. Bobbie confirms this IS the graduation, and it's likely the film's climax.\nWhy it's gold for us: a tour of the world's largest dental lab (B-roll), and an exclusive party at Mesa Manor — Jim & Parvina Glidewell's home (intimate access that doubles for the personal film). Day 1 = real cases / wins & setbacks; Day 2 = hands-on workshops (guided implant surgery, smile design, scanning, 3D printing, same-day).\n**Speakers** (from the program — photos to add; backgrounds to confirm/expand with Bobbie):\n• **Jim Glidewell, CDT** — founder & president; the origin of the whole story.\n• **Ellen Paulisick, DDS, FAGD** — GL alumna & our hero candidate; built a brand-new practice fully on Glidewell (mill, scanner, HT implants).\n• **Bianca Clark, DDS** — GL alumna & our hero candidate; the program's go-to voice on 3D printing.\n• **Taylor Manalili, DDS** — on our roster: Glidewell Director of Clinical Prosthodontics, first Glidewell Fellow (2018); materials, AI, women in dentistry.\n• **Brittany Bergeron, DDS** — cosmetic practice owner (Towson, MD), women-in-dentistry leader & pro-bono access work; GL alumna.\n• **Bhumika Patel, DDS** — Bobbie singled her out on the program: owns her practice AND her own company selling wireless X-ray sensors (A2Z Imaging); hadn't spoken for GL before — “she's gonna be phenomenal.” Clinician-inventor; strong on innovation & women founders.\n• **David Rice, DDS** — founder of IgniteDDS (largest community for new dentists), DentistryIQ editor; the mentorship/pipeline voice.\n• **Setareh Lavasani, DDS, MS** — board-certified oral radiologist & professor (Western U); teaches reading modern 3D imaging.\n• **Dar Radfar, DDS** — trains thousands of practices in sleep medicine & lasers; expanding what dentists treat; a personal redirect story.\n• **Eric Johnson, DDS** — San Clemente owner, USAF vet, leadership/burnout coach & Glidewell KOL.\n• **Jinny Bender, DMD** — Glidewell clinician who reinvented late-career around digital; teaches glidewell.io.\n• **Christina Do, DDS** — Costa Mesa owner, OC Dental Society leader, fastmill power-user.\n• **Danielle Brown, DDS** — Glidewell clinician from Inglewood, community-clinic roots, NDA “40 Under 40”.\n(Identities web-confirmed; cross-check exact 2026 DOTR billing & a few titles before screen.)\nConfirm the exact graduation moment and our shooting access with Bobbie.",
         ru:"Финал Guiding Leaders — симпозиум DOTR, 15–16 октября в Glidewell Clinical Education Center, Ирвайн. Бобби подтверждает: это и есть выпускной, и вероятная кульминация фильма.\nЧем ценно для нас: тур по крупнейшей зуботехнической лаборатории мира (B-roll) и закрытая вечеринка в Mesa Manor — доме Джима и Парвины Глайдвелл (интимный доступ, который работает и на личный фильм). День 1 — реальные кейсы / удачи и провалы; День 2 — практические воркшопы (управляемая имплант-хирургия, дизайн улыбки, сканирование, 3D-печать, «за один визит»).\n**Спикеры** (из программы — фото добавим; бэкграунд сверить/дополнить с Бобби):\n• **Jim Glidewell, CDT** — основатель и президент; исток всей истории.\n• **Ellen Paulisick, DDS, FAGD** — выпускница GL и наш кандидат-герой; построила новую практику целиком на Glidewell (фрезер, сканер, импланты HT).\n• **Bianca Clark, DDS** — выпускница GL и наш кандидат-герой; главный голос программы по 3D-печати.\n• **Taylor Manalili, DDS** — из нашего ростера: директор по клинической ортопедии Glidewell, первый Glidewell Fellow (2018); материалы, ИИ, женщины в стоматологии.\n• **Brittany Bergeron, DDS** — владелица косметической практики (Towson, MD), лидер «женщин в стоматологии» и pro-bono помощь; выпускница GL.\n• **Bhumika Patel, DDS** — Бобби особо её выделила на программке: владеет практикой И своей компанией (A2Z Imaging — беспроводные рентген-сенсоры); раньше для GL не выступала — «будет блестящей». Клиницист-изобретатель; сильна по теме инноваций и женщин-основателей.\n• **David Rice, DDS** — основатель IgniteDDS (крупнейшее сообщество молодых дантистов), редактор DentistryIQ; голос наставничества/пайплайна.\n• **Setareh Lavasani, DDS, MS** — сертифицированный оральный радиолог и профессор (Western U); учит читать современную 3D-визуализацию.\n• **Dar Radfar, DDS** — обучает тысячи практик медицине сна и лазерам; расширяет, что лечит дантист; личная история-разворот.\n• **Eric Johnson, DDS** — владелец практики (San Clemente), ветеран ВВС, коуч по лидерству/выгоранию, KOL Glidewell.\n• **Jinny Bender, DMD** — клиницист Glidewell, заново собрала карьеру вокруг цифры; учит glidewell.io.\n• **Christina Do, DDS** — владелица практики (Costa Mesa), лидер OC Dental Society, power-user fastmill.\n• **Danielle Brown, DDS** — клиницист Glidewell из Инглвуда, корни в общинных клиниках, NDA «40 Under 40».\n(Личности подтверждены по сети; точное участие в DOTR-2026 и ряд титулов сверить до экрана.)\nТочный момент выпуска и наш доступ к съёмке сверить с Бобби."}}

    body:{en:"The means that make cheaper-and-better possible: BruxZir solid zirconia, AI/robotic production (CrownAI, the BruxZir Factory), and constant self-disruption — \"grow or decay.\" Innovation is the engine under the flywheel; without it, lowering cost would just mean lowering quality. On the timeline it's the lab that designs and mills crowns by machine, learning from 10M+ stored cases.",ru:"Средство, которое делает «дешевле и лучше» возможным: BruxZir, ИИ/роботизированное производство (CrownAI, фабрика BruxZir) и постоянная само-дисрупция — «растём или деградируем». Инновация — двигатель под маховиком; без неё снижение цены было бы просто снижением качества. На таймлайне — лаборатория, что проектирует и фрезерует коронки машиной, учась на 10 млн+ кейсов."},
    role:{en:"Maps the message's \"innovation\" onto Glidewell's pillar.",ru:"Кладёт «инновацию» месседжа на пилон Glidewell."}},
  int:{
    tag:{en:"Glidewell Advantage pillar · vertical integration & reach",ru:"Пилон Glidewell Advantage · вертикальная интеграция и охват"},
    body:{en:"Owning the whole stack — raw materials (the Tosoh partnership) → design software → milling → the in-office glidewell.io workflow. Vertical integration is how the cost actually comes down and how the lab moves into the dental office (single-visit crowns). It's the structural answer to \"why can Glidewell make it cheaper?\" — fewer hands, fewer margins, one connected system.",ru:"Владение всей цепочкой — сырьё (партнёрство с Tosoh) → ПО для дизайна → фрезерование → workflow glidewell.io прямо в кабинете. Вертикальная интеграция — то, как цена реально падает и как лаборатория переезжает в кабинет дантиста (коронка за один визит). Это структурный ответ на «почему Glidewell может дешевле»: меньше рук, меньше наценок, одна связанная система."},
    role:{en:"Maps the message's \"vertical integration & reach\" onto Glidewell's pillar.",ru:"Кладёт «вертикальную интеграцию и охват» на пилон Glidewell."}},
  sup:{
    tag:{en:"Glidewell Advantage pillar · reinvest in the profession — the emotional heart",ru:"Пилон Glidewell Advantage · реинвест в профессию — эмоциональное сердце"},
    body:{en:"Reinvesting in dentists: free continuing education, Guiding Leaders, clinical support — and the service that removes the real fear of going digital (\"who do I call if it fails?\"). It's the emotional heart of the film, because it's where the flywheel returns to people: Glidewell's success comes only through maximizing dentists' success, so widening patient access accelerates the practice. Support is the through-line made personal — the hero learns, then teaches the next generation.",ru:"Реинвест в дантистов: бесплатное обучение (CE), Guiding Leaders, клиническая поддержка — и сервис, снимающий настоящий страх перехода в цифру («кому звонить, если не пройдёт?»). Это эмоциональное сердце фильма: успех Glidewell достигается только через максимизацию успеха дантистов, поэтому расширение доступа пациентов ускоряет практику. Support — это сквозная тема, ставшая личной: герой учится, а потом учит следующее поколение."},

  {id:'abdul', nm:{en:"Dr. Abdul Alas · hero 1",ru:"Д-р Абдул Алас · герой 1"}, c:'#5E77A6', photo:'gl_photos/abdul.jpg', loc:{en:"Bakersfield, CA · Five Star Dentistry",ru:"Бейкерсфилд, Калифорния · Five Star Dentistry"}, sc:[1,3,4,7,8,10,11,13,14],
   bio:{en:"<b>Hero #1 — confirmed.</b> Runs a small office (~10 people) and mentors interns who shadow him; carries the film's dentist-line narrative.<br><br><b>From his recorded interview (his own words).</b> A Glidewell user for 10+ years with most of the products: he mills single crowns in-house on the fastmill and sends out bridges, multi-unit and more cosmetic cases. His interns work as his assistants and want to learn how he runs the office; he once brought a parent in to see if it would scare them off — they stayed. His honest obstacle, verbatim: a real barrier with technology — “every time I'm gonna click, I'm worried the software won't work and gives me an error — who am I gonna call if it doesn't go through? That's my biggest fear.” So the “afraid to press the button / who do I call” conflict is REAL and straight from him, even after 10+ years a user (correction: it does NOT need reframing).<br><br><b>Director's draft VO (Eldar voicing him — to confirm, not verbatim):</b> loves the work because it changes lives; ~1,000+ patients over the years; a peak of ~200 crowns a month around 2016; does free charity dentistry on weekends.<br><br><b>Practice:</b> Five Star Dentistry, Bakersfield, CA — handy for shoot planning. (His phone / email / street address live in Notion, not in this public tool.) Backup hero: Dr. Matt Lake.",ru:"<b>Герой №1 — подтверждён.</b> Держит небольшой офис (~10 человек) и менторит интернов, которые ходят за ним «хвостиком»; несёт нарратив дантистской линии.<br><br><b>Из его записанного интервью (его собственные слова).</b> Пользуется Glidewell 10+ лет, есть почти все продукты: одиночные коронки фрезерует у себя на fastmill, а мосты, многоединичные и более косметические кейсы отправляет в лабораторию. Интерны работают у него ассистентами и хотят перенять, как он ведёт офис; однажды он привёл родителя одного из них — посмотреть, не отпугнёт ли это их; остались. Его честный барьер, дословно: проблема с технологией — «каждый раз, когда нажимаю, боюсь, что софт не сработает, выдаст ошибку — кому я позвоню, если не пройдёт? Это мой главный страх». То есть конфликт «боится нажать кнопку / кому звонить» — РЕАЛЬНЫЙ и прямо из его уст, даже спустя 10+ лет (поправка: переопределять его НЕ нужно).<br><br><b>Черновой закадр (Эльдар наговаривает за него — сверить, не дословно):</b> любит работу, потому что меняет людям жизнь; ~1000+ пациентов за годы; пик ~200 коронок/мес около 2016; по выходным бесплатно лечит по благотворительности.<br><br><b>Практика:</b> Five Star Dentistry, Бейкерсфилд, Калифорния — удобно для планирования выездов. (Его телефон / email / адрес — в Notion, не в этом публичном инструменте.) Бэкап-герой: Dr. Matt Lake."},
   wants:{en:"Externally: the best for his patients and his interns; not to be left behind; to leave a legacy.",ru:"Внешне: лучшее для пациентов и учеников; не остаться в прошлом; оставить наследие."},
   conflict:{en:"NOT an adoption arc — he's been a Glidewell / digital user 10+ years. His real, present tension: a ~2016 peak (~200 crowns/mo) with the numbers now slipping as the market shifts — how to stay relevant and grow. Plus a genuine, human barrier he still names after a decade: \"who do I call if the software fails mid-appointment?\" — the support/trust question Glidewell answers. (The skeptic-who-converts arc belongs to Hero 2, the old-school dentist — not to Abdul.)",ru:"НЕ арка перехода — он 10+ лет в цифре / с Glidewell. Его настоящее напряжение: пик ~2016 (~200 коронок/мес), а сейчас цифры проседают по мере смены рынка — как остаться нужным и расти. Плюс живой человеческий барьер, который он называет и спустя десятилетие: «кому звонить, если софт упадёт посреди приёма?» — вопрос поддержки/доверия, на который отвечает Glidewell. (Арка «скептик, который переходит» — у Hero 2, олдскульного доктора, не у Абдула.)"}},
  {id:'oldschool', nm:{en:"Hero 2 · old-school dentist (TBD)",ru:"Герой 2 · олдскульный доктор (TBD)"}, c:'#8A93A3', sc:[1,4,5,11,14],
   wants:{en:"To keep serving his patients well and not fall behind — but on his own terms, without the fuss.",ru:"Продолжать хорошо лечить пациентов и не отстать — но на своих условиях, без лишней возни."},
   conflict:{en:"He's comfortable taking physical impressions and wary of the scanner — habit, cost, \"the old way still works.\" Placeholder hero (no specific person yet): in the film we teach him the scanner and he speeds up.",ru:"Ему привычны слепки и боязно со сканером — привычка, цена, «по-старому ведь работает». Плейсхолдер-герой (конкретного человека пока нет): в фильме мы обучаем его сканеру, и он ускоряется."}},
  {id:'guiding', nm:{en:"Hero 3 · Guiding Leaders student (TBD)",ru:"Герой 3 · студентка Guiding Leaders (TBD)"}, c:'#4F93A6', sc:[2,10,14],
   wants:{en:"To grow into a leader who widens access to care — and to claim a place in a field that hasn't always made room.",ru:"Вырасти в лидера, расширяющего доступ к лечению — и занять место в профессии, где не всегда находилось место таким, как она."},
   conflict:{en:"An emerging dentist with less runway and fewer resources; the open question is whether affordable, digital, well-supported dentistry lets someone like her start strong and lead. Placeholder — a Guiding Leaders cohort member; nobody cast yet (dates via Bobbie Norton).",ru:"Начинающий врач с меньшим запасом и ресурсами; открытый вопрос — позволит ли доступная, цифровая, хорошо поддержанная стоматология такому человеку стартовать сильно и вести за собой. Плейсхолдер — участница когорты Guiding Leaders; человека пока не утвердили (даты — у Bobbie Norton)."},
   gl:{en:"**GL 2026 — cohort on campus (Irvine); film windows:**\n• May 14–15 — Relational Leadership (passed)\n• Jun 11–12 — New Practice Playbook · Own Your Finances (passed)\n• **Jul 16–17 — Bias/Executive Presence · HR · (17) Systems & Profit — we film Fri 17**\n• Aug 6–7 — Speak with Impact (communication & presentation)\n• Sep 17–18 — Social Media & Branding · Clinical Photography (sits next to our Align symposium 18–19 — combine)\n• **Oct 15–16 — Dentistry on the Rise (graduation / the climax)**\n**With Hero #3 here:** film her learning and presenting in her element; the bonds with her cohort; pick a session topic that mirrors her arc (leadership, finances, communication). Follow her ~4 months from a July session to the October graduation — the rise made literal. Casting & access via Bobbie.",ru:"**GL 2026 — группа на кампусе (Ирвайн); окна для съёмки:**\n• 14–15 мая — Relational Leadership (прошло)\n• 11–12 июн — New Practice Playbook · Own Your Finances (прошло)\n• **16–17 июл — Bias/Executive Presence · HR · (17) Systems & Profit — снимаем в пт 17**\n• 6–7 авг — Speak with Impact (коммуникация и презентации)\n• 17–18 сен — Соцсети и брендинг · Клиническая фотография (впритык к нашему симпозиуму Align 18–19 — объединить)\n• **15–16 окт — Dentistry on the Rise (выпуск / кульминация)**\n**С Героем №3 здесь:** снимать, как она учится и выступает в своей стихии; связи с группой; выбрать тему сессии, которая рифмуется с её аркой (лидерство, финансы, коммуникация). Сопровождать ~4 месяца от июльской сессии до октябрьского выпуска — восхождение буквально. Каст и доступ — через Бобби."}},
  {id:'patient', nm:{en:"Hero 4 · the patient (TBD)",ru:"Герой 4 · пациент (TBD)"}, c:'#5B8DEF', sc:[2,6,14],
   bio:{en:"<b>Hero #4 — the patient (TBD, not yet cast).</b> PROPOSED as the film's MAIN emotional arc-carrier — the one who actually transforms on screen (per our June 2026 discussion). This is a working proposal + an arc template, NOT a real person yet.<br><br><b>The decision (proposal):</b> the film's spine is the access thesis — the gap between the best dentistry and the person who couldn't get it, closing. Its emotional carrier and payoff = the patient. Everyone else serves it: <b>Abdul</b> = the throughline / host we travel through (he does NOT 'change' — he's the 10-yr-digital anchor); <b>Hero 2 (old-school)</b> = contrast, the world it hasn't reached yet; <b>Hero 3 (Guiding Leaders student)</b> = the same thesis from the provider side; <b>Jim / Glidewell</b> = how it became possible (mentor frame / Midpoint). Each hero keeps their own mini-arc, but the patient's is the SPINE the others feed.<br><br><b>Why the patient carries it:</b> it's the only arc that genuinely transforms within the ~4-month shoot window (weeks, not years) AND most directly proves the thesis — 'the best dentistry finally reached someone who'd been shut out.'<br><br><b>Proposed Save-the-Cat arc (template):</b> 1) Opening Image — hides the smile, the gap. 2) Theme Stated — 'the best dentistry doesn't help the person who can't walk in.' 3) Set-Up — why they avoided care for years (cost, fear, time, a bad past). 4) Catalyst — what finally pushes them in (an event, or Abdul's free charity-weekend day). 5) Debate — 'can I afford it, will it hurt, I've put it off so long.' 6) Break into Two — sits in the chair. 7) B Story — Abdul + his intern, the human care. 8) Fun & Games — the magic: scan, on-screen design, the mill carving while they wait, single-visit wow. 9) Midpoint — trust forms / first glimpse of the result. 10) Bad Guys Close In — fear returns, a hitch, old shame. 11) All Is Lost — a setback, doubt peaks. 12) Dark Night — what the missing smile cost them for years. 13) Break into Three — support comes through, almost there. 14) Finale — the reveal: restored smile, one visit, affordable; the 'oh my god, thank you' (real patients say this to Abdul). 15) Final Image — mirror of the opening: they smile freely. Thesis made flesh.<br><br><b>Casting criteria:</b> real stakes (years of avoided / written-off care; visible or felt impact); a case that showcases single-visit / affordable tech; willing to be filmed through a vulnerable arc (consent / privacy); ideally found via Abdul's practice or his charity clinic.<br><br><b>Honest caveats (proposal):</b> no specific patient is locked yet — this is the template; the real one gets cast. Beats 11–12 (All Is Lost / Dark Night) are hardest to guarantee on a routine crown — likely carried by the emotion (years of shame) rather than a clinical failure, or by choosing a slightly more involved case. One patient can feel narrow for a company+industry film, so breadth comes from Abdul's world + the Guiding Leaders cohort + the old-school contrast; the patient is the 'cat', the access theme is the spine.<br><br><b>Who we're looking for — portrait from the message (proposal):</b> someone for whom cost / fear / time kept good dentistry out of reach, and whose restored smile = restored dignity. Variants, each a facet of the thesis: (1) <b>economic access</b> — a working, uninsured person who put care off for years; affordability + single-visit finally lets them in (most on-thesis: 'for all economic strata, not only the rich'); (2) <b>fear / shame</b> — avoided the dentist for years, hid the smile; the gentle, fast, single-visit experience breaks the fear; (3) <b>time / logistics</b> — a busy parent or two-job worker who couldn't take multiple days off; one visit is the unlock; (4) <b>dignity / a life moment</b> — a broken front tooth blocking a job search or a return to public life; restoration reopens a door; (5) <b>health</b> — an untreated problem that hurt their broader health, finally fixed. Cross axes: age, gender, region, underserved / immigrant community. Practical pool (fact): Abdul's free charity weekends (where shut-out patients turn up) and his Bakersfield practice (a working, agricultural Central-Valley community). The message points hardest to (1); the strongest is usually a blend (economic + shame + a life moment). No real patient yet — this is the casting brief.",ru:"<b>Герой №4 — пациент (TBD, ещё не выбран).</b> ПРЕДЛОЖЕН как ГЛАВНЫЙ носитель эмоциональной арки фильма — тот, кто реально меняется на экране (по обсуждению, июнь 2026). Это рабочее предложение + шаблон арки, а НЕ реальный человек пока.<br><br><b>Решение (предложение):</b> хребет фильма — тезис доступности: разрыв между лучшей стоматологией и тем, кто не мог её получить, закрывается. Эмоциональный носитель и развязка этого = пациент. Остальные служат ему: <b>Абдул</b> = проводник/хозяин мира, через которого мы путешествуем (он НЕ «меняется» — он 10-летний цифровой якорь); <b>Hero 2 (олдскул)</b> = контраст, мир, куда ещё не дошло; <b>Hero 3 (студент Guiding Leaders)</b> = тот же тезис со стороны провайдера; <b>Джим / Glidewell</b> = как это стало возможным (рамка-ментор / Midpoint). У каждого героя своя мини-арка, но арка пациента — СПИНА, которую питают остальные.<br><br><b>Почему несёт пациент:</b> это единственная арка, что реально меняется в окно съёмок ~4 месяца (недели, не годы) И прямее всех доказывает тезис — «лучшая стоматология наконец дошла до того, кого раньше не пускали».<br><br><b>Предложенная арка «Спасти котика» (шаблон):</b> 1) Opening Image — прячет улыбку, разрыв. 2) Theme Stated — «лучшая стоматология не помогает тому, кто не может в неё войти». 3) Set-Up — почему годами не шёл (цена, страх, время, плохой прошлый опыт). 4) Catalyst — что наконец толкает прийти (повод, или бесплатный благотворительный день Абдула). 5) Debate — «потяну ли, будет ли больно, столько лет откладывал». 6) Break into Two — садится в кресло. 7) B Story — Абдул + его интерн, человеческая забота. 8) Fun & Games — магия: скан, дизайн на экране, фрезер точит коронку, пока он ждёт, вау «за один визит». 9) Midpoint — возникает доверие / первый проблеск результата. 10) Bad Guys Close In — возвращается страх, заминка, старый стыд. 11) All Is Lost — сбой, сомнение на пике. 12) Dark Night — чего стоила ему пропавшая улыбка годами. 13) Break into Three — поддержка срабатывает, почти у цели. 14) Finale — раскрытие: восстановленная улыбка, один визит, по карману; «oh my god, спасибо» (реальные пациенты так и говорят Абдулу). 15) Final Image — зеркало открытия: улыбается открыто. Тезис стал плотью.<br><br><b>Критерии кастинга:</b> настоящая ставка (годами избегал/списал помощь; видимый или ощущаемый эффект); кейс, показывающий один-визит / доступную технологию; готов сниматься в уязвимой дуге (согласие / приватность); в идеале найден через практику Абдула или его благотворительную клинику.<br><br><b>Честные оговорки (предложение):</b> конкретного пациента ещё нет — это шаблон, реального кастуем. Биты 11–12 (All Is Lost / Dark Night) труднее всего гарантировать на рядовой коронке — скорее их даст эмоция (годы стыда), чем клинический провал; либо берём чуть более сложный кейс. Один пациент может быть узковат для фильма о компании+индустрии, поэтому ширину дают мир Абдула + поток Guiding Leaders + олдскул-контраст; пациент — «котик», тема доступности — спина. <br><br><b>Кого ищем — портрет из месседжа (предложение):</b> человек, для кого цена / страх / время держали хорошую стоматологию вне досягаемости, и чья восстановленная улыбка = вернувшееся достоинство. Варианты, каждый — грань тезиса: (1) <b>экономический доступ</b> — работающий человек без страховки, годами откладывал; доступная цена + один визит наконец впускают (самый «на тезисе»: «для всех достатков, не только богатых»); (2) <b>страх / стыд</b> — годами избегал, прятал улыбку; мягкий, быстрый, за-один-визит опыт ломает страх; (3) <b>время / логистика</b> — занятой родитель или человек на двух работах, не мог отпрашиваться; разблокирует один визит; (4) <b>достоинство / момент жизни</b> — сломанный передний зуб мешает поиску работы или возвращению в общество; восстановление открывает дверь; (5) <b>здоровье</b> — нелеченая проблема била по общему здоровью, наконец решена. Поперечные оси: возраст, пол, регион, недообслуженное / иммигрантское комьюнити. Практический пул (факт): благотворительные выходные Абдула (туда приходят «отрезанные» пациенты) и его практика в Бейкерсфилде (рабочий аграрный город Центральной долины). Месседж тянет сильнее к (1); сильнее всего обычно смесь (экономика + стыд + момент жизни). Реального пациента пока нет — это кастинг-бриф."},
   wants:{en:"To stop hiding their smile and finally get care they'd written off as out of reach — to be treated and made whole.",ru:"Перестать прятать улыбку и наконец получить помощь, которую считал недоступной, — вылечиться и снова почувствовать себя целым."},
   conflict:{en:"Cost, fear and time kept them away for years — the film's central question made personal: will affordable, single-visit, well-supported dentistry actually reach someone like them? Placeholder — to be cast from current patients, ideally one whose treatment we can follow in a hero-dentist's chair; the one face the whole film answers to.",ru:"Годами не шёл из-за цены, страха и нехватки времени — центральный вопрос фильма, ставший личным: дойдёт ли доступная, за один визит, хорошо поддержанная стоматология до такого человека? Плейсхолдер — выбрать из текущих пациентов, в идеале того, чьё лечение покажем в кресле героя-дантиста; то самое лицо, на которое отвечает весь фильм."}}
];
