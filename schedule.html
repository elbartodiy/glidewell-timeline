<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Glidewell Documentary — Select a Date & Time</title>
<style>
  :root{
    --ink:#1a1a1a;--mute:#73808d;--line:#e4e7eb;--blue:#0069ff;--bluelt:#e8f1ff;--bluetint:#f2f7ff;
    --red:#E11B2A;--redtint:#fdeeef;--amber:#B4670F;--ambertint:#fdf3e3;--green:#12805c;--greentint:#e7f5f0;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .page{max-width:1040px;margin:0 auto;padding:22px 24px 40px}
  h1{font-size:24px;font-weight:700;margin:0 0 18px;letter-spacing:-.01em}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:start}
  @media(max-width:820px){.cols{grid-template-columns:1fr;gap:24px}}

  /* month */
  .mhead{display:flex;align-items:center;justify-content:center;gap:20px;margin:2px 0 14px}
  .mhead button{border:0;background:transparent;font-size:20px;color:var(--mute);cursor:pointer;padding:4px 10px;border-radius:50%;line-height:1}
  .mhead button:hover:not(:disabled){background:#f1f3f5;color:var(--ink)}
  .mhead button:disabled{opacity:.28;cursor:default}
  .mtitle{font-size:16px;font-weight:600;min-width:150px;text-align:center}
  table.cal{width:100%;border-collapse:collapse}
  table.cal th{font-size:12px;font-weight:500;color:var(--mute);padding:6px 0 10px;text-align:center}
  table.cal td{text-align:center;padding:4px 0}
  .day{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-family:inherit;font-size:15px;color:#c3c9d0;cursor:default;display:inline-flex;align-items:center;justify-content:center;position:relative}
  .day.has{background:var(--bluelt);color:var(--blue);font-weight:600;cursor:pointer}
  .day.open{cursor:pointer;color:#9aa3ad}
  .day.open:hover{background:#f2f4f6;color:var(--ink)}
  .day.has:hover{background:#d6e6ff}
  .day.sel{background:var(--blue);color:#fff;font-weight:700}
  .day.today::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:currentColor}
  .tz{margin-top:18px;font-size:13px;color:var(--mute)}
  .tz .lbl{font-weight:600;color:var(--ink);display:block;margin-bottom:5px;font-size:13px}
  .tz .dblink{display:block;margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:#c3c9d0;text-decoration:none;cursor:default}
  .tz .dblink:hover{color:#c3c9d0;text-decoration:none;cursor:default}

  /* slots */
  .selday{font-size:15px;font-weight:600;margin:2px 0 14px}
  .slots{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto;padding-right:4px}
  .slot{border:1.5px solid var(--blue);border-radius:5px;padding:13px 10px;text-align:center;font-weight:600;color:var(--blue);background:#fff;font-size:15px}
  .slot.booked{border-color:var(--line);background:#fafbfc;color:var(--ink);text-align:left;padding:11px 13px;font-weight:600}
  .slot.booked .tm{font-family:var(--mono);font-size:12px;color:var(--mute);display:block;margin-bottom:3px;font-weight:500}
  .slot.booked .nm{display:block;font-size:15px;font-weight:700;line-height:1.25;margin-bottom:5px}
  .slot.booked .loc{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;background:#eef1f4;color:#4b535c;border-radius:4px;padding:3px 7px;margin-bottom:5px}
  .slot.booked .loc.travel{background:#e9e2f7;color:#5b3fa0}
  .slot.booked .dt{display:block;font-size:12.5px;font-weight:500;color:#4b535c;line-height:1.4}
  .slot.booked .who{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-top:3px}
  .day .dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
  .day .dots i{width:3.5px;height:3.5px;border-radius:50%;display:block}
  .day.sel .dots i{background:#fff!important}
  .slot.booked.shoot{border-left:4px solid var(--red);background:var(--redtint)}
  .slot.booked.hold{border-left:4px solid #9aa3ad}
  .slot.booked.tent{border-left:4px solid var(--amber);background:var(--ambertint)}
  .slot.booked.done{border-left:4px solid var(--green);background:var(--greentint)}
  .slot.booked.guest{border-left:4px solid var(--blue);background:var(--bluetint)}
  button.slot.free{width:100%;cursor:pointer;font-family:inherit}
  button.slot.free:hover{background:var(--bluetint)}
  .empty{color:var(--mute);font-size:14px;padding:8px 0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--mute);font-family:var(--mono)}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.6}
  /* booking dialog */
  .dlgwrap{position:fixed;inset:0;background:rgba(20,24,28,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .dlgwrap.open{display:flex}
  .dlg{background:#fff;border-radius:14px;padding:24px 26px 20px;width:100%;max-width:430px;box-shadow:0 24px 60px rgba(0,0,0,.24)}
  .dlg h2{font-size:19px;font-weight:700;margin:0 0 3px}
  .dlg-when{font-size:13px;color:var(--mute);margin-bottom:16px}
  .dlg label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px}
  .dlg label .req{font-weight:500;color:var(--mute)}
  .dlg input,.dlg select{width:100%;font-family:inherit;font-size:15px;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  .dlg input:focus,.dlg select:focus{outline:none;border-color:var(--blue)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dlg-err{color:#c02b2b;font-size:12.5px;min-height:18px;margin-top:10px}
  .dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:7px;cursor:pointer;border:1.5px solid transparent}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{background:#f5f7f9}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:hover{filter:brightness(.94)}
</style>
</head>
<body>
<div class="page">
  <h1>Select a Date &amp; Time</h1>
  <div class="cols">
    <div>
      <div class="mhead">
        <button id="prev" aria-label="Previous month">‹</button>
        <span class="mtitle" id="mtitle"></span>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <table class="cal"><thead><tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
      </tr></thead><tbody id="cal"></tbody></table>
      <div class="tz">
        <span class="lbl">Time zone</span>
        🌐 Pacific Time — US &amp; Canada
        <a class="dblink" href="https://docs.google.com/spreadsheets/d/1K0zPInMC3SgQakJCjt1289Loxbtsv_xke-AFiYAKDHQ/edit" target="_blank" rel="noopener" title="Schedule database">xls</a>
      </div>
      <div class="legend">
        <span><i style="background:var(--red)"></i>Shoot</span>
        <span><i style="background:var(--amber)"></i>Tentative</span>
        <span><i style="background:#9aa3ad"></i>Hold / busy</span>
        <span><i style="background:var(--green)"></i>Confirmed by them</span>
      </div>
    </div>
    <div>
      <div class="selday" id="selday"></div>
      <div class="slots" id="slots"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="foot" id="syncnote" style="border:0;padding-top:4px;margin-top:0">…</div>
</div>

<div class="dlgwrap" id="bookdlg">
  <div class="dlg">
    <h2>Add a shoot</h2>
    <div class="dlg-when" id="bk-when"></div>

    <label>Who are you filming?</label>
    <input id="bk-name" placeholder="e.g. Dr. Justin Chi" autocomplete="off">

    <div class="row2">
      <div>
        <label>Start</label>
        <select id="bk-start"></select>
      </div>
      <div>
        <label>How long?</label>
        <select id="bk-dur">
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
          <option value="90" selected>1½ hours</option>
          <option value="120">2 hours</option>
          <option value="180">3 hours</option>
          <option value="480">All day</option>
        </select>
      </div>
    </div>

    <label>Where?</label>
    <input id="bk-where" list="wherelist" placeholder="Studio 130" autocomplete="off">
    <datalist id="wherelist">
      <option>Studio 130</option><option>Campus</option><option>Irvine</option>
      <option>TRAVEL — Raleigh, NC</option><option>TRAVEL — Provo, UT</option><option>Off-site</option>
    </datalist>

    <label>Your name <span class="req">— required to publish</span></label>
    <input id="bk-by" placeholder="e.g. Eldar" autocomplete="off">

    <div class="dlg-err" id="bk-err"></div>
    <div class="dlg-actions">
      <button class="btn ghost" id="bk-cancel">Cancel</button>
      <button class="btn primary" id="bk-ok">Publish slot</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SHOOT SLOTS — filled from our conversations (chat), not on-site.
   type: shoot | tent | hold | done      time: 24h "HH:MM"
   ============================================================ */
const SLOTS = [
  {d:'2026-07-31', s:'09:00', e:'11:00', t:'shoot', nm:'Neil Park', loc:'Campus — his talk', w:'Reportage: walk-out + the talk', by:'confirmed'},

  {d:'2026-08-06', s:'09:00', e:'10:00', t:'hold',  nm:'Group scene', loc:'Symposium floor', w:'Patel & Resnik both in it — no interviews now', by:'crew'},
  {d:'2026-08-06', s:'10:15', e:'11:45', t:'done',  nm:'Paresh Patel', loc:'Studio 130', w:'Right after his 9:15 “Guided by Design” talk', by:'CONFIRMED ✓ “see you right after my presentation”'},
  {d:'2026-08-06', s:'17:00', e:'19:00', t:'hold',  nm:'Dinner — Mesa Manor', loc:'Off-site', w:'Evening blocked', by:''},

  {d:'2026-08-27', s:'09:00', e:'17:00', t:'done',  nm:'Howard Farran', loc:'Campus — Summer IOX', w:'Interview + b-roll at the event', by:'CONFIRMED ✓ “I can’t wait!”'},
  {d:'2026-08-28', s:'10:00', e:'12:00', t:'done',  nm:'Howard Farran — interview', loc:'Campus — Summer IOX day 2', w:'Sit-down, 2 hours', by:'CONFIRMED ✓ Fri 10am–12pm'},

  {d:'2026-09-19', s:'09:00', e:'12:00', t:'shoot', nm:'Tim Kosinski', loc:'TRAVEL — Raleigh, NC', w:'Ivan runs the shoot on location; Eldar directs by video link', by:'proposed — awaiting Jessica via Eldon'},
  {d:'2026-09-19', s:'13:00', e:'17:00', t:'tent',  nm:'Paresh Patel — b-roll', loc:'TRAVEL — his clinic, Raleigh area', w:'Same trip, same day as Kosinski', by:'raise with Patel in person Aug 6'},

  {d:'2026-10-04', s:'12:00', e:'17:00', t:'hold',  nm:'Fly to Provo + scout', loc:'TRAVEL — Provo, UT', w:'Walk the facilities with Rella, plan the shots', by:'her advice: arrive a day early'},
  {d:'2026-10-06', s:'09:00', e:'17:00', t:'done',  nm:'Rella Christensen', loc:'TRAVEL — her lab, Provo, UT', w:'~90 min interview + 1–2 h b-roll', by:'CONFIRMED ✓ week of Oct 5'},
  {d:'2026-10-07', s:'09:00', e:'17:00', t:'done',  nm:'Rella Christensen (day 2)', loc:'TRAVEL — her lab, Provo, UT', w:'', by:'CONFIRMED ✓ week of Oct 5'},
  {d:'2026-10-09', s:'09:00', e:'17:00', t:'hold',  nm:'Symposium', loc:'Campus', w:'Back from Utah for it', by:''},
  {d:'2026-10-10', s:'09:00', e:'17:00', t:'hold',  nm:'Symposium (day 2)', loc:'Campus', w:'', by:''},
  {d:'2026-10-15', s:'09:00', e:'17:00', t:'hold',  nm:'DOTR graduation', loc:'Irvine', w:'Cohort + alumni on stage', by:''},
  {d:'2026-10-16', s:'09:00', e:'17:00', t:'hold',  nm:'DOTR graduation (day 2)', loc:'Irvine', w:'', by:''}
];

/* free weekdays we offered (Mon–Thu) — shown as bookable when nothing is on them */
const OPEN_HOURS=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
function isOpenDay(dt){return true;}                 // any day can take a booking
function isWeekday(dt){const w=dt.getDay();return w>=1&&w<=5;}

/* ---- guest bookings: stored in the same Google Sheet (via the survey Apps Script) ---- */
const ENDPOINT="https://script.google.com/macros/s/AKfycby3qKlPjAHdiTQEPBFtunNB2b_BDYf_dwzTpSKAy1pB6A302qxqKsJFZQk1Q--peCqw/exec";
const LKEY='gw_sched_guest';
/* Sheets returns dates/times as full Date strings — normalise to YYYY-MM-DD / HH:MM */
function asDate(v){const s=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);return isNaN(d)?s:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function asTime(v){const s=String(v||'');const m=s.match(/(\d{1,2}):(\d{2})/);
  if(m)return ('0'+m[1]).slice(-2)+':'+m[2];const d=new Date(s);
  return isNaN(d)?s:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function normalise(list){
  const seen={},out=[];
  (list||[]).forEach(x=>{const o={...x,d:asDate(x.d),s:asTime(x.s),e:asTime(x.e)};
    const k=o.d+o.s+(o.nm||'');if(seen[k])return;seen[k]=1;out.push(o);});
  return out;
}
let guest=[]; try{guest=normalise(JSON.parse(localStorage.getItem(LKEY)||'[]'));}catch(e){}
function gsave(){try{localStorage.setItem(LKEY,JSON.stringify(guest));}catch(e){}}
gsave();
function setNote(msg,warn){const el=document.getElementById('syncnote');if(el){el.textContent=msg;el.style.color=warn?'#B4670F':'var(--mute)';}}
function pushBooking(s){
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({type:'slot',action:'add',slot:s})})
   .then(()=>setNote('Saved to the shared sheet.'))
   .catch(()=>setNote('Saved on this device (offline).',true));
}
function pullBookings(){
  fetch(ENDPOINT+'?type=slots')
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{
      if(!d||!Array.isArray(d.slots)){setNote('Guest bookings save locally — sheet not wired for slots yet.',true);return;}
      const incoming=d.slots.map(x=>({d:x.d,s:x.s,e:x.e,t:'guest',nm:x.nm||x.w||'Booked',loc:x.loc||'',w:x.w||'',by:x.by||''}));
      guest=normalise(guest.concat(incoming));
      gsave();renderMonth();renderSlots();setNote('Shared — everyone sees these bookings.');
    })
    .catch(()=>setNote('Guest bookings save locally — sheet not wired for slots yet.',true));
}
function bookSlot(date,hour){
  const dlg=document.getElementById('bookdlg');
  const dt=parse(date);
  document.getElementById('bk-when').textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  // start-time options in 12h, every 30 min, 7am–8pm
  const startSel=document.getElementById('bk-start'); startSel.innerHTML='';
  for(let h=7;h<=20;h++) for(const m of ['00','30']){
    const v=('0'+h).slice(-2)+':'+m;
    startSel.insertAdjacentHTML('beforeend','<option value="'+v+'"'+(v===hour?' selected':'')+'>'+ampm(v)+'</option>');
  }
  document.getElementById('bk-name').value='';
  document.getElementById('bk-where').value='Studio 130';
  document.getElementById('bk-by').value=localStorage.getItem('gw_me')||'';
  document.getElementById('bk-dur').value='90';
  document.getElementById('bk-err').textContent='';
  dlg.dataset.date=date; dlg.classList.add('open');
  setTimeout(()=>document.getElementById('bk-name').focus(),40);
}
function closeBook(){document.getElementById('bookdlg').classList.remove('open');}
function submitBook(){
  const dlg=document.getElementById('bookdlg'), err=document.getElementById('bk-err');
  const nm=document.getElementById('bk-name').value.trim();
  const where=document.getElementById('bk-where').value.trim();
  const by=document.getElementById('bk-by').value.trim();
  const start=document.getElementById('bk-start').value;
  const dur=+document.getElementById('bk-dur').value;
  if(!nm){err.textContent='Who are you filming?';return;}
  if(!by){err.textContent='Your name is required to publish.';return;}
  localStorage.setItem('gw_me',by);
  const startMin=+start.slice(0,2)*60 + +start.slice(3);
  const endMin=Math.min(startMin+dur, 21*60);
  const e=('0'+Math.floor(endMin/60)).slice(-2)+':'+('0'+(endMin%60)).slice(-2);
  const slot={d:dlg.dataset.date,s:start,e:e,t:'guest',nm:nm,loc:where,w:'',by:by};
  guest.push(slot);gsave();closeBook();renderMonth();renderSlots();pushBooking(slot);
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let view=new Date(2026,7,1), sel=null;

function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function parse(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function ampm(t){let[h,m]=t.split(':').map(Number);const s=h<12?'am':'pm';h=h%12||12;return h+(m?':'+('0'+m).slice(-2):'')+s;}
function slotsFor(d){return SLOTS.concat(guest).filter(x=>x.d===d).sort((a,b)=>a.s<b.s?-1:1);}

function renderMonth(){
  document.getElementById('mtitle').textContent=MONTHS[view.getMonth()]+' '+view.getFullYear();
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const todayIso=iso(new Date());
  let h='',cell=0,row='';
  for(let i=0;i<first.getDay();i++){row+='<td></td>';cell++;}
  for(let dnum=1;dnum<=days;dnum++){
    const dt=new Date(view.getFullYear(),view.getMonth(),dnum), di=iso(dt);
    const dayslots=slotsFor(di);
    const booked=dayslots.length>0;
    const has=booked||isWeekday(dt);              // blue = booked or a working day
    const cls='day'+(has?' has':' open')+(sel===di?' sel':'')+(di===todayIso?' today':'');
    const COL={shoot:'#E11B2A',tent:'#B4670F',hold:'#9aa3ad',done:'#12805c'};
    const dots=booked?'<span class="dots">'+dayslots.slice(0,3).map(x=>'<i style="background:'+(COL[x.t]||'#9aa3ad')+'"></i>').join('')+'</span>':'';
    row+='<td><button class="'+cls+'" data-d="'+di+'">'+dnum+dots+'</button></td>';
    cell++;
    if(cell%7===0){h+='<tr>'+row+'</tr>';row='';}
  }
  if(row){while(cell%7!==0){row+='<td></td>';cell++;}h+='<tr>'+row+'</tr>';}
  document.getElementById('cal').innerHTML=h;
}

function renderSlots(){
  const wrap=document.getElementById('slots'), head=document.getElementById('selday');
  if(!sel){head.textContent='';wrap.innerHTML='<div class="empty">Pick a date to see the day.</div>';return;}
  const dt=parse(sel);
  head.textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const list=slotsFor(sel);
  const mins=t=>+t.slice(0,2)*60 + +t.slice(3);
  const taken={};
  list.forEach(x=>{const a=mins(x.s),b=mins(x.e);
    for(let h=0;h<24;h++){ if(h*60+60>a && h*60<b) taken[h]=1; }});
  // merge booked + free hours into ONE chronological list
  const rows=list.map(x=>({k:'b',min:+x.s.slice(0,2)*60+ +x.s.slice(3),x:x}));
  if(isOpenDay(dt)) OPEN_HOURS.filter(t=>!taken[+t.slice(0,2)])
    .forEach(t=>rows.push({k:'f',min:+t.slice(0,2)*60,t:t}));
  rows.sort((a,b)=>a.min-b.min);
  wrap.innerHTML=rows.map(r=>{
    if(r.k==='f') return '<button class="slot free" data-book="'+r.t+'">'+ampm(r.t)+'</button>';
    const x=r.x, travel=/TRAVEL|Off-site/i.test(x.loc||'');
    return '<div class="slot booked '+x.t+'">'
      +'<span class="tm">'+ampm(x.s)+' – '+ampm(x.e)+'</span>'
      +'<span class="nm">'+esc(x.nm||x.w)+'</span>'
      +(x.loc?'<span class="loc'+(travel?' travel':'')+'">'+(travel?'✈ ':'📍 ')+esc(x.loc)+'</span>':'')
      +(x.w?'<span class="dt">'+esc(x.w)+'</span>':'')
      +(x.by?'<span class="who">'+(x.t==='guest'?'added by '+esc(x.by):esc(x.by))+'</span>':'')
      +'</div>';}).join('');
}

document.getElementById('cal').addEventListener('click',e=>{
  const b=e.target.closest('[data-d]');if(!b)return;sel=b.dataset.d;renderMonth();renderSlots();
});
document.getElementById('slots').addEventListener('click',e=>{
  const b=e.target.closest('[data-book]');if(!b||!sel)return;bookSlot(sel,b.dataset.book);
});
document.getElementById('bk-cancel').onclick=closeBook;
document.getElementById('bk-ok').onclick=submitBook;
document.getElementById('bookdlg').addEventListener('click',e=>{if(e.target.id==='bookdlg')closeBook();});
document.addEventListener('keydown',e=>{
  const open=document.getElementById('bookdlg').classList.contains('open');
  if(!open)return;
  if(e.key==='Escape')closeBook();
  if(e.key==='Enter'&&e.target.tagName!=='SELECT')submitBook();
});
document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderMonth();};
document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderMonth();};

document.getElementById('foot').textContent='Booked days are highlighted; click one to see its hours. Open weekdays (Mon–Thu) show free hours we can still offer. Slots come from our email threads — as new times get confirmed, they land here.';

sel='2026-08-06';
renderMonth();renderSlots();
pullBookings();
setInterval(pullBookings,60000);
</script>
</body>
</html>
